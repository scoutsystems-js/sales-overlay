<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scout AI — Scout Systems</title>
  <link rel="icon" type="image/svg+xml" href="/scout-glyph.svg">
  <style>
    :root { --bg:#07130d; --panel:rgba(8,25,16,.88); --edge:rgba(134,207,161,.28); --text:#eef8f0; --muted:#a6bbad; --accent:#39e97b; --danger:#ff9b9b; }
    * { box-sizing:border-box; } body { margin:0; min-height:100vh; color:var(--text); background:radial-gradient(circle at 20% 0%,rgba(21,109,57,.25),transparent 34rem),var(--bg); font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    header { height:64px; display:flex; align-items:center; justify-content:space-between; padding:0 32px; border-bottom:1px solid var(--edge); background:rgba(3,12,7,.78); } .wordmark { width:178px; height:auto; } .back { color:var(--muted); text-decoration:none; font-size:14px; } .back:hover { color:var(--text); }
    main { width:min(940px,calc(100% - 32px)); margin:72px auto; } .eyebrow { color:var(--accent); font-size:12px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; } h1 { margin:10px 0 10px; font-size:clamp(34px,6vw,58px); letter-spacing:-.045em; } .intro { max-width:620px; color:var(--muted); font-size:17px; line-height:1.6; }
    .ask { margin-top:34px; padding:20px; border:1px solid var(--edge); border-radius:18px; background:var(--panel); box-shadow:0 16px 55px rgba(0,0,0,.22); } textarea { width:100%; min-height:110px; resize:vertical; border:0; outline:0; color:var(--text); background:transparent; font:inherit; font-size:17px; line-height:1.55; } textarea::placeholder { color:#769081; } .ask-footer { display:flex; justify-content:space-between; align-items:center; gap:14px; border-top:1px solid rgba(134,207,161,.16); padding-top:14px; } .range { color:var(--muted); font-size:13px; } button { border:0; border-radius:9px; background:var(--accent); color:#052010; padding:10px 17px; font:700 14px inherit; cursor:pointer; } button:hover { filter:brightness(1.08); } button:disabled { opacity:.55; cursor:wait; }
    #result { margin-top:28px; display:grid; gap:18px; } .answer, .notice { border:1px solid var(--edge); border-radius:18px; padding:25px; background:var(--panel); } .answer h2 { margin:0 0 12px; font-size:13px; color:var(--accent); text-transform:uppercase; letter-spacing:.14em; } .answer-text { white-space:pre-wrap; font-size:18px; line-height:1.62; } .notice { color:var(--muted); } .notice.error { color:var(--danger); border-color:rgba(255,155,155,.34); } .loading-message { display:flex; align-items:center; gap:10px; padding:16px 20px; } .loading-pulse { color:var(--accent); animation:scoutPulse 1.15s ease-in-out infinite; } @keyframes scoutPulse { 50% { opacity:.3; } } .question { justify-self:end; max-width:min(80%,680px); padding:14px 18px; border-radius:16px 16px 3px 16px; background:rgba(57,233,123,.14); border:1px solid rgba(57,233,123,.35); line-height:1.5; } .answer-group { display:grid; gap:0; } .answer-group .evidence-title { margin:22px 0 12px; } #askForm { margin-top:26px; }
    .evidence-title { margin:34px 0 12px; color:var(--muted); font-size:13px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; } .metrics { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; } .metric, .example, .comparison-pattern { border:1px solid var(--edge); border-radius:14px; background:rgba(5,21,12,.8); padding:18px; } .metric-link { display:block; color:inherit; text-decoration:none; transition:border-color .15s ease, transform .15s ease; } .metric-link:hover { border-color:var(--accent); transform:translateY(-1px); } .metric .label, .comparison-pattern h3 { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.1em; } .metric strong { display:block; margin-top:7px; font-size:24px; } .metric-detail { margin-top:7px; color:var(--muted); font-size:13px; } .comparison-pattern { margin-top:12px; } .comparison-pattern h3 { margin:0 0 8px; } .comparison-pattern p { margin:0; line-height:1.55; } .examples { display:grid; gap:12px; } .example-top { display:flex; justify-content:space-between; gap:12px; color:var(--muted); font-size:13px; } .example h3 { margin:8px 0; font-size:17px; } blockquote { margin:12px 0; padding-left:14px; border-left:3px solid var(--accent); color:#dbeadf; line-height:1.5; } .exchange-line { margin:10px 0; padding-left:14px; border-left:2px solid rgba(57,233,123,.56); color:#dbeadf; line-height:1.5; } .exchange-label { display:block; margin-bottom:3px; color:var(--muted); font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; } .actions { display:flex; gap:16px; flex-wrap:wrap; margin-top:14px; } .actions a { color:var(--accent); text-decoration:none; font-weight:700; font-size:14px; } .priority-actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:16px; } .priority-action { background:rgba(57,233,123,.12); color:var(--text); border:1px solid rgba(57,233,123,.45); text-align:left; }
    .hidden { display:none; } @media (max-width:620px) { header { padding:0 16px; } main { margin:42px auto; } .metrics { grid-template-columns:1fr; } .ask-footer { align-items:flex-start; flex-direction:column; } .wordmark { width:145px; } }
  </style>
</head>
<body>
  <header><img class="wordmark" src="/scout-wordmark.svg" alt="Scout Systems"><a class="back" href="/dashboard">Back to Scout</a></header>
  <main>
    <div class="eyebrow">Scout AI</div>
    <h1>Scout AI</h1>
    <p class="intro">Ask about calls, objections, outcomes, and coaching evidence. Scout only answers from saved Scout data and shows the calls behind its answer.</p>
    <section id="result" aria-live="polite"></section>
    <form class="ask" id="askForm">
      <textarea id="question" aria-label="Ask Scout AI" maxlength="1500" placeholder="Ask Scout… for example: What is Josh’s close rate when a spouse objection comes up?"></textarea>
      <div class="ask-footer"><span class="range">Default range: last 30 days</span><button id="askButton" type="submit">Ask Scout</button></div>
    </form>
  </main>
  <script>
    (function () {
      var STORAGE_KEY = 'scout_session_v1';
      function session() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null'); } catch (_) { return null; } }
      function headers() { var value = session(); return value && value.access_token ? { 'Authorization':'Bearer ' + value.access_token, 'Content-Type':'application/json' } : {}; }
      function escapeHtml(value) { return String(value == null ? '' : value).replace(/[&<>"']/g, function (char) { return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[char]; }); }
      function formatDate(value) { if (!value) return 'Date not recorded'; var date = new Date(value); return isNaN(date) ? 'Date not recorded' : date.toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' }); }
      function clipUrl(example) { if (!example.recording_url || example.timestamp_seconds == null) return null; return example.recording_url + (example.recording_url.indexOf('?') === -1 ? '?' : '&') + 't=' + encodeURIComponent(example.timestamp_seconds); }
      function exampleCard(example) { var clip = clipUrl(example); return '<article class="example"><div class="example-top"><span>' + escapeHtml(formatDate(example.call_date)) + '</span><span>' + escapeHtml(example.objection_category || 'Objection') + '</span></div><h3>' + escapeHtml(example.prospect_name || 'Prospect name not recorded') + '</h3><blockquote>' + escapeHtml(example.quote || example.objection_surface || 'Saved objection moment') + '</blockquote><div class="actions"><a href="/dashboard#call/' + encodeURIComponent(example.call_id) + '">Open call review →</a>' + (clip ? '<a href="' + escapeHtml(clip) + '" target="_blank" rel="noopener">Watch clip →</a>' : '') + '</div></article>'; }
      function stageExampleCard(example) { var clip = clipUrl(example); var lines = (example.exchange || []).map(function (line) { return '<div class="exchange-line"><span class="exchange-label">' + escapeHtml(line.label || line.speaker || 'Saved call exchange') + '</span>' + escapeHtml(line.quote || '') + '</div>'; }).join(''); return '<article class="example"><div class="example-top"><span>' + escapeHtml(formatDate(example.call_date)) + '</span><span>' + escapeHtml(example.closer_name || 'Closer') + '</span></div><h3>' + escapeHtml(example.prospect_name || 'Prospect name not recorded') + '</h3>' + lines + '<div class="actions"><a href="/dashboard#call/' + encodeURIComponent(example.call_id) + '">Open call review →</a>' + (clip ? '<a href="' + escapeHtml(clip) + '" target="_blank" rel="noopener">Watch clip →</a>' : '') + '</div></article>'; }
      function outcomeLabel(value) { return ({ closed:'Closed', follow_up:'Open', lost:'Lost', no_show:'No-show', disqualified:'DQ' })[value] || 'Outcome not recorded'; }
      function callExampleCard(call) { var objection = call.objection || {}; var outcomeEvidence = call.outcome_evidence || null; var objectionClip = clipUrl({ recording_url:call.recording_url, timestamp_seconds:objection.timestamp_seconds }); var outcomeClip = outcomeEvidence ? clipUrl({ recording_url:call.recording_url, timestamp_seconds:outcomeEvidence.timestamp_seconds }) : null; var objectionQuote = objection.quote ? '<div class="exchange-label">Prospect concern</div><blockquote>' + escapeHtml(objection.quote) + '</blockquote>' : ''; var response = objection.closer_response ? '<div class="exchange-label">Closer response</div><blockquote>' + escapeHtml(objection.closer_response) + '</blockquote>' : ''; var outcomeContext = outcomeEvidence ? '<div class="exchange-label">' + escapeHtml(outcomeEvidence.label || 'What kept it open') + '</div><p>' + escapeHtml(outcomeEvidence.reason) + '</p>' + (outcomeEvidence.quote ? '<blockquote>' + escapeHtml(outcomeEvidence.quote) + '</blockquote>' : '') : ''; var tag = objection.category ? String(objection.category).charAt(0).toUpperCase() + String(objection.category).slice(1) + ' · ' + (objection.resolution || 'documented') : outcomeLabel(call.outcome); var closer = call.closer_name ? '<div class="exchange-label">Closer · ' + escapeHtml(call.closer_name) + '</div>' : ''; return '<article class="example"><div class="example-top"><span>' + escapeHtml(formatDate(call.call_date)) + '</span><span>' + escapeHtml(tag) + '</span></div><h3>' + escapeHtml(call.prospect_name || 'Prospect name not recorded') + '</h3>' + closer + outcomeContext + objectionQuote + response + '<div class="actions"><a href="/dashboard#call/' + encodeURIComponent(call.call_id) + '">Open call review →</a>' + (outcomeClip ? '<a href="' + escapeHtml(outcomeClip) + '" target="_blank" rel="noopener">Watch outcome moment →</a>' : '') + (objectionClip ? '<a href="' + escapeHtml(objectionClip) + '" target="_blank" rel="noopener">Watch clip →</a>' : '') + '</div></article>'; }
      function metric(label, value) { if (!value || value.rate == null) return ''; var category = value.category ? String(value.category).charAt(0).toUpperCase() + String(value.category).slice(1) + ' · ' : ''; return '<article class="metric"><div class="label">' + escapeHtml(label) + '</div><strong>' + escapeHtml(category + (value.handled != null ? value.handled + ' of ' + value.total : value.closed + ' of ' + value.total) + ' (' + value.rate + '%)') + '</strong></article>'; }
      function leaderboardMetric(leader, category) { if (!leader || leader.rate == null) return ''; var label = String(category || 'Objection').charAt(0).toUpperCase() + String(category || 'objection').slice(1) + ' handling'; return '<article class="metric"><div class="label">' + escapeHtml(label) + '</div><strong>' + escapeHtml((leader.name || 'Closer name not recorded') + ' · ' + leader.handled + ' of ' + leader.total + ' (' + leader.rate + '%)') + '</strong></article>'; }
      function closeRateMetric(value) { if (!value || value.pct == null) return ''; return '<article class="metric"><div class="label">Overall close rate</div><strong>' + escapeHtml(value.closed + ' of ' + value.total + ' (' + value.pct + '%)') + '</strong></article>'; }
      function stageMetric(closer, stage) { if (!closer || closer.score == null) return ''; return '<article class="metric"><div class="label">' + escapeHtml((closer.name || 'Closer') + ' · ' + (stage || 'Stage')) + '</div><strong>' + escapeHtml(closer.score + ' / 100 · ' + closer.graded_calls + ' graded calls') + '</strong></article>'; }
      function objectionPageUrl(item, window) { if (!item || item.stage !== 'objection' || !item.user_id || !window || !window.from || !window.to) return null; return '/dashboard?user=' + encodeURIComponent(item.user_id) + '#objections?from=' + encodeURIComponent(window.from) + '&to=' + encodeURIComponent(window.to); }
      function coachingPriorityMetric(priority, window) { var ties = priority && Array.isArray(priority.ties) ? priority.ties : []; return ties.map(function (item) { var content = '<div class="label">Coaching priority</div><strong>' + escapeHtml((item.name || 'Closer') + ' · ' + (item.label || item.stage || 'Stage')) + '</strong><div class="metric-detail">' + escapeHtml(item.score + ' / 100 · ' + item.graded_calls + ' graded calls') + '</div>'; var url = objectionPageUrl(item, window); return url ? '<a class="metric metric-link" href="' + escapeHtml(url) + '">' + content + '</a>' : '<article class="metric">' + content + '</article>'; }).join(''); }
      function coachingPattern(label, text) { return text ? '<article class="comparison-pattern"><h3>' + escapeHtml(label) + '</h3><p>' + escapeHtml(text) + '</p></article>' : ''; }
      function diagnosisObjectionUrl(evidence) { var closer = evidence && evidence.closer; var window = evidence && evidence.window; if (!closer || !closer.user_id || !window || !window.from || !window.to) return null; return '/dashboard?user=' + encodeURIComponent(closer.user_id) + '#objections?from=' + encodeURIComponent(window.from) + '&to=' + encodeURIComponent(window.to); }
      function diagnosisMetrics(evidence) { var closeRate = evidence.close_rate || {}; var focus = evidence.coaching_focus || null; var close = closeRate.pct == null ? '' : '<article class="metric"><div class="label">Lowest close rate</div><strong>' + escapeHtml(closeRate.closed + ' of ' + closeRate.total + ' (' + closeRate.pct + '%)') + '</strong></article>'; var gap = !focus ? '' : '<article class="metric"><div class="label">Strongest repeated coaching gap</div><strong>' + escapeHtml(String(focus.category).charAt(0).toUpperCase() + String(focus.category).slice(1) + ' · ' + focus.handled + ' of ' + focus.total + ' (' + focus.rate + '%)') + '</strong></article>'; return close + gap; }
      function diagnosisCalls(evidence) { var missed = evidence.missed_calls || []; var handled = evidence.handled_calls || []; var link = diagnosisObjectionUrl(evidence); var actions = link ? '<div class="actions"><a href="' + escapeHtml(link) + '" target="_blank" rel="noopener">Open objection drilldown →</a></div>' : ''; return (missed.length ? '<div class="evidence-title">Calls to review</div><div class="examples">' + missed.map(callExampleCard).join('') + '</div>' : '') + (handled.length ? '<div class="evidence-title">A handled example</div><div class="examples">' + handled.map(callExampleCard).join('') + '</div>' : '') + actions; }
      var conversation = []; var pendingFollowUp = null; var actionChoices = []; var pendingQuestionLabel = null;
      function renderFollowUpChoices(context) { var choices = context && context.type === 'stage_choices' && Array.isArray(context.actions) ? context.actions : []; if (!choices.length) return; actionChoices = choices; var buttons = choices.map(function (action, index) { return '<button class="priority-action" type="button" data-stage-action="' + index + '">Review ' + escapeHtml(action.label || action.stage || 'this area') + '</button>'; }).join(''); document.getElementById('result').insertAdjacentHTML('beforeend', '<div class="priority-actions" aria-label="Choose a coaching area">' + buttons + '</div>'); }
      function render(data) { var root = document.getElementById('result'); if (data.status !== 'answered') { root.insertAdjacentHTML('beforeend', '<div class="notice">' + escapeHtml(data.answer || 'Scout does not have enough verified data to answer that yet.') + '</div>'); return; } var evidence = data.evidence || {}; var examples = (evidence.handled_examples || []).concat(evidence.not_handled_examples || []); var stageExamples = evidence.kind === 'stage_examples' || evidence.kind === 'stage_drilldown' ? (evidence.examples || []) : []; var callExamples = evidence.kind === 'call_examples' ? (evidence.calls || []) : []; var isDiagnosis = evidence.kind === 'performance_coaching_diagnosis'; var isComparison = evidence.kind === 'objection_coaching_comparison'; var isDrilldown = evidence.kind === 'objection_drilldown'; var isStageDrilldown = evidence.kind === 'stage_drilldown'; var drilldownComparison = isDrilldown ? (evidence.comparison || {}) : {}; var drilldownCategories = isDrilldown ? Object.keys(evidence.categories || {}).map(function (key) { return evidence.categories[key]; }) : []; var metrics = isDiagnosis ? diagnosisMetrics(evidence) : evidence.kind === 'team_objection_overview' ? metric('Most raised objection', evidence.most_raised) + metric('Least-handled objection', evidence.least_handled) : evidence.kind === 'team_objection_leaderboard' ? (evidence.leaders || []).slice(0, 3).map(function (leader) { return leaderboardMetric(leader, evidence.category); }).join('') : evidence.kind === 'closer_close_rate' ? closeRateMetric(evidence.close_rate) : isComparison ? metric('Documented handling', evidence.handle_rate) : isDrilldown ? drilldownCategories.filter(function (item) { return item.total; }).map(function (item) { return metric(item.category, item); }).join('') : isStageDrilldown ? '<article class="metric"><div class="label">' + escapeHtml(evidence.stage || 'Stage') + '</div><strong>' + escapeHtml((evidence.score == null ? 'Not scored' : evidence.score + ' / 100') + ' · ' + (evidence.graded_calls || 0) + ' graded calls') + '</strong></article>' : evidence.kind === 'stage_performance' && evidence.priority ? coachingPriorityMetric(evidence.priority, evidence.window) : evidence.kind === 'stage_performance' ? (evidence.closers || []).slice(0, 8).map(function (closer) { return stageMetric(closer, evidence.stage); }).join('') : ''; var patterns = isComparison ? coachingPattern('When it works', evidence.when_handled) + coachingPattern('When it is not handled', evidence.when_not_handled) : isDrilldown ? coachingPattern('When it works', drilldownComparison.when_handled) + coachingPattern('When it is not handled', drilldownComparison.when_not_handled) : ''; var calls = isDiagnosis ? diagnosisCalls(evidence) : evidence.kind === 'call_examples' ? (callExamples.length ? '<div class="examples">' + callExamples.map(callExampleCard).join('') + '</div>' : '') : isComparison ? ((evidence.handled_examples || []).length ? '<div class="evidence-title">Handled calls</div><div class="examples">' + evidence.handled_examples.map(exampleCard).join('') + '</div>' : '') + ((evidence.not_handled_examples || []).length ? '<div class="evidence-title">Not-handled calls</div><div class="examples">' + evidence.not_handled_examples.map(exampleCard).join('') + '</div>' : '') : isDrilldown ? ((drilldownComparison.handled_examples || []).length ? '<div class="evidence-title">Handled calls</div><div class="examples">' + drilldownComparison.handled_examples.map(exampleCard).join('') + '</div>' : '') + ((drilldownComparison.not_handled_examples || []).length ? '<div class="evidence-title">Not-handled calls</div><div class="examples">' + drilldownComparison.not_handled_examples.map(exampleCard).join('') + '</div>' : '') : (examples.length ? '<div class="evidence-title">Supporting calls</div><div class="examples">' + examples.map(exampleCard).join('') + '</div>' : ''); var heading = isDiagnosis ? 'Performance and coaching focus' : evidence.kind === 'call_examples' ? 'Matching calls' : evidence.kind === 'team_objection_leaderboard' ? 'Best documented handlers' : evidence.kind === 'closer_close_rate' ? 'Overall close rate' : isComparison ? 'Coaching comparison' : isDrilldown ? 'Objection breakdown' : isStageDrilldown ? 'Saved stage evidence' : evidence.kind === 'stage_performance' && evidence.priority ? 'Coaching priority' : evidence.kind === 'stage_performance' ? 'Earned stage scores' : evidence.kind === 'stage_examples' ? 'Saved call exchange' : 'Evidence from Scout'; root.insertAdjacentHTML('beforeend', '<div class="answer-group"><article class="answer"><h2>Scout’s answer</h2><div class="answer-text">' + escapeHtml(data.answer) + '</div></article><div class="evidence-title">' + heading + '</div>' + (metrics ? '<div class="metrics">' + metrics + '</div>' : '') + patterns + (stageExamples.length ? '<div class="examples">' + stageExamples.map(stageExampleCard).join('') + '</div>' : '') + calls + '</div>'); }
      async function checkAccess() { var token = headers(); if (!token.Authorization) { window.location.replace('/login'); return; } var response = await fetch('/auth/me', { headers: token }); if (!response.ok) { window.location.replace('/login'); return; } var me = await response.json(); if (!['manager', 'owner'].includes(me.role)) window.location.replace('/dashboard'); }
      document.getElementById('askForm').addEventListener('submit', async function (event) { event.preventDefault(); var question = document.getElementById('question').value.trim(); var root = document.getElementById('result'); var button = document.getElementById('askButton'); if (!question) { root.insertAdjacentHTML('beforeend', '<div class="notice error">Ask Scout a question first.</div>'); return; } var displayQuestion = pendingQuestionLabel || question; pendingQuestionLabel = null; var priorQuestions = conversation.slice(-8); var loadingId = 'loading-' + Date.now(); root.insertAdjacentHTML('beforeend', '<div class="question">' + escapeHtml(displayQuestion) + '</div><div id="' + loadingId + '" class="notice loading-message"><span class="loading-pulse" aria-hidden="true">●</span>Scout is checking saved evidence…</div>'); document.getElementById('question').value = ''; button.disabled = true; button.textContent = 'Looking…'; try { var response = await fetch('/scout-ai/ask', { method:'POST', headers:headers(), body:JSON.stringify({ question:question, prior_questions:priorQuestions, follow_up_context:pendingFollowUp }) }); var data = await response.json(); if (!response.ok) throw new Error(data.error || 'Scout could not answer that question.'); conversation.push(question); pendingFollowUp = data.follow_up_context || null; var loading = document.getElementById(loadingId); if (loading) loading.remove(); render(data); renderFollowUpChoices(data.follow_up_context); } catch (error) { var loading = document.getElementById(loadingId); if (loading) loading.remove(); root.insertAdjacentHTML('beforeend', '<div class="notice error">' + escapeHtml(error.message) + '</div>'); } finally { button.disabled = false; button.textContent = 'Ask Scout'; document.getElementById('question').focus(); } });
      document.getElementById('result').addEventListener('click', function (event) { var target = event.target.closest('[data-stage-action]'); if (!target) return; var action = actionChoices[Number(target.getAttribute('data-stage-action'))]; if (!action) return; pendingFollowUp = action; pendingQuestionLabel = 'Review ' + (action.label || action.stage || 'this area'); document.getElementById('question').value = 'yes'; document.getElementById('askForm').requestSubmit(); });
      checkAccess().catch(function () { window.location.replace('/login'); });
    })();
  </script>
</body>
</html>
