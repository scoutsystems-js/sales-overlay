<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin — Scout Systems</title>
  <link rel="stylesheet" href="/css/style.css"/>
  <style>
    /* ⚠ MONOSPACE IS FUNCTIONAL HERE, NOT A LEFTOVER (checked 2026-09-01).
       A support reference is an 8-char hex READ ALOUD on a call — referenceFor
       chose hex precisely so there is no 0/O ambiguity when spoken, and a fixed
       pitch does the same job on screen. Same for the temp password below.
       ⚠ WHAT WAS WRONG: this class also dressed the CATEGORY chip, which is an
       ordinary word ("Grading", "Sync"). Monospace made a label look like an
       identifier. The category now has its own class. */
    .support-cat-admin, .support-ref-admin { font-size: 13px;
      background: var(--bg-field); border: 1px solid var(--border-strong);
      border-radius: 4px; padding: 1px 6px; }
    .support-ref-admin { font-family: ui-monospace, Menlo, monospace; }
    /* Three-section admin layout:
         A — user management (top, full width)
         B — session list    (bottom left)
         C — log detail      (bottom right)
       Below 900px the B/C split stacks. Styles live inline here (matches
       the login.html / dashboard.html pattern). */

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
    }

    .admin-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 24px;
      border-bottom: 1px solid var(--border);
      background: rgba(8,11,13,0.95);
    }
    .admin-top-left { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 700; }
    .admin-top-right { display: flex; align-items: center; gap: 16px; font-size: 13px; color: var(--muted); }
    .admin-top-right .signout { cursor: pointer; }
    .admin-top-right .signout:hover { color: var(--text); }

    .admin-page {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    /* ── SECTION A: users ────────────────────────────────────────────────── */
    .users-section {
      padding: 20px 24px 12px;
      flex-shrink: 0;
    }
    .users-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      gap: 12px;
      flex-wrap: wrap;
    }
    .users-header h2 {
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--muted);
    }
    .btn-add-user {
      font-size: 13px;
      font-weight: 600;
      padding: 7px 14px;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      cursor: pointer;
      font-family: inherit;
    }
    .btn-add-user:hover { border-color: var(--green); color: var(--green); }

    /* Create-user modal + editable-field status (Stage 4 console) */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 100; }
    .modal-box { background: #16181d; border: 1px solid var(--border); border-radius: 10px; padding: 24px; width: 420px; max-width: 92vw; }
    .modal-title { font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 16px; }
    .modal-label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 14px; }
    .modal-input, .modal-select { display: block; width: 100%; margin-top: 5px; font-size: 13px; padding: 8px 10px; border-radius: 6px; background: var(--bg3); border: 1px solid var(--border); color: var(--text); font-family: inherit; }
    .modal-input:focus, .modal-select:focus { outline: none; border-color: var(--green); }
    .modal-err { font-size: 12px; color: #f87171; margin-bottom: 10px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 8px; }
    .btn-modal-primary { font-size: 13px; font-weight: 600; padding: 8px 16px; border-radius: 7px; border: none; background: var(--green); color: #0b1f12; cursor: pointer; font-family: inherit; }
    .btn-modal-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-modal-secondary { font-size: 13px; font-weight: 600; padding: 8px 16px; border-radius: 7px; border: 1px solid var(--border); background: transparent; color: var(--muted); cursor: pointer; font-family: inherit; }
    .cu-created-msg { font-size: 13px; color: var(--text); line-height: 1.5; margin-bottom: 14px; }
    .cu-email-status { font-size: 13px; margin: 6px 0 10px; }
    .temp-pw-box { display: flex; align-items: center; gap: 10px; background: var(--bg3); border: 1px solid var(--border); border-radius: 7px; padding: 10px 12px; margin-bottom: 16px; }
    .temp-pw-box code { font-size: 14px; color: var(--green); font-family: ui-monospace, Menlo, monospace; flex: 1; word-break: break-all; }
    .btn-copy { font-size: 12px; font-weight: 600; padding: 5px 12px; border-radius: 6px; border: 1px solid var(--border); background: transparent; color: var(--text); cursor: pointer; font-family: inherit; }
    .field-status { font-size: 12px; margin-left: 6px; }
    .field-status.ok { color: var(--green); }
    .field-status.err { color: #f87171; }

    .users-table-wrap {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 10px;
      /* ⚠⚠ `max-height: 320px` WAS HERE AND IT HID PEOPLE. It clipped at ~6
         rows behind an INNER scrollbar, so the 8-user All Users list was
         already truncated before company blocks existed — and a stacked block
         (384px for 5 members) lost its last two members entirely.
         ⚠ Caught by LOOKING. Every DOM check said the rows were present and
         `getBoundingClientRect` reported them visible, because they DO have
         size — they just sit inside a clipped scroll container. A measurement
         cannot see a composition problem.
         ⚠ Horizontal scrolling is kept (wide tables); vertical is the page's
         job. A nested vertical scrollbar inside a page that also scrolls hides
         content that nobody knows to scroll for. */
      overflow-x: auto;
    }
    /* Company blocks bring their own border and background, so the wrapper
       drops its panel chrome rather than drawing a box around a box. */
    .users-table-wrap.blocks { background: none; border: none; border-radius: 0; }
    .users-table {
      width: 100%;
      border-collapse: collapse;
    }
    .users-table th {
      text-align: left;
      padding: 10px 16px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      background: rgba(0,0,0,0.15);
      position: sticky;
      top: 0;
    }
    .users-table td {
      padding: 11px 16px;
      font-size: 13px;
      border-bottom: 1px solid var(--border);
      color: var(--text);
      vertical-align: middle;
    }
    .users-table tr:last-child td { border-bottom: none; }

    .btn-resend { font-size: 11px; padding: 4px 9px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg2); color: var(--muted); cursor: pointer; white-space: nowrap; }

    .btn-resend:hover:not(:disabled) { color: var(--text); border-color: var(--green); }
    .admin-actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .admin-danger { color: #f87171; border-color: rgba(248,113,113,0.35); }
    .admin-danger:hover:not(:disabled) { color: #fca5a5; border-color: rgba(248,113,113,0.6); }

    .role-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 6px;
      text-transform: lowercase;
      letter-spacing: 0.3px;
    }
    .role-badge.owner { background: rgba(34,197,94,0.15); color: var(--green); }
    .role-badge.admin { background: rgba(59,130,246,0.15); color: #60a5fa; }
    .role-badge.user  { background: rgba(255,255,255,0.06); color: var(--muted); }
    .role-badge .self-tag {
      font-size: 10px;
      color: var(--muted);
      margin-left: 6px;
      font-weight: 500;
      text-transform: none;
      letter-spacing: 0;
    }

    .role-select {
      font-size: 12px;
      padding: 4px 8px;
      border-radius: 6px;
      background: var(--bg3);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: inherit;
      cursor: pointer;
    }
    .role-select:focus { outline: none; border-color: var(--green); }

    .role-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .role-save {
      font-size: 11px;
      font-weight: 700;
      padding: 5px 10px;
      border-radius: 6px;
      background: var(--green);
      color: #000;
      border: none;
      cursor: pointer;
      font-family: inherit;
    }
    .role-save:hover:not(:disabled) { background: var(--green-dark); }
    .role-save:disabled { opacity: 0.35; cursor: not-allowed; background: var(--bg3); color: var(--muted); }
    .role-warning {
      font-size: 11px;
      color: #fbbf24;
      width: 100%;
      margin-top: 2px;
      display: block;
    }
    .role-warning.hidden { display: none; }
    .role-saved {
      font-size: 11px;
      color: var(--green);
      font-weight: 600;
      opacity: 0;
      transition: opacity 0.15s;
    }
    .role-saved.show { opacity: 1; }

    .empty-msg { padding: 24px 20px; font-size: 13px; color: var(--muted); text-align: center; }

    .spinner {
      width: 18px; height: 18px;
      border: 2px solid var(--border);
      border-top-color: var(--green);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: inline-block;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }


    @media (max-width: 900px) {
      .users-section { padding: 16px 16px 10px; }
      .users-table { white-space: nowrap; }
    }

    /* v1.1.10: User analytics widget. Mirrors the dashboard.html analytics
       block. Duplicated rather than extracted to a shared CSS file because
       admin.html uses its own --bg2/--muted set and the two pages may diverge
       visually in future. Extract to /css/analytics.css if it grows. */
    .analytics-section { margin: 24px 0; }
    .analytics-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; gap: 16px; flex-wrap: wrap; }
    .analytics-header h2 { margin: 0; font-size: 18px; font-weight: 600; }
    .analytics-controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .analytics-controls select {
      background: var(--bg2); border: 1px solid #2a2a2a; color: inherit;
      padding: 6px 28px 6px 10px; border-radius: 6px; font-size: 13px;
      font-family: inherit; min-width: 220px;
    }
    .analytics-empty {
      background: var(--bg2); border: 1px solid #2a2a2a; border-radius: 8px;
      padding: 32px; text-align: center; color: var(--muted); font-size: 13px;
    }
    .date-presets { display: flex; gap: 6px; flex-wrap: wrap; }
    .date-preset {
      background: var(--bg2); border: 1px solid #2a2a2a; color: var(--muted);
      padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer;
      font-family: inherit;
    }
    .date-preset:hover { background: #2a2a2a; color: inherit; }
    .date-preset.active { background: #2a2a2a; color: inherit; border-color: #4a9eff; }

    .stats-row {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px; margin-bottom: 24px;
    }
    .stat-card {
      background: var(--bg2); border: 1px solid #2a2a2a; border-radius: 8px;
      padding: 14px 16px;
    }
    .stat-card .stat-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .stat-card .stat-value { font-size: 24px; font-weight: 600; margin-top: 4px; }
    .stat-card .stat-sub { font-size: 11px; color: var(--muted); margin-top: 4px; }

    .objection-section { margin-bottom: 24px; }
    .objection-totals { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
    .objection-table {
      width: 100%; border-collapse: collapse;
      background: var(--bg2); border-radius: 8px; overflow: hidden;
    }
    .objection-table th, .objection-table td {
      padding: 10px 14px; text-align: left; font-size: 13px;
      border-bottom: 1px solid #2a2a2a;
    }
    .objection-table th {
      background: #1a1a1a; color: var(--muted); font-weight: 500;
      font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px;
    }
    .objection-table tr:last-child td { border-bottom: none; }
    .objection-table .pct-cell { font-weight: 600; }
    .pct-good { color: #09e046; }
    .pct-mid  { color: #facc15; }
    .pct-bad  { color: #f87171; }
    .pct-none { color: var(--muted); }

    /* ─── Company blocks + admin tabs (2026-08-24) ─────────────────────────
       A company IS a team, renamed in this view only. */
    .admin-tabs { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
    .admin-tab {
      background: var(--bg-elevated, #131313); color: var(--text, #ededed);
      border: 1px solid var(--border-strong, #2a2a2a); border-radius: 6px;
      padding: 7px 13px; font: inherit; font-size: 13px; font-weight: 600;
      cursor: pointer; display: inline-flex; align-items: center; gap: 7px;
    }
    .admin-tab:hover { border-color: var(--green, #09e046); }
    .admin-tab.active { border-color: var(--green, #09e046); color: var(--green, #09e046); }
    .admin-tab-count {
      font-size: 11px; font-weight: 600; opacity: 0.75;
      border: 1px solid currentColor; border-radius: 10px; padding: 0 6px; line-height: 16px;
    }

    .company-block {
      border: 1px solid var(--border-strong, #2a2a2a); border-radius: 10px;
      padding: 16px; margin-bottom: 18px; background: var(--bg-elevated, #131313);
    }
    /* ⚠ TOP CENTRE — Justin's ruling. Scoped to the block; nothing else in the
       admin page is centred, and this must not leak into the shared table. */
    .company-head { text-align: center; margin-bottom: 14px; }
    .company-name-input, .company-name-static {
      font-size: 19px; font-weight: 700; text-align: center; color: var(--text, #ededed);
      background: transparent; border: 1px solid transparent; border-radius: 6px;
      padding: 5px 10px; max-width: 100%; width: 360px; font-family: inherit;
    }
    .company-name-input:hover { border-color: var(--border-strong, #2a2a2a); }
    .company-name-input:focus { border-color: var(--green, #09e046); outline: none; }
    /* An unnamed company reads as a gap to fill, not as a name. */
    .company-name-input.unnamed::placeholder, .company-name-static.unnamed { opacity: 0.6; font-style: italic; }
    .company-sub { font-size: 12px; opacity: 0.7; margin-top: 2px; }

    .add-company-bar {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      margin-bottom: 16px; padding: 12px 14px;
      border: 1px dashed var(--border); border-radius: 10px; background: var(--bg2);
    }
    .add-company-name { width: 220px; }

    .company-block.deactivated { opacity: 0.72; border-style: dashed; }
    .company-actions { display: flex; align-items: center; gap: 8px; justify-content: center; margin-bottom: 12px; flex-wrap: wrap; }
    .company-off-badge {
      font-size: 11px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
      border: 1px solid var(--border-strong, #2a2a2a); border-radius: 10px; padding: 2px 9px;
    }
      /* ⚠ the head's cell is a FACT, not a disabled control — no dropdown chrome,
       because there is no choice to make. Same weight as the select beside it. */
    .company-head-label { font-size: 12px; color: var(--text); }
</style>
  <script src="/js/scout-auth.js"></script>
  <script src="/js/scout-modal.js"></script>
</head>

<div class="admin-page">

  <!-- SECTION A: Users -->
  <section class="users-section">
    <div class="users-header">
      <h2>User Management</h2>
      <button class="btn-add-user" id="btnCreateUser" onclick="openCreateUserModal()" style="display:none">+ Create user</button>
    </div>
    <div class="users-table-wrap" id="usersTableWrap">
      <div class="empty-msg"><span class="spinner"></span></div>
    </div>
  </section>

  <!-- ⚠⚠ ADMIN-ONLY BY RULING, and the reason is not tidiness: this list carries
       OTHER COMPANIES' account state in every attached snapshot. The SUBMIT
       control is universal and this is not — one feature, two permission
       answers, and conflating them is a data leak. Gated on the server too
       (requireRole('owner')); hiding the section is presentation, not security. -->
  <section class="users-section" id="ticketsSection" style="display:none">
    <div class="users-header">
      <h2>Support Tickets</h2>
      <div style="display:flex; gap:8px; align-items:center;">
        <!-- ⚠⚠ THE REFERENCE IS THE ONLY THING THE PERSON HAS. Without a way to
             search on it, a code read out on a call cannot be found — which is
             the one moment it exists for. Matches the reference, the email or
             anything in the message. -->
        <input class="role-select" id="ticketSearch" type="search" placeholder="Reference, email or text"
               oninput="renderTickets()" style="min-width:220px;">
        <select class="role-select" id="ticketCategory" onchange="loadTickets()">

          <option value="sync_grading">Syncing / grading</option>
          <option value="wrong_data">Wrong number or panel</option>
          <option value="wrong_coaching">Wrong coaching</option>
          <option value="cant_find">Cannot find or use</option>
          <option value="other">Other</option>
        </select>
        <select class="role-select" id="ticketFilter" onchange="loadTickets()">

          <option value="closed">Closed</option>
          <option value="all">All</option>
        </select>
      </div>
    </div>
    <div class="users-table-wrap" id="ticketsWrap"><div class="empty-msg">—</div></div>
  </section>

  <!-- ⚠ PASSWORD RESET DIAGNOSTICS REMOVED 2026-08-24 (Justin: "that was in
       there a while ago for some testing I did and needs to be removed
       completely"). The route behind it went too — a diagnostic endpoint left
       mounted is an unused surface nobody is watching. -->


  <!-- Create-user modal (owner only). Temp password shown ONCE on success. -->
  <div class="modal-overlay" id="createUserModal" style="display:none" onclick="if(event.target===this)closeCreateUserModal()">
    <div class="modal-box">
      <div class="modal-title">Create user</div>
      <div id="createUserForm">
        <label class="modal-label">First name<input type="text" id="cuFirstName" class="modal-input" placeholder="Ava" maxlength="60" autocomplete="off"></label>
        <label class="modal-label">Last name<input type="text" id="cuLastName" class="modal-input" placeholder="Chen" maxlength="60" autocomplete="off"></label>
        <label class="modal-label">Email<input type="email" id="cuEmail" class="modal-input" placeholder="rep@company.com" autocomplete="off"></label>
        <label class="modal-label">Role
          <select id="cuRole" class="role-select modal-select"><option value="user">user</option><option value="manager">manager</option></select>
        </label>
        <label class="modal-label">Managed by (optional)
          <select id="cuManagedBy" class="role-select modal-select" onchange="onCreateCompanyChange()"></select>
        </label>
        <label class="modal-label" id="cuNewCompanyWrap" style="display:none">New company name
          <input type="text" id="cuNewCompany" class="modal-input" placeholder="Acme Roofing" maxlength="80" autocomplete="off">
        </label>
        <div class="modal-err hidden" id="cuError"></div>
        <div class="modal-actions">
          <button class="btn-modal-secondary" onclick="closeCreateUserModal()">Cancel</button>
          <button class="btn-modal-primary" id="cuSubmit" onclick="submitCreateUser()">Create</button>
        </div>
      </div>
      <div id="createUserSuccess" style="display:none">
        <div class="cu-created-msg">User created. Share this temporary password with them now — <strong>it will not be shown again.</strong></div>
        <div class="cu-email-status" id="cuEmailStatus"></div>
        <div class="temp-pw-box"><code id="cuTempPw"></code><button class="btn-copy" onclick="copyTempPassword()">Copy</button></div>
        <div class="modal-actions"><button class="btn-modal-primary" onclick="closeCreateUserModal()">Done</button></div>
      </div>
    </div>
  </div>

  <!-- SECTION ANALYTICS: per-user analytics widget (v1.1.10). Reuses the
       /dashboard analytics view but for a user the admin/owner selects.
       Pivots on /admin/analytics/:user_id (scope-checked: admins see
       managed users + self, owners see anyone). Empty until a user is
       picked from the dropdown. -->

</div>

<script>
  // ── Session handling (mirrors login.html / dashboard.html) ────────────
  var STORAGE_KEY = 'scout_session_v1';

  function getSession() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch (e) { return null; }
  }
  function setSession(s) { localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); }
  // Diagnostics shim → shared ring buffer/beacon in scout-auth.js.
  function pdiag(e, d, beacon) {
    try {
      if (window.ScoutAuth && ScoutAuth.diag) {
        if (beacon) ScoutAuth.diag.beacon(e, d || null);
        else ScoutAuth.diag.push({ e: e, detail: d || null });
      }
    } catch (x) {}
  }
  // Choke point for this page's inline `if (401){ clearSession(); redirect }`
  // handlers — beacon with a stack so the server log shows which one fired.
  function clearSession() {
    try {
      var st = ''; try { st = (new Error()).stack || ''; } catch (e) {}
      pdiag('admin-clearSession', { stack: st.split('\n').slice(1, 5).join(' || ').slice(0, 400) }, true);
    } catch (e) {}
    localStorage.removeItem(STORAGE_KEY);
  }

  function isSessionValid(s) {
    if (!s || !s.access_token || !s.expires_at) return false;
    var nowSec = Math.floor(Date.now() / 1000);
    return s.expires_at > nowSec + 60;
  }
  function shouldRefresh(s) {
    if (!s || !s.expires_at) return false;
    var nowSec = Math.floor(Date.now() / 1000);
    return s.expires_at - nowSec < 300;
  }
  async function refreshSessionIfNeeded() {
    var s = getSession();
    if (!s || !s.refresh_token) return null;
    if (!shouldRefresh(s)) return s;
    try {
      var res = await fetch('/auth/refresh', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ refresh_token: s.refresh_token }),
      });
      if (!res.ok) { clearSession(); return null; }
      var data = await res.json();
      if (!data.session) { clearSession(); return null; }
      var fresh = {
        access_token: data.session.access_token,
        refresh_token: data.session.refresh_token,
        expires_at: data.session.expires_at,
        email: (data.user && data.user.email) || (s && s.email),
      };
      setSession(fresh);
      return fresh;
    } catch (err) { clearSession(); return null; }
  }

  function signOut() { clearSession(); window.location.replace('/login'); }

  function authHeader() {
    var s = getSession();
    return s && s.access_token ? { 'Authorization': 'Bearer ' + s.access_token } : {};
  }

  // ── State ───────────────────────────────────────────────────────────────
  var currentUser = null;          // { user_id, email, role } from /auth/me
  var usersArray = [];
  var companiesArray = [];   // [{key,name,is_unnamed,head,members,user_count}] from the server
  var singlesArray = [];     // users with no reps AND no manager             // Section A
  var ownerCount = 0;              // derived from usersArray

  // ── Init ───────────────────────────────────────────────────────────────
  async function init() {
    var s = getSession();
    if (!isSessionValid(s)) {
      if (s && s.refresh_token) {
        var refreshed = await refreshSessionIfNeeded();
        if (!refreshed) { window.location.replace('/login'); return; }
      } else {
        window.location.replace('/login');
        return;
      }
    }
    var cur = getSession();
    document.getElementById('signedInEmail').textContent = (cur && cur.email) || '';

    // Role gate: non-admin users belong on /dashboard.
    currentUser = await fetchMe();
    if (!currentUser) { clearSession(); window.location.replace('/login'); return; }
    if (currentUser.role === 'user') { window.location.replace('/dashboard'); return; }
    document.getElementById('roleLabel').textContent = currentUser.role === 'owner' ? 'Owner' : 'Admin';

    // ⚠ Restore the tab BEFORE the first render, or the page always opens on
    // Companies and a refresh silently discards where the user was.
    adminTab = readAdminTabFromHash();
    await loadUsers();
    if (currentUser.role === 'owner') {
      document.getElementById('ticketsSection').style.display = '';
      loadTickets();
    }
  }

  /* ══ SUPPORT TICKETS ══════════════════════════════════════════════════════
   * ⚠ THE SNAPSHOT SHOWN IS THE ONE STORED WITH THE TICKET — captured when they
   * hit the problem, never regenerated on read. Regenerating would answer "what
   * is true now", look identical, and quietly make a cleared backlog read as
   * though it never existed. */
  async function loadTickets() {
    var wrap = document.getElementById('ticketsWrap');
    var status = document.getElementById('ticketFilter').value;
    wrap.innerHTML = '<div class="empty-msg"><span class="spinner"></span></div>';
    try {
      var cat = document.getElementById('ticketCategory').value;
      var res = await fetch('/support/tickets?status=' + encodeURIComponent(status)
        + (cat ? '&category=' + encodeURIComponent(cat) : ''), { headers: authHeader() });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      var d = await res.json();
      ticketCache = d.tickets || [];
      renderTickets();
    } catch (e) {
      wrap.innerHTML = '<div class="empty-msg">Could not load tickets: ' + escapeHtml(e.message) + '</div>';
    }
  }
  /* ⚠ THE LABELS LIVE HERE, THE KEYS LIVE IN THE ROUTE. One list of keys,
     validated server-side; the human wording is presentation. */
  var TICKET_CATEGORY_LABELS = {
    sync_grading: 'Syncing / grading', wrong_data: 'Wrong number or panel',
    wrong_coaching: 'Wrong coaching', cant_find: 'Cannot find or use', other: 'Other',
  };
  async function openAttachment(id) {
    try {
      var res = await fetch('/support/attachment/' + encodeURIComponent(id), { headers: authHeader() });
      if (!res.ok) { alert('Could not open that attachment.'); return; }
      var d = await res.json();
      window.open(d.url, '_blank', 'noopener');
    } catch (e) { alert('Could not reach the server.'); }
  }
  var ticketCache = [];
  function renderTickets() {
    var wrap = document.getElementById('ticketsWrap');
    var q = (document.getElementById('ticketSearch').value || '').trim().toLowerCase();
    var list = ticketCache;
    if (q) {
      list = list.filter(function (t) {
        return (t.reference || '').toLowerCase().indexOf(q) !== -1
            || (t.email || '').toLowerCase().indexOf(q) !== -1
            || (t.message || '').toLowerCase().indexOf(q) !== -1;
      });
    }
    if (!list.length) {
      /* ⚠ "NO MATCHES" AND "NO TICKETS" ARE DIFFERENT FACTS — one means you
         searched for something that is not here, the other that there is
         nothing at all. Saying the wrong one sends someone looking again. */
      wrap.innerHTML = '<div class="empty-msg">' + (q ? 'Nothing matches “' + escapeHtml(q) + '”.' : 'No tickets.') + '</div>';
      return;
    }
    wrap.innerHTML = list.map(ticketRowHtml).join('');
  }
  function ticketRowHtml(t) {
    var s = t.snapshot || {};
    /* ⚠ "NO SNAPSHOT" AND "THE SNAPSHOT BROKE" ARE DIFFERENT FACTS. Showing an
       empty one as though nothing were wrong is the absent-vs-excluded collapse
       — and here it would mean answering a ticket from data that never loaded. */
    var diag = t.snapshot_error
      ? '<div class="empty-msg">⚠ Diagnostics failed when this was raised: ' + escapeHtml(t.snapshot_error) + '</div>'
      : (s.verdict
          ? '<div><strong>' + escapeHtml(s.verdict) + '</strong></div>'
            + '<div class="empty-msg">' + (s.what_they_see || []).map(esc).join('<br>') + '</div>'
          : '<div class="empty-msg">No diagnostics attached.</div>');
    /* ⚠ THE ATTACHMENT IS OPENED THROUGH A SIGNED URL, never linked directly.
       The bucket is private, so there is no public URL to link to — which is
       exactly what stops a screenshot leaking by being shared or guessed. */
    var attach = '';
    if (t.attachment_path) {
      attach = '<div style="margin:6px 0;"><button class="btn-add-user" onclick="openAttachment(\'' + t.id + '\')">'
        + 'View screenshot</button> <span class="empty-msg">' + escapeHtml(t.attachment_name || '') + '</span></div>';
    } else if (t.attachment_error) {
      /* ⚠ "NO SCREENSHOT" AND "THE UPLOAD FAILED" ARE DIFFERENT FACTS. A blank
         read as "they didn't send one" loses the evidence that they tried. */
      attach = '<div class="empty-msg">⚠ They tried to attach a screenshot and it failed: '
        + escapeHtml(t.attachment_error) + '</div>';
    }
    if (t.link_url) {
      attach += '<div style="margin:6px 0;"><a class="nav-link" href="' + escapeHtml(t.link_url)
        + '" target="_blank" rel="noopener noreferrer">Open video link →</a></div>';
    }
    var cat = t.category ? '<span class="support-cat-admin">' + escapeHtml(TICKET_CATEGORY_LABELS[t.category] || t.category) + '</span> ' : '';
    return '<div class="user-row" style="display:block; padding:14px 0;">'
      /* ⚠ THE REFERENCE LEADS. It is what the person quotes, so it is the first
         thing to scan for — it was previously shown nowhere at all. */
      + '<div>' + cat + '<span class="support-ref-admin">' + escapeHtml(t.reference || '') + '</span> '
      + '<strong>' + escapeHtml(t.email || t.user_id) + '</strong>'
      + ' <span class="empty-msg">· ' + escapeHtml(t.page || 'unknown page') + ' · '
      + escapeHtml(new Date(t.created_at).toLocaleString()) + '</span></div>'
      + '<div style="margin:8px 0; white-space:pre-wrap;">' + escapeHtml(t.message) + '</div>'
      + attach
      + diag
      + '<div style="margin-top:10px;"><button class="btn-add-user" onclick="setTicketStatus(\'' + t.id + '\', \''
      + (t.status === 'open' ? 'closed' : 'open') + '\')">'
      + (t.status === 'open' ? 'Mark handled' : 'Reopen') + '</button></div>'
      + '</div>';
  }
  async function setTicketStatus(id, status) {
    try {
      var res = await fetch('/support/tickets/' + encodeURIComponent(id), {
        method: 'PATCH',
        headers: Object.assign({ 'Content-Type': 'application/json' }, authHeader()),
        body: JSON.stringify({ status: status }),
      });
      if (!res.ok) { alert('Could not update that ticket.'); return; }
      loadTickets();
    } catch (e) { alert('Could not reach the server.'); }
  }

  // Owner-only dry-run: what would a password reset for this email do right now?
  async function fetchMe() {
    try {
      var res = await fetch('/auth/me', { headers: authHeader() });
      if (res.status === 401) return null;
      if (!res.ok) {
        console.error('[admin] /auth/me returned', res.status);
        return null;
      }
      return await res.json();
    } catch (err) {
      console.error('[admin] /auth/me network error:', err.message);
      return null;
    }
  }

  // ── SECTION A: users ───────────────────────────────────────────────────
  async function loadUsers() {
    var wrap = document.getElementById('usersTableWrap');
    var res;
    try {
      res = await fetch('/admin/users', { headers: authHeader() });
    } catch (err) {
      wrap.innerHTML = '<div class="empty-msg" style="color:#f87171;">Could not reach server.</div>';
      return;
    }
    if (res.status === 401) { clearSession(); window.location.replace('/login'); return; }
    if (res.status === 403) {
      console.error('[admin] /admin/users returned 403 despite role gate passing');
      wrap.innerHTML = '<div class="empty-msg" style="color:#f87171;">Access denied loading users. Try signing out and back in.</div>';
      return;
    }
    if (!res.ok) {
      var err; try { err = await res.json(); } catch (e) { err = { error: 'HTTP ' + res.status }; }
      wrap.innerHTML = '<div class="empty-msg" style="color:#f87171;">' + escapeHtml(err.error || 'Failed to load users') + '</div>';
      return;
    }
    var data = await res.json();
    usersArray = (data && data.users) || [];
    // ⚠ Grouped by the SERVER (lib/company.js). The page deliberately does not
    // reimplement "what is a company" — one definition, no mirror to drift.
    companiesArray = (data && data.companies) || [];
    singlesArray = (data && data.singles) || [];
    ownerCount = usersArray.filter(function(u) { return u.role === 'owner'; }).length;
    renderUsersTable();
    populateAnalyticsUserSelect();
  }

  // ─── v1.1.10 user analytics ──────────────────────────────────────────
  var analyticsState = { user_id: null, from: null, to: null };

  function populateAnalyticsUserSelect() {
    var sel = document.getElementById('analyticsUserSelect');
    if (!sel) return;
    // Sort by email for predictability.
    var sorted = (usersArray || []).slice().sort(function(a, b) {
      return (a.email || '').localeCompare(b.email || '');
    });
    var options = ['<option value="">Select a user…</option>'];
    for (var i = 0; i < sorted.length; i++) {
      var u = sorted[i];
      options.push('<option value="' + escapeHtml(u.user_id) + '">' + escapeHtml(u.email || u.user_id) + ' · ' + escapeHtml(u.role || 'user') + '</option>');
    }
    sel.innerHTML = options.join('');
    // Default the date range to last 30d so the first selection just works.
    var to = new Date();
    var from = new Date(Date.now() - 30 * 24 * 60 * 60 * 1000);
    analyticsState.from = from.toISOString();
    analyticsState.to = to.toISOString();
  }

  function onAnalyticsUserChange() {
    var sel = document.getElementById('analyticsUserSelect');
    var userId = sel && sel.value;
    if (!userId) {
      document.getElementById('analyticsEmpty').style.display = '';
      document.getElementById('analyticsContent').style.display = 'none';
      analyticsState.user_id = null;
      return;
    }
    analyticsState.user_id = userId;
    document.getElementById('analyticsEmpty').style.display = 'none';
    document.getElementById('analyticsContent').style.display = '';
    loadAnalyticsForUser();
  }

  function setAnalyticsDateRange(days) {
    var to = new Date();
    var from = days >= 9999
      ? new Date('2025-01-01T00:00:00Z')
      : new Date(Date.now() - days * 24 * 60 * 60 * 1000);
    analyticsState.from = from.toISOString();
    analyticsState.to = to.toISOString();
    document.querySelectorAll('.date-preset').forEach(function(b) { b.classList.remove('active'); });
    var activeBtn = document.querySelector('.date-preset[data-days="' + days + '"]');
    if (activeBtn) activeBtn.classList.add('active');
    if (analyticsState.user_id) loadAnalyticsForUser();
  }

  async function loadAnalyticsForUser() {
    var row = document.getElementById('analyticsStatsRow');
    if (!row || !analyticsState.user_id) return;
    row.innerHTML = '<div class="load-spinner"><div class="spinner"></div></div>';
    var url = '/admin/analytics/' + encodeURIComponent(analyticsState.user_id)
      + '?from=' + encodeURIComponent(analyticsState.from)
      + '&to=' + encodeURIComponent(analyticsState.to);
    var res;
    try { res = await fetch(url, { headers: authHeader() }); }
    catch (err) { row.innerHTML = '<div class="empty-msg" style="color:#f87171;">Network error loading analytics</div>'; return; }
    if (res.status === 401) { clearSession(); window.location.replace('/login'); return; }
    if (res.status === 403) {
      row.innerHTML = '<div class="empty-msg" style="color:#f87171;">Not authorized to view that user.</div>';
      return;
    }
    if (!res.ok) {
      row.innerHTML = '<div class="empty-msg" style="color:#f87171;">Could not load analytics (HTTP ' + res.status + ')</div>';
      return;
    }
    var data = await res.json();
    renderAnalyticsStats(data.totals);
    renderAnalyticsObjections(data.objections);
  }

  function renderAnalyticsStats(totals) {
    var parts = [];
    parts.push(analyticsStatCard('Total calls', totals.total_calls, totals.live > 0 ? totals.live + ' still live' : null));
    parts.push(analyticsStatCard('Closed (Won)', totals.wins, analyticsPctOf(totals.wins, totals.total_calls)));
    parts.push(analyticsStatCard('Lost', totals.losses, analyticsPctOf(totals.losses, totals.total_calls)));
    parts.push(analyticsStatCard('Follow-up', totals.follow_ups, analyticsPctOf(totals.follow_ups, totals.total_calls)));
    if (totals.unmarked > 0) parts.push(analyticsStatCard('Unmarked', totals.unmarked, 'no summary yet'));
    document.getElementById('analyticsStatsRow').innerHTML = parts.join('');
  }

  function analyticsStatCard(label, value, sub) {
    var subPart = sub ? '<div class="stat-sub">' + escapeHtml(String(sub)) + '</div>' : '';
    return '<div class="stat-card"><div class="stat-label">' + escapeHtml(label)
      + '</div><div class="stat-value">' + escapeHtml(String(value)) + '</div>' + subPart + '</div>';
  }

  function analyticsPctOf(n, total) {
    if (!total) return null;
    return Math.round((n / total) * 100) + '%';
  }

  function renderAnalyticsObjections(objSection) {
    var section = document.getElementById('analyticsObjectionSection');
    var content = document.getElementById('analyticsObjectionContent');
    if (!objSection || !objSection.by_type || objSection.by_type.length === 0) {
      section.style.display = 'none';
      return;
    }
    section.style.display = 'block';
    var t = objSection.totals;
    var summary = t.total + ' total · ' + t.overcome + ' overcome · ' + t.not_overcome + ' not overcome';
    if (t.unknown > 0) summary += ' · ' + t.unknown + ' indeterminate (transcript quality)';
    var rows = '';
    for (var i = 0; i < objSection.by_type.length; i++) {
      var b = objSection.by_type[i];
      var pct = b.overcome_pct === null
        ? '<span class="pct-none">—</span>'
        : '<span class="' + analyticsPctClass(b.overcome_pct) + '">' + b.overcome_pct + '%</span>';
      rows += '<tr><td>' + escapeHtml(b.label) + '</td>'
        + '<td>' + b.count + '</td>'
        + '<td>' + b.overcome + '</td>'
        + '<td>' + b.not_overcome + '</td>'
        + '<td>' + b.unknown + '</td>'
        + '<td class="pct-cell">' + pct + '</td></tr>';
    }
    content.innerHTML =
      '<div class="objection-totals">' + escapeHtml(summary) + '</div>'
      + '<table class="objection-table">'
      + '<thead><tr><th>Objection</th><th>Count</th><th>Overcome</th><th>Not</th><th>?</th><th>Overcome %</th></tr></thead>'
      + '<tbody>' + rows + '</tbody></table>';
  }

  function analyticsPctClass(pct) {
    if (pct >= 70) return 'pct-good';
    if (pct >= 40) return 'pct-mid';
    return 'pct-bad';
  }

  // Naming decision: role 'owner' is surfaced as "admin (owner)".
  /* ⚠ MIRROR of lib/role-labels.js — RULED labels (H673): user → Rep · manager → Manager ·
     owner → Admin. The stored value never changes. Pinned by test/role-labels-mirror.test.js,
     which EXECUTES this copy against the lib's. Edit the lib first, then this. */
  var ROLE_LABELS = { user: 'Rep', manager: 'Manager', owner: 'Admin' };
  function roleLabel(role) {
    var k = (typeof role === 'string') ? role.toLowerCase() : '';
    return Object.prototype.hasOwnProperty.call(ROLE_LABELS, k) ? ROLE_LABELS[k] : 'Rep';
  }
  function roleBadgeClass(r) { return r === 'owner' ? 'owner' : (r === 'manager' ? 'admin' : 'user'); }
  function managersList() { return usersArray.filter(function(u) { return u.role === 'manager' || u.role === 'owner'; }); }
  function shortDate(iso) { var d = new Date(iso); return isNaN(d.getTime()) ? '—' : d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: '2-digit' }); }

  /* ═══ COMPANY BLOCKS ══════════════════════════════════════════════════════
     Justin's ruling (2026-08-24): the admin view is organised around COMPANIES,
     which ARE teams renamed — no new tier, no schema change beyond the name.

     ⚠ A company is a user WITH REPS plus their reps. It is keyed on having
     reps, never on role: live data has a `manager` with zero reps who is a
     SINGLE USER, not a company of one.
     ⚠ The grouping arrives from the server so this page never gets a second,
     drifting copy of that rule. */
  var ADMIN_TABS = [
    { key: 'companies', label: 'Companies' },
    { key: 'singles',   label: 'Single Users' },
    { key: 'all',       label: 'All Users' },
  ];
  var adminTab = 'companies';

  /* Tab state survives a refresh, consistent with the rest of the product
     (the dashboard keeps its view + range in the hash). */
  function readAdminTabFromHash() {
    var h = (window.location.hash || '').replace(/^#/, '');
    for (var i = 0; i < ADMIN_TABS.length; i++) if (ADMIN_TABS[i].key === h) return h;
    return 'companies';
  }
  function setAdminTab(key) {
    adminTab = key;
    if (window.history && window.history.replaceState) {
      window.history.replaceState(null, '', '#' + key);
    } else { window.location.hash = key; }
    renderUsersTable();
  }
  function adminTabsHtml() {
    return '<div class="admin-tabs">' + ADMIN_TABS.map(function(t) {
      var n = t.key === 'companies' ? companiesArray.length
            : (t.key === 'singles' ? singlesArray.length : usersArray.length);
      return '<button class="admin-tab' + (adminTab === t.key ? ' active' : '') + '"'
        + ' onclick="setAdminTab(\'' + t.key + '\')">' + t.label
        + '<span class="admin-tab-count">' + n + '</span></button>';
    }).join('') + '</div>';
  }

  function userRowHtml(u, isOwnerViewer, mgrs) {
      var isSelf = u.user_id === currentUser.user_id;
      var editable = isOwnerViewer && !isSelf;   // owners edit others; self + non-owner viewers are read-only
      var roleCell = editable ? roleControlHtml(u)
        : '<span class="role-badge ' + roleBadgeClass(u.role) + '">' + escapeHtml(roleLabel(u.role)) + (isSelf ? '<span class="self-tag">(you)</span>' : '') + '</span>';
      var mbCell = editable ? managedByControlHtml(u, mgrs) : managedByLabel(u);
      var billCell = editable ? billingControlHtml(u) : '<span class="role-badge user">' + escapeHtml(u.billing_status || 'trial') + '</span>';
      var created = u.created_at ? shortDate(u.created_at) : '—';
      var emailDisplay = u.email || (u.user_id.slice(0, 8) + '…');
      var nameDisplay = (u.first_name || u.last_name) ? ((u.first_name || '') + ' ' + (u.last_name || '')).trim() : '—';
      var active = u.active !== false;
      var statusCell = active
        ? '<span style="color:var(--green);font-size:12px;white-space:nowrap;">● active</span>'
        : '<span style="color:var(--muted);font-size:12px;white-space:nowrap;">○ inactive</span>';
      // Full member action set in /admin (owner console) — deactivate/reactivate +
      // delete, alongside the existing role/managed-by(move)/billing controls. Same
      // server-side gates + zero-history delete rule as Team → Manage members.
      var actions = editable
        ? '<div class="admin-actions">'
            + '<button class="btn-resend" title="Resend the set-password / welcome email" onclick="resendWelcomeEmail(this, \'' + u.user_id + '\')">Resend</button>'
            + '<button class="btn-resend" onclick="' + (active ? 'adminDeactivate' : 'adminReactivate') + '(\'' + u.user_id + '\')">' + (active ? 'Deactivate' : 'Reactivate') + '</button>'
            + '<button class="btn-resend admin-danger" onclick="adminDelete(\'' + u.user_id + '\', \'' + escapeHtml(u.email || '') + '\')">Delete</button>'
          + '</div>'
        : '';
      return '<tr>'
        + '<td>' + escapeHtml(nameDisplay) + '</td>'
        + '<td>' + escapeHtml(emailDisplay) + '</td>'
        + '<td>' + roleCell + '</td>'
        + '<td>' + mbCell + '</td>'
        + '<td>' + billCell + '</td>'
        + '<td>' + statusCell + '</td>'
        + '<td style="color:var(--muted);font-size:12px;">' + escapeHtml(created) + '</td>'
        + '<td>' + actions + '</td>'
      + '</tr>';

  }

  var USERS_TABLE_HEADER = '<tr><th>Name</th><th>Email</th><th>Role</th><th>Company</th><th>Billing</th><th>Status</th><th>Created</th><th></th></tr>';

  function usersTableHtml(list, isOwnerViewer, mgrs, emptyMsg) {
    if (!list.length) return '<div class="empty-msg">' + escapeHtml(emptyMsg) + '</div>';
    return '<table class="users-table"><thead>' + USERS_TABLE_HEADER + '</thead><tbody>'
      + list.map(function(u) { return userRowHtml(u, isOwnerViewer, mgrs); }).join('')
      + '</tbody></table>';
  }

  /* One company. Members render top-down by ROLE (the server sorted them), with
     the HEAD first — they are the company, not a row in it. */
  function companyBlockHtml(c, isOwnerViewer, mgrs) {
    var members = (c.head ? [c.head] : []).concat(c.members || []);
    return '<section class="company-block' + (c.is_deactivated ? ' deactivated' : '') + '">'
      + companyNameHtml(c, isOwnerViewer)
      + companyActionsHtml(c, isOwnerViewer)
      + usersTableHtml(members, isOwnerViewer, mgrs, 'No members.')
    + '</section>';
  }

  /* ⚠ DEACTIVATE AND DELETE ARE DIFFERENT ACTIONS AND MUST NOT READ ALIKE.
     Deactivate is reversible and keeps every number; delete destroys the data
     and cannot be undone. So delete is the only one styled as destructive, and
     it is the only one that demands a typed confirmation. */
  function companyActionsHtml(c, isOwnerViewer) {
    if (!isOwnerViewer) return '';
    var off = !!c.is_deactivated;
    return '<div class="company-actions">'
      + (off ? '<span class="company-off-badge">Deactivated</span>' : '')
      + '<button class="btn-resend" onclick="companyLifecycleAction(\'' + escapeHtml(c.key) + '\', \''
        + (off ? 'reactivate' : 'deactivate') + '\')">' + (off ? 'Reactivate company' : 'Deactivate company') + '</button>'
      + '<button class="btn-resend admin-danger" onclick="deleteCompany(\'' + escapeHtml(c.key) + '\')">Delete company</button>'
      + '<span class="field-status" id="cls-' + escapeHtml(c.key) + '"></span>'
    + '</div>';
  }

  async function companyLifecycleAction(headId, action) {
    var status = document.getElementById('cls-' + headId);
    if (status) { status.textContent = '…'; status.className = 'field-status'; }
    var res;
    try {
      res = await fetch('/admin/companies/' + encodeURIComponent(headId) + '/' + action,
        { method: 'POST', headers: authHeader() });
    } catch (e) {
      if (status) { status.textContent = '✗ network'; status.className = 'field-status err'; }
      return;
    }
    if (res.status === 401) { clearSession(); window.location.replace('/login'); return; }
    if (!res.ok) {
      var err; try { err = await res.json(); } catch (e) { err = { error: 'HTTP ' + res.status }; }
      var st = document.getElementById('cls-' + headId);
      if (st) { st.textContent = '✗ ' + (err.error || 'failed'); st.className = 'field-status err'; }

    }
    var d = await res.json();
    await loadUsers();
    var st2 = document.getElementById('cls-' + headId);
    if (st2) {
      /* ⚠ Say what happened to the people who were ALREADY deactivated, or a
         reactivate that deliberately left someone off looks like it failed. */

      if (action === 'reactivate' && d.kept_deactivated) msg += ' (' + d.kept_deactivated + ' left deactivated)';
      st2.textContent = msg; st2.className = 'field-status ok';
      setTimeout(function () { var e2 = document.getElementById('cls-' + headId); if (e2) { e2.textContent = ''; e2.className = 'field-status'; } }, 2600);
    }

  /* ⚠⚠ FINAL AND UNRECOVERABLE, so never from a single click. The preview is
     fetched from the server so the confirmation names the REAL counts rather
     than describing the action in the abstract, and the second step requires
     the company name to be typed. */
  async function deleteCompany(headId) {
    var pv;
    try {
      var r = await fetch('/admin/companies/' + encodeURIComponent(headId) + '/delete-preview', { headers: authHeader() });
      if (r.status === 401) { clearSession(); window.location.replace('/login'); return; }
      if (!r.ok) { var e1; try { e1 = await r.json(); } catch (x) { e1 = {}; } alert('Could not load the preview: ' + (e1.error || r.status)); return; }
      pv = await r.json();
    } catch (e) { alert('Could not reach the server.'); return; }

    var extra = pv.kb_global_kept
      ? '\n\nNOTE: ' + pv.kb_global_kept + ' knowledge-base entries they shared platform-wide will be KEPT, '
        + 'because deleting them would remove content from every other company.'
      : '';
    if (!(await scoutConfirm({ title: 'Delete this company?', body: pv.confirmation + extra, confirmText: 'Continue', danger: true }))) return;
    var typed = await scoutPrompt({ title: 'Type the company name to confirm', body: pv.name,
      mustMatch: pv.name, placeholder: pv.name, confirmText: 'Delete company', danger: true,
      mismatchText: 'That did not match. Nothing was deleted.' });
    if (typed === null) return;

    var res;
    try {
      res = await fetch('/admin/companies/' + encodeURIComponent(headId), { method: 'DELETE', headers: authHeader() });
    } catch (e) { alert('Delete failed: could not reach the server.'); return; }
    if (res.status === 401) { clearSession(); window.location.replace('/login'); return; }
    var d; try { d = await res.json(); } catch (e) { d = {}; }
    if (!res.ok) { alert('Delete failed: ' + (d.error || ('HTTP ' + res.status))); return; }
    await loadUsers();
    alert('Deleted "' + pv.name + '" — ' + d.deleted_users + ' users and their data removed.');
  }

  /* ⚠⚠ THE NAME IS EDITABLE AT THE TOP CENTRE OF ITS BLOCK, AND THE SAVE MUST
     SAY WHETHER IT WORKED. This session has already shipped three silent-save
     defects — twice a render call that only fired on one view, and once a
     cached list re-rendering stale content over a successful write. So this one
     reports ✓ / ✗ inline and REVERTS the field on failure, the same contract
     saveUserField already honours, and never leaves the input showing a value
     the server did not accept. */
  function companyNameHtml(c, isOwnerViewer) {
    var shown = c.name || 'Unnamed company';
    if (!isOwnerViewer) {
      return '<div class="company-head"><div class="company-name-static'
        + (c.is_unnamed ? ' unnamed' : '') + '">' + escapeHtml(shown) + '</div></div>';
    }
    return '<div class="company-head">'
      + '<input class="company-name-input' + (c.is_unnamed ? ' unnamed' : '') + '"'
        + ' id="cn-' + escapeHtml(c.key) + '"'
        + ' value="' + escapeHtml(c.is_unnamed ? '' : shown) + '"'
        + ' placeholder="Unnamed company" maxlength="80" autocomplete="off"'
        + ' aria-label="Company name"'
        + ' onkeydown="if(event.key===\'Enter\'){event.preventDefault();this.blur();}"'

      + '<span class="field-status" id="cns-' + escapeHtml(c.key) + '"></span>'
      + '<div class="company-sub">' + (c.user_count || 0) + ' member' + ((c.user_count === 1) ? '' : 's') + '</div>'

  async function saveCompanyName(input, headId) {
    var status = document.getElementById('cns-' + headId);
    var company = null;
    for (var i = 0; i < companiesArray.length; i++) if (companiesArray[i].key === headId) company = companiesArray[i];
    var original = (company && !company.is_unnamed) ? company.name : '';
    var next = input.value.trim();
    if (next === original) return;

    function fail(msg) {
      input.value = original;                       // never show an unsaved value
      if (status) { status.textContent = '✗ ' + msg; status.className = 'field-status err'; }
    }
    if (status) { status.textContent = '…'; status.className = 'field-status'; }

    var res;
    try {
      res = await fetch('/admin/companies/' + encodeURIComponent(headId) + '/name', {
        method: 'PATCH',
        headers: Object.assign({ 'Content-Type': 'application/json' }, authHeader()),
        body: JSON.stringify({ name: next === '' ? null : next }),
      });
    } catch (e) { fail('network'); return; }
    if (res.status === 401) { clearSession(); window.location.replace('/login'); return; }
    if (!res.ok) {
      var err; try { err = await res.json(); } catch (e) { err = { error: 'HTTP ' + res.status }; }
      fail(err.error || 'failed'); return;
    }
    var data = await res.json();
    if (company) {
      company.name = data.display_name;
      company.is_unnamed = !data.team_name;
    }
    input.value = data.team_name || '';
    input.classList.toggle('unnamed', !data.team_name);
    if (status) {
      status.textContent = '✓'; status.className = 'field-status ok';
      setTimeout(function() { if (status) { status.textContent = ''; status.className = 'field-status'; } }, 1400);
    }
  }

  /* ⚠⚠ CREATING A COMPANY NEEDS A HEAD — a company IS a manager's team, so an
     ownerless one cannot exist. The head comes from SINGLE USERS: anyone
     already in a company is deliberately not offered, because taking them
     would silently remove them from their current company. That is a
     reassignment and belongs in "Managed by", not in a create flow. */
/* addCompanyBarHtml + submitAddCompany REMOVED 2026-08-24 — creation moved
   into the "+ Create user" flow. */
  var companyCreating = false;

  /* ⚠ Reports success AND failure. Three silent-save defects have shipped this
     session; a create that says nothing would be the fourth. */
  function renderUsersTable() {
    var wrap = document.getElementById('usersTableWrap');
    var isOwnerViewer = currentUser.role === 'owner';
    var btn = document.getElementById('btnCreateUser');
    if (btn) btn.style.display = isOwnerViewer ? '' : 'none';

        'No single users — everyone belongs to a company.');
    } else {
      body = companiesArray.length
        ? companiesArray.map(function(c) { return companyBlockHtml(c, isOwnerViewer, mgrs); }).join('')
        : '<div class="empty-msg">No companies yet. A company appears once a user has team members assigned to them.</div>';
    }
    wrap.classList.toggle('blocks', adminTab === 'companies');
    /* ⚠ THE INLINE "New company / headed by" BAR IS GONE (Justin, 2026-08-24):

  function fieldControl(u, field, original, opts) {
    return '<select class="role-select" data-original="' + escapeHtml(original) + '"'
      + ' onchange="saveUserField(this, \'' + field + '\', \'' + u.user_id + '\')">' + opts + '</select>'
      + '<span class="field-status" id="fs-' + field + '-' + escapeHtml(u.user_id) + '"></span>';
  }
  function roleControlHtml(u) {
    var opts = [['user', 'user'], ['manager', 'manager'], ['owner', 'admin (owner)']].map(function(o) {
      return '<option value="' + o[0] + '"' + (u.role === o[0] ? ' selected' : '') + '>' + o[1] + '</option>';
    }).join('');
    return fieldControl(u, 'role', u.role, opts);
  }
  /* ⚠⚠ THE COMPANY A USER BELONGS TO — and a HEAD belongs to their OWN company.
     A head has no `managed_by` (the column is who manages you, and nobody
     manages the head), so rendering that raw column printed "None — single
     user" for the person who RUNS the company. The grouping was never wrong:
     joshua@soberlivingriches.com has 8 reps and team_name "Sober Living Riches"
     and is bucketed correctly. The COLUMN was rendering a foreign key where a
     business fact belongs. */
  function companyOf(u) {
    if (!u) return null;
    for (var i = 0; i < companiesArray.length; i++) {
      var c = companiesArray[i];
      if (c.key === u.user_id) return { company: c, isHead: true };
      if (u.managed_by && c.key === u.managed_by) return { company: c, isHead: false };
    }
    return null;
  }

  function managedByControlHtml(u, mgrs) {
    var found = companyOf(u);

    /* ⚠ A HEAD GETS A STATIC LABEL, NOT A DROPDOWN, AND THAT IS THE DATA MODEL
       RATHER THAN A STYLING CHOICE. This control writes `managed_by`, and a
       head cannot be assigned into their own company — `no_self_manage` forbids
       managed_by = self. Offering a dropdown here would present a choice that
       cannot be made. They ARE the company; the cell says so. */
    if (found && found.isHead) {
      return '<span class="company-head-label" title="Heads this company">'
        + escapeHtml(found.company.name) + '</span>';
    }

    /* ⚠ COMPANIES BY NAME, not managers by email — the same rule the create-user
       modal already follows. Nobody outside the build knows which email is which
       company, and the value stays the head's id because that is what
       `managed_by` stores. ⚠ Falls back to the manager list only if the grouped
       payload is missing, so this can never render an empty picker. */
    var byName = companiesArray.filter(function(c) { return c.key !== u.user_id; }).map(function(c) {
      return '<option value="' + escapeHtml(c.key) + '"'
        + (u.managed_by === c.key ? ' selected' : '') + '>' + escapeHtml(c.name) + '</option>';
    }).join('');
    if (!byName) {
      byName = mgrs.filter(function(m) { return m.user_id !== u.user_id; }).map(function(m) {
        var lbl = (m.email || m.user_id.slice(0, 8)) + ' (' + roleLabel(m.role) + ')';
        return '<option value="' + escapeHtml(m.user_id) + '"' + (u.managed_by === m.user_id ? ' selected' : '') + '>' + escapeHtml(lbl) + '</option>';
      }).join('');
    }
    // ⚠ "None" stays a REAL state — an unaffiliated user genuinely has no company.
    var opts = '<option value="">None — single user</option>' + byName;
    return fieldControl(u, 'managed_by', u.managed_by || '', opts);
  }
  function billingControlHtml(u) {
    var cur = u.billing_status || 'trial';
    var opts = ['trial', 'active', 'past_due', 'canceled'].map(function(v) {
      return '<option value="' + v + '"' + (cur === v ? ' selected' : '') + '>' + v + '</option>';
    }).join('');
    return fieldControl(u, 'billing_status', cur, opts);
  }
  // ⚠ THE READ-ONLY CELL IS THE SAME FACT, so it resolves the same way — a head
  // reads as their company, not as a dash.
  function managedByLabel(u) {
    var found = companyOf(u);
    if (found) return '<span style="font-size:12px;">' + escapeHtml(found.company.name) + '</span>';
    if (!u.managed_by) return '<span style="font-size:12px;opacity:0.6;">— none</span>';
    var m = usersArray.filter(function(x) { return x.user_id === u.managed_by; })[0];
    return '<span style="font-size:12px;">' + escapeHtml(m ? (m.email || u.managed_by.slice(0, 8)) : u.managed_by.slice(0, 8)) + '</span>';
  }

  // Save-on-change for role / managed_by / billing_status. Inline ✓ / ✗ feedback;
  // reverts the dropdown to its previous value on any failure so the UI never
  // lies about persisted state.
  async function saveUserField(sel, field, userId) {
    var newVal = sel.value;
    var original = sel.dataset.original || '';
    if (newVal === original) return;
    var status = document.getElementById('fs-' + field + '-' + userId);
    function fail(msg) { sel.value = original; if (status) { status.textContent = '✗ ' + msg; status.className = 'field-status err'; } }

    // Client-side last-owner guard (UX only — the server enforces it too).
    if (field === 'role' && original === 'owner' && newVal !== 'owner' && ownerCount <= 1) { fail('last owner'); return; }
    if (status) { status.textContent = '…'; status.className = 'field-status'; }

    var endpoint = field === 'role' ? '/role' : (field === 'managed_by' ? '/managed_by' : '/billing_status');
    var payload = {}; payload[field] = (field === 'managed_by' && newVal === '') ? null : newVal;
    var res;
    try {
      res = await fetch('/admin/users/' + encodeURIComponent(userId) + endpoint, {
        method: 'PATCH', headers: Object.assign({ 'Content-Type': 'application/json' }, authHeader()), body: JSON.stringify(payload),
      });
    } catch (e) { fail('network'); return; }
    if (res.status === 401) { clearSession(); window.location.replace('/login'); return; }
    if (!res.ok) { var err; try { err = await res.json(); } catch (e) { err = { error: 'HTTP ' + res.status }; } fail(err.error || 'failed'); return; }
    var data = await res.json();
    var idx = -1; for (var i = 0; i < usersArray.length; i++) { if (usersArray[i].user_id === userId) { idx = i; break; } }
    var savedVal = (field === 'managed_by') ? (data.managed_by || null) : data[field];
    if (idx !== -1) usersArray[idx][field] = savedVal;
    sel.dataset.original = savedVal || '';
    if (status) { status.textContent = '✓'; status.className = 'field-status ok'; setTimeout(function() { if (status) { status.textContent = ''; status.className = 'field-status'; } }, 1400); }
    // Role changes can alter ownerCount + the manager option lists — re-render.
    if (field === 'role') { ownerCount = usersArray.filter(function(u) { return u.role === 'owner'; }).length; renderUsersTable(); }
  }

  // openCreateUserModal / submitCreateUser / copyTempPassword / closeCreateUserModal
  function openCreateUserModal() {
    document.getElementById('createUserForm').style.display = '';
    document.getElementById('createUserSuccess').style.display = 'none';
    document.getElementById('cuFirstName').value = '';
    document.getElementById('cuLastName').value = '';
    document.getElementById('cuEmail').value = '';
    document.getElementById('cuRole').value = 'user';
    var mb = document.getElementById('cuManagedBy');
    /* ⚠ COMPANIES BY NAME, not managers by email. The admin is choosing which
       company someone joins; making them recognise the right manager's email
       is asking them to hold a mapping the product already knows.
       ⚠ Falls back to the manager list only if the grouped payload is missing,
       so this can never render an empty picker. */
    var companyOpts = (companiesArray.length ? companiesArray : []).map(function(c) {
      return '<option value="' + escapeHtml(c.key) + '">' + escapeHtml(c.name) + '</option>';
    }).join('');
    if (!companyOpts) {
      companyOpts = managersList().map(function(m) {
        return '<option value="' + escapeHtml(m.user_id) + '">' + escapeHtml(m.email || m.user_id.slice(0, 8)) + '</option>';
      }).join('');
    }
    mb.innerHTML = '<option value="">None — single user</option>' + companyOpts
      + '<option value="' + NEW_COMPANY + '">+ New company…</option>';
    var ncw = document.getElementById('cuNewCompanyWrap');
    if (ncw) ncw.style.display = 'none';
    var nc = document.getElementById('cuNewCompany');

  function closeCreateUserModal() {
    document.getElementById('createUserModal').style.display = 'none';
    document.getElementById('cuTempPw').textContent = '';  // never leave the temp password in the DOM
    document.getElementById('cuEmail').value = '';
  }
  var NEW_COMPANY = '__new__';

  function onCreateCompanyChange() {
    var wrap = document.getElementById('cuNewCompanyWrap');
    var sel = document.getElementById('cuManagedBy');
    if (!wrap || !sel) return;
    var creating = sel.value === NEW_COMPANY;
    wrap.style.display = creating ? '' : 'none';
    /* ⚠ Heading a company requires manager|owner — the server refuses a plain
       `user` as a head, and PATCH managed_by refuses one as a target. Forcing
       it here means the create cannot fail on a rule the admin never saw. */
    if (creating) {
      var role = document.getElementById('cuRole');
      if (role && role.value === 'user') role.value = 'manager';
    }
  }

  async function submitCreateUser() {
    var firstName = document.getElementById('cuFirstName').value.trim();
    var lastName = document.getElementById('cuLastName').value.trim();
    var email = document.getElementById('cuEmail').value.trim();
    var role = document.getElementById('cuRole').value;
    var companyChoice = document.getElementById('cuManagedBy').value || '';
    var makingCompany = companyChoice === NEW_COMPANY;
    var managed_by = makingCompany ? null : (companyChoice || null);
    var newCompanyName = makingCompany
      ? (document.getElementById('cuNewCompany').value || '').trim() : '';
    var err = document.getElementById('cuError');
    var sub = document.getElementById('cuSubmit');
    err.classList.add('hidden');
    // Mirror the server rules: names required, 1-60 chars.
    if (!firstName || firstName.length > 60) { err.textContent = 'First name is required (1-60 chars).'; err.classList.remove('hidden'); return; }
    if (!lastName || lastName.length > 60) { err.textContent = 'Last name is required (1-60 chars).'; err.classList.remove('hidden'); return; }
    if (!email || email.indexOf('@') === -1) { err.textContent = 'A valid email is required.'; err.classList.remove('hidden'); return; }
    // ⚠ Caught BEFORE the user is created — otherwise a missing name leaves a
    // real account behind with no company, and the admin sees only an error.
    if (makingCompany && !newCompanyName) { err.textContent = 'A company needs a name.'; err.classList.remove('hidden'); return; }
    sub.disabled = true; sub.textContent = 'Creating…';
    var res;
    try {
      res = await fetch('/admin/users', { method: 'POST', headers: Object.assign({ 'Content-Type': 'application/json' }, authHeader()), body: JSON.stringify({ email: email, role: role, managed_by: managed_by, first_name: firstName, last_name: lastName }) });
    } catch (e) { sub.disabled = false; sub.textContent = 'Create'; err.textContent = 'Could not reach server.'; err.classList.remove('hidden'); return; }
    if (res.status === 401) { clearSession(); window.location.replace('/login'); return; }
    if (!res.ok) { var e2; try { e2 = await res.json(); } catch (x) { e2 = { error: 'HTTP ' + res.status }; } sub.disabled = false; sub.textContent = 'Create'; err.textContent = e2.error || 'Failed to create user'; err.classList.remove('hidden'); return; }
    var data = await res.json();

    /* ⚠ THE USER EXISTS BY NOW. If the company step fails, say so plainly
       rather than reporting a clean success — the account is real either way,
       and silently dropping the company is the kind of half-success this
       session has spent four blocks removing. */
    if (makingCompany && data.user_id) {
      try {
        var cr = await fetch('/admin/companies', {
          method: 'POST',
          headers: Object.assign({ 'Content-Type': 'application/json' }, authHeader()),
          body: JSON.stringify({ head_id: data.user_id, name: newCompanyName }),
        });
        if (!cr.ok) {
          var ce; try { ce = await cr.json(); } catch (x) { ce = {}; }
          err.textContent = 'User created, but the company was not: '
            + (ce.error || ('HTTP ' + cr.status)) + ' — name it from its block.';
          err.classList.remove('hidden');
        }
      } catch (e3) {
        err.textContent = 'User created, but the company was not (network). Name it from its block.';
        err.classList.remove('hidden');
      }
    }

    document.getElementById('cuTempPw').textContent = data.temp_password || '';
    // Invite-first presentation: on invite_sent the temp password stays
    // hidden (the user sets their own via the emailed link). On failure or
    // unconfigured email, the temp-password box IS the fallback, exactly as
    // the pre-email flow worked.
    var es = document.getElementById('cuEmailStatus');
    var pwBox = document.querySelector('#createUserSuccess .temp-pw-box');
    var msg = document.querySelector('#createUserSuccess .cu-created-msg');
    var inviteSent = data.welcome_email === 'invite_sent';
    if (pwBox) pwBox.style.display = inviteSent ? 'none' : '';
    if (msg) msg.innerHTML = inviteSent
      ? 'User created.'
      : 'User created. Share this temporary password with them now — <strong>it will not be shown again.</strong>';
    if (es) {
      if (inviteSent) { es.textContent = '✓ Invite sent — they\'ll set their own password from the email.'; es.style.color = 'var(--good)'; }
      else if (data.welcome_email === 'failed') { es.textContent = '\u2717 We could not email them. Give them the temporary password below.'; es.style.color = 'var(--bad)'; }
      else { es.textContent = 'Email is not set up yet. Give them the temporary password below.'; es.style.color = 'var(--text-muted)'; }
    }
    document.getElementById('createUserForm').style.display = 'none';
    document.getElementById('createUserSuccess').style.display = '';
    loadUsers();   // refresh the table with the new user
  }
  // Owner-only resend: mints a FRESH set-password link server-side and sends
  // the welcome email again. Button reports status inline; failures never
  // block anything (same isolation as creation).
  async function resendWelcomeEmail(btn, userId) {
    var original = btn.textContent;
    btn.disabled = true; btn.textContent = 'Sending…';
    var res;
    try {
      res = await fetch('/admin/users/' + encodeURIComponent(userId) + '/welcome-email', { method: 'POST', headers: authHeader() });
    } catch (e) { btn.disabled = false; btn.textContent = 'Retry — no server'; return; }
    if (res.status === 401) { clearSession(); window.location.replace('/login'); return; }
    var data = null; try { data = await res.json(); } catch (e) {}
    var status = data && data.welcome_email;
    btn.disabled = false;
    if (status === 'invite_sent') { btn.textContent = '✓ Invite sent'; setTimeout(function () { btn.textContent = original; }, 4000); }
    else if (status === 'not_configured') { btn.textContent = 'Email not configured'; }
    else { btn.textContent = '✗ Failed — retry'; }
  }

  // Full member actions in /admin (owner console). Hit the SAME endpoints and
  // gates as Team → Manage members — no new permission paths. Delete keeps the
  // server-side zero-history rule (type-email confirm; backend rejects if the rep
  // has call history → deactivate instead).
  async function adminUserAction(url, opts) {
    try {
      var res = await fetch(url, Object.assign({ headers: Object.assign({ 'Content-Type': 'application/json' }, authHeader()) }, opts || {}));
      if (res.status === 401) { clearSession(); window.location.replace('/login'); return { ok: false }; }
      var d = null; try { d = await res.json(); } catch (e) {}
      if (!res.ok) { alert((d && d.error) || ('Request failed (HTTP ' + res.status + ')')); return { ok: false, data: d }; }
      return { ok: true, data: d };
    } catch (err) { alert('Request failed: ' + (err.message || 'unknown')); return { ok: false }; }
  }
  async function adminDeactivate(uid) {
    if (!(await scoutConfirm({ title: 'Deactivate this user?', body: 'They can’t log in and the seat is freed.\nTheir calls and history stay.', confirmText: 'Deactivate', danger: true }))) return;
    var r = await adminUserAction('/admin/users/' + encodeURIComponent(uid) + '/deactivate', { method: 'POST', body: '{}' });
    if (r.ok) loadUsers();
  }
  async function adminReactivate(uid) {
    if (!(await scoutConfirm({ title: 'Reactivate this user?', body: 'This adds a billable seat and restores their login.', confirmText: 'Reactivate' }))) return;
    var r = await adminUserAction('/admin/users/' + encodeURIComponent(uid) + '/reactivate', { method: 'POST', body: '{}' });
    if (r.ok) loadUsers();
  }
  async function adminDelete(uid, email) {
    /* ⚠⚠ THE WARNING TEXT COMES FROM THE SERVER, from the SAME plan the delete
       route acts on — exactly as the members table already did. The hardcoded
       string this replaces had gone STALE and was actively false: it said
       "(Only allowed if they have no call history — otherwise deactivate
       instead.)" when the deletion ruling had already removed that gate and
       made a delete take the calls with it. A stale warning on an irreversible
       action is worse than no warning, because it is read and believed. */
    var pre = await adminUserAction('/admin/users/' + encodeURIComponent(uid) + '/delete-preview', { method: 'GET' });
    if (!pre.ok) return;
    var p = pre.data || {};
    if (p.mode === 'blocked') { alert(p.reason || 'This user cannot be deleted yet.'); return; }
    var body = p.confirmation
      || ('Delete ' + (p.email || email || 'this user') + '?\n\nThis cannot be undone.');
    if (!(await scoutConfirm({ title: 'Delete this user?', body: body, confirmText: 'Delete', danger: true }))) return;
    var r = await adminUserAction('/admin/users/' + encodeURIComponent(uid), { method: 'DELETE', body: '{}' });
    if (r.ok) { alert('User deleted.'); loadUsers(); }
  }

  function copyTempPassword() {
    var t = document.getElementById('cuTempPw').textContent;
    if (navigator.clipboard) navigator.clipboard.writeText(t);
  }


  function handleRoleChange(event, userId) {
    var select = event.target;
    var newRole = select.value;
    var originalRole = select.dataset.originalRole;
    var saveBtn = document.querySelector('.role-save[data-user-id="' + cssEsc(userId) + '"]');
    var warn = document.getElementById('warn-' + userId);

    if (newRole === originalRole) {
      if (saveBtn) saveBtn.disabled = true;
      if (warn) { warn.textContent = ''; warn.classList.add('hidden'); }
      return;
    }

    // Client-side last-owner guard (UX only — server is authoritative).
    if (originalRole === 'owner' && newRole !== 'owner' && ownerCount <= 1) {
      if (saveBtn) saveBtn.disabled = true;
      if (warn) { warn.textContent = 'Cannot demote the last owner'; warn.classList.remove('hidden'); }
      return;
    }

    if (saveBtn) saveBtn.disabled = false;
    if (warn) { warn.textContent = ''; warn.classList.add('hidden'); }
  }

  async function handleSaveRole(userId) {
    var select = document.querySelector('.role-select[data-user-id="' + cssEsc(userId) + '"]');
    var saveBtn = document.querySelector('.role-save[data-user-id="' + cssEsc(userId) + '"]');
    var savedPill = document.getElementById('saved-' + userId);
    var warn = document.getElementById('warn-' + userId);
    if (!select || !saveBtn) return;

    var newRole = select.value;
    saveBtn.disabled = true;
    saveBtn.textContent = 'Saving…';

    var res;
    try {
      res = await fetch('/admin/users/' + encodeURIComponent(userId) + '/role', {
        method: 'PATCH',
        headers: Object.assign({ 'Content-Type': 'application/json' }, authHeader()),
        body: JSON.stringify({ role: newRole }),
      });
    } catch (err) {
      saveBtn.textContent = 'Save';
      saveBtn.disabled = false;
      if (warn) { warn.textContent = 'Could not reach server.'; warn.classList.remove('hidden'); }
      return;
    }

    if (res.status === 401) { clearSession(); window.location.replace('/login'); return; }
    if (!res.ok) {
      var err; try { err = await res.json(); } catch (e) { err = { error: 'HTTP ' + res.status }; }
      saveBtn.textContent = 'Save';
      saveBtn.disabled = false;
      if (warn) { warn.textContent = err.error || 'Failed to update role'; warn.classList.remove('hidden'); }
      return;
    }

    var data = await res.json();
    select.dataset.originalRole = data.role;
    saveBtn.textContent = 'Save';
    saveBtn.disabled = true;
    if (warn) { warn.textContent = ''; warn.classList.add('hidden'); }
    if (savedPill) {
      savedPill.classList.add('show');
      setTimeout(function() { savedPill.classList.remove('show'); }, 1600);
    }

    // Update local state and re-render so ownerCount / warnings on OTHER rows refresh.
    var idx = -1;
    for (var i = 0; i < usersArray.length; i++) { if (usersArray[i].user_id === userId) { idx = i; break; } }
    if (idx !== -1) {
      usersArray[idx].role = data.role;
      ownerCount = usersArray.filter(function(u) { return u.role === 'owner'; }).length;
      renderUsersTable();
    }
  }


  // ── Formatters ──────────────────────────────────────────────────────────
  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }
  function cssEsc(s) {
    if (window.CSS && CSS.escape) return CSS.escape(s);
    return String(s).replace(/[^a-zA-Z0-9_-]/g, '\\$&');
  }



  // ── Knowledge Base ──────────────────────────────────────────────────────
  // Identical to dashboard.html. Backend scopes /kb/list by role: admins
  // see their own + their team's uploads; owners see every uploaded entry.
  // Each row's scope badge surfaces the difference visually.
  init();
</script>
