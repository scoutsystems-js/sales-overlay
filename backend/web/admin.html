<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin — Scout Systems</title>
  <link rel="stylesheet" href="/css/style.css"/>
  <style>
    /* Three-section admin layout:
         A — user management (top, full width)
         B — session list    (bottom left)
         C — log detail      (bottom right)
       Below 900px the B/C split stacks. Styles live inline here (matches
       the login.html / dashboard.html pattern). */

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
    }

    .admin-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 24px;
      border-bottom: 1px solid var(--border);
      background: rgba(8,11,13,0.95);
    }
    .admin-top-left { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 700; }
    .admin-top-right { display: flex; align-items: center; gap: 16px; font-size: 13px; color: var(--muted); }
    .admin-top-right .signout { cursor: pointer; }
    .admin-top-right .signout:hover { color: var(--text); }

    .admin-page {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    /* ── SECTION A: users ────────────────────────────────────────────────── */
    .users-section {
      padding: 20px 24px 12px;
      flex-shrink: 0;
    }
    .users-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      gap: 12px;
      flex-wrap: wrap;
    }
    .users-header h2 {
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--muted);
    }
    .btn-add-user {
      font-size: 13px;
      font-weight: 600;
      padding: 7px 14px;
      border-radius: 7px;
      border: 1px dashed var(--border);
      background: transparent;
      color: var(--muted);
      cursor: not-allowed;
      opacity: 0.55;
      font-family: inherit;
    }
    .btn-add-user:hover { opacity: 0.7; }

    .users-table-wrap {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: auto;
      max-height: 320px;
    }
    .users-table {
      width: 100%;
      border-collapse: collapse;
    }
    .users-table th {
      text-align: left;
      padding: 10px 16px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      background: rgba(0,0,0,0.15);
      position: sticky;
      top: 0;
    }
    .users-table td {
      padding: 11px 16px;
      font-size: 13px;
      border-bottom: 1px solid var(--border);
      color: var(--text);
      vertical-align: middle;
    }
    .users-table tr:last-child td { border-bottom: none; }
    .users-table tr.clickable { cursor: pointer; }
    .users-table tr.clickable:hover td { background: rgba(255,255,255,0.02); }
    .users-table tr.active td {
      background: rgba(34,197,94,0.06);
      box-shadow: inset 2px 0 0 var(--green);
    }

    .role-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 6px;
      text-transform: lowercase;
      letter-spacing: 0.3px;
    }
    .role-badge.owner { background: rgba(34,197,94,0.15); color: var(--green); }
    .role-badge.admin { background: rgba(59,130,246,0.15); color: #60a5fa; }
    .role-badge.user  { background: rgba(255,255,255,0.06); color: var(--muted); }
    .role-badge .self-tag {
      font-size: 10px;
      color: var(--muted);
      margin-left: 6px;
      font-weight: 500;
      text-transform: none;
      letter-spacing: 0;
    }

    .role-select {
      font-size: 12px;
      padding: 4px 8px;
      border-radius: 6px;
      background: var(--bg3);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: inherit;
      cursor: pointer;
    }
    .role-select:focus { outline: none; border-color: var(--green); }

    .role-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .role-save {
      font-size: 11px;
      font-weight: 700;
      padding: 5px 10px;
      border-radius: 6px;
      background: var(--green);
      color: #000;
      border: none;
      cursor: pointer;
      font-family: inherit;
    }
    .role-save:hover:not(:disabled) { background: var(--green-dark); }
    .role-save:disabled { opacity: 0.35; cursor: not-allowed; background: var(--bg3); color: var(--muted); }
    .role-warning {
      font-size: 11px;
      color: #fbbf24;
      width: 100%;
      margin-top: 2px;
      display: block;
    }
    .role-warning.hidden { display: none; }
    .role-saved {
      font-size: 11px;
      color: var(--green);
      font-weight: 600;
      opacity: 0;
      transition: opacity 0.15s;
    }
    .role-saved.show { opacity: 1; }

    /* ── SECTIONS B + C ──────────────────────────────────────────────────── */
    .sessions-split {
      flex: 1;
      min-height: 0;
      display: flex;
      margin: 0 24px 24px;
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }
    .sessions-pane {
      width: 420px;
      flex-shrink: 0;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      background: var(--bg2);
    }
    .sessions-pane-header {
      padding: 12px 18px;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .sessions-pane-header #sessionsScope {
      text-transform: none;
      letter-spacing: 0;
      color: var(--text);
      font-weight: 600;
    }
    .reset-filter {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 3px 8px;
      cursor: pointer;
      font-family: inherit;
    }
    .reset-filter:hover { color: var(--text); }
    .reset-filter.hidden { display: none; }

    .sessions-list { flex: 1; overflow-y: auto; }
    .session-card {
      padding: 12px 18px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      border-left: 2px solid transparent;
      transition: background 0.1s, border-color 0.1s;
    }
    .session-card:hover { background: rgba(255,255,255,0.02); }
    .session-card.active { background: rgba(34,197,94,0.06); border-left-color: var(--green); }
    .session-card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .session-card-email {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 260px;
    }
    .session-card-meta { font-size: 12px; color: var(--muted); margin-bottom: 3px; }
    .session-card-tail { font-size: 11px; color: var(--muted); }
    .session-card-tail .err { color: #f87171; font-weight: 600; }
    .load-more {
      padding: 12px 18px;
      text-align: center;
      font-size: 13px;
      color: var(--muted);
      cursor: pointer;
      border-top: 1px solid var(--border);
      background: var(--bg2);
    }
    .load-more:hover { color: var(--text); }
    .load-more.hidden { display: none; }
    .empty-msg { padding: 24px 20px; font-size: 13px; color: var(--muted); text-align: center; }

    .detail-pane { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--bg); }
    .detail-header {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      flex-wrap: wrap;
    }
    .detail-header-left h3 { font-size: 14px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
    .detail-header-left .sub { font-size: 12px; color: var(--muted); }

    .filter-bar {
      padding: 10px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      background: var(--bg2);
    }
    .chip {
      font-size: 11px;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: 99px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-family: inherit;
      transition: all 0.12s;
    }
    .chip:hover { color: var(--text); border-color: rgba(255,255,255,0.2); }
    .chip.active { background: var(--green-dim); color: var(--green); border-color: rgba(34,197,94,0.3); }
    .filter-search {
      flex: 1;
      min-width: 160px;
      max-width: 320px;
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 6px;
      background: var(--bg3);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: inherit;
      outline: none;
    }
    .filter-search:focus { border-color: var(--green); }
    .count-indicator { font-size: 11px; color: var(--muted); margin-left: auto; white-space: nowrap; }
    .count-indicator.capped { color: #fbbf24; }

    .log-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      line-height: 1.5;
    }
    .log-row {
      display: grid;
      grid-template-columns: 96px 14px 110px 1fr;
      gap: 10px;
      padding: 3px 20px;
      align-items: start;
    }
    .log-row:hover { background: rgba(255,255,255,0.02); }
    .log-time { color: var(--muted); }
    .log-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); margin-top: 6px; justify-self: center; }
    .log-dot.warn { background: #fbbf24; }
    .log-dot.error { background: #f87171; }
    .log-tag { color: var(--green); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .log-msg { color: var(--text); white-space: pre-wrap; word-break: break-word; }
    .log-row.error .log-msg { color: #fca5a5; }

    .detail-placeholder { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 14px; }

    .spinner {
      width: 18px; height: 18px;
      border: 2px solid var(--border);
      border-top-color: var(--green);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: inline-block;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Detail header right (outcome + download) ────────────────────────── */
    .detail-header-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    .btn-download {
      font-size: 11px;
      font-weight: 600;
      padding: 5px 11px;
      border-radius: 6px;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      cursor: pointer;
      font-family: inherit;
      transition: color 0.12s, border-color 0.12s;
    }
    .btn-download:hover { color: var(--text); border-color: rgba(255,255,255,0.2); }

    /* ── View tabs (logs vs transcript) ──────────────────────────────────── */
    .view-tabs {
      display: flex;
      padding: 0 20px;
      border-bottom: 1px solid var(--border);
      background: var(--bg2);
      flex-shrink: 0;
    }
    .view-tab {
      font-size: 12px;
      font-weight: 600;
      padding: 9px 16px;
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--muted);
      cursor: pointer;
      font-family: inherit;
      transition: color 0.12s, border-color 0.12s;
    }
    .view-tab:hover { color: var(--text); }
    .view-tab.active { color: var(--green); border-bottom-color: var(--green); }

    /* The two view containers each fill the remaining detail-pane height. */
    #logView, #transcriptView {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    /* ── Transcript view ─────────────────────────────────────────────────── */
    .transcript-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      line-height: 1.55;
    }
    .transcript-row { padding: 8px 20px; }
    .transcript-row.prospect { background: rgba(255,255,255,0.015); }
    .transcript-row.closer { background: rgba(34,197,94,0.04); }
    .transcript-row.scout {
      background: rgba(34,197,94,0.06);
      border-left: 2px solid var(--green);
      padding: 8px 20px 10px 18px;
    }
    .t-time { color: var(--muted); margin-right: 6px; }
    .t-speaker { color: var(--green); font-weight: 700; margin-right: 6px; }
    .t-text { color: var(--text); white-space: pre-wrap; word-break: break-word; }
    .scout-head { color: var(--muted); }
    .t-scout-label { color: var(--green); font-weight: 700; }
    .scout-body { padding-left: 13px; padding-top: 4px; }
    .scout-headline { color: var(--muted); font-size: 11px; margin-bottom: 2px; }
    .scout-text { color: var(--text); white-space: pre-wrap; word-break: break-word; }

    @media (max-width: 900px) {
      .sessions-split { flex-direction: column; margin: 0 16px 16px; }
      .sessions-pane { width: 100%; max-height: 50vh; border-right: none; border-bottom: 1px solid var(--border); }
      .users-section { padding: 16px 16px 10px; }
      .users-table { white-space: nowrap; }
    }

    /* ── Knowledge Base section ─────────────────────────────────────────── */
    /* Utility classes used by KB markup that don't otherwise exist in this
       page — kept scoped to the KB block so the dashboard.html copy stays
       identical and we don't touch other admin styling. */
    .kb-section {
      padding: 24px 24px 16px;
      border-bottom: 1px solid var(--border);
    }
    .kb-section .section-heading {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--muted);
      margin-bottom: 0;
    }
    .kb-section .load-spinner { display: flex; justify-content: center; padding: 28px 0; }
    .kb-section .load-spinner .spinner { width: 22px; height: 22px; }
    .kb-section .msg-error { padding: 16px 20px; font-size: 12px; color: #f87171; text-align: center; font-family: inherit; }
    .kb-section .empty-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 32px 24px;
      text-align: center;
    }
    .kb-section .empty-card h2 { font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 8px; }
    .kb-section .empty-card p { font-size: 13px; color: var(--muted); margin-bottom: 18px; }

    .kb-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }
    .kb-add-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--green);
      color: #000;
      font-weight: 700;
      font-size: 13px;
      padding: 8px 14px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s;
    }
    .kb-add-btn:hover { background: var(--green-dark); }
    .kb-add-btn:disabled { opacity: 0.6; cursor: wait; }

    .kb-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .kb-item {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      transition: border-color 0.12s;
    }
    .kb-item:hover { border-color: rgba(255,255,255,0.14); }
    .kb-item-main { display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1; }
    .kb-item-title {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      word-break: break-all;
    }
    .kb-item-sub {
      font-size: 12px;
      color: var(--muted);
    }
    .kb-badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      padding: 2px 8px;
      border-radius: 99px;
      border: 1px solid var(--border);
    }
    .kb-badge.kb-type-url   { color: #93c5fd; border-color: rgba(147,197,253,0.3); background: rgba(59,130,246,0.10); }
    .kb-badge.kb-type-pdf   { color: #fca5a5; border-color: rgba(252,165,165,0.3); background: rgba(239,68,68,0.10); }
    .kb-badge.kb-type-paste { color: #d4d4d8; border-color: rgba(212,212,216,0.25); background: rgba(255,255,255,0.04); }
    /* Category badges — visually distinct from type badges (cooler hues:
       teal for offer docs, purple for transcripts) so users can tell the
       two at a glance even though they sit side-by-side. */
    .kb-badge.kb-cat-offer_document { color: #5eead4; border-color: rgba(94,234,212,0.3); background: rgba(20,184,166,0.10); }
    .kb-badge.kb-cat-winning_call   { color: #c4b5fd; border-color: rgba(196,181,253,0.3); background: rgba(139,92,246,0.10); }
    .kb-badge.kb-scope-global   { color: #fcd34d; border-color: rgba(252,211,77,0.3); background: rgba(234,179,8,0.10); }
    .kb-badge.kb-scope-team     { color: #86efac; border-color: rgba(134,239,172,0.3); background: rgba(34,197,94,0.10); }
    .kb-badge.kb-scope-personal { color: var(--muted); }
    .kb-delete-btn {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.12s;
      flex-shrink: 0;
    }
    .kb-delete-btn:hover { color: #fca5a5; border-color: rgba(252,165,165,0.4); }
    .kb-delete-btn:disabled { opacity: 0.5; cursor: wait; }

    /* View patterns button — same shell as delete button, neutral hover.
       Sits to the LEFT of delete in the kb-item flex row. Only emitted
       for items where category === 'learned_pattern'; everything else
       has just the delete button as before. */
    .kb-view-btn {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.12s;
      flex-shrink: 0;
      margin-right: 6px;
    }
    .kb-view-btn:hover { color: var(--text); border-color: rgba(255,255,255,0.2); }

    /* Expand panel — sibling of the kb-item, slightly indented and using
       a deeper bg so the hierarchy reads at a glance. */
    .kb-expand-panel {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 10px;
      margin: -2px 0 0 24px;
      padding: 14px 16px;
    }
    .kb-expand-panel.hidden { display: none; }
    .kb-pattern-loading,
    .kb-pattern-empty { font-size: 12px; color: var(--muted); padding: 8px 0; text-align: center; }
    .kb-pattern-card {
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 8px;
    }
    .kb-pattern-card:last-child { margin-bottom: 0; }
    .kb-pattern-row { font-size: 12px; line-height: 1.5; margin-top: 6px; }
    .kb-pattern-row b { color: var(--muted); display: inline-block; min-width: 130px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px; font-size: 10px; vertical-align: top; }
    .kb-pattern-text { color: var(--text); }
    .kb-pattern-empty-text { font-size: 13px; color: var(--text); white-space: pre-wrap; }
    /* Pattern type badges — distinct from the source-type/category/scope
       badges above so the eye reads them as a separate vocabulary. */
    .kb-badge.kb-ptype-pain_discovery   { color: #fca5a5; border-color: rgba(252,165,165,0.3); background: rgba(239,68,68,0.10); }
    .kb-badge.kb-ptype-objection_handle { color: #fcd34d; border-color: rgba(252,211,77,0.3); background: rgba(234,179,8,0.10); }
    .kb-badge.kb-ptype-closing_move     { color: #86efac; border-color: rgba(134,239,172,0.3); background: rgba(34,197,94,0.10); }
    .kb-badge.kb-ptype-rapport_build    { color: #93c5fd; border-color: rgba(147,197,253,0.3); background: rgba(59,130,246,0.10); }

    /* ── Modal ──────────────────────────────────────────────────────────── */
    .kb-modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .kb-modal.hidden { display: none; }
    .kb-modal-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.65);
      backdrop-filter: blur(2px);
    }
    .kb-modal-dialog {
      position: relative;
      width: 100%;
      max-width: 520px;
      max-height: calc(100vh - 48px);
      overflow-y: auto;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 28px;
    }
    .kb-modal-dialog h2 {
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 18px;
    }
    .kb-modal-close {
      position: absolute;
      top: 12px;
      right: 12px;
      background: transparent;
      color: var(--muted);
      border: none;
      width: 28px;
      height: 28px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      font-family: inherit;
    }
    .kb-modal-close:hover { color: var(--text); background: rgba(255,255,255,0.06); }

    .kb-form-row { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
    .kb-form-label { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.4px; }
    .kb-form-row input[type="text"],
    .kb-form-row select {
      width: 100%;
      background: var(--bg3);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      padding: 10px 12px;
      border-radius: 8px;
      outline: none;
      box-sizing: border-box;
    }
    .kb-form-row input:focus,
    .kb-form-row select:focus { border-color: var(--green); }
    .kb-form-row select { cursor: pointer; appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 16px) 50%, calc(100% - 11px) 50%; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; padding-right: 32px; }

    .kb-tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 18px;
      border-bottom: 1px solid var(--border);
    }
    .kb-tab {
      background: transparent;
      color: var(--muted);
      border: none;
      border-bottom: 2px solid transparent;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.12s;
      margin-bottom: -1px;
    }
    .kb-tab:hover { color: var(--text); }
    .kb-tab.active {
      color: var(--green);
      border-bottom-color: var(--green);
    }

    .kb-tab-panel { display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px; }
    .kb-tab-panel.hidden { display: none; }
    .kb-tab-panel input[type="text"],
    .kb-tab-panel input[type="url"],
    .kb-tab-panel input[type="file"],
    .kb-tab-panel textarea {
      width: 100%;
      background: var(--bg3);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      padding: 10px 12px;
      border-radius: 8px;
      outline: none;
      box-sizing: border-box;
    }
    .kb-tab-panel input:focus,
    .kb-tab-panel textarea:focus { border-color: var(--green); }
    .kb-tab-panel textarea { resize: vertical; min-height: 140px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .kb-tab-panel input[type="file"] { padding: 8px 12px; cursor: pointer; }

    .kb-status {
      font-size: 12px;
      min-height: 18px;
      margin-bottom: 12px;
      color: var(--muted);
    }
    .kb-status.error { color: #f87171; }
    .kb-status.progress { color: var(--green); }

    .kb-submit {
      width: 100%;
      background: var(--green);
      color: #000;
      font-weight: 700;
      font-size: 14px;
      padding: 12px 20px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s;
    }
    .kb-submit:hover:not(:disabled) { background: var(--green-dark); }
    .kb-submit:disabled { opacity: 0.6; cursor: wait; }

    @media (max-width: 900px) {
      .kb-section { padding: 16px 16px 10px; }
      .kb-modal { padding: 12px; }
      .kb-modal-dialog { padding: 20px; }
      .kb-item { flex-direction: column; align-items: flex-start; }
      .kb-delete-btn { align-self: flex-end; }
    }

    /* v1.1.10: User analytics widget. Mirrors the dashboard.html analytics
       block. Duplicated rather than extracted to a shared CSS file because
       admin.html uses its own --bg2/--muted set and the two pages may diverge
       visually in future. Extract to /css/analytics.css if it grows. */
    .analytics-section { margin: 24px 0; }
    .analytics-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; gap: 16px; flex-wrap: wrap; }
    .analytics-header h2 { margin: 0; font-size: 18px; font-weight: 600; }
    .analytics-controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .analytics-controls select {
      background: var(--bg2); border: 1px solid #2a2a2a; color: inherit;
      padding: 6px 28px 6px 10px; border-radius: 6px; font-size: 13px;
      font-family: inherit; min-width: 220px;
    }
    .analytics-empty {
      background: var(--bg2); border: 1px solid #2a2a2a; border-radius: 8px;
      padding: 32px; text-align: center; color: var(--muted); font-size: 13px;
    }
    .date-presets { display: flex; gap: 6px; flex-wrap: wrap; }
    .date-preset {
      background: var(--bg2); border: 1px solid #2a2a2a; color: var(--muted);
      padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer;
      font-family: inherit;
    }
    .date-preset:hover { background: #2a2a2a; color: inherit; }
    .date-preset.active { background: #2a2a2a; color: inherit; border-color: #4a9eff; }

    .stats-row {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px; margin-bottom: 24px;
    }
    .stat-card {
      background: var(--bg2); border: 1px solid #2a2a2a; border-radius: 8px;
      padding: 14px 16px;
    }
    .stat-card .stat-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .stat-card .stat-value { font-size: 24px; font-weight: 600; margin-top: 4px; }
    .stat-card .stat-sub { font-size: 11px; color: var(--muted); margin-top: 4px; }

    .objection-section { margin-bottom: 24px; }
    .objection-totals { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
    .objection-table {
      width: 100%; border-collapse: collapse;
      background: var(--bg2); border-radius: 8px; overflow: hidden;
    }
    .objection-table th, .objection-table td {
      padding: 10px 14px; text-align: left; font-size: 13px;
      border-bottom: 1px solid #2a2a2a;
    }
    .objection-table th {
      background: #1a1a1a; color: var(--muted); font-weight: 500;
      font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px;
    }
    .objection-table tr:last-child td { border-bottom: none; }
    .objection-table .pct-cell { font-weight: 600; }
    .pct-good { color: #4ade80; }
    .pct-mid  { color: #facc15; }
    .pct-bad  { color: #f87171; }
    .pct-none { color: var(--muted); }
  </style>
</head>
<body>

<nav class="admin-top">
  <div class="admin-top-left">
    <svg width="20" height="22" viewBox="0 0 20 22" xmlns="http://www.w3.org/2000/svg">
      <path d="M1.5 12 A8.5 8.5 0 0 1 18.5 12" stroke="#22c55e" stroke-width="1.6" stroke-linecap="round" fill="none"/>
      <path d="M4.5 12 A5.5 5.5 0 0 1 15.5 12" stroke="#22c55e" stroke-width="1.6" stroke-linecap="round" fill="none"/>
      <path d="M7.5 12 A2.5 2.5 0 0 1 12.5 12" stroke="#22c55e" stroke-width="1.6" stroke-linecap="round" fill="none"/>
      <circle cx="10" cy="12" r="1.6" fill="#22c55e"/>
      <circle cx="10" cy="16" r="1.2" fill="#22c55e"/>
      <circle cx="10" cy="19.5" r="0.8" fill="#22c55e"/>
    </svg>
    <span>Scout Admin</span>
    <span style="color: var(--muted); font-weight: 500; font-size: 13px;">· <span id="roleLabel">Dashboard</span></span>
  </div>
  <div class="admin-top-right">
    <a href="/dashboard" style="color: var(--muted); text-decoration: none;">Dashboard</a>
    <span id="signedInEmail"></span>
    <span class="signout" onclick="signOut()">Sign out</span>
  </div>
</nav>

<div class="admin-page">

  <!-- SECTION A: Users -->
  <section class="users-section">
    <div class="users-header">
      <h2>User Management</h2>
      <button class="btn-add-user" disabled title="Coming soon — invite and assign users in v1.1.1">+ Add User</button>
    </div>
    <div class="users-table-wrap" id="usersTableWrap">
      <div class="empty-msg"><span class="spinner"></span></div>
    </div>
  </section>

  <!-- SECTION ANALYTICS: per-user analytics widget (v1.1.10). Reuses the
       /dashboard analytics view but for a user the admin/owner selects.
       Pivots on /admin/analytics/:user_id (scope-checked: admins see
       managed users + self, owners see anyone). Empty until a user is
       picked from the dropdown. -->
  <section class="analytics-section">
    <div class="analytics-header">
      <h2>User Analytics</h2>
      <div class="analytics-controls">
        <select id="analyticsUserSelect" onchange="onAnalyticsUserChange()">
          <option value="">Select a user…</option>
        </select>
        <div class="date-presets">
          <button class="date-preset" data-days="7"    onclick="setAnalyticsDateRange(7)">7d</button>
          <button class="date-preset active" data-days="30" onclick="setAnalyticsDateRange(30)">30d</button>
          <button class="date-preset" data-days="90"   onclick="setAnalyticsDateRange(90)">90d</button>
          <button class="date-preset" data-days="9999" onclick="setAnalyticsDateRange(9999)">All</button>
        </div>
      </div>
    </div>
    <div class="analytics-empty" id="analyticsEmpty">Select a user above to see their analytics.</div>
    <div class="analytics-content" id="analyticsContent" style="display:none">
      <div class="stats-row" id="analyticsStatsRow"></div>
      <div class="objection-section" id="analyticsObjectionSection" style="display:none">
        <div class="section-heading">Objections</div>
        <div id="analyticsObjectionContent"></div>
      </div>
    </div>
  </section>

  <!-- SECTION KB: Knowledge Base. Backend scopes /kb/list by role: admins
       see their own + their team's uploads, owners see every uploaded
       entry. The scope badge on each row makes the difference visible. -->
  <section class="kb-section">
    <div class="kb-header">
      <div class="section-heading">Knowledge Base</div>
      <button class="kb-add-btn" onclick="openKbModal()">+ Add resource</button>
    </div>
    <div id="kbContainer">
      <div class="load-spinner"><div class="spinner"></div></div>
    </div>
  </section>

  <!-- SECTIONS B + C -->
  <div class="sessions-split">
    <aside class="sessions-pane">
      <div class="sessions-pane-header">
        <div>Sessions · <span id="sessionsScope">all users</span></div>
        <button id="clearFilterBtn" class="reset-filter hidden" onclick="clearUserFilter()">Show all</button>
      </div>
      <div class="sessions-list" id="sessionsList">
        <div class="empty-msg"><span class="spinner"></span></div>
      </div>
      <div class="load-more hidden" id="loadMore" onclick="loadOlder()">Load older</div>
    </aside>
    <main class="detail-pane" id="detailPane">
      <div class="detail-placeholder" id="detailPlaceholder">Select a session on the left.</div>
    </main>
  </div>

</div>

<!-- KB upload modal — identical to dashboard.html. Three tabs share a
     single submit handler that reads the active tab and builds FormData
     accordingly. Multipart Content-Type header is intentionally omitted so
     the browser sets the multipart boundary for multer to parse. -->
<div class="kb-modal hidden" id="kbModal">
  <div class="kb-modal-overlay" onclick="closeKbModal()"></div>
  <div class="kb-modal-dialog">
    <button class="kb-modal-close" onclick="closeKbModal()" aria-label="Close">✕</button>
    <h2>Add to Knowledge Base</h2>

    <!-- Label and category sit above the tabs so they're always visible
         regardless of source type. Both are required — chunking strategy
         depends on category, and the label is what the user sees later in
         the list and what Claude references in [WINNING CALL: …] /
         [OFFER DOCUMENT: …] context lines. -->
    <div class="kb-form-row">
      <label class="kb-form-label" for="kbLabel">Label</label>
      <input type="text" id="kbLabel" placeholder="e.g. Silver Living landing page, or Winning call - March 2026" autocomplete="off" required/>
    </div>

    <div class="kb-form-row">
      <label class="kb-form-label" for="kbCategory">Content type</label>
      <select id="kbCategory">
        <option value="offer_document">Offer document (script, landing page, FAQ, product info)</option>
        <option value="winning_call">Winning call transcript</option>
      </select>
    </div>

    <div class="kb-tabs" role="tablist">
      <button class="kb-tab active" data-tab="url"   onclick="switchKbTab('url')">URL</button>
      <button class="kb-tab"        data-tab="pdf"   onclick="switchKbTab('pdf')">PDF</button>
      <button class="kb-tab"        data-tab="paste" onclick="switchKbTab('paste')">Paste</button>
    </div>

    <div class="kb-tab-panel" data-panel="url">
      <input type="url"  id="kbUrlInput"  placeholder="https://example.com/article" autocomplete="off"/>
    </div>

    <div class="kb-tab-panel hidden" data-panel="pdf">
      <input type="file" id="kbPdfInput"  accept=".pdf"/>
    </div>

    <div class="kb-tab-panel hidden" data-panel="paste">
      <textarea id="kbPasteInput" placeholder="Paste your content here…" rows="8"></textarea>
    </div>

    <div class="kb-status" id="kbStatus"></div>
    <button class="kb-submit" id="kbSubmit" onclick="submitKbUpload()">Add to Knowledge Base</button>
  </div>
</div>

<script>
  // ── Session handling (mirrors login.html / dashboard.html) ────────────
  var STORAGE_KEY = 'scout_session_v1';

  function getSession() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch (e) { return null; }
  }
  function setSession(s) { localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); }
  function clearSession() { localStorage.removeItem(STORAGE_KEY); }

  function isSessionValid(s) {
    if (!s || !s.access_token || !s.expires_at) return false;
    var nowSec = Math.floor(Date.now() / 1000);
    return s.expires_at > nowSec + 60;
  }
  function shouldRefresh(s) {
    if (!s || !s.expires_at) return false;
    var nowSec = Math.floor(Date.now() / 1000);
    return s.expires_at - nowSec < 300;
  }
  async function refreshSessionIfNeeded() {
    var s = getSession();
    if (!s || !s.refresh_token) return null;
    if (!shouldRefresh(s)) return s;
    try {
      var res = await fetch('/auth/refresh', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ refresh_token: s.refresh_token }),
      });
      if (!res.ok) { clearSession(); return null; }
      var data = await res.json();
      if (!data.session) { clearSession(); return null; }
      var fresh = {
        access_token: data.session.access_token,
        refresh_token: data.session.refresh_token,
        expires_at: data.session.expires_at,
        email: (data.user && data.user.email) || (s && s.email),
      };
      setSession(fresh);
      return fresh;
    } catch (err) { clearSession(); return null; }
  }

  function signOut() { clearSession(); window.location.replace('/login'); }

  function authHeader() {
    var s = getSession();
    return s && s.access_token ? { 'Authorization': 'Bearer ' + s.access_token } : {};
  }

  // ── State ───────────────────────────────────────────────────────────────
  var currentUser = null;          // { user_id, email, role } from /auth/me
  var usersArray = [];             // Section A
  var ownerCount = 0;              // derived from usersArray
  var allSessions = [];            // Section B
  var oldestStartedAt = null;
  var pageSize = 50;
  var selectedSessionId = null;
  var selectedUserId = null;       // Section B filter (click user row to set)
  var currentLogs = [];            // Section C
  var currentSession = null;       // session metadata for the open detail (used by download)
  var currentTotal = 0;
  var currentLimit = 10000;
  var activeChip = 'all';
  var searchText = '';
  var activeView = 'logs';         // 'logs' | 'transcript' — which Section C tab is visible

  // ── Init ───────────────────────────────────────────────────────────────
  async function init() {
    var s = getSession();
    if (!isSessionValid(s)) {
      if (s && s.refresh_token) {
        var refreshed = await refreshSessionIfNeeded();
        if (!refreshed) { window.location.replace('/login'); return; }
      } else {
        window.location.replace('/login');
        return;
      }
    }
    var cur = getSession();
    document.getElementById('signedInEmail').textContent = (cur && cur.email) || '';

    // Role gate: non-admin users belong on /dashboard.
    currentUser = await fetchMe();
    if (!currentUser) { clearSession(); window.location.replace('/login'); return; }
    if (currentUser.role === 'user') { window.location.replace('/dashboard'); return; }
    document.getElementById('roleLabel').textContent = currentUser.role === 'owner' ? 'Owner' : 'Admin';

    await Promise.all([loadUsers(), loadSessions(true), loadKbList()]);
  }

  async function fetchMe() {
    try {
      var res = await fetch('/auth/me', { headers: authHeader() });
      if (res.status === 401) return null;
      if (!res.ok) {
        console.error('[admin] /auth/me returned', res.status);
        return null;
      }
      return await res.json();
    } catch (err) {
      console.error('[admin] /auth/me network error:', err.message);
      return null;
    }
  }

  // ── SECTION A: users ───────────────────────────────────────────────────
  async function loadUsers() {
    var wrap = document.getElementById('usersTableWrap');
    var res;
    try {
      res = await fetch('/admin/users', { headers: authHeader() });
    } catch (err) {
      wrap.innerHTML = '<div class="empty-msg" style="color:#f87171;">Could not reach server.</div>';
      return;
    }
    if (res.status === 401) { clearSession(); window.location.replace('/login'); return; }
    if (res.status === 403) {
      console.error('[admin] /admin/users returned 403 despite role gate passing');
      wrap.innerHTML = '<div class="empty-msg" style="color:#f87171;">Access denied loading users. Try signing out and back in.</div>';
      return;
    }
    if (!res.ok) {
      var err; try { err = await res.json(); } catch (e) { err = { error: 'HTTP ' + res.status }; }
      wrap.innerHTML = '<div class="empty-msg" style="color:#f87171;">' + escapeHtml(err.error || 'Failed to load users') + '</div>';
      return;
    }
    var data = await res.json();
    usersArray = (data && data.users) || [];
    ownerCount = usersArray.filter(function(u) { return u.role === 'owner'; }).length;
    renderUsersTable();
    populateAnalyticsUserSelect();
  }

  // ─── v1.1.10 user analytics ──────────────────────────────────────────
  var analyticsState = { user_id: null, from: null, to: null };

  function populateAnalyticsUserSelect() {
    var sel = document.getElementById('analyticsUserSelect');
    if (!sel) return;
    // Sort by email for predictability.
    var sorted = (usersArray || []).slice().sort(function(a, b) {
      return (a.email || '').localeCompare(b.email || '');
    });
    var options = ['<option value="">Select a user…</option>'];
    for (var i = 0; i < sorted.length; i++) {
      var u = sorted[i];
      options.push('<option value="' + escapeHtml(u.user_id) + '">' + escapeHtml(u.email || u.user_id) + ' · ' + escapeHtml(u.role || 'user') + '</option>');
    }
    sel.innerHTML = options.join('');
    // Default the date range to last 30d so the first selection just works.
    var to = new Date();
    var from = new Date(Date.now() - 30 * 24 * 60 * 60 * 1000);
    analyticsState.from = from.toISOString();
    analyticsState.to = to.toISOString();
  }

  function onAnalyticsUserChange() {
    var sel = document.getElementById('analyticsUserSelect');
    var userId = sel && sel.value;
    if (!userId) {
      document.getElementById('analyticsEmpty').style.display = '';
      document.getElementById('analyticsContent').style.display = 'none';
      analyticsState.user_id = null;
      return;
    }
    analyticsState.user_id = userId;
    document.getElementById('analyticsEmpty').style.display = 'none';
    document.getElementById('analyticsContent').style.display = '';
    loadAnalyticsForUser();
  }

  function setAnalyticsDateRange(days) {
    var to = new Date();
    var from = days >= 9999
      ? new Date('2025-01-01T00:00:00Z')
      : new Date(Date.now() - days * 24 * 60 * 60 * 1000);
    analyticsState.from = from.toISOString();
    analyticsState.to = to.toISOString();
    document.querySelectorAll('.date-preset').forEach(function(b) { b.classList.remove('active'); });
    var activeBtn = document.querySelector('.date-preset[data-days="' + days + '"]');
    if (activeBtn) activeBtn.classList.add('active');
    if (analyticsState.user_id) loadAnalyticsForUser();
  }

  async function loadAnalyticsForUser() {
    var row = document.getElementById('analyticsStatsRow');
    if (!row || !analyticsState.user_id) return;
    row.innerHTML = '<div class="load-spinner"><div class="spinner"></div></div>';
    var url = '/admin/analytics/' + encodeURIComponent(analyticsState.user_id)
      + '?from=' + encodeURIComponent(analyticsState.from)
      + '&to=' + encodeURIComponent(analyticsState.to);
    var res;
    try { res = await fetch(url, { headers: authHeader() }); }
    catch (err) { row.innerHTML = '<div class="empty-msg" style="color:#f87171;">Network error loading analytics</div>'; return; }
    if (res.status === 401) { clearSession(); window.location.replace('/login'); return; }
    if (res.status === 403) {
      row.innerHTML = '<div class="empty-msg" style="color:#f87171;">Not authorized to view that user.</div>';
      return;
    }
    if (!res.ok) {
      row.innerHTML = '<div class="empty-msg" style="color:#f87171;">Could not load analytics (HTTP ' + res.status + ')</div>';
      return;
    }
    var data = await res.json();
    renderAnalyticsStats(data.totals);
    renderAnalyticsObjections(data.objections);
  }

  function renderAnalyticsStats(totals) {
    var parts = [];
    parts.push(analyticsStatCard('Total calls', totals.total_calls, totals.live > 0 ? totals.live + ' still live' : null));
    parts.push(analyticsStatCard('Closed (Won)', totals.wins, analyticsPctOf(totals.wins, totals.total_calls)));
    parts.push(analyticsStatCard('Lost', totals.losses, analyticsPctOf(totals.losses, totals.total_calls)));
    parts.push(analyticsStatCard('Follow-up', totals.follow_ups, analyticsPctOf(totals.follow_ups, totals.total_calls)));
    if (totals.unmarked > 0) parts.push(analyticsStatCard('Unmarked', totals.unmarked, 'no summary yet'));
    document.getElementById('analyticsStatsRow').innerHTML = parts.join('');
  }

  function analyticsStatCard(label, value, sub) {
    var subPart = sub ? '<div class="stat-sub">' + escapeHtml(String(sub)) + '</div>' : '';
    return '<div class="stat-card"><div class="stat-label">' + escapeHtml(label)
      + '</div><div class="stat-value">' + escapeHtml(String(value)) + '</div>' + subPart + '</div>';
  }

  function analyticsPctOf(n, total) {
    if (!total) return null;
    return Math.round((n / total) * 100) + '%';
  }

  function renderAnalyticsObjections(objSection) {
    var section = document.getElementById('analyticsObjectionSection');
    var content = document.getElementById('analyticsObjectionContent');
    if (!objSection || !objSection.by_type || objSection.by_type.length === 0) {
      section.style.display = 'none';
      return;
    }
    section.style.display = 'block';
    var t = objSection.totals;
    var summary = t.total + ' total · ' + t.overcome + ' overcome · ' + t.not_overcome + ' not overcome';
    if (t.unknown > 0) summary += ' · ' + t.unknown + ' indeterminate (transcript quality)';
    var rows = '';
    for (var i = 0; i < objSection.by_type.length; i++) {
      var b = objSection.by_type[i];
      var pct = b.overcome_pct === null
        ? '<span class="pct-none">—</span>'
        : '<span class="' + analyticsPctClass(b.overcome_pct) + '">' + b.overcome_pct + '%</span>';
      rows += '<tr><td>' + escapeHtml(b.label) + '</td>'
        + '<td>' + b.count + '</td>'
        + '<td>' + b.overcome + '</td>'
        + '<td>' + b.not_overcome + '</td>'
        + '<td>' + b.unknown + '</td>'
        + '<td class="pct-cell">' + pct + '</td></tr>';
    }
    content.innerHTML =
      '<div class="objection-totals">' + escapeHtml(summary) + '</div>'
      + '<table class="objection-table">'
      + '<thead><tr><th>Objection</th><th>Count</th><th>Overcome</th><th>Not</th><th>?</th><th>Overcome %</th></tr></thead>'
      + '<tbody>' + rows + '</tbody></table>';
  }

  function analyticsPctClass(pct) {
    if (pct >= 70) return 'pct-good';
    if (pct >= 40) return 'pct-mid';
    return 'pct-bad';
  }

  function renderUsersTable() {
    var wrap = document.getElementById('usersTableWrap');
    if (usersArray.length === 0) {
      wrap.innerHTML = '<div class="empty-msg">No users to display.</div>';
      return;
    }

    var isOwnerViewer = currentUser.role === 'owner';
    var showActions = isOwnerViewer; // admins get read-only

    var header = '<tr><th>Email</th><th>Role</th><th>Sessions</th><th>Last active</th>'
      + (showActions ? '<th>Actions</th>' : '') + '</tr>';

    var rows = [];
    for (var i = 0; i < usersArray.length; i++) {
      var u = usersArray[i];
      var isSelf = u.user_id === currentUser.user_id;
      var isSelected = u.user_id === selectedUserId;
      var trClass = 'clickable' + (isSelected ? ' active' : '');

      // Role cell: dropdown for owners editing OTHER users, static badge otherwise.
      var roleCell;
      if (isOwnerViewer && !isSelf) {
        roleCell = renderRoleControl(u);
      } else {
        roleCell = '<span class="role-badge ' + u.role + '">' + u.role
          + (isSelf ? '<span class="self-tag">(you)</span>' : '')
          + '</span>';
      }

      // Actions cell (only shown when viewer is owner).
      var actionsCell = '';
      if (showActions) {
        if (isSelf) {
          actionsCell = '<td style="color:var(--muted);font-size:12px;">—</td>';
        } else {
          actionsCell = '<td>'
            + '<div class="role-actions">'
              + '<button class="role-save" data-user-id="' + escapeHtml(u.user_id) + '" disabled onclick="event.stopPropagation(); handleSaveRole(\'' + u.user_id + '\')">Save</button>'
              + '<span class="role-saved" id="saved-' + escapeHtml(u.user_id) + '">Saved</span>'
              + '<span class="role-warning hidden" id="warn-' + escapeHtml(u.user_id) + '"></span>'
            + '</div>'
          + '</td>';
        }
      }

      var lastActive = u.last_session_at ? relativeTime(u.last_session_at) : '—';
      var emailDisplay = u.email || (u.user_id.slice(0, 8) + '…');

      rows.push(
        '<tr class="' + trClass + '" data-user-id="' + escapeHtml(u.user_id) + '" onclick="handleUserRowClick(event, \'' + u.user_id + '\')">'
          + '<td>' + escapeHtml(emailDisplay) + '</td>'
          + '<td>' + roleCell + '</td>'
          + '<td>' + u.session_count + '</td>'
          + '<td>' + lastActive + '</td>'
          + actionsCell
        + '</tr>'
      );
    }

    wrap.innerHTML = '<table class="users-table"><thead>' + header + '</thead><tbody>' + rows.join('') + '</tbody></table>';
  }

  function renderRoleControl(user) {
    // stopPropagation on interactions so they don't also trigger the row's user-filter click.
    return '<select class="role-select" data-user-id="' + escapeHtml(user.user_id) + '" data-original-role="' + user.role
      + '" onclick="event.stopPropagation()"'
      + ' onchange="handleRoleChange(event, \'' + user.user_id + '\')">'
      + '<option value="user"' + (user.role === 'user' ? ' selected' : '') + '>user</option>'
      + '<option value="admin"' + (user.role === 'admin' ? ' selected' : '') + '>admin</option>'
      + '<option value="owner"' + (user.role === 'owner' ? ' selected' : '') + '>owner</option>'
      + '</select>';
  }

  function handleUserRowClick(event, userId) {
    // Ignore clicks that started on interactive descendants (select, option, button).
    var tag = (event.target.tagName || '').toLowerCase();
    if (tag === 'select' || tag === 'option' || tag === 'button') return;
    // Toggle: clicking the same active row clears the filter.
    if (selectedUserId === userId) {
      clearUserFilter();
    } else {
      setUserFilter(userId);
    }
  }

  function handleRoleChange(event, userId) {
    var select = event.target;
    var newRole = select.value;
    var originalRole = select.dataset.originalRole;
    var saveBtn = document.querySelector('.role-save[data-user-id="' + cssEsc(userId) + '"]');
    var warn = document.getElementById('warn-' + userId);

    if (newRole === originalRole) {
      if (saveBtn) saveBtn.disabled = true;
      if (warn) { warn.textContent = ''; warn.classList.add('hidden'); }
      return;
    }

    // Client-side last-owner guard (UX only — server is authoritative).
    if (originalRole === 'owner' && newRole !== 'owner' && ownerCount <= 1) {
      if (saveBtn) saveBtn.disabled = true;
      if (warn) { warn.textContent = 'Cannot demote the last owner'; warn.classList.remove('hidden'); }
      return;
    }

    if (saveBtn) saveBtn.disabled = false;
    if (warn) { warn.textContent = ''; warn.classList.add('hidden'); }
  }

  async function handleSaveRole(userId) {
    var select = document.querySelector('.role-select[data-user-id="' + cssEsc(userId) + '"]');
    var saveBtn = document.querySelector('.role-save[data-user-id="' + cssEsc(userId) + '"]');
    var savedPill = document.getElementById('saved-' + userId);
    var warn = document.getElementById('warn-' + userId);
    if (!select || !saveBtn) return;

    var newRole = select.value;
    saveBtn.disabled = true;
    saveBtn.textContent = 'Saving…';

    var res;
    try {
      res = await fetch('/admin/users/' + encodeURIComponent(userId) + '/role', {
        method: 'PATCH',
        headers: Object.assign({ 'Content-Type': 'application/json' }, authHeader()),
        body: JSON.stringify({ role: newRole }),
      });
    } catch (err) {
      saveBtn.textContent = 'Save';
      saveBtn.disabled = false;
      if (warn) { warn.textContent = 'Could not reach server.'; warn.classList.remove('hidden'); }
      return;
    }

    if (res.status === 401) { clearSession(); window.location.replace('/login'); return; }
    if (!res.ok) {
      var err; try { err = await res.json(); } catch (e) { err = { error: 'HTTP ' + res.status }; }
      saveBtn.textContent = 'Save';
      saveBtn.disabled = false;
      if (warn) { warn.textContent = err.error || 'Failed to update role'; warn.classList.remove('hidden'); }
      return;
    }

    var data = await res.json();
    select.dataset.originalRole = data.role;
    saveBtn.textContent = 'Save';
    saveBtn.disabled = true;
    if (warn) { warn.textContent = ''; warn.classList.add('hidden'); }
    if (savedPill) {
      savedPill.classList.add('show');
      setTimeout(function() { savedPill.classList.remove('show'); }, 1600);
    }

    // Update local state and re-render so ownerCount / warnings on OTHER rows refresh.
    var idx = -1;
    for (var i = 0; i < usersArray.length; i++) { if (usersArray[i].user_id === userId) { idx = i; break; } }
    if (idx !== -1) {
      usersArray[idx].role = data.role;
      ownerCount = usersArray.filter(function(u) { return u.role === 'owner'; }).length;
      renderUsersTable();
    }
  }

  // ── SECTION B: session list ────────────────────────────────────────────
  function setUserFilter(userId) {
    selectedUserId = userId;
    selectedSessionId = null;
    oldestStartedAt = null;

    var user = null;
    for (var i = 0; i < usersArray.length; i++) { if (usersArray[i].user_id === userId) { user = usersArray[i]; break; } }
    document.getElementById('sessionsScope').textContent = user ? (user.email || user.user_id.slice(0, 8) + '…') : 'selected user';
    document.getElementById('clearFilterBtn').classList.remove('hidden');

    renderUsersTable(); // reflect active row
    document.getElementById('detailPane').innerHTML = '<div class="detail-placeholder">Select a session on the left.</div>';
    loadSessions(true);
  }

  function clearUserFilter() {
    selectedUserId = null;
    selectedSessionId = null;
    oldestStartedAt = null;
    document.getElementById('sessionsScope').textContent = 'all users';
    document.getElementById('clearFilterBtn').classList.add('hidden');
    renderUsersTable();
    document.getElementById('detailPane').innerHTML = '<div class="detail-placeholder">Select a session on the left.</div>';
    loadSessions(true);
  }

  async function loadSessions(initial) {
    var url = '/admin/sessions?limit=' + pageSize;
    if (selectedUserId) url += '&user_id=' + encodeURIComponent(selectedUserId);
    if (!initial && oldestStartedAt) url += '&before=' + encodeURIComponent(oldestStartedAt);

    if (initial) {
      document.getElementById('sessionsList').innerHTML = '<div class="empty-msg"><span class="spinner"></span></div>';
    }

    var res;
    try {
      res = await fetch(url, { headers: authHeader() });
    } catch (err) {
      renderListError('Could not reach server.');
      return;
    }
    if (res.status === 401) { clearSession(); window.location.replace('/login'); return; }
    if (res.status === 403) {
      console.error('[admin] /admin/sessions returned 403 despite role gate passing');
      renderListError('Access denied loading sessions. Try signing out and back in.');
      return;
    }
    if (!res.ok) {
      var err; try { err = await res.json(); } catch (e) { err = { error: 'HTTP ' + res.status }; }
      renderListError(err.error || 'Failed to load sessions');
      return;
    }
    var data = await res.json();
    var sessions = (data && data.sessions) || [];
    if (initial) allSessions = sessions;
    else allSessions = allSessions.concat(sessions);
    if (sessions.length > 0) oldestStartedAt = sessions[sessions.length - 1].started_at;

    var loadMoreEl = document.getElementById('loadMore');
    if (sessions.length < pageSize) loadMoreEl.classList.add('hidden');
    else loadMoreEl.classList.remove('hidden');

    renderSessionsList();
  }

  async function loadOlder() { await loadSessions(false); }

  function renderListError(msg) {
    document.getElementById('sessionsList').innerHTML =
      '<div class="empty-msg" style="color:#f87171;">' + escapeHtml(msg) + '</div>';
  }

  function renderSessionsList() {
    var list = document.getElementById('sessionsList');
    if (allSessions.length === 0) {
      list.innerHTML = '<div class="empty-msg">No sessions' + (selectedUserId ? ' for this user' : '') + ' yet.</div>';
      return;
    }
    var html = '';
    for (var i = 0; i < allSessions.length; i++) {
      var s = allSessions[i];
      var email = s.user_email || s.user_id.slice(0, 8) + '…';
      var active = s.session_id === selectedSessionId ? ' active' : '';
      var outcome = outcomeBadge(s.outcome, !!s.ended_at);
      var dur = s.ended_at ? formatDuration(s.duration_seconds) : 'live';
      var rel = relativeTime(s.started_at);
      var errPart = s.error_count > 0
        ? '<span class="err">' + s.error_count + ' errors</span>'
        : '0 errors';
      html += '<div class="session-card' + active + '" onclick="selectSession(\'' + s.session_id + '\')">'
        + '<div class="session-card-top">'
          + '<span class="session-card-email">' + escapeHtml(email) + '</span>'
          + outcome
        + '</div>'
        + '<div class="session-card-meta">' + rel + ' · ' + dur + '</div>'
        + '<div class="session-card-tail">' + escapeHtml(s.client_version || '—') + ' · ' + s.log_count + ' logs · ' + errPart + '</div>'
      + '</div>';
    }
    list.innerHTML = html;
  }

  function outcomeBadge(outcome, ended) {
    if (outcome === 'win') return '<span class="badge badge-win">Win</span>';
    if (outcome === 'loss') return '<span class="badge badge-loss">Loss</span>';
    if (outcome === 'follow_up') return '<span class="badge badge-pending">Follow-up</span>';
    if (!ended) return '<span class="badge badge-pending">Live</span>';
    return '<span class="badge badge-pending">—</span>';
  }

  // ── SECTION C: log detail ──────────────────────────────────────────────
  async function selectSession(sessionId) {
    selectedSessionId = sessionId;
    renderSessionsList();
    activeChip = 'all';
    searchText = '';
    activeView = 'logs';

    var pane = document.getElementById('detailPane');
    pane.innerHTML = '<div class="detail-placeholder"><span class="spinner"></span></div>';

    var res;
    try {
      res = await fetch('/admin/sessions/' + encodeURIComponent(sessionId) + '/logs', { headers: authHeader() });
    } catch (err) {
      pane.innerHTML = '<div class="detail-placeholder" style="color:#f87171;">Could not reach server.</div>';
      return;
    }
    if (res.status === 401) { clearSession(); window.location.replace('/login'); return; }
    if (res.status === 403) {
      console.error('[admin] /admin/sessions/:id/logs returned 403 despite role gate passing');
      pane.innerHTML = '<div class="detail-placeholder" style="color:#f87171;">Access denied loading logs.</div>';
      return;
    }
    if (!res.ok) {
      var err; try { err = await res.json(); } catch (e) { err = { error: 'HTTP ' + res.status }; }
      pane.innerHTML = '<div class="detail-placeholder" style="color:#f87171;">' + escapeHtml(err.error || 'Failed to load logs') + '</div>';
      return;
    }
    var data = await res.json();
    currentLogs = (data && data.logs) || [];
    currentSession = (data && data.session) || null;
    currentTotal = (data && typeof data.total_count === 'number') ? data.total_count : currentLogs.length;
    currentLimit = (data && data.limit) || 10000;

    renderDetail(data.session);
  }

  function renderDetail(session) {
    var pane = document.getElementById('detailPane');
    var email = session.user_email || session.user_id;
    var dur = session.ended_at ? formatDuration(session.duration_seconds) : 'live';
    var outcome = outcomeBadge(session.outcome, !!session.ended_at);
    var startedAbs = new Date(session.started_at).toLocaleString();

    pane.innerHTML =
      '<div class="detail-header">'
        + '<div class="detail-header-left">'
          + '<h3>' + escapeHtml(email) + '</h3>'
          + '<div class="sub">' + escapeHtml(startedAbs) + ' · ' + dur + ' · ' + escapeHtml(session.client_version || '—') + ' · ' + escapeHtml(session.platform || '—') + '</div>'
        + '</div>'
        + '<div class="detail-header-right">'
          + outcome
          + '<button class="btn-download" onclick="downloadSessionFiles()" title="Download raw logs and transcript as .txt files">↓ Download</button>'
        + '</div>'
      + '</div>'
      + '<div class="view-tabs">'
        + '<button class="view-tab' + (activeView === 'logs' ? ' active' : '') + '" data-view="logs" onclick="switchView(\'logs\')">Raw Logs</button>'
        + '<button class="view-tab' + (activeView === 'transcript' ? ' active' : '') + '" data-view="transcript" onclick="switchView(\'transcript\')">Transcript</button>'
      + '</div>'
      + '<div id="logView"' + (activeView === 'transcript' ? ' style="display:none"' : '') + '>'
        + '<div class="filter-bar">'
          + chipHtml('all', 'All')
          + chipHtml('claude', '[claude]')
          + chipHtml('memory', '[memory]')
          + chipHtml('TIMING', '[TIMING]')
          + chipHtml('errors', 'Errors only')
          + '<input class="filter-search" type="text" placeholder="Search messages…" oninput="onSearch(this.value)" value="' + escapeHtml(searchText) + '"/>'
          + '<span class="count-indicator" id="countIndicator"></span>'
        + '</div>'
        + '<div class="log-list" id="logList"></div>'
      + '</div>'
      + '<div id="transcriptView"' + (activeView === 'logs' ? ' style="display:none"' : '') + '>'
        + '<div class="transcript-list" id="transcriptList"></div>'
      + '</div>';

    renderLogList();
    if (activeView === 'transcript') renderTranscriptView();
  }

  function chipHtml(id, label) {
    var active = id === activeChip ? ' active' : '';
    return '<button class="chip' + active + '" data-chip="' + id + '" onclick="onChip(\'' + id + '\')">' + escapeHtml(label) + '</button>';
  }

  function onChip(id) {
    activeChip = id;
    document.querySelectorAll('.filter-bar .chip').forEach(function(c) {
      if (c.getAttribute('data-chip') === id) c.classList.add('active');
      else c.classList.remove('active');
    });
    renderLogList();
  }
  function onSearch(v) { searchText = v; renderLogList(); }

  function renderLogList() {
    var list = document.getElementById('logList');
    if (!list) return;

    var filtered = currentLogs.filter(function(r) {
      if (activeChip === 'errors' && r.level !== 'error') return false;
      if (activeChip !== 'all' && activeChip !== 'errors') {
        var hay = ((r.tag || '') + ' ' + (r.message || '')).toLowerCase();
        if (hay.indexOf(activeChip.toLowerCase()) === -1) return false;
      }
      if (searchText) {
        var msg = (r.message || '').toLowerCase();
        if (msg.indexOf(searchText.toLowerCase()) === -1) return false;
      }
      return true;
    });

    var indicator = document.getElementById('countIndicator');
    var capped = currentTotal > currentLimit;
    var shown = filtered.length;
    var text;
    if (capped) text = 'Showing ' + shown + ' of ' + currentTotal + ' (capped at ' + currentLimit + ')';
    else if (shown !== currentLogs.length) text = 'Showing ' + shown + ' of ' + currentLogs.length;
    else text = shown + ' log' + (shown === 1 ? '' : 's');
    indicator.textContent = text;
    if (capped) indicator.classList.add('capped'); else indicator.classList.remove('capped');

    if (filtered.length === 0) {
      list.innerHTML = '<div class="empty-msg">No logs match the current filter.</div>';
      return;
    }
    var parts = [];
    for (var i = 0; i < filtered.length; i++) {
      var r = filtered[i];
      var dotClass = r.level === 'error' ? 'error' : (r.level === 'warn' ? 'warn' : '');
      var rowClass = r.level === 'error' ? 'log-row error' : 'log-row';
      parts.push(
        '<div class="' + rowClass + '">'
          + '<span class="log-time">' + escapeHtml(formatLogTime(r.logged_at)) + '</span>'
          + '<span class="log-dot ' + dotClass + '"></span>'
          + '<span class="log-tag">' + escapeHtml(r.tag || '') + '</span>'
          + '<span class="log-msg">' + escapeHtml(r.message || '') + '</span>'
        + '</div>'
      );
    }
    list.innerHTML = parts.join('');
  }

  // ── Formatters ──────────────────────────────────────────────────────────
  function formatLogTime(iso) {
    var d = new Date(iso);
    if (isNaN(d.getTime())) return iso || '';
    var h = String(d.getHours()).padStart(2, '0');
    var m = String(d.getMinutes()).padStart(2, '0');
    var s = String(d.getSeconds()).padStart(2, '0');
    var ms = String(d.getMilliseconds()).padStart(3, '0');
    return h + ':' + m + ':' + s + '.' + ms;
  }
  function formatDuration(secs) {
    if (secs == null) return '—';
    if (secs < 60) return secs + 's';
    var m = Math.floor(secs / 60);
    var s = secs % 60;
    if (m < 60) return m + 'm ' + s + 's';
    var h = Math.floor(m / 60);
    m = m % 60;
    return h + 'h ' + m + 'm';
  }
  function relativeTime(iso) {
    var t = new Date(iso).getTime();
    if (isNaN(t)) return iso || '';
    var diff = Math.max(0, (Date.now() - t) / 1000);
    if (diff < 60) return Math.floor(diff) + 's ago';
    if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
    if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
    return Math.floor(diff / 86400) + 'd ago';
  }
  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }
  function cssEsc(s) {
    if (window.CSS && CSS.escape) return CSS.escape(s);
    return String(s).replace(/[^a-zA-Z0-9_-]/g, '\\$&');
  }

  function formatHHMMSS(iso) {
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '00:00:00';
    var h = String(d.getHours()).padStart(2, '0');
    var m = String(d.getMinutes()).padStart(2, '0');
    var s = String(d.getSeconds()).padStart(2, '0');
    return h + ':' + m + ':' + s;
  }

  // ── View tab switching ─────────────────────────────────────────────────
  function switchView(view) {
    if (view !== 'logs' && view !== 'transcript') return;
    activeView = view;
    document.querySelectorAll('.view-tab').forEach(function(t) {
      if (t.getAttribute('data-view') === view) t.classList.add('active');
      else t.classList.remove('active');
    });
    var logView = document.getElementById('logView');
    var tView = document.getElementById('transcriptView');
    if (!logView || !tView) return;
    if (view === 'logs') {
      logView.style.display = '';
      tView.style.display = 'none';
    } else {
      logView.style.display = 'none';
      tView.style.display = '';
      renderTranscriptView();
    }
  }

  // ── Transcript parser ──────────────────────────────────────────────────
  // Walks session_logs in chronological order and produces a clean event list:
  //   { type: 'transcript', time, speaker, text }
  //   { type: 'scout', time, headline, suggestion?, question? }
  // Skips interim transcripts, [audio], [TIMING], and [claude] internals
  // other than Next line / Suggestion / Listening for QUESTION. Suggestion
  // and question lines attach to the most recent open SCOUT block; a new
  // [claude] Next line closes the previous block.
  function buildTranscriptModel(logs) {
    var events = [];
    var currentScout = null;
    function flushScout() { if (currentScout) { events.push(currentScout); currentScout = null; } }

    for (var i = 0; i < logs.length; i++) {
      var log = logs[i];
      var msg = log.message || '';
      var tag = log.tag || '';

      if (tag === '[audio]' || tag === '[TIMING]') continue;
      if (msg.indexOf('[deepgram] Transcript (interim)') !== -1) continue;

      var t = msg.match(/^\[deepgram\] Transcript \(final\) \[(CLOSER|PROSPECT)\]: ([\s\S]*)$/);
      if (t) {
        flushScout();
        events.push({ type: 'transcript', time: log.logged_at, speaker: t[1], text: t[2] });
        continue;
      }

      var nl = msg.match(/^\[claude\] Next line: ([\s\S]*)$/);
      if (nl) {
        flushScout();
        currentScout = { type: 'scout', time: log.logged_at, headline: nl[1], suggestion: null, question: null };
        continue;
      }

      var sg = msg.match(/^\[claude\] Suggestion: ([\s\S]*)$/);
      if (sg && currentScout) { currentScout.suggestion = sg[1]; continue; }

      var q = msg.match(/^\[claude\] Listening for QUESTION: "([\s\S]*)"$/);
      if (q && currentScout) { currentScout.question = q[1]; continue; }
      // Everything else: skipped (other [claude], [main], [memory], etc.)
    }
    flushScout();
    return events;
  }

  function renderTranscriptView() {
    var list = document.getElementById('transcriptList');
    if (!list) return;
    var model = buildTranscriptModel(currentLogs);

    if (model.length === 0) {
      list.innerHTML = '<div class="empty-msg">No transcript events found in this session\'s logs.</div>';
      return;
    }

    var parts = [];
    for (var i = 0; i < model.length; i++) {
      var e = model[i];
      if (e.type === 'transcript') {
        var rowClass = e.speaker === 'PROSPECT' ? 'transcript-row prospect' : 'transcript-row closer';
        parts.push(
          '<div class="' + rowClass + '">'
            + '<span class="t-time">[' + escapeHtml(formatHHMMSS(e.time)) + ']</span>'
            + '<span class="t-speaker">' + e.speaker + ':</span>'
            + '<span class="t-text">' + escapeHtml(e.text) + '</span>'
          + '</div>'
        );
      } else if (e.type === 'scout') {
        var hasHeadline = !!(e.headline && e.headline.trim());
        var hasSuggestion = !!(e.suggestion && e.suggestion.trim());
        var hasQuestion = !!(e.question && e.question.trim());
        // Never render an empty SCOUT block.
        if (!hasHeadline && !hasSuggestion && !hasQuestion) continue;

        var bodyHtml = '';
        if (hasHeadline) bodyHtml += '<div class="scout-headline">Headline: ' + escapeHtml(e.headline) + '</div>';
        if (hasSuggestion) bodyHtml += '<div class="scout-text">' + escapeHtml(e.suggestion) + '</div>';
        else if (hasQuestion) bodyHtml += '<div class="scout-text">' + escapeHtml(e.question) + '</div>';

        parts.push(
          '<div class="transcript-row scout">'
            + '<div class="scout-head">'
              + '<span class="t-time">[' + escapeHtml(formatHHMMSS(e.time)) + ']</span>'
              + '<span class="t-scout-label">── SCOUT ──────────────────</span>'
            + '</div>'
            + '<div class="scout-body">' + bodyHtml + '</div>'
          + '</div>'
        );
      }
    }
    list.innerHTML = parts.join('');
  }

  // ── Download buttons ───────────────────────────────────────────────────
  // Generates two .txt files from the currently loaded session and triggers
  // browser downloads. Uses Blob + object URL — no backend round-trip.
  function downloadSessionFiles() {
    if (!currentSession || !currentSession.session_id) return;
    var sessionId = currentSession.session_id;

    // File 1: raw logs, one per line.
    var rawLines = [];
    for (var i = 0; i < currentLogs.length; i++) {
      var r = currentLogs[i];
      rawLines.push((r.logged_at || '') + ' [' + (r.level || 'info') + '] ' + (r.tag || '') + ' ' + (r.message || ''));
    }
    var rawText = rawLines.join('\n') + '\n';

    // File 2: clean transcript with header.
    var dur = currentSession.ended_at ? formatDuration(currentSession.duration_seconds) : 'live';
    var startedAbs = currentSession.started_at ? new Date(currentSession.started_at).toLocaleString() : '—';
    var lines = [
      '=== SCOUT SYSTEMS CALL TRANSCRIPT ===',
      'Session: ' + sessionId,
      'Date: ' + startedAbs,
      'Duration: ' + dur,
      'Outcome: ' + (currentSession.outcome || '—'),
      ''
    ];
    var model = buildTranscriptModel(currentLogs);
    for (var j = 0; j < model.length; j++) {
      var e = model[j];
      if (e.type === 'transcript') {
        lines.push('[' + formatHHMMSS(e.time) + '] ' + e.speaker + ': ' + e.text);
      } else if (e.type === 'scout') {
        var hasHeadline = !!(e.headline && e.headline.trim());
        var hasSuggestion = !!(e.suggestion && e.suggestion.trim());
        var hasQuestion = !!(e.question && e.question.trim());
        if (!hasHeadline && !hasSuggestion && !hasQuestion) continue;
        lines.push('[' + formatHHMMSS(e.time) + '] ── SCOUT ──────────────────────────────');
        if (hasHeadline) lines.push('             Headline: ' + e.headline);
        if (hasSuggestion) lines.push('             ' + e.suggestion);
        else if (hasQuestion) lines.push('             ' + e.question);
      }
    }
    var transcriptText = lines.join('\n') + '\n';

    triggerDownload(sessionId + '_raw_logs.txt', rawText);
    // Slight delay to avoid browsers throttling back-to-back downloads.
    setTimeout(function() {
      triggerDownload(sessionId + '_transcript.txt', transcriptText);
    }, 100);
  }

  function triggerDownload(filename, text) {
    var blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(function() {
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }, 100);
  }

  // ── Knowledge Base ──────────────────────────────────────────────────────
  // Identical to dashboard.html. Backend scopes /kb/list by role: admins
  // see their own + their team's uploads; owners see every uploaded entry.
  // Each row's scope badge surfaces the difference visually.
  async function loadKbList() {
    var container = document.getElementById('kbContainer');
    if (!container) return;
    var res;
    try {
      res = await fetch('/kb/list', { headers: authHeader() });
    } catch (err) {
      container.innerHTML = '<div class="msg-error">Could not reach server.</div>';
      return;
    }
    if (res.status === 401) { clearSession(); window.location.replace('/login'); return; }
    if (!res.ok) {
      var err;
      try { err = await res.json(); } catch (e) { err = { error: 'HTTP ' + res.status }; }
      container.innerHTML = '<div class="msg-error">' + escapeHtml(err.error || 'Failed to load uploads') + '</div>';
      return;
    }
    var data = await res.json();
    renderKbList((data && data.uploads) || []);
  }

  function renderKbList(items) {
    var container = document.getElementById('kbContainer');
    if (!container) return;

    if (!items || items.length === 0) {
      container.innerHTML =
        '<div class="empty-card">'
          + '<h2>No knowledge base resources yet</h2>'
          + '<p>Upload sales scripts, product info, FAQs, or any reference material. Scout will pull from these during live calls.</p>'
          + '<button class="kb-add-btn" onclick="openKbModal()">+ Add your first resource</button>'
        + '</div>';
      return;
    }

    var parts = ['<div class="kb-list">'];
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      var typeBadge = it.source_type
        ? '<span class="kb-badge kb-type-' + escapeHtml(it.source_type) + '">' + escapeHtml(it.source_type) + '</span>'
        : '';
      // Category badge — only when category is set (pre-feature uploads
      // don't have it). Friendly labels rather than the raw enum value.
      var catBadge = '';
      if (it.category === 'offer_document') {
        catBadge = '<span class="kb-badge kb-cat-offer_document">Offer doc</span>';
      } else if (it.category === 'winning_call') {
        catBadge = '<span class="kb-badge kb-cat-winning_call">Winning call</span>';
      }
      // Scope badge stays on admin: admins see uploads with mixed scopes
      // (own personal/team plus their team members') so the badge tells
      // them which is which. Dashboard hides it because users only ever
      // see their own personal uploads.
      var scopeBadge = it.scope
        ? '<span class="kb-badge kb-scope-' + escapeHtml(it.scope) + '">' + escapeHtml(it.scope) + '</span>'
        : '';
      var chunkText = it.chunk_count + ' chunk' + (it.chunk_count === 1 ? '' : 's');
      var rel = relativeTime(it.created_at);
      // Only learned_pattern uploads get the expand affordance — other
      // categories are bulk text whose chunks aren't independently useful
      // to surface in a side panel.
      var viewBtn = '';
      var expandPanel = '';
      if (it.category === 'learned_pattern') {
        viewBtn = '<button class="kb-view-btn" data-label="' + escapeHtml(it.source_label) + '" data-slot="' + i + '" onclick="viewKbEntries(this.getAttribute(\'data-label\'), this.getAttribute(\'data-slot\'), this)">View patterns</button>';
        expandPanel = '<div class="kb-expand-panel hidden" id="kbExpand-' + i + '"></div>';
      }
      parts.push(
        '<div class="kb-item">'
          + '<div class="kb-item-main">'
            + '<div class="kb-item-title">' + typeBadge + catBadge + scopeBadge + escapeHtml(it.source_label || '(unlabeled)') + '</div>'
            + '<div class="kb-item-sub">' + chunkText + ' · added ' + rel + '</div>'
          + '</div>'
          + viewBtn
          + '<button class="kb-delete-btn" data-label="' + escapeHtml(it.source_label) + '" onclick="deleteKbItem(this.getAttribute(\'data-label\'))">Delete</button>'
        + '</div>'
        + expandPanel
      );
    }
    parts.push('</div>');
    container.innerHTML = parts.join('');
  }

  async function deleteKbItem(sourceLabel) {
    if (!sourceLabel) return;
    var ok = window.confirm('Delete "' + sourceLabel + '"?\n\nThis removes all chunks for this resource. Cannot be undone.');
    if (!ok) return;

    var res;
    try {
      res = await fetch('/kb/' + encodeURIComponent(sourceLabel), {
        method: 'DELETE',
        headers: authHeader(),
      });
    } catch (err) {
      window.alert('Could not reach server: ' + err.message);
      return;
    }
    if (res.status === 401) { clearSession(); window.location.replace('/login'); return; }
    if (!res.ok) {
      var err;
      try { err = await res.json(); } catch (e) { err = { error: 'HTTP ' + res.status }; }
      window.alert('Delete failed: ' + (err.error || 'unknown error'));
      return;
    }
    await loadKbList();
  }

  function openKbModal() {
    var modal = document.getElementById('kbModal');
    if (!modal) return;
    // Reset form state every time the modal opens — switching to URL tab,
    // clearing inputs, resetting category to default, hiding any leftover
    // error from a previous attempt.
    switchKbTab('url');
    var ids = ['kbLabel','kbUrlInput','kbPdfInput','kbPasteInput'];
    for (var i = 0; i < ids.length; i++) {
      var el = document.getElementById(ids[i]);
      if (el) el.value = '';
    }
    var cat = document.getElementById('kbCategory');
    if (cat) cat.value = 'offer_document';
    setKbStatus('', '');
    var submit = document.getElementById('kbSubmit');
    if (submit) { submit.disabled = false; submit.textContent = 'Add to Knowledge Base'; }
    modal.classList.remove('hidden');
  }

  function closeKbModal() {
    var modal = document.getElementById('kbModal');
    if (modal) modal.classList.add('hidden');
  }

  function switchKbTab(tab) {
    var tabs = document.querySelectorAll('#kbModal .kb-tab');
