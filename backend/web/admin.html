<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin — Scout Systems</title>
  <link rel="stylesheet" href="/css/style.css"/>
  <style>
    /* Three-section admin layout:
         A — user management (top, full width)
         B — session list    (bottom left)
         C — log detail      (bottom right)
       Below 900px the B/C split stacks. Styles live inline here (matches
       the login.html / dashboard.html pattern). */

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
    }

    .admin-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 24px;
      border-bottom: 1px solid var(--border);
      background: rgba(8,11,13,0.95);
    }
    .admin-top-left { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 700; }
    .admin-top-right { display: flex; align-items: center; gap: 16px; font-size: 13px; color: var(--muted); }
    .admin-top-right .signout { cursor: pointer; }
    .admin-top-right .signout:hover { color: var(--text); }

    .admin-page {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    /* ── SECTION A: users ────────────────────────────────────────────────── */
    .users-section {
      padding: 20px 24px 12px;
      flex-shrink: 0;
    }
    .users-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      gap: 12px;
      flex-wrap: wrap;
    }
    .users-header h2 {
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--muted);
    }
    .btn-add-user {
      font-size: 13px;
      font-weight: 600;
      padding: 7px 14px;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      cursor: pointer;
      font-family: inherit;
    }
    .btn-add-user:hover { border-color: var(--green); color: var(--green); }

    /* Create-user modal + editable-field status (Stage 4 console) */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 100; }
    .modal-box { background: #16181d; border: 1px solid var(--border); border-radius: 10px; padding: 24px; width: 420px; max-width: 92vw; }
    .modal-title { font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 16px; }
    .modal-label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 14px; }
    .modal-input, .modal-select { display: block; width: 100%; margin-top: 5px; font-size: 13px; padding: 8px 10px; border-radius: 6px; background: var(--bg3); border: 1px solid var(--border); color: var(--text); font-family: inherit; }
    .modal-input:focus, .modal-select:focus { outline: none; border-color: var(--green); }
    .modal-err { font-size: 12px; color: #f87171; margin-bottom: 10px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 8px; }
    .btn-modal-primary { font-size: 13px; font-weight: 600; padding: 8px 16px; border-radius: 7px; border: none; background: var(--green); color: #0b1f12; cursor: pointer; font-family: inherit; }
    .btn-modal-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-modal-secondary { font-size: 13px; font-weight: 600; padding: 8px 16px; border-radius: 7px; border: 1px solid var(--border); background: transparent; color: var(--muted); cursor: pointer; font-family: inherit; }
    .cu-created-msg { font-size: 13px; color: var(--text); line-height: 1.5; margin-bottom: 14px; }
    .cu-email-status { font-size: 13px; margin: 6px 0 10px; }
    .temp-pw-box { display: flex; align-items: center; gap: 10px; background: var(--bg3); border: 1px solid var(--border); border-radius: 7px; padding: 10px 12px; margin-bottom: 16px; }
    .temp-pw-box code { font-size: 14px; color: var(--green); font-family: ui-monospace, Menlo, monospace; flex: 1; word-break: break-all; }
    .btn-copy { font-size: 12px; font-weight: 600; padding: 5px 12px; border-radius: 6px; border: 1px solid var(--border); background: transparent; color: var(--text); cursor: pointer; font-family: inherit; }
    .field-status { font-size: 12px; margin-left: 6px; }
    .field-status.ok { color: var(--green); }
    .field-status.err { color: #f87171; }

    .users-table-wrap {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: auto;
      max-height: 320px;
    }
    .users-table {
      width: 100%;
      border-collapse: collapse;
    }
    .users-table th {
      text-align: left;
      padding: 10px 16px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      background: rgba(0,0,0,0.15);
      position: sticky;
      top: 0;
    }
    .users-table td {
      padding: 11px 16px;
      font-size: 13px;
      border-bottom: 1px solid var(--border);
      color: var(--text);
      vertical-align: middle;
    }
    .users-table tr:last-child td { border-bottom: none; }

    .btn-resend { font-size: 11px; padding: 4px 9px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg2); color: var(--muted); cursor: pointer; white-space: nowrap; }

    .btn-resend:hover:not(:disabled) { color: var(--text); border-color: var(--green); }
    .admin-actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .admin-danger { color: #f87171; border-color: rgba(248,113,113,0.35); }
    .admin-danger:hover:not(:disabled) { color: #fca5a5; border-color: rgba(248,113,113,0.6); }

    .role-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 6px;
      text-transform: lowercase;
      letter-spacing: 0.3px;
    }
    .role-badge.owner { background: rgba(34,197,94,0.15); color: var(--green); }
    .role-badge.admin { background: rgba(59,130,246,0.15); color: #60a5fa; }
    .role-badge.user  { background: rgba(255,255,255,0.06); color: var(--muted); }
    .role-badge .self-tag {
      font-size: 10px;
      color: var(--muted);
      margin-left: 6px;
      font-weight: 500;
      text-transform: none;
      letter-spacing: 0;
    }

    .role-select {
      font-size: 12px;
      padding: 4px 8px;
      border-radius: 6px;
      background: var(--bg3);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: inherit;
      cursor: pointer;
    }
    .role-select:focus { outline: none; border-color: var(--green); }

    .role-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .role-save {
      font-size: 11px;
      font-weight: 700;
      padding: 5px 10px;
      border-radius: 6px;
      background: var(--green);
      color: #000;
      border: none;
      cursor: pointer;
      font-family: inherit;
    }
    .role-save:hover:not(:disabled) { background: var(--green-dark); }
    .role-save:disabled { opacity: 0.35; cursor: not-allowed; background: var(--bg3); color: var(--muted); }
    .role-warning {
      font-size: 11px;
      color: #fbbf24;
      width: 100%;
      margin-top: 2px;
      display: block;
    }
    .role-warning.hidden { display: none; }
    .role-saved {
      font-size: 11px;
      color: var(--green);
      font-weight: 600;
      opacity: 0;
      transition: opacity 0.15s;
    }
    .role-saved.show { opacity: 1; }

    .empty-msg { padding: 24px 20px; font-size: 13px; color: var(--muted); text-align: center; }

    .spinner {
      width: 18px; height: 18px;
      border: 2px solid var(--border);
      border-top-color: var(--green);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: inline-block;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }


    @media (max-width: 900px) {
      .users-section { padding: 16px 16px 10px; }
      .users-table { white-space: nowrap; }
    }

    /* v1.1.10: User analytics widget. Mirrors the dashboard.html analytics
       block. Duplicated rather than extracted to a shared CSS file because
       admin.html uses its own --bg2/--muted set and the two pages may diverge
       visually in future. Extract to /css/analytics.css if it grows. */
    .analytics-section { margin: 24px 0; }
    .analytics-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; gap: 16px; flex-wrap: wrap; }
    .analytics-header h2 { margin: 0; font-size: 18px; font-weight: 600; }
    .analytics-controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .analytics-controls select {
      background: var(--bg2); border: 1px solid #2a2a2a; color: inherit;
      padding: 6px 28px 6px 10px; border-radius: 6px; font-size: 13px;
      font-family: inherit; min-width: 220px;
    }
    .analytics-empty {
      background: var(--bg2); border: 1px solid #2a2a2a; border-radius: 8px;
      padding: 32px; text-align: center; color: var(--muted); font-size: 13px;
    }
    .date-presets { display: flex; gap: 6px; flex-wrap: wrap; }
    .date-preset {
      background: var(--bg2); border: 1px solid #2a2a2a; color: var(--muted);
      padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer;
      font-family: inherit;
    }
    .date-preset:hover { background: #2a2a2a; color: inherit; }
    .date-preset.active { background: #2a2a2a; color: inherit; border-color: #4a9eff; }

    .stats-row {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px; margin-bottom: 24px;
    }
    .stat-card {
      background: var(--bg2); border: 1px solid #2a2a2a; border-radius: 8px;
      padding: 14px 16px;
    }
    .stat-card .stat-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .stat-card .stat-value { font-size: 24px; font-weight: 600; margin-top: 4px; }
    .stat-card .stat-sub { font-size: 11px; color: var(--muted); margin-top: 4px; }

    .objection-section { margin-bottom: 24px; }
    .objection-totals { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
    .objection-table {
      width: 100%; border-collapse: collapse;
      background: var(--bg2); border-radius: 8px; overflow: hidden;
    }
    .objection-table th, .objection-table td {
      padding: 10px 14px; text-align: left; font-size: 13px;
      border-bottom: 1px solid #2a2a2a;
    }
    .objection-table th {
      background: #1a1a1a; color: var(--muted); font-weight: 500;
      font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px;
    }
    .objection-table tr:last-child td { border-bottom: none; }
    .objection-table .pct-cell { font-weight: 600; }
    .pct-good { color: #4ade80; }
    .pct-mid  { color: #facc15; }
    .pct-bad  { color: #f87171; }
    .pct-none { color: var(--muted); }
  </style>
  <script src="/js/scout-auth.js"></script>
</head>
<body>

<nav class="admin-top">
  <div class="admin-top-left">
    <svg width="20" height="22" viewBox="0 0 20 22" xmlns="http://www.w3.org/2000/svg">
      <path d="M1.5 12 A8.5 8.5 0 0 1 18.5 12" stroke="#22c55e" stroke-width="1.6" stroke-linecap="round" fill="none"/>
      <path d="M4.5 12 A5.5 5.5 0 0 1 15.5 12" stroke="#22c55e" stroke-width="1.6" stroke-linecap="round" fill="none"/>
      <path d="M7.5 12 A2.5 2.5 0 0 1 12.5 12" stroke="#22c55e" stroke-width="1.6" stroke-linecap="round" fill="none"/>
      <circle cx="10" cy="12" r="1.6" fill="#22c55e"/>
      <circle cx="10" cy="16" r="1.2" fill="#22c55e"/>
      <circle cx="10" cy="19.5" r="0.8" fill="#22c55e"/>
    </svg>
    <span>Scout Admin</span>
    <span style="color: var(--muted); font-weight: 500; font-size: 13px;">· <span id="roleLabel">Dashboard</span></span>
  </div>
  <div class="admin-top-right">
    <a href="/dashboard" style="color: var(--muted); text-decoration: none;">Dashboard</a>
    <span id="signedInEmail"></span>
    <span class="signout" onclick="signOut()">Sign out</span>
  </div>
</nav>

<div class="admin-page">

  <!-- SECTION A: Users -->
  <section class="users-section">
    <div class="users-header">
      <h2>User Management</h2>
      <button class="btn-add-user" id="btnCreateUser" onclick="openCreateUserModal()" style="display:none">+ Create user</button>
    </div>
    <div class="users-table-wrap" id="usersTableWrap">
      <div class="empty-msg"><span class="spinner"></span></div>
    </div>
  </section>

  <!-- Owner-only: password-reset diagnostics. Tells you WHY a reset didn't arrive
       (no account / rejected link / email off) without reading Railway logs. Dry
       run — sends nothing. Owner-gated, so the public reset stays enumeration-safe. -->
  <section class="users-section" id="resetDiagSection" style="display:none">
    <div class="users-header"><h2>Password reset diagnostics</h2></div>
    <p style="color:var(--muted);font-size:13px;margin:0 0 12px;">Check what a password-reset request for an email would do right now — nothing is sent.</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
      <input type="email" id="rdEmail" placeholder="user@example.com" autocomplete="off"
             style="flex:1;min-width:220px;padding:8px 10px;border-radius:6px;background:var(--bg2);border:1px solid var(--border);color:var(--text);font-size:13px;font-family:inherit;">
      <button class="btn-add-user" id="rdBtn" onclick="runResetDiagnose()">Check</button>
    </div>
    <div id="rdResult" style="margin-top:12px;font-size:13px;line-height:1.5;"></div>
  </section>

  <!-- Create-user modal (owner only). Temp password shown ONCE on success. -->
  <div class="modal-overlay" id="createUserModal" style="display:none" onclick="if(event.target===this)closeCreateUserModal()">
    <div class="modal-box">
      <div class="modal-title">Create user</div>
      <div id="createUserForm">
        <label class="modal-label">First name<input type="text" id="cuFirstName" class="modal-input" placeholder="Ava" maxlength="60" autocomplete="off"></label>
        <label class="modal-label">Last name<input type="text" id="cuLastName" class="modal-input" placeholder="Chen" maxlength="60" autocomplete="off"></label>
        <label class="modal-label">Email<input type="email" id="cuEmail" class="modal-input" placeholder="rep@company.com" autocomplete="off"></label>
        <label class="modal-label">Role
          <select id="cuRole" class="role-select modal-select"><option value="user">user</option><option value="manager">manager</option></select>
        </label>
        <label class="modal-label">Managed by (optional)
          <select id="cuManagedBy" class="role-select modal-select"></select>
        </label>
        <div class="modal-err hidden" id="cuError"></div>
        <div class="modal-actions">
          <button class="btn-modal-secondary" onclick="closeCreateUserModal()">Cancel</button>
          <button class="btn-modal-primary" id="cuSubmit" onclick="submitCreateUser()">Create</button>
        </div>
      </div>
      <div id="createUserSuccess" style="display:none">
        <div class="cu-created-msg">User created. Share this temporary password with them now — <strong>it will not be shown again.</strong></div>
        <div class="cu-email-status" id="cuEmailStatus"></div>
        <div class="temp-pw-box"><code id="cuTempPw"></code><button class="btn-copy" onclick="copyTempPassword()">Copy</button></div>
        <div class="modal-actions"><button class="btn-modal-primary" onclick="closeCreateUserModal()">Done</button></div>
      </div>
    </div>
  </div>

  <!-- SECTION ANALYTICS: per-user analytics widget (v1.1.10). Reuses the
       /dashboard analytics view but for a user the admin/owner selects.
       Pivots on /admin/analytics/:user_id (scope-checked: admins see
       managed users + self, owners see anyone). Empty until a user is
       picked from the dropdown. -->

</div>

<script>
  // ── Session handling (mirrors login.html / dashboard.html) ────────────
  var STORAGE_KEY = 'scout_session_v1';

  function getSession() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch (e) { return null; }
  }
  function setSession(s) { localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); }
  // Diagnostics shim → shared ring buffer/beacon in scout-auth.js.
  function pdiag(e, d, beacon) {
    try {
      if (window.ScoutAuth && ScoutAuth.diag) {
        if (beacon) ScoutAuth.diag.beacon(e, d || null);
        else ScoutAuth.diag.push({ e: e, detail: d || null });
      }
    } catch (x) {}
  }
  // Choke point for this page's inline `if (401){ clearSession(); redirect }`
  // handlers — beacon with a stack so the server log shows which one fired.
  function clearSession() {
    try {
      var st = ''; try { st = (new Error()).stack || ''; } catch (e) {}
      pdiag('admin-clearSession', { stack: st.split('\n').slice(1, 5).join(' || ').slice(0, 400) }, true);
    } catch (e) {}
    localStorage.removeItem(STORAGE_KEY);
  }

  function isSessionValid(s) {
    if (!s || !s.access_token || !s.expires_at) return false;
    var nowSec = Math.floor(Date.now() / 1000);
    return s.expires_at > nowSec + 60;
  }
  function shouldRefresh(s) {
    if (!s || !s.expires_at) return false;
    var nowSec = Math.floor(Date.now() / 1000);
    return s.expires_at - nowSec < 300;
  }
  async function refreshSessionIfNeeded() {
    var s = getSession();
    if (!s || !s.refresh_token) return null;
    if (!shouldRefresh(s)) return s;
    try {
      var res = await fetch('/auth/refresh', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ refresh_token: s.refresh_token }),
      });
      if (!res.ok) { clearSession(); return null; }
      var data = await res.json();
      if (!data.session) { clearSession(); return null; }
      var fresh = {
        access_token: data.session.access_token,
        refresh_token: data.session.refresh_token,
        expires_at: data.session.expires_at,
        email: (data.user && data.user.email) || (s && s.email),
      };
      setSession(fresh);
      return fresh;
    } catch (err) { clearSession(); return null; }
  }

  function signOut() { clearSession(); window.location.replace('/login'); }

  function authHeader() {
    var s = getSession();
    return s && s.access_token ? { 'Authorization': 'Bearer ' + s.access_token } : {};
  }

  // ── State ───────────────────────────────────────────────────────────────
  var currentUser = null;          // { user_id, email, role } from /auth/me
  var usersArray = [];             // Section A
  var ownerCount = 0;              // derived from usersArray

  // ── Init ───────────────────────────────────────────────────────────────
  async function init() {
    var s = getSession();
    if (!isSessionValid(s)) {
      if (s && s.refresh_token) {
        var refreshed = await refreshSessionIfNeeded();
        if (!refreshed) { window.location.replace('/login'); return; }
      } else {
        window.location.replace('/login');
        return;
      }
    }
    var cur = getSession();
    document.getElementById('signedInEmail').textContent = (cur && cur.email) || '';

    // Role gate: non-admin users belong on /dashboard.
    currentUser = await fetchMe();
    if (!currentUser) { clearSession(); window.location.replace('/login'); return; }
    if (currentUser.role === 'user') { window.location.replace('/dashboard'); return; }
    document.getElementById('roleLabel').textContent = currentUser.role === 'owner' ? 'Owner' : 'Admin';
    if (currentUser.role === 'owner') {
      var rd = document.getElementById('resetDiagSection');
      if (rd) rd.style.display = '';
    }

    await loadUsers();
  }

  // Owner-only dry-run: what would a password reset for this email do right now?
  async function runResetDiagnose() {
    var email = (document.getElementById('rdEmail').value || '').trim();
    var out = document.getElementById('rdResult');
    if (!email || email.indexOf('@') === -1) { out.innerHTML = '<span style="color:#f87171;">Enter a valid email address.</span>'; return; }
    var btn = document.getElementById('rdBtn'); var prev = btn.textContent;
    btn.disabled = true; btn.textContent = 'Checking…'; out.textContent = '';
    try {
      var res = await fetch('/admin/reset-diagnose', {
        method: 'POST',
        headers: Object.assign({ 'Content-Type': 'application/json' }, authHeader()),
        body: JSON.stringify({ email: email }),
      });
      if (res.status === 401) { clearSession(); window.location.replace('/login'); return; }
      var data = null; try { data = await res.json(); } catch (e) {}
      if (!res.ok) { out.innerHTML = '<span style="color:#f87171;">' + escapeHtml((data && data.error) || ('HTTP ' + res.status)) + '</span>'; return; }
      var color = data.status === 'would_send' ? '#4ade80' : (data.status === 'no_account' ? 'var(--muted)' : '#fbbf24');
      var label = { would_send: '✓ Would send a reset link', no_account: '○ No Scout account', link_rejected: '✗ Link rejected (dud)', email_not_configured: '✗ Email transport off' }[data.status] || escapeHtml(data.status || 'unknown');
      var extra = data.resolved_redirect ? '<div style="color:var(--muted);font-size:12px;margin-top:4px;">resolved redirect_to: ' + escapeHtml(data.resolved_redirect) + '</div>' : '';
      out.innerHTML = '<div style="color:' + color + ';font-weight:600;">' + label + '</div>'
        + '<div style="color:var(--muted);margin-top:2px;">' + escapeHtml(data.message || '') + '</div>' + extra;
    } catch (e2) {
      out.innerHTML = '<span style="color:#f87171;">Could not reach the server.</span>';
    } finally {
      btn.disabled = false; btn.textContent = prev;
    }
  }

  async function fetchMe() {
    try {
      var res = await fetch('/auth/me', { headers: authHeader() });
      if (res.status === 401) return null;
      if (!res.ok) {
        console.error('[admin] /auth/me returned', res.status);
        return null;
      }
      return await res.json();
    } catch (err) {
      console.error('[admin] /auth/me network error:', err.message);
      return null;
    }
  }

  // ── SECTION A: users ───────────────────────────────────────────────────
  async function loadUsers() {
    var wrap = document.getElementById('usersTableWrap');
    var res;
    try {
      res = await fetch('/admin/users', { headers: authHeader() });
    } catch (err) {
      wrap.innerHTML = '<div class="empty-msg" style="color:#f87171;">Could not reach server.</div>';
      return;
    }
    if (res.status === 401) { clearSession(); window.location.replace('/login'); return; }
    if (res.status === 403) {
      console.error('[admin] /admin/users returned 403 despite role gate passing');
      wrap.innerHTML = '<div class="empty-msg" style="color:#f87171;">Access denied loading users. Try signing out and back in.</div>';
      return;
    }
    if (!res.ok) {
      var err; try { err = await res.json(); } catch (e) { err = { error: 'HTTP ' + res.status }; }
      wrap.innerHTML = '<div class="empty-msg" style="color:#f87171;">' + escapeHtml(err.error || 'Failed to load users') + '</div>';
      return;
    }
    var data = await res.json();
    usersArray = (data && data.users) || [];
    ownerCount = usersArray.filter(function(u) { return u.role === 'owner'; }).length;
    renderUsersTable();
    populateAnalyticsUserSelect();
  }

  // ─── v1.1.10 user analytics ──────────────────────────────────────────
  var analyticsState = { user_id: null, from: null, to: null };

  function populateAnalyticsUserSelect() {
    var sel = document.getElementById('analyticsUserSelect');
    if (!sel) return;
    // Sort by email for predictability.
    var sorted = (usersArray || []).slice().sort(function(a, b) {
      return (a.email || '').localeCompare(b.email || '');
    });
    var options = ['<option value="">Select a user…</option>'];
    for (var i = 0; i < sorted.length; i++) {
      var u = sorted[i];
      options.push('<option value="' + escapeHtml(u.user_id) + '">' + escapeHtml(u.email || u.user_id) + ' · ' + escapeHtml(u.role || 'user') + '</option>');
    }
    sel.innerHTML = options.join('');
    // Default the date range to last 30d so the first selection just works.
    var to = new Date();
    var from = new Date(Date.now() - 30 * 24 * 60 * 60 * 1000);
    analyticsState.from = from.toISOString();
    analyticsState.to = to.toISOString();
  }

  function onAnalyticsUserChange() {
    var sel = document.getElementById('analyticsUserSelect');
    var userId = sel && sel.value;
    if (!userId) {
      document.getElementById('analyticsEmpty').style.display = '';
      document.getElementById('analyticsContent').style.display = 'none';
      analyticsState.user_id = null;
      return;
    }
    analyticsState.user_id = userId;
    document.getElementById('analyticsEmpty').style.display = 'none';
    document.getElementById('analyticsContent').style.display = '';
    loadAnalyticsForUser();
  }

  function setAnalyticsDateRange(days) {
    var to = new Date();
    var from = days >= 9999
      ? new Date('2025-01-01T00:00:00Z')
      : new Date(Date.now() - days * 24 * 60 * 60 * 1000);
    analyticsState.from = from.toISOString();
    analyticsState.to = to.toISOString();
    document.querySelectorAll('.date-preset').forEach(function(b) { b.classList.remove('active'); });
    var activeBtn = document.querySelector('.date-preset[data-days="' + days + '"]');
    if (activeBtn) activeBtn.classList.add('active');
    if (analyticsState.user_id) loadAnalyticsForUser();
  }

  async function loadAnalyticsForUser() {
    var row = document.getElementById('analyticsStatsRow');
    if (!row || !analyticsState.user_id) return;
    row.innerHTML = '<div class="load-spinner"><div class="spinner"></div></div>';
    var url = '/admin/analytics/' + encodeURIComponent(analyticsState.user_id)
      + '?from=' + encodeURIComponent(analyticsState.from)
      + '&to=' + encodeURIComponent(analyticsState.to);
    var res;
    try { res = await fetch(url, { headers: authHeader() }); }
    catch (err) { row.innerHTML = '<div class="empty-msg" style="color:#f87171;">Network error loading analytics</div>'; return; }
    if (res.status === 401) { clearSession(); window.location.replace('/login'); return; }
    if (res.status === 403) {
      row.innerHTML = '<div class="empty-msg" style="color:#f87171;">Not authorized to view that user.</div>';
      return;
    }
    if (!res.ok) {
      row.innerHTML = '<div class="empty-msg" style="color:#f87171;">Could not load analytics (HTTP ' + res.status + ')</div>';
      return;
    }
    var data = await res.json();
    renderAnalyticsStats(data.totals);
    renderAnalyticsObjections(data.objections);
  }

  function renderAnalyticsStats(totals) {
    var parts = [];
    parts.push(analyticsStatCard('Total calls', totals.total_calls, totals.live > 0 ? totals.live + ' still live' : null));
    parts.push(analyticsStatCard('Closed (Won)', totals.wins, analyticsPctOf(totals.wins, totals.total_calls)));
    parts.push(analyticsStatCard('Lost', totals.losses, analyticsPctOf(totals.losses, totals.total_calls)));
    parts.push(analyticsStatCard('Follow-up', totals.follow_ups, analyticsPctOf(totals.follow_ups, totals.total_calls)));
    if (totals.unmarked > 0) parts.push(analyticsStatCard('Unmarked', totals.unmarked, 'no summary yet'));
    document.getElementById('analyticsStatsRow').innerHTML = parts.join('');
  }

  function analyticsStatCard(label, value, sub) {
    var subPart = sub ? '<div class="stat-sub">' + escapeHtml(String(sub)) + '</div>' : '';
    return '<div class="stat-card"><div class="stat-label">' + escapeHtml(label)
      + '</div><div class="stat-value">' + escapeHtml(String(value)) + '</div>' + subPart + '</div>';
  }

  function analyticsPctOf(n, total) {
    if (!total) return null;
    return Math.round((n / total) * 100) + '%';
  }

  function renderAnalyticsObjections(objSection) {
    var section = document.getElementById('analyticsObjectionSection');
    var content = document.getElementById('analyticsObjectionContent');
    if (!objSection || !objSection.by_type || objSection.by_type.length === 0) {
      section.style.display = 'none';
      return;
    }
    section.style.display = 'block';
    var t = objSection.totals;
    var summary = t.total + ' total · ' + t.overcome + ' overcome · ' + t.not_overcome + ' not overcome';
    if (t.unknown > 0) summary += ' · ' + t.unknown + ' indeterminate (transcript quality)';
    var rows = '';
    for (var i = 0; i < objSection.by_type.length; i++) {
      var b = objSection.by_type[i];
      var pct = b.overcome_pct === null
        ? '<span class="pct-none">—</span>'
        : '<span class="' + analyticsPctClass(b.overcome_pct) + '">' + b.overcome_pct + '%</span>';
      rows += '<tr><td>' + escapeHtml(b.label) + '</td>'
        + '<td>' + b.count + '</td>'
        + '<td>' + b.overcome + '</td>'
        + '<td>' + b.not_overcome + '</td>'
        + '<td>' + b.unknown + '</td>'
        + '<td class="pct-cell">' + pct + '</td></tr>';
    }
    content.innerHTML =
      '<div class="objection-totals">' + escapeHtml(summary) + '</div>'
      + '<table class="objection-table">'
      + '<thead><tr><th>Objection</th><th>Count</th><th>Overcome</th><th>Not</th><th>?</th><th>Overcome %</th></tr></thead>'
      + '<tbody>' + rows + '</tbody></table>';
  }

  function analyticsPctClass(pct) {
    if (pct >= 70) return 'pct-good';
    if (pct >= 40) return 'pct-mid';
    return 'pct-bad';
  }

  // Naming decision: role 'owner' is surfaced as "admin (owner)".
  function roleLabel(r) { return r === 'owner' ? 'admin (owner)' : r; }
  function roleBadgeClass(r) { return r === 'owner' ? 'owner' : (r === 'manager' ? 'admin' : 'user'); }
  function managersList() { return usersArray.filter(function(u) { return u.role === 'manager' || u.role === 'owner'; }); }
  function shortDate(iso) { var d = new Date(iso); return isNaN(d.getTime()) ? '—' : d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: '2-digit' }); }

  function renderUsersTable() {
    var wrap = document.getElementById('usersTableWrap');
    var isOwnerViewer = currentUser.role === 'owner';
    var btn = document.getElementById('btnCreateUser');
    if (btn) btn.style.display = isOwnerViewer ? '' : 'none';
    if (usersArray.length === 0) { wrap.innerHTML = '<div class="empty-msg">No users to display.</div>'; return; }

    var header = '<tr><th>Name</th><th>Email</th><th>Role</th><th>Managed by</th><th>Billing</th><th>Status</th><th>Created</th><th></th></tr>';
    var mgrs = managersList();
    var rows = usersArray.map(function(u) {
      var isSelf = u.user_id === currentUser.user_id;
      var editable = isOwnerViewer && !isSelf;   // owners edit others; self + non-owner viewers are read-only
      var roleCell = editable ? roleControlHtml(u)
        : '<span class="role-badge ' + roleBadgeClass(u.role) + '">' + escapeHtml(roleLabel(u.role)) + (isSelf ? '<span class="self-tag">(you)</span>' : '') + '</span>';
      var mbCell = editable ? managedByControlHtml(u, mgrs) : managedByLabel(u);
      var billCell = editable ? billingControlHtml(u) : '<span class="role-badge user">' + escapeHtml(u.billing_status || 'trial') + '</span>';
      var created = u.created_at ? shortDate(u.created_at) : '—';
      var emailDisplay = u.email || (u.user_id.slice(0, 8) + '…');
      var nameDisplay = (u.first_name || u.last_name) ? ((u.first_name || '') + ' ' + (u.last_name || '')).trim() : '—';
      var active = u.active !== false;
      var statusCell = active
        ? '<span style="color:var(--green);font-size:12px;white-space:nowrap;">● active</span>'
        : '<span style="color:var(--muted);font-size:12px;white-space:nowrap;">○ inactive</span>';
      // Full member action set in /admin (owner console) — deactivate/reactivate +
      // delete, alongside the existing role/managed-by(move)/billing controls. Same
      // server-side gates + zero-history delete rule as Team → Manage members.
      var actions = editable
        ? '<div class="admin-actions">'
            + '<button class="btn-resend" title="Resend the set-password / welcome email" onclick="resendWelcomeEmail(this, \'' + u.user_id + '\')">Resend</button>'
            + '<button class="btn-resend" onclick="' + (active ? 'adminDeactivate' : 'adminReactivate') + '(\'' + u.user_id + '\')">' + (active ? 'Deactivate' : 'Reactivate') + '</button>'
            + '<button class="btn-resend admin-danger" onclick="adminDelete(\'' + u.user_id + '\', \'' + escapeHtml(u.email || '') + '\')">Delete</button>'
          + '</div>'
        : '';
      return '<tr>'
        + '<td>' + escapeHtml(nameDisplay) + '</td>'
        + '<td>' + escapeHtml(emailDisplay) + '</td>'
        + '<td>' + roleCell + '</td>'
        + '<td>' + mbCell + '</td>'
        + '<td>' + billCell + '</td>'
        + '<td>' + statusCell + '</td>'
        + '<td style="color:var(--muted);font-size:12px;">' + escapeHtml(created) + '</td>'
        + '<td>' + actions + '</td>'
      + '</tr>';
    });
    wrap.innerHTML = '<table class="users-table"><thead>' + header + '</thead><tbody>' + rows.join('') + '</tbody></table>';
  }

  function fieldControl(u, field, original, opts) {
    return '<select class="role-select" data-original="' + escapeHtml(original) + '"'
      + ' onchange="saveUserField(this, \'' + field + '\', \'' + u.user_id + '\')">' + opts + '</select>'
      + '<span class="field-status" id="fs-' + field + '-' + escapeHtml(u.user_id) + '"></span>';
  }
  function roleControlHtml(u) {
    var opts = [['user', 'user'], ['manager', 'manager'], ['owner', 'admin (owner)']].map(function(o) {
      return '<option value="' + o[0] + '"' + (u.role === o[0] ? ' selected' : '') + '>' + o[1] + '</option>';
    }).join('');
    return fieldControl(u, 'role', u.role, opts);
  }
  function managedByControlHtml(u, mgrs) {
    var opts = '<option value="">None — single user</option>' + mgrs.filter(function(m) { return m.user_id !== u.user_id; }).map(function(m) {
      var lbl = (m.email || m.user_id.slice(0, 8)) + ' (' + roleLabel(m.role) + ')';
      return '<option value="' + escapeHtml(m.user_id) + '"' + (u.managed_by === m.user_id ? ' selected' : '') + '>' + escapeHtml(lbl) + '</option>';
    }).join('');
    return fieldControl(u, 'managed_by', u.managed_by || '', opts);
  }
  function billingControlHtml(u) {
    var cur = u.billing_status || 'trial';
    var opts = ['trial', 'active', 'past_due', 'canceled'].map(function(v) {
      return '<option value="' + v + '"' + (cur === v ? ' selected' : '') + '>' + v + '</option>';
    }).join('');
    return fieldControl(u, 'billing_status', cur, opts);
  }
  function managedByLabel(u) {
    if (!u.managed_by) return '<span style="color:var(--muted);font-size:12px;">—</span>';
    var m = usersArray.filter(function(x) { return x.user_id === u.managed_by; })[0];
    return '<span style="font-size:12px;">' + escapeHtml(m ? (m.email || u.managed_by.slice(0, 8)) : u.managed_by.slice(0, 8)) + '</span>';
  }

  // Save-on-change for role / managed_by / billing_status. Inline ✓ / ✗ feedback;
  // reverts the dropdown to its previous value on any failure so the UI never
  // lies about persisted state.
  async function saveUserField(sel, field, userId) {
    var newVal = sel.value;
    var original = sel.dataset.original || '';
    if (newVal === original) return;
    var status = document.getElementById('fs-' + field + '-' + userId);
    function fail(msg) { sel.value = original; if (status) { status.textContent = '✗ ' + msg; status.className = 'field-status err'; } }

    // Client-side last-owner guard (UX only — the server enforces it too).
    if (field === 'role' && original === 'owner' && newVal !== 'owner' && ownerCount <= 1) { fail('last owner'); return; }
    if (status) { status.textContent = '…'; status.className = 'field-status'; }

    var endpoint = field === 'role' ? '/role' : (field === 'managed_by' ? '/managed_by' : '/billing_status');
    var payload = {}; payload[field] = (field === 'managed_by' && newVal === '') ? null : newVal;
    var res;
    try {
      res = await fetch('/admin/users/' + encodeURIComponent(userId) + endpoint, {
        method: 'PATCH', headers: Object.assign({ 'Content-Type': 'application/json' }, authHeader()), body: JSON.stringify(payload),
      });
    } catch (e) { fail('network'); return; }
    if (res.status === 401) { clearSession(); window.location.replace('/login'); return; }
    if (!res.ok) { var err; try { err = await res.json(); } catch (e) { err = { error: 'HTTP ' + res.status }; } fail(err.error || 'failed'); return; }
    var data = await res.json();
    var idx = -1; for (var i = 0; i < usersArray.length; i++) { if (usersArray[i].user_id === userId) { idx = i; break; } }
    var savedVal = (field === 'managed_by') ? (data.managed_by || null) : data[field];
    if (idx !== -1) usersArray[idx][field] = savedVal;
    sel.dataset.original = savedVal || '';
    if (status) { status.textContent = '✓'; status.className = 'field-status ok'; setTimeout(function() { if (status) { status.textContent = ''; status.className = 'field-status'; } }, 1400); }
    // Role changes can alter ownerCount + the manager option lists — re-render.
    if (field === 'role') { ownerCount = usersArray.filter(function(u) { return u.role === 'owner'; }).length; renderUsersTable(); }
  }

  // openCreateUserModal / submitCreateUser / copyTempPassword / closeCreateUserModal
  function openCreateUserModal() {
    document.getElementById('createUserForm').style.display = '';
    document.getElementById('createUserSuccess').style.display = 'none';
    document.getElementById('cuFirstName').value = '';
    document.getElementById('cuLastName').value = '';
    document.getElementById('cuEmail').value = '';
    document.getElementById('cuRole').value = 'user';
    var mb = document.getElementById('cuManagedBy');
    mb.innerHTML = '<option value="">None — single user</option>' + managersList().map(function(m) {
      return '<option value="' + escapeHtml(m.user_id) + '">' + escapeHtml((m.email || m.user_id.slice(0, 8)) + ' (' + roleLabel(m.role) + ')') + '</option>';
    }).join('');
    var err = document.getElementById('cuError'); err.textContent = ''; err.classList.add('hidden');
    var sub = document.getElementById('cuSubmit'); sub.disabled = false; sub.textContent = 'Create';
    document.getElementById('createUserModal').style.display = 'flex';
  }
  function closeCreateUserModal() {
    document.getElementById('createUserModal').style.display = 'none';
    document.getElementById('cuTempPw').textContent = '';  // never leave the temp password in the DOM
    document.getElementById('cuEmail').value = '';
  }
  async function submitCreateUser() {
    var firstName = document.getElementById('cuFirstName').value.trim();
    var lastName = document.getElementById('cuLastName').value.trim();
    var email = document.getElementById('cuEmail').value.trim();
    var role = document.getElementById('cuRole').value;
    var managed_by = document.getElementById('cuManagedBy').value || null;
    var err = document.getElementById('cuError');
    var sub = document.getElementById('cuSubmit');
    err.classList.add('hidden');
    // Mirror the server rules: names required, 1-60 chars.
    if (!firstName || firstName.length > 60) { err.textContent = 'First name is required (1-60 chars).'; err.classList.remove('hidden'); return; }
    if (!lastName || lastName.length > 60) { err.textContent = 'Last name is required (1-60 chars).'; err.classList.remove('hidden'); return; }
    if (!email || email.indexOf('@') === -1) { err.textContent = 'A valid email is required.'; err.classList.remove('hidden'); return; }
    sub.disabled = true; sub.textContent = 'Creating…';
    var res;
    try {
      res = await fetch('/admin/users', { method: 'POST', headers: Object.assign({ 'Content-Type': 'application/json' }, authHeader()), body: JSON.stringify({ email: email, role: role, managed_by: managed_by, first_name: firstName, last_name: lastName }) });
    } catch (e) { sub.disabled = false; sub.textContent = 'Create'; err.textContent = 'Could not reach server.'; err.classList.remove('hidden'); return; }
    if (res.status === 401) { clearSession(); window.location.replace('/login'); return; }
    if (!res.ok) { var e2; try { e2 = await res.json(); } catch (x) { e2 = { error: 'HTTP ' + res.status }; } sub.disabled = false; sub.textContent = 'Create'; err.textContent = e2.error || 'Failed to create user'; err.classList.remove('hidden'); return; }
    var data = await res.json();
    document.getElementById('cuTempPw').textContent = data.temp_password || '';
    // Invite-first presentation: on invite_sent the temp password stays
    // hidden (the user sets their own via the emailed link). On failure or
    // unconfigured email, the temp-password box IS the fallback, exactly as
    // the pre-email flow worked.
    var es = document.getElementById('cuEmailStatus');
    var pwBox = document.querySelector('#createUserSuccess .temp-pw-box');
    var msg = document.querySelector('#createUserSuccess .cu-created-msg');
    var inviteSent = data.welcome_email === 'invite_sent';
    if (pwBox) pwBox.style.display = inviteSent ? 'none' : '';
    if (msg) msg.innerHTML = inviteSent
      ? 'User created.'
      : 'User created. Share this temporary password with them now — <strong>it will not be shown again.</strong>';
    if (es) {
      if (inviteSent) { es.textContent = '✓ Invite sent — they\'ll set their own password from the email.'; es.style.color = 'var(--good)'; }
      else if (data.welcome_email === 'failed') { es.textContent = '✗ Email failed — temp password fallback shown below.'; es.style.color = 'var(--bad)'; }
      else { es.textContent = 'Email not configured — temp password fallback shown below.'; es.style.color = 'var(--text-muted)'; }
    }
    document.getElementById('createUserForm').style.display = 'none';
    document.getElementById('createUserSuccess').style.display = '';
    loadUsers();   // refresh the table with the new user
  }
  // Owner-only resend: mints a FRESH set-password link server-side and sends
  // the welcome email again. Button reports status inline; failures never
  // block anything (same isolation as creation).
  async function resendWelcomeEmail(btn, userId) {
    var original = btn.textContent;
    btn.disabled = true; btn.textContent = 'Sending…';
    var res;
    try {
      res = await fetch('/admin/users/' + encodeURIComponent(userId) + '/welcome-email', { method: 'POST', headers: authHeader() });
    } catch (e) { btn.disabled = false; btn.textContent = 'Retry — no server'; return; }
    if (res.status === 401) { clearSession(); window.location.replace('/login'); return; }
    var data = null; try { data = await res.json(); } catch (e) {}
    var status = data && data.welcome_email;
    btn.disabled = false;
    if (status === 'invite_sent') { btn.textContent = '✓ Invite sent'; setTimeout(function () { btn.textContent = original; }, 4000); }
    else if (status === 'not_configured') { btn.textContent = 'Email not configured'; }
    else { btn.textContent = '✗ Failed — retry'; }
  }

  // Full member actions in /admin (owner console). Hit the SAME endpoints and
  // gates as Team → Manage members — no new permission paths. Delete keeps the
  // server-side zero-history rule (type-email confirm; backend rejects if the rep
  // has call history → deactivate instead).
  async function adminUserAction(url, opts) {
    try {
      var res = await fetch(url, Object.assign({ headers: Object.assign({ 'Content-Type': 'application/json' }, authHeader()) }, opts || {}));
      if (res.status === 401) { clearSession(); window.location.replace('/login'); return { ok: false }; }
      var d = null; try { d = await res.json(); } catch (e) {}
      if (!res.ok) { alert((d && d.error) || ('Request failed (HTTP ' + res.status + ')')); return { ok: false, data: d }; }
      return { ok: true, data: d };
    } catch (err) { alert('Request failed: ' + (err.message || 'unknown')); return { ok: false }; }
  }
  async function adminDeactivate(uid) {
    if (!confirm('Deactivate this user? They can’t log in and the seat is freed. Their calls and history stay.')) return;
    var r = await adminUserAction('/admin/users/' + encodeURIComponent(uid) + '/deactivate', { method: 'POST', body: '{}' });
    if (r.ok) loadUsers();
  }
  async function adminReactivate(uid) {
    if (!confirm('Reactivate this user? This adds a billable seat and restores their login.')) return;
    var r = await adminUserAction('/admin/users/' + encodeURIComponent(uid) + '/reactivate', { method: 'POST', body: '{}' });
    if (r.ok) loadUsers();
  }
  async function adminDelete(uid, email) {
    var typed = window.prompt('DELETE permanently removes this account. Allowed only for users with NO call history (otherwise deactivate). Type the email to confirm:\n' + email);
    if (typed == null) return;
    var r = await adminUserAction('/admin/users/' + encodeURIComponent(uid), { method: 'DELETE', body: JSON.stringify({ confirm_email: typed.trim() }) });
    if (r.ok) { alert('User deleted.'); loadUsers(); }
  }

  function copyTempPassword() {
    var t = document.getElementById('cuTempPw').textContent;
    if (navigator.clipboard) navigator.clipboard.writeText(t);
  }


  function handleRoleChange(event, userId) {
    var select = event.target;
    var newRole = select.value;
    var originalRole = select.dataset.originalRole;
    var saveBtn = document.querySelector('.role-save[data-user-id="' + cssEsc(userId) + '"]');
    var warn = document.getElementById('warn-' + userId);

    if (newRole === originalRole) {
      if (saveBtn) saveBtn.disabled = true;
      if (warn) { warn.textContent = ''; warn.classList.add('hidden'); }
      return;
    }

    // Client-side last-owner guard (UX only — server is authoritative).
    if (originalRole === 'owner' && newRole !== 'owner' && ownerCount <= 1) {
      if (saveBtn) saveBtn.disabled = true;
      if (warn) { warn.textContent = 'Cannot demote the last owner'; warn.classList.remove('hidden'); }
      return;
    }

    if (saveBtn) saveBtn.disabled = false;
    if (warn) { warn.textContent = ''; warn.classList.add('hidden'); }
  }

  async function handleSaveRole(userId) {
    var select = document.querySelector('.role-select[data-user-id="' + cssEsc(userId) + '"]');
    var saveBtn = document.querySelector('.role-save[data-user-id="' + cssEsc(userId) + '"]');
    var savedPill = document.getElementById('saved-' + userId);
    var warn = document.getElementById('warn-' + userId);
    if (!select || !saveBtn) return;

    var newRole = select.value;
    saveBtn.disabled = true;
    saveBtn.textContent = 'Saving…';

    var res;
    try {
      res = await fetch('/admin/users/' + encodeURIComponent(userId) + '/role', {
        method: 'PATCH',
        headers: Object.assign({ 'Content-Type': 'application/json' }, authHeader()),
        body: JSON.stringify({ role: newRole }),
      });
    } catch (err) {
      saveBtn.textContent = 'Save';
      saveBtn.disabled = false;
      if (warn) { warn.textContent = 'Could not reach server.'; warn.classList.remove('hidden'); }
      return;
    }

    if (res.status === 401) { clearSession(); window.location.replace('/login'); return; }
    if (!res.ok) {
      var err; try { err = await res.json(); } catch (e) { err = { error: 'HTTP ' + res.status }; }
      saveBtn.textContent = 'Save';
      saveBtn.disabled = false;
      if (warn) { warn.textContent = err.error || 'Failed to update role'; warn.classList.remove('hidden'); }
      return;
    }

    var data = await res.json();
    select.dataset.originalRole = data.role;
    saveBtn.textContent = 'Save';
    saveBtn.disabled = true;
    if (warn) { warn.textContent = ''; warn.classList.add('hidden'); }
    if (savedPill) {
      savedPill.classList.add('show');
      setTimeout(function() { savedPill.classList.remove('show'); }, 1600);
    }

    // Update local state and re-render so ownerCount / warnings on OTHER rows refresh.
    var idx = -1;
    for (var i = 0; i < usersArray.length; i++) { if (usersArray[i].user_id === userId) { idx = i; break; } }
    if (idx !== -1) {
      usersArray[idx].role = data.role;
      ownerCount = usersArray.filter(function(u) { return u.role === 'owner'; }).length;
      renderUsersTable();
    }
  }


  // ── Formatters ──────────────────────────────────────────────────────────
  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }
  function cssEsc(s) {
    if (window.CSS && CSS.escape) return CSS.escape(s);
    return String(s).replace(/[^a-zA-Z0-9_-]/g, '\\$&');
  }



  // ── Knowledge Base ──────────────────────────────────────────────────────
  // Identical to dashboard.html. Backend scopes /kb/list by role: admins
  // see their own + their team's uploads; owners see every uploaded entry.
  // Each row's scope badge surfaces the difference visually.
  init();
</script>
