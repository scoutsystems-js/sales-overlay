  function backToOverview() { state.view = 'overview'; render(); }


  // ──────────────────────────────────────────────────────────────────
  // Helpers
  // ──────────────────────────────────────────────────────────────────
  function formatDate(iso) {
    if (!iso) return '—';
    var d = new Date(iso);
    var month = d.toLocaleDateString('en-US', { month: 'short' });
    var day = d.getDate();
    var year = d.getFullYear();
    var today = new Date().getFullYear();
    return year === today ? month + ' ' + day : month + ' ' + day + ', ' + year;
  }

  // ──────────────────────────────────────────────────────────────────
  // Call Library (Scout v2.0 Phase 2 Step 3)
  //
  // The Calls nav item opens this top-level view. It shows a paginated
  // list of the caller's synced Fathom calls with each call's analysis
  // state surfaced as a status badge. Clicking a card currently shows a
  // "coming soon" notice via the existing fathomNotice flash; the full
  // call review page is the next step (Phase 2 Step 4) and will replace
  // the click handler with a real navigation.
  // ──────────────────────────────────────────────────────────────────

  // Date formatter for the library cards: always "Jun 23, 2026" form (with
  // year) per the brief, even when the date is in the current calendar
  // year. Differs from formatDate above which omits the year for current.
  function formatNaturalDate(iso) {
    if (!iso) return '—';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '—';
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  }

  // Duration formatter for the library cards: "57m" or "1h 23m" per the
  // brief, no seconds. Null/invalid → "—".
  function formatNaturalDuration(seconds) {
    if (seconds === null || seconds === undefined) return '—';
    if (typeof seconds !== 'number' || isNaN(seconds) || seconds < 0) return '—';
    var hours = Math.floor(seconds / 3600);
    var minutes = Math.floor((seconds % 3600) / 60);
    if (hours > 0) return hours + 'h ' + minutes + 'm';
    return minutes + 'm';
  }

  // "Manager context" — the same gate as the Team view (manager or owner).
  // These users get the Calls rep-selector + a date-range control (default 7d);
  // everyone else sees the Calls view exactly as before.
  function hasManagerContext() { return !!(state.me && (state.me.role === 'manager' || state.me.role === 'owner')); }
  function callLibRangeFor(days) {
    var to = new Date();
    var from = days >= 9999 ? new Date('2025-01-01T00:00:00Z') : new Date(Date.now() - days * 24 * 60 * 60 * 1000);
    return { from: from.toISOString(), to: to.toISOString(), days: days };
  }

  // ⚠⚠ SEEDED ONCE, THEN INDEPENDENT — NOT KEPT IN SYNC (Justin's ruling 2026-08-16).
  // These are two different relationships and they drift back together if the
  // difference is not written down:
  //   • SEED (drillCalls only): you clicked a number on coaching and are
  //     following a thread, so the calls shown must be the ones behind THAT
  //     number. Coaching's range is COPIED into Calls at that instant.
  //   • OWN (everything after): changing the range in Calls stays in Calls. It
  //     must NEVER write back to coaching, and coaching changing later must
  //     NEVER reach back into Calls. There is exactly one direction, exactly once.
  // Arriving directly from the nav uses Calls' OWN range and does not consult
  // coaching at all.
  // The single copy point. Called from drillCalls and nowhere else — a second
  // caller is how "seeded once" quietly becomes "kept in sync".
  function seedCallsRangeFromCoaching() {
    state.callLibraryRange = state.dateRange
      ? { from: state.dateRange.from, to: state.dateRange.to }
      : callLibRangeFor(7);
  }
  function callsRange() {
    if (!state.callLibraryRange) state.callLibraryRange = callLibRangeFor(7);
    return state.callLibraryRange;
  }
  var callsPickerReady = false;
  function ensureCallsPicker() {
    if (callsPickerReady) return;
    callsPickerReady = true;
    registerDatePicker('calls', function () { return callsRange(); }, setCallsRange);
  }
  // The picker's outlet. Writes ONLY state.callLibraryRange.
  function setCallsRange(from, to) {
    state.callLibraryRange = { from: from, to: to };
    state.callLibrary = null;
    state.callLibraryOffset = 0;
    state.callLibraryError = null;
    syncHashFromState(true);
    renderCallLibrary();          // kicks loadCallLibrary(0)
  }

  async function fetchCallLibrary(offset, limit) {
    var params = ['limit=' + (limit || 20), 'offset=' + (offset || 0)];
    var drilling = !!(state.callLibraryFilter || state.callLibrarySort);
    if (state.callLibraryFilter) params.push('filter=' + encodeURIComponent(state.callLibraryFilter));
    if (state.callLibrarySort)   params.push('sort=' + encodeURIComponent(state.callLibrarySort));
    // Manager-context: always window by the Calls date control (default 7d),
    //   covering their own calls and any rep they pivot to.
    // Everyone else: unchanged — a drill matches its donut's window; a plain
    //   nav entry (no filter) sends no range and shows all calls.
    var range = null;
    if (hasManagerContext()) { range = callsRange(); }
    else if (drilling && state.dateRange) { range = state.dateRange; }
    if (range) {
      params.push('from=' + encodeURIComponent(range.from));
      params.push('to=' + encodeURIComponent(range.to));
    }
    var base = isSelf() ? '/fathom/calls' : '/admin/fathom-calls/' + encodeURIComponent(state.viewingUserId);
    var res = await fetch(base + '?' + params.join('&'), { headers: authHeader() });
    if (res.status === 401) { clearSession(); window.location.replace('/login'); throw new Error('unauth'); }
    if (res.status === 403) throw new Error('Not authorized for that rep');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  }

  // Enter the Call Library from the nav — clears any drill filter (shows all).
  // Manager-context resets the date window to the 7-day default on entry.
  function goCallLibrary() {
    state.callLibraryFilter = null;
    state.callLibrarySort = null;
    state.callLibrary = null;
    state.callLibraryOffset = 0;
    state.callLibraryError = null;
    // Arriving directly uses Calls' OWN range. It is no longer reset to 7d on
    // every entry: team and coaching both persist their ranges, and "Calls owns
    // it" is meaningless if leaving the view discards it. First-ever entry still
    // defaults to 7d via callsRange().
    if (hasManagerContext()) callsRange();
    setView('call-library');
  }

  // (q) The closing / non-closing control.
  //
  // ⚠ IT COMBINES WITH THE DATE RANGE, IT DOES NOT REPLACE IT. Picking "Closed"
  // narrows whatever window is already selected; the dates are untouched.
  //
  // ⚠ CLICKING THE ACTIVE ONE TOGGLES IT OFF, so the control can always be
  // undone without hunting for Clear.
  function setCallsOutcome(key) {
    state.callLibraryFilter = (state.callLibraryFilter === key) ? null : key;
    state.callLibrarySort = null;      // an outcome view is chronological
    state.callLibrary = null;
    state.callLibraryOffset = 0;
    state.callLibraryError = null;
    renderCallLibrary();
  }

  // ⚠ CLEAR RESETS THE FILTER ONLY — NOT THE DATE RANGE, and not the rep
  // selection. "Clear" is the word people expect to reset everything, so the
  // scope is deliberately narrow and stated: it removes the closed/not-closed
  // (or drill) filter and leaves the window you chose exactly as it was.
  function clearCallsFilter() {
    state.callLibraryFilter = null;
    state.callLibrarySort = null;
    state.callLibrary = null;
    state.callLibraryOffset = 0;
    state.callLibraryError = null;
    renderCallLibrary();
  }

  // Enter the Call Library from a coaching donut — applies a filter/sort so the
  // drill shows only the relevant calls (matching the donut's date window).
  function drillCalls(filter, sort) {
    state.callLibraryFilter = filter || null;
    state.callLibrarySort = sort || null;
    state.callLibrary = null;
    state.callLibraryOffset = 0;
    state.callLibraryError = null;
    // THE ONE SEED POINT — see seedCallsRangeFromCoaching. You are following a
    // thread from a number on coaching, so Calls starts on that number's window.
    // From here Calls owns it; nothing writes back.
    if (hasManagerContext()) seedCallsRangeFromCoaching();
    setView('call-library');
  }

  /* REMOVED 2026-08-16 — superseded by setCallsRange, the picker's outlet.
  function setCallLibraryRange(days) {
    state.callLibraryRange = callLibRangeFor(days);
    state.callLibrary = null;
    state.callLibraryOffset = 0;
    state.callLibraryError = null;
    renderCallLibrary(); // kicks loadCallLibrary(0)
  }
  */

  // Calls-view rep selector (manager-context only). Reuses the ?user= pivot
  // machinery (viewingUserId + isSelf() → /admin/fathom-calls/<id>), but stays on
  // the Calls view instead of jumping to overview like setUser. Writes ?user= so
  // the pivot survives refresh; server enforces the managed_by permission.
  // Picker onchange: the two sentinel options toggle the owner-only "All users"
  // reveal; anything else is a real rep pivot.
  function onCallLibraryPick(value) {
    if (value === '__all__') { state.callLibraryShowAllUsers = true; renderCallLibrary(); return; }
    if (value === '__scoped__') {
      state.callLibraryShowAllUsers = false;
      var me = state.me.user_id;
      var stillScoped = state.viewingUserId === me || (state.users || []).some(function (u) { return u.user_id === state.viewingUserId && u.managed_by === me; });
      if (!stillScoped) { setCallLibraryUser(me); return; } // viewed user left the scoped list → snap to self
      renderCallLibrary();
      return;
    }
    setCallLibraryUser(value);
  }
  function setCallLibraryUser(userId) {
    if (!userId || userId === state.viewingUserId) return;
    var url = new URL(window.location.href);
    if (userId === state.me.user_id) url.searchParams.delete('user'); else url.searchParams.set('user', userId);
    window.history.replaceState({}, '', url.toString());
    state.viewingUserId = userId;
    state.callLibrary = null;
    state.callLibraryOffset = 0;
    state.callLibraryError = null;
    renderCallLibrary(); // kicks loadCallLibrary(0)
  }

  // Fire-and-forget load. When offset=0, replaces state.callLibrary; on
  // pagination (offset>0) it concatenates onto the existing list. Re-
  // renders the view automatically when done if still on call-library.
  async function loadCallLibrary(offset) {
    if (state.callLibraryLoading) return; // guard concurrent clicks
    state.callLibraryLoading = true;
    var requestedLimit = 20;
    var startedOffset = offset || 0;
    try {
      var data = await fetchCallLibrary(startedOffset, requestedLimit);
      var calls = (data && data.calls) || [];
      if (startedOffset === 0) {
        state.callLibrary = calls;
      } else {
        state.callLibrary = (state.callLibrary || []).concat(calls);
      }
      // Window-wide counts for the filter labels. They describe the RANGE, not
      // this page, so they must not be recomputed from `calls`.
      if (data && data.outcome_counts) state.callLibraryCounts = data.outcome_counts;
      state.callLibraryHasMore = calls.length >= requestedLimit;
      state.callLibraryOffset = startedOffset + calls.length;
      state.callLibraryError = null;
    } catch (err) {
      if (err.message === 'unauth') return;
      state.callLibraryError = err.message || 'unknown';
    }
    state.callLibraryLoading = false;
    if (state.view === 'call-library') renderCallLibrary();
  }

  // ─── Objections view (objection intelligence) ──────────────────────────
  function goObjections() {
    state.objectionsIntel = null;
    state.objectionsSynthesis = null;
    setView('objections-intel');
  }

  async function fetchObjectionsSynthesis() {
    var qp = 'from=' + encodeURIComponent(state.dateRange.from) + '&to=' + encodeURIComponent(state.dateRange.to);
    var base = isSelf() ? '/me/objections-synthesis' : '/admin/objections-synthesis/' + encodeURIComponent(state.viewingUserId);
    var res = await fetch(base + '?' + qp, { headers: authHeader() });
    if (res.status === 401) { clearSession(); window.location.replace('/login'); throw new Error('unauth'); }
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  }

  async function loadObjectionsSynthesis() {
    if (state.objectionsSynthesisLoading) return;
    state.objectionsSynthesisLoading = true;
    try {
      state.objectionsSynthesis = await fetchObjectionsSynthesis();
    } catch (err) {
      if (err.message === 'unauth') return;
      state.objectionsSynthesis = { available: false, reason: err.message || 'unknown' };
    }
    state.objectionsSynthesisLoading = false;
    if (state.view === 'objections-intel') renderObjectionsIntel();
  }

  async function fetchObjectionsIntel() {
    var qp = 'from=' + encodeURIComponent(state.dateRange.from) + '&to=' + encodeURIComponent(state.dateRange.to);
    var base = isSelf() ? '/me/objections-intel' : '/admin/objections-intel/' + encodeURIComponent(state.viewingUserId);
    var res = await fetch(base + '?' + qp, { headers: authHeader() });
    if (res.status === 401) { clearSession(); window.location.replace('/login'); throw new Error('unauth'); }
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  }

  async function loadObjectionsIntel() {
    if (state.objectionsIntelLoading) return;
    state.objectionsIntelLoading = true;
    try {
      state.objectionsIntel = await fetchObjectionsIntel();
    } catch (err) {
      if (err.message === 'unauth') return;
      state.objectionsIntel = { error: err.message || 'unknown' };
    }
    state.objectionsIntelLoading = false;
    if (state.view === 'objections-intel') renderObjectionsIntel();
  }

  function objStatCard(label, big, small) {
    return '<div style="flex:1;border:1px solid var(--border);border-radius:12px;padding:18px;text-align:center;">'
      + '<div style="font-size:12px;color:var(--text);text-transform:uppercase;letter-spacing:0.04em;">' + escapeHtml(label) + '</div>'
      + '<div style="font-size:30px;font-weight:700;margin:6px 0 2px;">' + escapeHtml(String(big)) + '</div>'
      + '<div style="font-size:12px;color:var(--text);">' + escapeHtml(small) + '</div>'
      + '</div>';
  }

  // Collapse/expand helpers for objection cards (operate on the clicked card).
  function toggleObjResponse(el) {
    var card = el.closest('.pattern-card'); if (!card) return;
    var box = card.querySelector('.obj-response'); if (!box) return;
    var showing = box.style.display === 'block';
    box.style.display = showing ? 'none' : 'block';
    el.textContent = showing ? 'Show response' : 'Hide response';
  }
  function toggleObjQuote(el) {
    var card = el.closest('.pattern-card'); if (!card) return;
    var q = card.querySelector('.obj-quote'); if (!q) return;
    q.classList.toggle('clamped');
    el.textContent = q.classList.contains('clamped') ? 'more' : 'less';
  }

  // Compact, scannable objection card: one-line header (surface + category +
  // resolution + call), clamped prospect quote, collapsed closer response,
  // footer buttons. Whole-card is NOT clickable — actions are explicit buttons.
  function objFeedCard(f) {
    var surface = f.surface
      ? '<span class="obj-surface">' + escapeHtml(f.surface) + '</span>'
      : '<span class="obj-surface" style="color:var(--text);">objection</span>';
    var catChip = (f.category && f.category !== 'uncategorized')
      ? '<span class="scope-pill">' + escapeHtml(f.category) + '</span>' : '';
    // The badge reports the MOMENT's own resolution — except where the call
    // closed, which credits it. Saying so on the row is what stops "unresolved"
    // sitting under a rate that counted it as handled.
    var resBadge = f.credited ? '<span class="badge badge-win" title="The call closed, so this objection is credited as handled">credited · call closed</span>'
      : (f.resolution === 'handled' ? '<span class="badge badge-win">handled</span>'
      : (f.resolution === 'partial' ? '<span class="badge badge-fu">partial</span>'
      : (f.resolution === 'unhandled' ? '<span class="badge badge-loss">unresolved</span>' : '')));
    var quoteMore = (f.quote && f.quote.length > 120)
      ? ' <span class="obj-toggle" onclick="toggleObjQuote(this)">more</span>' : '';
    var respBlock = f.closer_response
      ? '<div style="margin-top:8px;"><span class="obj-toggle" onclick="toggleObjResponse(this)">Show response</span>'
        + '<div class="obj-response"><span style="color:var(--text);">Closer: </span>' + escapeHtml(f.closer_response) + '</div></div>'
      : '';
    var clip = f.clip_url ? '<a class="obj-btn" href="' + escapeHtml(f.clip_url) + '" target="_blank" rel="noopener">▶ Watch Clip</a>' : '';
    var review = '<button class="obj-btn" type="button" onclick="openCallReview(\'' + escapeHtml(f.fathom_call_id) + '\')">View Call Review</button>';
    return '<div class="pattern-card">'
      + '<div class="obj-card-head">' + surface + catChip + resBadge
        + '<span class="obj-callmeta">' + escapeHtml(f.title || 'Untitled Call') + ' · ' + escapeHtml(formatDate(f.call_date)) + '</span>'
      + '</div>'
      + '<div class="obj-quote clamped">' + escapeHtml(f.quote || '') + '</div>' + quoteMore
      + (f.observation ? '<div class="pattern-meta"><span>' + escapeHtml(f.observation) + '</span></div>' : '')
      + respBlock
      + '<div class="obj-footer">' + clip + review + '</div>'
      + '</div>';
  }

  // Grounded coaching synthesis — a distinct panel ABOVE the feed. Structure
  // (ISOLATE / REFRAME / OVERCOME) ships now; content populates once the
  // synthesis generator is built (credit- + re-analysis-gated).
  function renderObjSynthPanel() {
    var s = state.objectionsSynthesis;
    var head = '<div class="section-header" style="margin:0 0 6px;"><h2 style="font-size:15px;">Coaching Synthesis</h2>'
      + '<div class="meta">grounded in your own handled objections</div></div>';
    var body;
    if (s === null) {
      body = '<div class="load-state" style="padding:14px 4px;"><div class="spinner"></div> Generating coaching…</div>';
    } else if (!s.available) {
      body = '<div class="empty"><h3>Synthesis unavailable</h3><p>Could not generate coaching right now'
        + (s.reason ? ' (' + escapeHtml(s.reason) + ')' : '') + '. The objection data below is unaffected.</p></div>';
    } else if (!s.categories || s.categories.length === 0) {
      body = '<div class="empty"><h3>No categorized objections yet</h3><p>Once objections are categorized in this window, per-category coaching appears here.</p></div>';
    } else {
      body = s.categories.map(objSynthSection).join('');
    }
    return '<div class="synth-panel fade-in">' + head + body + '</div>';
  }

  function objSynthSection(c) {
    var labelMap = { fear: 'Fear', logistical: 'Logistical', timing: 'Timing', partner: 'Partner' };
    var tag = c.grounded
      ? '<span class="badge badge-win">grounded</span>'
      : '<span class="scope-pill">general best practice</span>';
    var blocks = '<div class="synth-grid">'
      + '<div class="synth-block"><h4>Isolate</h4><div class="body">' + escapeHtml(c.isolate || '—') + '</div></div>'
      + '<div class="synth-block"><h4>Reframe</h4><div class="body">' + escapeHtml(c.reframe || '—') + '</div></div>'
      + '<div class="synth-block"><h4>Overcome</h4><div class="body">' + escapeHtml(c.overcome || '—') + '</div></div>'
      + '</div>';
    var evidence = '';
    if (c.grounded && c.evidence && c.evidence.length) {
      evidence = '<div style="margin-top:10px;font-size:12px;color:var(--text);">Your handled example' + (c.evidence.length > 1 ? 's' : '') + ':</div>'
        + c.evidence.map(function(e) {
            var clip = e.clip_url ? ' <a class="obj-btn" href="' + escapeHtml(e.clip_url) + '" target="_blank" rel="noopener" style="padding:2px 8px;">▶ Clip</a>' : '';
            return '<div class="obj-response" style="display:block;margin-top:6px;"><span style="color:var(--text);">Closer: </span>' + escapeHtml(e.closer_response || e.quote || '') + clip + '</div>';
          }).join('');
    }
    return '<div style="border-top:1px solid var(--border);padding-top:14px;margin-top:14px;">'
      + '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;">'
        + '<span class="obj-surface">' + escapeHtml(labelMap[c.category] || c.category) + '</span>'
        + '<span style="font-size:12px;color:var(--text);">' + c.count + ' objection' + (c.count === 1 ? '' : 's') + ' · ' + c.handled + ' handled</span>'
        + '<span style="margin-left:auto;">' + tag + '</span>'
      + '</div>'
      + blocks + evidence
      + '</div>';
  }

  function renderObjectionsIntel() {
    var content = document.getElementById('content');
    if (state.objectionsIntel === null && !state.objectionsIntelLoading) loadObjectionsIntel();
    if (state.objectionsSynthesis === null && !state.objectionsSynthesisLoading) loadObjectionsSynthesis();
    // Reachable only via the Objections donut — provide an explicit way back.
    var header = '<button class="back-btn" onclick="backToOverview()" style="margin-bottom:14px;">← Back to Dashboard</button>' + renderHeaderHtml();
    if (state.objectionsIntel === null) {
      content.innerHTML = header + '<div class="section"><div class="skeleton" style="height:90px;"></div></div>';
      return;
    }
    if (state.objectionsIntel.error) {
      content.innerHTML = header + '<div class="error fade-in">Could not load objections: ' + escapeHtml(state.objectionsIntel.error) + '</div>';
      return;
    }
    var d = state.objectionsIntel, m = d.metrics;
    var metricsHtml = '<div class="fade-in" style="display:flex;gap:16px;flex-wrap:wrap;margin-bottom:24px;">'
      + objStatCard('Objections', m.total, m.calls_with_objection + ' call' + (m.calls_with_objection === 1 ? '' : 's'))
      // ⚠ THE FOUR COUNTS MUST ADD UP TO THE RATE BESIDE THEM. `credited` is
      // objections on calls that CLOSED — handled by the ruling of 2026-08-17
      // even where the moment itself was not. Without showing it, a manager
      // adds up handled/partial/unhandled and gets a different rate.
      + objStatCard('Handle Rate', m.handled_rate === null ? '—' : (m.handled_rate + '%'),
          (m.handled + (m.credited || 0) + m.partial + m.unhandled) + ' resolution-tagged')
      + objStatCard('Handled', m.handled + (m.credited || 0),
          (m.credited ? m.credited + ' credited (call closed) · ' : '') + m.partial + ' partial · ' + m.unhandled + ' unhandled')
      + '</div>';

    var cats = [['fear', 'Fear'], ['logistical', 'Logistical'], ['timing', 'Timing'], ['partner', 'Partner'], ['uncategorized', 'Uncategorized']];
    var catRows = cats.map(function(pair) {
      var b = d.by_category[pair[0]] || { total: 0, handled: 0 };
      var pct = m.total > 0 ? Math.round(100 * b.total / m.total) : 0;
      return '<div style="display:flex;align-items:center;gap:14px;padding:7px 0;border-bottom:1px solid var(--border);">'
        + '<div style="width:110px;font-size:13px;color:var(--text);">' + escapeHtml(pair[1]) + '</div>'
        + '<div style="flex:1;height:8px;background:var(--border);border-radius:4px;overflow:hidden;"><div style="width:' + pct + '%;height:100%;background:var(--accent);border-radius:4px;"></div></div>'
        + '<div style="width:150px;text-align:right;font-size:13px;">' + b.total + ' <span style="color:var(--text);">(' + b.handled + ' handled)</span></div>'
        + '</div>';
    }).join('');
    var uncat = d.by_category.uncategorized ? d.by_category.uncategorized.total : 0;
    var catNote = (m.total > 0 && uncat === m.total)
      ? '<div class="signal-banner"><div class="signal-banner-icon"></div><div><strong>Categories pending re-analysis.</strong> These objections were analyzed before categorization shipped — re-analyze to populate surface + category + resolution + the closer\'s own handling lines.</div></div>'
      : '';

    // Feed grouped by category, count header per group, ordered fear→…→uncategorized.
    var order = ['fear', 'logistical', 'timing', 'partner', 'uncategorized'];
    var labels = { fear: 'Fear', logistical: 'Logistical', timing: 'Timing', partner: 'Partner', uncategorized: 'Uncategorized' };
    var groups = {}; order.forEach(function(k) { groups[k] = []; });
    (d.feed || []).forEach(function(f) { groups[(order.indexOf(f.category) !== -1) ? f.category : 'uncategorized'].push(f); });
    var feedHtml = '';
    order.forEach(function(k) {
      if (groups[k].length === 0) return;
      feedHtml += '<div class="obj-group-header">' + escapeHtml(labels[k]) + ' · ' + groups[k].length + '</div>' + groups[k].map(objFeedCard).join('');
    });
    if (!feedHtml) feedHtml = '<div class="empty"><h3>No objections in this window</h3><p>Pick a wider date range, or wait for new analyzed calls.</p></div>';

    content.innerHTML = header
      + metricsHtml
      + '<div class="section fade-in"><div class="section-header"><h2>By Category</h2></div>' + catNote + catRows + '</div>'
      + renderObjSynthPanel()
      + '<div class="section fade-in"><div class="section-header"><h2>Objection Moments</h2><div class="meta">' + (d.feed || []).length + ' shown</div></div>' + feedHtml + '</div>';
  }

  function renderCallLibrary() {
    var content = document.getElementById('content');

    // First render after entering the view: kick off the fetch and show
    // skeletons. The fetch's completion handler re-calls renderCallLibrary
    // with state populated.
    if (state.callLibrary === null && !state.callLibraryLoading) {
      loadCallLibrary(0); // async, no await — re-renders when done
    }

    var header = renderCallLibraryHeaderHtml();
    var notice = renderFathomNoticeHtml(); // reuse the global flash mechanism

    if (state.callLibraryError) {
      content.innerHTML = header + notice
        + '<div class="error fade-in">Could not load calls: ' + escapeHtml(state.callLibraryError) + '</div>';
      return;
    }

    if (state.callLibrary === null) {
      // Initial loading state — skeleton rows, no real data yet.
      content.innerHTML = header + notice + renderCallLibrarySkeletonsHtml();
      return;
    }

    if (state.callLibrary.length === 0) {
      content.innerHTML = header + notice
        + '<div class="empty fade-in">'
          + '<h3>No calls synced yet</h3>'
          + '<p>Connect a recording source (Zoom or Fathom) and your synced calls will show up here for grading.</p>'
          + connectSourceCtaHtml()
        + '</div>';
      return;
    }

    var cards = state.callLibrary.map(callLibraryCardHtml).join('');
    var loadMore = '';
    if (state.callLibraryHasMore) {
      loadMore = '<div style="display:flex;justify-content:center;margin-top:18px;">'
        + '<button class="btn-fathom-secondary" type="button" onclick="loadCallLibrary(' + state.callLibraryOffset + ')"'
        + (state.callLibraryLoading ? ' disabled>Loading…' : '>Load more')
        + '</button></div>';
    }
    content.innerHTML = header + notice
      + '<div class="library-list fade-in">' + cards + '</div>'
      + loadMore;
  }

  function renderCallLibraryHeaderHtml() {
    var count = (state.callLibrary && state.callLibrary.length) || 0;
    var sub = state.callLibrary === null
      ? 'Loading your synced Fathom calls…'
      : (count === 0
          ? 'Your synced Fathom calls will appear here.'
          : count + ' call' + (count === 1 ? '' : 's') + ' shown' + (state.callLibraryHasMore ? ' (more available)' : ''));
    // (q) 2026-08-17 — the closing / non-closing control.
    var oc = (state.callLibraryCounts || {});
    var f = state.callLibraryFilter;
    function outBtn(key, text, n) {
      return '<button class="calls-outcome-btn' + (f === key ? ' active' : '') + '" type="button"'
        + ' onclick="setCallsOutcome(\'' + key + '\')">' + text
        + (typeof n === 'number' ? '<span class="calls-outcome-n">' + n + '</span>' : '') + '</button>';
    }
    // ⚠ COUNTS WITH THEIR RAW NUMBERS, and the third number is the honest one:
    // "ungraded" belongs to NEITHER side. On live data it is ~46% of calls, so
    // hiding it would make the two buttons look like they partition the range
    // when they do not.
    var outcomeControl = '<div class="calls-outcome">'
      + outBtn('closed', 'Closed', oc.closed)
      + outBtn('not_closed', 'Not Closed', oc.not_closed)
      + (f ? '<button class="calls-outcome-clear" type="button" onclick="clearCallsFilter()">Clear</button>' : '')
      + (typeof oc.ungraded === 'number' && oc.ungraded > 0
          ? '<span class="calls-outcome-note">' + oc.ungraded + ' not graded yet — in neither group</span>' : '')
      + '</div>';

    // Active drill filter chip (only present when arrived via a donut).
    var chip = '';
    var label = state.callLibraryFilter === 'objections' ? 'With Objections'
              : (state.callLibrarySort === 'score' ? 'Analyzed · Worst Score First'
              : (state.callLibraryFilter === 'analyzed' ? 'Analyzed'
              : (state.callLibraryFilter === 'closed' ? 'Closed Calls'
              : (state.callLibraryFilter === 'not_closed' ? 'Calls That Did Not Close' : ''))));
    if (label) {
      chip = '<span class="scope-pill" style="margin-left:10px;">' + escapeHtml(label)
        + ' <a onclick="goCallLibrary();return false;" style="cursor:pointer;text-decoration:underline;">clear</a></span>';
    }
    // Manager-context controls: a rep selector (self + managed reps for a manager;
    // everyone for an owner — server-filtered in state.users) + date presets.
    var controls = '';
    if (hasManagerContext()) {
      var picker = '';
      var me = state.me.user_id, isOwner = state.me.role === 'owner';
      var all = (state.users || []).slice().sort(function (a, b) {
        if (a.user_id === me) return -1; if (b.user_id === me) return 1; // self first
        return (a.email || '').localeCompare(b.email || '');
      });
      // Scope by ASSIGNMENT for ALL roles: the picker lists the user's assigned
      // reps (managed_by === me) + themselves — owners no longer default to every
      // user. Owners keep the capability via an explicit "All users" reveal.
      var scoped = all.filter(function (u) { return u.user_id === me || u.managed_by === me; });
      var list, tail = '';
      if (isOwner && state.callLibraryShowAllUsers) {
        list = all;
        tail = '<option value="__scoped__">↑ My reps only</option>';
      } else {
        list = scoped;
        if (isOwner) tail = '<option value="__all__">All users…</option>';
      }
      // Manager: only worth a picker if there's someone besides self. Owner:
      // always render it (the "All users" reveal is meaningful even with 0 reps).
      if (list.length >= 2 || isOwner) {
        var opts = list.map(function (u) {
          var self = u.user_id === me;
          var lbl = (self ? 'Me — ' : '') + (u.email || u.user_id);
          return '<option value="' + escapeHtml(u.user_id) + '"' + (u.user_id === state.viewingUserId ? ' selected' : '') + '>' + escapeHtml(lbl) + '</option>';
        }).join('');
        picker = '<select class="user-select" onchange="onCallLibraryPick(this.value)">' + opts + tail + '</select>';
      }
      ensureCallsPicker();
      var presets = datePickerHtml('calls');
      /* REMOVED 2026-08-16 — superseded by the date picker above.
      var range = state.callLibraryRange || callLibRangeFor(7);
      var presets = [[7, '7d'], [30, '30d'], [90, '90d']].map(function (p) {

  function renderCallLibrarySkeletonsHtml() {

  // Thread 1: manual outcome tag. UX gate (server is authoritative): a
  // manager/owner may tag calls in scope; an UNMANAGED user may tag their own.
  // A managed rep viewing their own calls gets a read-only badge.
  function canTagOutcomeClient() {
    if (state.me && (state.me.role === 'manager' || state.me.role === 'owner')) return true;
    return !!(state.me && !state.me.is_managed && isSelf());
  }
  var OUTCOME_OPTS = [['closed', 'Closed'], ['follow_up', 'Follow up'], ['lost', 'Lost'], ['no_show', 'No show']];
  function outcomeTagHtml(callId, outcome, source, stopProp) {
    var sp = stopProp ? 'event.stopPropagation();' : '';
    if (!canTagOutcomeClient()) {
      var lbl = (OUTCOME_OPTS.filter(function (o) { return o[0] === outcome; })[0] || [null, outcome || '—'])[1];
      return '<span class="outcome-tag-badge ' + escapeHtml(outcome || 'none') + '">' + escapeHtml(lbl || '—') + '</span>';
    }
    var opts = '<option value=""' + (outcome ? '' : ' selected') + ' disabled>Set outcome…</option>'
      + OUTCOME_OPTS.map(function (o) { return '<option value="' + o[0] + '"' + (o[0] === outcome ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('');
    var mark = source === 'manual' ? ' <span class="outcome-tag-src" title="set by a person">✓</span>' : (source === 'inferred' ? ' <span class="outcome-tag-src ai" title="AI-inferred — confirm or correct">AI</span>' : '');
    return '<span class="outcome-tag" onclick="' + sp + '">'
      + '<select class="outcome-tag-select ' + escapeHtml(outcome || 'none') + '" onchange="' + sp + 'setCallOutcome(\'' + escapeHtml(callId) + '\', this.value)">' + opts + '</select>' + mark + '</span>';
  }
  async function setCallOutcome(callId, outcome) {
    if (!outcome) return;
    try {
      var res = await fetch('/me/calls/' + encodeURIComponent(callId) + '/outcome', {
        method: 'PATCH', headers: Object.assign({ 'Content-Type': 'application/json' }, authHeader()), body: JSON.stringify({ outcome: outcome }) });
      if (res.status === 401) { clearSession(); window.location.replace('/login'); return; }
      var d = null; try { d = await res.json(); } catch (e) {}
      if (!res.ok) { alert((d && d.error) || 'Could not update outcome'); return; }
      // Refresh whatever surface is showing so close rate / tiles reflect the change.
      if (state.view === 'call-library') { state.callLibrary = null; renderCallLibrary(); }
      else if (state.view === 'call-review') { state.callReview = null; loadCallReview(state.selectedCallId); }
      state.analytics2 = null; state.needsWork = null; // stale after an outcome change
      if (state.view === 'overview') reloadAll();
    } catch (err) { alert('Could not update outcome: ' + (err.message || 'unknown')); }
  }

  function callLibraryCardHtml(c) {
    var resolvedName = callLabel(c);
    var title = resolvedName
      ? '<span>' + escapeHtml(resolvedName) + '</span>'
      : (c.title && String(c.title).trim())
      ? '<span>' + escapeHtml(c.title) + '</span>'
      : '<span class="anon">Untitled Call</span>';
    var dateStr = formatNaturalDate(c.call_date);
    var durStr = formatNaturalDuration(c.duration_seconds);

    var meta = '<span>' + escapeHtml(dateStr) + '</span>'
             + '<span class="sep">·</span>'
             + '<span>' + escapeHtml(durStr) + '</span>';

    var badge = libraryStatusBadgeHtml(c.analysis_status, c.overall_score);

    var recordingLink = '';
    if (c.recording_url && typeof c.recording_url === 'string') {
      // event.stopPropagation prevents the card's onclick from firing when
      // the user wanted to open the Fathom link directly.
      recordingLink = '<a class="library-recording-link" href="' + escapeHtml(c.recording_url)
        + '" target="_blank" rel="noopener" onclick="event.stopPropagation()">View in Fathom →</a>';
    }

    var cardId = escapeHtml(String(c.id || ''));
    return '<div class="library-card" onclick="openCallReview(\'' + cardId + '\')">'
      + '<div class="library-card-main">'
        + '<div class="library-card-title' + (c.title ? '' : ' anon') + '">' + title + '</div>'
        + '<div class="library-card-meta">' + meta + '</div>'
      + '</div>'
      + '<div class="library-card-side">'
        + (c.analysis_status === 'done' ? outcomeTagHtml(c.id, c.outcome, c.outcome_source, true) : '')
        + badge
        + recordingLink
      + '</div>'
    + '</div>';
  }

  function libraryStatusBadgeHtml(analysisStatus, overallScore) {
    // No analysis row at all: grey "Pending" — the analysis worker hasn't
    // picked this call up yet.
    if (!analysisStatus || analysisStatus === 'pending') {
      return '<span class="library-status-badge pending">Pending</span>';
    }
    if (analysisStatus === 'processing') {
      return '<span class="library-status-badge analyzing"><span class="spinner-tiny"></span>Analyzing…</span>';
    }
    if (analysisStatus === 'done') {
      var scoreText = (typeof overallScore === 'number') ? overallScore + '/100' : 'Done';
      return '<span class="library-status-badge done">' + escapeHtml(scoreText) + '</span>';
    }
    if (analysisStatus === 'error') {
      return '<span class="library-status-badge error">Error</span>';
    }
    // Unknown status — render as pending so we never blow up.
    return '<span class="library-status-badge pending">' + escapeHtml(String(analysisStatus)) + '</span>';
  }

  // ──────────────────────────────────────────────────────────────────
  // Call Review page — Scout v2.0 Phase 2 Step 4
  // Navigates to a per-call view that shows highlights timeline, section
  // grades, and follow-up email. Three sections in fixed order — highlights
  // come first by design (the brief's "lead with what happened, support
  // with how it scored").
  // ──────────────────────────────────────────────────────────────────

  // Format integer seconds as "M:SS" (under 1 hour) or "H:MM:SS" — used for
  // human-readable highlight timestamps. Raw seconds still drive the
  // `?t=<seconds>` Fathom deep-link href; the visible label is this.
  function formatTimestampDisplay(seconds) {
    if (typeof seconds !== 'number' || isNaN(seconds) || seconds < 0) return '—';
    var s = Math.floor(seconds);
    var h = Math.floor(s / 3600);
    var m = Math.floor((s % 3600) / 60);
    var sec = s % 60;
    var pad = function(n) { return (n < 10 ? '0' : '') + n; };
    if (h > 0) return h + ':' + pad(m) + ':' + pad(sec);
    return m + ':' + pad(sec);
  }

  async function fetchCallReview(callId) {
    var res = await fetch('/fathom/calls/' + encodeURIComponent(callId), { headers: authHeader() });
    if (res.status === 401) { clearSession(); window.location.replace('/login'); throw new Error('unauth'); }
    if (res.status === 404) throw new Error('Call not found');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  }

  // Fire-and-forget loader. Re-renders the view when done, but only if the
  // user hasn't navigated away in the meantime AND we're still showing the
  // call this fetch was kicked off for (guards stale resolves).
  async function loadCallReview(callId) {
    if (state.callReviewLoading) return;
    state.callReviewLoading = true;
    state.callReviewError = null;
    try {
      var data = await fetchCallReview(callId);
      if (state.selectedCallId !== callId) return; // user navigated away — drop stale data
      state.callReview = data;
    } catch (err) {
      if (err.message === 'unauth') return;
      if (state.selectedCallId !== callId) return; // same stale-resolve guard for errors
      state.callReviewError = err.message || 'unknown';
    }
    state.callReviewLoading = false;
    if (state.view === 'call-review') renderCallReview();
    // Which moments are already in this caller's KB (Part 2b). Fire-and-forget and
    // fully degradable: on any failure every row just renders as unsaved, and
    // adding again is idempotent server-side anyway.
    loadSavedMoments(callId);
  }

  // Server computes the saved set (it owns the quote-normalization), so the
  // browser never needs a copy of normalizeQuote — that would be exactly the
  // mirrored-predicate duplication 2a spent its budget retiring.
  async function loadSavedMoments(callId) {
    try {
      var res = await fetch('/kb/saved-moments/' + encodeURIComponent(callId), { headers: authHeader() });
      if (!res.ok) return;
      var data = await res.json();
      if (state.selectedCallId !== callId) return; // navigated away
      var map = {};
      ((data && data.saved_highlight_ids) || []).forEach(function(id) { map[id] = true; });
      state.savedMomentIds = map;
      if (state.view === 'call-review') renderCallReview();
    } catch (err) { /* degrade silently — unsaved is the safe default */ }
  }

  // Add-to-KB click. Sends IDS ONLY. A duplicate is reported as success, because
  // the user's intent ("this moment should be in my KB") is already satisfied —
  // that is what makes the button idempotent with 2d's auto-population.
  async function addMomentToKb(highlightId, btn) {
    if (!highlightId || !state.selectedCallId) return;
    if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
    var res;
    try {
      res = await fetch('/kb/from-highlight', {
        method: 'POST',
        headers: Object.assign({ 'Content-Type': 'application/json' }, authHeader()),
        body: JSON.stringify({ fathom_call_id: state.selectedCallId, highlight_id: highlightId }),
      });
    } catch (err) {
      if (btn) { btn.disabled = false; btn.textContent = '+ Add to KB'; }
      window.alert('Could not reach server: ' + err.message);
      return;
    }
    if (res.status === 401) { clearSession(); window.location.replace('/login'); return; }
    if (!res.ok) {
      var e;
      try { e = await res.json(); } catch (x) { e = { error: 'HTTP ' + res.status }; }
      if (btn) { btn.disabled = false; btn.textContent = '+ Add to KB'; }
      window.alert('Could not add to knowledge base: ' + (e.error || 'unknown error'));
      return;
    }
    if (!state.savedMomentIds) state.savedMomentIds = {};
    state.savedMomentIds[highlightId] = true;
    if (btn) {
      btn.textContent = 'In KB ✓';
      btn.classList.add('is-saved');
      btn.disabled = true;
    }
  }

  function renderCallReview() {
    var content = document.getElementById('content');
    var callId = state.selectedCallId;
    if (!callId) { backToCallLibrary(); return; }

    // Pull the partial card from the library cache to render the header
    // instantly while the full fetch is in flight. Avoids a blank flash.
    var seed = null;
    if (Array.isArray(state.callLibrary)) {
      for (var i = 0; i < state.callLibrary.length; i++) {
        if (state.callLibrary[i].id === callId) { seed = state.callLibrary[i]; break; }
      }
    }

    var review = state.callReview;
    var header = renderCallReviewHeaderHtml(review, seed);
    var notice = renderFathomNoticeHtml();

    if (state.callReviewError && !review) {
      content.innerHTML = header + notice
        + '<div class="error fade-in">'
          + 'Could not load this call: ' + escapeHtml(state.callReviewError)
          + ' <button class="btn-fathom-secondary" style="margin-left:12px;" type="button" onclick="loadCallReview(\'' + escapeHtml(callId) + '\')">Retry</button>'
        + '</div>';
      return;
    }

    if (!review) {
      // Loading state — three section-sized skeletons under the header.
      content.innerHTML = header + notice
        + '<div class="fade-in">'
          + '<div class="review-skeleton-section"></div>'
          + '<div class="review-skeleton-section"></div>'
          + '<div class="review-skeleton-section"></div>'
        + '</div>';
      return;
    }

    var errorBanner = '';
    if (review.analysis && review.analysis.status === 'error') {
      var reason = review.analysis.overall_summary || 'Analysis failed.';
      errorBanner = '<div class="review-analysis-error fade-in">'
        + '<strong>Analysis error.</strong> ' + escapeHtml(reason)
        + '</div>';
    }

    // The verdict LEADS — "Why this call closed / didn't close" is the first
    // content below the page header (above the Fathom notice, error banner, and
    // Call Highlights). Everything else is supporting evidence. Returns '' for
    // follow_up/no_show/pre-v4 calls, so those pages simply start at the notice.
    content.innerHTML = header
      + renderWhyOutcomeSectionHtml(review)
      // 7d sits directly under the verdict: the verdict says what happened,
      // this says which ground would have changed it. Renders '' unless the
      // server verified all three claims, so it never leaves an empty shell.
      + notice + errorBanner
      + '<div class="fade-in">'
        + renderHighlightsSectionHtml(review)
        + renderGradesSectionHtml(review)
        + renderFollowupSectionHtml(review)
      + '</div>';
  }

  // correction (cause → fix). Win-class: what won it. Hidden for other/no
  // outcome or when the (pre-v4) analysis lacks the tied why_outcome field.
  function whyOutcomeState(review) {
    var a = review && review.analysis;
    if (!a || a.status !== 'done') return null;
    var hasWhy = typeof a.why_outcome === 'string' && a.why_outcome.trim();
    if (!hasWhy) return null;
    if (a.outcome === 'lost')      return { kind: 'loss' };
    if (a.outcome === 'closed')    return { kind: 'win' };
    if (a.outcome === 'follow_up') return { kind: 'pending' };
    return null; // no_show / null → section hidden
  }

  // the Item D double-render happened because the two sites drifted apart when
  // grader v5 added follow_up to the verdict pairing.
  function verdictKindShowsOneThing(kind) {
    return kind === 'loss' || kind === 'pending';
  }

  // Human label for an area key, falling back to a readable form of the key
  // itself rather than showing raw snake_case.
  function areaLabelFor(review, key) {
    var areas = (review && review.coaching_areas) || [];
    for (var i = 0; i < areas.length; i++) {
      if (areas[i] && areas[i].key === key && areas[i].label) return areas[i].label;
    }
    return String(key || '').replace(/_/g, ' ').replace(/^./, function (c) { return c.toUpperCase(); });
  }

  function renderWhyOutcomeSectionHtml(review) {
    var st = whyOutcomeState(review);
    if (!st) return '';
    var a = review.analysis;
    var recordingUrl = review.recording_url || null;

    var title = st.kind === 'loss' ? 'Why this call didn’t close'
      : st.kind === 'win' ? 'Why this call closed'
      : 'Why this call hasn’t closed yet';
    var reason = '<div class="review-why-reason">' + escapeHtml(a.why_outcome) + '</div>';
    var quote = (typeof a.why_quote === 'string' && a.why_quote.trim())
      ? '<div class="review-why-quote">“' + escapeHtml(a.why_quote) + '”</div>' : '';
    var clip = (typeof a.why_timestamp_seconds === 'number')
      ? reviewClipHtml(a.why_timestamp_seconds, recordingUrl, 'Play this moment') : '';

    var inner = '<div class="review-why-label">' + escapeHtml(title) + '</div>'
      + reason + quote + clip;

    // Loss + pending (follow_up): pair the correction/next-move directly beneath
    // the cause. For a follow_up it's the move that advances the deal, not a fix
    // for a dead one, so the connector reads differently.
    // was inlined as st.kind checks — now the shared predicate (Item D 2026-07-22)
    if (verdictKindShowsOneThing(st.kind)) {
      var otText = (typeof a.one_thing === 'string' && a.one_thing.trim())
        ? '<div class="review-one-thing-text">' + escapeHtml(a.one_thing) + '</div>'
        : '<div class="review-one-thing-text placeholder">Will appear when analysis completes.</div>';
      var otClip = (typeof a.one_thing_timestamp_seconds === 'number')
        ? '<div style="margin-top:6px;">' + reviewClipHtml(a.one_thing_timestamp_seconds, recordingUrl, 'Where it belonged') + '</div>' : '';
      inner += '<div class="review-why-connector">' + (st.kind === 'pending' ? 'The move' : 'The fix') + '</div>'
        + '<div class="review-one-thing">'
          + '<div class="review-one-thing-label">' + (st.kind === 'pending' ? 'One thing to do next' : 'One thing to do differently') + '</div>'
          + otText + otClip
        + '</div>';
    }

    return '<section class="section review-why fade-in ' + st.kind + '">' + inner + '</section>';
  }

  function renderCallReviewHeaderHtml(review, seed) {
    var src = review || seed || {};
    var titleText = callLabel(src) || ((src.title && String(src.title).trim()) ? src.title : null);
    var titleHtml = titleText
      ? '<h1 class="review-title">' + escapeHtml(titleText) + '</h1>'
      : '<h1 class="review-title anon">Untitled Call</h1>';

    var dateStr = formatNaturalDate(src.call_date);
    var durStr = formatNaturalDuration(src.duration_seconds);
    var meta = '<span>' + escapeHtml(dateStr) + '</span>'
             + '<span class="sep">·</span>'
             + '<span>' + escapeHtml(durStr) + '</span>';

    // Status badge — when full data has loaded, use analysis.status +
    // overall_score; otherwise fall back to the library card's
    // analysis_status field. libraryStatusBadgeHtml handles both shapes.
    var status = review && review.analysis ? review.analysis.status : (src.analysis_status || null);
    var score = review && review.analysis ? review.analysis.overall_score : (typeof src.overall_score === 'number' ? src.overall_score : null);
    var badge = libraryStatusBadgeHtml(status, score);

    var fathomLink = '';
    if (src.recording_url && typeof src.recording_url === 'string') {
      fathomLink = '<a class="review-fathom-link" href="' + escapeHtml(src.recording_url) + '" target="_blank" rel="noopener">View in Fathom →</a>';
    }

    return '<div class="review-page-header fade-in">'
      + '<button class="review-back-link" type="button" onclick="backToCallLibrary()">← Back to Calls</button>'
      + '<div class="review-title-row">'
        + '<div class="review-title-main">'
          + titleHtml
          + '<div class="review-meta-row">' + meta + '</div>'
        + '</div>'
        + '<div class="review-title-side">'
          + (status === 'done' ? outcomeTagHtml((src.id || (review && review.id) || ''), (review && review.analysis ? review.analysis.outcome : src.outcome), (review && review.analysis ? review.analysis.outcome_source : src.outcome_source), false) : '')
          + badge
          + fathomLink
        + '</div>'
      + '</div>'
    + '</div>';
  }

  // ─── Section 1: Highlights ────────────────────────────────────────────
  function renderHighlightsSectionHtml(review) {
    var analysis = review.analysis;
    var highlights = Array.isArray(review.highlights) ? review.highlights : [];
    var recordingUrl = review.recording_url || null;
    var analysisDone = analysis && analysis.status === 'done';

    var body;
    if (highlights.length > 0) {
      body = '<div class="review-highlight-list">'
        + highlights.map(function(h) { return highlightEntryHtml(h, recordingUrl); }).join('')
        + '</div>';
    } else if (!analysisDone) {
      body = '<div class="review-highlights-pending">Analysis in progress — highlights will appear here shortly.</div>';
    } else {
      body = '<div class="review-highlights-pending">No highlights were extracted for this call.</div>';
    }

    // One-thing footer. Normally rendered here — but whenever the verdict
    // section already pairs one_thing under the cause (loss AND follow_up),
    // suppress the duplicate. Win-class keeps it here (footer only).
    // was keyed on kind 'loss' alone — drifted when grader v5 added follow_up
    // to the verdict pairing, double-rendering one_thing (Item D 2026-07-22).
    var whyState = whyOutcomeState(review);
    var oneThingFooter = '';
    if (!(whyState && verdictKindShowsOneThing(whyState.kind))) {
      var oneThing = analysis && typeof analysis.one_thing === 'string' && analysis.one_thing.trim()
        ? '<div class="review-one-thing-text">' + escapeHtml(analysis.one_thing) + '</div>'
        : '<div class="review-one-thing-text placeholder">Will appear when analysis completes.</div>';
      oneThingFooter = '<div class="review-one-thing">'
        + '<div class="review-one-thing-label">One thing to do differently</div>'
        + oneThing
      + '</div>';
    }

    return '<section class="section">'
      + '<div class="section-header"><h2>Call Highlights</h2></div>'
      + body
      + oneThingFooter
    + '</section>';
  }

  // opts.addToKb — render the Part 2b "Add to Knowledge Base" button on this row.
  // Only the SECTION BREAKDOWN passes it; the main highlights timeline does not,
  // so the button appears exactly where the spec put the slot (Part 1b left it).
  // The three types a closer response bears on. One definition, so the row and
  // any future consumer cannot disagree about which moments earn a badge.
  var HANDLING_TYPES = ['risk_signal', 'barrier', 'objection'];

  function highlightEntryHtml(h, recordingUrl, opts) {
    var seconds = (typeof h.timestamp_seconds === 'number') ? h.timestamp_seconds : null;
    var label = (seconds != null) ? formatTimestampDisplay(seconds) : '—';
    var timeHtml;
    if (seconds != null && recordingUrl && typeof recordingUrl === 'string') {
      var href = recordingUrl + (recordingUrl.indexOf('?') !== -1 ? '&' : '?') + 't=' + seconds;
      timeHtml = '<a class="review-highlight-time" href="' + escapeHtml(href)
        + '" target="_blank" rel="noopener" onclick="event.stopPropagation()">' + escapeHtml(label) + '</a>';
    } else {
      timeHtml = '<span class="review-highlight-time disabled">' + escapeHtml(label) + '</span>';
    }

    var speakerClass = (h.speaker === 'CLOSER') ? 'closer' : 'prospect';
    var speakerBadge = '<span class="review-speaker-badge ' + speakerClass + '">' + escapeHtml(h.speaker || '') + '</span>';

    var typeLabel = highlightTypeLabel(h.type);
    var typeClass = (typeof h.type === 'string') ? h.type.toLowerCase() : '';
    var typeBadge = '<span class="review-type-badge ' + escapeHtml(typeClass) + '">' + escapeHtml(typeLabel) + '</span>';

    var quote = (typeof h.quote === 'string') ? h.quote : '';
    var observation = (typeof h.observation === 'string') ? h.observation : '';

    // Add-to-KB (Part 2b). Needs the highlight id — the button sends IDS ONLY and
    // the server re-reads the row, so nothing rendered here is trusted on write.
    var kbBtn = '';
    if (opts && opts.addToKb && h.id) {
      var alreadySaved = !!(state.savedMomentIds && state.savedMomentIds[h.id]);
      kbBtn = alreadySaved
        ? '<button class="review-kb-btn is-saved" disabled title="Already in your knowledge base">In KB ✓</button>'
        : '<button class="review-kb-btn" data-hid="' + escapeHtml(String(h.id)) + '"'
          + ' onclick="addMomentToKb(this.getAttribute(\'data-hid\'), this)"'
          + ' title="Save this moment to your knowledge base">+ Add to KB</button>';
    }

    // Handling badge, INLINE with the type chip, so one line carries both what
    // happened and whether the closer dealt with it.
    //
    // ONLY moments the prospect raised against the deal are badged. A buying
    // signal or a rapport moment gets none — badging everything alike is what
    // made the removed panel feel cluttered.
    var handlingBadge = '';
    if (HANDLING_TYPES.indexOf(h.type) !== -1 && h.handling) {
      var hLabel = { addressed: 'Engaged with', deflected: 'Moved past', ignored: 'No response' }[h.handling];
      if (hLabel) handlingBadge = '<span class="review-handling-badge ' + escapeHtml(h.handling) + '">' + escapeHtml(hLabel) + '</span>';
    }

    // "You said" ONLY when the quote is proven. The removed panel explained
    // itself when a reply failed verification; inside a row that reads as noise,
    // so an unverified reply is simply absent and the badge carries the meaning.
    var replyHtml = '';
    if (h.closer_response && h.closer_response_verified === true) {
      replyHtml = '<div class="review-reply"><span class="review-reply-label">You said</span>'
        + escapeHtml(h.closer_response) + '</div>';
    }

    return '<div class="review-highlight">'
      + timeHtml
      + '<div class="review-highlight-body">'
        + '<div class="review-highlight-row1">' + speakerBadge + typeBadge + handlingBadge + kbBtn + '</div>'
        + '<div class="review-quote">' + escapeHtml(quote) + '</div>'
        + replyHtml
        + '<div class="review-observation">' + escapeHtml(observation) + '</div>'
      + '</div>'
    + '</div>';
  }

  function highlightTypeLabel(type) {
    var labels = {
      buying_signal:      'Buying signal',
      objection:          'Objection',
      missed_opportunity: 'Missed opportunity',
      strong_moment:      'Strong moment',
      rapport_moment:     'Rapport',
      risk_signal:        'Risk signal',
      barrier:            'Barrier',
      disqualify_signal:  'Disqualify signal',
    };
    return (type && labels[type]) || (type || 'Moment');
  }

  // Section highlight breakdown (Part 1b) — MIRRORS backend lib/highlight-section.js
  // (highlightGroup + sectionBreakdown; contract pinned by highlight-section.test.js).
  // Keep the two in sync. 'good' = What worked, 'bad' = What to fix.
  var HL_GOOD_TYPES = ['strong_moment', 'rapport_moment', 'buying_signal'];
  function highlightGroup(h) {
    if (!h || typeof h !== 'object') return 'bad';
    var type = (typeof h.type === 'string') ? h.type.toLowerCase() : '';
    if (type === 'objection') return (h.resolution === 'handled') ? 'good' : 'bad';
    return (HL_GOOD_TYPES.indexOf(type) !== -1) ? 'good' : 'bad';
  }
  // 'highlights' when ≥1 highlight is tagged to this section (two-group view),
  // else 'notes' (fall back to the section-notes prose — the COMMON case, since
  // only backfilled calls carry section tags).
  function sectionBreakdown(highlights, sectionKey) {
    var arr = Array.isArray(highlights) ? highlights : [];
    var good = [], bad = [], any = false;
    for (var i = 0; i < arr.length; i++) {
      if (!arr[i] || arr[i].section !== sectionKey) continue;
      any = true;
      if (highlightGroup(arr[i]) === 'good') good.push(arr[i]); else bad.push(arr[i]);
    }
    return any ? { mode: 'highlights', good: good, bad: bad } : { mode: 'notes', good: [], bad: [] };
  }

  // ─── Section 2: Section Grades — five collapsible cards ───────────────
  var REVIEW_SECTION_KEYS = ['intro', 'discovery', 'pitch', 'objection', 'close'];
  var REVIEW_SECTION_LABELS = {
    intro:     'Intro',
    discovery: 'Discovery',
    pitch:     'Pitch',
    objection: 'Objection Handling',
    close:     'Close',
  };

  function renderGradesSectionHtml(review) {
    var analysis = review.analysis;
    var analysisDone = analysis && analysis.status === 'done';

    // All-expand toggle — only meaningful when there's actual data.
    var anyExpanded = REVIEW_SECTION_KEYS.some(function(k) { return !!state.expandedGradeCards[k]; });
    var toggleLabel = anyExpanded ? 'Collapse all' : 'Expand all';
    var toggleBtn = analysisDone
      ? '<button class="review-grades-toggle" type="button" onclick="toggleAllGrades()">' + toggleLabel + '</button>'
      : '';

    var cards;
    if (analysisDone) {
      var hls = Array.isArray(review.highlights) ? review.highlights : [];
      var recUrl = review.recording_url || null;
      cards = REVIEW_SECTION_KEYS.map(function(k) { return gradeCardHtml(k, analysis, hls, recUrl); }).join('');
    } else {
      // Skeleton placeholders — 5 cards, pulsing, no interaction.
      var s = '';
      for (var i = 0; i < REVIEW_SECTION_KEYS.length; i++) s += '<div class="review-grade-card skeleton-card"></div>';
      cards = s;
    }

    return '<section class="section">'
      + '<div class="section-header"><h2>Section Grades</h2>' + toggleBtn + '</div>'
      + '<div class="review-grade-list">' + cards + '</div>'
    + '</section>';
  }

  function gradeCardHtml(sectionKey, analysis, highlights, recordingUrl) {
    var label = REVIEW_SECTION_LABELS[sectionKey];
    var grade = analysis[sectionKey + '_grade'];
    var score = analysis[sectionKey + '_score'];
    var notes = analysis[sectionKey + '_notes'];
    var expanded = !!state.expandedGradeCards[sectionKey];

    var letterHtml;
    if (grade && /^[A-F]$/.test(grade)) {
      letterHtml = '<div class="review-grade-letter ' + grade + '">' + grade + '</div>';
    } else {
      letterHtml = '<div class="review-grade-letter empty">—</div>';
    }

    var scoreText = (typeof score === 'number') ? score + '/100' : '';
    var chevron = '<span class="review-grade-chevron">▾</span>';

    var notesHtml = '';
    if (expanded) {
      var hasNotes = (typeof notes === 'string' && notes.trim());
      var breakdown = sectionBreakdown(highlights, sectionKey);
      var bodyInner;
      if (breakdown.mode === 'highlights') {
        // This section has tagged moments → two-group breakdown. Notes are kept
        // but DEMOTED to a one-line summary above the groups (not lost). Only
        // non-empty groups render — a section where nothing worked (or nothing to
        // fix) shows just the one group, never an empty column.
        var summary = hasNotes ? '<div class="review-section-summary">' + escapeHtml(notes) + '</div>' : '';
        var groups = '';
        if (breakdown.good.length) {
          groups += '<div class="review-section-group good"><div class="review-section-group-label">What worked</div>'
            + '<div class="review-highlight-list">' + breakdown.good.map(function(h) { return highlightEntryHtml(h, recordingUrl, { addToKb: true }); }).join('') + '</div></div>';
        }
        if (breakdown.bad.length) {
          groups += '<div class="review-section-group bad"><div class="review-section-group-label">What to fix</div>'
            + '<div class="review-highlight-list">' + breakdown.bad.map(function(h) { return highlightEntryHtml(h, recordingUrl, { addToKb: true }); }).join('') + '</div></div>';
        }
        bodyInner = summary + groups;
      } else {
        // FALLBACK (common case — calls without section tags): the notes prose is
        // the primary content, rendered cleanly. Never an empty/broken state.
        var notesText = hasNotes ? notes : 'No notes recorded.';
        var notesClass = hasNotes ? 'review-grade-notes' : 'review-grade-notes placeholder';
        bodyInner = '<div class="' + notesClass + '">' + escapeHtml(notesText) + '</div>';
      }
      notesHtml = '<div class="review-grade-body">' + bodyInner + '</div>';
    }

    var notOccurred = (grade === null && score === null && typeof notes === 'string' && notes.indexOf('did not occur') !== -1);
    var cardClass = 'review-grade-card'
      + (expanded ? ' expanded' : '')
      + (notOccurred ? ' not-occurred' : '');

    return '<div class="' + cardClass + '">'
      + '<div class="review-grade-card-header" onclick="toggleGradeCard(\'' + sectionKey + '\')">'
        + '<div class="review-grade-name">' + escapeHtml(label) + '</div>'
        + letterHtml
        + '<div class="review-grade-score">' + escapeHtml(scoreText) + '</div>'
        + chevron
      + '</div>'
      + notesHtml
    + '</div>';
  }

  function toggleGradeCard(sectionKey) {
    state.expandedGradeCards[sectionKey] = !state.expandedGradeCards[sectionKey];
    if (state.view === 'call-review') renderCallReview();
  }

  function toggleAllGrades() {
    var anyExpanded = REVIEW_SECTION_KEYS.some(function(k) { return !!state.expandedGradeCards[k]; });
    var nextValue = !anyExpanded; // if any open → collapse all; else expand all
    var next = {};
    for (var i = 0; i < REVIEW_SECTION_KEYS.length; i++) next[REVIEW_SECTION_KEYS[i]] = nextValue;
    state.expandedGradeCards = next;
    if (state.view === 'call-review') renderCallReview();
  }

  // ─── Section 3: Follow-up Email ───────────────────────────────────────
  function renderFollowupSectionHtml(review) {
    var analysis = review.analysis;
    var email = analysis && typeof analysis.follow_up_email === 'string' ? analysis.follow_up_email : '';
    var hasEmail = !!(email && email.trim());

    var boxHtml;
    if (hasEmail) {
      boxHtml = '<div class="review-followup-box" id="reviewFollowupBox">' + escapeHtml(email) + '</div>';
    } else if (analysis && analysis.status === 'done') {
      boxHtml = '<div class="review-followup-box placeholder">No follow-up email was generated for this call.</div>';
    } else {
      boxHtml = '<div class="review-followup-box placeholder">A follow-up draft will appear here once analysis completes.</div>';
    }

    var copyBtn = hasEmail
      ? '<button class="btn-fathom-secondary" type="button" onclick="copyFollowupEmail()">Copy</button>'
      : '<button class="btn-fathom-secondary" type="button" disabled>Copy</button>';
    var feedback = '<span class="review-copy-feedback' + (state.followupCopied ? ' show' : '') + '">Copied!</span>';

    return '<section class="section">'
      + '<div class="section-header"><h2>Follow-up Email</h2></div>'
      + '<div class="review-followup-wrap">'
        + boxHtml
        + '<div class="review-followup-actions">' + copyBtn + feedback + '</div>'
      + '</div>'
    + '</section>';
  }

  function copyFollowupEmail() {
    var review = state.callReview;
    if (!review || !review.analysis || !review.analysis.follow_up_email) return;
    var text = review.analysis.follow_up_email;
    var writePromise = (navigator.clipboard && navigator.clipboard.writeText)
      ? navigator.clipboard.writeText(text)
      : new Promise(function(resolve, reject) {
          // Fallback: textarea + execCommand. Older browsers / non-HTTPS dev contexts.
          try {
            var ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.left = '-9999px';
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            resolve();
          } catch (e) { reject(e); }
        });
    writePromise.then(function() {
      state.followupCopied = true;
      if (state.view === 'call-review') renderCallReview();
      setTimeout(function() {
        state.followupCopied = false;
        if (state.view === 'call-review') renderCallReview();
      }, 1800);
    }).catch(function(err) {
      console.warn('[review] clipboard write failed:', err);
    });
  }

  function backToCallLibrary() {
    state.view = 'call-library';
    state.selectedCallId = null;
    // Intentionally keep state.callReview around in case the user re-opens
    // the same call — but null it so a subsequent open kicks a fresh fetch
    // and reflects any analysis-status changes that happened in the meantime.
    state.callReview = null;
    state.callReviewError = null;
    state.expandedGradeCards = {};
    state.followupCopied = false;
    render();
    syncHashFromState();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // Real navigator. Replaces the Phase 2 Step 3 placeholder that only
  // surfaced a flash notice. Opens the call review page, kicks off the
  // detailed fetch in the background, and scrolls to top.
  function openCallReview(callId) {
    state.selectedCallId = callId;
    state.callReview = null;
    state.callReviewError = null;
    state.expandedGradeCards = {};
    state.followupCopied = false;
    state.view = 'call-review';
    render();
    syncHashFromState();
    window.scrollTo({ top: 0, behavior: 'smooth' });
    loadCallReview(callId); // async, re-renders when done
  }

  init();
</script>

</body>
</html>
