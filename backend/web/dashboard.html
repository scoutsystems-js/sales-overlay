  // ──────────────────────────────────────────────────────────────────
  // Chart drawing — Chart.js with custom dark theme + thin ring
  // ──────────────────────────────────────────────────────────────────
  var COLORS = {
    // win/loss/follow_up stay SEMANTIC (green/red/amber). The rest are
    // CATEGORICAL — one hue per objection type — and must not reuse --accent's
    // green, or a category would read as "interactive".
    win: '#4ade80', loss: '#f87171', follow_up: '#fbbf24', unmarked: '#64748b', live: '#22d3ee',
    money: '#22d3ee', think: '#fbbf24', spouse: '#c084fc', time: '#fb923c',
    guarantee: '#22d3ee', 'tried-before': '#a78bfa', 'send-info': '#34d399',
    'more-research': '#f472b6', 'not-right-time': '#fb7185', 'proof-it-works': '#94a3b8',
    other: '#64748b',
  };

  function donutBase(canvasId, labels, values, colors) {
    var ctx = document.getElementById(canvasId);
    if (!ctx) return null;
    if (!window.Chart) return null;
    return new Chart(ctx.getContext('2d'), {
      type: 'doughnut',
      data: {
        labels: labels,
        datasets: [{
          data: values,
          backgroundColor: colors,
          borderWidth: 0,
          spacing: 2,
          hoverOffset: 8,
        }],
      },
      options: {
        cutout: '78%',
        responsive: true,
        maintainAspectRatio: true,
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: '#1a1a1a',
            titleColor: '#ededed',
            bodyColor: '#cccccc',
            borderColor: '#2a2a2a',
            borderWidth: 1,
            padding: 10,
            cornerRadius: 8,
            displayColors: true,
            titleFont: { size: 12, weight: 600 },
            bodyFont: { size: 12 },
          },
        },
        animation: { duration: 700, easing: 'easeOutCubic' },
      },
    });
  }


  function filterZero(labels, values, colors) {
    var L = [], V = [], C = [];
    for (var i = 0; i < values.length; i++) {
      if (values[i] > 0) { L.push(labels[i]); V.push(values[i]); C.push(colors[i]); }
    }
    if (V.length === 0) { L = ['Empty']; V = [1]; C = ['#1f1f1f']; }
    return { labels: L, values: V, colors: C };
  }

  // ──────────────────────────────────────────────────────────────────
  // Coaching overview (Fathom-era, call_analyses) — default view
  // ──────────────────────────────────────────────────────────────────

  function scoreColor(s) {
    if (s == null) return '#1f1f1f';
    return s >= 70 ? COLORS.win : (s >= 50 ? COLORS.follow_up : COLORS.loss);
  }

  // Avg Score donut sub-stat: surface win-quality vs the rest so a strong
  // closer's win average isn't buried in the blend. Falls back to graded count.
  function avgScoreSubstat(av) {
    if (av.win_mean !== null || av.other_mean !== null) {
      return 'Wins ' + (av.win_mean === null ? '—' : av.win_mean) + ' · Others ' + (av.other_mean === null ? '—' : av.other_mean);
    }
    return av.graded_calls + ' graded';
  }

  // A-1: compact clickable glance tile (text only — no Chart.js). Reuses the
  // donut drill targets so each tile behaves like the old donut, minus the rings.
  function glanceTileHtml(label, big, sub, onclick) {
    return '<div class="glance-tile" onclick="' + onclick + '" title="' + escapeHtml(label) + ' — click to drill in">'
      + '<div class="glance-big">' + big + '</div>'
      + '<div class="glance-label">' + escapeHtml(label) + '</div>'
      + (sub ? '<div class="glance-sub">' + escapeHtml(sub) + '</div>' : '')
      + '</div>';
  }

  // Tile metrics — MIRROR of backend lib/tile-metrics.js (pinned by
  // tile-metrics-mirror.test.js). Keep in sync.
  function objectionHandleRate(needsWork) {
    var d = needsWork && needsWork.detail;
    if (!d || !Array.isArray(d.buckets)) return null;
    var handled = 0, total = 0;
    for (var i = 0; i < d.buckets.length; i++) {
      var b = d.buckets[i] || {};
      handled += (typeof b.handled === 'number') ? b.handled : 0;
      total += (typeof b.total === 'number') ? b.total : 0;
    }
    if (total <= 0) return null;
    if (handled > total) handled = total;
    return { rate: Math.round((handled / total) * 100), handled: handled, total: total };
  }
  function scoreTrend(cur, prior) {
    if (typeof cur !== 'number' || typeof prior !== 'number') return { dir: null, delta_pct: null };
    if (prior <= 0) return { dir: null, delta_pct: null };
    var pct = Math.round(((cur - prior) / prior) * 100);
    var dir = pct > 0 ? 'up' : (pct < 0 ? 'down' : 'flat');
    return { dir: dir, delta_pct: pct };
  }
  // Renders the Avg-score tile trend (arrow + delta %) reusing trendArrow's styling.
  // Empty string when there's no prior baseline → the tile shows no arrow.
  function tileTrendHtml(st) {
    if (!st || !st.dir) return '';
    var sign = st.dir === 'up' ? 1 : (st.dir === 'down' ? -1 : 0);
    var pctText = (st.delta_pct > 0 ? '+' : '') + st.delta_pct + '%';
    return '<span class="glance-trend">' + trendArrow(sign) + '<span class="glance-trend-pct">' + pctText + '</span></span>';
  }
  // ── FD-4: light first-run "Get started" card ──────────────────────────────
  // A single dismissible card on the overview with a 3-step checklist (connect →
  // first analysis → optional KB). NOT a wizard. Auto-hides once a source is
  // connected AND the first analysis has run, or when dismissed. Dismissal is
  // per-user (localStorage keyed by user_id) so it doesn't bleed across accounts
  // on a shared browser.
  function gsKey(suffix) { return 'scout_gs_' + suffix + '_' + ((state.me && state.me.user_id) || 'anon'); }
  function gsDismissed(suffix) { try { return localStorage.getItem(gsKey(suffix)) === '1'; } catch (e) { return false; } }
  function gsDismiss(suffix) { try { localStorage.setItem(gsKey(suffix), '1'); } catch (e) {} }
  function dismissGetStarted() { gsDismiss('card'); if (state.view === 'overview') renderOverview(false); }
  function dismissGsKb() { gsDismiss('kb'); if (state.view === 'overview') renderOverview(false); }

  function getStartedCardHtml() {
    if (gsDismissed('card')) return '';
    var connected = anySourceConnected();
    var analyzed = !!(state.analytics2 && state.analytics2.calls && state.analytics2.calls.analyzed > 0);
    if (connected && analyzed) return ''; // essentials done — nothing left to onboard
    var canManageKb = kbCanManage();

    function stepHtml(done, title, body, action) {
      return '<div class="gs-step">'
        + '<div class="gs-check' + (done ? ' done' : '') + '">' + (done ? '✓' : '') + '</div>'
        + '<div class="gs-step-body"><div class="gs-step-title">' + title + '</div>'
        + (body ? '<div class="gs-step-sub">' + body + '</div>' : '')
        + (action || '') + '</div></div>';
    }

    var fathomConnected = !!(state.fathomStatus && state.fathomStatus.connected);
    var zoomConnected = !!(state.zoomStatus && state.zoomStatus.connected);

    // Step 1 — connect. Direct buttons (they open the OAuth popup and keep you on
    // this page). After you finish, this step checks itself with no reload.
    var s1;
    if (connected) {
      var sources = [fathomConnected ? 'Fathom' : null, zoomConnected ? 'Zoom' : null].filter(Boolean).join(' + ');
      s1 = stepHtml(true, 'Connect Zoom or Fathom', 'Connected: ' + sources + '. Scout grades the calls it syncs.', '');
    } else {
      s1 = stepHtml(false, 'Connect Zoom or Fathom', 'Scout grades the calls it records for you — pick where your calls live.',
        '<div class="gs-actions"><button class="btn-fathom-primary" type="button" onclick="connectZoom()">Connect Zoom</button>'
        + '<button class="btn-fathom-primary" type="button" onclick="connectFathom()">Connect Fathom</button></div>');
    }

    // Step 2 — get calls graded. Connecting does NOT auto-sync, so this step carries
    // the action itself. Both Fathom and Zoom now have a real one-click sync.
    var s2;
    if (analyzed) {
      s2 = stepHtml(true, 'Get your calls graded', 'Your recent calls are graded — your scores are up top.', '');
    } else if (fathomConnected) {
      s2 = state.fathomSyncing
        ? stepHtml(false, 'Get your calls graded', 'Syncing your calls now — this usually takes a few minutes. Your grades appear up top as each one finishes.', '')
        : stepHtml(false, 'Get your calls graded', 'Pull in your most recent calls and grade them — one click.',
            '<button class="btn-fathom-primary" type="button" style="margin-top:10px;" onclick="syncFathomNow()">Sync &amp; Grade My Recent Calls</button>');
    } else if (zoomConnected) {
      s2 = state.zoomSyncing
        ? stepHtml(false, 'Get your calls graded', 'Syncing your calls now — this usually takes a few minutes. Your grades appear up top as each one finishes.', '')
        : stepHtml(false, 'Get your calls graded', 'Pull in your most recent Zoom cloud recordings and grade them — one click. (Zoom grades cloud recordings that have transcription turned on.)',
            '<button class="btn-fathom-primary" type="button" style="margin-top:10px;" onclick="syncZoomNow()">Sync &amp; Grade My Recent Calls</button>');
    } else {
      s2 = stepHtml(false, 'Get your calls graded', 'After you connect above, grade your most recent calls in one click.', '');
    }

    var s3;
    if (canManageKb) {
      var kbDone = gsDismissed('kb');
      s3 = stepHtml(kbDone, 'Add your Knowledge Base <span class="gs-optional">optional</span>',
        'Grading gets measurably more specific when Scout knows how you actually sell — add your offer docs, scripts, and winning calls.',
        kbDone ? '' : '<div class="gs-actions"><button class="btn-fathom-secondary" type="button" onclick="goKb()">Add to Knowledge Base →</button><button class="btn-fathom-secondary" type="button" onclick="dismissGsKb()">Not Now</button></div>');
    } else {
      // Managed rep: they can't add KB, but they can view what they're graded against.
      s3 = stepHtml(true, 'Your team’s Knowledge Base',
        'Your manager’s offer docs, scripts, and winning calls are what Scout grades your calls against — you can view them anytime.',
        '<button class="btn-fathom-secondary" type="button" style="margin-top:10px;" onclick="goKb()">Open Knowledge Base →</button>');
    }

    return '<div class="section fade-in gs-card">'
      + '<button class="gs-dismiss" type="button" title="Dismiss" onclick="dismissGetStarted()">×</button>'
      + '<div class="gs-head"><h2>Get Started With Scout</h2><div class="meta">A couple of quick steps to make your grading sharp.</div></div>'
      + s1 + s2 + s3
      + '</div>';

  function renderCoachingOverview(content) {
    var a = state.analytics2;
    var analyzed = a.calls.analyzed;
    // Default first paint = above-the-fold glance tiles + collapsed sections.
    // No Chart.js, no LLM, nothing heavy until the closer clicks. Tiles reuse the
    // old donut drill targets (self /fathom/calls, pivot /admin/fathom-calls/:id).
    // Avg-score tile: mean + period-over-period trend (arrow + delta %). prior_mean
    // comes from the reused team prior-window machinery; no prior → no arrow.
    var avgBig = (a.avg_score.mean === null ? '—' : a.avg_score.mean)
      + tileTrendHtml(scoreTrend(a.avg_score.mean, a.avg_score.prior_mean));
    // Objection HANDLE RATE over TRUE objections (needs-work taxonomy — logistical
    // + disqualifications excluded, so it agrees with the card below). Reads the
    // already-loaded needs-work classification; "—" until it's available (never

    var ohr = objectionHandleRate(state.needsWork);
    var tiles = '<div class="glance-row fade-in">'
      + glanceTileHtml('Calls analyzed', analyzed, 'of ' + a.calls.total_in_range + ' in range', "drillCalls('analyzed',null)")
      + glanceTileHtml('Avg score', avgBig, avgScoreSubstat(a.avg_score), "drillCalls('analyzed','score')")
      + glanceTileHtml('Objection handle rate', ohr ? ohr.rate + '%' : '—', ohr ? (ohr.handled + ' of ' + ohr.total + ' handled') : 'true objections', "goObjections()")
      /* REMOVED 2026-08-17 — Justin: cash comes off the cards. This was the ONLY
         live "Cash collected" card; the team glance tile went with the glance
         card on 2026-08-16 and the rep-card row was retired in the B-1 redesign.

      + glanceTileHtml('Cash collected', fmtCash(a.cash_collected), 'closed-call cash', "drillCalls('analyzed',null)") */
      + glanceTileHtml('Close rate', closeRateDisplay(a).value, closeRateDisplay(a).sub, "drillCalls('analyzed',null)")
    + '</div>';

    // A-2.2 layout: tiles → What-needs-work card → Coach summary (OPEN inline) →

    // (card → the Call Library). No accordions.
    // While the Get-started card is showing, it owns the connect prompt — suppress
    // the standalone Fathom/Zoom connect cards so there's no duplicate "Connect".
    var gsCard = getStartedCardHtml();
    var connectSections = gsCard ? '' : (renderFathomSectionHtml() + renderZoomSectionHtml());
    content.innerHTML = renderHeaderHtml()
      + renderFathomNoticeHtml()
      + gsCard
      + connectSections
      + tiles
      + repOwnGraphHtml()
      + '<div class="section fade-in">' + sectionRankCardHtml() + '</div>'
      + '<div class="section fade-in">' + needsWorkCardHtml() + '</div>'
      + '<div class="section fade-in"><div class="section-header"><h2>Coach Summary</h2>'
        + '<div class="meta">' + (analyzed ? 'based on ' + analyzed + (analyzed === 1 ? ' analyzed call' : ' analyzed calls') : '') + '</div></div>'
        + renderCoachSummary2(a) + '</div>'
      // (n) 2026-08-17 — Performance Summary PROMOTED, Recent Calls REMOVED.
      //
      // ⚠ THIS STAYS A LINK CARD, and that is what keeps it fast. The overview
      // card does NOT render the panel; the synthesis LLM fires when the
      // #performance page opens (see the A-1 boot-trim note above). Inlining the
      // panel here to "make it bigger" would drag a lane whose cache MISS costs
      // ~35s onto every dashboard boot — the opposite of what the boot trim was
      // for. Bigger here means more visual weight, not more work.
      + '<div class="section fade-in perf-feature"><div class="section-header"><h2>Performance Summary</h2>'
        + '<div class="meta">Your Wins and What to Improve</div></div>'
        + perfFeatureCardHtml() + '</div>';
      /* REMOVED 2026-08-17 (Justin's item n) — Recent Calls. The Call Library is
         one click away in the top nav, and the card was a link to it with no
         content of its own, so it cost a full section band to duplicate a nav
         item. Restoring it is re-adding this one line.
      + '<div class="section fade-in"><div class="section-header"><h2>Recent Calls</h2></div>' + overviewLinkCardHtml('Open your Call Library to review recent calls.', 'goCallLibrary()') + '</div>';
      */

    // 10e: the canvas exists only after the assignment above.
    drawRepOwnChart();

    // Personal What-needs-work loads once (cheap: cache hit = no Claude).
    if (state.needsWork === null && !state.needsWorkLoading) loadNeedsWork();
    if (state.sectionRank === null && !state.sectionRankLoading) loadSectionRank();
    // 10e is lazy and only for a manager viewing someone else's report.
    if (repOwnGraphVisible() && state.repGraph === null && !state.repGraphLoading) loadRepGraph();
    // NOTE: Performance's LLM call fires on the #performance page open, not here.
  }

  // (n) The promoted Performance Summary card. Still a LINK — see the note at
  // the call site — but given the visual weight of a feature panel: a bigger
  // teaser line, and the three things the page will show, so the card earns the
  // space rather than merely occupying more of it.
  function perfFeatureCardHtml() {
    return '<div class="team-recs-card perf-feature-card" onclick="openPerformance()" title="Open your Performance Summary">'
      + '<div class="perf-feature-lead">What is working, and what to fix — drawn from your own calls and quoted back to you.</div>'
      + '<div class="perf-feature-points">'
        + '<div class="perf-feature-point"><b>What\'s Working</b><span>The patterns your won calls share</span></div>'
        + '<div class="perf-feature-point"><b>What to Improve</b><span>Where the losses repeat</span></div>'
        + '<div class="perf-feature-point"><b>Evidence</b><span>Every claim tied to a real moment</span></div>'
      + '</div>'
      + '<div class="team-recs-expand">click to expand →</div>'
    + '</div>';

  // A-2.2: a link card (teaser + visible "click to expand →") that opens a page.
  function overviewLinkCardHtml(teaser, onclick) {

  // Performance summary detail page — the LLM fires on open (deferred, cached).

    content.innerHTML = renderHeaderHtml()

  /* A-2.2: accordion machinery RETIRED — Coach summary is inline, Performance and

  function overviewSectionHtml(key, title, meta, bodyFn) { ... }
  function toggleOverviewSection(key) { state.overviewExpanded[key] = !state.overviewExpanded[key]; renderOverview(false); }
  */

  // ⚠ NOT "last N days". That phrasing is only true of a trailing window; with a
  // free date picker the user can select Jul 1 - Jul 31 and "last 31 days" would
  // be a different month. Derived from the same range the picker renders, so the
  // header and the control can never contradict each other — which they did on
  // the first live render of this stage.
  function needsWorkWindowLabel() {
    var r = state.dateRange;
    if (!r || !r.from || !r.to) return 'your recent calls';
    return rangeLabelInclusive(r.from, r.to);

  // ── A-2.1: personal "What needs work" (card under the tiles + #needs-work page)
  async function fetchNeedsWork() {
    // Range-responsive: computes on the selected window (default 90d server-side).
    var qp = 'from=' + encodeURIComponent(state.dateRange.from) + '&to=' + encodeURIComponent(state.dateRange.to);
    var base = isSelf() ? '/me/needs-work' : '/admin/needs-work/' + encodeURIComponent(state.viewingUserId);
    var res = await fetch(base + '?' + qp, { headers: authHeader() });
    if (res.status === 401) { clearSession(); window.location.replace('/login'); throw new Error('unauth'); }
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  }
  async function loadNeedsWork() {
    if (state.needsWorkLoading) return;
    state.needsWorkLoading = true;
    try { state.needsWork = await fetchNeedsWork(); }
    catch (err) { if (err.message === 'unauth') return; state.needsWork = { _error: err.message || 'unknown' }; }
    state.needsWorkLoading = false;
    if (state.view === 'overview') renderOverview(false);
    else if (state.view === 'needs-work') renderNeedsWorkView();
  }
  // Compact card under the glance tiles. Mirrors the team needs-work card.
  // Personal needs-work degrades honestly when a short window is too thin.
  // The server-side degrade text now names the window itself ("in the 6 days you
  // selected — try a wider range"), so this no longer repeats it, and it must not
  // point at 30/90-day presets that no longer exist.
  function needsWorkThinHint(d) {
    var win = (d && d.window_days) || 90;
    return win < 60 ? ' Widen the date range for a fuller picture.' : '';
  }

  // ── 12b: WHAT PART OF THE SALES PROCESS NEEDS WORK ────────────────────────
  // Rolling 1 of 5, worst first. REP PAGE ONLY — the team view keeps its
  // objection-bucket needs-work, which answers a different question and was not
  // replaced.
  async function loadSectionRank() {
    if (state.sectionRankLoading) return;
    state.sectionRankLoading = true;
    try {
      var qs = 'from=' + encodeURIComponent(state.dateRange.from) + '&to=' + encodeURIComponent(state.dateRange.to);
      var res = await fetch('/me/needs-work-sections?' + qs, { headers: authHeader() });
      state.sectionRank = res.ok ? await res.json() : { _error: 'HTTP ' + res.status };
    } catch (e) { state.sectionRank = { _error: (e && e.message) || 'unknown' }; }
    state.sectionRankLoading = false;
    if (state.view === 'overview') renderOverview(false);
  }
  function cycleSectionRank(delta) {
    var n = (state.sectionRank && state.sectionRank.sections) ? state.sectionRank.sections.length : 0;
    if (!n) return;
    state.sectionRankIndex = ((state.sectionRankIndex + delta) % n + n) % n;   // wraps both ways
    renderOverview(false);
  }
  // (p) 2026-08-17 — the clip button. MIRRORS lib/clip-link.js; pinned by
  // clip-link-mirror.test.js.
  //
  // ⚠ THE LABEL DEPENDS ON THE PROVIDER. Fathom's ?t= seeks, so it is a "Clip".
  // Zoom share links carry no timestamp, so the link opens at 00:00 and is
  // labelled "Open Recording" — promising a moment and delivering the start is
  // worse than saying plainly what the button does.
  //
  // ⚠ NO LINK → NO BUTTON, not a disabled one. "This call has no recording URL"
  // is information about our sync, not something a user can act on.
  function clipLabelFor(source) {
    return String(source || '').toLowerCase() === 'fathom' ? 'Clip' : 'Open Recording';
  }
  function clipLinkHtml(m) {
    if (!m.clip_url) return '';
    return ' <a class="srk-clip" href="' + escapeHtml(m.clip_url) + '" target="_blank" rel="noopener"'
      + ' onclick="event.stopPropagation();">▶ ' + escapeHtml(clipLabelFor(m.source)) + '</a>';
  }
  function sectionRankMomentHtml(m) {
    var when = m.call_date ? dayLabel(String(m.call_date).slice(0, 10)) : null;
    // Prospect AND date together — a quote with neither cannot be checked by the
    // person reading it, which is the whole point of showing evidence.
    var who = [m.prospect_name, when].filter(Boolean).join(' · ');
    return '<div class="srk-moment">'
      + '<div class="srk-quote">“' + escapeHtml(m.quote) + '”</div>'
      + '<div class="srk-who">' + (who ? escapeHtml(who) : '') + clipLinkHtml(m) + '</div>'
      + '</div>';
  }
  function sectionRankCardHtml() {
    var d = state.sectionRank;
    var head = '<div class="section-header"><h2>What Needs Work</h2>'
      + '<div class="meta">Across the Whole Sales Process</div></div>';
    if (d === null) return head + '<div class="skeleton" style="height:120px;"></div>';
    if (d._error) return head + '<div class="error">Could not load the section ranking: ' + escapeHtml(d._error) + '</div>';
    var list = d.sections || [];
    if (!list.length) return head + '<div class="empty"><p>No graded calls in this range yet.</p></div>';

    var i = Math.min(state.sectionRankIndex, list.length - 1);
    var s = list[i];
    var nav = '<div class="srk-nav">'
      + '<button class="srk-arrow" type="button" onclick="event.stopPropagation();cycleSectionRank(-1)" aria-label="Previous Section">←</button>'
      + '<span class="srk-count">' + (i + 1) + ' of ' + list.length + '</span>'
      + '<button class="srk-arrow" type="button" onclick="event.stopPropagation();cycleSectionRank(1)" aria-label="Next Section">→</button>'
      + '</div>';

    // ⚠ TOO THIN TO RANK is its own state — never a score presented as a verdict.
    if (!s.enough) {
      return head + '<div class="srk-card">' + nav
        + '<div class="srk-title">' + escapeHtml(s.label) + '</div>'
        + '<div class="srk-thin">Not enough to judge<span>' + escapeHtml(s.reason || '') + '</span></div>'
        + '</div>';
    }

    // ⚠ WHERE TWO SECTIONS ARE LEVEL, SAY SO INSTEAD OF RANKING THEM. On Josh's
    // real data intro and close differ by 0.0 points; a confident ordering there
    // would flip on the next call analysed.
    var standing = s.levelWithNext
      ? '<span class="srk-level">Level with ' + escapeHtml(s.nextLabel) + ' at ' + s.score + '</span>'
      : (s.gapToNext === null
          ? '<span class="srk-gap">' + escapeHtml(s.rank_label || '') + '</span>'
          : '<span class="srk-gap">' + escapeHtml(s.rank_label || '') + ' · '
            + s.gapToNext + ' points below ' + escapeHtml(s.nextLabel) + '</span>');

    // ⚠ THE WHY LINE APPEARS ONLY WHERE A COUNTED CAUSE EXISTS — discovery only,
    // today, via what_mattered. On the other four it DISAPPEARS rather than being
    // filled with a thinner reason. Card 1 richer than cards 2-5 is BY DESIGN.
    var why = '';
    if (d.why && d.why.section === s.section) {
      why = '<div class="srk-why">On <b>' + d.why.count + ' of ' + d.why.denominator
        + '</b> calls the ground left uncovered was <b>' + escapeHtml(d.why.area) + '</b>.</div>';
    }

    var moments = (s.moments || []).length
      ? '<div class="srk-moments">' + s.moments.map(sectionRankMomentHtml).join('') + '</div>'
      : '';

    return head + '<div class="srk-card" onclick="goSection(\'' + s.section + '\')" title="Open the full breakdown for this section">'
      + nav
      + '<div class="srk-title">' + escapeHtml(s.label) + '</div>'
      + '<div class="srk-score">' + s.score + '<span class="srk-of">/100</span></div>'
      + '<div class="srk-standing">' + standing + '</div>'
      + '<div class="srk-n">' + s.n + ' graded call' + (s.n === 1 ? '' : 's') + '</div>'
      + why + moments
      + '<div class="team-recs-expand">click to expand →</div>'
      + '</div>';
  }

  // ⚠ TITLED "Objection Handling Focus", NOT "What Needs Work" (ruling
  // 2026-08-17). The section card above it owns that heading now. Both cards

      + '<span class="nw-chip">your baseline <b>' + (b.baseline_pct == null ? '—' : b.baseline_pct + '%') + '</b></span>'
      /* +$X at stake chip REMOVED 2026-08-17 — the What-Needs-Work card no

    return head + '<div class="team-recs-card" onclick="openNeedsWork()" title="See your buckets and the calls behind them">'

      + '<div class="team-recs-expand">click to expand →</div></div>';

  // Small context line under a needs-work card (logistical + DQ, not coachable).
  function nwContextLineHtml(d) {
    var c = (d && d.detail && d.detail.context) || {};

  }

  // Recent calls (A-1): the 5 most-recent calls in range, lazy on expand, via the
  /* A-2.2: the inline Recent-calls loader is RETIRED — Recent calls now links

  // ─── Performance Summary (learning loop surface) ─────────────────────────
  async function fetchPerfSynthesis() {
    var qp = 'from=' + encodeURIComponent(state.dateRange.from) + '&to=' + encodeURIComponent(state.dateRange.to);
    var base = isSelf() ? '/me/performance-synthesis' : '/admin/performance-synthesis/' + encodeURIComponent(state.viewingUserId);
    var res = await fetch(base + '?' + qp, { headers: authHeader() });
    if (res.status === 401) { clearSession(); window.location.replace('/login'); throw new Error('unauth'); }
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  }
  // ⚠ THE LONG-WAIT COPY IS TIME-GATED, NOT ALWAYS-ON. Measured: a cache MISS is
  // ~35 s and 97% of that is the model generating; a HIT is under a second. The
  // slow path is irreducible — it IS the model call — so the honest fix is to say
  // so rather than to pretend it is fast. But showing "this will take a minute"
  // on a sub-second cached load would be a lie in the other direction, so it only
  // appears after PERF_LONG_WAIT_MS.
  var PERF_LONG_WAIT_MS = 2000;
  var perfWaitTimer = null;
  async function loadPerfSynthesis() {
    if (state.perfSynthesisLoading) return;
    state.perfSynthesisLoading = true;
    state.perfWaitLong = false;
    if (perfWaitTimer) clearTimeout(perfWaitTimer);
    perfWaitTimer = setTimeout(function () {
      // Only meaningful if we are STILL waiting and still on the page.
      if (!state.perfSynthesisLoading) return;
      state.perfWaitLong = true;
      if (state.view === 'performance') renderPerformanceView();
      else if (state.view === 'overview') renderOverview(false);
    }, PERF_LONG_WAIT_MS);
    try { state.perfSynthesis = await fetchPerfSynthesis(); }
    catch (err) { if (err.message === 'unauth') return; state.perfSynthesis = { available: false, reason: err.message || 'unknown' }; }
    state.perfSynthesisLoading = false;
    state.perfWaitLong = false;
    if (perfWaitTimer) { clearTimeout(perfWaitTimer); perfWaitTimer = null; }
    if (state.view === 'performance') renderPerformanceView();
    else if (state.view === 'overview') renderOverview(false);
  }
  function perfInsightHtml(it, kind) {
    var clip = it.clip_url ? ' <a class="obj-btn" href="' + escapeHtml(it.clip_url) + '" target="_blank" rel="noopener" style="padding:2px 8px;">▶ Clip</a>' : '';
    var review = it.call_id ? ' <button class="obj-btn" type="button" onclick="openCallReview(\'' + escapeHtml(it.call_id) + '\')" style="padding:2px 8px;">Call</button>' : '';
    var data = it.data ? '<span style="color:var(--text);"> · ' + escapeHtml(it.data) + '</span>' : '';
    var quote = it.quote ? '<div class="obj-response" style="display:block;margin-top:6px;"><span style="color:var(--text);">“</span>' + escapeHtml(it.quote) + '<span style="color:var(--text);">”</span></div>' : '';
    var accent = kind === 'working' ? 'var(--good)' : 'var(--mid, #fbbf24)';
    return '<div class="pattern-card" style="border-left:2px solid ' + accent + ';">'
      + '<div class="pattern-detail">' + escapeHtml(it.claim || '') + data + '</div>'
      + quote
      + ((clip || review) ? '<div class="obj-footer" style="margin-top:8px;">' + clip + review + '</div>' : '')
      + '</div>';
  }
  function renderPerfSummary() {
    var s = state.perfSynthesis;
    if (s === null) {
      return '<div class="load-state" style="padding:14px 4px;"><div class="spinner"></div> '
        + (state.perfWaitLong
            ? 'This will take a minute — go touch some grass'
            : 'Generating performance summary…')
        + '</div>';
    }
    if (!s.available) return '<div class="empty"><h3>Performance summary unavailable</h3><p>Could not generate it right now' + (s.reason ? ' (' + escapeHtml(s.reason) + ')' : '') + '. Your scores above are unaffected.</p></div>';
    var work = (s.working || []), imp = (s.improve || []);
    if (!work.length && !imp.length) return '<div class="empty"><h3>Not enough data yet</h3><p>Analyze more calls (with win/loss outcomes) to surface a performance summary.</p></div>';
    var block = function(title, arr, kind) {
      return '<div style="margin-top:6px;"><div class="obj-group-header">' + title + '</div>'
        + (arr.length ? arr.map(function(it) { return perfInsightHtml(it, kind); }).join('') : '<div style="color:var(--text);font-size:13px;">—</div>')

  function drawCallsDonut2(canvasId, a) {

      ['Analyzed', 'Processing', 'Error'],
      [a.calls.analyzed, a.calls.processing, a.calls.error],
      [COLORS.win, COLORS.live, COLORS.loss]
    );

  }

  function drawScoreDonut(canvasId, a) {

    if (m === null) { state.chartC2 = donutBase(canvasId, ['No scores'], [1], ['#1f1f1f']); return; }
    state.chartC2 = donutBase(canvasId, ['Score', 'Remaining'], [m, Math.max(0, 100 - m)], [scoreColor(m), '#1f1f1f']);
  }

  function drawObjDonut2(canvasId, a) {
    if (state.chartC3) state.chartC3.destroy();
    var withObj = a.objections.calls_with_objection;

  function renderCoachSummary2(a) {
    if (!a.calls.analyzed) {
      return '<div class="empty"><h3>No analyzed calls yet</h3><p>Sync and analyze Fathom calls to see coaching aggregates in this date range.</p></div>';
    }
    var SECTIONS = [['intro', 'Intro'], ['discovery', 'Discovery'], ['pitch', 'Pitch'], ['objection', 'Objection'], ['close', 'Close']];
    var rows = SECTIONS.map(function(pair) {
      var key = pair[0];
      var sec = a.sections[key] || { avg: null, n: 0 };
      var tag = a.weakest_section === key ? ' <span class="badge badge-loss">weakest</span>'
              : (a.strongest_section === key ? ' <span class="badge badge-win">strongest</span>' : '');
      // Score only — no (n=X). n=0 → avg is null → render "—".
      var avgTxt = sec.avg === null ? '—' : String(sec.avg);
      var pct = sec.avg === null ? 0 : Math.max(0, Math.min(100, sec.avg));
      // Stage 4a: the bar is the entry point into the section drilldown.
      return '<div class="coach-section-row" onclick="goSection(\'' + key + '\')" title="See the moments behind this score" style="display:flex;align-items:center;gap:14px;padding:7px 0;border-bottom:1px solid var(--border);cursor:pointer;">'
        + '<div style="width:92px;font-size:13px;color:var(--text);">' + escapeHtml(pair[1]) + '</div>'
        + '<div style="flex:1;height:8px;background:var(--border);border-radius:4px;overflow:hidden;"><div style="width:' + pct + '%;height:100%;background:' + scoreColor(sec.avg) + ';border-radius:4px;"></div></div>'
        + '<div style="width:130px;text-align:right;font-size:13px;">' + avgTxt + tag + '</div>'
        + '</div>';
    }).join('');
    // The per-call one_thing feed was replaced by the Performance Summary panel
    // (renderPerfSummary) — one_thing stays on individual call review pages.
    return '<div>' + rows + '</div>';
  }

  // ═══════════════════════════════════════════════════════════════════════════
  // Team (manager) view — v1.4 flagship. Reps' data is resolved + permission-
  // checked server-side; this only renders. Owner gets a team picker.
  // ═══════════════════════════════════════════════════════════════════════════
  function goTeam() { state.teamDetailMetric = null; setView('team'); }
  // 7d → daily points, longer ranges → weekly. A 7-day window on weekly buckets
  // is a SINGLE point: Chart.js draws a lone dot and no line, which reads as an
  // empty chart (Justin's live look, 2026-08-15).
  // ⚠ SPAN-DERIVED BUCKETING (stage 5). Daily up to DAILY_BUCKET_MAX_DAYS,
  // weekly beyond — so a custom "Aug 1 - Aug 12" gives days and "June through
  // August" gives weeks, with no thought required from the user.
  //
  // Why 14 and not something larger: 14 daily points fit the axis without
  // rotating, and daily handle rate is already noisy (two objections in a day is
  // 0% or 50%). Past a fortnight the noise wins and the weekly line is the
  // readable one. Empty days still BREAK the line rather than plotting 0%.
  var DAILY_BUCKET_MAX_DAYS = 14;
  function bucketForRange(r) {
    if (!r || !r.from || !r.to) return 'week';
    var days = Math.round((Date.parse(r.to) - Date.parse(r.from)) / 86400000);
    return days <= DAILY_BUCKET_MAX_DAYS ? 'day' : 'week';
  }
  function repSeriesBucket() { return bucketForRange(state.teamRange); }
  function teamQP(extra) {
    var r = teamRange();
    var qp = 'from=' + encodeURIComponent(r.from) + '&to=' + encodeURIComponent(r.to);
    if (state.teamSelected) qp += '&team=' + encodeURIComponent(state.teamSelected);
    if (extra) qp += '&' + extra;
    return qp;
  }
  async function fetchTeamJSON(path) {
    var res = await fetch(path, { headers: authHeader() });
    if (res.status === 401) { clearSession(); window.location.replace('/login'); throw new Error('unauth'); }
    if (res.status === 403) return { _forbidden: true };
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  }
  function resetTeamData() {
    state.teamOverview = null; state.teamTrends = null; state.teamRecs = null;
    state.teamHighlights = null; state.teamDigest = null; state.teamDigestDate = null;
    state.teamNeedsWork = null;
    // Without this the previous team's / previous range's lines stay on screen
    // until the refetch lands, which reads as real data for the new selection.
    state.teamRepSeries = null;
    state.teamWhy = null;
    state.teamDetailMetric = null; // exit any glance-box detail when team/range changes
  }
  // Re-render whichever team surface is active (main view or the expanded page).
  function renderTeamSurface() {
    if (state.view === 'team-expanded') renderTeamExpanded();
    else if (state.view === 'team-needs-work') renderTeamNeedsWorkView();
    else if (state.view === 'team-members') renderTeamMembersView();
    else renderTeamView();
  }
  function pickTeam(key) { state.teamSelected = (key === '__default') ? null : key; resetTeamData(); renderTeamSurface(); }
  function setTeamTrendBucket(b) { state.teamTrendBucket = b; state.teamTrends = null; loadTeam('trends'); }
  /* REMOVED 2026-08-16 — the preset setter, superseded by the date picker's
     own setter registered in ensureTeamPicker(). Kept in place for reference.
  function setTeamRange(days) {
    var to = new Date();
    var from = days >= 9999 ? new Date('2025-01-01T00:00:00Z') : new Date(Date.now() - days * 24 * 60 * 60 * 1000);
    state.dateRange = { from: from.toISOString(), to: to.toISOString(), days: days };
    resetTeamData(); renderTeamSurface();
  }
  */
  // Generic lazy loader for each team panel.
  async function loadTeam(which) {
    var map = {
      context:  { flag: null,                    set: 'teamContext',    url: '/team/context' },
      overview: { flag: 'teamOverviewLoading',   set: 'teamOverview',   url: '/team/overview?' + teamQP() },
      trends:   { flag: 'teamTrendsLoading',     set: 'teamTrends',     url: '/team/trends?' + teamQP('bucket=' + state.teamTrendBucket) },
      recs:     { flag: 'teamRecsLoading',       set: 'teamRecs',       url: '/team/recommendations?' + teamQP() },
      needsWork:{ flag: 'teamNeedsWorkLoading',  set: 'teamNeedsWork',  url: '/team/needs-work?' + teamQP() },
      highlights:{flag: 'teamHighlightsLoading', set: 'teamHighlights', url: '/team/highlights?' + teamQP() },
      digest:   { flag: 'teamDigestLoading',     set: 'teamDigest',     url: '/team/digest?' + teamQP(state.teamDigestDate ? 'date=' + state.teamDigestDate : '') },
      // 10b: per-rep weekly series for the two line graphs. Deterministic and
      // model-free, so it is cheap to refetch when the selector changes.
      why:      { flag: 'teamWhyLoading',         set: 'teamWhy',        url: '/team/why-prose?' + teamQP() },
      repSeries:{ flag: 'teamRepSeriesLoading',  set: 'teamRepSeries',  url: '/team/rep-series?' + teamQP('bucket=' + repSeriesBucket() + (state.teamObjectionCategory ? '&objection_category=' + state.teamObjectionCategory : '')) },
      // ⚠ THE GAUGE LANE DOES NOT USE teamQP(). teamQP injects state.teamRange,
      // and this panel's entire purpose is a FIXED window the picker cannot move.
      // Using it here would make the panel silently follow the picker — the same
      // shared-carrier failure that has already bitten this file twice. Pinned by
      // test/rep-gauges.test.js.
      repGauges:{ flag: 'teamGaugesLoading', set: 'teamGauges', url: '/team/rep-series?' + gaugeQP(gaugeWindow()) },
    };
    var c = map[which]; if (!c) return;
    if (c.flag && state[c.flag]) return;
    if (c.flag) state[c.flag] = true;
    try { state[c.set] = await fetchTeamJSON(c.url); }
    catch (err) { if (err.message === 'unauth') return; state[c.set] = { _error: err.message || 'unknown' }; }
    if (c.flag) state[c.flag] = false;
    if (state.view === 'team') renderTeamView();
    else if (state.view === 'team-expanded') renderTeamExpanded();
    else if (state.view === 'team-needs-work') renderTeamNeedsWorkView();
    else if (state.view === 'team-members') renderTeamMembersView();
  }

  // ⚠ THE SPEEDOMETER PANEL'S FIXED WINDOW — deliberately independent of the
  // date picker. It reads NOTHING from state: no teamRange, no dateRange, no
  // hash. The panel is labelled with this window on screen so it cannot be
  // misread as following the filter below it.
  //
  // Reuses rangeToIso() so "last 7 days inclusive" means exactly what it means
  // for the picker's own default — two definitions of "7 days" on one page would
  // be a difference nobody could see and everybody would argue about.
  function gaugeWindow() {
    var today = new Date().toISOString().slice(0, 10);
    return rangeToIso(addDays(today, -6), today);
  }
  // The gauge lane's own query builder. Separate from teamQP ON PURPOSE: teamQP
  // reads state.teamRange, and inheriting it here is the exact bug this panel
  // must not have. It still carries the team selection, which IS shared.
  function gaugeQP(win) {
    var qp = 'from=' + encodeURIComponent(win.from) + '&to=' + encodeURIComponent(win.to) + '&bucket=day';
    if (state.teamSelected) qp += '&team=' + encodeURIComponent(state.teamSelected);
    return qp;
  }

  // Team view defaults to LAST 7 DAYS (Justin's spec) — set once on first entry,
  // then the manager's own preset choices stick.
  function ensureTeamDefaultRange() {
    if (state.teamRangeInit) return;
    state.teamRangeInit = true;
    // Seeded through the picker's own converter so the default window has the
    // same inclusive-end shape a hand-picked one does — otherwise the very first
    // load would quietly cover a few hours less than the label claims.
    var today = new Date().toISOString().slice(0, 10);
    var weekAgo = new Date(Date.now() - 6 * 86400000).toISOString().slice(0, 10);
    state.teamRange = rangeToIso(weekAgo, today);   // last 7 days INCLUSIVE
  }
  function teamRange() { ensureTeamDefaultRange(); return state.teamRange; }

  // One picker instance for the team view. Registered once; it reads and writes
  // ONLY state.teamRange, which is what keeps coaching's range independent.
  var teamPickerReady = false;
  function ensureTeamPicker() {
    if (teamPickerReady) return;
    teamPickerReady = true;
    registerDatePicker('team', function () { return teamRange(); }, function (from, to) {
      state.teamRange = { from: from, to: to };
      resetTeamData();
      syncHashFromState(true);      // the range lives in the URL — refreshable, shareable
      renderTeamSurface();
    });
  }


  // ─── manager board: the two line graphs (10b) ────────────────────────────
  //
  // X = time (weeks), Y = rate. One line per rep, plus a BOLD DOTTED team
  // average. Justin rejected rep-vs-objection axes twice: a line implies
  // continuity, so connecting one rep to the next reads as a progression that
  // does not exist. Time on X is the shape that makes a line honest.
  //
  // ⚠ EMPTY WEEKS BREAK THE LINE (spanGaps:false + null). A week with no
  // objections is "no data"; drawing 0% would say "handled nothing", which is a
  // different and damaging claim. A week where every objection genuinely went
  // unhandled IS 0 and stays drawn.
  //
  // ⚠ A REP WITH NO DATA AT ALL IS ABSENT — not a flat zero, and not an empty
  // legend entry implying a line that just happens to be off-screen.
  //
  // NO GREY TEXT: axes, ticks, legend and tooltips all use full-strength text.
  var REP_LINE_COLORS = [
    // ⚠ NO SEMANTIC HUE MAY APPEAR HERE, and that is the whole rule.
    //   --bad red and --mid amber are dropped because a rep drawn in the warning
    //   colour READS as a warning — the line says "this rep is failing" when all
    //   it means is "this is rep number four".
    //   --accent GREEN is dropped for the same reason in the other direction: it
    //   means "you can click this" everywhere else on the page, and a hue cannot
    //   do two jobs. Green led this ramp for one commit; cyan leads it now.
    // Blue is HERE, not banned: it stopped being the interactive colour when
    // --accent moved to green, so it carries no meaning any more and is the most
    // separable seventh hue available. Seven entries because seven reps need
    // seven distinguishable lines — the consumer cycles, so a shorter list would
    // silently draw two reps in the same colour on one chart.
    '#22d3ee',  // cyan
    '#a78bfa',  // violet
    '#f472b6',  // pink
    '#60a5fa',  // blue    — freed by the accent move; no longer means "clickable"
    '#2dd4bf',  // teal
    '#c4b5fd',  // light violet
    '#67e8f9',  // light cyan
  ];
  var repCharts = {};

  // Ruling 2026-08-15: the selector uses Scout's EXISTING labelling — the four
  // stored objection_category values. There is deliberately NO "price" option:
  // money-phrased objections are classified `fear` by standing rule unless a
  // genuine logistical payment constraint appears. That is the taxonomy working
  // as designed, not a gap — do not add a parallel vocabulary here.
  var OBJECTION_CATEGORY_OPTIONS = [
    { key: '', label: 'All objections' },
    { key: 'fear', label: 'Fear / money' },
    { key: 'timing', label: 'Timing' },
    { key: 'logistical', label: 'Logistical' },
    { key: 'partner', label: 'Partner / spouse' },
  ];

  function repSeriesChart(canvasId, series, pick, yLabel) {
    var ctx = document.getElementById(canvasId);
    if (!ctx || !window.Chart || !series) return;
    if (repCharts[canvasId]) { repCharts[canvasId].destroy(); repCharts[canvasId] = null; }

    // Drop reps with no point at all in this window.
    var reps = (series.reps || []).filter(function (r) {
      return pick(r).some(function (p) { return p && p.rate !== null; });
    });

    var datasets = reps.map(function (r, i) {
      var pts = pick(r);
      return {
        label: r.name,
        data: pts.map(function (p) { return p.rate; }),
        _raw: pts,
        borderColor: REP_LINE_COLORS[i % REP_LINE_COLORS.length],
        backgroundColor: REP_LINE_COLORS[i % REP_LINE_COLORS.length],
        borderWidth: 2, pointRadius: 3, tension: 0.25, spanGaps: false,
      };
    });

    var teamPts = (series.team && (yLabel === 'Handle Rate' ? series.team.handle : series.team.close)) || [];
    if (teamPts.some(function (p) { return p && p.rate !== null; })) {
      datasets.push({
        label: 'Team average',
        data: teamPts.map(function (p) { return p.rate; }),
        _raw: teamPts,
        borderColor: '#ffffff', backgroundColor: '#ffffff',
        borderWidth: 3, borderDash: [6, 4], pointRadius: 0, tension: 0.25, spanGaps: false,
      });
    }

    repCharts[canvasId] = new Chart(ctx.getContext('2d'), {
      type: 'line',
      data: { labels: (series.buckets || []).map(function (b) { return b.label; }), datasets: datasets },
      options: {
        responsive: true, maintainAspectRatio: false,
        interaction: { mode: 'nearest', intersect: false },
        scales: {
          y: {
            beginAtZero: true, max: 100,
            ticks: { color: '#ededed', callback: function (v) { return v + '%'; } },
            grid: { color: 'rgba(255,255,255,0.08)' },
            title: { display: true, text: yLabel, color: '#ededed' },
          },
          x: { ticks: { color: '#ededed' }, grid: { color: 'rgba(255,255,255,0.05)' } },
        },
        plugins: {
          legend: { labels: { color: '#ededed', usePointStyle: true, boxWidth: 10 } },
          tooltip: {
            callbacks: {
              // House rule: a rate never renders without its raw counts.
              label: function (c) {
                var raw = (c.dataset._raw || [])[c.dataIndex] || {};
                if (raw.rate === null || raw.rate === undefined) return c.dataset.label + ': no data';
                var n = (raw.handled !== undefined) ? raw.handled : raw.closed;
                var unit = (raw.handled !== undefined) ? 'handled' : 'prospects closed';
                if (raw.reps_counted !== undefined) {
                  return c.dataset.label + ': ' + raw.rate + '%  (' + raw.numerator + ' of ' + raw.total
                    + ', ' + raw.reps_counted + ' rep' + (raw.reps_counted === 1 ? '' : 's') + ')';
                }
                return c.dataset.label + ': ' + raw.rate + '%  (' + n + ' of ' + raw.total + ' ' + unit + ')';
              },
            },
          },
        },
      },
    });
  }

  // While a new range is fetching, a bare 300px canvas is a tall blank box — the
  // other panels use skeletons, so these do too. The canvas is still emitted so
  // drawRepSeriesCharts has something to draw into the moment data lands.
  function repGraphBodyHtml(canvasId) {
    var loading = state.teamRepSeriesLoading || (!state.teamRepSeries && !state.teamRepSeriesLoading);
    return '<div class="rep-graph">'
      + (loading ? '<div class="rep-graph-skeleton skeleton"></div>' : '')
      + '<canvas id="' + canvasId + '"' + (loading ? ' style="display:none;"' : '') + '></canvas>'
      + '</div>';
  }

  // ══ 10e: the pivoted rep's own objection graph ═══════════════════════════
  //
  // Reuses /team/rep-series and filters to the one rep — no parallel path and no
  // new route, per the ruling. The pivot itself is the existing setUser.
  //
  // ⚠ It windows by COACHING's range (state.dateRange), because that is the range
  // control on the page it renders on. Using the team range here would show a
  // graph that disagrees with every other number on the same screen.
  function repOwnGraphVisible() {
    return hasManagerContext() && !isSelf() && !!state.viewingUserId;
  }
  async function loadRepGraph() {
    if (state.repGraphLoading) return;
    state.repGraphLoading = true;
    try {
      var r = state.dateRange;
      var qp = 'from=' + encodeURIComponent(r.from) + '&to=' + encodeURIComponent(r.to)
        + '&bucket=' + bucketForRange(r);
      var res = await fetch('/team/rep-series?' + qp, { headers: authHeader() });
      if (res.status === 401) { clearSession(); window.location.replace('/login'); throw new Error('unauth'); }
      if (!res.ok) throw new Error('HTTP ' + res.status);
      state.repGraph = await res.json();
    } catch (err) {
      if (err.message === 'unauth') return;
      state.repGraph = { _error: err.message || 'unknown' };
    }
    state.repGraphLoading = false;
    if (state.view === 'overview') renderOverview(false);
  }
  // The series narrowed to ONE rep. The team average is kept as a dashed
  // reference line — a single line with nothing to read it against says little —
  // but the rep's own line is the subject and is always present.
  function repOwnSeries() {
    var d = state.repGraph;
    if (!d || d._error || !Array.isArray(d.reps)) return null;
    var mine = d.reps.filter(function (x) { return x.user_id === state.viewingUserId; });
    if (!mine.length) return null;
    return { buckets: d.buckets, reps: mine, team: d.team };
  }
  function repOwnGraphHtml() {
    if (!repOwnGraphVisible()) return '';
    var series = repOwnSeries();
    var loading = state.repGraphLoading || state.repGraph === null;
    var body = loading
      ? '<div class="rep-graph"><div class="rep-graph-skeleton skeleton"></div></div>'

    /* ⚠ "HOW THIS IS ESTIMATED" PANEL REMOVED 2026-08-17. Justin: "I don't want

    // honesty contract / how this is computed (subject-aware; borrow disclosed)
    var lk = det.linkage || {};
    var deltaPP = (typeof lk.delta === 'number') ? Math.round(lk.delta * 1000) / 10 : null;
    var borrowed = !!lk.borrowed;

      + (borrowed ? 'across your team ' : (personal ? 'in your calls ' : 'this period '))
      + (deltaPP == null ? '' : '(handled objections sat in a closed call ' + Math.round((lk.p_closed_handled || 0) * 100) + '% of the time vs ' + Math.round((lk.p_closed_nothandled || 0) * 100) + '% when not — a ' + deltaPP + '-point lift, over ' + (lk.handled_n || 0) + ' handled / ' + (lk.nothandled_n || 0) + ' not-handled objections)')
      + ', then by ' + (borrowed ? 'your team\'s ' : '') + 'average cash per closed call (' + fmtCash(det.avg_cash) + ' over ' + (det.closed_calls || 0) + ' closed calls).'
      + (borrowed ? ' Your own bucket rate is the signal; the deal economics are borrowed from your team, a larger and steadier sample.' : '') + '</p>'
      + '<p class="nw-caveat">This is a correlation in ' + (personal ? 'your' : 'this period\'s') + ' ' + (det.analyzed_calls || 0) + ' analyzed calls, not a guarantee — figures use “≈”. We refuse a dollar figure below the sample thresholds (bucket ≥ ' + minBucket + ', clear gap' + (personal ? ', with the deal economics from a sample of ≥ 10 objections each side + ≥ 5 closed calls' : ', ≥ 10 objections each side of the link, ≥ 5 closed calls') + ').</p>'
      + '</div>';

  // money helpers (frontend): round to nearest $100, comma-format an integer.

  // ══ SHARED DATE-RANGE PICKER (stage 1) ═══════════════════════════════════
  //
  // Replaces the 7d/30d/90d preset buttons. Hand-rolled rather than native
  // <input type="date"> or a library: two native inputs are two independent
  // single-date fields that cannot show a range highlight or do click-start /
  // click-end, their popups render in OS chrome that clashes with this theme,
  // and Railway's build runs plain `npm install` so a library would ship to
  // production for a control that is ~200 lines of pure logic.
  //
  // ⚠ EVERY VIEW OWNS ITS OWN RANGE (Justin's ruling 2026-08-16). This control
  // NEVER reads state.dateRange or any other app state. Each instance registers
  // a getter and a setter; the control only ever calls those. That is what lets
  // coaching, team and Calls hold genuinely separate ranges.
  //
  // ⚠⚠ TWO LABEL CONVENTIONS, DELIBERATELY DIFFERENT — DO NOT HARMONISE THEM.
  //   • THIS PICKER'S LABEL IS INCLUSIVE: "Aug 3 - Aug 10" means BOTH Aug 3 and
  //     Aug 10 are in the range. A person selecting two dates on a calendar means
  //     "from this one to that one, including both" — anything else would be a
  //     lie about what they just clicked. This is why rangeToIso() ends the
  //     window at 23:59:59.999 of the end day: an exclusive end would silently
  //     drop the final day's calls from every number on the page.
  //   • BUCKET LABELS ON THE GRAPHS ARE EXCLUSIVE: "Aug 3 - Aug 9", then
  //     "Aug 10 - Aug 16". Adjacent buckets must never share a day, or the same
  //     call appears to sit in two points on one chart.
  //   Both are correct FOR THEIR OWN JOB. A future session will notice they
  //   disagree and try to unify them; unifying either direction breaks the other.
  //   See lib/team-analytics.js bucketRangeLabel for the other half of this note.

  var MONTH_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var DOW_SHORT = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  // One-click all-time, per the ruling. Matches the retired 9999 preset's floor.
  var PICKER_EARLIEST = '2025-01-01';

  // ── pure helpers (unit-tested by extraction; no DOM, no state) ────────────

  function ymd(iso) {                     // any instant → 'YYYY-MM-DD' in UTC
    if (typeof iso !== 'string' || !iso) return null;
    var ms = Date.parse(iso); if (isNaN(ms)) return null;
    return new Date(ms).toISOString().slice(0, 10);
  }
  function dayLabel(day) {                // 'YYYY-MM-DD' → 'Aug 3'
    if (!day) return '';
    var p = day.split('-');
    return MONTH_SHORT[Number(p[1]) - 1] + ' ' + Number(p[2]);
  }
  // INCLUSIVE label — see the convention note above.
  // The year appears only when the range CROSSES one: "Earliest" spans 20 months
  // and read "Jan 1 - Aug 16", which says nothing about which January. Within a
  // single year the year is noise, so it stays off.
  function rangeLabelInclusive(fromIso, toIso) {
    var a = ymd(fromIso), b = ymd(toIso);
    if (!a || !b) return 'Pick dates';
    var crossesYear = a.slice(0, 4) !== b.slice(0, 4);
    if (a === b) return dayLabel(a) + (crossesYear ? ' ' + a.slice(0, 4) : '');
    if (!crossesYear) return dayLabel(a) + ' - ' + dayLabel(b);
    return dayLabel(a) + ' ' + a.slice(0, 4) + ' - ' + dayLabel(b) + ' ' + b.slice(0, 4);
  }
  // 'YYYY-MM-DD' pair → the ISO window the app queries with. The end day is
  // carried to its last millisecond so the INCLUSIVE label tells the truth.
  function rangeToIso(startDay, endDay) {
    return {
      from: startDay + 'T00:00:00.000Z',
      to: endDay + 'T23:59:59.999Z',
    };
  }
  function addDays(day, n) {
    var d = new Date(day + 'T00:00:00.000Z');
    return new Date(d.getTime() + n * 86400000).toISOString().slice(0, 10);
  }
  // An end BEFORE the start is resolved by swapping, never by erroring after the
  // fact: the user has unambiguously indicated two ends of a span, and telling
  // them off for the order they clicked in would be pedantry.
  function resolvePick(pendingStart, clicked) {
    if (!pendingStart) return { pending: clicked, range: null };
    var a = pendingStart, b = clicked;
    if (b < a) { var t = a; a = b; b = t; }
    return { pending: null, range: { start: a, end: b } };
  }
  // (year, month) + selection → 6 rows × 7 cells, Monday-first. Pure.
  // `pending` is a half-made selection: the day already clicked, awaiting a second.
  function monthGridCells(year, month, startDay, endDay, pending, hoverDay) {
    var first = new Date(Date.UTC(year, month, 1));
    var lead = (first.getUTCDay() + 6) % 7;              // Monday-first offset
    var gridStart = new Date(first.getTime() - lead * 86400000);
    // A provisional range so the highlight follows the cursor before the second
    // click — without it, click-start/click-end gives no feedback at all.
    var lo = startDay, hi = endDay;
    if (pending) {
      lo = pending; hi = hoverDay && hoverDay > pending ? hoverDay : pending;
      if (hoverDay && hoverDay < pending) { lo = hoverDay; hi = pending; }
    }
    var rows = [];
    for (var w = 0; w < 6; w++) {
      var row = [];
      for (var d = 0; d < 7; d++) {
        var cur = new Date(gridStart.getTime() + (w * 7 + d) * 86400000);
        var day = cur.toISOString().slice(0, 10);
        row.push({
          day: day,
          num: cur.getUTCDate(),
          inMonth: cur.getUTCMonth() === month && cur.getUTCFullYear() === year,
          isStart: day === lo,
          isEnd: day === hi,
          inRange: !!(lo && hi && day > lo && day < hi),
        });
      }
      rows.push(row);
    }
    return rows;
  }

  // ── instances ────────────────────────────────────────────────────────────
  //
  // A caller registers ONE getter and ONE setter per instance. The control holds
  // only its own UI state (which month is shown, whether the panel is open, the
  // half-made selection, which cell has keyboard focus) — never the range itself,
  // and never a reference to app state.
  var DATE_PICKERS = {};   // key -> { get: () => {from,to}, set: (from,to) => void }
  var PICKER_UI = {};      // key -> { open, year, month, pending, focus, hover }

  function registerDatePicker(key, get, set) {
    DATE_PICKERS[key] = { get: get, set: set };
    if (!PICKER_UI[key]) PICKER_UI[key] = { open: false, year: null, month: null, pending: null, focus: null, hover: null };
  }
  function pickerRange(key) {
    var inst = DATE_PICKERS[key];
    var r = inst && inst.get ? inst.get() : null;
    return r && r.from && r.to ? r : null;
  }
  function pickerUi(key) {
    if (!PICKER_UI[key]) PICKER_UI[key] = { open: false, year: null, month: null, pending: null, focus: null, hover: null };
    return PICKER_UI[key];
  }

  // ── rendering ────────────────────────────────────────────────────────────

  function datePickerHtml(key) {
    var r = pickerRange(key), ui = pickerUi(key);
    var startDay = r ? ymd(r.from) : null, endDay = r ? ymd(r.to) : null;
    var label = r ? rangeLabelInclusive(r.from, r.to) : 'Pick dates';
    return '<div class="dp" id="dp-' + escapeHtml(key) + '">'
      + '<button type="button" class="dp-label" id="dp-btn-' + escapeHtml(key) + '"'
        + ' aria-haspopup="dialog" aria-expanded="' + (ui.open ? 'true' : 'false') + '"'
        + ' onclick="datePickerToggle(\'' + escapeHtml(key) + '\')">'
        + '<span class="dp-cal" aria-hidden="true">▾</span> ' + escapeHtml(label) + '</button>'
      + (ui.open ? datePickerPanelHtml(key, startDay, endDay, ui) : '')
      + '</div>';

  function datePickerPanelHtml(key, startDay, endDay, ui) {
    var y = ui.year, m = ui.month;
    var rows = monthGridCells(y, m, startDay, endDay, ui.pending, ui.hover);
    var k = escapeHtml(key);
    var head = '<div class="dp-head">'
      + '<button type="button" class="dp-nav" aria-label="Previous month" onclick="datePickerNav(\'' + k + '\',-1)">‹</button>'
      + '<span class="dp-month">' + MONTH_SHORT[m] + ' ' + y + '</span>'
      + '<button type="button" class="dp-nav" aria-label="Next month" onclick="datePickerNav(\'' + k + '\',1)">›</button>'
      + '</div>';
    var dow = '<div class="dp-dow">' + DOW_SHORT.map(function (d) { return '<span>' + d[0] + '</span>'; }).join('') + '</div>';
    var grid = rows.map(function (row) {
      return '<div class="dp-row">' + row.map(function (c) {
