<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Coaching Dashboard — Scout Systems</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net"/>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <style>
    /* ──────────────────────────────────────────────────────────────────
       Coaching Dashboard v2 — donut-led, drill-down coaching tool.
       Old version archived at backend/web/dashboard-v1.html.archived.

       Design principles (no apologies on the polish):
         - Limited color palette (8 colors, used intentionally)
         - 12px corner radius across cards
         - 8px spacing rhythm
         - System font stack (clean, fast)
         - Subtle gradients, no heavy shadows
         - Smooth transitions, no jarring spinners
         - Generous whitespace
       ────────────────────────────────────────────────────────────────── */

    :root {
      --bg:           #0a0a0a;
      --bg-elevated:  #131313;
      --bg-hover:     #1a1a1a;
      --bg-deep:      #050505;
      --border:       #1f1f1f;
      --border-hover: #2a2a2a;
      --border-focus: #3b3b3b;
      --text:         #ededed;
      --text-soft:    #cccccc;
      --text-muted:   #8b8b8b;
      --text-dim:     #5a5a5a;

      --accent:       #5b9eff;
      --good:         #4ade80;
      --mid:          #fbbf24;
      --bad:          #f87171;
      --purple:       #c084fc;
      --orange:       #fb923c;
      --cyan:         #22d3ee;
      --slate:        #64748b;

      --radius-sm: 8px;
      --radius:    12px;
      --radius-lg: 16px;

      --shadow-sm: 0 1px 2px rgba(0,0,0,0.4);
      --shadow-md: 0 2px 4px rgba(0,0,0,0.4), 0 8px 24px rgba(0,0,0,0.3);

      --ease: cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; cursor: pointer; }

    /* ── Top bar ───────────────────────────────────────────────────── */
    .top-bar {
      background: linear-gradient(180deg, #161616 0%, #0d0d0d 100%);
      border-bottom: 1px solid var(--border);
      padding: 14px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      backdrop-filter: blur(8px);
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .top-bar-left { display: flex; align-items: center; gap: 12px; font-weight: 600; font-size: 14px; }
    .top-bar-left .sep { color: var(--text-dim); font-weight: 400; }
    .top-bar-left .sub { color: var(--text-muted); font-weight: 500; font-size: 13px; }
    .top-bar-right { display: flex; align-items: center; gap: 20px; font-size: 13px; color: var(--text-muted); }
    .top-bar-right a:hover { color: var(--text); }
    .signout { cursor: pointer; }
    .signout:hover { color: var(--text); }

    /* ── Page layout ────────────────────────────────────────────────── */
    .page { max-width: 1200px; margin: 0 auto; padding: 36px 32px 100px; }

    .page-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 20px;
      margin-bottom: 36px;
    }
    .page-header h1 {
      font-size: 28px;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin: 0;
    }
    .page-header .subtitle {
      color: var(--text-muted);
      font-size: 14px;
      margin-top: 6px;
    }

    .controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }

    .user-select {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 32px 8px 14px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-family: inherit;
      min-width: 220px;
      cursor: pointer;
      transition: border-color 0.15s var(--ease);
      appearance: none;
      background-image: url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%238b8b8b' stroke-width='1.5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: right 12px center;
    }
    .user-select:hover { border-color: var(--border-hover); }
    .user-select:focus { outline: none; border-color: var(--accent); }

    .date-presets { display: flex; gap: 4px; background: var(--bg-elevated); padding: 4px; border-radius: var(--radius-sm); border: 1px solid var(--border); }
    .date-preset {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      transition: all 0.15s var(--ease);
    }
    .date-preset:hover { color: var(--text); }
    .date-preset.active { background: var(--bg-hover); color: var(--text); }

    /* ── Donut row ──────────────────────────────────────────────────── */
    .donut-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 48px;
    }
    @media (max-width: 820px) { .donut-row { grid-template-columns: 1fr; } }

    .donut-card {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 32px 28px 28px;
      cursor: pointer;
      transition: all 0.18s var(--ease);
      position: relative;
      overflow: hidden;
      text-align: center;
    }
    .donut-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 0%, rgba(91, 158, 255, 0.04), transparent 70%);
      pointer-events: none;
    }
    .donut-card:hover {
      border-color: var(--border-hover);
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }
    .donut-card:hover::before { background: radial-gradient(circle at 50% 0%, rgba(91, 158, 255, 0.08), transparent 70%); }

    .donut-card .donut-label {
      font-size: 12px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 600;
      margin-bottom: 24px;
    }

    .donut-canvas-wrap {
      position: relative;
      width: 200px;
      height: 200px;
      margin: 0 auto;
    }

    .donut-center {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    .donut-center .big {
      font-size: 36px;
      font-weight: 700;
      letter-spacing: -0.025em;
      line-height: 1;
    }
    .donut-center .small {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 6px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .donut-legend {
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
      margin-top: 24px;
      font-size: 12px;
      color: var(--text-muted);
    }
    .donut-legend .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 6px;
      vertical-align: middle;
    }

    .donut-hint {
      font-size: 11px;
      color: var(--text-dim);
      margin-top: 10px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    /* ── Section heading ────────────────────────────────────────────── */
    .section { margin-bottom: 48px; }
    .section-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 18px;
      gap: 12px;
    }
    .section-header h2 {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.01em;
      margin: 0;
    }
    .section-header .meta { font-size: 12px; color: var(--text-muted); }

    /* ── Coach summary patterns ─────────────────────────────────────── */
    .patterns-list { display: flex; flex-direction: column; gap: 12px; }
    .pattern-card {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 22px;
      transition: border-color 0.15s var(--ease);
    }
    .pattern-card:hover { border-color: var(--border-hover); }
    .pattern-headline {
      font-size: 15px;
      font-weight: 600;
      line-height: 1.4;
      letter-spacing: -0.005em;
      margin-bottom: 8px;
    }
    .pattern-detail {
      font-size: 13.5px;
      color: var(--text-soft);
      line-height: 1.6;
    }
    .pattern-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 12px;
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .pattern-confidence {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: 600;
    }
    .pattern-confidence.high   { background: rgba(74, 222, 128, 0.10); color: var(--good); }
    .pattern-confidence.medium { background: rgba(251, 191, 36, 0.10); color: var(--mid); }
    .pattern-confidence.low    { background: rgba(139, 139, 139, 0.10); color: var(--text-muted); }

    .signal-banner {
      background: linear-gradient(135deg, rgba(91, 158, 255, 0.06), rgba(91, 158, 255, 0.02));
      border: 1px solid rgba(91, 158, 255, 0.15);
      border-radius: var(--radius);
      padding: 12px 16px;
      font-size: 12.5px;
      color: #b3d4ff;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .signal-banner-icon {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--accent);
      opacity: 0.4;
      flex-shrink: 0;
    }

    /* ── Calls list ─────────────────────────────────────────────────── */
    .calls-list { display: flex; flex-direction: column; gap: 8px; }
    .call-card {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      transition: border-color 0.15s var(--ease);
    }
    .call-card:hover { border-color: var(--border-hover); }
    .call-card.expanded { border-color: var(--border-focus); }

    .call-head {
      padding: 16px 22px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      user-select: none;
    }
    .call-head-left { flex: 1; min-width: 0; }
    .call-head-title { font-size: 14.5px; font-weight: 600; letter-spacing: -0.005em; }
    .call-head-title .name { color: var(--text); }
    .call-head-title .anon { color: var(--text-muted); font-weight: 400; font-style: italic; }
    .call-head-meta {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .call-head-right { display: flex; align-items: center; gap: 14px; }

    .badge {
      font-size: 10.5px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      white-space: nowrap;
    }
    .badge-win    { background: rgba(74, 222, 128, 0.12); color: var(--good); }
    .badge-loss   { background: rgba(248, 113, 113, 0.12); color: var(--bad); }
    .badge-fu     { background: rgba(251, 191, 36, 0.12); color: var(--mid); }
    .badge-live   { background: rgba(91, 158, 255, 0.12); color: var(--accent); }
    .badge-empty  { background: rgba(139, 139, 139, 0.10); color: var(--text-muted); }

    .expand-icon {
      color: var(--text-dim);
      transition: transform 0.2s var(--ease);
      font-size: 14px;
    }
    .call-card.expanded .expand-icon { transform: rotate(180deg); color: var(--text-muted); }

    .call-body {
      border-top: 1px solid var(--border);
      padding: 22px;
      background: var(--bg-deep);
      display: none;
    }
    .call-card.expanded .call-body { display: block; }

    .obj-event {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
      margin-bottom: 12px;
    }
    .obj-event:last-child { margin-bottom: 0; }
    .obj-event-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 14px;
    }
    .obj-event-title { font-size: 14px; font-weight: 600; }
    .obj-event-time { font-size: 11px; color: var(--text-muted); margin-left: 8px; font-weight: 400; }

    .verdict {
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .verdict-overcome  { background: rgba(74, 222, 128, 0.12); color: var(--good); }
    .verdict-not       { background: rgba(248, 113, 113, 0.12); color: var(--bad); }
    .verdict-unknown   { background: rgba(139, 139, 139, 0.10); color: var(--text-muted); }
    .verdict-conf { font-size: 10px; color: var(--text-dim); margin-left: 8px; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 500; }

    .coaching-note {
      background: linear-gradient(135deg, rgba(91, 158, 255, 0.06) 0%, rgba(74, 222, 128, 0.03) 100%);
      border: 1px solid rgba(91, 158, 255, 0.18);
      border-radius: var(--radius-sm);
      padding: 16px 18px;
      font-size: 13.5px;
      line-height: 1.65;
      color: var(--text);
      margin-bottom: 14px;
    }
    .coaching-note-empty {
      font-size: 12.5px;
      color: var(--text-muted);
      font-style: italic;
      margin-bottom: 14px;
    }

    .compare-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 680px) { .compare-grid { grid-template-columns: 1fr; } }
    .compare-pane {
      background: var(--bg-deep);
      border-radius: var(--radius-sm);
      padding: 14px 16px;
      border-left: 3px solid var(--border);
    }
    .compare-pane.framework { border-left-color: var(--accent); }
    .compare-pane.actual    { border-left-color: var(--mid); }
    .compare-label {
      font-size: 10px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 8px;
      font-weight: 600;
    }
    .compare-text { font-size: 13px; color: var(--text-soft); line-height: 1.55; }
    .compare-text.empty { color: var(--text-dim); font-style: italic; }

    .obj-notes-row {
      font-size: 11px;
      color: var(--text-dim);
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      line-height: 1.5;
    }

    /* ── Drill view ─────────────────────────────────────────────────── */
    .drill-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
    }
    .back-btn {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      transition: all 0.15s var(--ease);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .back-btn:hover { color: var(--text); border-color: var(--border-hover); }

    .drill-title { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; }
    .drill-title .count { color: var(--text-muted); font-weight: 400; margin-left: 8px; }

    .drill-grid {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 36px;
      margin-bottom: 48px;
    }
    @media (max-width: 760px) { .drill-grid { grid-template-columns: 1fr; } }

    .drill-donut {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .drill-breakdown { display: flex; flex-direction: column; gap: 10px; }
    .breakdown-row {
      display: grid;
      grid-template-columns: 12px 1fr auto auto;
      gap: 12px;
      align-items: center;
      padding: 14px 18px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 13px;
      transition: all 0.15s var(--ease);
    }
    .breakdown-row.clickable {
      cursor: pointer;
      grid-template-columns: 12px 1fr auto auto 14px;
    }
    .breakdown-row.clickable:hover {
      border-color: var(--border-focus);
      background: var(--bg-hover);
      transform: translateX(2px);
    }
    .breakdown-row.clickable::after {
      content: '→';
      color: var(--text-dim);
      font-size: 14px;
      transition: color 0.15s var(--ease);
      grid-column: 5;
      text-align: right;
    }
    .breakdown-row.clickable:hover::after { color: var(--accent); }
    .breakdown-row:hover { border-color: var(--border-hover); }

    /* Per-type drill — event cards */
    .event-card {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px 24px;
      margin-bottom: 14px;
      transition: border-color 0.15s var(--ease);
    }
    .event-card:hover { border-color: var(--border-hover); }
    .event-card-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .event-card-title {
      font-size: 14px;
      font-weight: 600;
    }
    .event-card-title .name { color: var(--text); }
    .event-card-title .anon { color: var(--text-muted); font-weight: 400; font-style: italic; }
    .event-card-meta {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .event-card-right {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    /* Stats strip atop per-type drill */
    .type-stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin-bottom: 32px;
    }
    .type-stat {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
    }
    .type-stat .stat-label {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 600;
    }
    .type-stat .stat-value {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-top: 6px;
      line-height: 1;
    }
    .type-stat .stat-value.good { color: var(--good); }
    .type-stat .stat-value.bad  { color: var(--bad); }
    .type-stat .stat-value.mid  { color: var(--mid); }
    .type-stat .stat-sub {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 6px;
    }

    /* Framework rebuttal reference card (top of per-type drill) */
    .framework-ref {
      background: linear-gradient(135deg, rgba(91, 158, 255, 0.06), rgba(74, 222, 128, 0.03));
      border: 1px solid rgba(91, 158, 255, 0.18);
      border-radius: var(--radius);
      padding: 18px 22px;
      margin-bottom: 32px;
    }
    .framework-ref-label {
      font-size: 11px;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .framework-ref-text {
      font-size: 14.5px;
      font-style: italic;
      color: var(--text);
      line-height: 1.55;
    }
    .breakdown-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }
    .breakdown-label { font-weight: 500; }
    .breakdown-bar {
      grid-column: 2;
      grid-row: 2;
      height: 6px;
      background: var(--bg-deep);
      border-radius: 3px;
      overflow: hidden;
      margin-top: 8px;
    }
    .breakdown-bar-fill { height: 100%; border-radius: 3px; transition: width 0.6s var(--ease); }
    .breakdown-count { font-weight: 600; font-variant-numeric: tabular-nums; }
    .breakdown-pct { color: var(--text-muted); font-size: 12px; font-variant-numeric: tabular-nums; min-width: 50px; text-align: right; }

    /* ── Empty / spinner ────────────────────────────────────────────── */
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 0.7; } }
    .spinner {
      width: 22px; height: 22px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    .load-state { display: flex; align-items: center; justify-content: center; padding: 40px; }
    .skeleton {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      height: 80px;
      animation: pulse 1.4s ease-in-out infinite;
    }
    .skeleton-donut {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 32px;
      height: 360px;
      animation: pulse 1.4s ease-in-out infinite;
    }

    .empty {
      background: var(--bg-elevated);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      padding: 48px 32px;
      text-align: center;
      color: var(--text-muted);
    }
    .empty h3 { font-size: 16px; font-weight: 600; margin: 0 0 6px; color: var(--text); }
    .empty p { font-size: 13px; margin: 0; }

    .error {
      background: rgba(248, 113, 113, 0.08);
      border: 1px solid rgba(248, 113, 113, 0.25);
      color: #fab7b7;
      padding: 14px 18px;
      border-radius: var(--radius-sm);
      font-size: 13px;
    }

    /* Fade-in on initial render */
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    .fade-in { animation: fadeIn 0.4s var(--ease) both; }

    /* Scope badge */
    .scope-pill {
      font-size: 10.5px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 4px;
      background: rgba(91, 158, 255, 0.10);
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-left: 10px;
    }
  </style>
</head>
<body>

<nav class="top-bar">
  <div class="top-bar-left">
    <span>Scout</span>
    <span class="sep">·</span>
    <span class="sub">Coaching Dashboard</span>
  </div>
  <div class="top-bar-right">
    <a href="/admin" id="adminLink" style="display:none">Admin</a>
    <span id="signedInEmail"></span>
    <span class="signout" onclick="signOut()">Sign out</span>
  </div>
</nav>

<main class="page" id="page">
  <div id="content"><div class="load-state"><div class="spinner"></div></div></div>
</main>

<script>
  // ──────────────────────────────────────────────────────────────────
  // Session / auth — same pattern used across all Scout dashboards.
  // ──────────────────────────────────────────────────────────────────
  var STORAGE_KEY = 'scout_session_v1';
  function getSession() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null'); } catch (e) { return null; } }
  function setSessionStored(s) { localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); }
  function clearSession() { localStorage.removeItem(STORAGE_KEY); }
  function isSessionValid(s) {
    if (!s || !s.access_token || !s.expires_at) return false;
    return new Date(s.expires_at).getTime() > Date.now() + 30 * 1000;
  }
  async function refreshSessionIfNeeded() {
    var s = getSession();
    if (!s || !s.refresh_token) return false;
    try {
      var res = await fetch('/auth/refresh', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ refresh_token: s.refresh_token }) });
      if (!res.ok) return false;
      var data = await res.json();
      if (!data || !data.session) return false;
      setSessionStored({ access_token: data.session.access_token, refresh_token: data.session.refresh_token, expires_at: data.session.expires_at, email: data.session.user && data.session.user.email });
      return true;
    } catch (e) { return false; }
  }
  function signOut() { clearSession(); window.location.replace('/login'); }
  function authHeader() {
    var s = getSession();
    return s && s.access_token ? { Authorization: 'Bearer ' + s.access_token } : {};
  }

  function escapeHtml(s) {
    if (s === null || s === undefined) return '';
    return String(s).replace(/[&<>"']/g, function(c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]); });
  }

  // ──────────────────────────────────────────────────────────────────
  // State
  // ──────────────────────────────────────────────────────────────────
  var state = {
    me:              null,    // { user_id, email, role }
    users:           [],      // populated for admin/owner
    viewingUserId:   null,    // whose data we're showing
    dateRange:      { from: null, to: null, days: 30 },
    view:           'overview', // 'overview' | 'calls' | 'objections' | 'closes' | 'objection-type'
    analytics:       null,    // last /me/analytics response
    patterns:        null,    // last /me/coaching/patterns response
    calls:           [],      // list from /me/sessions
    objectionsCache: {},      // session_id -> objection rows
    typeEventsCache: {},      // objection_id -> response from /me/objections
    selectedObjectionId: null, // when view === 'objection-type'
    expandedCallId:  null,
    chart1:          null,
    chart2:          null,
    chart3:          null,
    chartDrill:      null,
    chartType:       null,
  };

  // ──────────────────────────────────────────────────────────────────
  // Init
  // ──────────────────────────────────────────────────────────────────
  async function init() {
    var s = getSession();
    if (!isSessionValid(s)) {
      if (s && s.refresh_token) {
        var ok = await refreshSessionIfNeeded();
        if (!ok) { window.location.replace('/login'); return; }
      } else { window.location.replace('/login'); return; }
    }
    var cur = getSession();
    document.getElementById('signedInEmail').textContent = (cur && cur.email) || '';

    state.me = await fetchMe();
    if (!state.me) { window.location.replace('/login'); return; }

    if (state.me.role === 'admin' || state.me.role === 'owner') {
      document.getElementById('adminLink').style.display = '';
      await loadUsers();
    }

    // Default to caller's own data; ?user=<id> pivots to another user.
    var params = new URLSearchParams(window.location.search);
    var target = params.get('user');
    if (target && (state.me.role === 'admin' || state.me.role === 'owner')) {
      state.viewingUserId = target;
    } else {
      state.viewingUserId = state.me.user_id;
    }

    setDateRange(30);
  }

  async function fetchMe() {
    try {
      var res = await fetch('/auth/me', { headers: authHeader() });
      if (!res.ok) return null;
      return await res.json();
    } catch (e) { return null; }
  }

  async function loadUsers() {
    try {
      var res = await fetch('/admin/users', { headers: authHeader() });
      if (!res.ok) return;
      var d = await res.json();
      state.users = (d && d.users) || [];
    } catch (e) { /* silent */ }
  }

  // ──────────────────────────────────────────────────────────────────
  // Data fetch
  // ──────────────────────────────────────────────────────────────────
  function isSelf() { return state.viewingUserId === state.me.user_id; }

  async function fetchAnalytics() {
    var url = isSelf()
      ? '/me/analytics?from=' + encodeURIComponent(state.dateRange.from) + '&to=' + encodeURIComponent(state.dateRange.to)
      : '/admin/analytics/' + encodeURIComponent(state.viewingUserId)
        + '?from=' + encodeURIComponent(state.dateRange.from) + '&to=' + encodeURIComponent(state.dateRange.to);
    var res = await fetch(url, { headers: authHeader() });
    if (res.status === 401) { clearSession(); window.location.replace('/login'); throw new Error('unauth'); }
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  }

  async function fetchPatterns() {
    var url = isSelf()
      ? '/me/coaching/patterns?from=' + encodeURIComponent(state.dateRange.from) + '&to=' + encodeURIComponent(state.dateRange.to)
      : '/admin/coaching/' + encodeURIComponent(state.viewingUserId) + '/patterns'
        + '?from=' + encodeURIComponent(state.dateRange.from) + '&to=' + encodeURIComponent(state.dateRange.to);
    var res = await fetch(url, { headers: authHeader() });
    if (res.status === 401) { clearSession(); window.location.replace('/login'); throw new Error('unauth'); }
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  }

  async function fetchCalls() {
    var url = isSelf()
      ? '/me/sessions?limit=100'
      : '/admin/sessions?limit=100&user_id=' + encodeURIComponent(state.viewingUserId);
    var res = await fetch(url, { headers: authHeader() });
    if (res.status === 401) { clearSession(); window.location.replace('/login'); throw new Error('unauth'); }
    if (!res.ok) throw new Error('HTTP ' + res.status);
    var d = await res.json();
    var all = (d && d.sessions) || [];
    // Client-side date filter.
    return all.filter(function(s) {
      return s.started_at >= state.dateRange.from && s.started_at <= state.dateRange.to;
    });
  }

  async function fetchObjections(sessionId) {
    if (state.objectionsCache[sessionId]) return state.objectionsCache[sessionId];
    var url = isSelf()
      ? '/me/sessions/' + encodeURIComponent(sessionId) + '/objections'
      : '/admin/sessions/' + encodeURIComponent(sessionId) + '/objections';
    var res = await fetch(url, { headers: authHeader() });
    if (!res.ok) return [];
    var d = await res.json();
    var rows = (d && d.objections) || [];
    state.objectionsCache[sessionId] = rows;
    return rows;
  }

  // ──────────────────────────────────────────────────────────────────
  // Date range / user controls
  // ──────────────────────────────────────────────────────────────────
  function setDateRange(days) {
    var to = new Date();
    var from = days >= 9999
      ? new Date('2025-01-01T00:00:00Z')
      : new Date(Date.now() - days * 24 * 60 * 60 * 1000);
    state.dateRange = { from: from.toISOString(), to: to.toISOString(), days: days };
    state.view = 'overview';
    state.expandedCallId = null;
    state.objectionsCache = {};
    reloadAll();
  }

  function setUser(userId) {
    if (!userId || userId === state.viewingUserId) return;
    var url = new URL(window.location.href);
    if (userId === state.me.user_id) url.searchParams.delete('user');
    else url.searchParams.set('user', userId);
    window.history.replaceState({}, '', url.toString());
    state.viewingUserId = userId;
    state.view = 'overview';
    state.expandedCallId = null;
    state.objectionsCache = {};
    reloadAll();
  }

  async function reloadAll() {
    renderOverview(true /* loading */);
    try {
      var [analytics, patterns, calls] = await Promise.all([
        fetchAnalytics(),
        fetchPatterns(),
        fetchCalls(),
      ]);
      state.analytics = analytics;
      state.patterns = patterns;
      state.calls = calls;
      render();
    } catch (err) {
      if (err.message === 'unauth') return;
      document.getElementById('content').innerHTML = '<div class="error">Could not load dashboard data: ' + escapeHtml(err.message || 'unknown') + '</div>';
    }
  }

  // ──────────────────────────────────────────────────────────────────
  // Top-level render — switches on state.view
  // ──────────────────────────────────────────────────────────────────
  function render() {
    if (state.view === 'overview') renderOverview(false);
    else if (state.view === 'calls') renderCallsDrill();
    else if (state.view === 'objections') renderObjectionsDrill();
    else if (state.view === 'closes') renderClosesDrill();
    else if (state.view === 'objection-type') renderObjectionTypeDrill();
  }

  function renderHeaderHtml() {
    var heading;
    var sub;
    if (state.viewingUserId === state.me.user_id) {
      heading = 'Coaching Review';
      sub = 'Your call patterns, objection handling, and coaching feedback.';
    } else {
      var u = state.users.find(function(x) { return x.user_id === state.viewingUserId; });
      heading = (u ? u.email : state.viewingUserId);
      sub = 'Viewing as ' + state.me.role + '.';
    }

    var userPicker = '';
    if (state.me.role === 'admin' || state.me.role === 'owner') {
      var opts = state.users.slice().sort(function(a, b) { return (a.email || '').localeCompare(b.email || ''); }).map(function(u) {
        var sel = u.user_id === state.viewingUserId ? ' selected' : '';
        return '<option value="' + escapeHtml(u.user_id) + '"' + sel + '>' + escapeHtml(u.email || u.user_id) + '</option>';
      }).join('');
      userPicker = '<select class="user-select" onchange="setUser(this.value)">' + opts + '</select>';
    }

    var presets = '';
    [[7, '7d'], [30, '30d'], [90, '90d'], [9999, 'All']].forEach(function(p) {
      var active = state.dateRange.days === p[0] ? ' active' : '';
      presets += '<button class="date-preset' + active + '" onclick="setDateRange(' + p[0] + ')">' + p[1] + '</button>';
    });

    var scopePill = state.viewingUserId !== state.me.user_id ? '<span class="scope-pill">' + escapeHtml(state.me.role || '') + ' view</span>' : '';

    return '<div class="page-header fade-in">'
         + '<div><h1>' + escapeHtml(heading) + scopePill + '</h1>'
         + '<div class="subtitle">' + escapeHtml(sub) + '</div></div>'
         + '<div class="controls">' + userPicker
         + '<div class="date-presets">' + presets + '</div>'
         + '</div></div>';
  }

  // ──────────────────────────────────────────────────────────────────
  // Overview view — three donuts + coach summary + recent calls
  // ──────────────────────────────────────────────────────────────────
  function renderOverview(isLoading) {
    var content = document.getElementById('content');
    if (isLoading || !state.analytics) {
      content.innerHTML = renderHeaderHtml()
        + '<div class="donut-row">'
          + '<div class="skeleton-donut"></div><div class="skeleton-donut"></div><div class="skeleton-donut"></div>'
        + '</div>'
        + '<div class="section"><div class="skeleton" style="height:60px;"></div></div>';
      return;
    }

    var t = state.analytics.totals;
    var obj = state.analytics.objections;

    // Donut 1: Calls — segments by outcome. Center is total calls.
    // Donut 2: Objections — segments by type. Center is total objections.
    // Donut 3: Close Rate — won vs lost/follow_up. Center is %.
    var closeDenom = t.wins + t.losses + t.follow_ups;
    var closeRate = closeDenom > 0 ? Math.round((t.wins / closeDenom) * 100) : null;

    content.innerHTML = renderHeaderHtml()
      + '<div class="donut-row fade-in">'
        + donutCardHtml('chart-calls', 'Calls', t.total_calls, null, 'click to drill in', 'calls')
        + donutCardHtml('chart-objs', 'Objections', obj.totals.total, null, 'click to drill in', 'objections')
        + donutCardHtml('chart-closes', 'Close Rate', closeRate === null ? '—' : (closeRate + '%'), null, 'click to drill in', 'closes')
      + '</div>'
      + '<div class="section fade-in">'
        + '<div class="section-header"><h2>Coach summary</h2>'
        + '<div class="meta">' + ((state.patterns && state.patterns.sample_size != null) ? 'based on ' + state.patterns.sample_size + ' calls' : '') + '</div></div>'
        + renderPatternsHtml(state.patterns)
      + '</div>'
      + '<div class="section fade-in">'
        + '<div class="section-header"><h2>Recent calls</h2>'
        + '<div class="meta">' + state.calls.length + (state.calls.length === 1 ? ' call' : ' calls') + ' in window</div></div>'
        + renderCallsHtml(state.calls)
      + '</div>';

    // Draw the three donuts after the DOM is laid out.
    requestAnimationFrame(function() {
      drawCallsDonut('chart-calls', t);
      drawObjectionsDonut('chart-objs', obj);
      drawClosesDonut('chart-closes', t, closeRate);
    });

    // Re-bind expanded body for any previously-open call.
    if (state.expandedCallId) {
      var card = document.querySelector('[data-session-id="' + state.expandedCallId + '"]');
      if (card) {
        card.classList.add('expanded');
        renderCallBody(state.expandedCallId);
      }
    }
  }

  function donutCardHtml(canvasId, label, centerBig, centerSmall, hint, clickKey) {
    var smallHtml = centerSmall ? '<div class="small">' + escapeHtml(centerSmall) + '</div>' : '';
    return '<div class="donut-card" onclick="setView(\'' + clickKey + '\')">'
         + '<div class="donut-label">' + escapeHtml(label) + '</div>'
         + '<div class="donut-canvas-wrap">'
           + '<canvas id="' + canvasId + '"></canvas>'
           + '<div class="donut-center"><div class="big">' + escapeHtml(String(centerBig)) + '</div>' + smallHtml + '</div>'
         + '</div>'
         + '<div class="donut-hint">' + escapeHtml(hint) + '</div>'
         + '</div>';
  }

  // ──────────────────────────────────────────────────────────────────
  // Chart drawing — Chart.js with custom dark theme + thin ring
  // ──────────────────────────────────────────────────────────────────
  var COLORS = {
    win: '#4ade80', loss: '#f87171', follow_up: '#fbbf24', unmarked: '#64748b', live: '#5b9eff',
    money: '#5b9eff', think: '#fbbf24', spouse: '#c084fc', time: '#fb923c',
    guarantee: '#22d3ee', 'tried-before': '#a78bfa', 'send-info': '#34d399',
    'more-research': '#f472b6', 'not-right-time': '#fb7185', 'proof-it-works': '#94a3b8',
    other: '#64748b',
  };

  function donutBase(canvasId, labels, values, colors) {
    var ctx = document.getElementById(canvasId);
    if (!ctx) return null;
    if (!window.Chart) return null;
    return new Chart(ctx.getContext('2d'), {
      type: 'doughnut',
      data: {
        labels: labels,
        datasets: [{
          data: values,
          backgroundColor: colors,
          borderWidth: 0,
          spacing: 2,
          hoverOffset: 8,
        }],
      },
      options: {
        cutout: '78%',
        responsive: true,
        maintainAspectRatio: true,
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: '#1a1a1a',
            titleColor: '#ededed',
            bodyColor: '#cccccc',
            borderColor: '#2a2a2a',
            borderWidth: 1,
            padding: 10,
            cornerRadius: 8,
            displayColors: true,
            titleFont: { size: 12, weight: 600 },
            bodyFont: { size: 12 },
          },
        },
        animation: { duration: 700, easing: 'easeOutCubic' },
      },
    });
  }

  function drawCallsDonut(canvasId, t) {
    if (state.chart1) state.chart1.destroy();
    var labels = ['Won', 'Lost', 'Follow-up', 'Unmarked'];
    var values = [t.wins, t.losses, t.follow_ups, t.unmarked + t.live];
    var colors = [COLORS.win, COLORS.loss, COLORS.follow_up, COLORS.unmarked];
    // Filter zero-value entries to keep tooltips clean
    var filtered = filterZero(labels, values, colors);
    state.chart1 = donutBase(canvasId, filtered.labels, filtered.values, filtered.colors);
  }

  function drawObjectionsDonut(canvasId, obj) {
    if (state.chart2) state.chart2.destroy();
    var byType = obj.by_type || [];
    var labels = byType.map(function(b) { return b.label; });
    var values = byType.map(function(b) { return b.count; });
    var colors = byType.map(function(b) { return COLORS[b.objection_id] || COLORS.other; });
    if (labels.length === 0) {
      // Render a single gray ring when no data so the visual doesn't collapse.
      labels = ['No objections'];
      values = [1];
      colors = ['#1f1f1f'];
    }
    state.chart2 = donutBase(canvasId, labels, values, colors);
  }

  function drawClosesDonut(canvasId, t, closeRate) {
    if (state.chart3) state.chart3.destroy();
    var labels = ['Won', 'Not won'];
    var notWon = t.losses + t.follow_ups;
    var values = [t.wins, notWon];
    var colors = [COLORS.win, '#1f1f1f'];
    if (t.wins + notWon === 0) {
      labels = ['No completed closes'];
      values = [1];
      colors = ['#1f1f1f'];
    }
    state.chart3 = donutBase(canvasId, labels, values, colors);
  }

  function filterZero(labels, values, colors) {
    var L = [], V = [], C = [];
    for (var i = 0; i < values.length; i++) {
      if (values[i] > 0) { L.push(labels[i]); V.push(values[i]); C.push(colors[i]); }
    }
    if (V.length === 0) { L = ['Empty']; V = [1]; C = ['#1f1f1f']; }
    return { labels: L, values: V, colors: C };
  }

  // ──────────────────────────────────────────────────────────────────
  // Patterns rendering
  // ──────────────────────────────────────────────────────────────────
  function renderPatternsHtml(p) {
    if (!p) return '<div class="load-state"><div class="spinner"></div></div>';
    var patterns = (p.patterns || []);
    var banner = '';
    if (p.sample_size != null && p.sample_size < 20) {
      banner = '<div class="signal-banner"><div class="signal-banner-icon"></div>'
             + '<div><strong>Early signal.</strong> Only ' + p.sample_size + ' calls in this window — patterns will sharpen with more data.</div></div>';
    }
    if (patterns.length === 0) {
      return banner + '<div class="empty"><h3>No clear patterns yet</h3><p>Not enough data to surface coaching patterns in this date range.</p></div>';
    }
    var rows = patterns.map(function(it) {
      var conf = (it.confidence || 'low').toLowerCase();
      return '<div class="pattern-card">'
        + '<div class="pattern-headline">' + escapeHtml(it.headline || '') + '</div>'
        + '<div class="pattern-detail">' + escapeHtml(it.detail || '') + '</div>'
        + '<div class="pattern-meta"><span class="pattern-confidence ' + conf + '">' + escapeHtml(conf) + ' confidence</span></div>'
        + '</div>';
    }).join('');
    return banner + '<div class="patterns-list">' + rows + '</div>';
  }

  // ──────────────────────────────────────────────────────────────────
  // Calls list rendering (with inline drill on expand)
  // ──────────────────────────────────────────────────────────────────
  function renderCallsHtml(calls) {
    if (calls.length === 0) {
      return '<div class="empty"><h3>No calls in this window</h3><p>Pick a wider date range above, or wait for new calls to come in.</p></div>';
    }
    return '<div class="calls-list">' + calls.map(callCardHtml).join('') + '</div>';
  }

  function callCardHtml(s) {
    var titleProspect = s.prospect_name
      ? '<span class="name">' + escapeHtml(s.prospect_name) + '</span>'
      : '<span class="anon">unknown prospect</span>';
    var dur = formatDuration(s.duration_seconds);
    var meta = [formatDate(s.started_at), dur];
    if (s.outcome_source === 'inferred') meta.push('outcome inferred');

    return '<div class="call-card" data-session-id="' + escapeHtml(s.session_id) + '">'
      + '<div class="call-head" onclick="toggleCall(\'' + s.session_id + '\')">'
        + '<div class="call-head-left">'
          + '<div class="call-head-title">Call with ' + titleProspect + '</div>'
          + '<div class="call-head-meta">' + meta.map(escapeHtml).join(' · ') + '</div>'
        + '</div>'
        + '<div class="call-head-right">' + outcomeBadge(s.outcome, !!s.ended_at) + '<span class="expand-icon">▾</span></div>'
      + '</div>'
      + '<div class="call-body" id="body-' + escapeHtml(s.session_id) + '"></div>'
    + '</div>';
  }

  function outcomeBadge(outcome, ended) {
    if (outcome === 'win') return '<span class="badge badge-win">Won</span>';
    if (outcome === 'loss') return '<span class="badge badge-loss">Lost</span>';
    if (outcome === 'follow_up') return '<span class="badge badge-fu">Follow-up</span>';
    if (!ended) return '<span class="badge badge-live">Live</span>';
    return '<span class="badge badge-empty">Unmarked</span>';
  }

  async function toggleCall(sessionId) {
    var card = document.querySelector('[data-session-id="' + sessionId + '"]');
    if (!card) return;
    if (state.expandedCallId === sessionId) {
      card.classList.remove('expanded');
      state.expandedCallId = null;
      return;
    }
    if (state.expandedCallId) {
      var prev = document.querySelector('[data-session-id="' + state.expandedCallId + '"]');
      if (prev) prev.classList.remove('expanded');
    }
    state.expandedCallId = sessionId;
    card.classList.add('expanded');
    renderCallBody(sessionId);
  }

  async function renderCallBody(sessionId) {
    var body = document.getElementById('body-' + sessionId);
    if (!body) return;
    body.innerHTML = '<div class="load-state"><div class="spinner"></div></div>';

    var objections = await fetchObjections(sessionId);

    if (objections.length === 0) {
      body.innerHTML = '<div class="empty"><h3>No objections detected</h3><p>This call had no detected framework objections.</p></div>';
      return;
    }
    body.innerHTML = objections.map(objEventHtml).join('');
  }

  function objEventHtml(o) {
    var verdict;
    if (o.overcome === true)       verdict = '<span class="verdict verdict-overcome">Overcame</span>';
    else if (o.overcome === false) verdict = '<span class="verdict verdict-not">Not overcome</span>';
    else                            verdict = '<span class="verdict verdict-unknown">Indeterminate</span>';
    var conf = o.overcome_confidence ? '<span class="verdict-conf">' + escapeHtml(o.overcome_confidence) + ' confidence</span>' : '';
    var time = o.detected_at ? new Date(o.detected_at).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) : '';

    var coaching = o.coaching_note
      ? '<div class="coaching-note">' + escapeHtml(o.coaching_note) + '</div>'
      : '<div class="coaching-note-empty">No coaching narrative generated for this event.</div>';

    var rebuttal = o.framework_rebuttal
      ? '<div class="compare-text">' + escapeHtml(o.framework_rebuttal) + '</div>'
      : '<div class="compare-text empty">No framework rebuttal recorded.</div>';
    var said = o.closer_response
      ? '<div class="compare-text">' + escapeHtml(o.closer_response) + '</div>'
      : '<div class="compare-text empty">No closer transcript captured in the 60s after this objection.</div>';

    return '<div class="obj-event">'
      + '<div class="obj-event-head">'
        + '<div><span class="obj-event-title">' + escapeHtml(o.objection_label || '') + '</span>'
          + (time ? '<span class="obj-event-time">at ' + escapeHtml(time) + '</span>' : '') + '</div>'
        + '<div>' + verdict + conf + '</div>'
      + '</div>'
      + coaching
      + '<div class="compare-grid">'
        + '<div class="compare-pane framework"><div class="compare-label">Scout suggested</div>' + rebuttal + '</div>'
        + '<div class="compare-pane actual"><div class="compare-label">What you said</div>' + said + '</div>'
      + '</div>'
      + (o.notes ? '<div class="obj-notes-row">Classifier note: ' + escapeHtml(o.notes) + '</div>' : '')
    + '</div>';
  }

  // ──────────────────────────────────────────────────────────────────
  // Drill views
  // ──────────────────────────────────────────────────────────────────
  function setView(view) {
    state.view = view;
    state.expandedCallId = null;
    state.selectedObjectionId = null;
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function setObjectionType(objectionId) {
    state.view = 'objection-type';
    state.selectedObjectionId = objectionId;
    state.expandedCallId = null;
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function backToOverview() { state.view = 'overview'; state.expandedCallId = null; state.selectedObjectionId = null; render(); }
  function backToObjections() { state.view = 'objections'; state.expandedCallId = null; state.selectedObjectionId = null; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }

  function drillHeader(title, count) {
    var countHtml = count != null ? '<span class="count">' + escapeHtml(String(count)) + '</span>' : '';
    return '<div class="drill-header fade-in">'
         + '<button class="back-btn" onclick="backToOverview()">← Back</button>'
         + '<div class="drill-title">' + escapeHtml(title) + countHtml + '</div>'
         + '</div>';
  }

  // Drill 1: Calls — outcome breakdown + per-outcome bars + recent calls list filtered.
  function renderCallsDrill() {
    var t = state.analytics.totals;
    var content = document.getElementById('content');

    var rows = [
      { key: 'win',       label: 'Won',       count: t.wins,        color: COLORS.win },
      { key: 'loss',      label: 'Lost',      count: t.losses,      color: COLORS.loss },
      { key: 'follow_up', label: 'Follow-up', count: t.follow_ups,  color: COLORS.follow_up },
      { key: 'unmarked',  label: 'Unmarked',  count: t.unmarked,    color: COLORS.unmarked },
      { key: 'live',      label: 'Live',      count: t.live,        color: COLORS.live },
    ].filter(function(r) { return r.count > 0; });
    var total = rows.reduce(function(s, r) { return s + r.count; }, 0);

    content.innerHTML = drillHeader('Calls', t.total_calls)
      + '<div class="drill-grid fade-in">'
        + '<div class="drill-donut"><div class="donut-canvas-wrap"><canvas id="drill-chart"></canvas>'
          + '<div class="donut-center"><div class="big">' + t.total_calls + '</div><div class="small">total</div></div></div></div>'
        + '<div class="drill-breakdown">' + rows.map(function(r) {
          var pct = total > 0 ? Math.round((r.count / total) * 100) : 0;
          return '<div class="breakdown-row">'
            + '<div class="breakdown-dot" style="background:' + r.color + ';"></div>'
            + '<div class="breakdown-label">' + escapeHtml(r.label) + '</div>'
            + '<div class="breakdown-count">' + r.count + '</div>'
            + '<div class="breakdown-pct">' + pct + '%</div>'
            + '</div>';
        }).join('') + '</div>'
      + '</div>'
      + '<div class="section fade-in"><div class="section-header"><h2>All calls in window</h2>'
        + '<div class="meta">' + state.calls.length + ' calls</div></div>'
        + renderCallsHtml(state.calls)
      + '</div>';

    requestAnimationFrame(function() {
      if (state.chartDrill) state.chartDrill.destroy();
      state.chartDrill = donutBase('drill-chart', rows.map(function(r) { return r.label; }),
        rows.map(function(r) { return r.count; }), rows.map(function(r) { return r.color; }));
    });
  }

  // Drill 2: Objections — by-type breakdown. Each row is clickable, drilling
  // into renderObjectionTypeDrill() for per-event coaching.
  function renderObjectionsDrill() {
    var obj = state.analytics.objections;
    var content = document.getElementById('content');
    var byType = (obj.by_type || []).slice().sort(function(a, b) { return b.count - a.count; });
    var totalCount = obj.totals.total;

    var donutColors = byType.map(function(b) { return COLORS[b.objection_id] || COLORS.other; });

    var breakdown = byType.map(function(b) {
      var pctOver = b.overcome_pct === null ? '—' : b.overcome_pct + '%';
      var fillWidth = b.overcome + b.not_overcome > 0 ? Math.round(100 * b.overcome / (b.overcome + b.not_overcome)) : 0;
      var color = COLORS[b.objection_id] || COLORS.other;
      return '<div class="breakdown-row clickable" onclick="setObjectionType(\'' + escapeHtml(b.objection_id) + '\')">'
        + '<div class="breakdown-dot" style="background:' + color + ';"></div>'
        + '<div>'
          + '<div class="breakdown-label">' + escapeHtml(b.label) + '</div>'
          + '<div class="breakdown-bar" style="margin-top:6px;"><div class="breakdown-bar-fill" style="width:' + fillWidth + '%;background:' + color + ';"></div></div>'
        + '</div>'
        + '<div class="breakdown-count">' + b.count + '</div>'
        + '<div class="breakdown-pct">' + escapeHtml(pctOver) + ' overcame</div>'
        + '</div>';
    }).join('');

    content.innerHTML = drillHeader('Objections', totalCount)
      + '<div class="drill-grid fade-in">'
        + '<div class="drill-donut"><div class="donut-canvas-wrap"><canvas id="drill-chart"></canvas>'
          + '<div class="donut-center"><div class="big">' + totalCount + '</div><div class="small">events</div></div></div></div>'
        + '<div class="drill-breakdown">'
          + (breakdown
              ? '<div style="font-size:12px;color:var(--text-muted);margin-bottom:4px;padding:0 4px;">Click a type to see every event with coaching feedback.</div>' + breakdown
              : '<div class="empty"><h3>No objections detected</h3></div>')
        + '</div>'
      + '</div>';

    requestAnimationFrame(function() {
      if (state.chartDrill) state.chartDrill.destroy();
      if (byType.length === 0) {
        state.chartDrill = donutBase('drill-chart', ['Empty'], [1], ['#1f1f1f']);
      } else {
        state.chartDrill = donutBase('drill-chart', byType.map(function(b) { return b.label; }),
          byType.map(function(b) { return b.count; }), donutColors);
      }
    });
  }

  // Drill 2.5: Per-type objection drill. The third-level view: every event
  // of one objection_id, with stats up top + the framework rebuttal pinned
  // for reference + a card per event showing coaching narrative + side-by-side.
  async function renderObjectionTypeDrill() {
    var content = document.getElementById('content');
    var objectionId = state.selectedObjectionId;
    if (!objectionId) { backToOverview(); return; }

    // Loading placeholder
    content.innerHTML = '<div class="drill-header fade-in">'
      + '<button class="back-btn" onclick="backToObjections()">← Back to Objections</button>'
      + '<div class="drill-title">Loading…</div></div>'
      + '<div class="load-state"><div class="spinner"></div></div>';

    var data;
    var cached = state.typeEventsCache[objectionId];
    if (cached) {
      data = cached;
    } else {
      try {
        data = await fetchObjectionsByType(objectionId);
        state.typeEventsCache[objectionId] = data;
      } catch (err) {
        content.innerHTML = '<div class="drill-header"><button class="back-btn" onclick="backToObjections()">← Back</button></div>'
          + '<div class="error">Could not load events: ' + escapeHtml(err.message || 'unknown') + '</div>';
        return;
      }
    }

    var label = data.label || objectionId;
    var t = data.totals;
    var color = COLORS[objectionId] || COLORS.other;
    var pctOver = t.overcome_pct === null ? '—' : t.overcome_pct + '%';
    var pctClass = t.overcome_pct === null ? '' : (t.overcome_pct >= 70 ? 'good' : t.overcome_pct >= 40 ? 'mid' : 'bad');

    // Framework rebuttal — pull from the first event (all share the same rebuttal text)
    var firstWithRebuttal = (data.events || []).find(function(e) { return e.framework_rebuttal; });
    var frameworkRebuttal = firstWithRebuttal ? firstWithRebuttal.framework_rebuttal : null;

    var stats = ''
      + '<div class="type-stat"><div class="stat-label">Total Events</div><div class="stat-value">' + t.total + '</div></div>'
      + '<div class="type-stat"><div class="stat-label">Overcame</div><div class="stat-value good">' + t.overcome + '</div></div>'
      + '<div class="type-stat"><div class="stat-label">Not Overcome</div><div class="stat-value bad">' + t.not_overcome + '</div></div>'
      + '<div class="type-stat"><div class="stat-label">Indeterminate</div><div class="stat-value">' + t.unknown + '</div><div class="stat-sub">transcript unclear</div></div>'
      + '<div class="type-stat"><div class="stat-label">Overcome Rate</div><div class="stat-value ' + pctClass + '">' + escapeHtml(pctOver) + '</div><div class="stat-sub">of definitive</div></div>';

    var frameworkBlock = frameworkRebuttal
      ? '<div class="framework-ref">'
        + '<div class="framework-ref-label">Scout\'s framework rebuttal — use this every time</div>'
        + '<div class="framework-ref-text">"' + escapeHtml(frameworkRebuttal) + '"</div>'
        + '</div>'
      : '';

    var eventsHtml;
    if ((data.events || []).length === 0) {
      eventsHtml = '<div class="empty"><h3>No events in this window</h3><p>No instances of this objection were detected in the selected date range.</p></div>';
    } else {
      eventsHtml = data.events.map(eventCardHtml).join('');
    }

    content.innerHTML = '<div class="drill-header fade-in">'
        + '<button class="back-btn" onclick="backToObjections()">← Back to Objections</button>'
        + '<div class="drill-title">' + escapeHtml(label) + ' <span class="count">' + t.total + '</span></div>'
      + '</div>'
      + '<div class="type-stats-row fade-in">' + stats + '</div>'
      + frameworkBlock
      + '<div class="section fade-in">'
        + '<div class="section-header"><h2>Every event</h2>'
        + '<div class="meta">' + t.total + (t.total === 1 ? ' instance' : ' instances') + ' in window</div></div>'
        + eventsHtml
      + '</div>';
  }

  async function fetchObjectionsByType(objectionId) {
    var url = isSelf()
      ? '/me/objections?objection_id=' + encodeURIComponent(objectionId)
        + '&from=' + encodeURIComponent(state.dateRange.from) + '&to=' + encodeURIComponent(state.dateRange.to)
      : '/admin/objections/' + encodeURIComponent(state.viewingUserId)
        + '?objection_id=' + encodeURIComponent(objectionId)
        + '&from=' + encodeURIComponent(state.dateRange.from) + '&to=' + encodeURIComponent(state.dateRange.to);
    var res = await fetch(url, { headers: authHeader() });
    if (res.status === 401) { clearSession(); window.location.replace('/login'); throw new Error('unauth'); }
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  }

  // Per-event card for the type drill — call context up top, coaching note,
  // side-by-side framework vs actual, classifier note at bottom.
  function eventCardHtml(e) {
    var prospect = e.prospect_name
      ? '<span class="name">' + escapeHtml(e.prospect_name) + '</span>'
      : '<span class="anon">unknown prospect</span>';
    var dateStr = e.session_started_at ? formatDate(e.session_started_at) : '—';
    var timeStr = e.detected_at ? new Date(e.detected_at).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) : '';
    var sessionOutcome = e.session_outcome
      ? outcomeBadge(e.session_outcome, !!e.session_ended_at)
      : (e.session_ended_at ? '<span class="badge badge-empty">Unmarked</span>' : '<span class="badge badge-live">Live</span>');

    var verdict;
    if (e.overcome === true)       verdict = '<span class="verdict verdict-overcome">Overcame</span>';
    else if (e.overcome === false) verdict = '<span class="verdict verdict-not">Not overcome</span>';
    else                            verdict = '<span class="verdict verdict-unknown">Indeterminate</span>';
    var conf = e.overcome_confidence ? '<span class="verdict-conf">' + escapeHtml(e.overcome_confidence) + ' confidence</span>' : '';

    var coaching = e.coaching_note
      ? '<div class="coaching-note">' + escapeHtml(e.coaching_note) + '</div>'
      : '<div class="coaching-note-empty">No coaching narrative generated for this event.</div>';

    var rebuttal = e.framework_rebuttal
      ? '<div class="compare-text">' + escapeHtml(e.framework_rebuttal) + '</div>'
      : '<div class="compare-text empty">No framework rebuttal recorded.</div>';
    var said = e.closer_response
      ? '<div class="compare-text">' + escapeHtml(e.closer_response) + '</div>'
      : '<div class="compare-text empty">No closer transcript captured in the 60s after this objection.</div>';

    return '<div class="event-card">'
      + '<div class="event-card-head">'
        + '<div>'
          + '<div class="event-card-title">Call with ' + prospect + '</div>'
          + '<div class="event-card-meta">' + escapeHtml(dateStr) + (timeStr ? ' · objection at ' + escapeHtml(timeStr) : '') + '</div>'
        + '</div>'
        + '<div class="event-card-right">' + verdict + conf + sessionOutcome + '</div>'
      + '</div>'
      + coaching
      + '<div class="compare-grid">'
        + '<div class="compare-pane framework"><div class="compare-label">Scout suggested</div>' + rebuttal + '</div>'
        + '<div class="compare-pane actual"><div class="compare-label">What you said</div>' + said + '</div>'
      + '</div>'
      + (e.notes ? '<div class="obj-notes-row">Classifier note: ' + escapeHtml(e.notes) + '</div>' : '')
    + '</div>';
  }

  // Drill 3: Close rate — won vs not-won + framework deep-dive.
  function renderClosesDrill() {
    var t = state.analytics.totals;
    var content = document.getElementById('content');
    var won = t.wins;
    var notWon = t.losses + t.follow_ups;
    var unmarked = t.unmarked + t.live;
    var closeDenom = won + notWon;
    var closeRate = closeDenom > 0 ? Math.round((won / closeDenom) * 100) : null;

    var rows = [
      { label: 'Won',       count: won,      color: COLORS.win,       pct: closeDenom > 0 ? Math.round(100 * won / closeDenom) + '%' : '—' },
      { label: 'Lost',      count: t.losses, color: COLORS.loss,      pct: closeDenom > 0 ? Math.round(100 * t.losses / closeDenom) + '%' : '—' },
      { label: 'Follow-up', count: t.follow_ups, color: COLORS.follow_up, pct: closeDenom > 0 ? Math.round(100 * t.follow_ups / closeDenom) + '%' : '—' },
      { label: 'Unmarked',  count: unmarked, color: COLORS.unmarked, pct: '—' },
    ].filter(function(r) { return r.count > 0; });

    content.innerHTML = drillHeader('Close Rate', closeRate === null ? '—' : (closeRate + '%'))
      + '<div class="drill-grid fade-in">'
        + '<div class="drill-donut"><div class="donut-canvas-wrap"><canvas id="drill-chart"></canvas>'
          + '<div class="donut-center"><div class="big">' + (closeRate === null ? '—' : closeRate + '%') + '</div><div class="small">closed</div></div></div></div>'
        + '<div class="drill-breakdown">' + rows.map(function(r) {
          return '<div class="breakdown-row">'
            + '<div class="breakdown-dot" style="background:' + r.color + ';"></div>'
            + '<div class="breakdown-label">' + escapeHtml(r.label) + '</div>'
            + '<div class="breakdown-count">' + r.count + '</div>'
            + '<div class="breakdown-pct">' + escapeHtml(r.pct) + '</div>'
            + '</div>';
        }).join('') + '</div>'
      + '</div>'
      + '<div class="section fade-in"><div class="section-header"><h2>Calls with confirmed outcomes</h2>'
        + '<div class="meta">won, lost, or follow-up</div></div>'
        + renderCallsHtml(state.calls.filter(function(s) { return s.outcome === 'win' || s.outcome === 'loss' || s.outcome === 'follow_up'; }))
      + '</div>';

    requestAnimationFrame(function() {
      if (state.chartDrill) state.chartDrill.destroy();
      var labels = [];
      var values = [];
      var colors = [];
      if (won > 0) { labels.push('Won'); values.push(won); colors.push(COLORS.win); }
      if (notWon > 0) { labels.push('Not won'); values.push(notWon); colors.push('#1f1f1f'); }
      if (labels.length === 0) { labels = ['No closes yet']; values = [1]; colors = ['#1f1f1f']; }
      state.chartDrill = donutBase('drill-chart', labels, values, colors);
    });
  }

  // ──────────────────────────────────────────────────────────────────
  // Helpers
  // ──────────────────────────────────────────────────────────────────
  function formatDate(iso) {
    if (!iso) return '—';
    var d = new Date(iso);
    var month = d.toLocaleDateString('en-US', { month: 'short' });
    var day = d.getDate();
    var year = d.getFullYear();
    var today = new Date().getFullYear();
    return year === today ? month + ' ' + day : month + ' ' + day + ', ' + year;
  }

  function formatDuration(seconds) {
    if (!seconds && seconds !== 0) return '—';
    if (seconds < 60) return seconds + 's';
    var m = Math.floor(seconds / 60);
    var s = seconds % 60;
    return m + 'm' + (s > 0 ? ' ' + s + 's' : '');
  }

  init();
</script>

</body>
</html>
