    if (state.chart3) state.chart3.destroy();
    var labels = ['Won', 'Not won'];
    var notWon = t.losses + t.follow_ups;
    var values = [t.wins, notWon];
    var colors = [COLORS.win, '#1f1f1f'];
    if (t.wins + notWon === 0) {
      labels = ['No completed closes'];
      values = [1];
      colors = ['#1f1f1f'];
    }
    state.chart3 = donutBase(canvasId, labels, values, colors);
  }

  function filterZero(labels, values, colors) {
    var L = [], V = [], C = [];
    for (var i = 0; i < values.length; i++) {
      if (values[i] > 0) { L.push(labels[i]); V.push(values[i]); C.push(colors[i]); }
    }
    if (V.length === 0) { L = ['Empty']; V = [1]; C = ['#1f1f1f']; }
    return { labels: L, values: V, colors: C };
  }

  // ──────────────────────────────────────────────────────────────────
  // Patterns rendering
  // ──────────────────────────────────────────────────────────────────
  function renderPatternsHtml(p) {
    if (!p) return '<div class="load-state"><div class="spinner"></div></div>';
    var patterns = (p.patterns || []);
    var banner = '';
    if (p.sample_size != null && p.sample_size < 20) {
      banner = '<div class="signal-banner"><div class="signal-banner-icon"></div>'
             + '<div><strong>Early signal.</strong> Only ' + p.sample_size + ' calls in this window — patterns will sharpen with more data.</div></div>';
    }
    if (patterns.length === 0) {
      return banner + '<div class="empty"><h3>No clear patterns yet</h3><p>Not enough data to surface coaching patterns in this date range.</p></div>';
    }
    var rows = patterns.map(function(it) {
      var conf = (it.confidence || 'low').toLowerCase();
      return '<div class="pattern-card">'
        + '<div class="pattern-headline">' + escapeHtml(it.headline || '') + '</div>'
        + '<div class="pattern-detail">' + escapeHtml(it.detail || '') + '</div>'
        + '<div class="pattern-meta"><span class="pattern-confidence ' + conf + '">' + escapeHtml(conf) + ' confidence</span></div>'
        + '</div>';
    }).join('');
    return banner + '<div class="patterns-list">' + rows + '</div>';
  }

  // ──────────────────────────────────────────────────────────────────
  // Calls list rendering (with inline drill on expand)
  // ──────────────────────────────────────────────────────────────────
  function renderCallsHtml(calls) {
    if (calls.length === 0) {
      return '<div class="empty"><h3>No calls in this window</h3><p>Pick a wider date range above, or wait for new calls to come in.</p></div>';
    }
    return '<div class="calls-list">' + calls.map(callCardHtml).join('') + '</div>';
  }

  function callCardHtml(s) {
    var titleProspect = s.prospect_name
      ? '<span class="name">' + escapeHtml(s.prospect_name) + '</span>'
      : '<span class="anon">unknown prospect</span>';
    var dur = formatDuration(s.duration_seconds);
    var meta = [formatDate(s.started_at), dur];
    if (s.outcome_source === 'inferred') meta.push('outcome inferred');

    return '<div class="call-card" data-session-id="' + escapeHtml(s.session_id) + '">'
      + '<div class="call-head" onclick="toggleCall(\'' + s.session_id + '\')">'
        + '<div class="call-head-left">'
          + '<div class="call-head-title">Call with ' + titleProspect + '</div>'
          + '<div class="call-head-meta">' + meta.map(escapeHtml).join(' · ') + '</div>'
        + '</div>'
        + '<div class="call-head-right">' + outcomeBadge(s.outcome, !!s.ended_at) + '<span class="expand-icon">▾</span></div>'
      + '</div>'
      + '<div class="call-body" id="body-' + escapeHtml(s.session_id) + '"></div>'
    + '</div>';
  }

  function outcomeBadge(outcome, ended) {
    if (outcome === 'win') return '<span class="badge badge-win">Won</span>';
    if (outcome === 'loss') return '<span class="badge badge-loss">Lost</span>';
    if (outcome === 'follow_up') return '<span class="badge badge-fu">Follow-up</span>';
    if (!ended) return '<span class="badge badge-live">Live</span>';
    return '<span class="badge badge-empty">Unmarked</span>';
  }

  async function toggleCall(sessionId) {
    var card = document.querySelector('[data-session-id="' + sessionId + '"]');
    if (!card) return;
    if (state.expandedCallId === sessionId) {
      card.classList.remove('expanded');
      state.expandedCallId = null;
      return;
    }
    if (state.expandedCallId) {
      var prev = document.querySelector('[data-session-id="' + state.expandedCallId + '"]');
      if (prev) prev.classList.remove('expanded');
    }
    state.expandedCallId = sessionId;
    card.classList.add('expanded');
    renderCallBody(sessionId);
  }

  async function renderCallBody(sessionId) {
    var body = document.getElementById('body-' + sessionId);
    if (!body) return;
    body.innerHTML = '<div class="load-state"><div class="spinner"></div></div>';

    var objections = await fetchObjections(sessionId);

    if (objections.length === 0) {
      body.innerHTML = '<div class="empty"><h3>No objections detected</h3><p>This call had no detected framework objections.</p></div>';
      return;
    }
    body.innerHTML = objections.map(objEventHtml).join('');
  }

  function objEventHtml(o) {
    var verdict;
    if (o.overcome === true)       verdict = '<span class="verdict verdict-overcome">Overcame</span>';
    else if (o.overcome === false) verdict = '<span class="verdict verdict-not">Not overcome</span>';
    else                            verdict = '<span class="verdict verdict-unknown">Indeterminate</span>';
    var conf = o.overcome_confidence ? '<span class="verdict-conf">' + escapeHtml(o.overcome_confidence) + ' confidence</span>' : '';
    var time = o.detected_at ? new Date(o.detected_at).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) : '';

    var coaching = o.coaching_note
      ? '<div class="coaching-note">' + escapeHtml(o.coaching_note) + '</div>'
      : '<div class="coaching-note-empty">No coaching narrative generated for this event.</div>';

    var rebuttal = o.framework_rebuttal
      ? '<div class="compare-text">' + escapeHtml(o.framework_rebuttal) + '</div>'
      : '<div class="compare-text empty">No framework rebuttal recorded.</div>';
    var said = o.closer_response
      ? '<div class="compare-text">' + escapeHtml(o.closer_response) + '</div>'
      : '<div class="compare-text empty">No closer transcript captured in the 60s after this objection.</div>';

    return '<div class="obj-event">'
      + '<div class="obj-event-head">'
        + '<div><span class="obj-event-title">' + escapeHtml(o.objection_label || '') + '</span>'
          + (time ? '<span class="obj-event-time">at ' + escapeHtml(time) + '</span>' : '') + '</div>'
        + '<div>' + verdict + conf + '</div>'
      + '</div>'
      + coaching
      + '<div class="compare-grid">'
        + '<div class="compare-pane framework"><div class="compare-label">Scout suggested</div>' + rebuttal + '</div>'
        + '<div class="compare-pane actual"><div class="compare-label">What you said</div>' + said + '</div>'
      + '</div>'
      + (o.notes ? '<div class="obj-notes-row">Classifier note: ' + escapeHtml(o.notes) + '</div>' : '')
    + '</div>';
  }

  // ──────────────────────────────────────────────────────────────────
  // Drill views
  // ──────────────────────────────────────────────────────────────────
  function setView(view) {
    state.view = view;
    state.expandedCallId = null;
    state.selectedObjectionId = null;
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function setObjectionType(objectionId) {
    state.view = 'objection-type';
    state.selectedObjectionId = objectionId;
    state.expandedCallId = null;
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function backToOverview() { state.view = 'overview'; state.expandedCallId = null; state.selectedObjectionId = null; render(); }
  function backToObjections() { state.view = 'objections'; state.expandedCallId = null; state.selectedObjectionId = null; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }

  function drillHeader(title, count) {
    var countHtml = count != null ? '<span class="count">' + escapeHtml(String(count)) + '</span>' : '';
    return '<div class="drill-header fade-in">'
         + '<button class="back-btn" onclick="backToOverview()">← Back</button>'
         + '<div class="drill-title">' + escapeHtml(title) + countHtml + '</div>'
         + '</div>';
  }

  // Drill 1: Calls — outcome breakdown + per-outcome bars + recent calls list filtered.
  function renderCallsDrill() {
    var t = state.analytics.totals;
    var content = document.getElementById('content');

    var rows = [
      { key: 'win',       label: 'Won',       count: t.wins,        color: COLORS.win },
      { key: 'loss',      label: 'Lost',      count: t.losses,      color: COLORS.loss },
      { key: 'follow_up', label: 'Follow-up', count: t.follow_ups,  color: COLORS.follow_up },
      { key: 'unmarked',  label: 'Unmarked',  count: t.unmarked,    color: COLORS.unmarked },
      { key: 'live',      label: 'Live',      count: t.live,        color: COLORS.live },
    ].filter(function(r) { return r.count > 0; });
    var total = rows.reduce(function(s, r) { return s + r.count; }, 0);

    content.innerHTML = drillHeader('Calls', t.total_calls)
      + '<div class="drill-grid fade-in">'
        + '<div class="drill-donut"><div class="donut-canvas-wrap"><canvas id="drill-chart"></canvas>'
          + '<div class="donut-center"><div class="big">' + t.total_calls + '</div><div class="small">total</div></div></div></div>'
        + '<div class="drill-breakdown">' + rows.map(function(r) {
          var pct = total > 0 ? Math.round((r.count / total) * 100) : 0;
          return '<div class="breakdown-row">'
            + '<div class="breakdown-dot" style="background:' + r.color + ';"></div>'
            + '<div class="breakdown-label">' + escapeHtml(r.label) + '</div>'
            + '<div class="breakdown-count">' + r.count + '</div>'
            + '<div class="breakdown-pct">' + pct + '%</div>'
            + '</div>';
        }).join('') + '</div>'
      + '</div>'
      + '<div class="section fade-in"><div class="section-header"><h2>All calls in window</h2>'
        + '<div class="meta">' + state.calls.length + ' calls</div></div>'
        + renderCallsHtml(state.calls)
      + '</div>';

    requestAnimationFrame(function() {
      if (state.chartDrill) state.chartDrill.destroy();
      state.chartDrill = donutBase('drill-chart', rows.map(function(r) { return r.label; }),
        rows.map(function(r) { return r.count; }), rows.map(function(r) { return r.color; }));
    });
  }

  // Drill 2: Objections — by-type breakdown. Each row is clickable, drilling
  // into renderObjectionTypeDrill() for per-event coaching.
  function renderObjectionsDrill() {
    var obj = state.analytics.objections;
    var content = document.getElementById('content');
    var byType = (obj.by_type || []).slice().sort(function(a, b) { return b.count - a.count; });
    var totalCount = obj.totals.total;

    var donutColors = byType.map(function(b) { return COLORS[b.objection_id] || COLORS.other; });

    var breakdown = byType.map(function(b) {
      var pctOver = b.overcome_pct === null ? '—' : b.overcome_pct + '%';
      var fillWidth = b.overcome + b.not_overcome > 0 ? Math.round(100 * b.overcome / (b.overcome + b.not_overcome)) : 0;
      var color = COLORS[b.objection_id] || COLORS.other;
      return '<div class="breakdown-row clickable" onclick="setObjectionType(\'' + escapeHtml(b.objection_id) + '\')">'
        + '<div class="breakdown-dot" style="background:' + color + ';"></div>'
        + '<div>'
          + '<div class="breakdown-label">' + escapeHtml(b.label) + '</div>'
          + '<div class="breakdown-bar" style="margin-top:6px;"><div class="breakdown-bar-fill" style="width:' + fillWidth + '%;background:' + color + ';"></div></div>'
        + '</div>'
        + '<div class="breakdown-count">' + b.count + '</div>'
        + '<div class="breakdown-pct">' + escapeHtml(pctOver) + ' overcame</div>'
        + '</div>';
    }).join('');

    content.innerHTML = drillHeader('Objections', totalCount)
      + '<div class="drill-grid fade-in">'
        + '<div class="drill-donut"><div class="donut-canvas-wrap"><canvas id="drill-chart"></canvas>'
          + '<div class="donut-center"><div class="big">' + totalCount + '</div><div class="small">events</div></div></div></div>'
        + '<div class="drill-breakdown">'
          + (breakdown
              ? '<div style="font-size:12px;color:var(--text-muted);margin-bottom:4px;padding:0 4px;">Click a type to see every event with coaching feedback.</div>' + breakdown
              : '<div class="empty"><h3>No objections detected</h3></div>')
        + '</div>'
      + '</div>';

    requestAnimationFrame(function() {
      if (state.chartDrill) state.chartDrill.destroy();
      if (byType.length === 0) {
        state.chartDrill = donutBase('drill-chart', ['Empty'], [1], ['#1f1f1f']);
      } else {
        state.chartDrill = donutBase('drill-chart', byType.map(function(b) { return b.label; }),
          byType.map(function(b) { return b.count; }), donutColors);
      }
    });
  }

  // Drill 2.5: Per-type objection drill. The third-level view: every event
  // of one objection_id, with stats up top + the framework rebuttal pinned
  // for reference + a card per event showing coaching narrative + side-by-side.
  async function renderObjectionTypeDrill() {
    var content = document.getElementById('content');
    var objectionId = state.selectedObjectionId;
    if (!objectionId) { backToOverview(); return; }

    // Loading placeholder
    content.innerHTML = '<div class="drill-header fade-in">'
      + '<button class="back-btn" onclick="backToObjections()">← Back to Objections</button>'
      + '<div class="drill-title">Loading…</div></div>'
      + '<div class="load-state"><div class="spinner"></div></div>';

    var data;
    var cached = state.typeEventsCache[objectionId];
    if (cached) {
      data = cached;
    } else {
      try {
        data = await fetchObjectionsByType(objectionId);
        state.typeEventsCache[objectionId] = data;
      } catch (err) {
        content.innerHTML = '<div class="drill-header"><button class="back-btn" onclick="backToObjections()">← Back</button></div>'
          + '<div class="error">Could not load events: ' + escapeHtml(err.message || 'unknown') + '</div>';
        return;
      }
    }

    var label = data.label || objectionId;
    var t = data.totals;
    var color = COLORS[objectionId] || COLORS.other;
    var pctOver = t.overcome_pct === null ? '—' : t.overcome_pct + '%';
    var pctClass = t.overcome_pct === null ? '' : (t.overcome_pct >= 70 ? 'good' : t.overcome_pct >= 40 ? 'mid' : 'bad');

    // Framework rebuttal — pull from the first event (all share the same rebuttal text)
    var firstWithRebuttal = (data.events || []).find(function(e) { return e.framework_rebuttal; });
    var frameworkRebuttal = firstWithRebuttal ? firstWithRebuttal.framework_rebuttal : null;

    var stats = ''
      + '<div class="type-stat"><div class="stat-label">Total Events</div><div class="stat-value">' + t.total + '</div></div>'
      + '<div class="type-stat"><div class="stat-label">Overcame</div><div class="stat-value good">' + t.overcome + '</div></div>'
      + '<div class="type-stat"><div class="stat-label">Not Overcome</div><div class="stat-value bad">' + t.not_overcome + '</div></div>'
      + '<div class="type-stat"><div class="stat-label">Indeterminate</div><div class="stat-value">' + t.unknown + '</div><div class="stat-sub">transcript unclear</div></div>'
      + '<div class="type-stat"><div class="stat-label">Overcome Rate</div><div class="stat-value ' + pctClass + '">' + escapeHtml(pctOver) + '</div><div class="stat-sub">of definitive</div></div>';

    var frameworkBlock = frameworkRebuttal
      ? '<div class="framework-ref">'
        + '<div class="framework-ref-label">Scout\'s framework rebuttal — use this every time</div>'
        + '<div class="framework-ref-text">"' + escapeHtml(frameworkRebuttal) + '"</div>'
        + '</div>'
      : '';

    var eventsHtml;
    if ((data.events || []).length === 0) {
      eventsHtml = '<div class="empty"><h3>No events in this window</h3><p>No instances of this objection were detected in the selected date range.</p></div>';
    } else {
      eventsHtml = data.events.map(eventCardHtml).join('');
    }

    content.innerHTML = '<div class="drill-header fade-in">'
        + '<button class="back-btn" onclick="backToObjections()">← Back to Objections</button>'
        + '<div class="drill-title">' + escapeHtml(label) + ' <span class="count">' + t.total + '</span></div>'
      + '</div>'
      + '<div class="type-stats-row fade-in">' + stats + '</div>'
      + frameworkBlock
      + '<div class="section fade-in">'
        + '<div class="section-header"><h2>Every event</h2>'
        + '<div class="meta">' + t.total + (t.total === 1 ? ' instance' : ' instances') + ' in window</div></div>'
        + eventsHtml
      + '</div>';
  }

  async function fetchObjectionsByType(objectionId) {
    var url = isSelf()
      ? '/me/objections?objection_id=' + encodeURIComponent(objectionId)
        + '&from=' + encodeURIComponent(state.dateRange.from) + '&to=' + encodeURIComponent(state.dateRange.to)
      : '/admin/objections/' + encodeURIComponent(state.viewingUserId)
        + '?objection_id=' + encodeURIComponent(objectionId)
        + '&from=' + encodeURIComponent(state.dateRange.from) + '&to=' + encodeURIComponent(state.dateRange.to);
    var res = await fetch(url, { headers: authHeader() });
    if (res.status === 401) { clearSession(); window.location.replace('/login'); throw new Error('unauth'); }
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  }

  // Per-event card for the type drill — call context up top, coaching note,
  // side-by-side framework vs actual, classifier note at bottom.
  function eventCardHtml(e) {
    var prospect = e.prospect_name
      ? '<span class="name">' + escapeHtml(e.prospect_name) + '</span>'
      : '<span class="anon">unknown prospect</span>';
    var dateStr = e.session_started_at ? formatDate(e.session_started_at) : '—';
    var timeStr = e.detected_at ? new Date(e.detected_at).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) : '';
    var sessionOutcome = e.session_outcome
      ? outcomeBadge(e.session_outcome, !!e.session_ended_at)
      : (e.session_ended_at ? '<span class="badge badge-empty">Unmarked</span>' : '<span class="badge badge-live">Live</span>');

    var verdict;
    if (e.overcome === true)       verdict = '<span class="verdict verdict-overcome">Overcame</span>';
    else if (e.overcome === false) verdict = '<span class="verdict verdict-not">Not overcome</span>';
    else                            verdict = '<span class="verdict verdict-unknown">Indeterminate</span>';
    var conf = e.overcome_confidence ? '<span class="verdict-conf">' + escapeHtml(e.overcome_confidence) + ' confidence</span>' : '';

    var coaching = e.coaching_note
      ? '<div class="coaching-note">' + escapeHtml(e.coaching_note) + '</div>'
      : '<div class="coaching-note-empty">No coaching narrative generated for this event.</div>';

    var rebuttal = e.framework_rebuttal
      ? '<div class="compare-text">' + escapeHtml(e.framework_rebuttal) + '</div>'
      : '<div class="compare-text empty">No framework rebuttal recorded.</div>';
    var said = e.closer_response
      ? '<div class="compare-text">' + escapeHtml(e.closer_response) + '</div>'
      : '<div class="compare-text empty">No closer transcript captured in the 60s after this objection.</div>';

    return '<div class="event-card">'
      + '<div class="event-card-head">'
        + '<div>'
          + '<div class="event-card-title">Call with ' + prospect + '</div>'
          + '<div class="event-card-meta">' + escapeHtml(dateStr) + (timeStr ? ' · objection at ' + escapeHtml(timeStr) : '') + '</div>'
        + '</div>'
        + '<div class="event-card-right">' + verdict + conf + sessionOutcome + '</div>'
      + '</div>'
      + coaching
      + '<div class="compare-grid">'
        + '<div class="compare-pane framework"><div class="compare-label">Scout suggested</div>' + rebuttal + '</div>'
        + '<div class="compare-pane actual"><div class="compare-label">What you said</div>' + said + '</div>'
      + '</div>'
      + (e.notes ? '<div class="obj-notes-row">Classifier note: ' + escapeHtml(e.notes) + '</div>' : '')
    + '</div>';
  }

  // Drill 3: Close rate — won vs not-won + framework deep-dive.
  function renderClosesDrill() {
    var t = state.analytics.totals;
    var content = document.getElementById('content');
    var won = t.wins;
    var notWon = t.losses + t.follow_ups;
    var unmarked = t.unmarked + t.live;
    var closeDenom = won + notWon;
    var closeRate = closeDenom > 0 ? Math.round((won / closeDenom) * 100) : null;

    var rows = [
      { label: 'Won',       count: won,      color: COLORS.win,       pct: closeDenom > 0 ? Math.round(100 * won / closeDenom) + '%' : '—' },
      { label: 'Lost',      count: t.losses, color: COLORS.loss,      pct: closeDenom > 0 ? Math.round(100 * t.losses / closeDenom) + '%' : '—' },
      { label: 'Follow-up', count: t.follow_ups, color: COLORS.follow_up, pct: closeDenom > 0 ? Math.round(100 * t.follow_ups / closeDenom) + '%' : '—' },
      { label: 'Unmarked',  count: unmarked, color: COLORS.unmarked, pct: '—' },
    ].filter(function(r) { return r.count > 0; });

    content.innerHTML = drillHeader('Close Rate', closeRate === null ? '—' : (closeRate + '%'))
      + '<div class="drill-grid fade-in">'
        + '<div class="drill-donut"><div class="donut-canvas-wrap"><canvas id="drill-chart"></canvas>'
          + '<div class="donut-center"><div class="big">' + (closeRate === null ? '—' : closeRate + '%') + '</div><div class="small">closed</div></div></div></div>'
        + '<div class="drill-breakdown">' + rows.map(function(r) {
          return '<div class="breakdown-row">'
            + '<div class="breakdown-dot" style="background:' + r.color + ';"></div>'
            + '<div class="breakdown-label">' + escapeHtml(r.label) + '</div>'
            + '<div class="breakdown-count">' + r.count + '</div>'
            + '<div class="breakdown-pct">' + escapeHtml(r.pct) + '</div>'
            + '</div>';
        }).join('') + '</div>'
      + '</div>'
      + '<div class="section fade-in"><div class="section-header"><h2>Calls with confirmed outcomes</h2>'
        + '<div class="meta">won, lost, or follow-up</div></div>'
        + renderCallsHtml(state.calls.filter(function(s) { return s.outcome === 'win' || s.outcome === 'loss' || s.outcome === 'follow_up'; }))
      + '</div>';

    requestAnimationFrame(function() {
      if (state.chartDrill) state.chartDrill.destroy();
      var labels = [];
      var values = [];
      var colors = [];
      if (won > 0) { labels.push('Won'); values.push(won); colors.push(COLORS.win); }
      if (notWon > 0) { labels.push('Not won'); values.push(notWon); colors.push('#1f1f1f'); }
      if (labels.length === 0) { labels = ['No closes yet']; values = [1]; colors = ['#1f1f1f']; }
      state.chartDrill = donutBase('drill-chart', labels, values, colors);
    });
  }

  // ──────────────────────────────────────────────────────────────────
  // Helpers
  // ──────────────────────────────────────────────────────────────────
  function formatDate(iso) {
    if (!iso) return '—';
    var d = new Date(iso);
    var month = d.toLocaleDateString('en-US', { month: 'short' });
    var day = d.getDate();
    var year = d.getFullYear();
    var today = new Date().getFullYear();
    return year === today ? month + ' ' + day : month + ' ' + day + ', ' + year;
  }

  function formatDuration(seconds) {
    if (!seconds && seconds !== 0) return '—';
    if (seconds < 60) return seconds + 's';
    var m = Math.floor(seconds / 60);
    var s = seconds % 60;
    return m + 'm' + (s > 0 ? ' ' + s + 's' : '');
  }

  // ──────────────────────────────────────────────────────────────────
  // Call Library (Scout v2.0 Phase 2 Step 3)
  //
  // The Calls nav item opens this top-level view. It shows a paginated
  // list of the caller's synced Fathom calls with each call's analysis
  // state surfaced as a status badge. Clicking a card currently shows a
  // "coming soon" notice via the existing fathomNotice flash; the full
  // call review page is the next step (Phase 2 Step 4) and will replace
  // the click handler with a real navigation.
  // ──────────────────────────────────────────────────────────────────

  // Date formatter for the library cards: always "Jun 23, 2026" form (with
  // year) per the brief, even when the date is in the current calendar
  // year. Differs from formatDate above which omits the year for current.
  function formatNaturalDate(iso) {
    if (!iso) return '—';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '—';
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  }

  // Duration formatter for the library cards: "57m" or "1h 23m" per the
  // brief, no seconds. Null/invalid → "—". Differs from formatDuration
  // above which keeps seconds for short calls.
  function formatNaturalDuration(seconds) {
    if (seconds === null || seconds === undefined) return '—';
    if (typeof seconds !== 'number' || isNaN(seconds) || seconds < 0) return '—';
    var hours = Math.floor(seconds / 3600);
    var minutes = Math.floor((seconds % 3600) / 60);
    if (hours > 0) return hours + 'h ' + minutes + 'm';
    return minutes + 'm';
  }

  // throw-on-failure pattern matching fetchAnalytics/fetchPatterns/fetchCalls.
  async function fetchCallLibrary(offset, limit) {
    var qs = 'limit=' + (limit || 20) + '&offset=' + (offset || 0);
    var res = await fetch('/fathom/calls?' + qs, { headers: authHeader() });
    if (res.status === 401) { clearSession(); window.location.replace('/login'); throw new Error('unauth'); }
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  }

  // Fire-and-forget load. When offset=0, replaces state.callLibrary; on
  // pagination (offset>0) it concatenates onto the existing list. Re-
  // renders the view automatically when done if still on call-library.
  async function loadCallLibrary(offset) {
    if (state.callLibraryLoading) return; // guard concurrent clicks
    state.callLibraryLoading = true;
    var requestedLimit = 20;
    var startedOffset = offset || 0;
    try {
      var data = await fetchCallLibrary(startedOffset, requestedLimit);
      var calls = (data && data.calls) || [];
      if (startedOffset === 0) {
        state.callLibrary = calls;
      } else {
        state.callLibrary = (state.callLibrary || []).concat(calls);
      }
      state.callLibraryHasMore = calls.length >= requestedLimit;
      state.callLibraryOffset = startedOffset + calls.length;
      state.callLibraryError = null;
    } catch (err) {
      if (err.message === 'unauth') return;
      state.callLibraryError = err.message || 'unknown';
    }
    state.callLibraryLoading = false;
    if (state.view === 'call-library') renderCallLibrary();
  }

  function renderCallLibrary() {
    var content = document.getElementById('content');

    // First render after entering the view: kick off the fetch and show
    // skeletons. The fetch's completion handler re-calls renderCallLibrary
    // with state populated.
    if (state.callLibrary === null && !state.callLibraryLoading) {
      loadCallLibrary(0); // async, no await — re-renders when done
    }

    var header = renderCallLibraryHeaderHtml();
    var notice = renderFathomNoticeHtml(); // reuse the global flash mechanism

    if (state.callLibraryError) {
      content.innerHTML = header + notice
        + '<div class="error fade-in">Could not load calls: ' + escapeHtml(state.callLibraryError) + '</div>';
      return;
    }

    if (state.callLibrary === null) {
      // Initial loading state — skeleton rows, no real data yet.
      content.innerHTML = header + notice + renderCallLibrarySkeletonsHtml();
      return;
    }

    if (state.callLibrary.length === 0) {
      content.innerHTML = header + notice
        + '<div class="empty fade-in">'
          + '<h3>No calls synced yet</h3>'
          + '<p>Connect Fathom and sync your calls to get started.</p>'
        + '</div>';
      return;
    }

    var cards = state.callLibrary.map(callLibraryCardHtml).join('');
    var loadMore = '';
    if (state.callLibraryHasMore) {
      loadMore = '<div style="display:flex;justify-content:center;margin-top:18px;">'
        + '<button class="btn-fathom-secondary" type="button" onclick="loadCallLibrary(' + state.callLibraryOffset + ')"'
        + (state.callLibraryLoading ? ' disabled>Loading…' : '>Load more')
        + '</button></div>';
    }
    content.innerHTML = header + notice
      + '<div class="library-list fade-in">' + cards + '</div>'
      + loadMore;
  }

  function renderCallLibraryHeaderHtml() {
    var count = (state.callLibrary && state.callLibrary.length) || 0;
    var sub = state.callLibrary === null
      ? 'Loading your synced Fathom calls…'
      : (count === 0
          ? 'Your synced Fathom calls will appear here.'
          : count + ' call' + (count === 1 ? '' : 's') + ' shown' + (state.callLibraryHasMore ? ' (more available)' : ''));
    return '<div class="page-header fade-in">'
      + '<div><h1>Call Library</h1>'
      + '<div class="subtitle">' + escapeHtml(sub) + '</div></div>'
      + '</div>';
  }

  function renderCallLibrarySkeletonsHtml() {
    var rows = '';
    for (var i = 0; i < 6; i++) rows += '<div class="library-skeleton-row"></div>';
    return '<div class="library-list">' + rows + '</div>';
  }

  function callLibraryCardHtml(c) {
    var title = (c.title && String(c.title).trim())
      ? '<span>' + escapeHtml(c.title) + '</span>'
      : '<span class="anon">Untitled call</span>';
    var dateStr = formatNaturalDate(c.call_date);
    var durStr = formatNaturalDuration(c.duration_seconds);

    var meta = '<span>' + escapeHtml(dateStr) + '</span>'
             + '<span class="sep">·</span>'
             + '<span>' + escapeHtml(durStr) + '</span>';

    var badge = libraryStatusBadgeHtml(c.analysis_status, c.overall_score);

    var recordingLink = '';
    if (c.recording_url && typeof c.recording_url === 'string') {
      // event.stopPropagation prevents the card's onclick from firing when
      // the user wanted to open the Fathom link directly.
      recordingLink = '<a class="library-recording-link" href="' + escapeHtml(c.recording_url)
        + '" target="_blank" rel="noopener" onclick="event.stopPropagation()">View in Fathom →</a>';
    }

    var cardId = escapeHtml(String(c.id || ''));
    return '<div class="library-card" onclick="openCallReview(\'' + cardId + '\')">'
      + '<div class="library-card-main">'
        + '<div class="library-card-title' + (c.title ? '' : ' anon') + '">' + title + '</div>'
        + '<div class="library-card-meta">' + meta + '</div>'
      + '</div>'
      + '<div class="library-card-side">'
        + badge
        + recordingLink
      + '</div>'
    + '</div>';
  }

  function libraryStatusBadgeHtml(analysisStatus, overallScore) {
    // No analysis row at all: grey "Pending" — the analysis worker hasn't
    // picked this call up yet.
    if (!analysisStatus || analysisStatus === 'pending') {
      return '<span class="library-status-badge pending">Pending</span>';
    }
    if (analysisStatus === 'processing') {
      return '<span class="library-status-badge analyzing"><span class="spinner-tiny"></span>Analyzing…</span>';
    }
    if (analysisStatus === 'done') {
      var scoreText = (typeof overallScore === 'number') ? overallScore + '/100' : 'Done';
      return '<span class="library-status-badge done">' + escapeHtml(scoreText) + '</span>';
    }
    if (analysisStatus === 'error') {
      return '<span class="library-status-badge error">Error</span>';
    }
    // Unknown status — render as pending so we never blow up.
    return '<span class="library-status-badge pending">' + escapeHtml(String(analysisStatus)) + '</span>';
  }

  // ──────────────────────────────────────────────────────────────────
  // Call Review page — Scout v2.0 Phase 2 Step 4
  // Navigates to a per-call view that shows highlights timeline, section
  // grades, and follow-up email. Three sections in fixed order — highlights
  // come first by design (the brief's "lead with what happened, support
  // with how it scored").
  // ──────────────────────────────────────────────────────────────────

  // Format integer seconds as "M:SS" (under 1 hour) or "H:MM:SS" — used for
  // human-readable highlight timestamps. Raw seconds still drive the
  // `?t=<seconds>` Fathom deep-link href; the visible label is this.
  function formatTimestampDisplay(seconds) {
    if (typeof seconds !== 'number' || isNaN(seconds) || seconds < 0) return '—';
    var s = Math.floor(seconds);
    var h = Math.floor(s / 3600);
    var m = Math.floor((s % 3600) / 60);
    var sec = s % 60;
    var pad = function(n) { return (n < 10 ? '0' : '') + n; };
    if (h > 0) return h + ':' + pad(m) + ':' + pad(sec);
    return m + ':' + pad(sec);
  }

  async function fetchCallReview(callId) {
    var res = await fetch('/fathom/calls/' + encodeURIComponent(callId), { headers: authHeader() });
    if (res.status === 401) { clearSession(); window.location.replace('/login'); throw new Error('unauth'); }
    if (res.status === 404) throw new Error('Call not found');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  }

  // Fire-and-forget loader. Re-renders the view when done, but only if the
  // user hasn't navigated away in the meantime AND we're still showing the
  // call this fetch was kicked off for (guards stale resolves).
  async function loadCallReview(callId) {
    if (state.callReviewLoading) return;
    state.callReviewLoading = true;
    state.callReviewError = null;
    try {
      var data = await fetchCallReview(callId);
      if (state.selectedCallId !== callId) return; // user navigated away — drop stale data
      state.callReview = data;
    } catch (err) {
      if (err.message === 'unauth') return;
      if (state.selectedCallId !== callId) return; // same stale-resolve guard for errors
      state.callReviewError = err.message || 'unknown';
    }
    state.callReviewLoading = false;
    if (state.view === 'call-review') renderCallReview();
  }

  function renderCallReview() {
    var content = document.getElementById('content');
    var callId = state.selectedCallId;
    if (!callId) { backToCallLibrary(); return; }

    // Pull the partial card from the library cache to render the header
    // instantly while the full fetch is in flight. Avoids a blank flash.
    var seed = null;
    if (Array.isArray(state.callLibrary)) {
      for (var i = 0; i < state.callLibrary.length; i++) {
        if (state.callLibrary[i].id === callId) { seed = state.callLibrary[i]; break; }
      }
    }

    var review = state.callReview;
    var header = renderCallReviewHeaderHtml(review, seed);
    var notice = renderFathomNoticeHtml();

    if (state.callReviewError && !review) {
      content.innerHTML = header + notice
        + '<div class="error fade-in">'
          + 'Could not load this call: ' + escapeHtml(state.callReviewError)
          + ' <button class="btn-fathom-secondary" style="margin-left:12px;" type="button" onclick="loadCallReview(\'' + escapeHtml(callId) + '\')">Retry</button>'
        + '</div>';
      return;
    }

    if (!review) {
      // Loading state — three section-sized skeletons under the header.
      content.innerHTML = header + notice
        + '<div class="fade-in">'
          + '<div class="review-skeleton-section"></div>'
          + '<div class="review-skeleton-section"></div>'
          + '<div class="review-skeleton-section"></div>'
        + '</div>';
      return;
    }

    var errorBanner = '';
    if (review.analysis && review.analysis.status === 'error') {
      var reason = review.analysis.overall_summary || 'Analysis failed.';
      errorBanner = '<div class="review-analysis-error fade-in">'
        + '<strong>Analysis error.</strong> ' + escapeHtml(reason)
        + '</div>';
    }

    content.innerHTML = header + notice + errorBanner
      + '<div class="fade-in">'
        + renderHighlightsSectionHtml(review)
        + renderGradesSectionHtml(review)
        + renderFollowupSectionHtml(review)
      + '</div>';
  }

  function renderCallReviewHeaderHtml(review, seed) {
    var src = review || seed || {};
    var titleText = (src.title && String(src.title).trim()) ? src.title : null;
    var titleHtml = titleText
      ? '<h1 class="review-title">' + escapeHtml(titleText) + '</h1>'
      : '<h1 class="review-title anon">Untitled call</h1>';

    var dateStr = formatNaturalDate(src.call_date);
    var durStr = formatNaturalDuration(src.duration_seconds);
    var meta = '<span>' + escapeHtml(dateStr) + '</span>'
             + '<span class="sep">·</span>'
             + '<span>' + escapeHtml(durStr) + '</span>';

    // Status badge — when full data has loaded, use analysis.status +
    // overall_score; otherwise fall back to the library card's
    // analysis_status field. libraryStatusBadgeHtml handles both shapes.
    var status = review && review.analysis ? review.analysis.status : (src.analysis_status || null);
    var score = review && review.analysis ? review.analysis.overall_score : (typeof src.overall_score === 'number' ? src.overall_score : null);
    var badge = libraryStatusBadgeHtml(status, score);

    var fathomLink = '';
    if (src.recording_url && typeof src.recording_url === 'string') {
      fathomLink = '<a class="review-fathom-link" href="' + escapeHtml(src.recording_url) + '" target="_blank" rel="noopener">View in Fathom →</a>';
    }

    return '<div class="review-page-header fade-in">'
      + '<button class="review-back-link" type="button" onclick="backToCallLibrary()">← Back to Calls</button>'
      + '<div class="review-title-row">'
        + '<div class="review-title-main">'
          + titleHtml
          + '<div class="review-meta-row">' + meta + '</div>'
        + '</div>'
        + '<div class="review-title-side">'
          + badge
          + fathomLink
        + '</div>'
      + '</div>'
    + '</div>';
  }

  // ─── Section 1: Highlights ────────────────────────────────────────────
  function renderHighlightsSectionHtml(review) {
    var analysis = review.analysis;
    var highlights = Array.isArray(review.highlights) ? review.highlights : [];
    var recordingUrl = review.recording_url || null;
    var analysisDone = analysis && analysis.status === 'done';

    var body;
    if (highlights.length > 0) {
      body = '<div class="review-highlight-list">'
        + highlights.map(function(h) { return highlightEntryHtml(h, recordingUrl); }).join('')
        + '</div>';
    } else if (!analysisDone) {
      body = '<div class="review-highlights-pending">Analysis in progress — highlights will appear here shortly.</div>';
    } else {
      body = '<div class="review-highlights-pending">No highlights were extracted for this call.</div>';
    }

    // One-thing footer — always rendered, falls back to a placeholder.
    var oneThing = analysis && typeof analysis.one_thing === 'string' && analysis.one_thing.trim()
      ? '<div class="review-one-thing-text">' + escapeHtml(analysis.one_thing) + '</div>'
      : '<div class="review-one-thing-text placeholder">Will appear when analysis completes.</div>';

    return '<section class="section">'
      + '<div class="section-header"><h2>Call Highlights</h2></div>'
      + body
      + '<div class="review-one-thing">'
        + '<div class="review-one-thing-label">One thing to do differently</div>'
        + oneThing
      + '</div>'
    + '</section>';
  }

  function highlightEntryHtml(h, recordingUrl) {
    var seconds = (typeof h.timestamp_seconds === 'number') ? h.timestamp_seconds : null;
    var label = (seconds != null) ? formatTimestampDisplay(seconds) : '—';
    var timeHtml;
    if (seconds != null && recordingUrl && typeof recordingUrl === 'string') {
      var href = recordingUrl + (recordingUrl.indexOf('?') !== -1 ? '&' : '?') + 't=' + seconds;
      timeHtml = '<a class="review-highlight-time" href="' + escapeHtml(href)
        + '" target="_blank" rel="noopener" onclick="event.stopPropagation()">' + escapeHtml(label) + '</a>';
    } else {
      timeHtml = '<span class="review-highlight-time disabled">' + escapeHtml(label) + '</span>';
    }

    var speakerClass = (h.speaker === 'CLOSER') ? 'closer' : 'prospect';
    var speakerBadge = '<span class="review-speaker-badge ' + speakerClass + '">' + escapeHtml(h.speaker || '') + '</span>';

    var typeLabel = highlightTypeLabel(h.type);
    var typeClass = (typeof h.type === 'string') ? h.type.toLowerCase() : '';
    var typeBadge = '<span class="review-type-badge ' + escapeHtml(typeClass) + '">' + escapeHtml(typeLabel) + '</span>';

    var quote = (typeof h.quote === 'string') ? h.quote : '';
    var observation = (typeof h.observation === 'string') ? h.observation : '';

    return '<div class="review-highlight">'
      + timeHtml
      + '<div class="review-highlight-body">'
        + '<div class="review-highlight-row1">' + speakerBadge + typeBadge + '</div>'
        + '<div class="review-quote">' + escapeHtml(quote) + '</div>'
        + '<div class="review-observation">' + escapeHtml(observation) + '</div>'
      + '</div>'
    + '</div>';
  }

  function highlightTypeLabel(type) {
    var labels = {
      buying_signal:      'Buying signal',
      objection:          'Objection',
      missed_opportunity: 'Missed opportunity',
      strong_moment:      'Strong moment',
      rapport_moment:     'Rapport',
      disqualify_signal:  'Disqualify signal',
    };
    return (type && labels[type]) || (type || 'Moment');
  }

  // ─── Section 2: Section Grades — five collapsible cards ───────────────
  var REVIEW_SECTION_KEYS = ['intro', 'discovery', 'pitch', 'objection', 'close'];
  var REVIEW_SECTION_LABELS = {
    intro:     'Intro',
    discovery: 'Discovery',
    pitch:     'Pitch',
    objection: 'Objection handling',
    close:     'Close',
  };

  function renderGradesSectionHtml(review) {
    var analysis = review.analysis;
    var analysisDone = analysis && analysis.status === 'done';

    // All-expand toggle — only meaningful when there's actual data.
    var anyExpanded = REVIEW_SECTION_KEYS.some(function(k) { return !!state.expandedGradeCards[k]; });
    var toggleLabel = anyExpanded ? 'Collapse all' : 'Expand all';
    var toggleBtn = analysisDone
      ? '<button class="review-grades-toggle" type="button" onclick="toggleAllGrades()">' + toggleLabel + '</button>'
      : '';

    var cards;
    if (analysisDone) {
      cards = REVIEW_SECTION_KEYS.map(function(k) { return gradeCardHtml(k, analysis); }).join('');
    } else {
      // Skeleton placeholders — 5 cards, pulsing, no interaction.
      var s = '';
      for (var i = 0; i < REVIEW_SECTION_KEYS.length; i++) s += '<div class="review-grade-card skeleton-card"></div>';
      cards = s;
    }

    return '<section class="section">'
      + '<div class="section-header"><h2>Section grades</h2>' + toggleBtn + '</div>'
      + '<div class="review-grade-list">' + cards + '</div>'
    + '</section>';
  }

  function gradeCardHtml(sectionKey, analysis) {
    var label = REVIEW_SECTION_LABELS[sectionKey];
    var grade = analysis[sectionKey + '_grade'];
    var score = analysis[sectionKey + '_score'];
    var notes = analysis[sectionKey + '_notes'];
    var expanded = !!state.expandedGradeCards[sectionKey];

    var letterHtml;
    if (grade && /^[A-F]$/.test(grade)) {
      letterHtml = '<div class="review-grade-letter ' + grade + '">' + grade + '</div>';
    } else {
      letterHtml = '<div class="review-grade-letter empty">—</div>';
    }

    var scoreText = (typeof score === 'number') ? score + '/100' : '';
    var chevron = '<span class="review-grade-chevron">▾</span>';

    var notesHtml = '';
    if (expanded) {
      var notesText = (typeof notes === 'string' && notes.trim()) ? notes : 'No notes recorded.';
      var notesClass = (typeof notes === 'string' && notes.trim()) ? 'review-grade-notes' : 'review-grade-notes placeholder';
      notesHtml = '<div class="review-grade-body">'
        + '<div class="' + notesClass + '">' + escapeHtml(notesText) + '</div>'
      + '</div>';
    }

    var notOccurred = (grade === null && score === null && typeof notes === 'string' && notes.indexOf('did not occur') !== -1);
    var cardClass = 'review-grade-card'
      + (expanded ? ' expanded' : '')
      + (notOccurred ? ' not-occurred' : '');

    return '<div class="' + cardClass + '">'
      + '<div class="review-grade-card-header" onclick="toggleGradeCard(\'' + sectionKey + '\')">'
        + '<div class="review-grade-name">' + escapeHtml(label) + '</div>'
        + letterHtml
        + '<div class="review-grade-score">' + escapeHtml(scoreText) + '</div>'
        + chevron
      + '</div>'
      + notesHtml
    + '</div>';
  }

  function toggleGradeCard(sectionKey) {
    state.expandedGradeCards[sectionKey] = !state.expandedGradeCards[sectionKey];
    if (state.view === 'call-review') renderCallReview();
  }

  function toggleAllGrades() {
    var anyExpanded = REVIEW_SECTION_KEYS.some(function(k) { return !!state.expandedGradeCards[k]; });
    var nextValue = !anyExpanded; // if any open → collapse all; else expand all
    var next = {};
    for (var i = 0; i < REVIEW_SECTION_KEYS.length; i++) next[REVIEW_SECTION_KEYS[i]] = nextValue;
    state.expandedGradeCards = next;
    if (state.view === 'call-review') renderCallReview();
  }

  // ─── Section 3: Follow-up Email ───────────────────────────────────────
  function renderFollowupSectionHtml(review) {
    var analysis = review.analysis;
    var email = analysis && typeof analysis.follow_up_email === 'string' ? analysis.follow_up_email : '';
    var hasEmail = !!(email && email.trim());

    var boxHtml;
    if (hasEmail) {
      boxHtml = '<div class="review-followup-box" id="reviewFollowupBox">' + escapeHtml(email) + '</div>';
    } else if (analysis && analysis.status === 'done') {
      boxHtml = '<div class="review-followup-box placeholder">No follow-up email was generated for this call.</div>';
    } else {
      boxHtml = '<div class="review-followup-box placeholder">A follow-up draft will appear here once analysis completes.</div>';
    }

    var copyBtn = hasEmail
      ? '<button class="btn-fathom-secondary" type="button" onclick="copyFollowupEmail()">Copy</button>'
      : '<button class="btn-fathom-secondary" type="button" disabled>Copy</button>';
    var feedback = '<span class="review-copy-feedback' + (state.followupCopied ? ' show' : '') + '">Copied!</span>';

    return '<section class="section">'
      + '<div class="section-header"><h2>Follow-up email</h2></div>'
      + '<div class="review-followup-wrap">'
        + boxHtml
        + '<div class="review-followup-actions">' + copyBtn + feedback + '</div>'
      + '</div>'
    + '</section>';
  }

  function copyFollowupEmail() {
    var review = state.callReview;
    if (!review || !review.analysis || !review.analysis.follow_up_email) return;
    var text = review.analysis.follow_up_email;
    var writePromise = (navigator.clipboard && navigator.clipboard.writeText)
      ? navigator.clipboard.writeText(text)
      : new Promise(function(resolve, reject) {
          // Fallback: textarea + execCommand. Older browsers / non-HTTPS dev contexts.
          try {
            var ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.left = '-9999px';
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            resolve();
          } catch (e) { reject(e); }
        });
    writePromise.then(function() {
      state.followupCopied = true;
      if (state.view === 'call-review') renderCallReview();
      setTimeout(function() {
        state.followupCopied = false;
        if (state.view === 'call-review') renderCallReview();
      }, 1800);
    }).catch(function(err) {
      console.warn('[review] clipboard write failed:', err);
    });
  }

  function backToCallLibrary() {
    state.view = 'call-library';
    state.selectedCallId = null;
    // Intentionally keep state.callReview around in case the user re-opens
    // the same call — but null it so a subsequent open kicks a fresh fetch
    // and reflects any analysis-status changes that happened in the meantime.
    state.callReview = null;
    state.callReviewError = null;
    state.expandedGradeCards = {};
    state.followupCopied = false;
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // Real navigator. Replaces the Phase 2 Step 3 placeholder that only
  // surfaced a flash notice. Opens the call review page, kicks off the
  // detailed fetch in the background, and scrolls to top.
  function openCallReview(callId) {
    state.selectedCallId = callId;
    state.callReview = null;
    state.callReviewError = null;
    state.expandedGradeCards = {};
    state.followupCopied = false;
    state.view = 'call-review';
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
    loadCallReview(callId); // async, re-renders when done
  }

  init();
</script>

</body>
</html>
