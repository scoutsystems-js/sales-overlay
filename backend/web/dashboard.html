  // ═══ EOD Report view ═══════════════════════════════════════════════════
  // Per-user daily report: analysis-prefilled, inline-editable (edits persist
  // via PUT /eod/edit and always win over analysis), copy-for-Slack plain
  // text. "Today" is the ET calendar day (server-side default).
  function goEod() { setView('eod'); }

  async function loadEod() {
    if (state.eodLoading) return;
    state.eodLoading = true;
    try {
      var qs = state.eodDate ? '?date=' + encodeURIComponent(state.eodDate) : '';
      var res = await fetch('/eod' + qs, { headers: authHeader() });
      if (res.status === 401) { clearSession(); window.location.replace('/login'); return; }
      if (!res.ok) throw new Error('HTTP ' + res.status);
      state.eodData = await res.json();
      if (!state.eodDate) state.eodDate = state.eodData.date;
    } catch (err) {
      state.eodData = { _error: err.message || 'unknown' };
    }
    state.eodLoading = false;
    if (state.view === 'eod') renderEodView();
  }

  function eodShiftDay(deltaDays) {
    var d = state.eodDate || (state.eodData && state.eodData.date);
    if (!d) return;
    var parts = d.split('-').map(Number);
    var next = new Date(Date.UTC(parts[0], parts[1] - 1, parts[2]) + deltaDays * 86400000).toISOString().slice(0, 10);
    eodSetDate(next);
  }
  function eodSetDate(dateStr) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) return;
    state.eodDate = dateStr;
    state.eodData = null;
    renderEodView();
  }
  function eodToday() { state.eodDate = null; state.eodData = null; renderEodView(); }

  // Inline edit: save on change. Empty string is a deliberate clear-to-blank
  // (still an override); we never send null from the UI (no un-override
  // affordance yet — analysis values remain visible by clearing the row's edit
  // via support if ever needed).
  async function eodSaveField(callId, field, el) {
    var value = el.value;
    try {
      var res = await fetch('/eod/edit', {
        method: 'PUT',
        headers: Object.assign({ 'Content-Type': 'application/json' }, authHeader()),
        body: JSON.stringify({ call_id: callId, field: field, value: value }),
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      el.classList.add('edited');
      // update local state so a re-render (or Slack copy) uses the new value
      var call = ((state.eodData && state.eodData.calls) || []).find(function (c) { return c.call_id === callId; });
      if (call) { call.fields[field] = value; call.edited[field] = true; }
    } catch (err) {
      alert('Could not save edit: ' + (err.message || 'unknown'));
    }
  }

  function eodCashDisplay(v) {
    var n = parseFloat(v);
    if (isNaN(n)) return String(v == null ? '0' : v);
    return n % 1 === 0 ? String(n) : n.toFixed(2);
  }
  // (EOD Payment row removed by product ruling 2026-07-22 — the outcome
  // prefill now carries the composed "Closed - PIF" style label server-side.)
  function eodOutcomeLabel(oc) {
    if (oc === 'closed') return 'Closed';
    if (oc === 'follow_up') return 'Follow-up';
    if (oc === 'lost') return 'Lost';
    if (oc === 'no_show') return 'No-show';
    return oc || 'Unknown';
  }

  // Plain text for Slack — EXACT field order per spec: prospect name, outcome,
  // Fathom link, cash collected, brief summary. All calls, one paste.
  function eodSlackText() {
    var d = state.eodData;
    if (!d || !Array.isArray(d.calls)) return '';
    var lines = ['EOD Report — ' + d.date, ''];
    if (d.calls.length === 0) lines.push('No calls today.');
    d.calls.forEach(function (c, i) {
      var f = c.fields;
      lines.push(f.prospect_name || 'Unknown prospect');
      lines.push('Outcome: ' + eodOutcomeLabel(f.outcome));
      lines.push('Call: ' + (c.recording_url || '—'));
      lines.push('Cash collected: $' + eodCashDisplay(f.cash_collected));
      lines.push('Summary: ' + (f.summary || '—'));
      if (i < d.calls.length - 1) lines.push('');
    });
    return lines.join('\n');
  }

  async function eodCopyForSlack() {
    var text = eodSlackText();
    var note = document.getElementById('eodCopyNote');
    try {
      await navigator.clipboard.writeText(text);
      if (note) { note.textContent = 'Copied ✓'; setTimeout(function () { if (note) note.textContent = ''; }, 2500); }
    } catch (err) {
      // clipboard API can fail on some setups — fall back to a prompt
      window.prompt('Copy the report below:', text);
    }
  }

  function renderEodView() {
    var content = document.getElementById('content');
    if (state.eodData === null && !state.eodLoading) loadEod();
    var d = state.eodData;
    var dateVal = state.eodDate || (d && d.date) || '';

    var toolbar = '<div class="eod-toolbar">'
      + '<button class="btn-fathom-secondary" type="button" onclick="eodShiftDay(-1)">← Prev Day</button>'
      + '<input type="date" value="' + escapeHtml(dateVal) + '" onchange="eodSetDate(this.value)">'
      + '<button class="btn-fathom-secondary" type="button" onclick="eodShiftDay(1)">Next Day →</button>'
      + '<button class="btn-fathom-secondary" type="button" onclick="eodToday()">Today</button>'
      + '<button class="btn-fathom-secondary" type="button" onclick="eodCopyForSlack()">📋 Copy for Slack</button>'
      + '<span class="eod-copy-note" id="eodCopyNote"></span>'
      + '</div>';

    var body;
    if (!d) body = '<div class="skeleton" style="height:120px;"></div>';
    else if (d._error) body = '<div class="error">Could not load EOD report: ' + escapeHtml(d._error) + '</div>';
    else if (!d.calls || d.calls.length === 0) {
      // FD-3 (Option A): a never-synced user (no recording source connected → no
      // calls at all) gets a "no calls yet" state + connect CTA. The "pick another
      // day" copy is only right for users who DO have calls, just not on this date.
      if (!anySourceConnected()) {
        body = '<div class="empty"><h3>No calls yet</h3>'
          + '<p>Connect a recording source (Zoom or Fathom) to start syncing calls — your daily report fills in automatically once they come in.</p>'
          + connectSourceCtaHtml() + '</div>';
      } else {
        body = '<div class="empty"><h3>No calls on ' + escapeHtml(d.date || '') + '</h3><p>Days without calls have nothing to report — pick another day above.</p></div>';
      }
    } else {
      body = d.calls.map(function (c) {
        var f = c.fields, e = c.edited || {};
        function row(label, field, value, isArea) {
          var cls = (isArea ? 'eod-textarea' : 'eod-input') + (e[field] ? ' edited' : '');
          var dot = e[field] ? ' <span class="eod-edited-dot">● edited</span>' : '';
          var handler = ' onchange="eodSaveField(\'' + c.call_id + '\', \'' + field + '\', this)"';
          var inner = isArea
            ? '<textarea class="' + cls + '"' + handler + '>' + escapeHtml(value == null ? '' : String(value)) + '</textarea>'
            : '<input type="text" class="' + cls + '" value="' + escapeHtml(value == null ? '' : String(value)) + '"' + handler + '>';
          return '<div class="eod-row"><div class="eod-label">' + label + dot + '</div>' + inner + '</div>';
        }
        var link = c.recording_url
          ? '<a class="review-fathom-link" href="' + escapeHtml(c.recording_url) + '" target="_blank" rel="noopener">View in Fathom →</a>'
          : '<span class="meta">no recording link</span>';
        var pendingNote = (c.analysis_status && c.analysis_status !== 'done')
          ? '<span class="meta"> · analysis ' + escapeHtml(c.analysis_status) + ' — prefills may update</span>' : '';
        return '<div class="eod-call">'
          + '<div class="eod-row"><div class="eod-label">Call</div><div>' + link + pendingNote + '</div></div>'
          + row('Prospect', 'prospect_name', f.prospect_name)
          // Outcome is READ-ONLY here now (Thread 1): it's the canonical call tag
          // (set on the Calls page / call review), composed with payment structure.
          + '<div class="eod-row"><div class="eod-label">Outcome</div><div class="eod-input" style="opacity:0.8;cursor:default;">' + escapeHtml(f.outcome == null ? '—' : String(f.outcome)) + '</div></div>'
          + row('Cash ($)', 'cash_collected', f.cash_collected)
          + row('Summary', 'summary', f.summary, true)
          + '</div>';
      }).join('');
    }

    content.innerHTML = '<div class="section fade-in">'
      + '<div class="section-header"><h2>EOD Report</h2>'
      + '<div class="meta">your calls for the day — edit inline, then copy for Slack</div></div>'
      + toolbar + body + '</div>';
  }

  // ═══ Knowledge Base view (relocated from admin.html — same ids, same JS) ═══
  // KB access: manager, owner, or an UNMANAGED plain user. Single source of
  // truth for the nav link + the #kb hash guard. (Server enforces it too.)
  // FD-4: everyone with a role can VIEW the KB. Managed reps see their team's KB
  // read-only (what their calls are graded against); everyone else also manages it.
  function canAccessKb() {
    return !!(state.me && (state.me.role === 'manager' || state.me.role === 'owner' || state.me.role === 'user'));
  }
  // Write access (add/delete): managers, owners, and UNMANAGED users only. Managed
  // reps are read-only — the backend enforces this too (/kb/upload + /kb/delete 403).
  function kbCanManage() {
    return !!(state.me && (state.me.role === 'manager' || state.me.role === 'owner'
      || (state.me.role === 'user' && !state.me.is_managed)));
  }
  // Promotion is narrower than management: an UNMANAGED plain user can manage
  // their own KB (kbCanManage) but has no team, so they can't promote into one.
  // Mirrors resolvePromotion's role gate in routes/kb.js.
  function kbCanPromote() {
    return !!(state.me && (state.me.role === 'manager' || state.me.role === 'owner'));
  }
  function goKb() { setView('kb'); }
  var relativeTime = (typeof formatRelativeTime === 'function') ? formatRelativeTime : function (x) { return x; };

  // ── PROSPECT MERGE REVIEW (3d-2) ────────────────────────────────────────
  // Close rate is closed prospects / total prospects, so an unmerged duplicate
  // moves the headline number. But a WRONG merge fuses two people and is
  // invisible in the aggregate — so this surface PROPOSES and a human decides.
  // Live proof it is needed: the title generator proposed "Mark-Anthony ~ Forb"
  // on a shared booked title, and that call's own summary said Forb "got routed
  // into the wrong Zoom meeting".
  function goProspects() { setView('prospects'); }

  async function loadMergeCandidates() {
    state.mergeLoading = true;
    try {
      var res = await fetch('/me/prospects/merge-candidates', { headers: authHeader() });
      if (res.status === 401) { clearSession(); window.location.replace('/login'); return; }
      var data = await res.json();
      state.mergeCandidates = (data && data.candidates) || [];
    } catch (err) { state.mergeCandidates = []; }
    state.mergeLoading = false;
    if (state.view === 'prospects') renderProspectsView();
  }

  var MERGE_REASON_LABEL = {
    name:  'names overlap',
    first: 'same first name',
    inits: 'initials match',
    title: 'same booked meeting title',
  };

  // The evidence a human needs to judge "are these one person?". name_source and
  // name_confidence are stored by 3a and surfaced HERE for the first time — a
  // title-sourced name is the BOOKED name and much weaker evidence than a
  // grader-sourced one.
  function mergeCallRowHtml(c) {
    var src = c.name_source ? '<span class="merge-src ' + escapeHtml(c.name_source) + '">' + escapeHtml(c.name_source) + '</span>' : '';
    var conf = c.name_confidence ? '<span class="merge-conf ' + escapeHtml(c.name_confidence) + '">' + escapeHtml(c.name_confidence) + '</span>' : '';
    return '<div class="merge-call">'
      + '<div class="merge-call-top">'
        + '<span class="merge-date">' + escapeHtml(formatDate(c.call_date)) + '</span>'
        + '<span class="merge-outcome ' + escapeHtml(c.outcome || 'none') + '">' + escapeHtml(c.outcome || 'no outcome') + '</span>'
        + src + conf
      + '</div>'
      + '<div class="merge-title">' + escapeHtml(c.title || 'untitled') + '</div>'
      + (c.prose_opening ? '<div class="merge-prose">' + escapeHtml(c.prose_opening) + '…</div>' : '')
    + '</div>';
  }

  function mergeSideHtml(p) {
    return '<div class="merge-side">'
      + '<div class="merge-name">' + escapeHtml(p.display_name) + '</div>'
      + '<div class="merge-callcount">' + p.calls.length + ' call' + (p.calls.length === 1 ? '' : 's') + '</div>'
      + p.calls.map(mergeCallRowHtml).join('')
    + '</div>';
  }

  function mergeCandidateHtml(c, i) {
    // State the rate consequence up front. It is NOT always positive: merging two
    // CLOSED prospects drops the numerator too, so the rate can fall.
    var d = c.rate_impact || {};
    var impact = (d.closed_delta === 0)
      ? 'closed unchanged, prospects −1 → rate rises slightly'
      : 'closed −1, prospects −1 → rate falls slightly';
    return '<div class="merge-card">'
      + '<div class="merge-head">'
        + '<span class="merge-reason">' + escapeHtml(MERGE_REASON_LABEL[c.reason] || c.reason) + '</span>'
        + '<span class="merge-impact">' + escapeHtml(impact) + '</span>'
      + '</div>'
      + '<div class="merge-body">' + mergeSideHtml(c.a) + '<div class="merge-vs">same person?</div>' + mergeSideHtml(c.b) + '</div>'
      + '<div class="merge-actions">'
        + '<button class="merge-btn keep" onclick="dismissMerge(' + i + ')">Not the Same</button>'
        + '<button class="merge-btn do" onclick="applyMerge(\'' + escapeHtml(c.a.id) + '\',\'' + escapeHtml(c.b.id) + '\',' + i + ')">Merge into &ldquo;' + escapeHtml(c.b.display_name) + '&rdquo;</button>'
        + '<button class="merge-btn do" onclick="applyMerge(\'' + escapeHtml(c.b.id) + '\',\'' + escapeHtml(c.a.id) + '\',' + i + ')">Merge into &ldquo;' + escapeHtml(c.a.display_name) + '&rdquo;</button>'
      + '</div>'
    + '</div>';
  }

  function renderProspectsView() {
    var content = document.getElementById('content');
    if (!content) return;
    var cands = state.mergeCandidates || [];
    var body;
    if (state.mergeLoading) body = '<div class="empty-card"><p>Loading…</p></div>';
    else if (!cands.length) {
      body = '<div class="empty-card"><h2>No merge suggestions</h2>'
        + '<p>Every prospect looks distinct. Suggestions appear when two prospects share a name, initials, or the same booked meeting title.</p></div>';
    } else {
      body = '<div class="merge-list">' + cands.map(mergeCandidateHtml).join('') + '</div>';
    }
    content.innerHTML = '<div class="page-header"><div><h1>Prospects</h1>'
      + '<p class="page-sub">Merge suggestions — a prospect counted twice makes your close rate read low. Nothing merges without your confirmation, and every merge can be undone.</p></div></div>'
      + body;
  }

  function dismissMerge(i) {
    // Dismiss is view-only: the proposal is regenerated next load. Persisting
    // "not the same" is a separate decision — a stored rejection list would need
    // its own table and its own undo.
    (state.mergeCandidates || []).splice(i, 1);
    renderProspectsView();
  }

  async function applyMerge(fromId, intoId, i) {
    if (!window.confirm('Merge these two into one prospect?\n\nThis changes your close rate. It can be undone.')) return;
    var res;
    try {
      res = await fetch('/me/prospects/merge', {
        method: 'POST',
        headers: Object.assign({ 'Content-Type': 'application/json' }, authHeader()),
        body: JSON.stringify({ from_id: fromId, into_id: intoId }),
      });
    } catch (err) { window.alert('Could not reach server: ' + err.message); return; }
    if (res.status === 401) { clearSession(); window.location.replace('/login'); return; }
    if (!res.ok) {
      var e; try { e = await res.json(); } catch (x) { e = { error: 'HTTP ' + res.status }; }
      window.alert('Merge failed: ' + (e.error || 'unknown'));
      return;
    }
    await loadMergeCandidates();
  }

  function renderKbView() {
    var content = document.getElementById('content');
    var canManage = kbCanManage();
    var sub = canManage
      ? 'Offer docs &amp; scripts that ground coaching'
      : 'Your team’s offer docs &amp; scripts — what Scout grades your calls against (view only)';
    var addBtn = canManage ? '<div class="page-header-side"><button class="kb-add-btn" onclick="openKbModal()">+ Add resource</button></div>' : '';
    content.innerHTML =
      '<div class="page-header fade-in"><div class="page-header-main"><h1>Knowledge Base</h1>'
        + '<div class="review-meta-row"><span>' + sub + '</span></div></div>'
        + addBtn
      + '</div>'
      + '<div class="section fade-in"><div id="kbContainer"><div class="load-spinner"><div class="spinner"></div></div></div></div>';
    loadKbList(); // lazy — only on view entry, never on page init
  }
  async function loadKbList() {
    var container = document.getElementById('kbContainer');
    if (!container) return;
    var res;
    try {
      res = await fetch('/kb/list', { headers: authHeader() });
    } catch (err) {
      container.innerHTML = '<div class="msg-error">Could not reach server.</div>';
      return;
    }
    if (res.status === 401) { clearSession(); window.location.replace('/login'); return; }
    if (!res.ok) {
      var err;
      try { err = await res.json(); } catch (e) { err = { error: 'HTTP ' + res.status }; }
      container.innerHTML = '<div class="msg-error">' + escapeHtml(err.error || 'Failed to load uploads') + '</div>';
      return;
    }
    var data = await res.json();
    renderKbList((data && data.uploads) || []);
  }

  // PROSPECT NAMES 3a — what to LABEL a call with. Prefers the resolved prospect
  // name (call_analyses.prospect_name); falls back to the raw meeting title only
  // when no name was resolved. A null resolution renders "Unknown prospect"
  // rather than a meeting label — a wrong name is worse than no name.
  function callLabel(c) {
    var n = c && c.prospect_name;
    if (n && String(n).trim()) return String(n).trim();
    return null;
  }

  // PROSPECT NAMES 3d-3 — THE single close-rate display. Every site that shows a
  // close rate routes through this, so the coaching tile, the team glance box and
  // the team score list cannot drift into different definitions (which is exactly
  // what "closed / (closed + lost) — decided calls only" had become, in three
  // places, before this).
  //
  // Definition: closed PROSPECTS / TOTAL prospects. A prospect who takes three
  // calls to close counts ONCE; an open prospect counts as not-closed. Raw counts
  // always travel with the percentage, per the house rule.
  function closeRateDisplay(o) {
    var src = o || {};
    var pct = src.prospect_close_rate;
    var won = src.prospect_close_wins;
    var tot = src.prospect_close_total;
    if (pct == null || !tot) return { value: '\u2014', sub: 'no prospects yet' };
    return { value: pct + '%', sub: won + ' of ' + tot + ' prospects' };
  }


  // ── SECTION DRILLDOWN (stage 4a/4b) ─────────────────────────────────────
  // Clicking a Coach-summary bar shows the MOMENTS over the period that earned
  // that score, plus how to improve — drawn from calls that went well.
  //
  // Close reads close_score_earned (migration 027 forces the displayed score to
  // 100 on closed calls). The discrepancy is LABELLED rather than hidden.
  var SECTION_LABEL = { intro: 'Intro', discovery: 'Discovery', pitch: 'Pitch', objection: 'Objection', close: 'Close' };

  function goSection(key) {
    state.selectedSection = key;
    state.sectionData = null;
    state.sectionError = null;
    // ⚠ SET THE LOADING FLAG BEFORE setView, NOT AFTER. setView renders
    // immediately; loadSectionBreakdown only sets the flag once it starts, so
    // the first paint saw sectionLoading=false + sectionData=null and fell into
    // the FAILURE branch — which then stayed on screen for the entire request,
    // not for a frame.
    state.sectionLoading = true;
    state.sectionExpanded = {};
    setView('section');
    loadSectionBreakdown(key);
  }
  function backFromSection() { state.selectedSection = null; state.sectionData = null; setView('overview'); }

  async function loadSectionBreakdown(key) {
    state.sectionLoading = true;
    var qp = 'from=' + encodeURIComponent(state.dateRange.from) + '&to=' + encodeURIComponent(state.dateRange.to);
    // Manager pivot (ruling 3) — same ?user= convention as every other coaching
    // surface, routed through the standard /admin mirror.
    var url = state.viewingUserId
      ? '/admin/sections/' + encodeURIComponent(state.viewingUserId) + '/' + encodeURIComponent(key) + '?' + qp
      : '/me/sections/' + encodeURIComponent(key) + '?' + qp;
    try {
      var res = await fetch(url, { headers: authHeader() });
      if (res.status === 401) { clearSession(); window.location.replace('/login'); return; }
      state.sectionData = res.ok ? await res.json() : null;
      state.sectionError = res.ok ? null : ('HTTP ' + res.status);
    } catch (err) { state.sectionData = null; state.sectionError = (err && err.message) || 'network error'; }
    state.sectionLoading = false;
    if (state.view === 'section') renderSectionView();
  }

  function sectionMomentHtml(m, canSave) {
    var when = m.call_date ? formatDate(m.call_date) : '';
    var who = m.prospect_name ? escapeHtml(m.prospect_name) : 'Unknown prospect';
    var time = (m.clip_url && typeof m.timestamp_seconds === 'number')
      ? '<a class="sec-clip" href="' + escapeHtml(m.clip_url) + '" target="_blank" rel="noopener">' + escapeHtml(formatTimestampDisplay(m.timestamp_seconds)) + '</a>'
      : '<span class="sec-clip disabled">—</span>';
    // 4b: harvested moments carry a "saved" badge; unsaved rows get the
    // Add-to-KB button, reusing POST /kb/from-highlight unchanged (it takes ids
    // and re-reads the row server-side).
    var kb = m.saved_to_kb
      ? '<span class="sec-saved">saved</span>'
      : (canSave && m.highlight_id
          ? '<button class="sec-kb-btn" data-hid="' + escapeHtml(String(m.highlight_id)) + '" data-cid="' + escapeHtml(String(m.fathom_call_id)) + '" onclick="addSectionMomentToKb(this)">+ Save</button>'
          : '');
    return '<div class="sec-moment">'
      + '<div class="sec-moment-top">' + time + '<span class="sec-who">' + who + '</span><span class="sec-when">' + escapeHtml(when) + '</span>' + kb + '</div>'
      + '<div class="sec-quote">' + escapeHtml(m.quote || '') + '</div>'
      + (m.observation ? '<div class="sec-obs">' + escapeHtml(m.observation) + '</div>' : '')
    + '</div>';
  }

  // Plain-language read of the distribution. Justin couldn't tell what the
  // histogram was FOR, and a chart nobody can read is decoration. Rather than
  // drop it, it now states its own point in a sentence — the bars are the
  // evidence for the sentence, not the message.
  function histogramRead(h, avg, label, lo, hi) {
    var counted = h.filter(function (b) { return b.count > 0; });
    if (!counted.length || avg == null) return '';
    var total = h.reduce(function (n, b) { return n + b.count; }, 0);
    var span = counted.length;
    // Quote the REAL lowest and highest score, never the bucket edges.
    if (typeof lo !== 'number' || typeof hi !== 'number') { lo = counted[0].lo; hi = counted[counted.length - 1].hi; }
    var sec = String(label).toLowerCase();
    if (span === 1) {
      return 'Your ' + sec + ' scores are consistently ' + lo + '-' + hi + ' — a steady level, not a mix of good and bad calls.';
    }
    // Where the weight sits matters more than the extremes.
    var biggest = counted.slice().sort(function (a, b) { return b.count - a.count; })[0];
    var share = Math.round((biggest.count / total) * 100);
    if (span >= 4) {
      return 'Your ' + sec + ' scores range from ' + lo + ' to ' + hi
        + ' — the issue is consistency rather than a ceiling. Most calls land in ' + biggest.label + ' (' + share + '%).';
    }
    return 'Your ' + sec + ' scores range from ' + lo + ' to ' + hi
      + ', with most in ' + biggest.label + ' (' + share + '%).';
  }

  function sectionHistogramHtml(h, usesEarned, avg, label, lo, hi) {
    var max = Math.max.apply(null, h.map(function (b) { return b.count; }).concat([1]));
    var bars = h.map(function (b) {
      var pct = Math.round((b.count / max) * 100);
      return '<div class="sec-hbar"><div class="sec-hbar-fill" style="height:' + pct + '%"></div>'
        + '<div class="sec-hbar-n">' + b.count + '</div><div class="sec-hbar-l">' + escapeHtml(b.label) + '</div></div>';
    }).join('');
    // Ruling 1: state the close discrepancy plainly rather than hide it.
    var note = usesEarned
      ? '<div class="sec-note">Uses the score this section actually earned. Closed calls display 100 for Close elsewhere on the dashboard.</div>'
      : '';
    var read = histogramRead(h, avg, label, lo, hi);
    return (read ? '<div class="sec-read">' + escapeHtml(read) + '</div>' : '')
      + '<div class="sec-hist">' + bars + '</div>' + note;
  }

  // 6d — a closer moment: what the REP said, led by their own line, with the
  // prospect's preceding line beneath it as context. Only PROVEN moments reach
  // here (the server filters on speaker_verified), so this is the one surface
  // that may say "you" about a quote.
  function closerMomentHtml(m, canSave) {
    var when = m.call_date ? formatDate(m.call_date) : '';
    var who = m.prospect_name ? escapeHtml(m.prospect_name) : 'Unknown prospect';
    var time = (m.clip_url && typeof m.timestamp_seconds === 'number')
      ? '<a class="sec-clip" href="' + escapeHtml(m.clip_url) + '" target="_blank" rel="noopener">' + escapeHtml(formatTimestampDisplay(m.timestamp_seconds)) + '</a>'
      : '<span class="sec-clip disabled">—</span>';
    var kb = m.saved_to_kb
      ? '<span class="sec-saved">saved</span>'
      : (canSave && m.highlight_id
          ? '<button class="sec-kb-btn" data-hid="' + escapeHtml(String(m.highlight_id)) + '" data-cid="' + escapeHtml(String(m.fathom_call_id)) + '" onclick="addSectionMomentToKb(this)">+ Save</button>'
          : '');
    // Context is explicitly attributed to the prospect and never to the rep.
    var ctx = (m.context && m.context.quote)
      ? '<div class="sec-ctx"><span class="sec-ctx-label">' + who + ' had just said</span>'
        + '<span class="sec-ctx-q">' + escapeHtml(m.context.quote) + '</span></div>'
      : '';
    return '<div class="sec-moment sec-moment-closer">'
      + '<div class="sec-moment-top">' + time + '<span class="sec-who">' + who + '</span><span class="sec-when">' + escapeHtml(when) + '</span>' + kb + '</div>'
      + '<div class="sec-quote sec-quote-you"><span class="sec-you-label">You said</span>' + escapeHtml(m.quote || '') + '</div>'
      + ctx
      + (m.observation ? '<div class="sec-obs">' + escapeHtml(m.observation) + '</div>' : '')
    + '</div>';
  }

  // Say plainly what is being withheld and why. Two different reasons, two
  // different messages — collapsing them into one number would read as though
  // the data is merely sparse, when for some rows we never had any means to
  // check who was speaking.
  function closerHiddenNoteHtml(c) {
    if (!c) return '';
    var bits = [];
    if (c.hidden_unverified) bits.push(c.hidden_unverified + ' where we could not confirm who was speaking');
    if (c.hidden_unassessed) bits.push(c.hidden_unassessed + ' from calls with no speaker identity on file');
    if (!bits.length) return '';
    return '<div class="sec-note">Not shown: ' + escapeHtml(bits.join(', '))
      + '. These are excluded rather than guessed — a moment shown as yours has been matched to the transcript.</div>';
  }

  var SECTION_MOMENTS_SHOWN = 5;
  function sectionGroupHtml(key, title, moments, canSave, renderer) {
    var renderMoment = renderer || sectionMomentHtml;
    var expanded = !!(state.sectionExpanded && state.sectionExpanded[key]);
    var shown = expanded ? moments : moments.slice(0, SECTION_MOMENTS_SHOWN);
    var hidden = moments.length - shown.length;
    var more = '';
    if (hidden > 0) {
      more = '<button class="sec-more" onclick="expandSectionGroup(\'' + key + '\')">Show ' + hidden + ' more</button>';
    } else if (expanded && moments.length > SECTION_MOMENTS_SHOWN) {
      more = '<button class="sec-more" onclick="expandSectionGroup(\'' + key + '\')">Show Fewer</button>';
    }
    return '<div class="sec-group"><h2>' + escapeHtml(title) + ' <span class="sec-count">' + moments.length + '</span></h2>'
      + shown.map(function (m) { return renderMoment(m, canSave); }).join('') + more + '</div>';
  }
  function expandSectionGroup(key) {
    if (!state.sectionExpanded) state.sectionExpanded = {};
    state.sectionExpanded[key] = !state.sectionExpanded[key];
    renderSectionView();
  }

  function renderSectionView() {
    var content = document.getElementById('content');
    if (!content) return;
    var key = state.selectedSection;
    var label = SECTION_LABEL[key] || key;
    var head = '<div class="page-header"><div>'
      + '<a class="sec-back" onclick="backFromSection(); return false;">&larr; Back to coaching</a>'
      + '<h1>' + escapeHtml(label) + '</h1></div></div>';

    // Three states, deliberately distinct. Renaming the failure copy to
    // "Loading" would have hidden a genuine failure behind a spinner forever;
    // showing the failure copy while loading told the user something was broken
    // when nothing was.
    if (state.sectionLoading) { content.innerHTML = head + '<div class="empty-card"><p>Loading…..</p></div>'; return; }
    var d = state.sectionData;
    if (!d) {
      var why = state.sectionError ? '<p>' + escapeHtml(state.sectionError) + '</p>' : '';
      content.innerHTML = head + '<div class="empty-card"><h2>Could not load this section</h2>' + why + '</div>';
      return;
    }

    var delta = '';
    if (typeof d.average === 'number' && typeof d.prior_average === 'number' && d.prior_average > 0) {
      var diff = d.average - d.prior_average;
      var cls = diff > 0 ? 'up' : (diff < 0 ? 'down' : '');
      delta = '<span class="sec-delta ' + cls + '">' + (diff > 0 ? '▲ +' : (diff < 0 ? '▼ ' : '')) + diff + ' vs previous period</span>';
    }
    var headline = '<div class="sec-headline">'
      + '<div class="sec-avg">' + (d.average == null ? '—' : d.average) + '</div>'
      + '<div class="sec-meta"><div>average across ' + d.scored_calls + ' call' + (d.scored_calls === 1 ? '' : 's') + '</div>'
      + '<div>' + (d.rank ? 'ranked ' + d.rank + ' of ' + d.section_count + ' sections' : 'not ranked') + '</div>' + delta + '</div>'
    + '</div>';

    // Coverage honesty — objection reads thin, and that is information.
    var cov = d.coverage || {};
    var coverage = '<div class="sec-coverage">' + cov.moments + ' moment' + (cov.moments === 1 ? '' : 's')
      + ' from ' + cov.calls_with_moments + ' of your ' + cov.calls_total + ' calls'
      + (d.bad_outnumber_good ? ' · <strong class="sec-warn">more went wrong than right in this section</strong>' : '')
    + '</div>';

    var canSave = !state.viewingUserId; // saving into someone else's KB is not this screen's job
    // Show 5, hide the rest behind an expander. 48 good discovery moments as a
    // single wall is unreadable; the first few are the point and the rest are
    // there when wanted.
    // 6d: "What worked" is the REP's own proven moments. Everything else that
    // happened to go well stays out of this lane rather than being attributed
    // to them on the strength of a model's guess.
    var closer = d.closer_moments || [];
    var groups = '';
    if (closer.length) {
      groups += sectionGroupHtml('good', 'What worked', closer, canSave, closerMomentHtml);
      groups += closerHiddenNoteHtml(d.closer_counts);
    } else if (d.good.length) {
      // Moments exist, but none are provably the rep's. Say that, rather than
      // filling the space with moments that may be the prospect's words.
      groups += '<div class="empty-card"><h2>No confirmed moments of your own in ' + escapeHtml(label) + ' yet</h2>'
        + '<p>There are ' + d.good.length + ' good moments in this range, but none could be matched to you in the transcript, '
        + 'so none are shown here as yours.</p></div>'
        + closerHiddenNoteHtml(d.closer_counts);
    }
    if (d.bad.length)  groups += sectionGroupHtml('bad', 'What to fix', d.bad, canSave);
    if (!d.good.length && !d.bad.length) {
      groups = '<div class="empty-card"><h2>No tagged moments for ' + escapeHtml(label) + ' in this range</h2>'
        + '<p>Section moments come from calls analysed recently. Widen the date range or analyse more calls.</p></div>';
    }

    // Ruling 2: notes are two labelled EXAMPLES, never an aggregate.
    var ex = d.examples || {};
    var examples = '';
    if (ex.best || ex.worst) {
      examples = '<div class="sec-group"><h2>Two calls, for contrast</h2>'
        + (ex.best ? '<div class="sec-example"><div class="sec-ex-head">Best ' + escapeHtml(label) + ' — ' + (ex.best.score) + (ex.best.prospect_name ? ' · ' + escapeHtml(ex.best.prospect_name) : '') + '</div><div class="sec-obs">' + escapeHtml(ex.best.notes || '') + '</div></div>' : '')
        + (ex.worst ? '<div class="sec-example"><div class="sec-ex-head">Weakest ' + escapeHtml(label) + ' — ' + (ex.worst.score) + (ex.worst.prospect_name ? ' · ' + escapeHtml(ex.worst.prospect_name) : '') + '</div><div class="sec-obs">' + escapeHtml(ex.worst.notes || '') + '</div></div>' : '')
      + '</div>';
    }

    content.innerHTML = head + headline + coverage
      + sectionHistogramHtml(d.histogram || [], d.uses_earned_close_score, d.average, label, d.min_score, d.max_score) + groups + examples;
  }

  async function addSectionMomentToKb(btn) {
    var hid = btn.getAttribute('data-hid'), cid = btn.getAttribute('data-cid');
    if (!hid || !cid) return;
    btn.disabled = true; btn.textContent = 'Saving…';
    var res;
    try {
      res = await fetch('/kb/from-highlight', {
        method: 'POST',
        headers: Object.assign({ 'Content-Type': 'application/json' }, authHeader()),
        body: JSON.stringify({ fathom_call_id: cid, highlight_id: hid }),
      });
    } catch (err) { btn.disabled = false; btn.textContent = '+ Save'; window.alert('Could not reach server: ' + err.message); return; }
    if (res.status === 401) { clearSession(); window.location.replace('/login'); return; }
    if (!res.ok) { btn.disabled = false; btn.textContent = '+ Save'; window.alert('Could not save that moment'); return; }
    btn.outerHTML = '<span class="sec-saved">saved</span>';
  }

  function renderKbList(items) {
    var container = document.getElementById('kbContainer');
    if (!container) return;
    var canManage = kbCanManage();

    if (!items || items.length === 0) {
      container.innerHTML = canManage
        ? '<div class="empty-card">'
            + '<h2>No knowledge base resources yet</h2>'
            + '<p>Upload your offer docs, scripts, and winning calls. Scout grounds its post-call grading and coaching in these — the more it has, the sharper your feedback.</p>'
            + '<button class="kb-add-btn" onclick="openKbModal()">+ Add your first resource</button>'
          + '</div>'
        : '<div class="empty-card">'
            + '<h2>No team resources yet</h2>'
            + '<p>Your team’s offer docs, scripts, and winning calls will appear here once your manager adds them — they’re what Scout grades your calls against.</p>'
          + '</div>';
      return;
    }

    var parts = ['<div class="kb-list">'];
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      var typeBadge = it.source_type
        ? '<span class="kb-badge kb-type-' + escapeHtml(it.source_type) + '">' + escapeHtml(it.source_type) + '</span>'
        : '';
      // Category badge — only when category is set (pre-feature uploads
      // don't have it). Friendly labels rather than the raw enum value.
      var catLabels = {
        script: 'Script',
        offer_document: 'Offer info',
        objection_framework: 'Objection handling framework',
        winning_call: 'Winning call transcript',
        case_study: 'Case study / social proof',
        training_material: 'Training material',
        // Part 2b: moments harvested from call reviews. Deliberately NOT a
        // grader/synthesis category (ruling 1) — see lib/kb-entry.js.
        call_moment: 'Call moment',
      };
      var catBadge = (it.category && catLabels[it.category])
        ? '<span class="kb-badge kb-cat-' + escapeHtml(it.category) + '">' + escapeHtml(catLabels[it.category]) + '</span>'
        : '';
      // Scope badge stays on admin: admins see uploads with mixed scopes
      // (own personal/team plus their team members') so the badge tells
      // them which is which. Dashboard hides it because users only ever
      // see their own personal uploads.
      var scopeBadge = it.scope
        ? '<span class="kb-badge kb-scope-' + escapeHtml(it.scope) + '">' + escapeHtml(it.scope) + '</span>'
        : '';
      var chunkText = it.chunk_count + ' chunk' + (it.chunk_count === 1 ? '' : 's');
      var rel = relativeTime(it.created_at);
      // Only learned_pattern uploads get the expand affordance — other
      // categories are bulk text whose chunks aren't independently useful
      // to surface in a side panel.
      var viewBtn = '';
      var expandPanel = '';
      if (it.category === 'learned_pattern' || it.category === 'call_moment') {
        viewBtn = '<button class="kb-view-btn" data-label="' + escapeHtml(it.source_label) + '" data-slot="' + i + '" onclick="viewKbEntries(this.getAttribute(\'data-label\'), this.getAttribute(\'data-slot\'), this)">View Patterns</button>';
        expandPanel = '<div class="kb-expand-panel hidden" id="kbExpand-' + i + '"></div>';
      }
      // Promotion affordance (KB Part 2, sub-stage 2a). Manager/owner only — a
      // plain unmanaged user has no team to promote INTO, so showing them the
      // button would only produce a 400. Global (owner-wide) resources are not
      // re-scopable through this route, so they get no button either.
      var promoteBtn = '';
      if (kbCanPromote() && it.scope !== 'global') {
        promoteBtn = (it.scope === 'team')
          ? '<button class="kb-promote-btn is-team" data-label="' + escapeHtml(it.source_label) + '" onclick="setKbScope(this.getAttribute(\'data-label\'), \'personal\')" title="Remove from the team knowledge base">Team ✓</button>'
          : '<button class="kb-promote-btn" data-label="' + escapeHtml(it.source_label) + '" onclick="setKbScope(this.getAttribute(\'data-label\'), \'team\')" title="Share with your whole team">Promote to Team</button>';
      }
      parts.push(
        '<div class="kb-item">'
          + '<div class="kb-item-main">'
            + '<div class="kb-item-title">' + typeBadge + catBadge + scopeBadge + escapeHtml(it.source_label || '(unlabeled)') + '</div>'
            + '<div class="kb-item-sub">' + chunkText + ' · added ' + rel + '</div>'
          + '</div>'
          + viewBtn

  // Promote a resource into the team KB, or pull it back to personal.
  // PATCH /kb/:source_label/scope. Provenance (who uploaded it) is never
  // rewritten server-side — only the team key changes.
  async function setKbScope(sourceLabel, targetScope) {
    if (!sourceLabel || (targetScope !== 'team' && targetScope !== 'personal')) return;
    var msg = (targetScope === 'team')
      ? 'Promote "' + sourceLabel + '" to the team knowledge base?\n\nEveryone on your team will be able to see it, and Scout will ground their coaching in it.'
      : 'Remove "' + sourceLabel + '" from the team knowledge base?\n\nIt goes back to being personal to whoever uploaded it. Nothing is deleted.';
    if (!window.confirm(msg)) return;

    var res;
    try {
      res = await fetch('/kb/' + encodeURIComponent(sourceLabel) + '/scope', {
        method: 'PATCH',
        headers: Object.assign({ 'Content-Type': 'application/json' }, authHeader()),
        body: JSON.stringify({ scope: targetScope }),
      });
    } catch (err) {
      window.alert('Could not reach server: ' + err.message);
      return;
    }
    if (res.status === 401) { clearSession(); window.location.replace('/login'); return; }
    if (!res.ok) {
      var err2;
      try { err2 = await res.json(); } catch (e) { err2 = { error: 'HTTP ' + res.status }; }
      window.alert('Could not change scope: ' + (err2.error || 'unknown error'));
      return;
    }
    await loadKbList();
  }

  async function deleteKbItem(sourceLabel) {
    if (!sourceLabel) return;
    var ok = window.confirm('Delete "' + sourceLabel + '"?\n\nThis removes all chunks for this resource. Cannot be undone.');
    if (!ok) return;

    var res;
    try {
      res = await fetch('/kb/' + encodeURIComponent(sourceLabel), {
        method: 'DELETE',
        headers: authHeader(),
      });
    } catch (err) {
      window.alert('Could not reach server: ' + err.message);
      return;
    }
    if (res.status === 401) { clearSession(); window.location.replace('/login'); return; }
    if (!res.ok) {
      var err;
      try { err = await res.json(); } catch (e) { err = { error: 'HTTP ' + res.status }; }
      window.alert('Delete failed: ' + (err.error || 'unknown error'));
      return;
    }
    await loadKbList();
  }

  function openKbModal() {
    var modal = document.getElementById('kbModal');
    if (!modal) return;
    // Reset form state every time the modal opens — switching to URL tab,
    // clearing inputs, resetting category to default, hiding any leftover
    // error from a previous attempt.
    switchKbTab('url');
    var ids = ['kbLabel','kbUrlInput','kbPdfInput','kbPasteInput'];
    for (var i = 0; i < ids.length; i++) {
      var el = document.getElementById(ids[i]);
      if (el) el.value = '';
    }
    var cat = document.getElementById('kbCategory');
    if (cat) cat.value = 'offer_document';
    setKbStatus('', '');
    var submit = document.getElementById('kbSubmit');
    if (submit) { submit.disabled = false; submit.textContent = 'Add to Knowledge Base'; }
    modal.classList.remove('hidden');
  }

  function closeKbModal() {
    var modal = document.getElementById('kbModal');
    if (modal) modal.classList.add('hidden');
  }

  function switchKbTab(tab) {
    var tabs = document.querySelectorAll('#kbModal .kb-tab');
    for (var i = 0; i < tabs.length; i++) {
      var t = tabs[i];
      if (t.getAttribute('data-tab') === tab) t.classList.add('active');
      else t.classList.remove('active');
    }
    var panels = document.querySelectorAll('#kbModal .kb-tab-panel');
    for (var j = 0; j < panels.length; j++) {
      var p = panels[j];
      if (p.getAttribute('data-panel') === tab) p.classList.remove('hidden');
      else p.classList.add('hidden');
    }
    setKbStatus('', '');
  }

  function setKbStatus(message, kind) {
    var el = document.getElementById('kbStatus');
    if (!el) return;
    el.textContent = message || '';
    el.classList.remove('error', 'progress');
    if (kind === 'error') el.classList.add('error');
    else if (kind === 'progress') el.classList.add('progress');
  }

  function getActiveKbTab() {
    var active = document.querySelector('#kbModal .kb-tab.active');
    return active ? active.getAttribute('data-tab') : 'url';
  }

  async function submitKbUpload() {
    var tab = getActiveKbTab();
    var label = (document.getElementById('kbLabel').value || '').trim();
    var category = (document.getElementById('kbCategory').value || 'offer_document');

    // Label is required for every type now — it's what shows in the list
    // and what Claude references in [WINNING CALL: …] / [OFFER DOCUMENT: …]
    // context lines, so a meaningful name matters more than the source.
    if (!label) { setKbStatus('Give this resource a label.', 'error'); return; }

    var fd = new FormData();
    fd.append('type', tab);
    fd.append('label', label);
    fd.append('category', category);

    if (tab === 'url') {
      var url = (document.getElementById('kbUrlInput').value || '').trim();
      if (!url) { setKbStatus('Enter a URL.', 'error'); return; }
      fd.append('url', url);
    } else if (tab === 'pdf') {
      var fileEl = document.getElementById('kbPdfInput');
      if (!fileEl || !fileEl.files || !fileEl.files[0]) { setKbStatus('Select a PDF file.', 'error'); return; }
      fd.append('file', fileEl.files[0]);
    } else if (tab === 'paste') {
      var text = (document.getElementById('kbPasteInput').value || '').trim();
      if (!text) { setKbStatus('Paste some content.', 'error'); return; }
      fd.append('text', text);
    } else {
      setKbStatus('Pick a tab.', 'error');
      return;
    }

    var submit = document.getElementById('kbSubmit');
    if (submit) { submit.disabled = true; submit.textContent = 'Processing…'; }
    setKbStatus('Processing… this may take a moment for large documents.', 'progress');

    var res;
    try {
      res = await fetch('/kb/upload', {
        method: 'POST',
        headers: authHeader(),
        body: fd,
      });
    } catch (err) {
      setKbStatus('Could not reach server: ' + err.message, 'error');
      if (submit) { submit.disabled = false; submit.textContent = 'Add to Knowledge Base'; }
      return;
    }

    if (res.status === 401) { clearSession(); window.location.replace('/login'); return; }
    if (!res.ok) {
      var errData;
      try { errData = await res.json(); } catch (e) { errData = { error: 'HTTP ' + res.status }; }
      setKbStatus(errData.error || 'Upload failed', 'error');
      if (submit) { submit.disabled = false; submit.textContent = 'Add to Knowledge Base'; }
      return;
    }

    closeKbModal();
    await loadKbList();
  }

  // Per-source-label cache so reopening a panel after first load doesn't
  // refetch. Cleared implicitly on full page reload — short-lived enough
  // that staleness from a delete-then-reopen is impossible (delete already
  // forces loadKbList(), which doesn't touch this cache, but the panel
  // wouldn't re-render anyway because the kb-item is gone).
  var kbEntriesCache = {};

  async function viewKbEntries(sourceLabel, slot, btn) {
    var panel = document.getElementById('kbExpand-' + slot);
    if (!panel) return;

    // Toggle: if currently visible, just collapse. No fetch, button text reverts.
    if (!panel.classList.contains('hidden')) {
      panel.classList.add('hidden');
      btn.textContent = 'View patterns';
      return;
    }

    // Opening
    btn.textContent = 'Hide patterns';
    panel.classList.remove('hidden');

    if (kbEntriesCache[sourceLabel]) {
      renderKbEntries(panel, kbEntriesCache[sourceLabel]);
      return;
    }

    panel.innerHTML = '<div class="kb-pattern-loading">Loading…</div>';
    var res;
    try {
      res = await fetch('/kb/entries/' + encodeURIComponent(sourceLabel), { headers: authHeader() });
    } catch (err) {
      panel.innerHTML = '<div class="kb-pattern-empty">Could not reach server.</div>';
      return;
    }
    if (res.status === 401) { clearSession(); window.location.replace('/login'); return; }
    if (!res.ok) {
      panel.innerHTML = '<div class="kb-pattern-empty">Failed to load patterns.</div>';
      return;
    }
    var data = await res.json();
    var entries = (data && data.entries) || [];
    kbEntriesCache[sourceLabel] = entries;
    renderKbEntries(panel, entries);
  }

  function renderKbEntries(panel, entries) {
    if (!entries || entries.length === 0) {
      panel.innerHTML = '<div class="kb-pattern-empty">No patterns found.</div>';
      return;
    }
    var parts = [];
    for (var i = 0; i < entries.length; i++) {
      var e = entries[i];
      var meta = e.metadata || {};
      // Pattern entries (auto-extracted) carry situation/response/outcome
      // in metadata. Pre-feature uploads or any entry missing those fields
      // fall back to showing raw content text — keeps the panel useful
      // even on legacy data.
      if (meta.situation || meta.response || meta.outcome) {
        var typeRaw = String(meta.type || '');
        var typeLabel = typeRaw.replace(/_/g, ' ');
        var typeClass = typeRaw.replace(/[^a-z_]/g, '');
        var typeBadge = typeClass
          ? '<span class="kb-badge kb-ptype-' + typeClass + '">' + escapeHtml(typeLabel) + '</span>'
          : '';
        parts.push(
          '<div class="kb-pattern-card">'
            + (typeBadge ? '<div>' + typeBadge + '</div>' : '')
            + (meta.situation ? '<div class="kb-pattern-row"><b>Situation:</b> <span class="kb-pattern-text">' + escapeHtml(meta.situation) + '</span></div>' : '')
            + (meta.response  ? '<div class="kb-pattern-row"><b>Closer said:</b> <span class="kb-pattern-text">' + escapeHtml(meta.response) + '</span></div>' : '')
            + (meta.outcome   ? '<div class="kb-pattern-row"><b>Prospect reacted:</b> <span class="kb-pattern-text">' + escapeHtml(meta.outcome) + '</span></div>' : '')
          + '</div>'
        );
      } else {
        parts.push('<div class="kb-pattern-card"><div class="kb-pattern-empty-text">' + escapeHtml(e.content || '(empty)') + '</div></div>');
      }
    }
    panel.innerHTML = parts.join('');
  }

  function setView(view) {
    if (view === 'prospects' && !state.mergeLoading) loadMergeCandidates();
    state.view = view;
