  function objStatCard(label, big, small) {
    return '<div style="flex:1;border:1px solid var(--border);border-radius:12px;padding:18px;text-align:center;">'
      + '<div style="font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:0.04em;">' + escapeHtml(label) + '</div>'
      + '<div style="font-size:30px;font-weight:700;margin:6px 0 2px;">' + escapeHtml(String(big)) + '</div>'
      + '<div style="font-size:12px;color:var(--muted);">' + escapeHtml(small) + '</div>'
      + '</div>';
  }

  // Collapse/expand helpers for objection cards (operate on the clicked card).
  function toggleObjResponse(el) {
    var card = el.closest('.pattern-card'); if (!card) return;
    var box = card.querySelector('.obj-response'); if (!box) return;
    var showing = box.style.display === 'block';
    box.style.display = showing ? 'none' : 'block';
    el.textContent = showing ? 'Show response' : 'Hide response';
  }
  function toggleObjQuote(el) {
    var card = el.closest('.pattern-card'); if (!card) return;
    var q = card.querySelector('.obj-quote'); if (!q) return;
    q.classList.toggle('clamped');
    el.textContent = q.classList.contains('clamped') ? 'more' : 'less';
  }

  // Compact, scannable objection card: one-line header (surface + category +
  // resolution + call), clamped prospect quote, collapsed closer response,
  // footer buttons. Whole-card is NOT clickable — actions are explicit buttons.
  function objFeedCard(f) {
    var surface = f.surface
      ? '<span class="obj-surface">' + escapeHtml(f.surface) + '</span>'
      : '<span class="obj-surface" style="color:var(--muted);">objection</span>';
    var catChip = (f.category && f.category !== 'uncategorized')
      ? '<span class="scope-pill">' + escapeHtml(f.category) + '</span>' : '';
    var resBadge = f.resolution === 'handled' ? '<span class="badge badge-win">handled</span>'
      : (f.resolution === 'partial' ? '<span class="badge badge-fu">partial</span>'
      : (f.resolution === 'unhandled' ? '<span class="badge badge-loss">unresolved</span>' : ''));
    var quoteMore = (f.quote && f.quote.length > 120)
      ? ' <span class="obj-toggle" onclick="toggleObjQuote(this)">more</span>' : '';
    var respBlock = f.closer_response
      ? '<div style="margin-top:8px;"><span class="obj-toggle" onclick="toggleObjResponse(this)">Show response</span>'
        + '<div class="obj-response"><span style="color:var(--muted);">Closer: </span>' + escapeHtml(f.closer_response) + '</div></div>'
      : '';
    var clip = f.clip_url ? '<a class="obj-btn" href="' + escapeHtml(f.clip_url) + '" target="_blank" rel="noopener">▶ Watch clip</a>' : '';
    var review = '<button class="obj-btn" type="button" onclick="openCallReview(\'' + escapeHtml(f.fathom_call_id) + '\')">View call review</button>';
    return '<div class="pattern-card">'
      + '<div class="obj-card-head">' + surface + catChip + resBadge
        + '<span class="obj-callmeta">' + escapeHtml(f.title || 'Untitled call') + ' · ' + escapeHtml(formatDate(f.call_date)) + '</span>'
      + '</div>'
      + '<div class="obj-quote clamped">' + escapeHtml(f.quote || '') + '</div>' + quoteMore
      + (f.observation ? '<div class="pattern-meta"><span>' + escapeHtml(f.observation) + '</span></div>' : '')
      + respBlock
      + '<div class="obj-footer">' + clip + review + '</div>'
      + '</div>';
  }

  // Grounded coaching synthesis — a distinct panel ABOVE the feed. Structure
  // (ISOLATE / REFRAME / OVERCOME) ships now; content populates once the
  // synthesis generator is built (credit- + re-analysis-gated).
  function renderObjSynthPanel() {
    var s = state.objectionsSynthesis;
    var head = '<div class="section-header" style="margin:0 0 6px;"><h2 style="font-size:15px;">Coaching synthesis</h2>'
      + '<div class="meta">grounded in your own handled objections</div></div>';
    var body;
    if (s === null) {
      body = '<div class="load-state" style="padding:14px 4px;"><div class="spinner"></div> Generating coaching…</div>';
    } else if (!s.available) {
      body = '<div class="empty"><h3>Synthesis unavailable</h3><p>Could not generate coaching right now'
        + (s.reason ? ' (' + escapeHtml(s.reason) + ')' : '') + '. The objection data below is unaffected.</p></div>';
    } else if (!s.categories || s.categories.length === 0) {
      body = '<div class="empty"><h3>No categorized objections yet</h3><p>Once objections are categorized in this window, per-category coaching appears here.</p></div>';
    } else {
      body = s.categories.map(objSynthSection).join('');
    }
    return '<div class="synth-panel fade-in">' + head + body + '</div>';
  }

  function objSynthSection(c) {
    var labelMap = { fear: 'Fear', logistical: 'Logistical', timing: 'Timing', partner: 'Partner' };
    var tag = c.grounded
      ? '<span class="badge badge-win">grounded</span>'
      : '<span class="scope-pill">general best practice</span>';
    var blocks = '<div class="synth-grid">'
      + '<div class="synth-block"><h4>Isolate</h4><div class="body">' + escapeHtml(c.isolate || '—') + '</div></div>'
      + '<div class="synth-block"><h4>Reframe</h4><div class="body">' + escapeHtml(c.reframe || '—') + '</div></div>'
      + '<div class="synth-block"><h4>Overcome</h4><div class="body">' + escapeHtml(c.overcome || '—') + '</div></div>'
      + '</div>';
    var evidence = '';
    if (c.grounded && c.evidence && c.evidence.length) {
      evidence = '<div style="margin-top:10px;font-size:12px;color:var(--muted);">Your handled example' + (c.evidence.length > 1 ? 's' : '') + ':</div>'
        + c.evidence.map(function(e) {
            var clip = e.clip_url ? ' <a class="obj-btn" href="' + escapeHtml(e.clip_url) + '" target="_blank" rel="noopener" style="padding:2px 8px;">▶ clip</a>' : '';
            return '<div class="obj-response" style="display:block;margin-top:6px;"><span style="color:var(--muted);">Closer: </span>' + escapeHtml(e.closer_response || e.quote || '') + clip + '</div>';
          }).join('');
    }
    return '<div style="border-top:1px solid var(--border);padding-top:14px;margin-top:14px;">'
      + '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;">'
        + '<span class="obj-surface">' + escapeHtml(labelMap[c.category] || c.category) + '</span>'
        + '<span style="font-size:12px;color:var(--muted);">' + c.count + ' objection' + (c.count === 1 ? '' : 's') + ' · ' + c.handled + ' handled</span>'
        + '<span style="margin-left:auto;">' + tag + '</span>'
      + '</div>'
      + blocks + evidence
      + '</div>';
  }

  function renderObjectionsIntel() {
    var content = document.getElementById('content');
    if (state.objectionsIntel === null && !state.objectionsIntelLoading) loadObjectionsIntel();
    if (state.objectionsSynthesis === null && !state.objectionsSynthesisLoading) loadObjectionsSynthesis();
    // Reachable only via the Objections donut — provide an explicit way back.
    var header = '<button class="back-btn" onclick="backToOverview()" style="margin-bottom:14px;">← Back to dashboard</button>' + renderHeaderHtml();
    if (state.objectionsIntel === null) {
      content.innerHTML = header + '<div class="section"><div class="skeleton" style="height:90px;"></div></div>';
      return;
    }
    if (state.objectionsIntel.error) {
      content.innerHTML = header + '<div class="error fade-in">Could not load objections: ' + escapeHtml(state.objectionsIntel.error) + '</div>';
      return;
    }
    var d = state.objectionsIntel, m = d.metrics;
    var metricsHtml = '<div class="fade-in" style="display:flex;gap:16px;flex-wrap:wrap;margin-bottom:24px;">'
      + objStatCard('Objections', m.total, m.calls_with_objection + ' call' + (m.calls_with_objection === 1 ? '' : 's'))
      + objStatCard('Handle rate', m.handled_rate === null ? '—' : (m.handled_rate + '%'), (m.handled + m.partial + m.unhandled) + ' resolution-tagged')
      + objStatCard('Handled', m.handled, m.partial + ' partial · ' + m.unhandled + ' unhandled')
      + '</div>';

    var cats = [['fear', 'Fear'], ['logistical', 'Logistical'], ['timing', 'Timing'], ['partner', 'Partner'], ['uncategorized', 'Uncategorized']];
    var catRows = cats.map(function(pair) {
      var b = d.by_category[pair[0]] || { total: 0, handled: 0 };
      var pct = m.total > 0 ? Math.round(100 * b.total / m.total) : 0;
      return '<div style="display:flex;align-items:center;gap:14px;padding:7px 0;border-bottom:1px solid var(--border);">'
        + '<div style="width:110px;font-size:13px;color:var(--muted);">' + escapeHtml(pair[1]) + '</div>'
        + '<div style="flex:1;height:8px;background:var(--border);border-radius:4px;overflow:hidden;"><div style="width:' + pct + '%;height:100%;background:var(--accent);border-radius:4px;"></div></div>'
        + '<div style="width:150px;text-align:right;font-size:13px;">' + b.total + ' <span style="color:var(--muted);">(' + b.handled + ' handled)</span></div>'
        + '</div>';
    }).join('');
    var uncat = d.by_category.uncategorized ? d.by_category.uncategorized.total : 0;
    var catNote = (m.total > 0 && uncat === m.total)
      ? '<div class="signal-banner"><div class="signal-banner-icon"></div><div><strong>Categories pending re-analysis.</strong> These objections were analyzed before categorization shipped — re-analyze to populate surface + category + resolution + the closer\'s own handling lines.</div></div>'
      : '';

    // Feed grouped by category, count header per group, ordered fear→…→uncategorized.
    var order = ['fear', 'logistical', 'timing', 'partner', 'uncategorized'];
    var labels = { fear: 'Fear', logistical: 'Logistical', timing: 'Timing', partner: 'Partner', uncategorized: 'Uncategorized' };
    var groups = {}; order.forEach(function(k) { groups[k] = []; });
    (d.feed || []).forEach(function(f) { groups[(order.indexOf(f.category) !== -1) ? f.category : 'uncategorized'].push(f); });
    var feedHtml = '';
    order.forEach(function(k) {
      if (groups[k].length === 0) return;
      feedHtml += '<div class="obj-group-header">' + escapeHtml(labels[k]) + ' · ' + groups[k].length + '</div>' + groups[k].map(objFeedCard).join('');
    });
    if (!feedHtml) feedHtml = '<div class="empty"><h3>No objections in this window</h3><p>Pick a wider date range, or wait for new analyzed calls.</p></div>';

    content.innerHTML = header
      + metricsHtml
      + '<div class="section fade-in"><div class="section-header"><h2>By category</h2></div>' + catNote + catRows + '</div>'
      + renderObjSynthPanel()
      + '<div class="section fade-in"><div class="section-header"><h2>Objection moments</h2><div class="meta">' + (d.feed || []).length + ' shown</div></div>' + feedHtml + '</div>';
  }

  function renderCallLibrary() {
    var content = document.getElementById('content');

    // First render after entering the view: kick off the fetch and show
    // skeletons. The fetch's completion handler re-calls renderCallLibrary
    // with state populated.
    if (state.callLibrary === null && !state.callLibraryLoading) {
      loadCallLibrary(0); // async, no await — re-renders when done
    }

    var header = renderCallLibraryHeaderHtml();
    var notice = renderFathomNoticeHtml(); // reuse the global flash mechanism

    if (state.callLibraryError) {
      content.innerHTML = header + notice
        + '<div class="error fade-in">Could not load calls: ' + escapeHtml(state.callLibraryError) + '</div>';
      return;
    }

    if (state.callLibrary === null) {
      // Initial loading state — skeleton rows, no real data yet.
      content.innerHTML = header + notice + renderCallLibrarySkeletonsHtml();
      return;
    }

    if (state.callLibrary.length === 0) {
      content.innerHTML = header + notice
        + '<div class="empty fade-in">'
          + '<h3>No calls synced yet</h3>'
          + '<p>Connect Fathom and sync your calls to get started.</p>'
        + '</div>';
      return;
    }

    var cards = state.callLibrary.map(callLibraryCardHtml).join('');
    var loadMore = '';
    if (state.callLibraryHasMore) {
      loadMore = '<div style="display:flex;justify-content:center;margin-top:18px;">'
        + '<button class="btn-fathom-secondary" type="button" onclick="loadCallLibrary(' + state.callLibraryOffset + ')"'
        + (state.callLibraryLoading ? ' disabled>Loading…' : '>Load more')
        + '</button></div>';
    }
    content.innerHTML = header + notice
      + '<div class="library-list fade-in">' + cards + '</div>'
      + loadMore;
  }

  function renderCallLibraryHeaderHtml() {
    var count = (state.callLibrary && state.callLibrary.length) || 0;
    var sub = state.callLibrary === null
      ? 'Loading your synced Fathom calls…'
      : (count === 0
          ? 'Your synced Fathom calls will appear here.'
          : count + ' call' + (count === 1 ? '' : 's') + ' shown' + (state.callLibraryHasMore ? ' (more available)' : ''));
    // Active drill filter chip (only present when arrived via a donut).
    var chip = '';
    var label = state.callLibraryFilter === 'objections' ? 'With objections'
              : (state.callLibrarySort === 'score' ? 'Analyzed · worst score first'
              : (state.callLibraryFilter === 'analyzed' ? 'Analyzed' : ''));
    if (label) {
      chip = '<span class="scope-pill" style="margin-left:10px;">' + escapeHtml(label)
        + ' <a onclick="goCallLibrary();return false;" style="cursor:pointer;text-decoration:underline;">clear</a></span>';
    }
    return '<div class="page-header fade-in">'
      + '<div><h1>Call Library' + chip + '</h1>'
      + '<div class="subtitle">' + escapeHtml(sub) + '</div></div>'
      + '</div>';
  }

  function renderCallLibrarySkeletonsHtml() {
    var rows = '';
    for (var i = 0; i < 6; i++) rows += '<div class="library-skeleton-row"></div>';
    return '<div class="library-list">' + rows + '</div>';
  }

  function callLibraryCardHtml(c) {
    var title = (c.title && String(c.title).trim())
      ? '<span>' + escapeHtml(c.title) + '</span>'
      : '<span class="anon">Untitled call</span>';
    var dateStr = formatNaturalDate(c.call_date);
    var durStr = formatNaturalDuration(c.duration_seconds);

    var meta = '<span>' + escapeHtml(dateStr) + '</span>'
             + '<span class="sep">·</span>'
             + '<span>' + escapeHtml(durStr) + '</span>';

    var badge = libraryStatusBadgeHtml(c.analysis_status, c.overall_score);

    var recordingLink = '';
    if (c.recording_url && typeof c.recording_url === 'string') {
      // event.stopPropagation prevents the card's onclick from firing when
      // the user wanted to open the Fathom link directly.
      recordingLink = '<a class="library-recording-link" href="' + escapeHtml(c.recording_url)
        + '" target="_blank" rel="noopener" onclick="event.stopPropagation()">View in Fathom →</a>';
    }

    var cardId = escapeHtml(String(c.id || ''));
    return '<div class="library-card" onclick="openCallReview(\'' + cardId + '\')">'
      + '<div class="library-card-main">'
        + '<div class="library-card-title' + (c.title ? '' : ' anon') + '">' + title + '</div>'
        + '<div class="library-card-meta">' + meta + '</div>'
      + '</div>'
      + '<div class="library-card-side">'
        + badge
        + recordingLink
      + '</div>'
    + '</div>';
  }

  function libraryStatusBadgeHtml(analysisStatus, overallScore) {
    // No analysis row at all: grey "Pending" — the analysis worker hasn't
    // picked this call up yet.
    if (!analysisStatus || analysisStatus === 'pending') {
      return '<span class="library-status-badge pending">Pending</span>';
    }
    if (analysisStatus === 'processing') {
      return '<span class="library-status-badge analyzing"><span class="spinner-tiny"></span>Analyzing…</span>';
    }
    if (analysisStatus === 'done') {
      var scoreText = (typeof overallScore === 'number') ? overallScore + '/100' : 'Done';
      return '<span class="library-status-badge done">' + escapeHtml(scoreText) + '</span>';
    }
    if (analysisStatus === 'error') {
      return '<span class="library-status-badge error">Error</span>';
    }
    // Unknown status — render as pending so we never blow up.
    return '<span class="library-status-badge pending">' + escapeHtml(String(analysisStatus)) + '</span>';
  }

  // ──────────────────────────────────────────────────────────────────
  // Call Review page — Scout v2.0 Phase 2 Step 4
  // Navigates to a per-call view that shows highlights timeline, section
  // grades, and follow-up email. Three sections in fixed order — highlights
  // come first by design (the brief's "lead with what happened, support
  // with how it scored").
  // ──────────────────────────────────────────────────────────────────

  // Format integer seconds as "M:SS" (under 1 hour) or "H:MM:SS" — used for
  // human-readable highlight timestamps. Raw seconds still drive the
  // `?t=<seconds>` Fathom deep-link href; the visible label is this.
  function formatTimestampDisplay(seconds) {
    if (typeof seconds !== 'number' || isNaN(seconds) || seconds < 0) return '—';
    var s = Math.floor(seconds);
    var h = Math.floor(s / 3600);
    var m = Math.floor((s % 3600) / 60);
    var sec = s % 60;
    var pad = function(n) { return (n < 10 ? '0' : '') + n; };
    if (h > 0) return h + ':' + pad(m) + ':' + pad(sec);
    return m + ':' + pad(sec);
  }

  async function fetchCallReview(callId) {
    var res = await fetch('/fathom/calls/' + encodeURIComponent(callId), { headers: authHeader() });
    if (res.status === 401) { clearSession(); window.location.replace('/login'); throw new Error('unauth'); }
    if (res.status === 404) throw new Error('Call not found');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  }

  // Fire-and-forget loader. Re-renders the view when done, but only if the
  // user hasn't navigated away in the meantime AND we're still showing the
  // call this fetch was kicked off for (guards stale resolves).
  async function loadCallReview(callId) {
    if (state.callReviewLoading) return;
    state.callReviewLoading = true;
    state.callReviewError = null;
    try {
      var data = await fetchCallReview(callId);
      if (state.selectedCallId !== callId) return; // user navigated away — drop stale data
      state.callReview = data;
    } catch (err) {
      if (err.message === 'unauth') return;
      if (state.selectedCallId !== callId) return; // same stale-resolve guard for errors
      state.callReviewError = err.message || 'unknown';
    }
    state.callReviewLoading = false;
    if (state.view === 'call-review') renderCallReview();
  }

  function renderCallReview() {
    var content = document.getElementById('content');
    var callId = state.selectedCallId;
    if (!callId) { backToCallLibrary(); return; }

    // Pull the partial card from the library cache to render the header
    // instantly while the full fetch is in flight. Avoids a blank flash.
    var seed = null;
    if (Array.isArray(state.callLibrary)) {
      for (var i = 0; i < state.callLibrary.length; i++) {
        if (state.callLibrary[i].id === callId) { seed = state.callLibrary[i]; break; }
      }
    }

    var review = state.callReview;
    var header = renderCallReviewHeaderHtml(review, seed);
    var notice = renderFathomNoticeHtml();

    if (state.callReviewError && !review) {
      content.innerHTML = header + notice
        + '<div class="error fade-in">'
          + 'Could not load this call: ' + escapeHtml(state.callReviewError)
          + ' <button class="btn-fathom-secondary" style="margin-left:12px;" type="button" onclick="loadCallReview(\'' + escapeHtml(callId) + '\')">Retry</button>'
        + '</div>';
      return;
    }

    if (!review) {
      // Loading state — three section-sized skeletons under the header.
      content.innerHTML = header + notice
        + '<div class="fade-in">'
          + '<div class="review-skeleton-section"></div>'
          + '<div class="review-skeleton-section"></div>'
          + '<div class="review-skeleton-section"></div>'
        + '</div>';
      return;
    }

    var errorBanner = '';
    if (review.analysis && review.analysis.status === 'error') {
      var reason = review.analysis.overall_summary || 'Analysis failed.';
      errorBanner = '<div class="review-analysis-error fade-in">'
        + '<strong>Analysis error.</strong> ' + escapeHtml(reason)
        + '</div>';
    }

    // The verdict LEADS — "Why this call closed / didn't close" is the first
    // content below the page header (above the Fathom notice, error banner, and
    // Call Highlights). Everything else is supporting evidence. Returns '' for
    // follow_up/no_show/pre-v4 calls, so those pages simply start at the notice.
    content.innerHTML = header
      + renderWhyOutcomeSectionHtml(review)
      + notice + errorBanner
      + '<div class="fade-in">'
        + renderHighlightsSectionHtml(review)
        + renderGradesSectionHtml(review)
        + renderFollowupSectionHtml(review)
      + '</div>';
  }

  // ─── "Why this call closed / didn't close" — causal evidence ──────────
  // Between header and highlights. Loss-class: the primary cause + quote +
  // clip, then the paired "One thing to do differently" beneath it as the
  // correction (cause → fix). Win-class: what won it. Hidden for other/no
  // outcome or when the (pre-v4) analysis lacks the tied why_outcome field.
  function whyOutcomeState(review) {
    var a = review && review.analysis;
    if (!a || a.status !== 'done') return null;
    var hasWhy = typeof a.why_outcome === 'string' && a.why_outcome.trim();
    if (!hasWhy) return null;
    if (a.outcome === 'lost')      return { kind: 'loss' };
    if (a.outcome === 'closed')    return { kind: 'win' };
    if (a.outcome === 'follow_up') return { kind: 'pending' };
    return null; // no_show / null → section hidden
  }

  // Single source of truth for "does the verdict section pair one_thing under
  // the cause?" — loss ("The fix") and pending/follow_up ("The move") do; win
  // shows the cause only, so its one_thing stays in the highlights footer.
  // BOTH renderWhyOutcomeSectionHtml and the footer suppression key on this —
  // the Item D double-render happened because the two sites drifted apart when
  // grader v5 added follow_up to the verdict pairing.
  function verdictKindShowsOneThing(kind) {
    return kind === 'loss' || kind === 'pending';
  }

  function reviewClipHtml(seconds, recordingUrl, label) {
    if (typeof seconds !== 'number' || !recordingUrl || typeof recordingUrl !== 'string') return '';
    var href = recordingUrl + (recordingUrl.indexOf('?') !== -1 ? '&' : '?') + 't=' + Math.floor(seconds);
    return '<a class="review-why-clip" href="' + escapeHtml(href)
      + '" target="_blank" rel="noopener">▶ ' + escapeHtml(label || 'Play clip')
      + ' (' + escapeHtml(formatTimestampDisplay(Math.floor(seconds))) + ')</a>';
  }

  function renderWhyOutcomeSectionHtml(review) {
    var st = whyOutcomeState(review);
    if (!st) return '';
    var a = review.analysis;
    var recordingUrl = review.recording_url || null;

    var title = st.kind === 'loss' ? 'Why this call didn’t close'
      : st.kind === 'win' ? 'Why this call closed'
      : 'Why this call hasn’t closed yet';
    var reason = '<div class="review-why-reason">' + escapeHtml(a.why_outcome) + '</div>';
    var quote = (typeof a.why_quote === 'string' && a.why_quote.trim())
      ? '<div class="review-why-quote">“' + escapeHtml(a.why_quote) + '”</div>' : '';
    var clip = (typeof a.why_timestamp_seconds === 'number')
      ? reviewClipHtml(a.why_timestamp_seconds, recordingUrl, 'Play this moment') : '';

    var inner = '<div class="review-why-label">' + escapeHtml(title) + '</div>'
      + reason + quote + clip;

    // Loss + pending (follow_up): pair the correction/next-move directly beneath
    // the cause. For a follow_up it's the move that advances the deal, not a fix
    // for a dead one, so the connector reads differently.
    // was inlined as st.kind checks — now the shared predicate (Item D 2026-07-22)
    if (verdictKindShowsOneThing(st.kind)) {
      var otText = (typeof a.one_thing === 'string' && a.one_thing.trim())
        ? '<div class="review-one-thing-text">' + escapeHtml(a.one_thing) + '</div>'
        : '<div class="review-one-thing-text placeholder">Will appear when analysis completes.</div>';
      var otClip = (typeof a.one_thing_timestamp_seconds === 'number')
        ? '<div style="margin-top:6px;">' + reviewClipHtml(a.one_thing_timestamp_seconds, recordingUrl, 'Where it belonged') + '</div>' : '';
      inner += '<div class="review-why-connector">' + (st.kind === 'pending' ? 'The move' : 'The fix') + '</div>'
        + '<div class="review-one-thing">'
          + '<div class="review-one-thing-label">' + (st.kind === 'pending' ? 'One thing to do next' : 'One thing to do differently') + '</div>'
          + otText + otClip
        + '</div>';
    }

    return '<section class="section review-why fade-in ' + st.kind + '">' + inner + '</section>';
  }

  function renderCallReviewHeaderHtml(review, seed) {
    var src = review || seed || {};
    var titleText = (src.title && String(src.title).trim()) ? src.title : null;
    var titleHtml = titleText
      ? '<h1 class="review-title">' + escapeHtml(titleText) + '</h1>'
      : '<h1 class="review-title anon">Untitled call</h1>';

    var dateStr = formatNaturalDate(src.call_date);
    var durStr = formatNaturalDuration(src.duration_seconds);
    var meta = '<span>' + escapeHtml(dateStr) + '</span>'
             + '<span class="sep">·</span>'
             + '<span>' + escapeHtml(durStr) + '</span>';

    // Status badge — when full data has loaded, use analysis.status +
    // overall_score; otherwise fall back to the library card's
    // analysis_status field. libraryStatusBadgeHtml handles both shapes.
    var status = review && review.analysis ? review.analysis.status : (src.analysis_status || null);
    var score = review && review.analysis ? review.analysis.overall_score : (typeof src.overall_score === 'number' ? src.overall_score : null);
    var badge = libraryStatusBadgeHtml(status, score);

    var fathomLink = '';
    if (src.recording_url && typeof src.recording_url === 'string') {
      fathomLink = '<a class="review-fathom-link" href="' + escapeHtml(src.recording_url) + '" target="_blank" rel="noopener">View in Fathom →</a>';
    }

    return '<div class="review-page-header fade-in">'
      + '<button class="review-back-link" type="button" onclick="backToCallLibrary()">← Back to Calls</button>'
      + '<div class="review-title-row">'
        + '<div class="review-title-main">'
          + titleHtml
          + '<div class="review-meta-row">' + meta + '</div>'
        + '</div>'
        + '<div class="review-title-side">'
          + badge
          + fathomLink
        + '</div>'
      + '</div>'
    + '</div>';
  }

  // ─── Section 1: Highlights ────────────────────────────────────────────
  function renderHighlightsSectionHtml(review) {
    var analysis = review.analysis;
    var highlights = Array.isArray(review.highlights) ? review.highlights : [];
    var recordingUrl = review.recording_url || null;
    var analysisDone = analysis && analysis.status === 'done';

    var body;
    if (highlights.length > 0) {
      body = '<div class="review-highlight-list">'
        + highlights.map(function(h) { return highlightEntryHtml(h, recordingUrl); }).join('')
        + '</div>';
    } else if (!analysisDone) {
      body = '<div class="review-highlights-pending">Analysis in progress — highlights will appear here shortly.</div>';
    } else {
      body = '<div class="review-highlights-pending">No highlights were extracted for this call.</div>';
    }

    // One-thing footer. Normally rendered here — but whenever the verdict
    // section already pairs one_thing under the cause (loss AND follow_up),
    // suppress the duplicate. Win-class keeps it here (footer only).
    // was keyed on kind 'loss' alone — drifted when grader v5 added follow_up
    // to the verdict pairing, double-rendering one_thing (Item D 2026-07-22).
    var whyState = whyOutcomeState(review);
    var oneThingFooter = '';
    if (!(whyState && verdictKindShowsOneThing(whyState.kind))) {
      var oneThing = analysis && typeof analysis.one_thing === 'string' && analysis.one_thing.trim()
        ? '<div class="review-one-thing-text">' + escapeHtml(analysis.one_thing) + '</div>'
        : '<div class="review-one-thing-text placeholder">Will appear when analysis completes.</div>';
      oneThingFooter = '<div class="review-one-thing">'
        + '<div class="review-one-thing-label">One thing to do differently</div>'
        + oneThing
      + '</div>';
    }

    return '<section class="section">'
      + '<div class="section-header"><h2>Call Highlights</h2></div>'
      + body
      + oneThingFooter
    + '</section>';
  }

  function highlightEntryHtml(h, recordingUrl) {
    var seconds = (typeof h.timestamp_seconds === 'number') ? h.timestamp_seconds : null;
    var label = (seconds != null) ? formatTimestampDisplay(seconds) : '—';
    var timeHtml;
    if (seconds != null && recordingUrl && typeof recordingUrl === 'string') {
      var href = recordingUrl + (recordingUrl.indexOf('?') !== -1 ? '&' : '?') + 't=' + seconds;
      timeHtml = '<a class="review-highlight-time" href="' + escapeHtml(href)
        + '" target="_blank" rel="noopener" onclick="event.stopPropagation()">' + escapeHtml(label) + '</a>';
    } else {
      timeHtml = '<span class="review-highlight-time disabled">' + escapeHtml(label) + '</span>';
    }

    var speakerClass = (h.speaker === 'CLOSER') ? 'closer' : 'prospect';
    var speakerBadge = '<span class="review-speaker-badge ' + speakerClass + '">' + escapeHtml(h.speaker || '') + '</span>';

    var typeLabel = highlightTypeLabel(h.type);
    var typeClass = (typeof h.type === 'string') ? h.type.toLowerCase() : '';
    var typeBadge = '<span class="review-type-badge ' + escapeHtml(typeClass) + '">' + escapeHtml(typeLabel) + '</span>';

    var quote = (typeof h.quote === 'string') ? h.quote : '';
    var observation = (typeof h.observation === 'string') ? h.observation : '';

    return '<div class="review-highlight">'
      + timeHtml
      + '<div class="review-highlight-body">'
        + '<div class="review-highlight-row1">' + speakerBadge + typeBadge + '</div>'
        + '<div class="review-quote">' + escapeHtml(quote) + '</div>'
        + '<div class="review-observation">' + escapeHtml(observation) + '</div>'
      + '</div>'
    + '</div>';
  }

  function highlightTypeLabel(type) {
    var labels = {
      buying_signal:      'Buying signal',
      objection:          'Objection',
      missed_opportunity: 'Missed opportunity',
      strong_moment:      'Strong moment',
      rapport_moment:     'Rapport',
      disqualify_signal:  'Disqualify signal',
    };
    return (type && labels[type]) || (type || 'Moment');
  }

  // ─── Section 2: Section Grades — five collapsible cards ───────────────
  var REVIEW_SECTION_KEYS = ['intro', 'discovery', 'pitch', 'objection', 'close'];
  var REVIEW_SECTION_LABELS = {
    intro:     'Intro',
    discovery: 'Discovery',
    pitch:     'Pitch',
    objection: 'Objection handling',
    close:     'Close',
  };

  function renderGradesSectionHtml(review) {
    var analysis = review.analysis;
    var analysisDone = analysis && analysis.status === 'done';

    // All-expand toggle — only meaningful when there's actual data.
    var anyExpanded = REVIEW_SECTION_KEYS.some(function(k) { return !!state.expandedGradeCards[k]; });
    var toggleLabel = anyExpanded ? 'Collapse all' : 'Expand all';
    var toggleBtn = analysisDone
      ? '<button class="review-grades-toggle" type="button" onclick="toggleAllGrades()">' + toggleLabel + '</button>'
      : '';

    var cards;
    if (analysisDone) {
      cards = REVIEW_SECTION_KEYS.map(function(k) { return gradeCardHtml(k, analysis); }).join('');
    } else {
      // Skeleton placeholders — 5 cards, pulsing, no interaction.
      var s = '';
      for (var i = 0; i < REVIEW_SECTION_KEYS.length; i++) s += '<div class="review-grade-card skeleton-card"></div>';
      cards = s;
    }

    return '<section class="section">'
      + '<div class="section-header"><h2>Section grades</h2>' + toggleBtn + '</div>'
      + '<div class="review-grade-list">' + cards + '</div>'
    + '</section>';
  }

  function gradeCardHtml(sectionKey, analysis) {
    var label = REVIEW_SECTION_LABELS[sectionKey];
    var grade = analysis[sectionKey + '_grade'];
    var score = analysis[sectionKey + '_score'];
    var notes = analysis[sectionKey + '_notes'];
    var expanded = !!state.expandedGradeCards[sectionKey];

    var letterHtml;
    if (grade && /^[A-F]$/.test(grade)) {
      letterHtml = '<div class="review-grade-letter ' + grade + '">' + grade + '</div>';
    } else {
      letterHtml = '<div class="review-grade-letter empty">—</div>';
    }

    var scoreText = (typeof score === 'number') ? score + '/100' : '';
    var chevron = '<span class="review-grade-chevron">▾</span>';

    var notesHtml = '';
    if (expanded) {
      var notesText = (typeof notes === 'string' && notes.trim()) ? notes : 'No notes recorded.';
      var notesClass = (typeof notes === 'string' && notes.trim()) ? 'review-grade-notes' : 'review-grade-notes placeholder';
      notesHtml = '<div class="review-grade-body">'
        + '<div class="' + notesClass + '">' + escapeHtml(notesText) + '</div>'
      + '</div>';
    }

    var notOccurred = (grade === null && score === null && typeof notes === 'string' && notes.indexOf('did not occur') !== -1);
    var cardClass = 'review-grade-card'
      + (expanded ? ' expanded' : '')
      + (notOccurred ? ' not-occurred' : '');

    return '<div class="' + cardClass + '">'
      + '<div class="review-grade-card-header" onclick="toggleGradeCard(\'' + sectionKey + '\')">'
        + '<div class="review-grade-name">' + escapeHtml(label) + '</div>'
        + letterHtml
        + '<div class="review-grade-score">' + escapeHtml(scoreText) + '</div>'
        + chevron
      + '</div>'
      + notesHtml
    + '</div>';
  }

  function toggleGradeCard(sectionKey) {
    state.expandedGradeCards[sectionKey] = !state.expandedGradeCards[sectionKey];
    if (state.view === 'call-review') renderCallReview();
  }

  function toggleAllGrades() {
    var anyExpanded = REVIEW_SECTION_KEYS.some(function(k) { return !!state.expandedGradeCards[k]; });
    var nextValue = !anyExpanded; // if any open → collapse all; else expand all
    var next = {};
    for (var i = 0; i < REVIEW_SECTION_KEYS.length; i++) next[REVIEW_SECTION_KEYS[i]] = nextValue;
    state.expandedGradeCards = next;
    if (state.view === 'call-review') renderCallReview();
  }

  // ─── Section 3: Follow-up Email ───────────────────────────────────────
  function renderFollowupSectionHtml(review) {
    var analysis = review.analysis;
    var email = analysis && typeof analysis.follow_up_email === 'string' ? analysis.follow_up_email : '';
    var hasEmail = !!(email && email.trim());

    var boxHtml;
    if (hasEmail) {
      boxHtml = '<div class="review-followup-box" id="reviewFollowupBox">' + escapeHtml(email) + '</div>';
    } else if (analysis && analysis.status === 'done') {
      boxHtml = '<div class="review-followup-box placeholder">No follow-up email was generated for this call.</div>';
    } else {
      boxHtml = '<div class="review-followup-box placeholder">A follow-up draft will appear here once analysis completes.</div>';
    }

    var copyBtn = hasEmail
      ? '<button class="btn-fathom-secondary" type="button" onclick="copyFollowupEmail()">Copy</button>'
      : '<button class="btn-fathom-secondary" type="button" disabled>Copy</button>';
    var feedback = '<span class="review-copy-feedback' + (state.followupCopied ? ' show' : '') + '">Copied!</span>';

    return '<section class="section">'
      + '<div class="section-header"><h2>Follow-up email</h2></div>'
      + '<div class="review-followup-wrap">'
        + boxHtml
        + '<div class="review-followup-actions">' + copyBtn + feedback + '</div>'
      + '</div>'
    + '</section>';
  }

  function copyFollowupEmail() {
    var review = state.callReview;
    if (!review || !review.analysis || !review.analysis.follow_up_email) return;
    var text = review.analysis.follow_up_email;
    var writePromise = (navigator.clipboard && navigator.clipboard.writeText)
      ? navigator.clipboard.writeText(text)
      : new Promise(function(resolve, reject) {
          // Fallback: textarea + execCommand. Older browsers / non-HTTPS dev contexts.
          try {
            var ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.left = '-9999px';
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            resolve();
          } catch (e) { reject(e); }
        });
    writePromise.then(function() {
      state.followupCopied = true;
      if (state.view === 'call-review') renderCallReview();
      setTimeout(function() {
        state.followupCopied = false;
        if (state.view === 'call-review') renderCallReview();
      }, 1800);
    }).catch(function(err) {
      console.warn('[review] clipboard write failed:', err);
    });
  }

  function backToCallLibrary() {
    state.view = 'call-library';
    state.selectedCallId = null;
    // Intentionally keep state.callReview around in case the user re-opens
    // the same call — but null it so a subsequent open kicks a fresh fetch
    // and reflects any analysis-status changes that happened in the meantime.
    state.callReview = null;
    state.callReviewError = null;
    state.expandedGradeCards = {};
    state.followupCopied = false;
    render();
    syncHashFromState();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // Real navigator. Replaces the Phase 2 Step 3 placeholder that only
  // surfaced a flash notice. Opens the call review page, kicks off the
  // detailed fetch in the background, and scrolls to top.
  function openCallReview(callId) {
    state.selectedCallId = callId;
    state.callReview = null;
    state.callReviewError = null;
    state.expandedGradeCards = {};
    state.followupCopied = false;
    state.view = 'call-review';
    render();
    syncHashFromState();
    window.scrollTo({ top: 0, behavior: 'smooth' });
    loadCallReview(callId); // async, re-renders when done
  }

  init();
</script>

</body>
</html>
