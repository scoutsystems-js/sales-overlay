<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Coaching Dashboard — Scout Systems</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net"/>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <style>
    /* ──────────────────────────────────────────────────────────────────
       Coaching Dashboard v2 — donut-led, drill-down coaching tool.
       Old version archived at backend/web/dashboard-v1.html.archived.

       Design principles (no apologies on the polish):
         - Limited color palette (8 colors, used intentionally)
         - 12px corner radius across cards
         - 8px spacing rhythm
         - System font stack (clean, fast)
         - Subtle gradients, no heavy shadows
         - Smooth transitions, no jarring spinners
         - Generous whitespace
       ────────────────────────────────────────────────────────────────── */

    :root {
      --bg:           #0a0a0a;
      --bg-elevated:  #131313;
      --bg-hover:     #1a1a1a;
      --bg-deep:      #050505;
      --border:       #1f1f1f;
      --border-strong: #2e2e2e;  /* visible on both --bg and --bg-elevated — sections + form fields */
      --bg-field:      #1c1c1c;  /* form-field surface: one step lighter than the section card */
      --border-hover: #2a2a2a;
      --border-focus: #3b3b3b;
      --text:         #ededed;
      --text-soft:    #cccccc;
      --text-muted:   #8b8b8b;
      --text-dim:     #5a5a5a;

      --accent:       #5b9eff;
      --good:         #4ade80;
      --mid:          #fbbf24;
      --bad:          #f87171;
      --purple:       #c084fc;
      --orange:       #fb923c;
      --cyan:         #22d3ee;
      /* Compat aliases for the relocated Knowledge Base CSS, which was authored
         against admin.html's theme-var names. Without these the KB "+ Add
         resource" button, tab pills, submit and list cards render unstyled
         (undefined vars → transparent). Mapped to dashboard's equivalents. */
      --green:        #4ade80;
      --green-dark:   #3aae63;
      --bg2:          #131313;
      --muted:        #8b8b8b;
      --slate:        #64748b;

      --radius-sm: 8px;
      --radius:    12px;
      --radius-lg: 16px;

      --shadow-sm: 0 1px 2px rgba(0,0,0,0.4);
      --shadow-md: 0 2px 4px rgba(0,0,0,0.4), 0 8px 24px rgba(0,0,0,0.3);

      --ease: cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; cursor: pointer; }

    /* ── Top bar ───────────────────────────────────────────────────── */
    .top-bar {
      background: linear-gradient(180deg, #161616 0%, #0d0d0d 100%);
      border-bottom: 1px solid var(--border);
      padding: 14px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      backdrop-filter: blur(8px);
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .top-bar-left { display: flex; align-items: center; gap: 12px; font-weight: 600; font-size: 14px; }
    .top-bar-left .sep { color: var(--text-dim); font-weight: 400; }
    .top-bar-left .sub { color: var(--text-muted); font-weight: 500; font-size: 13px; }
    /* Primary-nav items in the top-left. Hover lights up the text; the active
       state adds an accent underline. Coaching Dashboard's active state spans
       all the overview sub-drills (calls/objections/closes/objection-type)
       because those drills are conceptually under Overview, not their own
       sections. */
    .top-bar-left .nav-link {
      color: var(--text-muted);
      cursor: pointer;
      font-weight: 500;
      font-size: 13px;
      transition: color 0.15s var(--ease);
      text-decoration: none;
      padding: 3px 0;
      border-bottom: 2px solid transparent;
      user-select: none;
    }
    .top-bar-left .nav-link:hover { color: var(--text); }
    .top-bar-left .nav-link.nav-active {
      color: var(--text);
      border-bottom-color: var(--accent);
    }
    .top-bar-right { display: flex; align-items: center; gap: 20px; font-size: 13px; color: var(--text-muted); }
    .top-bar-right a:hover { color: var(--text); }
    .signout { cursor: pointer; }
    .signout:hover { color: var(--text); }

    /* ── Page layout ────────────────────────────────────────────────── */
    .page { max-width: 1200px; margin: 0 auto; padding: 36px 32px 100px; }

    .page-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 20px;
      margin-bottom: 36px;
    }
    .page-header h1 {
      font-size: 28px;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin: 0;
    }
    .page-header .subtitle {
      color: var(--text-muted);
      font-size: 14px;
      margin-top: 6px;
    }

    .controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }

    .user-select {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 32px 8px 14px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-family: inherit;
      min-width: 220px;
      cursor: pointer;
      transition: border-color 0.15s var(--ease);
      appearance: none;
      background-image: url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%238b8b8b' stroke-width='1.5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: right 12px center;
    }
    .user-select:hover { border-color: var(--border-hover); }
    .user-select:focus { outline: none; border-color: var(--accent); }

    .date-presets { display: flex; gap: 4px; background: var(--bg-elevated); padding: 4px; border-radius: var(--radius-sm); border: 1px solid var(--border); }
    .date-preset {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      transition: all 0.15s var(--ease);
    }
    .date-preset:hover { color: var(--text); }
    .date-preset.active { background: var(--bg-hover); color: var(--text); }

    /* ── Donut row ──────────────────────────────────────────────────── */
    .donut-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 48px;
    }
    @media (max-width: 820px) { .donut-row { grid-template-columns: 1fr; } }

    /* A-1: compact glance tiles (replace the donut row on the coaching overview) */
    .glance-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin-bottom: 28px; }
    .glance-tile { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; cursor: pointer; transition: border-color 0.15s var(--ease), transform 0.1s var(--ease); }
    .glance-tile:hover { border-color: var(--accent); transform: translateY(-1px); }
    .glance-big { font-size: 30px; font-weight: 700; color: var(--text); line-height: 1.05; }
    .glance-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin-top: 8px; }
    .glance-sub { font-size: 12px; color: var(--text-muted); margin-top: 3px; }
    /* Avg-score tile period-over-period trend (arrow reuses .trend.up/.down/.flat). */
    .glance-trend { font-size: 13px; font-weight: 600; margin-left: 8px; vertical-align: 4px; white-space: nowrap; }
    .glance-trend-pct { margin-left: 2px; color: var(--text-muted); font-weight: 500; }
    .glance-skeleton { height: 92px; border-radius: var(--radius); }
    /* FD-4: Get-started onboarding card */
    .gs-card { position: relative; border-color: var(--accent); background: linear-gradient(180deg, rgba(91,158,255,0.05), var(--bg-elevated)); }
    .gs-dismiss { position: absolute; top: 12px; right: 14px; background: none; border: none; color: var(--text-muted); font-size: 20px; line-height: 1; cursor: pointer; padding: 2px 6px; border-radius: 6px; }
    .gs-dismiss:hover { color: var(--text); background: rgba(255,255,255,0.05); }
    .gs-head h2 { margin: 0; }
    .gs-head .meta { margin: 2px 0 14px; }
    .gs-step { display: flex; gap: 12px; padding: 12px 0; border-top: 1px solid var(--border); }
    .gs-step:first-of-type { border-top: none; }
    .gs-check { flex: 0 0 22px; width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--border-strong); color: var(--good); display: flex; align-items: center; justify-content: center; font-size: 13px; margin-top: 1px; }
    .gs-check.done { background: rgba(74,222,128,0.12); border-color: var(--good); }
    .gs-step-body { flex: 1; min-width: 0; }
    .gs-step-title { font-size: 14px; font-weight: 600; color: var(--text); }
    .gs-step-sub { font-size: 13px; color: var(--text-muted); margin-top: 3px; line-height: 1.5; }
    .gs-optional { font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-muted); border: 1px solid var(--border-strong); border-radius: 99px; padding: 1px 7px; margin-left: 8px; font-weight: 600; }
    .gs-actions { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; }
    /* Thread 1: manual outcome tag (Calls page + review) */
    .outcome-tag { display: inline-flex; align-items: center; gap: 4px; }
    .outcome-tag-select { font-size: 12px; padding: 3px 6px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg-field); color: var(--text); cursor: pointer; }
    .outcome-tag-select.closed { border-color: var(--good); color: var(--good); }
    .outcome-tag-select.lost { border-color: var(--bad); color: var(--bad); }
    .outcome-tag-badge { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 10px; border: 1px solid var(--border); color: var(--text-muted); }
    .outcome-tag-badge.closed { color: var(--good); border-color: var(--good); }
    .outcome-tag-badge.lost { color: var(--bad); border-color: var(--bad); }
    .outcome-tag-src { font-size: 10px; font-weight: 700; color: var(--good); }
    .outcome-tag-src.ai { color: var(--text-muted); background: var(--bg-field); border: 1px solid var(--border); border-radius: 6px; padding: 0 4px; }
    /* C-1: Generate summary button + popup body */
    .summary-btn { white-space: nowrap; }
    .summary-text { font-size: 15px; line-height: 1.6; color: var(--text); white-space: normal; }
    .summary-actions { display: flex; align-items: center; gap: 12px; margin-top: 18px; }
    .copy-note { font-size: 13px; font-weight: 600; color: var(--good); }
    /* User Management: #team-members table */
    .members-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
    .members-seats { font-size: 14px; color: var(--text-muted); }
    .members-seats b { color: var(--text); }
    .members-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
    .members-table th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-muted); padding: 8px 10px; border-bottom: 1px solid var(--border); }
    .members-table td { padding: 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    .members-table tr.inactive td { opacity: 0.6; }
    .members-name { font-weight: 600; color: var(--text); }
    .members-email { font-size: 12px; color: var(--text-muted); }
    .member-badge.on { color: var(--good); font-weight: 600; font-size: 12px; }
    .member-badge.off { color: var(--text-muted); font-weight: 600; font-size: 12px; }
    .members-actions { white-space: nowrap; }
    .members-act { background: var(--bg-field); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 4px 9px; font-size: 12px; cursor: pointer; margin-left: 4px; }
    .members-act:hover { border-color: var(--accent); }
    .members-act.danger { color: var(--bad); } .members-act.danger:hover { border-color: var(--bad); }
    .members-move { padding: 4px 6px; font-size: 12px; }
    /* A-1: collapsed accordion sections on the overview */
    .overview-acc-head { cursor: pointer; user-select: none; }
    .overview-acc-head h2 { display: flex; align-items: center; gap: 8px; }
    .acc-chevron { font-size: 13px; color: var(--text-muted); transition: transform 0.15s var(--ease); }
    .overview-acc.expanded .acc-chevron { transform: rotate(180deg); }
    .overview-acc-body { margin-top: 14px; }

    .donut-card {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 32px 28px 28px;
      cursor: pointer;
      transition: all 0.18s var(--ease);
      position: relative;
      overflow: hidden;
      text-align: center;
    }
    .donut-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 0%, rgba(91, 158, 255, 0.04), transparent 70%);
      pointer-events: none;
    }
    .donut-card:hover {
      border-color: var(--border-hover);
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }
    .donut-card:hover::before { background: radial-gradient(circle at 50% 0%, rgba(91, 158, 255, 0.08), transparent 70%); }

    .donut-card .donut-label {
      font-size: 12px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 600;
      margin-bottom: 24px;
    }

    .donut-canvas-wrap {
      position: relative;
      width: 200px;
      height: 200px;
      margin: 0 auto;
    }

    .donut-center {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    .donut-center .big {
      font-size: 36px;
      font-weight: 700;
      letter-spacing: -0.025em;
      line-height: 1;
    }
    .donut-center .small {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 6px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .donut-legend {
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
      margin-top: 24px;
      font-size: 12px;
      color: var(--text-muted);
    }
    .donut-legend .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 6px;
      vertical-align: middle;
    }

    .donut-hint {
      font-size: 11px;
      color: var(--text-dim);
      margin-top: 10px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    /* ── Section heading ────────────────────────────────────────────── */
    /* Visual separation pass: box every major section with a thin border. Cards,
       panels, feed items and synthesis blocks already carry their own
       1px var(--border); this wraps the section-level groupings across the
       dashboard, call review, and objections views. box-sizing:border-box is
       global, so the border adds no layout shift. review-why keeps its accent
       border-left (overrides just the left edge). */
    /* Sections are distinct surfaces (2026-07-23 ruling — --border alone was
       invisible on --bg, which is why the earlier separation pass didn't stick). */
    .section { margin-bottom: 48px; background: var(--bg-elevated); border: 1px solid var(--border-strong); border-radius: var(--radius-lg); padding: 20px 22px; }
    .section-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 18px;
      gap: 12px;
    }
    .section-header h2 {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.01em;
      margin: 0;
    }
    .section-header .meta { font-size: 12px; color: var(--text-muted); }

    /* ── Coach summary patterns ─────────────────────────────────────── */
    .patterns-list { display: flex; flex-direction: column; gap: 12px; }
    .pattern-card {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 22px;
      transition: border-color 0.15s var(--ease);
    }
    .pattern-card:hover { border-color: var(--border-hover); }
    .pattern-headline {
      font-size: 15px;
      font-weight: 600;
      line-height: 1.4;
      letter-spacing: -0.005em;
      margin-bottom: 8px;
    }
    .pattern-detail {
      font-size: 13.5px;
      color: var(--text-soft);
      line-height: 1.6;
    }
    .pattern-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 12px;
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .pattern-confidence {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: 600;
    }
    .pattern-confidence.high   { background: rgba(74, 222, 128, 0.10); color: var(--good); }
    .pattern-confidence.medium { background: rgba(251, 191, 36, 0.10); color: var(--mid); }
    .pattern-confidence.low    { background: rgba(139, 139, 139, 0.10); color: var(--text-muted); }

    .signal-banner {
      background: linear-gradient(135deg, rgba(91, 158, 255, 0.06), rgba(91, 158, 255, 0.02));
      border: 1px solid rgba(91, 158, 255, 0.15);
      border-radius: var(--radius);
      padding: 12px 16px;
      font-size: 12.5px;
      color: #b3d4ff;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .signal-banner-icon {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--accent);
      opacity: 0.4;
      flex-shrink: 0;
    }

    /* ── Calls list ─────────────────────────────────────────────────── */
    .calls-list { display: flex; flex-direction: column; gap: 8px; }
    .call-card {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      transition: border-color 0.15s var(--ease);
    }
    .call-card:hover { border-color: var(--border-hover); }
    .call-card.expanded { border-color: var(--border-focus); }

    .call-head {
      padding: 16px 22px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      user-select: none;
    }
    .call-head-left { flex: 1; min-width: 0; }
    .call-head-title { font-size: 14.5px; font-weight: 600; letter-spacing: -0.005em; }
    .call-head-title .name { color: var(--text); }
    .call-head-title .anon { color: var(--text-muted); font-weight: 400; font-style: italic; }
    .call-head-meta {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .call-head-right { display: flex; align-items: center; gap: 14px; }

    .badge {
      font-size: 10.5px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      white-space: nowrap;
    }
    .badge-win    { background: rgba(74, 222, 128, 0.12); color: var(--good); }
    .badge-loss   { background: rgba(248, 113, 113, 0.12); color: var(--bad); }
    .badge-fu     { background: rgba(251, 191, 36, 0.12); color: var(--mid); }
    .badge-live   { background: rgba(91, 158, 255, 0.12); color: var(--accent); }
    .badge-empty  { background: rgba(139, 139, 139, 0.10); color: var(--text-muted); }

    .expand-icon {
      color: var(--text-dim);
      transition: transform 0.2s var(--ease);
      font-size: 14px;
    }
    .call-card.expanded .expand-icon { transform: rotate(180deg); color: var(--text-muted); }

    .call-body {
      border-top: 1px solid var(--border);
      padding: 22px;
      background: var(--bg-deep);
      display: none;
    }
    .call-card.expanded .call-body { display: block; }

    .obj-event {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
      margin-bottom: 12px;
    }
    .obj-event:last-child { margin-bottom: 0; }
    .obj-event-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 14px;
    }
    .obj-event-title { font-size: 14px; font-weight: 600; }
    .obj-event-time { font-size: 11px; color: var(--text-muted); margin-left: 8px; font-weight: 400; }

    .verdict {
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .verdict-overcome  { background: rgba(74, 222, 128, 0.12); color: var(--good); }
    .verdict-not       { background: rgba(248, 113, 113, 0.12); color: var(--bad); }
    .verdict-unknown   { background: rgba(139, 139, 139, 0.10); color: var(--text-muted); }
    .verdict-conf { font-size: 10px; color: var(--text-dim); margin-left: 8px; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 500; }

    .coaching-note {
      background: linear-gradient(135deg, rgba(91, 158, 255, 0.06) 0%, rgba(74, 222, 128, 0.03) 100%);
      border: 1px solid rgba(91, 158, 255, 0.18);
      border-radius: var(--radius-sm);
      padding: 16px 18px;
      font-size: 13.5px;
      line-height: 1.65;
      color: var(--text);
      margin-bottom: 14px;
    }
    .coaching-note-empty {
      font-size: 12.5px;
      color: var(--text-muted);
      font-style: italic;
      margin-bottom: 14px;
    }

    .compare-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 680px) { .compare-grid { grid-template-columns: 1fr; } }
    .compare-pane {
      background: var(--bg-deep);
      border-radius: var(--radius-sm);
      padding: 14px 16px;
      border-left: 3px solid var(--border);
    }
    .compare-pane.framework { border-left-color: var(--accent); }
    .compare-pane.actual    { border-left-color: var(--mid); }
    .compare-label {
      font-size: 10px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 8px;
      font-weight: 600;
    }
    .compare-text { font-size: 13px; color: var(--text-soft); line-height: 1.55; }
    .compare-text.empty { color: var(--text-dim); font-style: italic; }

    .obj-notes-row {
      font-size: 11px;
      color: var(--text-dim);
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      line-height: 1.5;
    }

    /* ── Drill view ─────────────────────────────────────────────────── */
    .drill-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
    }
    .back-btn {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      transition: all 0.15s var(--ease);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .back-btn:hover { color: var(--text); border-color: var(--border-hover); }

    .drill-title { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; }
    .drill-title .count { color: var(--text-muted); font-weight: 400; margin-left: 8px; }

    .drill-grid {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 36px;
      margin-bottom: 48px;
    }
    @media (max-width: 760px) { .drill-grid { grid-template-columns: 1fr; } }

    .drill-donut {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .drill-breakdown { display: flex; flex-direction: column; gap: 10px; }
    .breakdown-row {
      display: grid;
      grid-template-columns: 12px 1fr auto auto;
      gap: 12px;
      align-items: center;
      padding: 14px 18px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 13px;
      transition: all 0.15s var(--ease);
    }
    .breakdown-row.clickable {
      cursor: pointer;
      grid-template-columns: 12px 1fr auto auto 14px;
    }
    .breakdown-row.clickable:hover {
      border-color: var(--border-focus);
      background: var(--bg-hover);
      transform: translateX(2px);
    }
    .breakdown-row.clickable::after {
      content: '→';
      color: var(--text-dim);
      font-size: 14px;
      transition: color 0.15s var(--ease);
      grid-column: 5;
      text-align: right;
    }
    .breakdown-row.clickable:hover::after { color: var(--accent); }
    .breakdown-row:hover { border-color: var(--border-hover); }

    /* Per-type drill — event cards */
    .event-card {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px 24px;
      margin-bottom: 14px;
      transition: border-color 0.15s var(--ease);
    }
    .event-card:hover { border-color: var(--border-hover); }
    .event-card-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .event-card-title {
      font-size: 14px;
      font-weight: 600;
    }
    .event-card-title .name { color: var(--text); }
    .event-card-title .anon { color: var(--text-muted); font-weight: 400; font-style: italic; }
    .event-card-meta {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .event-card-right {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    /* Stats strip atop per-type drill */
    .type-stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin-bottom: 32px;
    }
    .type-stat {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
    }
    .type-stat .stat-label {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 600;
    }
    .type-stat .stat-value {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-top: 6px;
      line-height: 1;
    }
    .type-stat .stat-value.good { color: var(--good); }
    .type-stat .stat-value.bad  { color: var(--bad); }
    .type-stat .stat-value.mid  { color: var(--mid); }
    .type-stat .stat-sub {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 6px;
    }

    /* Framework rebuttal reference card (top of per-type drill) */
    .framework-ref {
      background: linear-gradient(135deg, rgba(91, 158, 255, 0.06), rgba(74, 222, 128, 0.03));
      border: 1px solid rgba(91, 158, 255, 0.18);
      border-radius: var(--radius);
      padding: 18px 22px;
      margin-bottom: 32px;
    }
    .framework-ref-label {
      font-size: 11px;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .framework-ref-text {
      font-size: 14.5px;
      font-style: italic;
      color: var(--text);
      line-height: 1.55;
    }
    .breakdown-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }
    .breakdown-label { font-weight: 500; }
    .breakdown-bar {
      grid-column: 2;
      grid-row: 2;
      height: 6px;
      background: var(--bg-deep);
      border-radius: 3px;
      overflow: hidden;
      margin-top: 8px;
    }
    .breakdown-bar-fill { height: 100%; border-radius: 3px; transition: width 0.6s var(--ease); }
    .breakdown-count { font-weight: 600; font-variant-numeric: tabular-nums; }
    .breakdown-pct { color: var(--text-muted); font-size: 12px; font-variant-numeric: tabular-nums; min-width: 50px; text-align: right; }

    /* ── Empty / spinner ────────────────────────────────────────────── */
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 0.7; } }
    .spinner {
      width: 22px; height: 22px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    .load-state { display: flex; align-items: center; justify-content: center; padding: 40px; }
    .skeleton {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      height: 80px;
      animation: pulse 1.4s ease-in-out infinite;
    }
    .skeleton-donut {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 32px;
      height: 360px;
      animation: pulse 1.4s ease-in-out infinite;
    }

    .empty {
      background: var(--bg-elevated);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      padding: 48px 32px;
      text-align: center;
      color: var(--text-muted);
    }
    .empty h3 { font-size: 16px; font-weight: 600; margin: 0 0 6px; color: var(--text); }
    .empty p { font-size: 13px; margin: 0; }

    .error {
      background: rgba(248, 113, 113, 0.08);
      border: 1px solid rgba(248, 113, 113, 0.25);
      color: #fab7b7;
      padding: 14px 18px;
      border-radius: var(--radius-sm);
      font-size: 13px;
    }

    /* Fade-in on initial render */
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    .fade-in { animation: fadeIn 0.4s var(--ease) both; }

    /* ─── Fathom integration (Scout v2.0 Phase 1) ─────────────────────── */

    /* The Fathom section sits above the donut row. Layout uses the same
       .section + .section-header pattern as the rest of the dashboard so
       the spacing rhythm matches; the inner content varies by connection
       state (CTA card vs. status strip). */
    .fathom-section { margin-bottom: 32px; }

    /* Flash notice at the top of the overview (above the section). Three
       kinds: success / warn / error. Style mirrors .signal-banner so the
       visual vocabulary stays consistent. */
    .fathom-notice {
      border-radius: var(--radius);
      padding: 12px 16px;
      font-size: 12.5px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      animation: fadeIn 0.3s var(--ease) both;
    }
    .fathom-notice-text { flex: 1; min-width: 0; }
    .fathom-notice-dismiss {
      background: transparent;
      border: none;
      color: inherit;
      opacity: 0.6;
      font-size: 16px;
      line-height: 1;
      padding: 4px 6px;
      cursor: pointer;
      border-radius: 4px;
      flex-shrink: 0;
    }
    .fathom-notice-dismiss:hover { opacity: 1; background: rgba(255,255,255,0.05); }
    .fathom-notice.success {
      background: linear-gradient(135deg, rgba(74, 222, 128, 0.10), rgba(74, 222, 128, 0.04));
      border: 1px solid rgba(74, 222, 128, 0.25);
      color: #b6f0c8;
    }
    .fathom-notice.warn {
      background: linear-gradient(135deg, rgba(251, 191, 36, 0.10), rgba(251, 191, 36, 0.04));
      border: 1px solid rgba(251, 191, 36, 0.25);
      color: #fce5a3;
    }
    .fathom-notice.error {
      background: rgba(248, 113, 113, 0.08);
      border: 1px solid rgba(248, 113, 113, 0.25);
      color: #fab7b7;
    }

    /* Disconnected: full CTA card. Larger visual weight to draw attention. */
    .fathom-connect-card {
      background: linear-gradient(135deg, rgba(91, 158, 255, 0.08), rgba(91, 158, 255, 0.02));
      border: 1px solid rgba(91, 158, 255, 0.25);
      border-radius: var(--radius);
      padding: 22px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
    }
    .fathom-connect-text { flex: 1; min-width: 280px; }
    .fathom-connect-title {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--text);
      margin-bottom: 4px;
    }
    .fathom-connect-sub {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    /* Connected / syncing / error: compact status strip. */
    .fathom-strip {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
      font-size: 13px;
    }
    .fathom-strip-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      min-width: 0;
    }
    .fathom-strip-icon {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .fathom-strip-icon.ok    { background: var(--good); box-shadow: 0 0 6px rgba(74, 222, 128, 0.5); }
    .fathom-strip-icon.warn  { background: var(--mid); }
    .fathom-strip-icon.err   { background: var(--bad); }
    .fathom-strip-text { color: var(--text); }
    .fathom-strip-meta { color: var(--text-muted); }
    .fathom-strip-sep  { color: var(--text-dim); margin: 0 4px; }
    .fathom-strip.error {
      border-color: rgba(248, 113, 113, 0.35);
      background: rgba(248, 113, 113, 0.04);
    }
    .fathom-strip-error-text {
      color: #fab7b7;
      font-size: 12px;
      margin-top: 4px;
      line-height: 1.5;
    }

    /* Buttons — Fathom-specific so we don't accidentally restyle the date
       presets. Two variants: primary (Connect / Reconnect) and secondary
       (Sync now). */
    .btn-fathom-primary {
      background: var(--accent);
      color: #061629;
      border: none;
      padding: 9px 18px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: filter 0.15s var(--ease), transform 0.15s var(--ease);
      flex-shrink: 0;
    }
    .btn-fathom-primary:hover { filter: brightness(1.08); }
    .btn-fathom-primary:active { transform: translateY(1px); }
    .btn-fathom-primary:disabled { opacity: 0.55; cursor: wait; }
    .btn-fathom-secondary {
      background: var(--bg-elevated);
      color: var(--text-soft);
      border: 1px solid var(--border);
      padding: 7px 14px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.15s var(--ease);
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-fathom-secondary:hover { border-color: var(--border-hover); color: var(--text); }
    .btn-fathom-secondary:disabled { opacity: 0.5; cursor: wait; }
    .spinner-tiny {
      width: 12px; height: 12px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: inline-block;
    }

    /* ─── Call Library (Scout v2.0 Phase 2) ─────────────────────────────── */

    /* Each row in the Call Library is a clickable card that opens the call
       review page (Phase 2 Step 4; current implementation surfaces a
       "coming soon" notice via the existing fathomNotice system). */
    .library-list { display: flex; flex-direction: column; gap: 10px; }
    .library-card {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      cursor: pointer;
      transition: border-color 0.15s var(--ease), background 0.15s var(--ease);
    }
    .library-card:hover {
      border-color: var(--border-hover);
      background: var(--bg-hover);
    }
    .library-card-main { flex: 1; min-width: 0; }
    .library-card-title {
      font-size: 14.5px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.005em;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .library-card-title.anon { color: var(--text-muted); font-weight: 400; font-style: italic; }
    .library-card-meta {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 5px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }
    .library-card-meta .sep { color: var(--text-dim); }
    .library-card-side {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
    }

    /* Status badges — four variants matching the brief spec.
       Pending  → grey (no analysis yet)
       Analyzing → blue + tiny spinner (analysis_status='processing')
       Score    → green (analysis_status='done', shows N/100)
       Error    → red (analysis_status='error') */
    .library-status-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .library-status-badge.pending {
      background: rgba(139, 139, 139, 0.12);
      color: var(--text-muted);
    }
    .library-status-badge.analyzing {
      background: rgba(91, 158, 255, 0.14);
      color: var(--accent);
    }
    .library-status-badge.done {
      background: rgba(74, 222, 128, 0.12);
      color: var(--good);
      letter-spacing: 0.02em;
    }
    .library-status-badge.error {
      background: rgba(248, 113, 113, 0.12);
      color: var(--bad);
    }
    .library-recording-link {
      font-size: 12px;
      color: var(--text-muted);
      text-decoration: none;
      white-space: nowrap;
      transition: color 0.15s var(--ease);
    }
    .library-recording-link:hover { color: var(--accent); }

    /* Skeleton row used while the first page loads. Same animation as
       .skeleton-donut (pulse) and same surface tokens as .library-card so
       the transition from skeleton → real cards is smooth. */
    .library-skeleton-row {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      height: 68px;
      animation: pulse 1.4s ease-in-out infinite;
    }

    /* ─── Call Review page (Scout v2.0 Phase 2 Step 4) ────────────────────── */

    /* Header strip — back link + title row + meta row + score badge + Fathom link */
    .review-page-header {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 36px;
    }
    .review-back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      align-self: flex-start;
      cursor: pointer;
      transition: all 0.15s var(--ease);
    }
    .review-back-link:hover { color: var(--text); border-color: var(--border-hover); }
    .review-title-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
    }
    .review-title-main { flex: 1; min-width: 0; }
    .review-title {
      font-size: 24px;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin: 0 0 6px;
      word-break: break-word;
    }
    .review-title.anon { color: var(--text-muted); font-weight: 400; font-style: italic; }
    .review-meta-row {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      color: var(--text-muted);
      font-size: 13px;
    }
    .review-meta-row .sep { color: var(--text-dim); }
    .review-title-side {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
    }
    .review-fathom-link {
      font-size: 12.5px;
      color: var(--text-muted);
      transition: color 0.15s var(--ease);
      white-space: nowrap;
    }
    .review-fathom-link:hover { color: var(--accent); }

    /* Error banner — surfaces analysis.status='error' with the reason. */
    .review-analysis-error {
      background: rgba(248, 113, 113, 0.06);
      border: 1px solid rgba(248, 113, 113, 0.22);
      color: #fab7b7;
      padding: 14px 18px;
      border-radius: var(--radius);
      font-size: 13px;
      margin-bottom: 28px;
      line-height: 1.55;
    }
    .review-analysis-error strong { color: #fcd0d0; font-weight: 600; }

    /* Section 1: Call Highlights — the prominent timeline. */
    .review-highlight-list { display: flex; flex-direction: column; gap: 12px; }
    .review-highlight {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 20px;
      display: grid;
      grid-template-columns: 78px 1fr;
      gap: 18px;
      align-items: start;
      transition: border-color 0.15s var(--ease);
    }
    .review-highlight:hover { border-color: var(--border-hover); }
    .review-highlight-time {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
      text-decoration: none;
      padding-top: 2px;
      transition: filter 0.15s var(--ease);
    }
    .review-highlight-time:hover { filter: brightness(1.2); text-decoration: underline; }
    .review-highlight-time.disabled {
      color: var(--text-muted);
      cursor: default;
      pointer-events: none;
    }
    .review-highlight-body { min-width: 0; }
    .review-highlight-row1 {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }
    .review-speaker-badge {
      font-size: 10.5px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      white-space: nowrap;
    }
    .review-speaker-badge.closer   { background: rgba(91, 158, 255, 0.14); color: var(--accent); }
    .review-speaker-badge.prospect { background: rgba(100, 116, 139, 0.18); color: var(--text-soft); }
    .review-type-badge {
      font-size: 10.5px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      white-space: nowrap;
    }
    .review-type-badge.buying_signal      { background: rgba(74, 222, 128, 0.12);  color: var(--good); }
    .review-type-badge.strong_moment      { background: rgba(74, 222, 128, 0.12);  color: var(--good); }
    .review-type-badge.objection          { background: rgba(251, 146, 60, 0.14);  color: var(--orange); }
    .review-type-badge.missed_opportunity { background: rgba(251, 191, 36, 0.12);  color: var(--mid); }
    .review-type-badge.rapport_moment     { background: rgba(91, 158, 255, 0.12);  color: var(--accent); }
    .review-type-badge.disqualify_signal  { background: rgba(100, 116, 139, 0.18); color: var(--text-soft); }
    .review-quote {
      font-size: 13.5px;
      color: var(--text-soft);
      font-style: italic;
      margin-bottom: 6px;
      line-height: 1.55;
    }
    .review-quote::before { content: '\201C'; opacity: 0.5; margin-right: 2px; }
    .review-quote::after  { content: '\201D'; opacity: 0.5; margin-left: 2px; }
    .review-observation {
      font-size: 13.5px;
      color: var(--text);
      line-height: 1.55;
    }

    /* Pending / placeholder for the highlights section. */
    .review-highlights-pending {
      background: var(--bg-elevated);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      padding: 28px 24px;
      text-align: center;
      color: var(--text-muted);
      font-size: 13px;
    }

    /* "One thing to do differently" accent box — footer of the Highlights section. */
    .review-one-thing {
      margin-top: 18px;
      background: linear-gradient(135deg, rgba(91, 158, 255, 0.08), rgba(91, 158, 255, 0.02));
      border: 1px solid rgba(91, 158, 255, 0.25);
      border-radius: var(--radius);
      padding: 16px 20px;
    }
    .review-one-thing-label {
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 8px;
    }
    .review-one-thing-text {
      font-size: 14px;
      color: var(--text);
      line-height: 1.6;
    }
    .review-one-thing-text.placeholder { color: var(--text-muted); font-style: italic; }

    /* "Why this call closed / didn't close" — causal evidence section. */
    .review-why { padding: 20px 22px; }
    .review-why.loss    { border-left: 3px solid var(--bad); }
    .review-why.win     { border-left: 3px solid var(--good); }
    .review-why.pending { border-left: 3px solid var(--mid); }
    .review-why-label {
      font-size: 10.5px; font-weight: 600; letter-spacing: 0.08em;
      text-transform: uppercase; margin-bottom: 10px;
    }
    .review-why.loss    .review-why-label { color: var(--bad); }
    .review-why.win     .review-why-label { color: var(--good); }
    .review-why.pending .review-why-label { color: var(--mid); }
    .review-why-reason { font-size: 15px; color: var(--text); line-height: 1.6; }
    .review-why-quote {
      margin-top: 12px; padding: 10px 14px; border-radius: var(--radius);
      background: rgba(255,255,255,0.03); border: 1px solid var(--border);
      font-size: 13.5px; color: var(--text); font-style: italic; line-height: 1.5;
    }
    .review-why-clip {
      display: inline-flex; align-items: center; gap: 4px; margin-top: 10px;
      font-size: 12px; font-weight: 600; color: var(--accent); text-decoration: none;
    }
    .review-why-clip:hover { text-decoration: underline; }
    /* Cause -> correction connector: one_thing rendered directly beneath the cause. */
    .review-why-connector {
      display: flex; align-items: center; gap: 8px; margin: 14px 0 4px;
      color: var(--text-muted); font-size: 12px; font-weight: 600;
      letter-spacing: 0.04em; text-transform: uppercase;
    }
    .review-why-connector::before,
    .review-why-connector::after {
      content: ''; flex: 1; height: 1px; background: var(--border);
    }
    .review-why .review-one-thing { margin-top: 10px; }

    /* Section 2: Section Grades — five collapsible cards. */
    .review-grades-toggle {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 12px;
      padding: 4px 0;
      cursor: pointer;
      transition: color 0.15s var(--ease);
    }
    .review-grades-toggle:hover { color: var(--text); }
    .review-grade-list { display: flex; flex-direction: column; gap: 10px; }
    .review-grade-card {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      transition: border-color 0.15s var(--ease);
    }
    .review-grade-card:hover { border-color: var(--border-hover); }
    .review-grade-card-header {
      display: grid;
      grid-template-columns: 1fr 60px 80px 24px;
      gap: 16px;
      align-items: center;
      padding: 16px 20px;
      cursor: pointer;
      user-select: none;
    }
    .review-grade-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.005em;
    }
    .review-grade-letter {
      font-size: 22px;
      font-weight: 600;
      text-align: center;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
    }
    .review-grade-letter.A { color: var(--good); }
    .review-grade-letter.B { color: var(--good); opacity: 0.85; }
    .review-grade-letter.C { color: var(--mid); }
    .review-grade-letter.D { color: var(--orange); }
    .review-grade-letter.F { color: var(--bad); }
    .review-grade-letter.empty { color: var(--text-dim); font-size: 18px; font-weight: 400; }
    .review-grade-score {
      font-size: 13px;
      color: var(--text-muted);
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    .review-grade-chevron {
      color: var(--text-muted);
      font-size: 13px;
      transition: transform 0.2s var(--ease);
    }
    .review-grade-card.expanded .review-grade-chevron { transform: rotate(180deg); }
    .review-grade-body {
      padding: 0 20px 18px;
      border-top: 1px solid var(--border);
      margin-top: -1px;
      animation: fadeIn 0.25s var(--ease) both;
    }
    .review-grade-notes {
      font-size: 13px;
      color: var(--text-soft);
      line-height: 1.65;
      white-space: pre-wrap;
      padding-top: 16px;
    }
    .review-grade-notes.placeholder { color: var(--text-muted); font-style: italic; }
    .review-grade-card.not-occurred .review-grade-name { color: var(--text-muted); font-style: italic; }
    /* Part 1b — section highlight breakdown inside an expanded grade card. */
    .review-section-summary {
      font-size: 12.5px;
      color: var(--text-muted);
      line-height: 1.55;
      padding-top: 16px;
    }
    .review-section-group { margin-top: 16px; }
    .review-section-group-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .review-section-group-label::before {
      content: '';
      width: 8px; height: 8px; border-radius: 50%;
    }
    .review-section-group.good  .review-section-group-label { color: var(--pos, #46b17b); }
    .review-section-group.good  .review-section-group-label::before { background: var(--pos, #46b17b); }
    .review-section-group.bad   .review-section-group-label { color: var(--warn, #d99a3d); }
    .review-section-group.bad   .review-section-group-label::before { background: var(--warn, #d99a3d); }
    .review-section-group .review-highlight-list { gap: 10px; }

    /* Skeleton grade card while loading or pending analysis. */
    .review-grade-card.skeleton-card {
      height: 60px;
      animation: pulse 1.4s ease-in-out infinite;
      cursor: default;
    }
    .review-grade-card.skeleton-card:hover { border-color: var(--border); }

    /* Section 3: Follow-up Email — monospace box + copy button. */
    .review-followup-wrap { display: flex; flex-direction: column; gap: 12px; }
    .review-followup-box {
      background: var(--bg-deep);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 22px;
      font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
      color: var(--text-soft);
      line-height: 1.65;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 460px;
      overflow-y: auto;
      user-select: text;
    }
    .review-followup-box.placeholder { color: var(--text-muted); font-style: italic; font-family: inherit; }
    .review-followup-actions { display: flex; gap: 10px; align-items: center; }
    .review-copy-feedback {
      font-size: 12px;
      color: var(--good);
      opacity: 0;
      transition: opacity 0.2s var(--ease);
    }
    .review-copy-feedback.show { opacity: 1; }

    /* Loading skeleton for the whole review page (mirrors the three-section layout). */
    .review-skeleton-section {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      height: 140px;
      margin-bottom: 18px;
      animation: pulse 1.4s ease-in-out infinite;
    }

    /* Scope badge */
    .scope-pill {
      font-size: 10.5px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 4px;
      background: rgba(91, 158, 255, 0.10);
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-left: 10px;
    }
    /* Objection Intelligence view */
    .synth-panel { border: 1px solid var(--border); border-top: 2px solid var(--accent); border-radius: 12px; padding: 18px 18px 6px; margin-bottom: 26px; }
    .synth-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 12px; }
    @media (max-width: 720px) { .synth-grid { grid-template-columns: 1fr; } }
    .synth-block { border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; }
    .synth-block h4 { margin: 0 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
    .synth-block .body { font-size: 13px; color: var(--text); }
    .obj-group-header { font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin: 24px 0 10px; font-weight: 700; }
    .obj-card-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .obj-surface { font-weight: 700; font-size: 14px; }
    .obj-callmeta { margin-left: auto; font-size: 12px; color: var(--muted); }
    .obj-quote { font-size: 14px; margin: 8px 0 4px; }
    .obj-quote.clamped { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .obj-response { display: none; margin-top: 8px; padding: 8px 10px; border-left: 2px solid var(--good); border-radius: 4px; font-size: 13px; }
    .obj-footer { display: flex; gap: 8px; margin-top: 10px; }
    .obj-btn { font-size: 12px; padding: 4px 10px; border: 1px solid var(--border); border-radius: 6px; background: transparent; color: var(--text); cursor: pointer; text-decoration: none; }
    .obj-btn:hover { border-color: var(--accent); }
    .obj-toggle { font-size: 12px; color: var(--accent); cursor: pointer; text-decoration: underline; }

    /* ── Team (manager) view ── */
    .page-header-main h1 { margin: 0; }
    .page-header-side { }
    .team-stat-row { display: flex; flex-wrap: wrap; gap: 14px; }
    .team-stat { flex: 1; min-width: 120px; padding: 14px 16px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg-elevated); }
    .team-stat-val { font-size: 26px; font-weight: 700; color: var(--text); line-height: 1.1; }
    .team-stat-sub { font-size: 13px; font-weight: 500; color: var(--text-muted); }
    .team-stat-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin-top: 6px; }
    /* Manager daily digest */
    .digest-date-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .digest-date-chip { font-size: 12px; padding: 4px 10px; border: 1px solid var(--border); border-radius: 999px; background: var(--bg-elevated); color: var(--text-muted); cursor: pointer; }
    .digest-date-chip.active { color: var(--text); border-color: var(--accent); }
    .digest-summary { font-size: 14px; line-height: 1.55; color: var(--text); margin: 12px 0; }
    .digest-notable { border-left: 3px solid var(--accent); padding: 8px 12px; margin: 8px 0; background: var(--bg-elevated); border-radius: 0 var(--radius) var(--radius) 0; }
    .digest-notable .meta { margin-top: 4px; }
    .digest-focus { margin-top: 14px; padding: 12px 14px; border: 1px solid var(--border); border-left: 3px solid var(--good); border-radius: var(--radius); background: var(--bg-elevated); }
    /* Account Connections rows */
    .conn-row { align-items: center; }
    .conn-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .conn-state { font-size: 13px; color: var(--text-muted); display: inline-flex; align-items: center; gap: 6px; }
    .conn-state.ok { color: var(--text); }
    .conn-disconnect { color: var(--bad); border-color: var(--border-strong); }
    .conn-disconnect:hover { border-color: var(--bad); }
    /* /connect landing: pulse the Zoom row so the Connect button is unmissable. */
    .conn-row-focus { animation: connFocusPulse 2.4s ease-in-out; border-radius: var(--radius); }
    @keyframes connFocusPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0); background: transparent; }
      15%, 55% { box-shadow: 0 0 0 2px rgba(74, 222, 128, 0.55); background: rgba(74, 222, 128, 0.06); }
    }
    .digest-focus-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--good); font-weight: 600; margin-bottom: 6px; }
    /* EOD Report */
    .eod-toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
    .eod-toolbar input[type="date"] { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text); padding: 6px 10px; font-size: 13px; }
    .eod-call { border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg-elevated); padding: 14px 16px; margin-bottom: 12px; }
    .eod-row { display: flex; align-items: baseline; gap: 8px; margin: 6px 0; }
    .eod-label { flex: 0 0 110px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); }
    .eod-input, .eod-textarea { flex: 1; background: var(--bg-field); border: 1px solid var(--border-strong); border-radius: var(--radius); color: var(--text); padding: 6px 9px; font-size: 13px; font-family: inherit; }
    .eod-textarea { min-height: 60px; resize: vertical; line-height: 1.45; }
    .eod-input.edited, .eod-textarea.edited { border-color: var(--accent); }
    .eod-edited-dot { font-size: 10px; color: var(--accent); }
    .eod-copy-note { font-size: 12px; color: var(--good); margin-left: 8px; }
    /* Account view */
    .acct-notice { font-size: 13px; color: var(--text-muted); background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 14px; margin: 8px 0; }
    .acct-save-note { font-size: 12px; margin-left: 10px; }
    .badge-billing-trial    { background: rgba(251, 191, 36, 0.12); color: var(--mid); }
    .badge-billing-active   { background: rgba(74, 222, 128, 0.12); color: var(--good); }
    .badge-billing-past_due { background: rgba(248, 113, 113, 0.12); color: var(--bad); }
    .badge-billing-canceled { background: rgba(139, 139, 139, 0.10); color: var(--text-muted); }
    .trend { font-size: 13px; }
    .trend.up { color: var(--good); } .trend.down { color: var(--bad); } .trend.flat { color: var(--text-muted); }
    .trend-chart { display: flex; align-items: flex-end; gap: 10px; height: 140px; padding: 8px 4px 0; }
    .trend-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; min-width: 24px; }
    .trend-bar { width: 60%; max-width: 46px; background: linear-gradient(180deg, var(--accent), rgba(91,158,255,0.35)); border-radius: 4px 4px 0 0; }
    .trend-bar-val { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
    .trend-bar-label { font-size: 10.5px; color: var(--text-muted); margin-top: 6px; white-space: nowrap; }
    .team-rep-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
    .team-rep-card { border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg-elevated); padding: 16px; cursor: pointer; transition: border-color 0.15s var(--ease), transform 0.1s var(--ease); }
    .team-rep-card:hover { border-color: var(--accent); transform: translateY(-1px); }
    .team-rep-name { font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 12px; text-transform: capitalize; }
    .team-rep-metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .team-rep-metric .v { display: block; font-size: 17px; font-weight: 600; color: var(--text); }
    .team-rep-metric .k { display: block; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-muted); margin-top: 2px; }
    .team-insight { border-left: 3px solid var(--border); padding: 10px 0 10px 14px; margin-bottom: 12px; }
    .team-insight.working { border-left-color: var(--good); } .team-insight.improve { border-left-color: var(--mid); }
    .team-insight-claim { font-size: 14px; color: var(--text); line-height: 1.55; }
    .team-insight-data { font-size: 12.5px; color: var(--text-muted); margin-top: 4px; }
    .team-insight-foot { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
    .team-rep-tag { font-size: 11px; font-weight: 600; color: var(--accent); background: rgba(91,158,255,0.10); padding: 2px 8px; border-radius: 10px; text-transform: capitalize; }
    /* B-1: clickable team glance box + Coach-Summary-styled rep rows + glance-box detail */
    .team-glance { cursor: pointer; transition: border-color 0.15s var(--ease), transform 0.1s var(--ease); }
    .team-glance:hover { border-color: var(--accent); transform: translateY(-1px); }
    .team-glance-caret { color: var(--accent); font-weight: 700; margin-left: 5px; }
    .team-rep-list { display: flex; flex-direction: column; gap: 12px; }
    .team-rep-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
    .team-rep-quick { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12.5px; color: var(--text-muted); }
    .team-rep-quick span { white-space: nowrap; }
    .team-rep-bars { max-width: 560px; }
    .team-detail-list { display: flex; flex-direction: column; gap: 4px; }
    .team-detail-row { display: flex; align-items: center; gap: 14px; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg-elevated); cursor: pointer; transition: border-color 0.15s var(--ease); }
    .team-detail-row:hover { border-color: var(--accent); }
    .team-detail-name { width: 130px; font-size: 14px; font-weight: 600; color: var(--text); text-transform: capitalize; flex-shrink: 0; }
    .team-detail-track { flex: 1; height: 10px; background: var(--border); border-radius: 5px; overflow: hidden; }
    .team-detail-fill { height: 100%; background: var(--accent); border-radius: 5px; }
    .team-detail-val { width: 150px; text-align: right; font-size: 15px; font-weight: 600; color: var(--text); flex-shrink: 0; }
    .team-detail-sub { display: block; font-size: 11px; font-weight: 500; color: var(--text-muted); margin-top: 2px; }
    /* B-1 redesign: compact recommendations card → dedicated expanded page */
    .team-recs-card { border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg-elevated); padding: 16px 18px; cursor: pointer; transition: border-color 0.15s var(--ease), transform 0.1s var(--ease); }
    .team-recs-card:hover { border-color: var(--accent); transform: translateY(-1px); }
    .team-recs-teaser { font-size: 14px; color: var(--text); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .team-recs-expand { font-size: 12px; font-weight: 600; color: var(--accent); margin-top: 8px; }
    /* B-2 "What needs work" card + detail */
    .nw-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .nw-chip { font-size: 12px; color: var(--text-muted); background: var(--bg-field); border: 1px solid var(--border); border-radius: 12px; padding: 3px 10px; }
    .nw-chip b { color: var(--text); }
    .nw-chip-cash { border-color: var(--mid); } .nw-chip-cash b { color: var(--mid); }
    .nw-para { font-size: 15px; line-height: 1.55; color: var(--text); margin-bottom: 20px; }
    .section-subhead { font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); font-weight: 600; margin: 22px 0 10px; }
    .nw-focus-tag { font-size: 10px; font-weight: 600; color: var(--mid); background: rgba(230,170,60,0.12); padding: 1px 6px; border-radius: 8px; text-transform: uppercase; letter-spacing: 0.04em; }
    .nw-miss { font-size: 11px; font-weight: 600; color: var(--mid); }
    .nw-map { display: flex; flex-direction: column; gap: 2px; }
    .nw-map-row { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 4px 0; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
    .nw-map-phrase { color: var(--text); }
    .nw-map-arrow { color: var(--text-muted); }
    .nw-map-bucket { color: var(--accent); font-weight: 600; }
    .nw-map-n { margin-left: auto; font-size: 11.5px; color: var(--text-muted); }
    .nw-method { font-size: 13px; line-height: 1.6; color: var(--text-muted); }
    .nw-method b { color: var(--text); } .nw-method em { color: var(--text); font-style: italic; }
    .nw-caveat { font-size: 12px; color: var(--text-muted); margin-top: 8px; opacity: 0.9; }
    /* #5 context + #3 clickable buckets + evidence */
    .nw-hint { font-weight: 400; text-transform: none; letter-spacing: 0; color: var(--text-muted); }
    .nw-context { font-size: 13px; color: var(--text-muted); background: var(--bg-field); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 14px; margin-top: 14px; }
    .nw-context b { color: var(--text); }
    .nw-bucket-row { cursor: pointer; }
    .nw-bucket-row:hover { border-color: var(--accent); }
    .evidence-list { display: flex; flex-direction: column; gap: 12px; }
    .evidence-row { border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; background: var(--bg-elevated); }
    .evidence-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
    .evidence-title { font-weight: 600; color: var(--text); }
    .evidence-date { font-size: 12px; color: var(--text-muted); }
    .evidence-response { font-size: 13px; color: var(--text); margin-top: 6px; }
    .evidence-response b { color: var(--text-muted); }
    .team-lane-row { display: flex; flex-wrap: wrap; gap: 14px; }
    .team-lane { flex: 1; min-width: 240px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg-elevated); padding: 16px; }
    .team-lane-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--good); font-weight: 700; margin-bottom: 6px; }
    .team-lane-rep { font-size: 13px; font-weight: 600; color: var(--text); text-transform: capitalize; margin-bottom: 8px; }
    .team-lane-why { font-size: 12.5px; color: var(--text-muted); margin-top: 8px; line-height: 1.5; }

    /* ── Knowledge Base (relocated from admin.html) ── */
    /* ── Knowledge Base section ─────────────────────────────────────────── */
    /* Utility classes used by KB markup that don't otherwise exist in this
       page — kept scoped to the KB block so the dashboard.html copy stays
       identical and we don't touch other admin styling. */
    .kb-section {
      padding: 24px 24px 16px;
      border-bottom: 1px solid var(--border);
    }
    .kb-section .section-heading {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--muted);
      margin-bottom: 0;
    }
    .kb-section .load-spinner { display: flex; justify-content: center; padding: 28px 0; }
    .kb-section .load-spinner .spinner { width: 22px; height: 22px; }
    .kb-section .msg-error { padding: 16px 20px; font-size: 12px; color: #f87171; text-align: center; font-family: inherit; }
    .kb-section .empty-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 32px 24px;
      text-align: center;
    }
    .kb-section .empty-card h2 { font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 8px; }
    .kb-section .empty-card p { font-size: 13px; color: var(--muted); margin-bottom: 18px; }

    .kb-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }
    .kb-add-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--green);
      color: #000;
      font-weight: 700;
      font-size: 13px;
      padding: 8px 14px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s;
    }
    .kb-add-btn:hover { background: var(--green-dark); }
    .kb-add-btn:disabled { opacity: 0.6; cursor: wait; }

    .kb-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .kb-item {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      transition: border-color 0.12s;
    }
    .kb-item:hover { border-color: rgba(255,255,255,0.14); }
    .kb-item-main { display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1; }
    .kb-item-title {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      word-break: break-all;
    }
    .kb-item-sub {
      font-size: 12px;
      color: var(--muted);
    }
    .kb-badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      padding: 2px 8px;
      border-radius: 99px;
      border: 1px solid var(--border);
    }
    .kb-badge.kb-type-url   { color: #93c5fd; border-color: rgba(147,197,253,0.3); background: rgba(59,130,246,0.10); }
    .kb-badge.kb-type-pdf   { color: #fca5a5; border-color: rgba(252,165,165,0.3); background: rgba(239,68,68,0.10); }
    .kb-badge.kb-type-paste { color: #d4d4d8; border-color: rgba(212,212,216,0.25); background: rgba(255,255,255,0.04); }
    /* Category badges — visually distinct from type badges (cooler hues:
       teal for offer docs, purple for transcripts) so users can tell the
       two at a glance even though they sit side-by-side. */
    .kb-badge.kb-cat-offer_document      { color: #5eead4; border-color: rgba(94,234,212,0.3); background: rgba(20,184,166,0.10); }
    .kb-badge.kb-cat-winning_call        { color: #c4b5fd; border-color: rgba(196,181,253,0.3); background: rgba(139,92,246,0.10); }
    .kb-badge.kb-cat-script              { color: #93c5fd; border-color: rgba(147,197,253,0.3); background: rgba(59,130,246,0.10); }
    .kb-badge.kb-cat-objection_framework { color: #fcd34d; border-color: rgba(252,211,77,0.3); background: rgba(234,179,8,0.10); }
    .kb-badge.kb-cat-case_study          { color: #86efac; border-color: rgba(134,239,172,0.3); background: rgba(34,197,94,0.10); }
    .kb-badge.kb-cat-training_material   { color: #fdba74; border-color: rgba(253,186,116,0.3); background: rgba(249,115,22,0.10); }
    .kb-badge.kb-scope-global   { color: #fcd34d; border-color: rgba(252,211,77,0.3); background: rgba(234,179,8,0.10); }
    .kb-badge.kb-scope-team     { color: #86efac; border-color: rgba(134,239,172,0.3); background: rgba(34,197,94,0.10); }
    .kb-badge.kb-scope-personal { color: var(--muted); }
    .kb-delete-btn {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.12s;
      flex-shrink: 0;
    }
    /* Promote-to-team (KB Part 2, 2a). Neutral until promoted, then accent-filled
       so a manager can see at a glance which resources the whole team is graded on. */
    /* ── Section drilldown (4a/4b) ──────────────────────────────────── */
    .coach-section-row:hover { background: rgba(255,255,255,0.03); }
    .sec-back { display: inline-block; font-size: 13px; color: var(--text-dim); cursor: pointer; margin-bottom: 6px; }
    .sec-back:hover { color: var(--accent); }
    .sec-headline { display: flex; align-items: center; gap: 20px; margin: 8px 0 6px; }
    .sec-avg { font-size: 46px; font-weight: 600; line-height: 1; }
    .sec-meta { font-size: 13px; color: var(--text-dim); display: flex; flex-direction: column; gap: 2px; }
    .sec-delta.up { color: #6ee7a8; } .sec-delta.down { color: #fca5a5; }
    .sec-coverage { font-size: 13px; color: var(--text-dim); margin-bottom: 14px; }
    .sec-warn { color: #f6c177; font-weight: 600; }
    .sec-hist { display: flex; align-items: flex-end; gap: 10px; height: 110px; margin: 4px 0 6px; }
    .sec-hbar { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; }
    .sec-hbar-fill { width: 100%; background: var(--accent); opacity: 0.65; border-radius: 3px 3px 0 0; min-height: 2px; }
    .sec-hbar-n { font-size: 12px; color: var(--text); margin-top: 4px; }
    .sec-hbar-l { font-size: 11px; color: var(--text-dim); }
    .sec-note { font-size: 12px; color: var(--text-dim); margin-bottom: 18px; font-style: italic; }
    .sec-group { margin-top: 22px; }
    .sec-group h2 { font-size: 15px; margin-bottom: 10px; }
    .sec-count { font-size: 12px; color: var(--text-dim); font-weight: 400; margin-left: 6px; }
    .sec-moment { border: 1px solid var(--border); border-radius: 8px; padding: 11px 13px; margin-bottom: 9px; }
    .sec-moment-top { display: flex; align-items: center; gap: 9px; margin-bottom: 5px; flex-wrap: wrap; }
    .sec-clip { font-size: 12px; color: var(--accent); text-decoration: none; }
    .sec-clip.disabled { color: var(--text-dim); }
    .sec-who { font-size: 13px; font-weight: 600; }
    .sec-when { font-size: 12px; color: var(--text-dim); }
    .sec-saved { margin-left: auto; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--accent); border: 1px solid var(--accent); border-radius: 3px; padding: 1px 6px; }
    .sec-kb-btn { margin-left: auto; font-size: 12px; font-family: inherit; background: none; border: 1px solid var(--border-strong); color: var(--text-dim); border-radius: 5px; padding: 3px 9px; cursor: pointer; }
    .sec-kb-btn:hover:not(:disabled) { color: var(--accent); border-color: var(--accent); }
    .sec-quote { font-size: 14px; }
    .sec-obs { font-size: 13px; color: var(--text-dim); margin-top: 3px; }
    .sec-example { border-left: 2px solid var(--border-strong); padding-left: 11px; margin-bottom: 12px; }
    .sec-ex-head { font-size: 13px; font-weight: 600; margin-bottom: 3px; }
    /* ── Prospect merge review (3d-2) ───────────────────────────────── */
    .merge-list { display: flex; flex-direction: column; gap: 16px; }
    .merge-card { border: 1px solid var(--border-strong); border-radius: 10px; padding: 16px; background: var(--bg-elevated); }
    .merge-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
    .merge-reason { font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--accent); border: 1px solid var(--accent); border-radius: 4px; padding: 2px 7px; }
    .merge-impact { font-size: 12px; color: var(--text-dim); }
    .merge-body { display: flex; gap: 14px; align-items: stretch; flex-wrap: wrap; }
    .merge-side { flex: 1 1 260px; min-width: 240px; border: 1px solid var(--border); border-radius: 8px; padding: 12px; }
    .merge-vs { align-self: center; font-size: 12px; color: var(--text-dim); white-space: nowrap; }
    .merge-name { font-size: 16px; font-weight: 600; margin-bottom: 2px; }
    .merge-callcount { font-size: 12px; color: var(--text-dim); margin-bottom: 10px; }
    .merge-call { border-top: 1px solid var(--border); padding: 8px 0; }
    .merge-call-top { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 3px; }
    .merge-date { font-size: 12px; color: var(--text-dim); }
    .merge-outcome { font-size: 11px; border-radius: 3px; padding: 1px 6px; border: 1px solid var(--border-strong); color: var(--text-dim); }
    .merge-outcome.closed { color: #6ee7a8; border-color: rgba(110,231,168,0.4); }
    .merge-outcome.lost { color: #fca5a5; border-color: rgba(252,165,165,0.4); }
    /* name provenance — stored by 3a, surfaced here for the first time */
    .merge-src, .merge-conf { font-size: 10px; text-transform: uppercase; letter-spacing: 0.03em; border-radius: 3px; padding: 1px 5px; border: 1px solid var(--border-strong); color: var(--text-dim); }
    .merge-src.grader { color: var(--accent); border-color: var(--accent); }
    .merge-conf.low { color: #f6c177; border-color: rgba(246,193,119,0.45); }
    .merge-title { font-size: 12px; color: var(--text-dim); }
    .merge-prose { font-size: 12px; margin-top: 4px; color: var(--text); opacity: 0.85; }
    .merge-actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
    .merge-btn { border-radius: 6px; padding: 7px 13px; font-size: 13px; font-family: inherit; cursor: pointer; background: none; border: 1px solid var(--border-strong); color: var(--text-dim); }
    .merge-btn.do:hover { color: var(--accent); border-color: var(--accent); }
    .merge-btn.keep:hover { color: var(--text); border-color: rgba(255,255,255,0.25); }
    @media (max-width: 720px) { .merge-vs { display: none; } }
    .kb-promote-btn {
      flex-shrink: 0;
      background: none;
      border: 1px solid var(--border-strong);
      color: var(--text-dim);
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      white-space: nowrap;
      transition: color 0.15s, border-color 0.15s, background 0.15s;
    }
    .kb-promote-btn:hover { color: var(--accent); border-color: var(--accent); }
    .kb-promote-btn.is-team {
      color: var(--accent);
      border-color: var(--accent);
      background: rgba(91,158,255,0.10); /* --accent #5b9eff at 10% */
    }
    .kb-promote-btn.is-team:hover { color: var(--text-dim); border-color: var(--border-strong); background: none; }
    .kb-promote-btn:disabled { opacity: 0.5; cursor: wait; }
    /* Add-to-KB on a section-breakdown moment row (Part 2b). Sits with the
       speaker/type badges, pushed right so it never crowds the quote. */
    .review-kb-btn {
      margin-left: auto;
      flex-shrink: 0;
      background: none;
      border: 1px solid var(--border-strong);
      color: var(--text-dim);
      border-radius: 5px;
      padding: 3px 9px;
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
      white-space: nowrap;
      transition: color 0.15s, border-color 0.15s;
    }
    .review-kb-btn:hover:not(:disabled) { color: var(--accent); border-color: var(--accent); }
    .review-kb-btn.is-saved { color: var(--accent); border-color: var(--accent); opacity: 1; cursor: default; }
    .review-kb-btn:disabled:not(.is-saved) { opacity: 0.5; cursor: wait; }
    .kb-delete-btn:hover { color: #fca5a5; border-color: rgba(252,165,165,0.4); }
    .kb-delete-btn:disabled { opacity: 0.5; cursor: wait; }

    /* View patterns button — same shell as delete button, neutral hover.
       Sits to the LEFT of delete in the kb-item flex row. Only emitted
       for items where category === 'learned_pattern'; everything else
       has just the delete button as before. */
    .kb-view-btn {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
