  // ── actions ──────────────────────────────────────────────────────────────

  function datePickerRerender(key) {
    var host = document.getElementById('dp-' + key);
    if (!host) return;                      // not mounted — nothing to do
    host.outerHTML = datePickerHtml(key);
    var ui = pickerUi(key);
    // Focus follows the panel: the focused cell when open, the trigger when closed.
    if (ui.open) {
      var cell = document.querySelector('#dp-' + key + ' [data-dp-focus="1"]');
      if (cell && cell.focus) cell.focus();
    } else {
      var btn = document.getElementById('dp-btn-' + key);
      if (btn && btn.focus) btn.focus();
    }
  }
  // Clicking away closes the panel. Registered once for the whole page: a
  // listener attached per render would stack one copy per re-render, and the
  // control re-renders on every keystroke.
  var DP_OUTSIDE_BOUND = false;
  function bindDatePickerOutside() {
    if (DP_OUTSIDE_BOUND || typeof document.addEventListener !== 'function') return;
    DP_OUTSIDE_BOUND = true;
    document.addEventListener('mousedown', function (e) {
      // ⚠ NODE IDENTITY IS NOT TRUSTWORTHY MID-GESTURE. `contains()` on a target
      // that was detached by a re-render returns false, which this handler used
      // to read as "outside" — closing the picker on the user's second click and
      // discarding their half-made selection. The hover fix removes the churn;
      // this makes the check safe even if some future change reintroduces it.
      var t = e.target;
      if (t && t.isConnected === false) return;   // detached ≠ outside
      Object.keys(PICKER_UI).forEach(function (k) {
        if (!PICKER_UI[k].open) return;
        var host = document.getElementById('dp-' + k);
        if (!host) return;
        if (t && host.contains && host.contains(t)) return;          // inside, by node
        // Geometry as the authority: it does not care what happened to the node.
        var panel = host.querySelector('.dp-panel');
        if (panel && typeof panel.getBoundingClientRect === 'function'
            && typeof e.clientX === 'number') {
          var r = panel.getBoundingClientRect();
          if (e.clientX >= r.left && e.clientX <= r.right
              && e.clientY >= r.top && e.clientY <= r.bottom) return;  // inside, by point
        }
        datePickerClose(k);
      });
    }, true);
  }

  function datePickerToggle(key) {
    var ui = pickerUi(key), r = pickerRange(key);
    ui.open = !ui.open;
    if (ui.open) bindDatePickerOutside();
    if (ui.open) {
      var anchor = (r && ymd(r.to)) || new Date().toISOString().slice(0, 10);
      var p = anchor.split('-');
      ui.year = Number(p[0]); ui.month = Number(p[1]) - 1;
      ui.pending = null; ui.hover = null;
      ui.focus = anchor;                    // keyboard starts on the current end date
    }
    datePickerRerender(key);
  }
  function datePickerNav(key, delta) {
    var ui = pickerUi(key);
    var m = ui.month + delta, y = ui.year;
    if (m < 0) { m = 11; y--; } else if (m > 11) { m = 0; y++; }
    ui.month = m; ui.year = y;
    datePickerRerender(key);
  }
  // ⚠⚠ HOVER MUST NOT REBUILD THE CONTROL. This used to call
  // datePickerRerender, which does `host.outerHTML = …` — destroying and
  // recreating every node on EVERY mouseenter. Moving the mouse from the start
  // date to the end date therefore replaced the node under the cursor, and the
  // following mousedown was dispatched against a node the re-render had just
  // detached. The outside-click handler asked `host.contains(target)`, got false
  // for a detached node, concluded "outside", and closed the picker — wiping the
  // half-made selection. The user's second click never reached datePickerPick,
  // so nothing committed and the URL never changed.
  //
  // A control that rebuilds its own DOM mid-gesture makes every assumption about
  // node identity unsafe. The preview now toggles CLASSES on the cells that are
  // already there; no node is replaced while the mouse is down or moving.
  function datePickerHover(key, day) {
    var ui = pickerUi(key);
    if (!ui.pending) return;                // only matters mid-selection
    if (ui.hover === day) return;           // nothing changed — do no work at all
    ui.hover = day;
    paintRangePreview(key);
  }

  // Repaints the edge/in-range classes on the EXISTING cells. Reuses
  // monthGridCells so the preview logic has exactly one definition — a
  // hand-rolled copy here would be free to drift from the initial render.
  function paintRangePreview(key) {
    var ui = pickerUi(key);
    var host = document.getElementById('dp-' + key);
    if (!host || typeof host.querySelectorAll !== 'function') return;   // not mounted
    if (ui.year == null || ui.month == null) return;
    var r = pickerRange(key);
    var rows = monthGridCells(ui.year, ui.month, r ? ymd(r.from) : null, r ? ymd(r.to) : null, ui.pending, ui.hover);
    var byDay = {};
    rows.forEach(function (row) { row.forEach(function (c) { byDay[c.day] = c; }); });
    var cells = host.querySelectorAll('.dp-day');
    for (var i = 0; i < cells.length; i++) {
      var c = byDay[cells[i].getAttribute('data-day')];
      if (!c) continue;
      var edge = c.isStart || c.isEnd;
      cells[i].classList.toggle('dp-edge', !!edge);
      cells[i].classList.toggle('dp-in', !edge && !!c.inRange);
    }
  }
  function datePickerPick(key, day) {
    var ui = pickerUi(key), inst = DATE_PICKERS[key];
    var res = resolvePick(ui.pending, day);
    ui.pending = res.pending; ui.hover = null; ui.focus = day;
    // ⚠ The FIRST click keeps the existing DOM too — only the hint line and the
    // highlight change. Replacing the panel here is what put a freshly-detached
    // node under the cursor for the very next mousedown.
    if (!res.range) {
      paintRangePreview(key);
      var hint = document.querySelector('#dp-' + key + ' .dp-hint');
      if (hint) hint.textContent = 'Now pick the end date';
      return;
    }
    if (res.range) {
      ui.open = false;
      var iso = rangeToIso(res.range.start, res.range.end);
      datePickerRerender(key);
      if (inst && inst.set) inst.set(iso.from, iso.to);   // caller re-renders its view
      return;
    }
    datePickerRerender(key);
  }
  function datePickerEarliest(key) {
    var ui = pickerUi(key), inst = DATE_PICKERS[key];
    var today = new Date().toISOString().slice(0, 10);
    ui.open = false; ui.pending = null; ui.hover = null;
    datePickerRerender(key);
    var iso = rangeToIso(PICKER_EARLIEST, today);
    if (inst && inst.set) inst.set(iso.from, iso.to);
  }
  function datePickerClose(key) {
    var ui = pickerUi(key);
    if (!ui.open) return;
    ui.open = false; ui.pending = null; ui.hover = null;
    datePickerRerender(key);
  }

  // Keyboard: roving focus across days, Enter/Space to pick, Escape to close,
  // PageUp/PageDown for months, Home/End for the week's ends.
  function datePickerKeydown(key, evt) {
    var ui = pickerUi(key);
    if (!ui.open || !evt) return;
    var k = evt.key, focus = ui.focus, moved = null;
    if (k === 'Escape') { evt.preventDefault(); datePickerClose(key); return; }
    if (k === 'Enter' || k === ' ' || k === 'Spacebar') { evt.preventDefault(); datePickerPick(key, focus); return; }
    if (k === 'ArrowLeft')  moved = addDays(focus, -1);
    else if (k === 'ArrowRight') moved = addDays(focus, 1);
    else if (k === 'ArrowUp')    moved = addDays(focus, -7);
    else if (k === 'ArrowDown')  moved = addDays(focus, 7);
    else if (k === 'Home')       moved = addDays(focus, -(((new Date(focus + 'T00:00:00Z').getUTCDay() + 6) % 7)));
    else if (k === 'End')        moved = addDays(focus, 6 - ((new Date(focus + 'T00:00:00Z').getUTCDay() + 6) % 7));
    else if (k === 'PageUp')     moved = addDays(focus, -28);
    else if (k === 'PageDown')   moved = addDays(focus, 28);
    else return;
    evt.preventDefault();
    ui.focus = moved;
    if (ui.pending) ui.hover = moved;       // keyboard drives the preview too
    var p = moved.split('-');                // follow focus across a month edge
    ui.year = Number(p[0]); ui.month = Number(p[1]) - 1;
    datePickerRerender(key);
  }

  // Dead since 2026-08-17 — their only callers were the +$X at-stake chips:
  //   function moneyRound(x)  → rounded to the nearest 100
  //   function fmtCashNum(n)  → thousands separators
  // fmtCash() is NOT dead — the EOD cash field still uses it.

  // Open/close a glance-box detail (per-rep breakdown of one team metric).
  function openTeamDetail(metric) { state.teamDetailMetric = metric; renderTeamView(); }
  function closeTeamDetail() { state.teamDetailMetric = null; renderTeamView(); }


  // ── THE SPEEDOMETER PANEL (Justin's spec 2026-08-17) ──────────────────────
  // One semicircular dial per rep on a FIXED last-7-days window. Mirrors
  // lib/rep-gauges.js — that module is the definition and this is the render;
  // rep-gauges-mirror.test.js fails if the two drift.
  // ⚠ 35 IS A WORKING BAR, NOT A SETTLED STANDARD. Justin ruled it "for now":
  // it is set where the dial can actually discriminate today, and is meant to be
  // RAISED once reps cluster at the top. His stated standard is 50 — the bare
  // minimum a closer should hit — and 50 put every real needle in red (Josh 21.3%
  // over 30 days, platform best 29.1%, against a red/yellow boundary of 30), which
  // teaches nothing. Do NOT read 35 as the definition of good handling.
  var GAUGE_OBJECTION_TARGET_PCT = 35;   // ← the ONE line to change the target
  var GAUGE_OBJECTION_SCALE_MAX  = 100;
  var GAUGE_CLOSING_TARGET_PCT   = 25;
  var GAUGE_CLOSING_SCALE_MAX    = 50;
  var GAUGE_MID_BAND_FRACTION    = 0.6;
  var GAUGE_SWEEP_DEG            = 240;   // a real dial, not a half circle
  var GAUGE_TICK_STEP_PCT        = 2.5;   // fine and frequent
  var GAUGE_MAJOR_EVERY_PCT      = 20;    // labelled majors
  var GAUGE_MIN_OBJECTIONS       = 6;    // = MIN_CATEGORY_OBJECTIONS
  var GAUGE_MIN_PROSPECTS        = 6;

  function gaugeBand(rate, target) {
    if (typeof rate !== 'number' || !isFinite(rate)) return null;
    if (rate >= target) return 'good';
    if (rate >= target * GAUGE_MID_BAND_FRACTION) return 'mid';
    return 'bad';
  }
  function gaugeAngle(value, scale) {
    var v = (typeof value === 'number' && isFinite(value)) ? value : 0;
    var s = (scale > 0) ? scale : 100;
    return -(GAUGE_SWEEP_DEG / 2) + Math.max(0, Math.min(1, v / s)) * GAUGE_SWEEP_DEG;
  }
  // Polar → cartesian on the dial. 0° is straight up.
  function gaugePoint(cx, cy, r, deg) {
    var a = (deg - 90) * Math.PI / 180;
    return { x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) };
  }
  function gaugeArc(cx, cy, r, fromDeg, toDeg) {
    var p0 = gaugePoint(cx, cy, r, fromDeg), p1 = gaugePoint(cx, cy, r, toDeg);
    var large = (toDeg - fromDeg) > 180 ? 1 : 0;
    return 'M ' + p0.x.toFixed(1) + ' ' + p0.y.toFixed(1)
      + ' A ' + r.toFixed(1) + ' ' + r.toFixed(1) + ' 0 ' + large + ' 1 ' + p1.x.toFixed(1) + ' ' + p1.y.toFixed(1);
  }

  // ⚠ THE NEEDLE IS A FIXED RED POINTER AND CARRIES NO MEANING (Justin) — it is
  // the pointer on a car gauge. The BANDS carry the meaning. Colouring the needle
  // by the band would say it twice and make a red needle on a green dial read as
  // a fault.
  //
  // ⚠ REBUILT 2026-08-17 as an INSTRUMENT rather than a chart: 240° sweep, a
  // recessed face with a radial gradient and a hairline rim, fine ticks every
  // 2.5% with labelled majors INSIDE the ring, colour zones as a THIN OUTER ring
  // that informs rather than shouts, and a slim tapered needle on a small hub.
  // The previous version was a thick 180° band with a fat line and a big dot —
  // Justin: "too cartoony".
  var _gaugeUid = 0;
  function gaugeSvg(rate, target, scale) {
    var W = 200, H = 150, cx = 100, cy = 92;
    var rFace = 74;          // the recessed disc
    var rZone = 70;          // thin colour ring, just inside the rim
    var rTick = 60;          // outer end of the ticks
    var rLabel = 44;         // numbers INSIDE the tick ring
    var uid = 'g' + (++_gaugeUid);
    var a0 = -(GAUGE_SWEEP_DEG / 2), a1 = GAUGE_SWEEP_DEG / 2;

    var defs = '<defs>'
      + '<radialGradient id="' + uid + 'f" cx="50%" cy="38%" r="72%">'
        + '<stop offset="0%" stop-color="#22252b"/><stop offset="62%" stop-color="#15171b"/>'
        + '<stop offset="100%" stop-color="#0c0d10"/></radialGradient>'
      + '</defs>';
    var face = '<circle class="gauge-face" cx="' + cx + '" cy="' + cy + '" r="' + rFace + '" fill="url(#' + uid + 'f)"/>'
      + '<circle class="gauge-rim" cx="' + cx + '" cy="' + cy + '" r="' + rFace + '"/>';

    // Colour zones — a THIN outer ring. Informs, does not shout.
    var midStart = target * GAUGE_MID_BAND_FRACTION;
    var zones = [
      { from: 0, to: midStart, cls: 'bad' },
      { from: midStart, to: target, cls: 'mid' },
      { from: target, to: scale, cls: 'good' },
    ].filter(function (b) { return b.to > b.from; }).map(function (b) {
      return '<path class="gauge-zone gauge-zone-' + b.cls + '" d="'
        + gaugeArc(cx, cy, rZone, gaugeAngle(b.from, scale), gaugeAngle(b.to, scale)) + '"/>';
    }).join('');

    // Fine ticks every 2.5%, labelled majors every 20%, numbers inside the ring.
    var n = Math.round(100 / GAUGE_TICK_STEP_PCT), majorEvery = Math.round(GAUGE_MAJOR_EVERY_PCT / GAUGE_TICK_STEP_PCT);
    var tickEls = [];
    for (var i = 0; i <= n; i++) {
      var value = (scale * i) / n, major = (i % majorEvery === 0), ang = gaugeAngle(value, scale);
      var o = gaugePoint(cx, cy, rTick, ang), inr = gaugePoint(cx, cy, rTick - (major ? 12 : 5), ang);
      tickEls.push('<line class="gauge-tick' + (major ? ' gauge-tick-major' : '') + '" x1="' + o.x.toFixed(1)
        + '" y1="' + o.y.toFixed(1) + '" x2="' + inr.x.toFixed(1) + '" y2="' + inr.y.toFixed(1) + '"/>');
      if (major) {
        var lp = gaugePoint(cx, cy, rLabel, ang);
        tickEls.push('<text class="gauge-tick-label" x="' + lp.x.toFixed(1) + '" y="' + (lp.y + 3.2).toFixed(1) + '">'
          + Math.round(value) + '</text>');
      }
    }

    // The target, marked ON the arc (unchanged rule) — now a fine wedge across
    // the zone ring rather than a bar sticking out of it.
    var tA = gaugeAngle(target, scale);
    var t0 = gaugePoint(cx, cy, rZone + 5, tA), t1 = gaugePoint(cx, cy, rZone - 7, tA);
    var targetMark = '<line class="gauge-target" x1="' + t0.x.toFixed(1) + '" y1="' + t0.y.toFixed(1)
      + '" x2="' + t1.x.toFixed(1) + '" y2="' + t1.y.toFixed(1) + '"/>';

    var needle = '';
    if (typeof rate === 'number') {
      // Slim TAPERED polygon: wide at the hub, a point at the tip, with a short
      // counterweight behind — a pointer, not a line.
      var ang2 = gaugeAngle(rate, scale);
      var tip = gaugePoint(cx, cy, rTick - 2, ang2);
      var lft = gaugePoint(cx, cy, 5, ang2 - 90);
      var rgt = gaugePoint(cx, cy, 5, ang2 + 90);
      var tail = gaugePoint(cx, cy, 13, ang2 + 180);
      needle = '<polygon class="gauge-needle" points="'
        + tip.x.toFixed(1) + ',' + tip.y.toFixed(1) + ' ' + lft.x.toFixed(1) + ',' + lft.y.toFixed(1) + ' '
        + tail.x.toFixed(1) + ',' + tail.y.toFixed(1) + ' ' + rgt.x.toFixed(1) + ',' + rgt.y.toFixed(1) + '"/>'
        + '<circle class="gauge-hub" cx="' + cx + '" cy="' + cy + '" r="7"/>'
        + '<circle class="gauge-hub-ring" cx="' + cx + '" cy="' + cy + '" r="7"/>';
    }
    return '<svg class="gauge-svg" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-hidden="true">'
      + defs + face + zones + tickEls.join('') + targetMark + needle + '</svg>';
  }

  function gaugeCardHtml(rep, metric) {
    var m = (metric === 'closing')
      ? { data: rep.prospects, target: GAUGE_CLOSING_TARGET_PCT, scale: GAUGE_CLOSING_SCALE_MAX, unit: 'closed' }
      : { data: rep.objections, target: GAUGE_OBJECTION_TARGET_PCT, scale: GAUGE_OBJECTION_SCALE_MAX, unit: 'handled' };
    var d = m.data || {};
    var name = escapeHtml(rep.name || 'rep');
    // ⚠ BELOW THRESHOLD: an EMPTY dial with the reason. Never a confident needle
    // at 0% — "handled nothing" and "too few to judge" are different claims.
    if (!d.enough) {
      return '<div class="gauge-card gauge-card-empty">'
        + '<div class="gauge-name">' + name + '</div>'
        + '<div class="gauge-empty">Not enough to judge<span>' + escapeHtml(d.reason || '') + '</span></div>'
        + '</div>';
    }
    var band = gaugeBand(d.rate, m.target);
    return '<div class="gauge-card">'
      + '<div class="gauge-name">' + name + '</div>'
      + '<div class="gauge-dial">' + gaugeSvg(d.rate, m.target, m.scale)
        + '<div class="gauge-readout">'
          + '<div class="gauge-value gauge-value-' + band + '">' + d.rate + '%</div>'
          + '<div class="gauge-target-cap">target ' + m.target + '%</div>'
        + '</div>'
      + '</div>'
      + '<div class="gauge-counts">' + d.numerator + ' of ' + d.total + ' ' + m.unit + '</div>'
      + '</div>';
  }

  function setGaugeMetric(k) { state.teamGaugeMetric = k; renderTeamView(); }

  function gaugePanelHtml() {
    var metric = state.teamGaugeMetric === 'closing' ? 'closing' : 'objections';
    var d = state.teamGauges;
    var sel = '<div class="gauge-metric-select">'
      + [['objections', 'Objection Handling'], ['closing', 'Closing Rate']].map(function (o) {
          return '<button class="gauge-metric-btn' + (metric === o[0] ? ' active' : '') + '" type="button" onclick="setGaugeMetric(\'' + o[0] + '\')">' + o[1] + '</button>';
        }).join('')
      + '</div>';
    var body;
    if (d === null) body = '<div class="skeleton" style="height:150px;"></div>';
    else if (d && d._error) body = '<div class="error">Could not load the dials: ' + escapeHtml(d._error) + '</div>';
    else {
      var reps = repGaugeTotals(d);
      body = reps.length
        ? '<div class="gauge-grid">' + reps.map(function (r) { return gaugeCardHtml(r, metric); }).join('') + '</div>'
        : '<div class="empty"><p>No calls from your reps in the last 7 days.</p></div>';
    }
    return '<div class="section fade-in gauge-section">'
      + '<div class="gauge-head">' + sel
      + '<div class="gauge-window">Last 7 days · fixed — not affected by the date filter below</div></div>'
      + body + '</div>';
  }

  // Mirrors lib/rep-gauges.js repGaugeTotals — pinned by rep-gauges-mirror.test.js.
  function repGaugeTotals(series) {
    var reps = (series && Array.isArray(series.reps)) ? series.reps : [];
    return reps.map(function (r) {
      var h = { handled: 0, total: 0 }, c = { closed: 0, total: 0 };
      (Array.isArray(r.handle) ? r.handle : []).forEach(function (b) { if (b) { h.handled += b.handled || 0; h.total += b.total || 0; } });
      (Array.isArray(r.close) ? r.close : []).forEach(function (b) { if (b) { c.closed += b.closed || 0; c.total += b.total || 0; } });
      return { user_id: r.user_id, name: r.name || null,
        objections: gaugeMeasure(h.handled, h.total, GAUGE_MIN_OBJECTIONS, 'objection'),
        prospects: gaugeMeasure(c.closed, c.total, GAUGE_MIN_PROSPECTS, 'prospect') };
    });
  }
  function gaugeMeasure(numerator, total, floor, unit) {
    var enough = total >= floor;
    return { numerator: numerator, total: total, enough: enough,
      rate: enough ? Math.round((numerator / total) * 100) : null,
      reason: enough ? null : (total === 0 ? ('no ' + unit + 's in the last 7 days')
        : ('only ' + total + ' ' + unit + (total === 1 ? '' : 's') + ' in the last 7 days')) };
  }

  function teamHeaderHtml() {
    var label = (state.teamOverview && state.teamOverview.team && state.teamOverview.team.label) || 'Team';
    var picker = '';
    var ctx = state.teamContext;
    if (ctx && ctx.is_owner && Array.isArray(ctx.teams) && ctx.teams.length) {

        return '<option value="' + escapeHtml(t.key) + '"' + sel + '>' + escapeHtml(t.label) + ' (' + t.rep_count + ')</option>';
      }).join('');

    // Stage 2: the 7d/30d/90d segmented buttons are replaced by the calendar.
    // No presets alongside it, per the ruling.
    ensureTeamPicker();

    /* REMOVED 2026-08-16 — superseded by the date picker above.
    var presets = [7, 30, 90].map(function (d) {
      return '<button class="date-preset' + (state.dateRange.days === d ? ' active' : '') + '" onclick="setTeamRange(' + d + ')">' + d + 'd</button>';
    }).join('');
    */
    // ⚠ THE TITLE AND THE CONTROLS ARE NOW TWO ROWS, so the speedometer panel can
    // sit BETWEEN them (Justin: at the top, above the date picker). Keeping the
    // title above the panel means the page still says what it is; putting the
    // panel above the title would push the page's own name halfway down.
    // The header keeps position:relative + z-index so the date panel still
    // escapes the stacking contexts below it — see the .page-header note.
    return '<div class="page-header fade-in" style="margin-bottom:18px;">'
      + '<div class="page-header-main"><h1>' + escapeHtml(label) + '</h1>'

  // The controls row — picker, team select, buttons. Rendered BELOW the gauge
  // panel so the fixed-window dials read above the filter that does not drive

  function teamControlsHtml() {

      var opts2 = ctx2.teams.map(function (t) {

        return '<option value="' + escapeHtml(t.key) + '"' + sel2 + '>' + escapeHtml(t.label) + ' (' + t.rep_count + ')</option>';

  // "Manage members" opens the hidden #team-members page (not on the page itself).
  function manageMembersBtnHtml() {

  // ── C-1: "Generate summary" — page-agnostic executive summary ──────────────
  // One button across the manager-view pages. It summarizes the page's ALREADY-
  // LOADED data (no re-fetch); the /team/summary endpoint hands Claude the numbers
  // and Claude writes exec-voice prose around them. Popup reuses the kb-modal
  // pattern; copy reuses the eodCopyForSlack clipboard + "Copied ✓" confirmation.
  var _lastSummaryText = '';

  function summaryBtnHtml() {
    // Only render where a summarizable page is active (see currentSummaryPage).
    return currentSummaryPage() ? '<button class="btn-fathom-secondary summary-btn" type="button" onclick="openPageSummary()">✨ Generate Summary</button>' : '';
  }

  // Which manager-view page is on screen (drives both button visibility + payload).
  function currentSummaryPage() {
    if (state.view === 'team') return { key: state.teamDetailMetric ? 'detail' : 'team' };
    if (state.view === 'team-needs-work') return { key: 'needs-work' };
    if (state.view === 'team-expanded') return { key: 'team-recs' };
    if (state.view === 'overview' && hasManagerContext() && !isSelf()) return { key: 'rep-coaching' };
    return null;
  }

  function _summaryTeamLabel() { var o = state.teamOverview; return (o && o.team && o.team.label) || 'Team'; }
  function _trimRep(r) {
    return { name: r.display_name || r.email || (r.user_id || '').slice(0, 8), calls_analyzed: r.calls_analyzed, avg_score: r.avg_score,
      cash_collected: r.cash_collected, close_rate: r.close_rate, obj_handle_rate: r.obj_handle_rate, sections: r.sections };
  }

  // Assemble {label, data} from state for the current page — no fetching.
  // Returns null if the page's data isn't loaded/available yet.
  function buildPageSummaryPayload() {
    var p = currentSummaryPage(); if (!p) return null;
    var o = state.teamOverview;
    if (p.key === 'team') {
      if (!o || o._error || o._forbidden || !o.totals) return null;
      return { label: _summaryTeamLabel() + ' — team overview', data: { team: o.team, totals: o.totals, reps: (o.per_rep || []).map(_trimRep) } };
    }
    if (p.key === 'detail') {
      if (!o || !o.per_rep) return null;
      var m = state.teamDetailMetric;
      var ml = m === 'cash' ? 'Cash collected' : (m === 'close' ? 'Close rate' : 'Objection Handling');
      return { label: _summaryTeamLabel() + ' — ' + ml + ' by rep', data: { metric: ml, reps: (o.per_rep || []).map(_trimRep) } };
    }
    if (p.key === 'needs-work') {
      var d = state.teamNeedsWork; if (!d || d.available === false || !d.card_text) return null;
      return { label: _summaryTeamLabel() + ' — what needs work', data: {
        headline: d.card_text, bucket: d.bucket, extra: d.extra,
        buckets: d.detail && d.detail.buckets, linkage: d.detail && d.detail.linkage, avg_cash: d.detail && d.detail.avg_cash } };
    }
    if (p.key === 'team-recs') {
      var r = state.teamRecs, h = state.teamHighlights;
      var data = {};
      if (r && r.available !== false) data.recommendations = { working: r.working || [], improve: r.improve || [] };
      if (h && h.available !== false) data.highlights = h.lanes || {};
      if (!data.recommendations && !data.highlights) return null;
      return { label: _summaryTeamLabel() + ' — recommendations & highlights', data: data };
    }
    if (p.key === 'rep-coaching') {
      var a = state.analytics2; if (!a || !a.calls) return null;
      var u = (state.users || []).filter(function (x) { return x.user_id === state.viewingUserId; })[0];
      var who = (u && u.email) || 'This rep';
      return { label: who + ' — coaching dashboard', data: {
        rep: who, calls: a.calls, avg_score: a.avg_score, objections: a.objections,
        cash_collected: a.cash_collected, close_rate: a.close_rate, close_wins: a.close_wins, close_decided: a.close_decided,
        sections: a.sections, weakest_section: a.weakest_section, strongest_section: a.strongest_section } };
    }
    return null;
  }

  async function openPageSummary() {
    var modal = document.getElementById('summaryModal');
    var titleEl = document.getElementById('summaryModalTitle');
    var bodyEl = document.getElementById('summaryModalBody');
    if (!modal || !bodyEl) return;
    var payload = buildPageSummaryPayload();
    if (!payload) {
      titleEl.textContent = 'Summary';
      bodyEl.innerHTML = '<div class="empty"><p>This page is still loading — give it a moment, then generate the summary.</p></div>';
      modal.classList.remove('hidden'); return;
    }
    titleEl.textContent = payload.label;
    bodyEl.innerHTML = '<div class="load-state" style="padding:16px 4px;"><div class="spinner"></div> Generating summary…</div>';
    modal.classList.remove('hidden');
    try {
      var res = await fetch('/team/summary', {
        method: 'POST',
        headers: Object.assign({ 'Content-Type': 'application/json' }, authHeader()),
        body: JSON.stringify({ page_label: payload.label, data: payload.data }),
      });
      if (res.status === 401) { clearSession(); window.location.replace('/login'); return; }
      if (res.status === 403) { bodyEl.innerHTML = '<div class="empty"><p>Not authorized.</p></div>'; return; }
      if (!res.ok) throw new Error('HTTP ' + res.status);
      var d = await res.json();
      if (!d.available) { bodyEl.innerHTML = '<div class="empty"><p>' + escapeHtml(d.reason || 'Could not generate a summary right now.') + '</p></div>'; return; }
      _lastSummaryText = d.summary || '';
      bodyEl.innerHTML = '<div class="summary-text">' + escapeHtml(_lastSummaryText).replace(/\n/g, '<br>') + '</div>'
        + '<div class="summary-actions"><button class="btn-fathom-secondary" type="button" onclick="copyPageSummary()">Copy for Slack</button>'
        + '<span id="summaryCopyNote" class="copy-note"></span></div>';
    } catch (err) {
      bodyEl.innerHTML = '<div class="error">Could not generate summary: ' + escapeHtml(err.message || 'unknown') + '</div>';
    }
  }
  // ── User Management: #team-members hidden page (manager+owner) ─────────────
  function renderTeamMembersView() {
    var content = document.getElementById('content');
    ensureTeamDefaultRange();
    if (state.teamContext === null) loadTeam('context');
    if (state.teamOverview === null && !state.teamOverviewLoading) loadTeam('overview');
    content.innerHTML = teamHeaderHtml() + teamControlsHtml()
      + '<div class="section fade-in"><div class="section-header"><div><h2>Manage Members</h2>'
        + '<div class="meta">add, deactivate, move, reset password, or update a rep\'s email</div></div>'
        + '<button class="date-preset" onclick="goTeam()">← Back to Team</button></div>'
        + teamMembersBodyHtml() + '</div>';
  }
  function teamMembersScope() {
    var o = state.teamOverview;
    var key = (o && o.team && o.team.key) || state.me.user_id;
    return { key: key, members: (state.users || []).filter(function (u) { return u.managed_by === key; }) };
  }
  function teamMembersBodyHtml() {
    if (!state.users) return '<div class="skeleton" style="height:120px;"></div>';
    var isOwner = state.me.role === 'owner';
    var sc = teamMembersScope();
    var members = sc.members.slice().sort(function (a, b) {
      // active first, then by email
      if ((a.active !== false) !== (b.active !== false)) return (a.active !== false) ? -1 : 1;
      return (a.email || '').localeCompare(b.email || '');
    });
    var seatsActive = members.filter(function (m) { return m.active !== false; }).length;
    var managerOpts = (state.users || []).filter(function (u) { return u.role === 'manager' || u.role === 'owner'; });
    var head = '<div class="members-toolbar"><div class="members-seats">Seats: <b>' + seatsActive + ' active</b>'
      + (members.length !== seatsActive ? ' <span class="team-stat-sub">· ' + (members.length - seatsActive) + ' inactive</span>' : '') + '</div>'
      + '<button class="btn-fathom-secondary" type="button" onclick="openAddMember()">+ Add rep</button></div>';
    if (!members.length) return head + '<div class="empty"><p>No reps on this team yet. Use “+ Add rep” to invite one.</p></div>';
    var rows = members.map(function (m) {
      var active = m.active !== false;
      var name = personName(m, m.email, m.user_id);
      var moveSel = '<select class="user-select members-move" onchange="moveMember(\'' + m.user_id + '\', this.value)">'
        + managerOpts.map(function (mo) {
          return '<option value="' + escapeHtml(mo.user_id) + '"' + (mo.user_id === m.managed_by ? ' selected' : '') + '>'
            + escapeHtml((mo.user_id === state.me.user_id ? 'Me' : (mo.email || mo.user_id))) + '</option>';
        }).join('') + '</select>';
      var acts = '<button class="members-act" onclick="' + (active ? 'deactivateMember' : 'reactivateMember') + '(\'' + m.user_id + '\')">' + (active ? 'Deactivate' : 'Reactivate') + '</button>'
        + '<button class="members-act" onclick="editMemberEmail(\'' + m.user_id + '\', \'' + escapeHtml(m.email || '') + '\')">Email</button>'
        + '<button class="members-act" onclick="sendMemberReset(\'' + m.user_id + '\')">Reset Link</button>'
        + (isOwner ? '<button class="members-act danger" onclick="deleteMember(\'' + m.user_id + '\', \'' + escapeHtml(m.email || '') + '\')">Delete</button>' : '');
      return '<tr class="' + (active ? '' : 'inactive') + '">'
        + '<td><div class="members-name">' + escapeHtml(name) + '</div><div class="members-email">' + escapeHtml(m.email || '') + '</div></td>'
        + '<td>' + escapeHtml(m.role || 'user') + '</td>'
        + '<td>' + (active ? '<span class="member-badge on">● active</span>' : '<span class="member-badge off">○ inactive</span>') + '</td>'
        + '<td>' + escapeHtml(m.billing_plan || '—') + '</td>'
        + '<td>' + moveSel + '</td>'
        + '<td class="members-actions">' + acts + '</td>'
        + '</tr>';
    }).join('');
    return head + '<div style="overflow-x:auto;"><table class="members-table"><thead><tr>'
      + '<th>Rep</th><th>Role</th><th>Status</th><th>Plan</th><th>Manager</th><th></th></tr></thead><tbody>'
      + rows + '</tbody></table></div>'
      + '<div class="meta" style="margin-top:10px;">Seat = an active user. Deactivating frees a seat; adding or reactivating adds one. Plan is per-user until the billing block adds an account entity.</div>';
  }
  // Re-fetch users (+ team roster when membership changed) and re-render.
  async function refreshMembers(rosterChanged) {
    try { await loadUsers(); } catch (e) {}
    if (rosterChanged) { state.teamOverview = null; if (state.view === 'team-members') loadTeam('overview'); }
    if (state.view === 'team-members') renderTeamMembersView();
  }
  async function memberAction(url, opts, okMsg) {
    try {
      var res = await fetch(url, Object.assign({ headers: Object.assign({ 'Content-Type': 'application/json' }, authHeader()) }, opts || {}));
      if (res.status === 401) { clearSession(); window.location.replace('/login'); return { ok: false }; }
      var d = null; try { d = await res.json(); } catch (e) {}
      if (!res.ok) { alert((d && d.error) || ('Request failed (HTTP ' + res.status + ')')); return { ok: false, data: d, status: res.status }; }
      if (okMsg) alert(okMsg);
      return { ok: true, data: d };
    } catch (err) { alert('Request failed: ' + (err.message || 'unknown')); return { ok: false }; }
  }
  async function deactivateMember(uid) {
    if (!confirm('Deactivate this rep? They will be unable to log in and the seat is freed. Their calls and history stay.')) return;
    var r = await memberAction('/admin/users/' + encodeURIComponent(uid) + '/deactivate', { method: 'POST', body: '{}' });
    if (r.ok) refreshMembers(false);
  }
  async function reactivateMember(uid) {
    if (!confirm('Reactivate this rep? This adds a billable seat and restores their login.')) return;
    var r = await memberAction('/admin/users/' + encodeURIComponent(uid) + '/reactivate', { method: 'POST', body: '{}' });
    if (r.ok) refreshMembers(false);
  }
  async function moveMember(uid, newManagedBy) {
    if (!newManagedBy || newManagedBy === '') return;
    var r = await memberAction('/admin/users/' + encodeURIComponent(uid) + '/managed_by', { method: 'PATCH', body: JSON.stringify({ managed_by: newManagedBy }) });
    refreshMembers(true); // roster changed either way (re-sync the picker state)
  }
  async function sendMemberReset(uid) {
    var r = await memberAction('/admin/users/' + encodeURIComponent(uid) + '/welcome-email', { method: 'POST', body: '{}' });
    if (r.ok) alert((r.data && r.data.welcome_email === 'invite_sent') ? 'Reset link sent.' : ('Status: ' + (r.data && r.data.welcome_email)));
  }
  async function editMemberEmail(uid, oldEmail) {
    var ne = window.prompt('New login email (a heads-up is sent to the old address):', oldEmail || '');
    if (!ne || !ne.trim() || ne.trim() === oldEmail) return;
    var r = await memberAction('/admin/users/' + encodeURIComponent(uid) + '/email', { method: 'PATCH', body: JSON.stringify({ email: ne.trim() }) });
    if (r.ok) { alert('Email updated' + (r.data && r.data.old_notified === 'sent' ? ' — old address notified.' : '.')); refreshMembers(false); }
  }
  async function deleteMember(uid, email) {
    if (!confirm('Permanently delete ' + (email || 'this rep') + '?\n\nThis removes their account and all their data, and can’t be undone.\n\n(Only allowed if they have no call history — otherwise deactivate instead.)')) return;
    var r = await memberAction('/admin/users/' + encodeURIComponent(uid), { method: 'DELETE', body: '{}' });
    if (r.ok) { alert('User deleted.'); refreshMembers(true); }
  }
  function openAddMember() {
    var m = document.getElementById('memberAddModal'); if (!m) return;
    ['maEmail', 'maFirst', 'maLast'].forEach(function (id) { var el = document.getElementById(id); if (el) el.value = ''; });
    var note = document.getElementById('maNote'); if (note) note.textContent = '';
    m.classList.remove('hidden');
  }
  function closeAddMember() { var m = document.getElementById('memberAddModal'); if (m) m.classList.add('hidden'); }
  async function submitAddMember() {
    var email = (document.getElementById('maEmail') || {}).value || '';
    var first = (document.getElementById('maFirst') || {}).value || '';
    var last = (document.getElementById('maLast') || {}).value || '';
    var note = document.getElementById('maNote');
    if (!email.trim() || email.indexOf('@') === -1 || !first.trim() || !last.trim()) { if (note) note.textContent = 'Email, first and last name are required.'; return; }
    // BUGFIX (2026-07-31): send managed_by = the team being managed. Without it an
    // OWNER adding a rep here created it UNMANAGED (the "force managed_by=self" only
    // runs for non-owners), leaving the rep with no manager. A manager's value is
    // ignored server-side (forced to self), so this is correct for both roles.
    var r = await memberAction('/admin/users', { method: 'POST', body: JSON.stringify({ email: email.trim(), first_name: first.trim(), last_name: last.trim(), role: 'user', managed_by: teamMembersScope().key }) });
    if (r.ok) {
      var tp = r.data && r.data.temp_password;
      var we = r.data && r.data.welcome_email;
      if (note) note.textContent = (we === 'invite_sent') ? 'Invited — a login email was sent.' : ('Created. Temp password: ' + tp);
      refreshMembers(true);
      if (we === 'invite_sent') setTimeout(closeAddMember, 1200);
    }
  }
  function closeSummaryModal() { var m = document.getElementById('summaryModal'); if (m) m.classList.add('hidden'); }

  // ── Item #3: per-call bucket evidence (click a bucket in the needs-work detail)
  async function openBucketEvidence(subject, label) {
    var d = subject === 'personal' ? state.needsWork : state.teamNeedsWork;
    if (!d || !d.detail) return;
    var surfaces = (d.detail.mapping || []).filter(function (m) { return m.bucket === label; }).map(function (m) { return m.surface; });
    var modal = document.getElementById('bucketEvidenceModal');
    var titleEl = document.getElementById('bucketEvidenceTitle');
    var bodyEl = document.getElementById('bucketEvidenceBody');
    if (!modal) return;
    titleEl.textContent = label + ' — the calls';
    bodyEl.innerHTML = '<div class="load-state" style="padding:16px 4px;"><div class="spinner"></div> Loading calls…</div>';
    modal.classList.remove('hidden');
    if (!surfaces.length) { bodyEl.innerHTML = '<div class="empty"><p>No phrases mapped to this bucket.</p></div>'; return; }
    // Team evidence must window by the TEAM range, personal by coaching's.
    var evRange = (subject === 'team') ? teamRange() : state.dateRange;
    var url, body = { surfaces: surfaces, from: evRange.from, to: evRange.to };
    if (subject === 'team') url = '/team/needs-work/bucket?' + teamQP();
    else url = isSelf() ? '/me/needs-work/bucket' : '/admin/needs-work/' + encodeURIComponent(state.viewingUserId) + '/bucket';
    try {
      var res = await fetch(url, { method: 'POST', headers: Object.assign({ 'Content-Type': 'application/json' }, authHeader()), body: JSON.stringify(body) });
      if (res.status === 401) { clearSession(); window.location.replace('/login'); return; }
      if (!res.ok) { var e = null; try { e = await res.json(); } catch (x) {} bodyEl.innerHTML = '<div class="error">Could not load: ' + escapeHtml((e && e.error) || ('HTTP ' + res.status)) + '</div>'; return; }
      var calls = ((await res.json()) || {}).calls || [];
      if (!calls.length) { bodyEl.innerHTML = '<div class="empty"><p>No calls found for this bucket in the selected period.</p></div>'; return; }
      bodyEl.innerHTML = '<div class="evidence-list">' + calls.map(evidenceRowHtml).join('') + '</div>';
    } catch (err) { bodyEl.innerHTML = '<div class="error">Could not load: ' + escapeHtml(err.message || 'unknown') + '</div>'; }
  }
  function evidenceRowHtml(c) {
    var date = c.date ? formatNaturalDate(c.date) : '';
    var clip = c.clip_url ? '<a class="review-why-clip" href="' + escapeHtml(c.clip_url) + '" target="_blank" rel="noopener">▶ Clip</a>' : '';
    return '<div class="evidence-row">'
      + '<div class="evidence-head"><span class="evidence-title">' + escapeHtml(c.title || 'Untitled Call') + '</span>'
        + '<span class="evidence-date">' + escapeHtml(date) + '</span>'
        + (c.handled ? '<span class="member-badge on">handled</span>' : '<span class="nw-miss">not handled</span>') + '</div>'
      + (c.quote ? '<div class="review-why-quote">“' + escapeHtml(c.quote) + '”</div>' : '')
      + (c.closer_response ? '<div class="evidence-response"><b>Your response:</b> ' + escapeHtml(c.closer_response) + '</div>' : '')
      + (clip ? '<div class="team-insight-foot">' + clip + '</div>' : '')
    + '</div>';
  }
  function closeBucketEvidence() { var m = document.getElementById('bucketEvidenceModal'); if (m) m.classList.add('hidden'); }
  async function copyPageSummary() {
    var note = document.getElementById('summaryCopyNote');
    try {
      await navigator.clipboard.writeText(_lastSummaryText);
      if (note) { note.textContent = 'Copied ✓'; setTimeout(function () { if (note) note.textContent = ''; }, 2500); }
    } catch (e) { window.prompt('Copy the summary below:', _lastSummaryText); }
  }

  function trendArrow(t) {
    if (t > 0) return '<span class="trend up" title="up vs prior period">▲</span>';
    if (t < 0) return '<span class="trend down" title="down vs prior period">▼</span>';
    return '<span class="trend flat" title="flat vs prior period">—</span>';
  }
  function teamAggregateHtml() {
    var o = state.teamOverview;
    if (o && o._forbidden) return '<div class="error">Not authorized for this team.</div>';
    if (o && o._error) return '<div class="error">Could not load team overview: ' + escapeHtml(o._error) + '</div>';
    if (!o) return '<div class="skeleton" style="height:80px;"></div>';
    var t = o.totals;
    function stat(label, val, extra) {
      return '<div class="team-stat"><div class="team-stat-val">' + val + (extra || '') + '</div><div class="team-stat-label">' + label + '</div></div>';
    }
    // Clickable glance box → per-rep detail breakdown of that metric.
    function glance(metric, label, val, sub) {
      return '<div class="team-stat team-glance" onclick="openTeamDetail(\'' + metric + '\')" title="Break ' + label + ' down by rep">'
        + '<div class="team-stat-val">' + val + '</div>'
        + '<div class="team-stat-label">' + label + '<span class="team-glance-caret">›</span></div>'
        + (sub ? '<div class="team-stat-sub" style="display:block;margin-top:3px;">' + sub + '</div>' : '')
        + '</div>';
    }
    return '<div class="team-stat-row">'
      + stat('Reps active', t.active_reps + '<span class="team-stat-sub">/' + t.reps + '</span>')
      + stat('Calls analyzed', t.calls_analyzed)
      + glance('cash', 'Cash collected', fmtCash(t.cash_collected), 'across closed calls')
      + glance('close', 'Close rate', closeRateDisplay(t).value, closeRateDisplay(t).sub)
      + glance('objection', 'Objection handle', (t.obj_handle_rate == null ? '—' : t.obj_handle_rate + '%'), t.objections_handled + '/' + t.objections_total + ' handled')
      + stat('Avg score', (t.avg_score == null ? '—' : t.avg_score), ' ' + trendArrow(t.avg_score != null && t.prior_avg_score != null ? (t.avg_score - t.prior_avg_score) : 0))
      + '</div>';
  }

  // "$12,900" — whole dollars, thousands separators. Non-finite → "$0".
  function fmtCash(n) {
    var v = Number(n); if (!isFinite(v)) v = 0;
    return '$' + Math.round(v).toLocaleString('en-US');
  }
  // RETIRED 2026-07-26 (B-1 redesign): the five-bar Coach-Summary member cards
  // were replaced by three ranked score lists (Team overview / Closing / Objection
  // handling). sectionBarsHtml + teamRepCardsHtml kept here, commented, for reference.

  // ⚠ MIRRORS lib/display-name.js — pinned by display-name-mirror.test.js.
  // The page has no module system, so the rules exist twice; they must not
  // diverge, or the same person is named differently on two screens, which is
  // the exact complaint this replaced.
  function titleCaseHandle(handle) {
    return String(handle || '').replace(/[._\-+]+/g, ' ').replace(/\s+/g, ' ').trim()
      .split(' ').filter(Boolean)
      // Only the FIRST letter is forced — upper-casing the rest would turn
      // "McCarthy" into "Mccarthy".
      .map(function (w) { return w.charAt(0).toUpperCase() + w.slice(1); }).join(' ');
  }
  function displayNameFromEmail(email, fallback) {
    if (!email) return fallback || '';
    var local = email.indexOf('@') !== -1 ? email.split('@')[0] : email;
    return titleCaseHandle(local) || (fallback || '');
  }
  function personName(profile, email, userId) {
    var first = (profile && typeof profile.first_name === 'string') ? profile.first_name.trim() : '';
    var last = (profile && typeof profile.last_name === 'string') ? profile.last_name.trim() : '';
    if (first || last) return (first + ' ' + last).trim();
    if (email) return displayNameFromEmail(email);
    return userId ? String(userId).slice(0, 8) : '';
  }
  function repName(r) { return r.display_name || personName(r, r.email, r.user_id); }

  // ══ 10c-2: THE REP CARDS ═════════════════════════════════════════════════
  //
  // One card per rep, WORST FIRST. Every number here is computed in JS
  // (lib/rep-card-metrics via /team/overview) — nothing on this card is a model
  // output. The WHY slot is left empty until 10d fills it.
  //
  // ⚠ UNMEASURED IS SAID IN WORDS, NEVER A DASH. "—" reads as zero, and a rep
  // with no prospects has not closed 0% — they have no prospects. The distinction
  // is the same one the graphs make between an empty bucket and a real zero.
  var OBJECTION_LABEL = { fear: 'Fear / money', timing: 'Timing', logistical: 'Logistical', partner: 'Partner / spouse' };

  // ⚠ WHEN UNMEASURED, THE WORDS ARE THE VALUE — there is no dash at all. A big
  // "—" sitting where a percentage goes reads as zero however carefully the line
  // beneath it is worded, which is the whole point of the ruling.
  // ⚠ ONE STRUCTURE FOR BOTH STATES: label, then value, then detail. The first
  // version put the label first only when unmeasured, which left mixed cards
  // visibly ragged — the big number and the small label sat on different
  // baselines in the same row.
  function repCardStat(label, value, sub, unmeasured) {
    return '<div class="rep-stat' + (unmeasured ? ' rep-stat-none' : '') + '">'
      + '<div class="rep-stat-label">' + escapeHtml(label) + '</div>'
      + (unmeasured
          ? '<div class="rep-stat-none-val">' + escapeHtml(sub) + '</div>'
          : '<div class="rep-stat-val">' + escapeHtml(value) + '</div>'
            + '<div class="rep-stat-sub">' + escapeHtml(sub) + '</div>')
      + '</div>';
  }

  // The weakest-objection line, including the ruling that a ranking needs a team.
  function repWeakestObjectionHtml(wo) {
    if (!wo) {
      return '<div class="rep-weak"><span class="rep-weak-label">Weakest objection</span>'
        + '<span class="rep-weak-none">not enough objections yet to judge a category</span></div>';
    }
    var name = OBJECTION_LABEL[wo.category] || wo.category;
    // ⚠ The comparison appears ONLY when it qualifies (≥3 reps with ≥6 in that
    // category). Off n=1 a ranking reads as a finding and means nothing.
    var comparison = wo.comparable
      ? '<span class="rep-weak-cmp">team ' + wo.team_rate + '%'
          + (wo.is_lowest ? ' · <strong>lowest on the team</strong>' : '') + '</span>'
      : '';
    return '<div class="rep-weak"><span class="rep-weak-label">Weakest objection</span>'
      + '<span class="rep-weak-val">' + escapeHtml(name) + ' ' + wo.rate + '%</span>'
      + '<span class="rep-weak-sub">' + wo.handled + ' of ' + wo.total + ' handled</span>'
      + comparison
      + '</div>';
  }

  function repWeakestSectionHtml(ws) {
    if (!ws) {
      return '<div class="rep-weak"><span class="rep-weak-label">Weakest section</span>'
        + '<span class="rep-weak-none">no scored sections yet</span></div>';
    }
    return '<div class="rep-weak"><span class="rep-weak-label">Weakest section</span>'
      + '<span class="rep-weak-val">' + escapeHtml(SECTION_LABEL[ws.section] || ws.section) + ' ' + ws.score + '</span></div>';
  }

  function repCardHtml(r) {
    var close = closeRateDisplay(r);
    var closeUnmeasured = !(r.prospect_close_total > 0);
    var objUnmeasured = !(r.obj_total > 0);
    var stats = repCardStat('Closing Rate',
          closeUnmeasured ? '' : close.value,
          closeUnmeasured ? 'No prospects yet' : close.sub,
          closeUnmeasured)
      + repCardStat('Objection Handling',
          objUnmeasured ? '' : r.obj_handle_rate + '%',
          objUnmeasured ? 'No objections yet' : (r.obj_handled + ' of ' + r.obj_total + ' handled'),
          objUnmeasured);

    // 10d: the verified sentence, if it has loaded. Absent while loading and
    // absent on failure — the card is complete without it, and a half-sentence
    // or a spinner in a summary slot is worse than nothing.
    var w = state.teamWhy && state.teamWhy.by_rep && state.teamWhy.by_rep[r.user_id];
    var why = (w && w.sentence)
      ? '<div class="rep-why">' + escapeHtml(w.sentence) + '</div>'
      : '';

    return '<div class="rep-card" onclick="setUser(\'' + escapeHtml(r.user_id) + '\')"'
      + ' title="Open ' + escapeHtml(repName(r)) + '\'s report">'
      + '<div class="rep-card-head">'
        + '<div class="rep-card-name">' + escapeHtml(repName(r)) + '</div>'
        + '<div class="rep-card-calls">' + r.calls_analyzed + ' call' + (r.calls_analyzed === 1 ? '' : 's') + '</div>'
      + '</div>'
      + '<div class="rep-card-stats">' + stats + '</div>'
      + repWeakestSectionHtml(r.weakest_section)
      + repWeakestObjectionHtml(r.weakest_objection)
      + why
      + '</div>';
  }

  // Mirrors lib/rep-card-metrics.sortRepsWorstFirst. Kept inline because the
  // page has no module loader; the mirror test forbids the two from drifting.
  // Closing rate ascending, reps with NO prospects LAST — a genuine 0% is worst,
  // zero prospects is unmeasured.
  function sortRepsWorstFirst(reps) {
    if (!Array.isArray(reps)) return [];
    return reps.slice().sort(function (a, b) {
      var am = a.prospect_close_total > 0 && typeof a.prospect_close_rate === 'number';
      var bm = b.prospect_close_total > 0 && typeof b.prospect_close_rate === 'number';
      if (am !== bm) return am ? -1 : 1;
      if (am && a.prospect_close_rate !== b.prospect_close_rate) {
        return a.prospect_close_rate - b.prospect_close_rate;
      }
      return String(a.display_name || '').localeCompare(String(b.display_name || ''));
    });
  }

  function repCardsHtml() {
    var o = state.teamOverview;
    if (o === null) return '<div class="section fade-in"><div class="section-header"><h2>Reps</h2></div>'
      + '<div class="skeleton" style="height:120px;"></div></div>';
    if (o._forbidden || o._error) return '';
    var reps = sortRepsWorstFirst(o.per_rep || []);
    if (!reps.length) {
      return '<div class="section fade-in"><div class="section-header"><h2>Reps</h2></div>'
        + '<div class="empty"><p>No reps in this team yet.</p></div></div>';
    }
    return '<div class="section fade-in">'
      + '<div class="section-header"><h2>Reps</h2>'
        + '<div class="meta">weakest first · click a rep to open their report</div></div>'
      + '<div class="rep-card-list">' + reps.map(repCardHtml).join('') + '</div>'
      + '</div>';
  }

    objection: { title: 'Objection handle rate', meta: 'objections resolved "handled", by rep',

                 label: function (r) { return r.obj_handle_rate == null ? '—' : r.obj_handle_rate + '%'; },
                 sub:   function (r) { return r.obj_total ? (r.obj_handled + '/' + r.obj_total + ' handled') : 'no objections'; } },

  function teamDetailHtml() {

  function selectDigestDate(dt) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(dt)) return;

  // ─── URL hash routing ──────────────────────────────────────────────────────
  // Persist the active view in the URL hash so refresh / deep-link / back-forward
  // restore it. The ?user= admin pivot stays in the query string, untouched.
  //   overview         → (no hash)      call-library     → #calls
  //   objections-intel → #objections    call-review      → #call/<id>
  // (Dormant Live-Sessions drills carry no hash — they're unreachable today.)
  function rangeHashSuffix(r) {
    if (!r || !r.from || !r.to) return '';
    return '?from=' + ymd(r.from) + '&to=' + ymd(r.to);
  }
  function teamRangeHashSuffix() { return rangeHashSuffix(state.teamRange); }
  // The coaching family (overview, needs-work, performance, objections, section)
  // all read state.dateRange, so they all carry the same suffix.
  function coachingRangeHashSuffix() { return rangeHashSuffix(state.dateRange); }
  // '#team?from=2026-08-03&to=2026-08-10' → the inclusive window it names.
  // Returns null on anything malformed so a hand-edited URL falls back to the
  // default rather than rendering a window nobody asked for.
  function parseRangeFromHash(h) {
    var q = h.indexOf('?');
    if (q === -1) return null;
    var params = {};
    h.slice(q + 1).split('&').forEach(function (kv) {
      var i = kv.indexOf('='); if (i === -1) return;
      params[kv.slice(0, i)] = decodeURIComponent(kv.slice(i + 1));
    });
    var re = /^\d{4}-\d{2}-\d{2}$/;
    if (!re.test(params.from || '') || !re.test(params.to || '')) return null;
    if (isNaN(Date.parse(params.from)) || isNaN(Date.parse(params.to))) return null;
    var a = params.from, b = params.to;
    if (b < a) { var t = a; a = b; b = t; }     // same tolerance as the picker
    return rangeToIso(a, b);
  }

  function viewToHashPath() {
    // Only manager-context has a Calls range control, so only it carries a range.
    if (state.view === 'call-library')     return 'calls' + (hasManagerContext() ? rangeHashSuffix(state.callLibraryRange) : '');
    if (state.view === 'objections-intel') return 'objections' + coachingRangeHashSuffix();
    if (state.view === 'needs-work')       return 'needs-work' + coachingRangeHashSuffix();
    if (state.view === 'performance')      return 'performance' + coachingRangeHashSuffix();
    if (state.view === 'kb')               return 'kb';
    if (state.view === 'prospects')        return 'prospects';
    if (state.view === 'section')          return 'section' + coachingRangeHashSuffix();
    if (state.view === 'eod')              return 'eod';
    if (state.view === 'account')          return 'account';
    // The team range travels in the hash so a refresh keeps it and a manager can
    // share the exact window. Days only (not full ISO) — readable, and
    // rangeToIso rebuilds the inclusive window on the way back in.
    if (state.view === 'team')             return 'team' + teamRangeHashSuffix();
    if (state.view === 'team-expanded')    return 'team-recs' + teamRangeHashSuffix();
    if (state.view === 'team-needs-work')  return 'team-needs-work' + teamRangeHashSuffix();
    if (state.view === 'team-members')     return 'team-members' + teamRangeHashSuffix();
    if (state.view === 'call-review')      return state.selectedCallId ? 'call/' + encodeURIComponent(state.selectedCallId) : 'calls';
    // Overview has no path of its own, but still carries its range so a
    // refresh or a shared link lands on the same window.
    return coachingRangeHashSuffix(); // overview + dormant drills
  }
  // Point the URL at the current view. pushState/replaceState do NOT fire
  // hashchange, so this never re-enters the router below (no navigation loop).
  function syncHashFromState(replace) {
    var path = viewToHashPath();
    if ((window.location.hash || '').replace(/^#/, '') === path) return; // already correct
    var url = window.location.pathname + window.location.search + (path ? '#' + path : '');
    if (replace) window.history.replaceState(null, '', url);
    else window.history.pushState(null, '', url);
  }
  // Set when the user arrives via /connect (#connect): render the Account view
  // AND scroll/highlight the Connections section so the Zoom Connect button is
  // immediately visible (Zoom submission "Direct Landing URL" requirement).
  var pendingConnectFocus = false;
  // URL hash → state.view (+ selectedCallId). No render, no history write.
  function applyHashToState() {
    var h = (window.location.hash || '').replace(/^#/, '');
    var base = h.indexOf('?') === -1 ? h : h.slice(0, h.indexOf('?'));
    // ⚠ THE WHOLE TEAM FAMILY, not just #team. Only #team carried the range, so
    // landing on or refreshing a team sub-page restored nothing and the range
    // fell back to the 7-day default — the picked window was silently lost.
    // Same shape as the coaching family below, which already did this correctly.
    var TEAM_HASH = { 'team': 'team', 'team-recs': 'team-expanded',
                      'team-needs-work': 'team-needs-work', 'team-members': 'team-members' };
    if (Object.prototype.hasOwnProperty.call(TEAM_HASH, base)) {
      state.view = TEAM_HASH[base];
      var hashed = parseRangeFromHash(h);
      if (hashed) { state.teamRange = hashed; state.teamRangeInit = true; }  // beat the 7d default
      return;
    }
    // The coaching family shares one range, so parse it once for all of them.
    var coachRange = parseRangeFromHash(h);
    var COACHING_HASH = { '': 'overview', 'needs-work': 'needs-work', 'performance': 'performance',
                          'objections': 'objections-intel', 'section': 'section' };
    if (Object.prototype.hasOwnProperty.call(COACHING_HASH, base)) {
      if (coachRange) state.dateRange = coachRange;
      // 'section' needs a section already selected; without one it is meaningless.
      if (base === 'section' && !state.selectedSection) { state.view = 'overview'; return; }
      state.view = COACHING_HASH[base];
      return;
    }
    if (base === 'calls') {
      state.view = 'call-library';
      var callsHashed = parseRangeFromHash(h);
      if (callsHashed && hasManagerContext()) state.callLibraryRange = callsHashed;
      return;
    }
    else if (h === 'eod') { state.view = 'eod'; }
    else if (h === 'connect') { state.view = 'account'; state.account = null; pendingConnectFocus = true; }
    else if (h === 'account') { state.view = 'account'; state.account = null; /* fresh on hash entry too */ }
    /* REMOVED 2026-08-16 — unreachable: the COACHING_HASH branch above handles
       objections / needs-work / performance (it must, to parse ?from=&to=) and
       returns early. Kept in place per the standing convention.
    else if (h === 'objections') { state.view = 'objections-intel'; }
    else if (h === 'needs-work') { state.view = 'needs-work'; }
    else if (h === 'performance') { state.view = 'performance'; }
    */
    /* REMOVED 2026-08-16 — unreachable: the `base === 'team'` branch above now
       handles team (it must, to parse the ?from=&to= suffix) and returns early. */
    /* REMOVED 2026-08-17 — unreachable: the TEAM_HASH branch above now handles
       the whole team family (it must, to parse the ?from=&to= suffix) and
       returns early. Kept in place per the standing convention.
    else if (h === 'team-recs') { state.view = 'team-expanded'; }
    else if (h === 'team-needs-work') { state.view = 'team-needs-work'; }
    else if (h === 'team-members') { state.view = 'team-members'; }
    */
    else if (h === 'kb') { state.view = canAccessKb() ? 'kb' : 'overview'; }
    else if (h === 'prospects') { state.view = 'prospects'; }
    else if (h.indexOf('call/') === 0) {
      var id = h.slice(5);
      state.selectedCallId = id ? decodeURIComponent(id) : null;
      state.view = state.selectedCallId ? 'call-review' : 'call-library';
    } else { state.view = 'overview'; }
  }
  // Back/forward (and manual hash edits) fire hashchange but NOT our own
  // pushState calls, so restoring here can't loop. call-review is the only view
  // that doesn't self-load, so kick its fetch explicitly.
  function onRouteChange() {
    if (!state.me) return; // not booted yet — init() handles the initial hash
    applyHashToState();
    render();
    if (state.view === 'call-review' && state.selectedCallId) loadCallReview(state.selectedCallId);
    window.scrollTo({ top: 0, behavior: 'auto' });
  }
  window.addEventListener('hashchange', onRouteChange);

  // ═══ Account view (#account, Stage 5) ════════════════════════════════════
  // Profile (name edits — managed lock applies), Password (all users —
  // exempt from the lock by ruling), Offer (link to KB, never a second
  // editor), Billing (badge + provider-keyed action slot; dead-ends to a
  // contact-admin mailto until billing_provider is set by a future
  // integration stage).
  // Fresh on every entry: the account payload (incl. is_managed) must reflect
  // admin-side changes immediately — clear the cached copy on BOTH entry paths
  // (nav click here; hash/back-forward in applyHashToState). Server side is
  // already fresh per request: GET /me/account reads user_profiles live, and
  // PATCH re-checks managed_by on every mutation.
  function goAccount() { state.account = null; setView('account'); }

  // FD-3: send the user to the connect surface (the #account Connections section,
  // scrolled to + highlighted — same landing as /connect). Used by the empty-state
  // CTAs on the overview-adjacent surfaces (Call Library, What-needs-work, EOD).
  function goConnectSource() { state.account = null; pendingConnectFocus = true; setView('account'); }
  function connectSourceCtaHtml() {
    return '<button class="btn-fathom-primary" type="button" style="margin-top:14px;" onclick="goConnectSource()">Connect a Recording Source →</button>';
  }

  async function loadAccount() {
    if (state.accountLoading) return;
    state.accountLoading = true;
    try {
      var res = await fetch('/me/account', { headers: authHeader() });
      if (res.status === 401) { clearSession(); window.location.replace('/login'); return; }
      if (!res.ok) throw new Error('HTTP ' + res.status);
      state.account = await res.json();
    } catch (err) {
      state.account = { _error: err.message || 'unknown' };
    }
    state.accountLoading = false;
    // Connections section needs both provider statuses; fetch if not already loaded.
    if (state.fathomStatus === null) refreshFathomStatusInBackground();
    if (state.zoomStatus === null) refreshZoomStatusInBackground();
    if (state.view === 'account') renderAccountView();
  }

  async function saveAccountNames() {
    var note = document.getElementById('acctSaveNote');
    var body = {
      first_name: document.getElementById('acctFirst').value,
      last_name: document.getElementById('acctLast').value,
    };
    try {
      var res = await fetch('/me/account', {
        method: 'PATCH',
        headers: Object.assign({ 'Content-Type': 'application/json' }, authHeader()),
        body: JSON.stringify(body),
      });
      var data = null; try { data = await res.json(); } catch (e) {}
      if (!res.ok) { note.textContent = (data && data.error) || 'Save failed'; note.style.color = 'var(--bad)'; return; }
      note.textContent = '✓ Saved'; note.style.color = 'var(--good)';
      if (state.account) { state.account.first_name = body.first_name; state.account.last_name = body.last_name; }
      setTimeout(function () { if (note) note.textContent = ''; }, 3000);
    } catch (e) { note.textContent = 'Could not reach server'; note.style.color = 'var(--bad)'; }
  }

  async function changePassword() {
    var note = document.getElementById('pwChangeNote');
    var cur = document.getElementById('pwCurrent').value;
    var n1 = document.getElementById('pwNew').value;
    var n2 = document.getElementById('pwNew2').value;
    note.style.color = 'var(--bad)';
    if (!cur) { note.textContent = 'Enter your current password.'; return; }
    if (n1.length < 10) { note.textContent = 'New password must be at least 10 characters.'; return; }
    if (n1 !== n2) { note.textContent = "Those passwords don't match."; return; }
    try {
      var res = await fetch('/auth/change-password', {
        method: 'POST',
        headers: Object.assign({ 'Content-Type': 'application/json' }, authHeader()),
        body: JSON.stringify({ current_password: cur, new_password: n1 }),
      });
      var data = null; try { data = await res.json(); } catch (e) {}
      if (!res.ok) { note.textContent = (data && data.error) || 'Could not change the password.'; return; }
      note.textContent = '✓ Password changed'; note.style.color = 'var(--good)';
      document.getElementById('pwCurrent').value = '';
      document.getElementById('pwNew').value = '';
      document.getElementById('pwNew2').value = '';
      setTimeout(function () { if (note) note.textContent = ''; }, 4000);
    } catch (e) { note.textContent = 'Could not reach server'; }
  }

  function acctRow(label, inner) {
    return '<div class="eod-row"><div class="eod-label">' + label + '</div>' + inner + '</div>';
  }

  // Connections section for #account — the ONLY management surface. Both
  // providers, each with state + Connect/Reconnect/Disconnect. Shown to ALL
  // users (exempt from the managed lock, same rationale as Password).
  function connectionRowHtml(provider) {
    var isZoom = provider === 'zoom';
    var label = isZoom ? 'Zoom' : 'Fathom';
    var st = isZoom ? state.zoomStatus : state.fathomStatus;
    var connectFn = isZoom ? 'connectZoom()' : 'connectFathom()';
    var right;
    if (st === null) {
      right = '<span class="meta">…</span>';
    } else if (!st.connected) {
      right = '<span class="conn-state">Not connected</span>'
        + '<button class="btn-fathom-primary" type="button" onclick="' + connectFn + '">Connect</button>';
    } else {
      var email = isZoom ? st.account_email : (st.fathom_email || null);
      var since = st.connected_at ? formatRelativeTime(st.connected_at) : null;
      var meta = [email ? escapeHtml(email) : null, since ? 'since ' + escapeHtml(since) : null].filter(Boolean).join(' · ');
      right = '<span class="conn-state ok"><span class="fathom-strip-icon ok"></span> Connected' + (meta ? ' <span class="meta">· ' + meta + '</span>' : '') + '</span>'
        + '<button class="btn-fathom-secondary" type="button" onclick="' + connectFn + '">Reconnect</button>'
        + '<button class="btn-fathom-secondary conn-disconnect" type="button" onclick="disconnectProvider(\'' + provider + '\')">Disconnect</button>';

  function renderConnectionsSectionHtml() {
    return renderZoomNoticeHtml() + renderFathomNoticeHtml()
      + connectionRowHtml('fathom')
      + connectionRowHtml('zoom')
      + '<div class="meta" style="margin-top:8px;">Disconnecting keeps your synced calls, grades, and clips — it only stops new calls from coming in.</div>';

        + '<div class="eod-row"><div class="eod-label"></div><div><button class="btn-fathom-secondary" type="button" onclick="saveAccountNames()">Save</button><span class="acct-save-note" id="acctSaveNote"></span></div></div>';

      + acctRow('New', '<input type="password" class="eod-input" id="pwNew" autocomplete="new-password" placeholder="At least 10 characters">')
      + acctRow('Confirm', '<input type="password" class="eod-input" id="pwNew2" autocomplete="new-password">')
      + '<div class="eod-row"><div class="eod-label"></div><div><button class="btn-fathom-secondary" type="button" onclick="changePassword()">Change Password</button><span class="acct-save-note" id="pwChangeNote"></span></div></div>';

    // Offer — link to the KB, never a second editor. FD-4: managed reps can now

    var offerBody = a.is_managed
      ? '<div class="acct-notice" style="display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap;">'
        + '<span>Your team’s offer docs, scripts, and winning calls live in your Knowledge Base — they’re what Scout grades your calls against. Your manager manages the contents; you can view them here.</span>'
        + '<button class="btn-fathom-secondary" type="button" onclick="goKb()">Open Knowledge Base →</button></div>'
      : '<div class="acct-notice" style="display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap;">'

    // Billing — badge + provider-keyed action slot
    var b = a.billing || {};
    var badge = '<span class="badge badge-billing-' + escapeHtml(b.status || 'trial') + '">' + escapeHtml((b.status || 'trial').replace('_', ' ')) + '</span>';

  // Scroll the #account Connections section into view and pulse the Zoom row, so
  // a reviewer landing from /connect immediately sees the Zoom Connect action.
  function focusConnections() {
    requestAnimationFrame(function() {
      var sec = document.getElementById('connectionsSection');
      if (sec && sec.scrollIntoView) sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
      var row = document.getElementById('connRowZoom');
      if (row) {
        row.classList.add('conn-row-focus');
        setTimeout(function() { row.classList.remove('conn-row-focus'); }, 2600);
      }
      // Normalize #connect → #account so a refresh/bookmark lands cleanly (no re-pulse).
      try {
        if ((window.location.hash || '') === '#connect') {
          window.history.replaceState(null, '', window.location.pathname + window.location.search + '#account');
        }
      } catch (e) { /* history API unavailable — harmless */ }
    });
