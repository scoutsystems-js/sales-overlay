<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Coaching Dashboard — Scout Systems</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net"/>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <style>
    /* ──────────────────────────────────────────────────────────────────
       Coaching Dashboard v2 — donut-led, drill-down coaching tool.
       Old version archived at backend/web/dashboard-v1.html.archived.

       Design principles (no apologies on the polish):
         - Limited color palette (8 colors, used intentionally)
         - 12px corner radius across cards
         - 8px spacing rhythm
         - System font stack (clean, fast)
         - Subtle gradients, no heavy shadows
         - Smooth transitions, no jarring spinners
         - Generous whitespace
       ────────────────────────────────────────────────────────────────── */

    :root {
      --bg:           #0a0a0a;
      --bg-elevated:  #131313;
      --bg-hover:     #1a1a1a;
      --bg-deep:      #050505;
      --border:       #1f1f1f;
      --border-hover: #2a2a2a;
      --border-focus: #3b3b3b;
      --text:         #ededed;
      --text-soft:    #cccccc;
      --text-muted:   #8b8b8b;
      --text-dim:     #5a5a5a;

      --accent:       #5b9eff;
      --good:         #4ade80;
      --mid:          #fbbf24;
      --bad:          #f87171;
      --purple:       #c084fc;
      --orange:       #fb923c;
      --cyan:         #22d3ee;
      --slate:        #64748b;

      --radius-sm: 8px;
      --radius:    12px;
      --radius-lg: 16px;

      --shadow-sm: 0 1px 2px rgba(0,0,0,0.4);
      --shadow-md: 0 2px 4px rgba(0,0,0,0.4), 0 8px 24px rgba(0,0,0,0.3);

      --ease: cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; cursor: pointer; }

    /* ── Top bar ───────────────────────────────────────────────────── */
    .top-bar {
      background: linear-gradient(180deg, #161616 0%, #0d0d0d 100%);
      border-bottom: 1px solid var(--border);
      padding: 14px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      backdrop-filter: blur(8px);
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .top-bar-left { display: flex; align-items: center; gap: 12px; font-weight: 600; font-size: 14px; }
    .top-bar-left .sep { color: var(--text-dim); font-weight: 400; }
    .top-bar-left .sub { color: var(--text-muted); font-weight: 500; font-size: 13px; }
    /* Primary-nav items in the top-left. Hover lights up the text; the active
       state adds an accent underline. Coaching Dashboard's active state spans
       all the overview sub-drills (calls/objections/closes/objection-type)
       because those drills are conceptually under Overview, not their own
       sections. */
    .top-bar-left .nav-link {
      color: var(--text-muted);
      cursor: pointer;
      font-weight: 500;
      font-size: 13px;
      transition: color 0.15s var(--ease);
      text-decoration: none;
      padding: 3px 0;
      border-bottom: 2px solid transparent;
      user-select: none;
    }
    .top-bar-left .nav-link:hover { color: var(--text); }
    .top-bar-left .nav-link.nav-active {
      color: var(--text);
      border-bottom-color: var(--accent);
    }
    .top-bar-right { display: flex; align-items: center; gap: 20px; font-size: 13px; color: var(--text-muted); }
    .top-bar-right a:hover { color: var(--text); }
    .signout { cursor: pointer; }
    .signout:hover { color: var(--text); }

    /* ── Page layout ────────────────────────────────────────────────── */
    .page { max-width: 1200px; margin: 0 auto; padding: 36px 32px 100px; }

    .page-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 20px;
      margin-bottom: 36px;
    }
    .page-header h1 {
      font-size: 28px;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin: 0;
    }
    .page-header .subtitle {
      color: var(--text-muted);
      font-size: 14px;
      margin-top: 6px;
    }

    .controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }

    .user-select {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 32px 8px 14px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-family: inherit;
      min-width: 220px;
      cursor: pointer;
      transition: border-color 0.15s var(--ease);
      appearance: none;
      background-image: url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%238b8b8b' stroke-width='1.5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: right 12px center;
    }
    .user-select:hover { border-color: var(--border-hover); }
    .user-select:focus { outline: none; border-color: var(--accent); }

    .date-presets { display: flex; gap: 4px; background: var(--bg-elevated); padding: 4px; border-radius: var(--radius-sm); border: 1px solid var(--border); }
    .date-preset {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      transition: all 0.15s var(--ease);
    }
    .date-preset:hover { color: var(--text); }
    .date-preset.active { background: var(--bg-hover); color: var(--text); }

    /* ── Donut row ──────────────────────────────────────────────────── */
    .donut-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 48px;
    }
    @media (max-width: 820px) { .donut-row { grid-template-columns: 1fr; } }

    .donut-card {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 32px 28px 28px;
      cursor: pointer;
      transition: all 0.18s var(--ease);
      position: relative;
      overflow: hidden;
      text-align: center;
    }
    .donut-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 0%, rgba(91, 158, 255, 0.04), transparent 70%);
      pointer-events: none;
    }
    .donut-card:hover {
      border-color: var(--border-hover);
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }
    .donut-card:hover::before { background: radial-gradient(circle at 50% 0%, rgba(91, 158, 255, 0.08), transparent 70%); }

    .donut-card .donut-label {
      font-size: 12px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 600;
      margin-bottom: 24px;
    }

    .donut-canvas-wrap {
      position: relative;
      width: 200px;
      height: 200px;
      margin: 0 auto;
    }

    .donut-center {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    .donut-center .big {
      font-size: 36px;
      font-weight: 700;
      letter-spacing: -0.025em;
      line-height: 1;
    }
    .donut-center .small {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 6px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .donut-legend {
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
      margin-top: 24px;
      font-size: 12px;
      color: var(--text-muted);
    }
    .donut-legend .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 6px;
      vertical-align: middle;
    }

    .donut-hint {
      font-size: 11px;
      color: var(--text-dim);
      margin-top: 10px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    /* ── Section heading ────────────────────────────────────────────── */
    .section { margin-bottom: 48px; }
    .section-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 18px;
      gap: 12px;
    }
    .section-header h2 {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.01em;
      margin: 0;
    }
    .section-header .meta { font-size: 12px; color: var(--text-muted); }

    /* ── Coach summary patterns ─────────────────────────────────────── */
    .patterns-list { display: flex; flex-direction: column; gap: 12px; }
    .pattern-card {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 22px;
      transition: border-color 0.15s var(--ease);
    }
    .pattern-card:hover { border-color: var(--border-hover); }
    .pattern-headline {
      font-size: 15px;
      font-weight: 600;
      line-height: 1.4;
      letter-spacing: -0.005em;
      margin-bottom: 8px;
    }
    .pattern-detail {
      font-size: 13.5px;
      color: var(--text-soft);
      line-height: 1.6;
    }
    .pattern-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 12px;
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .pattern-confidence {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: 600;
    }
    .pattern-confidence.high   { background: rgba(74, 222, 128, 0.10); color: var(--good); }
    .pattern-confidence.medium { background: rgba(251, 191, 36, 0.10); color: var(--mid); }
    .pattern-confidence.low    { background: rgba(139, 139, 139, 0.10); color: var(--text-muted); }

    .signal-banner {
      background: linear-gradient(135deg, rgba(91, 158, 255, 0.06), rgba(91, 158, 255, 0.02));
      border: 1px solid rgba(91, 158, 255, 0.15);
      border-radius: var(--radius);
      padding: 12px 16px;
      font-size: 12.5px;
      color: #b3d4ff;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .signal-banner-icon {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--accent);
      opacity: 0.4;
      flex-shrink: 0;
    }

    /* ── Calls list ─────────────────────────────────────────────────── */
    .calls-list { display: flex; flex-direction: column; gap: 8px; }
    .call-card {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      transition: border-color 0.15s var(--ease);
    }
    .call-card:hover { border-color: var(--border-hover); }
    .call-card.expanded { border-color: var(--border-focus); }

    .call-head {
      padding: 16px 22px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      user-select: none;
    }
    .call-head-left { flex: 1; min-width: 0; }
    .call-head-title { font-size: 14.5px; font-weight: 600; letter-spacing: -0.005em; }
    .call-head-title .name { color: var(--text); }
    .call-head-title .anon { color: var(--text-muted); font-weight: 400; font-style: italic; }
    .call-head-meta {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .call-head-right { display: flex; align-items: center; gap: 14px; }

    .badge {
      font-size: 10.5px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      white-space: nowrap;
    }
    .badge-win    { background: rgba(74, 222, 128, 0.12); color: var(--good); }
    .badge-loss   { background: rgba(248, 113, 113, 0.12); color: var(--bad); }
    .badge-fu     { background: rgba(251, 191, 36, 0.12); color: var(--mid); }
    .badge-live   { background: rgba(91, 158, 255, 0.12); color: var(--accent); }
    .badge-empty  { background: rgba(139, 139, 139, 0.10); color: var(--text-muted); }

    .expand-icon {
      color: var(--text-dim);
      transition: transform 0.2s var(--ease);
      font-size: 14px;
    }
    .call-card.expanded .expand-icon { transform: rotate(180deg); color: var(--text-muted); }

    .call-body {
      border-top: 1px solid var(--border);
      padding: 22px;
      background: var(--bg-deep);
      display: none;
    }
    .call-card.expanded .call-body { display: block; }

    .obj-event {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
      margin-bottom: 12px;
    }
    .obj-event:last-child { margin-bottom: 0; }
    .obj-event-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 14px;
    }
    .obj-event-title { font-size: 14px; font-weight: 600; }
    .obj-event-time { font-size: 11px; color: var(--text-muted); margin-left: 8px; font-weight: 400; }

    .verdict {
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .verdict-overcome  { background: rgba(74, 222, 128, 0.12); color: var(--good); }
    .verdict-not       { background: rgba(248, 113, 113, 0.12); color: var(--bad); }
    .verdict-unknown   { background: rgba(139, 139, 139, 0.10); color: var(--text-muted); }
    .verdict-conf { font-size: 10px; color: var(--text-dim); margin-left: 8px; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 500; }

    .coaching-note {
      background: linear-gradient(135deg, rgba(91, 158, 255, 0.06) 0%, rgba(74, 222, 128, 0.03) 100%);
      border: 1px solid rgba(91, 158, 255, 0.18);
      border-radius: var(--radius-sm);
      padding: 16px 18px;
      font-size: 13.5px;
      line-height: 1.65;
      color: var(--text);
      margin-bottom: 14px;
    }
    .coaching-note-empty {
      font-size: 12.5px;
      color: var(--text-muted);
      font-style: italic;
      margin-bottom: 14px;
    }

    .compare-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 680px) { .compare-grid { grid-template-columns: 1fr; } }
    .compare-pane {
      background: var(--bg-deep);
      border-radius: var(--radius-sm);
      padding: 14px 16px;
      border-left: 3px solid var(--border);
    }
    .compare-pane.framework { border-left-color: var(--accent); }
    .compare-pane.actual    { border-left-color: var(--mid); }
    .compare-label {
      font-size: 10px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 8px;
      font-weight: 600;
    }
    .compare-text { font-size: 13px; color: var(--text-soft); line-height: 1.55; }
    .compare-text.empty { color: var(--text-dim); font-style: italic; }

    .obj-notes-row {
      font-size: 11px;
      color: var(--text-dim);
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      line-height: 1.5;
    }

    /* ── Drill view ─────────────────────────────────────────────────── */
    .drill-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
    }
    .back-btn {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      transition: all 0.15s var(--ease);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .back-btn:hover { color: var(--text); border-color: var(--border-hover); }

    .drill-title { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; }
    .drill-title .count { color: var(--text-muted); font-weight: 400; margin-left: 8px; }

    .drill-grid {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 36px;
      margin-bottom: 48px;
    }
    @media (max-width: 760px) { .drill-grid { grid-template-columns: 1fr; } }

    .drill-donut {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .drill-breakdown { display: flex; flex-direction: column; gap: 10px; }
    .breakdown-row {
      display: grid;
      grid-template-columns: 12px 1fr auto auto;
      gap: 12px;
      align-items: center;
      padding: 14px 18px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 13px;
      transition: all 0.15s var(--ease);
    }
    .breakdown-row.clickable {
      cursor: pointer;
      grid-template-columns: 12px 1fr auto auto 14px;
    }
    .breakdown-row.clickable:hover {
      border-color: var(--border-focus);
      background: var(--bg-hover);
      transform: translateX(2px);
    }
    .breakdown-row.clickable::after {
      content: '→';
      color: var(--text-dim);
      font-size: 14px;
      transition: color 0.15s var(--ease);
      grid-column: 5;
      text-align: right;
    }
    .breakdown-row.clickable:hover::after { color: var(--accent); }
    .breakdown-row:hover { border-color: var(--border-hover); }

    /* Per-type drill — event cards */
    .event-card {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px 24px;
      margin-bottom: 14px;
      transition: border-color 0.15s var(--ease);
    }
    .event-card:hover { border-color: var(--border-hover); }
    .event-card-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .event-card-title {
      font-size: 14px;
      font-weight: 600;
    }
    .event-card-title .name { color: var(--text); }
    .event-card-title .anon { color: var(--text-muted); font-weight: 400; font-style: italic; }
    .event-card-meta {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .event-card-right {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    /* Stats strip atop per-type drill */
    .type-stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin-bottom: 32px;
    }
    .type-stat {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
    }
    .type-stat .stat-label {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 600;
    }
    .type-stat .stat-value {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-top: 6px;
      line-height: 1;
    }
    .type-stat .stat-value.good { color: var(--good); }
    .type-stat .stat-value.bad  { color: var(--bad); }
    .type-stat .stat-value.mid  { color: var(--mid); }
    .type-stat .stat-sub {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 6px;
    }

    /* Framework rebuttal reference card (top of per-type drill) */
    .framework-ref {
      background: linear-gradient(135deg, rgba(91, 158, 255, 0.06), rgba(74, 222, 128, 0.03));
      border: 1px solid rgba(91, 158, 255, 0.18);
      border-radius: var(--radius);
      padding: 18px 22px;
      margin-bottom: 32px;
    }
    .framework-ref-label {
      font-size: 11px;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .framework-ref-text {
      font-size: 14.5px;
      font-style: italic;
      color: var(--text);
      line-height: 1.55;
    }
    .breakdown-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }
    .breakdown-label { font-weight: 500; }
    .breakdown-bar {
      grid-column: 2;
      grid-row: 2;
      height: 6px;
      background: var(--bg-deep);
      border-radius: 3px;
      overflow: hidden;
      margin-top: 8px;
    }
    .breakdown-bar-fill { height: 100%; border-radius: 3px; transition: width 0.6s var(--ease); }
    .breakdown-count { font-weight: 600; font-variant-numeric: tabular-nums; }
    .breakdown-pct { color: var(--text-muted); font-size: 12px; font-variant-numeric: tabular-nums; min-width: 50px; text-align: right; }

    /* ── Empty / spinner ────────────────────────────────────────────── */
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 0.7; } }
    .spinner {
      width: 22px; height: 22px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    .load-state { display: flex; align-items: center; justify-content: center; padding: 40px; }
    .skeleton {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      height: 80px;
      animation: pulse 1.4s ease-in-out infinite;
    }
    .skeleton-donut {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 32px;
      height: 360px;
      animation: pulse 1.4s ease-in-out infinite;
    }

    .empty {
      background: var(--bg-elevated);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      padding: 48px 32px;
      text-align: center;
      color: var(--text-muted);
    }
    .empty h3 { font-size: 16px; font-weight: 600; margin: 0 0 6px; color: var(--text); }
    .empty p { font-size: 13px; margin: 0; }

    .error {
      background: rgba(248, 113, 113, 0.08);
      border: 1px solid rgba(248, 113, 113, 0.25);
      color: #fab7b7;
      padding: 14px 18px;
      border-radius: var(--radius-sm);
      font-size: 13px;
    }

    /* Fade-in on initial render */
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    .fade-in { animation: fadeIn 0.4s var(--ease) both; }

    /* ─── Fathom integration (Scout v2.0 Phase 1) ─────────────────────── */

    /* The Fathom section sits above the donut row. Layout uses the same
       .section + .section-header pattern as the rest of the dashboard so
       the spacing rhythm matches; the inner content varies by connection
       state (CTA card vs. status strip). */
    .fathom-section { margin-bottom: 32px; }

    /* Flash notice at the top of the overview (above the section). Three
       kinds: success / warn / error. Style mirrors .signal-banner so the
       visual vocabulary stays consistent. */
    .fathom-notice {
      border-radius: var(--radius);
      padding: 12px 16px;
      font-size: 12.5px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      animation: fadeIn 0.3s var(--ease) both;
    }
    .fathom-notice-text { flex: 1; min-width: 0; }
    .fathom-notice-dismiss {
      background: transparent;
      border: none;
      color: inherit;
      opacity: 0.6;
      font-size: 16px;
      line-height: 1;
      padding: 4px 6px;
      cursor: pointer;
      border-radius: 4px;
      flex-shrink: 0;
    }
    .fathom-notice-dismiss:hover { opacity: 1; background: rgba(255,255,255,0.05); }
    .fathom-notice.success {
      background: linear-gradient(135deg, rgba(74, 222, 128, 0.10), rgba(74, 222, 128, 0.04));
      border: 1px solid rgba(74, 222, 128, 0.25);
      color: #b6f0c8;
    }
    .fathom-notice.warn {
      background: linear-gradient(135deg, rgba(251, 191, 36, 0.10), rgba(251, 191, 36, 0.04));
      border: 1px solid rgba(251, 191, 36, 0.25);
      color: #fce5a3;
    }
    .fathom-notice.error {
      background: rgba(248, 113, 113, 0.08);
      border: 1px solid rgba(248, 113, 113, 0.25);
      color: #fab7b7;
    }

    /* Disconnected: full CTA card. Larger visual weight to draw attention. */
    .fathom-connect-card {
      background: linear-gradient(135deg, rgba(91, 158, 255, 0.08), rgba(91, 158, 255, 0.02));
      border: 1px solid rgba(91, 158, 255, 0.25);
      border-radius: var(--radius);
      padding: 22px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
    }
    .fathom-connect-text { flex: 1; min-width: 280px; }
    .fathom-connect-title {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--text);
      margin-bottom: 4px;
    }
    .fathom-connect-sub {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    /* Connected / syncing / error: compact status strip. */
    .fathom-strip {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
      font-size: 13px;
    }
    .fathom-strip-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      min-width: 0;
    }
    .fathom-strip-icon {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .fathom-strip-icon.ok    { background: var(--good); box-shadow: 0 0 6px rgba(74, 222, 128, 0.5); }
    .fathom-strip-icon.warn  { background: var(--mid); }
    .fathom-strip-icon.err   { background: var(--bad); }
    .fathom-strip-text { color: var(--text); }
    .fathom-strip-meta { color: var(--text-muted); }
    .fathom-strip-sep  { color: var(--text-dim); margin: 0 4px; }
    .fathom-strip.error {
      border-color: rgba(248, 113, 113, 0.35);
      background: rgba(248, 113, 113, 0.04);
    }
    .fathom-strip-error-text {
      color: #fab7b7;
      font-size: 12px;
      margin-top: 4px;
      line-height: 1.5;
    }

    /* Buttons — Fathom-specific so we don't accidentally restyle the date
       presets. Two variants: primary (Connect / Reconnect) and secondary
       (Sync now). */
    .btn-fathom-primary {
      background: var(--accent);
      color: #061629;
      border: none;
      padding: 9px 18px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: filter 0.15s var(--ease), transform 0.15s var(--ease);
      flex-shrink: 0;
    }
    .btn-fathom-primary:hover { filter: brightness(1.08); }
    .btn-fathom-primary:active { transform: translateY(1px); }
    .btn-fathom-primary:disabled { opacity: 0.55; cursor: wait; }
    .btn-fathom-secondary {
      background: var(--bg-elevated);
      color: var(--text-soft);
      border: 1px solid var(--border);
      padding: 7px 14px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.15s var(--ease);
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-fathom-secondary:hover { border-color: var(--border-hover); color: var(--text); }
    .btn-fathom-secondary:disabled { opacity: 0.5; cursor: wait; }
    .spinner-tiny {
      width: 12px; height: 12px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: inline-block;
    }

    /* ─── Call Library (Scout v2.0 Phase 2) ─────────────────────────────── */

    /* Each row in the Call Library is a clickable card that opens the call
       review page (Phase 2 Step 4; current implementation surfaces a
       "coming soon" notice via the existing fathomNotice system). */
    .library-list { display: flex; flex-direction: column; gap: 10px; }
    .library-card {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      cursor: pointer;
      transition: border-color 0.15s var(--ease), background 0.15s var(--ease);
    }
    .library-card:hover {
      border-color: var(--border-hover);
      background: var(--bg-hover);
    }
    .library-card-main { flex: 1; min-width: 0; }
    .library-card-title {
      font-size: 14.5px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.005em;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .library-card-title.anon { color: var(--text-muted); font-weight: 400; font-style: italic; }
    .library-card-meta {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 5px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }
    .library-card-meta .sep { color: var(--text-dim); }
    .library-card-side {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
    }

    /* Status badges — four variants matching the brief spec.
       Pending  → grey (no analysis yet)
       Analyzing → blue + tiny spinner (analysis_status='processing')
       Score    → green (analysis_status='done', shows N/100)
       Error    → red (analysis_status='error') */
    .library-status-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .library-status-badge.pending {
      background: rgba(139, 139, 139, 0.12);
      color: var(--text-muted);
    }
    .library-status-badge.analyzing {
      background: rgba(91, 158, 255, 0.14);
      color: var(--accent);
    }
    .library-status-badge.done {
      background: rgba(74, 222, 128, 0.12);
      color: var(--good);
      letter-spacing: 0.02em;
    }
    .library-status-badge.error {
      background: rgba(248, 113, 113, 0.12);
      color: var(--bad);
    }
    .library-recording-link {
      font-size: 12px;
      color: var(--text-muted);
      text-decoration: none;
      white-space: nowrap;
      transition: color 0.15s var(--ease);
    }
    .library-recording-link:hover { color: var(--accent); }

    /* Skeleton row used while the first page loads. Same animation as
       .skeleton-donut (pulse) and same surface tokens as .library-card so
       the transition from skeleton → real cards is smooth. */
    .library-skeleton-row {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      height: 68px;
      animation: pulse 1.4s ease-in-out infinite;
    }

    /* ─── Call Review page (Scout v2.0 Phase 2 Step 4) ────────────────────── */

    /* Header strip — back link + title row + meta row + score badge + Fathom link */
    .review-page-header {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 36px;
    }
    .review-back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      align-self: flex-start;
      cursor: pointer;
      transition: all 0.15s var(--ease);
    }
    .review-back-link:hover { color: var(--text); border-color: var(--border-hover); }
    .review-title-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
    }
    .review-title-main { flex: 1; min-width: 0; }
    .review-title {
      font-size: 24px;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin: 0 0 6px;
      word-break: break-word;
    }
    .review-title.anon { color: var(--text-muted); font-weight: 400; font-style: italic; }
    .review-meta-row {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      color: var(--text-muted);
      font-size: 13px;
    }
    .review-meta-row .sep { color: var(--text-dim); }
    .review-title-side {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
    }
    .review-fathom-link {
      font-size: 12.5px;
      color: var(--text-muted);
      transition: color 0.15s var(--ease);
      white-space: nowrap;
    }
    .review-fathom-link:hover { color: var(--accent); }

    /* Error banner — surfaces analysis.status='error' with the reason. */
    .review-analysis-error {
      background: rgba(248, 113, 113, 0.06);
      border: 1px solid rgba(248, 113, 113, 0.22);
      color: #fab7b7;
      padding: 14px 18px;
      border-radius: var(--radius);
      font-size: 13px;
      margin-bottom: 28px;
      line-height: 1.55;
    }
    .review-analysis-error strong { color: #fcd0d0; font-weight: 600; }

    /* Section 1: Call Highlights — the prominent timeline. */
    .review-highlight-list { display: flex; flex-direction: column; gap: 12px; }
    .review-highlight {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 20px;
      display: grid;
      grid-template-columns: 78px 1fr;
      gap: 18px;
      align-items: start;
      transition: border-color 0.15s var(--ease);
    }
    .review-highlight:hover { border-color: var(--border-hover); }
    .review-highlight-time {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
      text-decoration: none;
      padding-top: 2px;
      transition: filter 0.15s var(--ease);
    }
    .review-highlight-time:hover { filter: brightness(1.2); text-decoration: underline; }
    .review-highlight-time.disabled {
      color: var(--text-muted);
      cursor: default;
      pointer-events: none;
    }
    .review-highlight-body { min-width: 0; }
    .review-highlight-row1 {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }
    .review-speaker-badge {
      font-size: 10.5px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      white-space: nowrap;
    }
    .review-speaker-badge.closer   { background: rgba(91, 158, 255, 0.14); color: var(--accent); }
    .review-speaker-badge.prospect { background: rgba(100, 116, 139, 0.18); color: var(--text-soft); }
    .review-type-badge {
      font-size: 10.5px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      white-space: nowrap;
    }
    .review-type-badge.buying_signal      { background: rgba(74, 222, 128, 0.12);  color: var(--good); }
    .review-type-badge.strong_moment      { background: rgba(74, 222, 128, 0.12);  color: var(--good); }
    .review-type-badge.objection          { background: rgba(251, 146, 60, 0.14);  color: var(--orange); }
    .review-type-badge.missed_opportunity { background: rgba(251, 191, 36, 0.12);  color: var(--mid); }
    .review-type-badge.rapport_moment     { background: rgba(91, 158, 255, 0.12);  color: var(--accent); }
    .review-type-badge.disqualify_signal  { background: rgba(100, 116, 139, 0.18); color: var(--text-soft); }
    .review-quote {
      font-size: 13.5px;
      color: var(--text-soft);
      font-style: italic;
      margin-bottom: 6px;
      line-height: 1.55;
    }
    .review-quote::before { content: '\201C'; opacity: 0.5; margin-right: 2px; }
    .review-quote::after  { content: '\201D'; opacity: 0.5; margin-left: 2px; }
    .review-observation {
      font-size: 13.5px;
      color: var(--text);
      line-height: 1.55;
    }

    /* Pending / placeholder for the highlights section. */
    .review-highlights-pending {
      background: var(--bg-elevated);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      padding: 28px 24px;
      text-align: center;
      color: var(--text-muted);
      font-size: 13px;
    }

    /* "One thing to do differently" accent box — footer of the Highlights section. */
    .review-one-thing {
      margin-top: 18px;
      background: linear-gradient(135deg, rgba(91, 158, 255, 0.08), rgba(91, 158, 255, 0.02));
      border: 1px solid rgba(91, 158, 255, 0.25);
      border-radius: var(--radius);
      padding: 16px 20px;
    }
    .review-one-thing-label {
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 8px;
    }
    .review-one-thing-text {
      font-size: 14px;
      color: var(--text);
      line-height: 1.6;
    }
    .review-one-thing-text.placeholder { color: var(--text-muted); font-style: italic; }

    /* Section 2: Section Grades — five collapsible cards. */
    .review-grades-toggle {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 12px;
      padding: 4px 0;
      cursor: pointer;
      transition: color 0.15s var(--ease);
    }
    .review-grades-toggle:hover { color: var(--text); }
    .review-grade-list { display: flex; flex-direction: column; gap: 10px; }
    .review-grade-card {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      transition: border-color 0.15s var(--ease);
    }
    .review-grade-card:hover { border-color: var(--border-hover); }
    .review-grade-card-header {
      display: grid;
      grid-template-columns: 1fr 60px 80px 24px;
      gap: 16px;
      align-items: center;
      padding: 16px 20px;
      cursor: pointer;
      user-select: none;
    }
    .review-grade-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.005em;
    }
    .review-grade-letter {
      font-size: 22px;
      font-weight: 600;
      text-align: center;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
    }
    .review-grade-letter.A { color: var(--good); }
    .review-grade-letter.B { color: var(--good); opacity: 0.85; }
    .review-grade-letter.C { color: var(--mid); }
    .review-grade-letter.D { color: var(--orange); }
    .review-grade-letter.F { color: var(--bad); }
    .review-grade-letter.empty { color: var(--text-dim); font-size: 18px; font-weight: 400; }
    .review-grade-score {
      font-size: 13px;
      color: var(--text-muted);
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    .review-grade-chevron {
      color: var(--text-muted);
      font-size: 13px;
      transition: transform 0.2s var(--ease);
    }
    .review-grade-card.expanded .review-grade-chevron { transform: rotate(180deg); }
    .review-grade-body {
      padding: 0 20px 18px;
      border-top: 1px solid var(--border);
      margin-top: -1px;
      animation: fadeIn 0.25s var(--ease) both;
    }
    .review-grade-notes {
      font-size: 13px;
      color: var(--text-soft);
      line-height: 1.65;
      white-space: pre-wrap;
      padding-top: 16px;
    }
    .review-grade-notes.placeholder { color: var(--text-muted); font-style: italic; }
    .review-grade-card.not-occurred .review-grade-name { color: var(--text-muted); font-style: italic; }

    /* Skeleton grade card while loading or pending analysis. */
    .review-grade-card.skeleton-card {
      height: 60px;
      animation: pulse 1.4s ease-in-out infinite;
      cursor: default;
    }
    .review-grade-card.skeleton-card:hover { border-color: var(--border); }

    /* Section 3: Follow-up Email — monospace box + copy button. */
    .review-followup-wrap { display: flex; flex-direction: column; gap: 12px; }
    .review-followup-box {
      background: var(--bg-deep);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 22px;
      font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
      color: var(--text-soft);
      line-height: 1.65;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 460px;
      overflow-y: auto;
      user-select: text;
    }
    .review-followup-box.placeholder { color: var(--text-muted); font-style: italic; font-family: inherit; }
    .review-followup-actions { display: flex; gap: 10px; align-items: center; }
    .review-copy-feedback {
      font-size: 12px;
      color: var(--good);
      opacity: 0;
      transition: opacity 0.2s var(--ease);
    }
    .review-copy-feedback.show { opacity: 1; }

    /* Loading skeleton for the whole review page (mirrors the three-section layout). */
    .review-skeleton-section {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      height: 140px;
      margin-bottom: 18px;
      animation: pulse 1.4s ease-in-out infinite;
    }

    /* Scope badge */
    .scope-pill {
      font-size: 10.5px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 4px;
      background: rgba(91, 158, 255, 0.10);
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-left: 10px;
    }
  </style>
</head>
<body>

<nav class="top-bar">
  <div class="top-bar-left">
    <span>Scout</span>
    <span class="sep">·</span>
    <a class="nav-link" id="navOverview" onclick="setView('overview'); return false;">Coaching Dashboard</a>
    <span class="sep">·</span>
    <a class="nav-link" id="navCallLibrary" onclick="setView('call-library'); return false;">Calls</a>
  </div>
  <div class="top-bar-right">
    <a href="/admin" id="adminLink" style="display:none">Admin</a>
    <span id="signedInEmail"></span>
    <span class="signout" onclick="signOut()">Sign out</span>
  </div>
</nav>

<main class="page" id="page">
  <div id="content"><div class="load-state"><div class="spinner"></div></div></div>
</main>

<script>
  // ──────────────────────────────────────────────────────────────────
  // Session / auth — same pattern used across all Scout dashboards.
  // ──────────────────────────────────────────────────────────────────
  var STORAGE_KEY = 'scout_session_v1';
  function getSession() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null'); } catch (e) { return null; } }
  function setSessionStored(s) { localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); }
  function clearSession() { localStorage.removeItem(STORAGE_KEY); }
  function isSessionValid(s) {
    if (!s || !s.access_token || !s.expires_at) return false;
    return new Date(s.expires_at).getTime() > Date.now() + 30 * 1000;
  }
  async function refreshSessionIfNeeded() {
    var s = getSession();
    if (!s || !s.refresh_token) return false;
    try {
      var res = await fetch('/auth/refresh', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ refresh_token: s.refresh_token }) });
      if (!res.ok) return false;
      var data = await res.json();
      if (!data || !data.session) return false;
      setSessionStored({ access_token: data.session.access_token, refresh_token: data.session.refresh_token, expires_at: data.session.expires_at, email: data.session.user && data.session.user.email });
      return true;
    } catch (e) { return false; }
  }
  function signOut() { clearSession(); window.location.replace('/login'); }
  function authHeader() {
    var s = getSession();
    return s && s.access_token ? { Authorization: 'Bearer ' + s.access_token } : {};
  }

  function escapeHtml(s) {
    if (s === null || s === undefined) return '';
    return String(s).replace(/[&<>"']/g, function(c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]); });
  }

  // ──────────────────────────────────────────────────────────────────
  // State
  // ──────────────────────────────────────────────────────────────────
  var state = {
    me:              null,    // { user_id, email, role }
    users:           [],      // populated for admin/owner
    viewingUserId:   null,    // whose data we're showing
    dateRange:      { from: null, to: null, days: 30 },
    view:           'overview', // 'overview' | 'calls' | 'objections' | 'closes' | 'objection-type'
    analytics:       null,    // last /me/analytics response
    patterns:        null,    // last /me/coaching/patterns response
    calls:           [],      // list from /me/sessions
    objectionsCache: {},      // session_id -> objection rows
    typeEventsCache: {},      // objection_id -> response from /me/objections
    selectedObjectionId: null, // when view === 'objection-type'
    expandedCallId:  null,
    chart1:          null,
    chart2:          null,
    chart3:          null,
    chartDrill:      null,
    chartType:       null,
    // Fathom integration (Scout v2.0 Phase 1)
    fathomStatus:    null,    // null until /fathom/status fetch completes; then { connected: bool, ... }
    fathomNotice:    null,    // null | { kind: 'success'|'warn'|'error', text: string } — flash message above the section
    fathomSyncing:   false,   // true while a /fathom/sync request is in flight; drives spinner state
    fathomReanalyzing: false, // true while a /fathom/reanalyze request is in flight; drives the Reanalyze button spinner
    // Call Library (Scout v2.0 Phase 2 Step 3)
    callLibrary:        null,  // null pre-load, then array of call rows from /fathom/calls
    callLibraryLoading: false, // gates "Load more" button while a fetch is in flight
    callLibraryHasMore: false, // true if the last page returned === limit (more might exist)
    callLibraryOffset:  0,     // total rows fetched so far; next "Load more" uses this as offset
    callLibraryError:   null,  // last fetch error message; cleared on successful re-fetch
    // Call Review (Scout v2.0 Phase 2 Step 4)
    selectedCallId:     null,  // public.fathom_calls(id) UUID of the call being reviewed
    callReview:         null,  // null pre-load, then the GET /fathom/calls/:id response
    callReviewLoading:  false, // gates retry click while a fetch is in flight
    callReviewError:    null,  // last fetch error message; cleared on successful re-fetch
    expandedGradeCards: {},    // map of section key ('intro'|'discovery'|...) → true when expanded
    followupCopied:     false, // transient "Copied!" feedback flag (set true, render, then false 2s later)
  };

  // ──────────────────────────────────────────────────────────────────
  // Init
  // ──────────────────────────────────────────────────────────────────
  async function init() {
    // ─── Fathom OAuth popup handoff (must run BEFORE any auth/render so the
    // popup closes quickly without flashing the dashboard inside it). ───
    // When the Fathom OAuth callback redirects the popup to
    // /dashboard?fathom=connected (or denied/error), this code path detects
    // we're in a popup, notifies the opener via postMessage, and closes.
    // Direct visits to /dashboard?fathom=* (no opener) fall through to the
    // normal init flow — the param is handled later in this function.
    var initialParams = new URLSearchParams(window.location.search);
    var fathomParam = initialParams.get('fathom');
    if (fathomParam && window.opener && window.opener !== window) {
      try {
        window.opener.postMessage(
          { type: 'scout-fathom-done', kind: fathomParam },
          window.location.origin
        );
      } catch (e) { /* same-origin only — silent fail is fine */ }
      window.close();
      return;
    }

    // ─── postMessage listener (parent window only) — receives the popup's
    // success/denied/error signal, sets the notice, reloads Fathom status. ───
    window.addEventListener('message', function(e) {
      // Same-origin check — both popup and parent are on this domain.
      if (e.origin !== window.location.origin) return;
      if (!e.data || e.data.type !== 'scout-fathom-done') return;
      handleFathomDoneSignal(e.data.kind);
    });

    var s = getSession();
    if (!isSessionValid(s)) {
      if (s && s.refresh_token) {
        var ok = await refreshSessionIfNeeded();
        if (!ok) { window.location.replace('/login'); return; }
      } else { window.location.replace('/login'); return; }
    }
    var cur = getSession();
    document.getElementById('signedInEmail').textContent = (cur && cur.email) || '';

    state.me = await fetchMe();
    if (!state.me) { window.location.replace('/login'); return; }

    if (state.me.role === 'admin' || state.me.role === 'owner') {
      document.getElementById('adminLink').style.display = '';
      await loadUsers();
    }

    // Default to caller's own data; ?user=<id> pivots to another user.
    var params = new URLSearchParams(window.location.search);
    var target = params.get('user');
    if (target && (state.me.role === 'admin' || state.me.role === 'owner')) {
      state.viewingUserId = target;
    } else {
      state.viewingUserId = state.me.user_id;
    }

    // Direct visit to /dashboard?fathom=* (no popup). Set the notice and
    // strip the param from the URL so a refresh doesn't re-fire it.
    if (fathomParam) {
      handleFathomDoneSignal(fathomParam);
      params.delete('fathom');
      var qs = params.toString();
      var cleanUrl = window.location.pathname + (qs ? '?' + qs : '');
      window.history.replaceState({}, '', cleanUrl);
    }

    setDateRange(30);
  }

  // Converts a popup-result kind into a notice + triggers a status refresh.
  // Called from both the postMessage handler (popup flow) and the URL-param
  // fallback (direct visit) so the two paths produce identical behavior.
  function handleFathomDoneSignal(kind) {
    if (kind === 'connected') {
      state.fathomNotice = { kind: 'success', text: 'Fathom connected successfully.' };
    } else if (kind === 'denied') {
      state.fathomNotice = { kind: 'warn', text: 'Fathom connection was declined. You can try again any time.' };
    } else {
      state.fathomNotice = { kind: 'error', text: 'Could not connect Fathom. Please try again.' };
    }
    // Fire-and-forget status refresh — render is non-blocking.
    refreshFathomStatusInBackground();
  }

  async function fetchMe() {
    try {
      var res = await fetch('/auth/me', { headers: authHeader() });
      if (!res.ok) return null;
      return await res.json();
    } catch (e) { return null; }
  }

  async function loadUsers() {
    try {
      var res = await fetch('/admin/users', { headers: authHeader() });
      if (!res.ok) return;
      var d = await res.json();
      state.users = (d && d.users) || [];
    } catch (e) { /* silent */ }
  }

  // ──────────────────────────────────────────────────────────────────
  // Data fetch
  // ──────────────────────────────────────────────────────────────────
  function isSelf() { return state.viewingUserId === state.me.user_id; }

  async function fetchAnalytics() {
    var url = isSelf()
      ? '/me/analytics?from=' + encodeURIComponent(state.dateRange.from) + '&to=' + encodeURIComponent(state.dateRange.to)
      : '/admin/analytics/' + encodeURIComponent(state.viewingUserId)
        + '?from=' + encodeURIComponent(state.dateRange.from) + '&to=' + encodeURIComponent(state.dateRange.to);
    var res = await fetch(url, { headers: authHeader() });
    if (res.status === 401) { clearSession(); window.location.replace('/login'); throw new Error('unauth'); }
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  }

  async function fetchPatterns() {
    var url = isSelf()
      ? '/me/coaching/patterns?from=' + encodeURIComponent(state.dateRange.from) + '&to=' + encodeURIComponent(state.dateRange.to)
      : '/admin/coaching/' + encodeURIComponent(state.viewingUserId) + '/patterns'
        + '?from=' + encodeURIComponent(state.dateRange.from) + '&to=' + encodeURIComponent(state.dateRange.to);
    var res = await fetch(url, { headers: authHeader() });
    if (res.status === 401) { clearSession(); window.location.replace('/login'); throw new Error('unauth'); }
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  }

  // /fathom/status is per-caller (no /admin equivalent for Phase 1). Only
  // called when state.viewingUserId === state.me.user_id — see
  // renderFathomSectionHtml below for the early-return on admin pivot.
  async function fetchFathomStatus() {
    var res = await fetch('/fathom/status', { headers: authHeader() });
    if (res.status === 401) { clearSession(); window.location.replace('/login'); throw new Error('unauth'); }
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  }

  // Failure-tolerant wrapper for post-action refreshes (after Connect or
  // Sync finishes). Never throws — sets a safe default and re-renders.
  async function refreshFathomStatusInBackground() {
    try {
      state.fathomStatus = await fetchFathomStatus();
    } catch (e) {
      // On error, fall back to a "disconnected" view so the UI doesn't
      // get stuck in a stale connected state.
      state.fathomStatus = { connected: false };
    }
    if (state.view === 'overview') renderOverview(false);
  }

  // Button handler: kicks off OAuth in a popup window. The popup later
  // posts a 'scout-fathom-done' message back to this window (see init()).
  async function connectFathom() {
    try {
      var res = await fetch('/auth/fathom/connect', { headers: authHeader() });
      if (res.status === 401) { clearSession(); window.location.replace('/login'); return; }
      if (!res.ok) {
        state.fathomNotice = { kind: 'error', text: 'Could not start Fathom connection (HTTP ' + res.status + ').' };
        if (state.view === 'overview') renderOverview(false);
        return;
      }
      var data = await res.json();
      if (!data || !data.url) {
        state.fathomNotice = { kind: 'error', text: 'Fathom did not return an authorization URL.' };
        if (state.view === 'overview') renderOverview(false);
        return;
      }
      var w = 600, h = 720;
      var left = Math.max(0, Math.floor((window.screen.width - w) / 2));
      var top  = Math.max(0, Math.floor((window.screen.height - h) / 2));
      var popup = window.open(
        data.url,
        'fathom_oauth',
        'width=' + w + ',height=' + h + ',left=' + left + ',top=' + top + ',resizable=yes,scrollbars=yes'
      );
      if (!popup) {
        state.fathomNotice = { kind: 'error', text: 'Popup blocked. Please allow popups for this site and try again.' };
        if (state.view === 'overview') renderOverview(false);
      }
      // Otherwise: popup is open, no further work here. handleFathomDoneSignal
      // takes over once the user authorizes (or denies).
    } catch (err) {
      state.fathomNotice = { kind: 'error', text: 'Could not start Fathom connection: ' + (err && err.message || 'unknown') };
      if (state.view === 'overview') renderOverview(false);
    }
  }

  // Button handler: manually trigger a sync. Disables the button via the
  // state.fathomSyncing flag (drives the spinner) so concurrent clicks
  // can't fire two parallel requests.
  async function syncFathomNow() {
    if (state.fathomSyncing) return; // guard against double-click
    state.fathomSyncing = true;
    if (state.view === 'overview') renderOverview(false);

    var noticeText = null;
    var noticeKind = 'success';
    try {
      var res = await fetch('/fathom/sync', { headers: authHeader() });
      if (res.status === 401) { clearSession(); window.location.replace('/login'); return; }
      if (res.ok) {
        var data = await res.json();
        var n = (data && typeof data.synced === 'number') ? data.synced : 0;
        noticeText = 'Synced ' + n + ' new call' + (n === 1 ? '' : 's') + '.';
        if (data && data.truncated) {
          noticeText += ' (More calls available — run sync again to fetch the rest.)';
          noticeKind = 'warn';
        }
      } else if (res.status === 404) {
        noticeText = 'Not connected to Fathom.';
        noticeKind = 'error';
      } else {
        var errBody = null;
        try { errBody = await res.json(); } catch (e) { /* ignore */ }
        noticeText = 'Sync failed: ' + (errBody && errBody.error ? errBody.error : 'HTTP ' + res.status);
        noticeKind = 'error';
      }
    } catch (err) {
      noticeText = 'Sync error: ' + (err && err.message || 'unknown');
      noticeKind = 'error';
    }
    state.fathomNotice = { kind: noticeKind, text: noticeText };
    state.fathomSyncing = false;
    // Refresh status (last_sync_at + call_count) regardless of outcome,
    // then re-render — covers the success path AND any error path so the
    // strip reflects the connection's true current state.
    await refreshFathomStatusInBackground();
  }

  // Button handler: re-trigger analysis on calls already synced but still
  // pending (POST /fathom/reanalyze — does NOT re-sync from Fathom). Used to
  // unstick calls that were reset from 'error' back to 'pending' after the
  // OAuth transcript fix. Mirrors syncFathomNow's flag-guarded, notice-driven
  // shape; the queued count comes back immediately, analysis runs server-side.
  async function reanalyzeFathomNow() {
    if (state.fathomReanalyzing) return; // guard against double-click
    state.fathomReanalyzing = true;
    if (state.view === 'overview') renderOverview(false);

    var noticeText = null;
    var noticeKind = 'success';
    try {
      var res = await fetch('/fathom/reanalyze', {
        method: 'POST',
        headers: Object.assign({ 'Content-Type': 'application/json' }, authHeader()),
        body: JSON.stringify({ limit: 10 }),   // process a bounded batch per click
      });
      if (res.status === 401) { clearSession(); window.location.replace('/login'); return; }
      if (res.ok) {
        var data = await res.json();
        var n = (data && typeof data.queued === 'number') ? data.queued : 0;
        noticeText = n === 0
          ? 'No pending calls to reanalyze.'
          : 'Queued ' + n + ' call' + (n === 1 ? '' : 's') + ' for reanalysis. Grades will populate as each finishes.';
      } else {
        var errBody = null;
        try { errBody = await res.json(); } catch (e) { /* ignore */ }
        noticeText = 'Reanalyze failed: ' + (errBody && errBody.error ? errBody.error : 'HTTP ' + res.status);
        noticeKind = 'error';
      }
    } catch (err) {
      noticeText = 'Reanalyze error: ' + (err && err.message || 'unknown');
      noticeKind = 'error';
    }
    state.fathomNotice = { kind: noticeKind, text: noticeText };
    state.fathomReanalyzing = false;
    // Refresh status so pending_count (and thus button visibility) reflects the
    // dispatch. Note the count won't drop to 0 instantly — the worker flips rows
    // to 'processed' asynchronously; a later status poll catches up.
    await refreshFathomStatusInBackground();
  }

  function dismissFathomNotice() {
    state.fathomNotice = null;
    if (state.view === 'overview') renderOverview(false);
    else if (state.view === 'call-library') renderCallLibrary();
    else if (state.view === 'call-review') renderCallReview();
  }

  // ─── Fathom rendering helpers ─────────────────────────────────────────
  // renderFathomNoticeHtml + renderFathomSectionHtml both return either ''
  // or a fragment. Called from renderOverview between the page header and
  // the donut row.

  function renderFathomNoticeHtml() {
    if (!state.fathomNotice) return '';
    var n = state.fathomNotice;
    var kind = (n.kind === 'success' || n.kind === 'warn' || n.kind === 'error') ? n.kind : 'success';
    return '<div class="fathom-notice ' + kind + '">'
      + '<div class="fathom-notice-text">' + escapeHtml(n.text || '') + '</div>'
      + '<button class="fathom-notice-dismiss" type="button" aria-label="Dismiss" onclick="dismissFathomNotice()">×</button>'
      + '</div>';
  }

  function renderFathomSectionHtml() {
    // Hide when an admin/owner is viewing another user — Fathom connection
    // is per-user and there is no admin endpoint for another user's status
    // in Phase 1. The notice still renders above the donuts via the call
    // in renderOverview so admin-triggered actions (none currently) would
    // still produce feedback.
    if (state.viewingUserId !== state.me.user_id) return '';

    // Pre-first-fetch: render nothing to avoid a layout jump while
    // /fathom/status is in flight (it runs in the same Promise.all as
    // the donut data, so it's only null on the very first render call).
    if (!state.fathomStatus) return '';

    var inner;
    if (state.fathomSyncing) {
      inner = renderFathomStripSyncing();
    } else if (!state.fathomStatus.connected) {
      inner = renderFathomConnectCard();
    } else if (state.fathomStatus.last_sync_status === 'error') {
      inner = renderFathomStripError(state.fathomStatus);
    } else {
      inner = renderFathomStripConnected(state.fathomStatus);
    }
    return '<section class="section fade-in fathom-section">' + inner + '</section>';
  }

  function renderFathomConnectCard() {
    return '<div class="fathom-connect-card">'
      + '<div class="fathom-connect-text">'
        + '<div class="fathom-connect-title">Connect Fathom</div>'
        + '<div class="fathom-connect-sub">Auto-sync your sales calls so they show up here without manual upload. One click — Fathom handles the login.</div>'
      + '</div>'
      + '<button class="btn-fathom-primary" type="button" onclick="connectFathom()">Connect Fathom →</button>'
      + '</div>';
  }

  function renderFathomStripConnected(status) {
    var count = (typeof status.call_count === 'number') ? status.call_count : 0;
    var pending = (typeof status.pending_count === 'number') ? status.pending_count : 0;
    var lastSync = status.last_sync_at ? formatRelativeTime(status.last_sync_at) : 'never';
    var syncBtn = state.fathomSyncing
      ? '<button class="btn-fathom-secondary" type="button" disabled><span class="spinner-tiny"></span> Syncing…</button>'
      : '<button class="btn-fathom-secondary" type="button" onclick="syncFathomNow()">↻ Sync now</button>';
    // Reanalyze button + "N pending analysis" meta only appear when calls are
    // sitting at sync_status='pending' (newly synced or reset back to the worker).
    var reanalyzeBtn = '';
    if (pending > 0) {
      reanalyzeBtn = state.fathomReanalyzing
        ? '<button class="btn-fathom-secondary" type="button" disabled><span class="spinner-tiny"></span> Reanalyzing…</button>'
        : '<button class="btn-fathom-secondary" type="button" onclick="reanalyzeFathomNow()">' + (pending > 10 ? '⟳ Analyze next 10' : '⟳ Reanalyze ' + pending + ' pending') + '</button>';
    }
    var pendingMeta = pending > 0
      ? '<span class="fathom-strip-sep">·</span><span class="fathom-strip-meta">' + pending + ' pending analysis</span>'
      : '';
    return '<div class="fathom-strip">'
      + '<div class="fathom-strip-left">'
        + '<span class="fathom-strip-icon ok"></span>'
        + '<span class="fathom-strip-text">Fathom connected</span>'
        + '<span class="fathom-strip-sep">·</span>'
        + '<span class="fathom-strip-meta">' + count + ' call' + (count === 1 ? '' : 's') + ' synced</span>'
        + '<span class="fathom-strip-sep">·</span>'
        + '<span class="fathom-strip-meta">Last sync ' + escapeHtml(lastSync) + '</span>'
        + pendingMeta
      + '</div>'
      + '<div style="display:flex;gap:8px;flex-wrap:wrap;">' + syncBtn + reanalyzeBtn + '</div>'
      + '</div>';
  }

  function renderFathomStripSyncing() {
    return '<div class="fathom-strip">'
      + '<div class="fathom-strip-left">'
        + '<span class="spinner-tiny"></span>'
        + '<span class="fathom-strip-text">Syncing Fathom calls…</span>'
      + '</div>'
      + '<button class="btn-fathom-secondary" type="button" disabled>Syncing…</button>'
      + '</div>';
  }

  function renderFathomStripError(status) {
    var errText = status.last_sync_error ? String(status.last_sync_error) : 'Last sync failed.';
    return '<div class="fathom-strip error">'
      + '<div class="fathom-strip-left">'
        + '<div>'
          + '<div><span class="fathom-strip-icon err"></span> <span class="fathom-strip-text">Fathom sync failed</span></div>'
          + '<div class="fathom-strip-error-text">' + escapeHtml(errText) + '</div>'
        + '</div>'
      + '</div>'
      + '<div style="display:flex;gap:8px;flex-wrap:wrap;">'
        + '<button class="btn-fathom-secondary" type="button" onclick="syncFathomNow()"' + (state.fathomSyncing ? ' disabled' : '') + '>↻ Retry sync</button>'
        + '<button class="btn-fathom-primary" type="button" onclick="connectFathom()">Reconnect</button>'
      + '</div>'
      + '</div>';
  }

  // Format an ISO timestamp into "5m ago" / "2h ago" / "3 days ago" / "Jun 14".
  // Phase 1 standalone formatter — keeps the Fathom block self-contained.
  function formatRelativeTime(iso) {
    if (!iso) return 'never';
    var then = new Date(iso).getTime();
    if (isNaN(then)) return 'never';
    var diff = Math.max(0, Date.now() - then);
    var s = Math.floor(diff / 1000);
    if (s < 60) return 'just now';
    var m = Math.floor(s / 60);
    if (m < 60) return m + 'm ago';
    var h = Math.floor(m / 60);
    if (h < 24) return h + 'h ago';
    var d = Math.floor(h / 24);
    if (d < 7) return d + (d === 1 ? ' day ago' : ' days ago');
    return new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  }

  async function fetchCalls() {
    var url = isSelf()
      ? '/me/sessions?limit=100'
      : '/admin/sessions?limit=100&user_id=' + encodeURIComponent(state.viewingUserId);
    var res = await fetch(url, { headers: authHeader() });
    if (res.status === 401) { clearSession(); window.location.replace('/login'); throw new Error('unauth'); }
    if (!res.ok) throw new Error('HTTP ' + res.status);
    var d = await res.json();
    var all = (d && d.sessions) || [];
    // Client-side date filter.
    return all.filter(function(s) {
      return s.started_at >= state.dateRange.from && s.started_at <= state.dateRange.to;
    });
  }

  async function fetchObjections(sessionId) {
    if (state.objectionsCache[sessionId]) return state.objectionsCache[sessionId];
    var url = isSelf()
      ? '/me/sessions/' + encodeURIComponent(sessionId) + '/objections'
      : '/admin/sessions/' + encodeURIComponent(sessionId) + '/objections';
    var res = await fetch(url, { headers: authHeader() });
    if (!res.ok) return [];
    var d = await res.json();
    var rows = (d && d.objections) || [];
    state.objectionsCache[sessionId] = rows;
    return rows;
  }

  // ──────────────────────────────────────────────────────────────────
  // Date range / user controls
  // ──────────────────────────────────────────────────────────────────
  function setDateRange(days) {
    var to = new Date();
    var from = days >= 9999
      ? new Date('2025-01-01T00:00:00Z')
      : new Date(Date.now() - days * 24 * 60 * 60 * 1000);
    state.dateRange = { from: from.toISOString(), to: to.toISOString(), days: days };
    state.view = 'overview';
    state.expandedCallId = null;
    state.objectionsCache = {};
    reloadAll();
  }

  function setUser(userId) {
    if (!userId || userId === state.viewingUserId) return;
    var url = new URL(window.location.href);
    if (userId === state.me.user_id) url.searchParams.delete('user');
    else url.searchParams.set('user', userId);
    window.history.replaceState({}, '', url.toString());
    state.viewingUserId = userId;
    state.view = 'overview';
    state.expandedCallId = null;
    state.objectionsCache = {};
    reloadAll();
  }

  async function reloadAll() {
    renderOverview(true /* loading */);
    try {
      // Fathom status fetch is wrapped in a .catch so a stale token or
      // misconfigured FATHOM_* env vars don't break the whole dashboard
      // — the Fathom strip will simply render as "disconnected" in that
      // case. Critical analytics fetches stay in the throw-fast path.
      var fathomPromise = isSelf()
        ? fetchFathomStatus().catch(function() { return { connected: false }; })
        : Promise.resolve(null); // admin pivot: skip — section hidden anyway

      var results = await Promise.all([
        fetchAnalytics(),
        fetchPatterns(),
        fetchCalls(),
        fathomPromise,
      ]);
      state.analytics    = results[0];
      state.patterns     = results[1];
      state.calls        = results[2];
      state.fathomStatus = results[3];
      render();
    } catch (err) {
      if (err.message === 'unauth') return;
      document.getElementById('content').innerHTML = '<div class="error">Could not load dashboard data: ' + escapeHtml(err.message || 'unknown') + '</div>';
    }
  }

  // ──────────────────────────────────────────────────────────────────
  // Top-level render — switches on state.view
  // ──────────────────────────────────────────────────────────────────
  function render() {
    if (state.view === 'overview') renderOverview(false);
    else if (state.view === 'calls') renderCallsDrill();
    else if (state.view === 'objections') renderObjectionsDrill();
    else if (state.view === 'closes') renderClosesDrill();
    else if (state.view === 'objection-type') renderObjectionTypeDrill();
    else if (state.view === 'call-library') renderCallLibrary();
    else if (state.view === 'call-review') renderCallReview();
    updateNavActiveStates();
  }

  // Nav lives OUTSIDE #content, so it isn't re-rendered when render() swaps
  // the content. We update the active classes imperatively here. Coaching
  // Dashboard is "active" for any view in the overview umbrella (overview
  // itself + its donut drills); Calls is active for the call-library view.
  function updateNavActiveStates() {
    var OVERVIEW_VIEWS = { overview: 1, calls: 1, objections: 1, closes: 1, 'objection-type': 1 };
    var CALL_LIBRARY_VIEWS = { 'call-library': 1, 'call-review': 1 };
    var navOverview = document.getElementById('navOverview');
    var navCallLibrary = document.getElementById('navCallLibrary');
    if (navOverview) {
      navOverview.classList.toggle('nav-active', !!OVERVIEW_VIEWS[state.view]);
    }
    if (navCallLibrary) {
      navCallLibrary.classList.toggle('nav-active', !!CALL_LIBRARY_VIEWS[state.view]);
    }
  }

  function renderHeaderHtml() {
    var heading;
    var sub;
    if (state.viewingUserId === state.me.user_id) {
      heading = 'Coaching Review';
      sub = 'Your call patterns, objection handling, and coaching feedback.';
    } else {
      var u = state.users.find(function(x) { return x.user_id === state.viewingUserId; });
      heading = (u ? u.email : state.viewingUserId);
      sub = 'Viewing as ' + state.me.role + '.';
    }

    var userPicker = '';
    if (state.me.role === 'admin' || state.me.role === 'owner') {
      var opts = state.users.slice().sort(function(a, b) { return (a.email || '').localeCompare(b.email || ''); }).map(function(u) {
        var sel = u.user_id === state.viewingUserId ? ' selected' : '';
        return '<option value="' + escapeHtml(u.user_id) + '"' + sel + '>' + escapeHtml(u.email || u.user_id) + '</option>';
      }).join('');
      userPicker = '<select class="user-select" onchange="setUser(this.value)">' + opts + '</select>';
    }

    var presets = '';
    [[7, '7d'], [30, '30d'], [90, '90d'], [9999, 'All']].forEach(function(p) {
      var active = state.dateRange.days === p[0] ? ' active' : '';
      presets += '<button class="date-preset' + active + '" onclick="setDateRange(' + p[0] + ')">' + p[1] + '</button>';
    });

    var scopePill = state.viewingUserId !== state.me.user_id ? '<span class="scope-pill">' + escapeHtml(state.me.role || '') + ' view</span>' : '';

    return '<div class="page-header fade-in">'
         + '<div><h1>' + escapeHtml(heading) + scopePill + '</h1>'
         + '<div class="subtitle">' + escapeHtml(sub) + '</div></div>'
         + '<div class="controls">' + userPicker
         + '<div class="date-presets">' + presets + '</div>'
         + '</div></div>';
  }

  // ──────────────────────────────────────────────────────────────────
  // Overview view — three donuts + coach summary + recent calls
  // ──────────────────────────────────────────────────────────────────
  function renderOverview(isLoading) {
    var content = document.getElementById('content');
    if (isLoading || !state.analytics) {
      content.innerHTML = renderHeaderHtml()
        + renderFathomNoticeHtml()
        + renderFathomSectionHtml()
        + '<div class="donut-row">'
          + '<div class="skeleton-donut"></div><div class="skeleton-donut"></div><div class="skeleton-donut"></div>'
        + '</div>'
        + '<div class="section"><div class="skeleton" style="height:60px;"></div></div>';
      return;
    }

    var t = state.analytics.totals;
    var obj = state.analytics.objections;

    // Donut 1: Calls — segments by outcome. Center is total calls.
    // Donut 2: Objections — segments by type. Center is total objections.
    // Donut 3: Close Rate — won vs lost/follow_up. Center is %.
    var closeDenom = t.wins + t.losses + t.follow_ups;
    var closeRate = closeDenom > 0 ? Math.round((t.wins / closeDenom) * 100) : null;

    content.innerHTML = renderHeaderHtml()
      + renderFathomNoticeHtml()
      + renderFathomSectionHtml()
      + '<div class="donut-row fade-in">'
        + donutCardHtml('chart-calls', 'Calls', t.total_calls, null, 'click to drill in', 'calls')
        + donutCardHtml('chart-objs', 'Objections', obj.totals.total, null, 'click to drill in', 'objections')
        + donutCardHtml('chart-closes', 'Close Rate', closeRate === null ? '—' : (closeRate + '%'), null, 'click to drill in', 'closes')
      + '</div>'
      + '<div class="section fade-in">'
        + '<div class="section-header"><h2>Coach summary</h2>'
        + '<div class="meta">' + ((state.patterns && state.patterns.sample_size != null) ? 'based on ' + state.patterns.sample_size + ' calls' : '') + '</div></div>'
        + renderPatternsHtml(state.patterns)
      + '</div>'
      + '<div class="section fade-in">'
        + '<div class="section-header"><h2>Recent calls</h2>'
        + '<div class="meta">' + state.calls.length + (state.calls.length === 1 ? ' call' : ' calls') + ' in window</div></div>'
        + renderCallsHtml(state.calls)
      + '</div>';

    // Draw the three donuts after the DOM is laid out.
    requestAnimationFrame(function() {
      drawCallsDonut('chart-calls', t);
      drawObjectionsDonut('chart-objs', obj);
      drawClosesDonut('chart-closes', t, closeRate);
    });

    // Re-bind expanded body for any previously-open call.
    if (state.expandedCallId) {
      var card = document.querySelector('[data-session-id="' + state.expandedCallId + '"]');
      if (card) {
        card.classList.add('expanded');
        renderCallBody(state.expandedCallId);
      }
    }
  }

  function donutCardHtml(canvasId, label, centerBig, centerSmall, hint, clickKey) {
    var smallHtml = centerSmall ? '<div class="small">' + escapeHtml(centerSmall) + '</div>' : '';
    return '<div class="donut-card" onclick="setView(\'' + clickKey + '\')">'
         + '<div class="donut-label">' + escapeHtml(label) + '</div>'
         + '<div class="donut-canvas-wrap">'
           + '<canvas id="' + canvasId + '"></canvas>'
           + '<div class="donut-center"><div class="big">' + escapeHtml(String(centerBig)) + '</div>' + smallHtml + '</div>'
         + '</div>'
         + '<div class="donut-hint">' + escapeHtml(hint) + '</div>'
         + '</div>';
  }

  // ──────────────────────────────────────────────────────────────────
  // Chart drawing — Chart.js with custom dark theme + thin ring
  // ──────────────────────────────────────────────────────────────────
  var COLORS = {
    win: '#4ade80', loss: '#f87171', follow_up: '#fbbf24', unmarked: '#64748b', live: '#5b9eff',
    money: '#5b9eff', think: '#fbbf24', spouse: '#c084fc', time: '#fb923c',
    guarantee: '#22d3ee', 'tried-before': '#a78bfa', 'send-info': '#34d399',
    'more-research': '#f472b6', 'not-right-time': '#fb7185', 'proof-it-works': '#94a3b8',
    other: '#64748b',
  };

  function donutBase(canvasId, labels, values, colors) {
    var ctx = document.getElementById(canvasId);
    if (!ctx) return null;
    if (!window.Chart) return null;
    return new Chart(ctx.getContext('2d'), {
      type: 'doughnut',
      data: {
        labels: labels,
        datasets: [{
          data: values,
          backgroundColor: colors,
          borderWidth: 0,
          spacing: 2,
          hoverOffset: 8,
        }],
      },
      options: {
        cutout: '78%',
        responsive: true,
        maintainAspectRatio: true,
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: '#1a1a1a',
            titleColor: '#ededed',
            bodyColor: '#cccccc',
            borderColor: '#2a2a2a',
            borderWidth: 1,
            padding: 10,
            cornerRadius: 8,
            displayColors: true,
            titleFont: { size: 12, weight: 600 },
            bodyFont: { size: 12 },
          },
        },
        animation: { duration: 700, easing: 'easeOutCubic' },
      },
    });
  }

  function drawCallsDonut(canvasId, t) {
    if (state.chart1) state.chart1.destroy();
    var labels = ['Won', 'Lost', 'Follow-up', 'Unmarked'];
    var values = [t.wins, t.losses, t.follow_ups, t.unmarked + t.live];
    var colors = [COLORS.win, COLORS.loss, COLORS.follow_up, COLORS.unmarked];
    // Filter zero-value entries to keep tooltips clean
    var filtered = filterZero(labels, values, colors);
    state.chart1 = donutBase(canvasId, filtered.labels, filtered.values, filtered.colors);
  }

  function drawObjectionsDonut(canvasId, obj) {
    if (state.chart2) state.chart2.destroy();
    var byType = obj.by_type || [];
    var labels = byType.map(function(b) { return b.label; });
    var values = byType.map(function(b) { return b.count; });
    var colors = byType.map(function(b) { return COLORS[b.objection_id] || COLORS.other; });
    if (labels.length === 0) {
      // Render a single gray ring when no data so the visual doesn't collapse.
      labels = ['No objections'];
      values = [1];
      colors = ['#1f1f1f'];
    }
    state.chart2 = donutBase(canvasId, labels, values, colors);
  }

  function drawClosesDonut(canvasId, t, closeRate) {
