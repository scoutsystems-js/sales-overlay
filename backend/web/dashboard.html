  // Glance-box detail: the clicked team metric broken down per rep (reuses the
  // /team/overview per_rep data — no extra fetch). Rows click through to the
  // rep's pivoted coaching dashboard.
  var TEAM_DETAIL = {
    cash:      { title: 'Cash collected', meta: 'closed-call cash, by rep',
                 value: function (r) { return r.cash_collected || 0; },
                 label: function (r) { return fmtCash(r.cash_collected); },
                 sub:   function (r) { return r.close_wins + ' closed'; } },
    close:     { title: 'Close rate', meta: 'closed prospects / total prospects, by rep',
                 value: function (r) { return r.prospect_close_rate == null ? -1 : r.prospect_close_rate; },
                 label: function (r) { return closeRateDisplay(r).value; },
                 sub:   function (r) { return closeRateDisplay(r).sub; } },
    objection: { title: 'Objection handle rate', meta: 'objections resolved "handled", by rep',
                 value: function (r) { return r.obj_handle_rate == null ? -1 : r.obj_handle_rate; },
                 label: function (r) { return r.obj_handle_rate == null ? '—' : r.obj_handle_rate + '%'; },
                 sub:   function (r) { return r.obj_total ? (r.obj_handled + '/' + r.obj_total + ' handled') : 'no objections'; } },
  };
  function teamDetailHtml() {
    var cfg = TEAM_DETAIL[state.teamDetailMetric];
    var back = '<button class="date-preset" onclick="closeTeamDetail()">← back to team</button>';
    var o = state.teamOverview;
    if (!cfg) { state.teamDetailMetric = null; return ''; }
    var head = '<div class="section-header"><div><h2>' + escapeHtml(cfg.title) + '</h2><div class="meta">' + escapeHtml(cfg.meta) + '</div></div>' + back + '</div>';
    if (!o || o._forbidden) return head + '<div class="error">Not authorized for this team.</div>';
    if (o._error) return head + '<div class="error">Could not load team overview: ' + escapeHtml(o._error) + '</div>';
    var reps = (o.per_rep || []).slice();
    if (!reps.length) return head + '<div class="empty"><p>No reps in this team yet.</p></div>';
    reps.sort(function (a, b) { return cfg.value(b) - cfg.value(a); });
    var max = Math.max.apply(null, reps.map(function (r) { return Math.max(0, cfg.value(r)); }).concat([1]));
    var rows = reps.map(function (r) {
      var v = Math.max(0, cfg.value(r));
      var pct = Math.round((v / max) * 100);
      return '<div class="team-detail-row" onclick="setUser(\'' + escapeHtml(r.user_id) + '\')" title="Open ' + escapeHtml(r.email || '') + '\'s dashboard">'
        + '<div class="team-detail-name">' + escapeHtml(repName(r)) + '</div>'
        + '<div class="team-detail-track"><div class="team-detail-fill" style="width:' + Math.max(2, pct) + '%;"></div></div>'
        + '<div class="team-detail-val">' + cfg.label(r) + '<span class="team-detail-sub">' + escapeHtml(cfg.sub(r)) + '</span></div>'
        + '</div>';
    }).join('');
    return head + '<div class="team-detail-list">' + rows + '</div>';
  }

  function teamInsightHtml(it, kind) {
    var clipBtn = it.clip_url ? '<a class="review-why-clip" href="' + escapeHtml(it.clip_url) + '" target="_blank" rel="noopener">▶ clip</a>' : '';
    var repTag = it.rep ? '<span class="team-rep-tag">' + escapeHtml(String(it.rep).split('@')[0]) + '</span>' : '';
    return '<div class="team-insight ' + kind + '">'
      + '<div class="team-insight-claim">' + escapeHtml(it.claim || '') + '</div>'
      + (it.data ? '<div class="team-insight-data">' + escapeHtml(it.data) + '</div>' : '')
      + (it.quote ? '<div class="review-why-quote">“' + escapeHtml(it.quote) + '”</div>' : '')
      + '<div class="team-insight-foot">' + repTag + clipBtn + '</div>'
    + '</div>';
  }
  function teamRecsHtml() {
    var r = state.teamRecs;
    if (!r) return '<div class="skeleton" style="height:80px;"></div>';
    if (r._error) return '<div class="error">Could not load recommendations: ' + escapeHtml(r._error) + '</div>';
    if (!r.available) return '<div class="empty"><h3>Recommendations unavailable</h3><p>' + escapeHtml(r.reason || 'Could not generate right now.') + '</p></div>';
    var w = r.working || [], i = r.improve || [];
    if (!w.length && !i.length) return '<div class="empty"><p>Not enough analyzed team calls yet.</p></div>';
    return '<div class="obj-group-header" style="color:var(--good)">What\'s working</div>'
      + (w.length ? w.map(function (x) { return teamInsightHtml(x, 'working'); }).join('') : '<div class="empty"><p>—</p></div>')
      + '<div class="obj-group-header" style="color:var(--mid);margin-top:18px;">What to improve</div>'
      + (i.length ? i.map(function (x) { return teamInsightHtml(x, 'improve'); }).join('') : '<div class="empty"><p>—</p></div>');
  }

  function teamHighlightsHtml() {
    var h = state.teamHighlights;
    if (!h) return '<div class="skeleton" style="height:80px;"></div>';
    if (h._error) return '<div class="error">Could not load highlights: ' + escapeHtml(h._error) + '</div>';
    if (!h.available) return '<div class="empty"><h3>Highlights unavailable</h3><p>' + escapeHtml(h.reason || '') + '</p></div>';
    var lanes = h.lanes || {};
    var LANE = { objection_handling: 'Best objection handling', challenging: 'Best challenger moment', pain_excavation: 'Best pain excavation' };
    var keys = Object.keys(LANE).filter(function (k) { return lanes[k]; });
    if (!keys.length) return '<div class="empty"><p>No standout team moments this week yet.</p></div>';
    return '<div class="team-lane-row">' + keys.map(function (k) {
      var m = lanes[k];
      var clip = m.clip_url ? '<a class="review-why-clip" href="' + escapeHtml(m.clip_url) + '" target="_blank" rel="noopener">▶ clip</a>' : '';
      return '<div class="team-lane">'
        + '<div class="team-lane-title">' + LANE[k] + '</div>'
        + '<div class="team-lane-rep">' + escapeHtml(String(m.rep || '').split('@')[0]) + '</div>'
        + '<div class="review-why-quote">“' + escapeHtml(m.quote || '') + '”</div>'
        + (m.why ? '<div class="team-lane-why">' + escapeHtml(m.why) + '</div>' : '')
        + '<div class="team-insight-foot">' + clip + '</div>'
      + '</div>';
    }).join('') + '</div>';
  }

  function teamDigestHtml() {
    var d = state.teamDigest;
    if (!d) return '<div class="skeleton" style="height:80px;"></div>';
    if (d._error) return '<div class="error">Could not load digest: ' + escapeHtml(d._error) + '</div>';

    // History chips (last 7 stored digest days) — render whenever present so
    // the manager can page through recent days, including from a pending state.
    var chips = '';
    var recents = Array.isArray(d.recent_dates) ? d.recent_dates : [];
    if (recents.length > 1 || (recents.length === 1 && recents[0] !== d.date)) {
      chips = '<div class="digest-date-row">' + recents.map(function (dt) {
        return '<button type="button" class="digest-date-chip' + (dt === d.date ? ' active' : '')
          + '" onclick="selectDigestDate(\'' + dt + '\')">' + escapeHtml(dt) + '</button>';
      }).join('') + '</div>';
    }

    if (!d.available) {
      return chips + '<div class="empty"><h3>No digest for ' + escapeHtml(d.date || '') + '</h3><p>'
        + escapeHtml(d.reason || 'It generates after the morning sync.') + '</p></div>';
    }

    var s = d.stats || {};
    var stats = '<div class="team-stat-row">'
      + '<div class="team-stat"><div class="team-stat-val">' + (s.calls || 0) + '</div><div class="team-stat-label">Calls</div></div>'
      + '<div class="team-stat"><div class="team-stat-val">' + (s.closed || 0) + '</div><div class="team-stat-label">Closed</div></div>'
      + '<div class="team-stat"><div class="team-stat-val">' + (s.follow_up || 0) + '</div><div class="team-stat-label">Follow-ups</div></div>'
      + '<div class="team-stat"><div class="team-stat-val">' + (s.lost || 0) + '</div><div class="team-stat-label">Lost</div></div>'
      + '<div class="team-stat"><div class="team-stat-val">' + (s.reps_active || 0) + '</div><div class="team-stat-label">Reps active</div></div>'
      + '</div>';

    var notable = (d.notable || []).map(function (n) {
      var attribution = [n.rep ? escapeHtml(n.rep) : null, n.call_title ? '\u201C' + escapeHtml(n.call_title) + '\u201D' : null]
        .filter(Boolean).join(' \u00B7 ');
      var clip = n.clip ? ' <a class="review-why-clip" href="' + escapeHtml(n.clip) + '" target="_blank" rel="noopener">\u25B6 Play clip</a>' : '';
      return '<div class="digest-notable"><div>' + escapeHtml(n.text || '') + '</div>'
        + (attribution || clip ? '<div class="meta">' + attribution + clip + '</div>' : '') + '</div>';
    }).join('');

    return chips
      + '<div class="meta">' + escapeHtml(d.date || '') + (d.quiet ? ' \u00B7 quiet day' : '') + '</div>'
      + stats
      + '<div class="digest-summary">' + escapeHtml(d.summary || '') + '</div>'
      + notable
      + (d.focus ? '<div class="digest-focus"><div class="digest-focus-label">Today\'s focus</div>' + escapeHtml(d.focus) + '</div>' : '');
  }

  function selectDigestDate(dt) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(dt)) return;
    state.teamDigestDate = dt;
    state.teamDigest = null;
    renderTeamView();
  }

  // ─── URL hash routing ──────────────────────────────────────────────────────
  // Persist the active view in the URL hash so refresh / deep-link / back-forward
  // restore it. The ?user= admin pivot stays in the query string, untouched.
  //   overview         → (no hash)      call-library     → #calls
  //   objections-intel → #objections    call-review      → #call/<id>
  // (Dormant Live-Sessions drills carry no hash — they're unreachable today.)
  function viewToHashPath() {
    if (state.view === 'call-library')     return 'calls';
    if (state.view === 'objections-intel') return 'objections';
    if (state.view === 'needs-work')       return 'needs-work';
    if (state.view === 'performance')      return 'performance';
    if (state.view === 'kb')               return 'kb';
    if (state.view === 'prospects')        return 'prospects';
    if (state.view === 'section')          return 'section';
    if (state.view === 'eod')              return 'eod';
    if (state.view === 'account')          return 'account';
    if (state.view === 'team')             return 'team';
    if (state.view === 'team-expanded')    return 'team-recs';
    if (state.view === 'team-needs-work')  return 'team-needs-work';
    if (state.view === 'team-members')     return 'team-members';
    if (state.view === 'call-review')      return state.selectedCallId ? 'call/' + encodeURIComponent(state.selectedCallId) : 'calls';
    return ''; // overview + dormant drills
  }
  // Point the URL at the current view. pushState/replaceState do NOT fire
  // hashchange, so this never re-enters the router below (no navigation loop).
  function syncHashFromState(replace) {
    var path = viewToHashPath();
    if ((window.location.hash || '').replace(/^#/, '') === path) return; // already correct
    var url = window.location.pathname + window.location.search + (path ? '#' + path : '');
    if (replace) window.history.replaceState(null, '', url);
    else window.history.pushState(null, '', url);
  }
  // Set when the user arrives via /connect (#connect): render the Account view
  // AND scroll/highlight the Connections section so the Zoom Connect button is
  // immediately visible (Zoom submission "Direct Landing URL" requirement).
  var pendingConnectFocus = false;
  // URL hash → state.view (+ selectedCallId). No render, no history write.
  function applyHashToState() {
    var h = (window.location.hash || '').replace(/^#/, '');
    if (h === 'calls') { state.view = 'call-library'; }
    else if (h === 'eod') { state.view = 'eod'; }
    else if (h === 'connect') { state.view = 'account'; state.account = null; pendingConnectFocus = true; }
    else if (h === 'account') { state.view = 'account'; state.account = null; /* fresh on hash entry too */ }
    else if (h === 'objections') { state.view = 'objections-intel'; }
    else if (h === 'needs-work') { state.view = 'needs-work'; }
    else if (h === 'performance') { state.view = 'performance'; }
    else if (h === 'team') { state.view = 'team'; }
    else if (h === 'team-recs') { state.view = 'team-expanded'; }
    else if (h === 'team-needs-work') { state.view = 'team-needs-work'; }
    else if (h === 'team-members') { state.view = 'team-members'; }
    else if (h === 'kb') { state.view = canAccessKb() ? 'kb' : 'overview'; }
    else if (h.indexOf('call/') === 0) {
      var id = h.slice(5);
      state.selectedCallId = id ? decodeURIComponent(id) : null;
      state.view = state.selectedCallId ? 'call-review' : 'call-library';
    } else { state.view = 'overview'; }
  }
  // Back/forward (and manual hash edits) fire hashchange but NOT our own
  // pushState calls, so restoring here can't loop. call-review is the only view
  // that doesn't self-load, so kick its fetch explicitly.
  function onRouteChange() {
    if (!state.me) return; // not booted yet — init() handles the initial hash
    applyHashToState();
    render();
    if (state.view === 'call-review' && state.selectedCallId) loadCallReview(state.selectedCallId);
    window.scrollTo({ top: 0, behavior: 'auto' });
  }
  window.addEventListener('hashchange', onRouteChange);

  // ═══ Account view (#account, Stage 5) ════════════════════════════════════
  // Profile (name edits — managed lock applies), Password (all users —
  // exempt from the lock by ruling), Offer (link to KB, never a second
  // editor), Billing (badge + provider-keyed action slot; dead-ends to a
  // contact-admin mailto until billing_provider is set by a future
  // integration stage).
  // Fresh on every entry: the account payload (incl. is_managed) must reflect
  // admin-side changes immediately — clear the cached copy on BOTH entry paths
  // (nav click here; hash/back-forward in applyHashToState). Server side is
  // already fresh per request: GET /me/account reads user_profiles live, and
  // PATCH re-checks managed_by on every mutation.
  function goAccount() { state.account = null; setView('account'); }

  // FD-3: send the user to the connect surface (the #account Connections section,
  // scrolled to + highlighted — same landing as /connect). Used by the empty-state
  // CTAs on the overview-adjacent surfaces (Call Library, What-needs-work, EOD).
  function goConnectSource() { state.account = null; pendingConnectFocus = true; setView('account'); }
  function connectSourceCtaHtml() {
    return '<button class="btn-fathom-primary" type="button" style="margin-top:14px;" onclick="goConnectSource()">Connect a recording source →</button>';
  }

  async function loadAccount() {
    if (state.accountLoading) return;
    state.accountLoading = true;
    try {
      var res = await fetch('/me/account', { headers: authHeader() });
      if (res.status === 401) { clearSession(); window.location.replace('/login'); return; }
      if (!res.ok) throw new Error('HTTP ' + res.status);
      state.account = await res.json();
    } catch (err) {
      state.account = { _error: err.message || 'unknown' };
    }
    state.accountLoading = false;
    // Connections section needs both provider statuses; fetch if not already loaded.
    if (state.fathomStatus === null) refreshFathomStatusInBackground();
    if (state.zoomStatus === null) refreshZoomStatusInBackground();
    if (state.view === 'account') renderAccountView();
  }

  async function saveAccountNames() {
    var note = document.getElementById('acctSaveNote');
    var body = {
      first_name: document.getElementById('acctFirst').value,
      last_name: document.getElementById('acctLast').value,
    };
    try {
      var res = await fetch('/me/account', {
        method: 'PATCH',
        headers: Object.assign({ 'Content-Type': 'application/json' }, authHeader()),
        body: JSON.stringify(body),
      });
      var data = null; try { data = await res.json(); } catch (e) {}
      if (!res.ok) { note.textContent = (data && data.error) || 'Save failed'; note.style.color = 'var(--bad)'; return; }
      note.textContent = '✓ Saved'; note.style.color = 'var(--good)';
      if (state.account) { state.account.first_name = body.first_name; state.account.last_name = body.last_name; }
      setTimeout(function () { if (note) note.textContent = ''; }, 3000);
    } catch (e) { note.textContent = 'Could not reach server'; note.style.color = 'var(--bad)'; }
  }

  async function changePassword() {
    var note = document.getElementById('pwChangeNote');
    var cur = document.getElementById('pwCurrent').value;
    var n1 = document.getElementById('pwNew').value;
    var n2 = document.getElementById('pwNew2').value;
    note.style.color = 'var(--bad)';
    if (!cur) { note.textContent = 'Enter your current password.'; return; }
    if (n1.length < 10) { note.textContent = 'New password must be at least 10 characters.'; return; }
    if (n1 !== n2) { note.textContent = "Those passwords don't match."; return; }
    try {
      var res = await fetch('/auth/change-password', {
        method: 'POST',
        headers: Object.assign({ 'Content-Type': 'application/json' }, authHeader()),
        body: JSON.stringify({ current_password: cur, new_password: n1 }),
      });
      var data = null; try { data = await res.json(); } catch (e) {}
      if (!res.ok) { note.textContent = (data && data.error) || 'Could not change the password.'; return; }
      note.textContent = '✓ Password changed'; note.style.color = 'var(--good)';
      document.getElementById('pwCurrent').value = '';
      document.getElementById('pwNew').value = '';
      document.getElementById('pwNew2').value = '';
      setTimeout(function () { if (note) note.textContent = ''; }, 4000);
    } catch (e) { note.textContent = 'Could not reach server'; }
  }

  function acctRow(label, inner) {
    return '<div class="eod-row"><div class="eod-label">' + label + '</div>' + inner + '</div>';
  }

  // Connections section for #account — the ONLY management surface. Both
  // providers, each with state + Connect/Reconnect/Disconnect. Shown to ALL
  // users (exempt from the managed lock, same rationale as Password).
  function connectionRowHtml(provider) {
    var isZoom = provider === 'zoom';
    var label = isZoom ? 'Zoom' : 'Fathom';
    var st = isZoom ? state.zoomStatus : state.fathomStatus;
    var connectFn = isZoom ? 'connectZoom()' : 'connectFathom()';
    var right;
    if (st === null) {
      right = '<span class="meta">…</span>';
    } else if (!st.connected) {
      right = '<span class="conn-state">Not connected</span>'
        + '<button class="btn-fathom-primary" type="button" onclick="' + connectFn + '">Connect</button>';
    } else {
      var email = isZoom ? st.account_email : (st.fathom_email || null);
      var since = st.connected_at ? formatRelativeTime(st.connected_at) : null;
      var meta = [email ? escapeHtml(email) : null, since ? 'since ' + escapeHtml(since) : null].filter(Boolean).join(' · ');
      right = '<span class="conn-state ok"><span class="fathom-strip-icon ok"></span> Connected' + (meta ? ' <span class="meta">· ' + meta + '</span>' : '') + '</span>'
        + '<button class="btn-fathom-secondary" type="button" onclick="' + connectFn + '">Reconnect</button>'
        + '<button class="btn-fathom-secondary conn-disconnect" type="button" onclick="disconnectProvider(\'' + provider + '\')">Disconnect</button>';
    }
    var rowId = isZoom ? ' id="connRowZoom"' : '';
    return '<div class="eod-row conn-row"' + rowId + '><div class="eod-label">' + label + '</div>'
      + '<div class="conn-right">' + right + '</div></div>';
  }
  function renderConnectionsSectionHtml() {
    return renderZoomNoticeHtml() + renderFathomNoticeHtml()
      + connectionRowHtml('fathom')
      + connectionRowHtml('zoom')
      + '<div class="meta" style="margin-top:8px;">Disconnecting keeps your synced calls, grades, and clips — it only stops new calls from coming in.</div>';
  }

  function renderAccountView() {
    var content = document.getElementById('content');
    if (state.account === null && !state.accountLoading) loadAccount();
    var a = state.account;
    if (!a) { content.innerHTML = '<div class="section fade-in"><div class="skeleton" style="height:160px;"></div></div>'; return; }
    if (a._error) { content.innerHTML = '<div class="section fade-in"><div class="error">Could not load account: ' + escapeHtml(a._error) + '</div></div>'; return; }

    var managedNotice = '<div class="acct-notice">Your account is managed by your admin — ask them to make changes.</div>';

    // Profile
    var profileBody;
    if (a.is_managed) {
      profileBody = acctRow('Name', '<div>' + escapeHtml([a.first_name, a.last_name].filter(Boolean).join(' ') || '—') + '</div>') + managedNotice;
    } else {
      profileBody = acctRow('First name', '<input type="text" class="eod-input" id="acctFirst" value="' + escapeHtml(a.first_name || '') + '">')
        + acctRow('Last name', '<input type="text" class="eod-input" id="acctLast" value="' + escapeHtml(a.last_name || '') + '">')
        + '<div class="eod-row"><div class="eod-label"></div><div><button class="btn-fathom-secondary" type="button" onclick="saveAccountNames()">Save</button><span class="acct-save-note" id="acctSaveNote"></span></div></div>';
    }
    // Platform-wide dead-end, audience-aware copy (NOT the managed lock —
    // wording only): managed users route to their admin, unmanaged to us.
    var emailNote = a.is_managed
      ? '<span class="meta">· to change your email, contact your admin</span>'
      : '<span class="meta">· to change your email, <a href="mailto:justin@scoutsystems.io?subject=Scout%20email%20change">contact us</a></span>';
    profileBody += acctRow('Email', '<div>' + escapeHtml(a.email || '') + ' ' + emailNote + '</div>');

    // Password — all users (exempt from the managed lock by ruling)
    var passwordBody =
        acctRow('Current', '<input type="password" class="eod-input" id="pwCurrent" autocomplete="current-password">')
      + acctRow('New', '<input type="password" class="eod-input" id="pwNew" autocomplete="new-password" placeholder="At least 10 characters">')
      + acctRow('Confirm', '<input type="password" class="eod-input" id="pwNew2" autocomplete="new-password">')
      + '<div class="eod-row"><div class="eod-label"></div><div><button class="btn-fathom-secondary" type="button" onclick="changePassword()">Change password</button><span class="acct-save-note" id="pwChangeNote"></span></div></div>';

    // Offer — link to the KB, never a second editor. FD-4: managed reps can now
    // VIEW their team's KB read-only (their manager manages the contents).
    var offerBody = a.is_managed
      ? '<div class="acct-notice" style="display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap;">'
        + '<span>Your team’s offer docs, scripts, and winning calls live in your Knowledge Base — they’re what Scout grades your calls against. Your manager manages the contents; you can view them here.</span>'
        + '<button class="btn-fathom-secondary" type="button" onclick="goKb()">Open Knowledge Base →</button></div>'
      : '<div class="acct-notice" style="display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap;">'
        + '<span>Your offer docs, scripts, and winning calls live in your Knowledge Base — they ground your call grading.</span>'
        + '<button class="btn-fathom-secondary" type="button" onclick="goKb()">Open Knowledge Base →</button></div>';

    // Billing — badge + provider-keyed action slot
    var b = a.billing || {};
    var badge = '<span class="badge badge-billing-' + escapeHtml(b.status || 'trial') + '">' + escapeHtml((b.status || 'trial').replace('_', ' ')) + '</span>';
    var planRow = b.plan ? acctRow('Plan', '<div>' + escapeHtml(b.plan) + '</div>') : '';
    // Future integration stage: when billing.provider is non-NULL, this slot
    // becomes the provider's customer-portal link. Until then it dead-ends to
    // the admin, by design.
    // Provider-keyed slot semantics unchanged; the NULL-provider dead-end is
    // audience-aware copy only (not the managed lock).
    var billingAction;
    if (b.provider) {
      billingAction = '<a class="btn-fathom-secondary" href="#" onclick="return false;">Manage billing</a>';
    } else if (a.is_managed) {
      billingAction = '<span class="meta">Billing is handled by your admin</span>';
    } else {
      billingAction = '<a class="btn-fathom-secondary" href="mailto:justin@scoutsystems.io?subject=Scout%20billing" style="text-decoration:none;">Billing setup is coming soon — questions? Contact us</a>';
    }
    var billingBody = acctRow('Status', '<div>' + badge + '</div>') + planRow
      + '<div class="eod-row"><div class="eod-label"></div><div>' + billingAction + '</div></div>';

    content.innerHTML =
        '<div class="section fade-in"><div class="section-header"><h2>Profile</h2></div>' + profileBody + '</div>'
      + '<div class="section fade-in" id="connectionsSection"><div class="section-header"><h2>Connections</h2><div class="meta">your call recording sources</div></div>' + renderConnectionsSectionHtml() + '</div>'
      + '<div class="section fade-in"><div class="section-header"><h2>Password</h2></div>' + passwordBody + '</div>'
      + '<div class="section fade-in"><div class="section-header"><h2>Offer</h2></div>' + offerBody + '</div>'
      + '<div class="section fade-in"><div class="section-header"><h2>Billing</h2></div>' + billingBody + '</div>';

    // Arrived via /connect → bring the Connections section (Zoom Connect button)
    // into view and briefly highlight the Zoom row. Runs once, on the first
    // full-content render (skeleton branch returns above before reaching here).
    if (pendingConnectFocus) { pendingConnectFocus = false; focusConnections(); }
  }

  // Scroll the #account Connections section into view and pulse the Zoom row, so
  // a reviewer landing from /connect immediately sees the Zoom Connect action.
  function focusConnections() {
    requestAnimationFrame(function() {
      var sec = document.getElementById('connectionsSection');
      if (sec && sec.scrollIntoView) sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
      var row = document.getElementById('connRowZoom');
      if (row) {
        row.classList.add('conn-row-focus');
        setTimeout(function() { row.classList.remove('conn-row-focus'); }, 2600);
      }
      // Normalize #connect → #account so a refresh/bookmark lands cleanly (no re-pulse).
      try {
        if ((window.location.hash || '') === '#connect') {
          window.history.replaceState(null, '', window.location.pathname + window.location.search + '#account');
        }
      } catch (e) { /* history API unavailable — harmless */ }
    });
  }

  // ═══ EOD Report view ═══════════════════════════════════════════════════
  // Per-user daily report: analysis-prefilled, inline-editable (edits persist
  // via PUT /eod/edit and always win over analysis), copy-for-Slack plain
  // text. "Today" is the ET calendar day (server-side default).
  function goEod() { setView('eod'); }

  async function loadEod() {
    if (state.eodLoading) return;
    state.eodLoading = true;
    try {
      var qs = state.eodDate ? '?date=' + encodeURIComponent(state.eodDate) : '';
      var res = await fetch('/eod' + qs, { headers: authHeader() });
      if (res.status === 401) { clearSession(); window.location.replace('/login'); return; }
      if (!res.ok) throw new Error('HTTP ' + res.status);
      state.eodData = await res.json();
      if (!state.eodDate) state.eodDate = state.eodData.date;
    } catch (err) {
      state.eodData = { _error: err.message || 'unknown' };
    }
    state.eodLoading = false;
    if (state.view === 'eod') renderEodView();
  }

  function eodShiftDay(deltaDays) {
    var d = state.eodDate || (state.eodData && state.eodData.date);
    if (!d) return;
    var parts = d.split('-').map(Number);
    var next = new Date(Date.UTC(parts[0], parts[1] - 1, parts[2]) + deltaDays * 86400000).toISOString().slice(0, 10);
    eodSetDate(next);
  }
  function eodSetDate(dateStr) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) return;
    state.eodDate = dateStr;
    state.eodData = null;
    renderEodView();
  }
  function eodToday() { state.eodDate = null; state.eodData = null; renderEodView(); }

  // Inline edit: save on change. Empty string is a deliberate clear-to-blank
  // (still an override); we never send null from the UI (no un-override
  // affordance yet — analysis values remain visible by clearing the row's edit
  // via support if ever needed).
  async function eodSaveField(callId, field, el) {
    var value = el.value;
    try {
      var res = await fetch('/eod/edit', {
        method: 'PUT',
        headers: Object.assign({ 'Content-Type': 'application/json' }, authHeader()),
        body: JSON.stringify({ call_id: callId, field: field, value: value }),
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      el.classList.add('edited');
      // update local state so a re-render (or Slack copy) uses the new value
      var call = ((state.eodData && state.eodData.calls) || []).find(function (c) { return c.call_id === callId; });
      if (call) { call.fields[field] = value; call.edited[field] = true; }
    } catch (err) {
      alert('Could not save edit: ' + (err.message || 'unknown'));
    }
  }

  function eodCashDisplay(v) {
    var n = parseFloat(v);
    if (isNaN(n)) return String(v == null ? '0' : v);
    return n % 1 === 0 ? String(n) : n.toFixed(2);
  }
  // (EOD Payment row removed by product ruling 2026-07-22 — the outcome
  // prefill now carries the composed "Closed - PIF" style label server-side.)
  function eodOutcomeLabel(oc) {
    if (oc === 'closed') return 'Closed';
    if (oc === 'follow_up') return 'Follow-up';
    if (oc === 'lost') return 'Lost';
    if (oc === 'no_show') return 'No-show';
    return oc || 'Unknown';
  }

  // Plain text for Slack — EXACT field order per spec: prospect name, outcome,
  // Fathom link, cash collected, brief summary. All calls, one paste.
  function eodSlackText() {
    var d = state.eodData;
    if (!d || !Array.isArray(d.calls)) return '';
    var lines = ['EOD Report — ' + d.date, ''];
    if (d.calls.length === 0) lines.push('No calls today.');
    d.calls.forEach(function (c, i) {
      var f = c.fields;
      lines.push(f.prospect_name || 'Unknown prospect');
      lines.push('Outcome: ' + eodOutcomeLabel(f.outcome));
      lines.push('Call: ' + (c.recording_url || '—'));
      lines.push('Cash collected: $' + eodCashDisplay(f.cash_collected));
      lines.push('Summary: ' + (f.summary || '—'));
      if (i < d.calls.length - 1) lines.push('');
    });
    return lines.join('\n');
  }

  async function eodCopyForSlack() {
    var text = eodSlackText();
    var note = document.getElementById('eodCopyNote');
    try {
      await navigator.clipboard.writeText(text);
      if (note) { note.textContent = 'Copied ✓'; setTimeout(function () { if (note) note.textContent = ''; }, 2500); }
    } catch (err) {
      // clipboard API can fail on some setups — fall back to a prompt
      window.prompt('Copy the report below:', text);
    }
  }

  function renderEodView() {
    var content = document.getElementById('content');
    if (state.eodData === null && !state.eodLoading) loadEod();
    var d = state.eodData;
    var dateVal = state.eodDate || (d && d.date) || '';

    var toolbar = '<div class="eod-toolbar">'
      + '<button class="btn-fathom-secondary" type="button" onclick="eodShiftDay(-1)">← Prev day</button>'
      + '<input type="date" value="' + escapeHtml(dateVal) + '" onchange="eodSetDate(this.value)">'
      + '<button class="btn-fathom-secondary" type="button" onclick="eodShiftDay(1)">Next day →</button>'
      + '<button class="btn-fathom-secondary" type="button" onclick="eodToday()">Today</button>'
      + '<button class="btn-fathom-secondary" type="button" onclick="eodCopyForSlack()">📋 Copy for Slack</button>'
      + '<span class="eod-copy-note" id="eodCopyNote"></span>'
      + '</div>';

    var body;
    if (!d) body = '<div class="skeleton" style="height:120px;"></div>';
    else if (d._error) body = '<div class="error">Could not load EOD report: ' + escapeHtml(d._error) + '</div>';
    else if (!d.calls || d.calls.length === 0) {
      // FD-3 (Option A): a never-synced user (no recording source connected → no
      // calls at all) gets a "no calls yet" state + connect CTA. The "pick another
      // day" copy is only right for users who DO have calls, just not on this date.
      if (!anySourceConnected()) {
        body = '<div class="empty"><h3>No calls yet</h3>'
          + '<p>Connect a recording source (Zoom or Fathom) to start syncing calls — your daily report fills in automatically once they come in.</p>'
          + connectSourceCtaHtml() + '</div>';
      } else {
        body = '<div class="empty"><h3>No calls on ' + escapeHtml(d.date || '') + '</h3><p>Days without calls have nothing to report — pick another day above.</p></div>';
      }
    } else {
      body = d.calls.map(function (c) {
        var f = c.fields, e = c.edited || {};
        function row(label, field, value, isArea) {
          var cls = (isArea ? 'eod-textarea' : 'eod-input') + (e[field] ? ' edited' : '');
          var dot = e[field] ? ' <span class="eod-edited-dot">● edited</span>' : '';
          var handler = ' onchange="eodSaveField(\'' + c.call_id + '\', \'' + field + '\', this)"';
          var inner = isArea
            ? '<textarea class="' + cls + '"' + handler + '>' + escapeHtml(value == null ? '' : String(value)) + '</textarea>'
            : '<input type="text" class="' + cls + '" value="' + escapeHtml(value == null ? '' : String(value)) + '"' + handler + '>';
          return '<div class="eod-row"><div class="eod-label">' + label + dot + '</div>' + inner + '</div>';
        }
        var link = c.recording_url
          ? '<a class="review-fathom-link" href="' + escapeHtml(c.recording_url) + '" target="_blank" rel="noopener">View in Fathom →</a>'
          : '<span class="meta">no recording link</span>';
        var pendingNote = (c.analysis_status && c.analysis_status !== 'done')
          ? '<span class="meta"> · analysis ' + escapeHtml(c.analysis_status) + ' — prefills may update</span>' : '';
        return '<div class="eod-call">'
          + '<div class="eod-row"><div class="eod-label">Call</div><div>' + link + pendingNote + '</div></div>'
          + row('Prospect', 'prospect_name', f.prospect_name)
          // Outcome is READ-ONLY here now (Thread 1): it's the canonical call tag
          // (set on the Calls page / call review), composed with payment structure.
          + '<div class="eod-row"><div class="eod-label">Outcome</div><div class="eod-input" style="opacity:0.8;cursor:default;">' + escapeHtml(f.outcome == null ? '—' : String(f.outcome)) + '</div></div>'
          + row('Cash ($)', 'cash_collected', f.cash_collected)
          + row('Summary', 'summary', f.summary, true)
          + '</div>';
      }).join('');
    }

    content.innerHTML = '<div class="section fade-in">'
      + '<div class="section-header"><h2>EOD Report</h2>'
      + '<div class="meta">your calls for the day — edit inline, then copy for Slack</div></div>'
      + toolbar + body + '</div>';
  }

  // ═══ Knowledge Base view (relocated from admin.html — same ids, same JS) ═══
  // KB access: manager, owner, or an UNMANAGED plain user. Single source of
  // truth for the nav link + the #kb hash guard. (Server enforces it too.)
  // FD-4: everyone with a role can VIEW the KB. Managed reps see their team's KB
  // read-only (what their calls are graded against); everyone else also manages it.
  function canAccessKb() {
    return !!(state.me && (state.me.role === 'manager' || state.me.role === 'owner' || state.me.role === 'user'));
  }
  // Write access (add/delete): managers, owners, and UNMANAGED users only. Managed
  // reps are read-only — the backend enforces this too (/kb/upload + /kb/delete 403).
  function kbCanManage() {
    return !!(state.me && (state.me.role === 'manager' || state.me.role === 'owner'
      || (state.me.role === 'user' && !state.me.is_managed)));
  }
  // Promotion is narrower than management: an UNMANAGED plain user can manage
  // their own KB (kbCanManage) but has no team, so they can't promote into one.
  // Mirrors resolvePromotion's role gate in routes/kb.js.
  function kbCanPromote() {
    return !!(state.me && (state.me.role === 'manager' || state.me.role === 'owner'));
  }
  function goKb() { setView('kb'); }
  var relativeTime = (typeof formatRelativeTime === 'function') ? formatRelativeTime : function (x) { return x; };

  // ── PROSPECT MERGE REVIEW (3d-2) ────────────────────────────────────────
  // Close rate is closed prospects / total prospects, so an unmerged duplicate
  // moves the headline number. But a WRONG merge fuses two people and is
  // invisible in the aggregate — so this surface PROPOSES and a human decides.
  // Live proof it is needed: the title generator proposed "Mark-Anthony ~ Forb"
  // on a shared booked title, and that call's own summary said Forb "got routed
  // into the wrong Zoom meeting".
  function goProspects() { setView('prospects'); }

  async function loadMergeCandidates() {
    state.mergeLoading = true;
    try {
      var res = await fetch('/me/prospects/merge-candidates', { headers: authHeader() });
      if (res.status === 401) { clearSession(); window.location.replace('/login'); return; }
      var data = await res.json();
      state.mergeCandidates = (data && data.candidates) || [];
    } catch (err) { state.mergeCandidates = []; }
    state.mergeLoading = false;
    if (state.view === 'prospects') renderProspectsView();
  }

  var MERGE_REASON_LABEL = {
    name:  'names overlap',
    first: 'same first name',
    inits: 'initials match',
    title: 'same booked meeting title',
  };

  // The evidence a human needs to judge "are these one person?". name_source and
  // name_confidence are stored by 3a and surfaced HERE for the first time — a
  // title-sourced name is the BOOKED name and much weaker evidence than a
  // grader-sourced one.
  function mergeCallRowHtml(c) {
    var src = c.name_source ? '<span class="merge-src ' + escapeHtml(c.name_source) + '">' + escapeHtml(c.name_source) + '</span>' : '';
    var conf = c.name_confidence ? '<span class="merge-conf ' + escapeHtml(c.name_confidence) + '">' + escapeHtml(c.name_confidence) + '</span>' : '';
    return '<div class="merge-call">'
      + '<div class="merge-call-top">'
        + '<span class="merge-date">' + escapeHtml(formatDate(c.call_date)) + '</span>'
        + '<span class="merge-outcome ' + escapeHtml(c.outcome || 'none') + '">' + escapeHtml(c.outcome || 'no outcome') + '</span>'
        + src + conf
      + '</div>'
      + '<div class="merge-title">' + escapeHtml(c.title || 'untitled') + '</div>'
      + (c.prose_opening ? '<div class="merge-prose">' + escapeHtml(c.prose_opening) + '…</div>' : '')
    + '</div>';
  }

  function mergeSideHtml(p) {
    return '<div class="merge-side">'
      + '<div class="merge-name">' + escapeHtml(p.display_name) + '</div>'
      + '<div class="merge-callcount">' + p.calls.length + ' call' + (p.calls.length === 1 ? '' : 's') + '</div>'
      + p.calls.map(mergeCallRowHtml).join('')
    + '</div>';
  }

  function mergeCandidateHtml(c, i) {
    // State the rate consequence up front. It is NOT always positive: merging two
    // CLOSED prospects drops the numerator too, so the rate can fall.
    var d = c.rate_impact || {};
    var impact = (d.closed_delta === 0)
      ? 'closed unchanged, prospects −1 → rate rises slightly'
      : 'closed −1, prospects −1 → rate falls slightly';
    return '<div class="merge-card">'
      + '<div class="merge-head">'
        + '<span class="merge-reason">' + escapeHtml(MERGE_REASON_LABEL[c.reason] || c.reason) + '</span>'
        + '<span class="merge-impact">' + escapeHtml(impact) + '</span>'
      + '</div>'
      + '<div class="merge-body">' + mergeSideHtml(c.a) + '<div class="merge-vs">same person?</div>' + mergeSideHtml(c.b) + '</div>'
      + '<div class="merge-actions">'
        + '<button class="merge-btn keep" onclick="dismissMerge(' + i + ')">Not the same</button>'
        + '<button class="merge-btn do" onclick="applyMerge(\'' + escapeHtml(c.a.id) + '\',\'' + escapeHtml(c.b.id) + '\',' + i + ')">Merge into &ldquo;' + escapeHtml(c.b.display_name) + '&rdquo;</button>'
        + '<button class="merge-btn do" onclick="applyMerge(\'' + escapeHtml(c.b.id) + '\',\'' + escapeHtml(c.a.id) + '\',' + i + ')">Merge into &ldquo;' + escapeHtml(c.a.display_name) + '&rdquo;</button>'
      + '</div>'
    + '</div>';
  }

  function renderProspectsView() {
    var content = document.getElementById('content');
    if (!content) return;
    var cands = state.mergeCandidates || [];
    var body;
    if (state.mergeLoading) body = '<div class="empty-card"><p>Loading…</p></div>';
    else if (!cands.length) {
      body = '<div class="empty-card"><h2>No merge suggestions</h2>'
        + '<p>Every prospect looks distinct. Suggestions appear when two prospects share a name, initials, or the same booked meeting title.</p></div>';
    } else {
      body = '<div class="merge-list">' + cands.map(mergeCandidateHtml).join('') + '</div>';
    }
    content.innerHTML = '<div class="page-header"><div><h1>Prospects</h1>'
      + '<p class="page-sub">Merge suggestions — a prospect counted twice makes your close rate read low. Nothing merges without your confirmation, and every merge can be undone.</p></div></div>'
      + body;
  }

  function dismissMerge(i) {
    // Dismiss is view-only: the proposal is regenerated next load. Persisting
    // "not the same" is a separate decision — a stored rejection list would need
    // its own table and its own undo.
    (state.mergeCandidates || []).splice(i, 1);
    renderProspectsView();
  }

  async function applyMerge(fromId, intoId, i) {
    if (!window.confirm('Merge these two into one prospect?\n\nThis changes your close rate. It can be undone.')) return;
    var res;
    try {
      res = await fetch('/me/prospects/merge', {
        method: 'POST',
        headers: Object.assign({ 'Content-Type': 'application/json' }, authHeader()),
        body: JSON.stringify({ from_id: fromId, into_id: intoId }),
      });
    } catch (err) { window.alert('Could not reach server: ' + err.message); return; }
    if (res.status === 401) { clearSession(); window.location.replace('/login'); return; }
    if (!res.ok) {
      var e; try { e = await res.json(); } catch (x) { e = { error: 'HTTP ' + res.status }; }
      window.alert('Merge failed: ' + (e.error || 'unknown'));
      return;
    }
    await loadMergeCandidates();
  }

  function renderKbView() {
    var content = document.getElementById('content');
    var canManage = kbCanManage();
    var sub = canManage
      ? 'Offer docs &amp; scripts that ground coaching'
      : 'Your team’s offer docs &amp; scripts — what Scout grades your calls against (view only)';
    var addBtn = canManage ? '<div class="page-header-side"><button class="kb-add-btn" onclick="openKbModal()">+ Add resource</button></div>' : '';
    content.innerHTML =
      '<div class="page-header fade-in"><div class="page-header-main"><h1>Knowledge Base</h1>'
        + '<div class="review-meta-row"><span>' + sub + '</span></div></div>'
        + addBtn
      + '</div>'
      + '<div class="section fade-in"><div id="kbContainer"><div class="load-spinner"><div class="spinner"></div></div></div></div>';
    loadKbList(); // lazy — only on view entry, never on page init
  }
  async function loadKbList() {
    var container = document.getElementById('kbContainer');
    if (!container) return;
    var res;
    try {
      res = await fetch('/kb/list', { headers: authHeader() });
    } catch (err) {
      container.innerHTML = '<div class="msg-error">Could not reach server.</div>';
      return;
    }
    if (res.status === 401) { clearSession(); window.location.replace('/login'); return; }
    if (!res.ok) {
      var err;
      try { err = await res.json(); } catch (e) { err = { error: 'HTTP ' + res.status }; }
      container.innerHTML = '<div class="msg-error">' + escapeHtml(err.error || 'Failed to load uploads') + '</div>';
      return;
    }
    var data = await res.json();
    renderKbList((data && data.uploads) || []);
  }

  // PROSPECT NAMES 3a — what to LABEL a call with. Prefers the resolved prospect
  // name (call_analyses.prospect_name); falls back to the raw meeting title only
  // when no name was resolved. A null resolution renders "Unknown prospect"
  // rather than a meeting label — a wrong name is worse than no name.
  function callLabel(c) {
    var n = c && c.prospect_name;
    if (n && String(n).trim()) return String(n).trim();
    return null;
  }

  // PROSPECT NAMES 3d-3 — THE single close-rate display. Every site that shows a
  // close rate routes through this, so the coaching tile, the team glance box and
  // the team score list cannot drift into different definitions (which is exactly
  // what "closed / (closed + lost) — decided calls only" had become, in three
  // places, before this).
  //
  // Definition: closed PROSPECTS / TOTAL prospects. A prospect who takes three
  // calls to close counts ONCE; an open prospect counts as not-closed. Raw counts
  // always travel with the percentage, per the house rule.
  function closeRateDisplay(o) {
    var src = o || {};
    var pct = src.prospect_close_rate;
    var won = src.prospect_close_wins;
    var tot = src.prospect_close_total;
    if (pct == null || !tot) return { value: '\u2014', sub: 'no prospects yet' };
    return { value: pct + '%', sub: won + ' of ' + tot + ' prospects' };
  }


  // ── SECTION DRILLDOWN (stage 4a/4b) ─────────────────────────────────────
  // Clicking a Coach-summary bar shows the MOMENTS over the period that earned
  // that score, plus how to improve — drawn from calls that went well.
  //
  // Close reads close_score_earned (migration 027 forces the displayed score to
  // 100 on closed calls). The discrepancy is LABELLED rather than hidden.
  var SECTION_LABEL = { intro: 'Intro', discovery: 'Discovery', pitch: 'Pitch', objection: 'Objection', close: 'Close' };

  function goSection(key) {
    state.selectedSection = key;
    state.sectionData = null;
    setView('section');
    loadSectionBreakdown(key);
  }
  function backFromSection() { state.selectedSection = null; state.sectionData = null; setView('overview'); }

  async function loadSectionBreakdown(key) {
    state.sectionLoading = true;
    var qp = 'from=' + encodeURIComponent(state.dateRange.from) + '&to=' + encodeURIComponent(state.dateRange.to);
    // Manager pivot (ruling 3) — same ?user= convention as every other coaching
    // surface, routed through the standard /admin mirror.
    var url = state.viewingUserId
      ? '/admin/sections/' + encodeURIComponent(state.viewingUserId) + '/' + encodeURIComponent(key) + '?' + qp
      : '/me/sections/' + encodeURIComponent(key) + '?' + qp;
    try {
      var res = await fetch(url, { headers: authHeader() });
      if (res.status === 401) { clearSession(); window.location.replace('/login'); return; }
      state.sectionData = res.ok ? await res.json() : null;
    } catch (err) { state.sectionData = null; }
    state.sectionLoading = false;
    if (state.view === 'section') renderSectionView();
  }

  function sectionMomentHtml(m, canSave) {
    var when = m.call_date ? formatDate(m.call_date) : '';
    var who = m.prospect_name ? escapeHtml(m.prospect_name) : 'Unknown prospect';
    var time = (m.clip_url && typeof m.timestamp_seconds === 'number')
      ? '<a class="sec-clip" href="' + escapeHtml(m.clip_url) + '" target="_blank" rel="noopener">' + escapeHtml(formatTimestampDisplay(m.timestamp_seconds)) + '</a>'
      : '<span class="sec-clip disabled">—</span>';
    // 4b: harvested moments carry a "saved" badge; unsaved rows get the
    // Add-to-KB button, reusing POST /kb/from-highlight unchanged (it takes ids
    // and re-reads the row server-side).
    var kb = m.saved_to_kb
      ? '<span class="sec-saved">saved</span>'
      : (canSave && m.highlight_id
          ? '<button class="sec-kb-btn" data-hid="' + escapeHtml(String(m.highlight_id)) + '" data-cid="' + escapeHtml(String(m.fathom_call_id)) + '" onclick="addSectionMomentToKb(this)">+ Save</button>'
          : '');
    return '<div class="sec-moment">'
      + '<div class="sec-moment-top">' + time + '<span class="sec-who">' + who + '</span><span class="sec-when">' + escapeHtml(when) + '</span>' + kb + '</div>'
      + '<div class="sec-quote">' + escapeHtml(m.quote || '') + '</div>'
      + (m.observation ? '<div class="sec-obs">' + escapeHtml(m.observation) + '</div>' : '')
    + '</div>';
  }

  function sectionHistogramHtml(h, usesEarned) {
    var max = Math.max.apply(null, h.map(function (b) { return b.count; }).concat([1]));
    var bars = h.map(function (b) {
      var pct = Math.round((b.count / max) * 100);
      return '<div class="sec-hbar"><div class="sec-hbar-fill" style="height:' + pct + '%"></div>'
        + '<div class="sec-hbar-n">' + b.count + '</div><div class="sec-hbar-l">' + escapeHtml(b.label) + '</div></div>';
    }).join('');
    // Ruling 1: state the close discrepancy plainly rather than hide it.
    var note = usesEarned
      ? '<div class="sec-note">Uses the score this section actually earned. Closed calls display 100 for Close elsewhere on the dashboard.</div>'
      : '';
    return '<div class="sec-hist">' + bars + '</div>' + note;
  }

  function renderSectionView() {
    var content = document.getElementById('content');
    if (!content) return;
    var key = state.selectedSection;
    var label = SECTION_LABEL[key] || key;
    var head = '<div class="page-header"><div>'
      + '<a class="sec-back" onclick="backFromSection(); return false;">&larr; Back to coaching</a>'
      + '<h1>' + escapeHtml(label) + '</h1></div></div>';

    if (state.sectionLoading) { content.innerHTML = head + '<div class="empty-card"><p>Loading…</p></div>'; return; }
    var d = state.sectionData;
    if (!d) { content.innerHTML = head + '<div class="empty-card"><h2>Could not load this section</h2></div>'; return; }

    var delta = '';
    if (typeof d.average === 'number' && typeof d.prior_average === 'number' && d.prior_average > 0) {
      var diff = d.average - d.prior_average;
      var cls = diff > 0 ? 'up' : (diff < 0 ? 'down' : '');
      delta = '<span class="sec-delta ' + cls + '">' + (diff > 0 ? '▲ +' : (diff < 0 ? '▼ ' : '')) + diff + ' vs previous period</span>';
    }
    var headline = '<div class="sec-headline">'
      + '<div class="sec-avg">' + (d.average == null ? '—' : d.average) + '</div>'
      + '<div class="sec-meta"><div>average across ' + d.scored_calls + ' call' + (d.scored_calls === 1 ? '' : 's') + '</div>'
      + '<div>' + (d.rank ? 'ranked ' + d.rank + ' of ' + d.section_count + ' sections' : 'not ranked') + '</div>' + delta + '</div>'
    + '</div>';

    // Coverage honesty — objection reads thin, and that is information.
    var cov = d.coverage || {};
    var coverage = '<div class="sec-coverage">' + cov.moments + ' moment' + (cov.moments === 1 ? '' : 's')
      + ' from ' + cov.calls_with_moments + ' of your ' + cov.calls_total + ' calls'
      + (d.bad_outnumber_good ? ' · <strong class="sec-warn">more went wrong than right in this section</strong>' : '')
    + '</div>';

    var canSave = !state.viewingUserId; // saving into someone else's KB is not this screen's job
    var groups = '';
    if (d.good.length) {
      groups += '<div class="sec-group"><h2>What worked <span class="sec-count">' + d.good.length + '</span></h2>'
        + d.good.map(function (m) { return sectionMomentHtml(m, canSave); }).join('') + '</div>';
    }
    if (d.bad.length) {
      groups += '<div class="sec-group"><h2>What to fix <span class="sec-count">' + d.bad.length + '</span></h2>'
        + d.bad.map(function (m) { return sectionMomentHtml(m, canSave); }).join('') + '</div>';
    }
    if (!d.good.length && !d.bad.length) {
      groups = '<div class="empty-card"><h2>No tagged moments for ' + escapeHtml(label) + ' in this range</h2>'
        + '<p>Section moments come from calls analysed recently. Widen the date range or analyse more calls.</p></div>';
    }

    // Ruling 2: notes are two labelled EXAMPLES, never an aggregate.
    var ex = d.examples || {};
    var examples = '';
    if (ex.best || ex.worst) {
      examples = '<div class="sec-group"><h2>Two calls, for contrast</h2>'
        + (ex.best ? '<div class="sec-example"><div class="sec-ex-head">Best ' + escapeHtml(label) + ' — ' + (ex.best.score) + (ex.best.prospect_name ? ' · ' + escapeHtml(ex.best.prospect_name) : '') + '</div><div class="sec-obs">' + escapeHtml(ex.best.notes || '') + '</div></div>' : '')
        + (ex.worst ? '<div class="sec-example"><div class="sec-ex-head">Weakest ' + escapeHtml(label) + ' — ' + (ex.worst.score) + (ex.worst.prospect_name ? ' · ' + escapeHtml(ex.worst.prospect_name) : '') + '</div><div class="sec-obs">' + escapeHtml(ex.worst.notes || '') + '</div></div>' : '')
      + '</div>';
    }

    content.innerHTML = head + headline + coverage
      + sectionHistogramHtml(d.histogram || [], d.uses_earned_close_score) + groups + examples;
  }

  async function addSectionMomentToKb(btn) {
    var hid = btn.getAttribute('data-hid'), cid = btn.getAttribute('data-cid');
    if (!hid || !cid) return;
    btn.disabled = true; btn.textContent = 'Saving…';
    var res;
    try {
      res = await fetch('/kb/from-highlight', {
        method: 'POST',
        headers: Object.assign({ 'Content-Type': 'application/json' }, authHeader()),
        body: JSON.stringify({ fathom_call_id: cid, highlight_id: hid }),
      });
    } catch (err) { btn.disabled = false; btn.textContent = '+ Save'; window.alert('Could not reach server: ' + err.message); return; }
    if (res.status === 401) { clearSession(); window.location.replace('/login'); return; }
    if (!res.ok) { btn.disabled = false; btn.textContent = '+ Save'; window.alert('Could not save that moment'); return; }
    btn.outerHTML = '<span class="sec-saved">saved</span>';
  }

  function renderKbList(items) {
    var container = document.getElementById('kbContainer');
    if (!container) return;
    var canManage = kbCanManage();

    if (!items || items.length === 0) {
      container.innerHTML = canManage
        ? '<div class="empty-card">'
            + '<h2>No knowledge base resources yet</h2>'
            + '<p>Upload your offer docs, scripts, and winning calls. Scout grounds its post-call grading and coaching in these — the more it has, the sharper your feedback.</p>'
            + '<button class="kb-add-btn" onclick="openKbModal()">+ Add your first resource</button>'
          + '</div>'
        : '<div class="empty-card">'
            + '<h2>No team resources yet</h2>'
            + '<p>Your team’s offer docs, scripts, and winning calls will appear here once your manager adds them — they’re what Scout grades your calls against.</p>'
          + '</div>';
      return;
    }

    var parts = ['<div class="kb-list">'];
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      var typeBadge = it.source_type
        ? '<span class="kb-badge kb-type-' + escapeHtml(it.source_type) + '">' + escapeHtml(it.source_type) + '</span>'
        : '';
      // Category badge — only when category is set (pre-feature uploads
      // don't have it). Friendly labels rather than the raw enum value.
      var catLabels = {
        script: 'Script',
        offer_document: 'Offer info',
        objection_framework: 'Objection handling framework',
        winning_call: 'Winning call transcript',
        case_study: 'Case study / social proof',
        training_material: 'Training material',
        // Part 2b: moments harvested from call reviews. Deliberately NOT a
        // grader/synthesis category (ruling 1) — see lib/kb-entry.js.
        call_moment: 'Call moment',
      };
      var catBadge = (it.category && catLabels[it.category])
        ? '<span class="kb-badge kb-cat-' + escapeHtml(it.category) + '">' + escapeHtml(catLabels[it.category]) + '</span>'
        : '';
      // Scope badge stays on admin: admins see uploads with mixed scopes
      // (own personal/team plus their team members') so the badge tells
      // them which is which. Dashboard hides it because users only ever
      // see their own personal uploads.
      var scopeBadge = it.scope
        ? '<span class="kb-badge kb-scope-' + escapeHtml(it.scope) + '">' + escapeHtml(it.scope) + '</span>'
        : '';
      var chunkText = it.chunk_count + ' chunk' + (it.chunk_count === 1 ? '' : 's');
      var rel = relativeTime(it.created_at);
      // Only learned_pattern uploads get the expand affordance — other
      // categories are bulk text whose chunks aren't independently useful
      // to surface in a side panel.
      var viewBtn = '';
      var expandPanel = '';
      if (it.category === 'learned_pattern' || it.category === 'call_moment') {
        viewBtn = '<button class="kb-view-btn" data-label="' + escapeHtml(it.source_label) + '" data-slot="' + i + '" onclick="viewKbEntries(this.getAttribute(\'data-label\'), this.getAttribute(\'data-slot\'), this)">View patterns</button>';
        expandPanel = '<div class="kb-expand-panel hidden" id="kbExpand-' + i + '"></div>';
      }
      // Promotion affordance (KB Part 2, sub-stage 2a). Manager/owner only — a
      // plain unmanaged user has no team to promote INTO, so showing them the
      // button would only produce a 400. Global (owner-wide) resources are not
      // re-scopable through this route, so they get no button either.
      var promoteBtn = '';
      if (kbCanPromote() && it.scope !== 'global') {
        promoteBtn = (it.scope === 'team')
          ? '<button class="kb-promote-btn is-team" data-label="' + escapeHtml(it.source_label) + '" onclick="setKbScope(this.getAttribute(\'data-label\'), \'personal\')" title="Remove from the team knowledge base">Team ✓</button>'
          : '<button class="kb-promote-btn" data-label="' + escapeHtml(it.source_label) + '" onclick="setKbScope(this.getAttribute(\'data-label\'), \'team\')" title="Share with your whole team">Promote to team</button>';
      }
      parts.push(
        '<div class="kb-item">'
          + '<div class="kb-item-main">'
            + '<div class="kb-item-title">' + typeBadge + catBadge + scopeBadge + escapeHtml(it.source_label || '(unlabeled)') + '</div>'
            + '<div class="kb-item-sub">' + chunkText + ' · added ' + rel + '</div>'
          + '</div>'
          + viewBtn
          + promoteBtn
          + (canManage ? '<button class="kb-delete-btn" data-label="' + escapeHtml(it.source_label) + '" onclick="deleteKbItem(this.getAttribute(\'data-label\'))">Delete</button>' : '')
        + '</div>'
        + expandPanel
      );
    }
    parts.push('</div>');
    container.innerHTML = parts.join('');
  }

  // Promote a resource into the team KB, or pull it back to personal.
  // PATCH /kb/:source_label/scope. Provenance (who uploaded it) is never
  // rewritten server-side — only the team key changes.
  async function setKbScope(sourceLabel, targetScope) {
    if (!sourceLabel || (targetScope !== 'team' && targetScope !== 'personal')) return;
    var msg = (targetScope === 'team')
      ? 'Promote "' + sourceLabel + '" to the team knowledge base?\n\nEveryone on your team will be able to see it, and Scout will ground their coaching in it.'
      : 'Remove "' + sourceLabel + '" from the team knowledge base?\n\nIt goes back to being personal to whoever uploaded it. Nothing is deleted.';
    if (!window.confirm(msg)) return;

    var res;
    try {
      res = await fetch('/kb/' + encodeURIComponent(sourceLabel) + '/scope', {
        method: 'PATCH',
        headers: Object.assign({ 'Content-Type': 'application/json' }, authHeader()),
        body: JSON.stringify({ scope: targetScope }),
      });
    } catch (err) {
      window.alert('Could not reach server: ' + err.message);
      return;
    }
    if (res.status === 401) { clearSession(); window.location.replace('/login'); return; }
    if (!res.ok) {
      var err2;
      try { err2 = await res.json(); } catch (e) { err2 = { error: 'HTTP ' + res.status }; }
      window.alert('Could not change scope: ' + (err2.error || 'unknown error'));
      return;
    }
    await loadKbList();
  }

  async function deleteKbItem(sourceLabel) {
    if (!sourceLabel) return;
    var ok = window.confirm('Delete "' + sourceLabel + '"?\n\nThis removes all chunks for this resource. Cannot be undone.');
    if (!ok) return;

    var res;
    try {
      res = await fetch('/kb/' + encodeURIComponent(sourceLabel), {
        method: 'DELETE',
        headers: authHeader(),
      });
    } catch (err) {
      window.alert('Could not reach server: ' + err.message);
      return;
    }
    if (res.status === 401) { clearSession(); window.location.replace('/login'); return; }
    if (!res.ok) {
      var err;
      try { err = await res.json(); } catch (e) { err = { error: 'HTTP ' + res.status }; }
      window.alert('Delete failed: ' + (err.error || 'unknown error'));
      return;
    }
    await loadKbList();
  }

  function openKbModal() {
    var modal = document.getElementById('kbModal');
    if (!modal) return;
    // Reset form state every time the modal opens — switching to URL tab,
    // clearing inputs, resetting category to default, hiding any leftover
    // error from a previous attempt.
    switchKbTab('url');
    var ids = ['kbLabel','kbUrlInput','kbPdfInput','kbPasteInput'];
    for (var i = 0; i < ids.length; i++) {
      var el = document.getElementById(ids[i]);
      if (el) el.value = '';
    }
    var cat = document.getElementById('kbCategory');
    if (cat) cat.value = 'offer_document';
    setKbStatus('', '');
    var submit = document.getElementById('kbSubmit');
    if (submit) { submit.disabled = false; submit.textContent = 'Add to Knowledge Base'; }
    modal.classList.remove('hidden');
  }

  function closeKbModal() {
    var modal = document.getElementById('kbModal');
    if (modal) modal.classList.add('hidden');
  }

  function switchKbTab(tab) {
    var tabs = document.querySelectorAll('#kbModal .kb-tab');
    for (var i = 0; i < tabs.length; i++) {
      var t = tabs[i];
      if (t.getAttribute('data-tab') === tab) t.classList.add('active');
      else t.classList.remove('active');
    }
    var panels = document.querySelectorAll('#kbModal .kb-tab-panel');
    for (var j = 0; j < panels.length; j++) {
      var p = panels[j];
      if (p.getAttribute('data-panel') === tab) p.classList.remove('hidden');
      else p.classList.add('hidden');
    }
    setKbStatus('', '');
  }

  function setKbStatus(message, kind) {
    var el = document.getElementById('kbStatus');
    if (!el) return;
    el.textContent = message || '';
    el.classList.remove('error', 'progress');
    if (kind === 'error') el.classList.add('error');
    else if (kind === 'progress') el.classList.add('progress');
  }

  function getActiveKbTab() {
    var active = document.querySelector('#kbModal .kb-tab.active');
    return active ? active.getAttribute('data-tab') : 'url';
  }

  async function submitKbUpload() {
    var tab = getActiveKbTab();
    var label = (document.getElementById('kbLabel').value || '').trim();
    var category = (document.getElementById('kbCategory').value || 'offer_document');

    // Label is required for every type now — it's what shows in the list
    // and what Claude references in [WINNING CALL: …] / [OFFER DOCUMENT: …]
    // context lines, so a meaningful name matters more than the source.
    if (!label) { setKbStatus('Give this resource a label.', 'error'); return; }

    var fd = new FormData();
    fd.append('type', tab);
    fd.append('label', label);
    fd.append('category', category);

    if (tab === 'url') {
      var url = (document.getElementById('kbUrlInput').value || '').trim();
      if (!url) { setKbStatus('Enter a URL.', 'error'); return; }
      fd.append('url', url);
    } else if (tab === 'pdf') {
      var fileEl = document.getElementById('kbPdfInput');
      if (!fileEl || !fileEl.files || !fileEl.files[0]) { setKbStatus('Select a PDF file.', 'error'); return; }
      fd.append('file', fileEl.files[0]);
    } else if (tab === 'paste') {
      var text = (document.getElementById('kbPasteInput').value || '').trim();
      if (!text) { setKbStatus('Paste some content.', 'error'); return; }
      fd.append('text', text);
    } else {
      setKbStatus('Pick a tab.', 'error');
      return;
    }

    var submit = document.getElementById('kbSubmit');
    if (submit) { submit.disabled = true; submit.textContent = 'Processing…'; }
    setKbStatus('Processing… this may take a moment for large documents.', 'progress');

    var res;
    try {
      res = await fetch('/kb/upload', {
        method: 'POST',
        headers: authHeader(),
        body: fd,
      });
    } catch (err) {
      setKbStatus('Could not reach server: ' + err.message, 'error');
      if (submit) { submit.disabled = false; submit.textContent = 'Add to Knowledge Base'; }
      return;
    }

    if (res.status === 401) { clearSession(); window.location.replace('/login'); return; }
    if (!res.ok) {
      var errData;
      try { errData = await res.json(); } catch (e) { errData = { error: 'HTTP ' + res.status }; }
      setKbStatus(errData.error || 'Upload failed', 'error');
      if (submit) { submit.disabled = false; submit.textContent = 'Add to Knowledge Base'; }
      return;
    }

    closeKbModal();
    await loadKbList();
  }

  // Per-source-label cache so reopening a panel after first load doesn't
  // refetch. Cleared implicitly on full page reload — short-lived enough
  // that staleness from a delete-then-reopen is impossible (delete already
  // forces loadKbList(), which doesn't touch this cache, but the panel
  // wouldn't re-render anyway because the kb-item is gone).
  var kbEntriesCache = {};

  async function viewKbEntries(sourceLabel, slot, btn) {
    var panel = document.getElementById('kbExpand-' + slot);
    if (!panel) return;

    // Toggle: if currently visible, just collapse. No fetch, button text reverts.
    if (!panel.classList.contains('hidden')) {
      panel.classList.add('hidden');
      btn.textContent = 'View patterns';
      return;
    }

    // Opening
    btn.textContent = 'Hide patterns';
    panel.classList.remove('hidden');

    if (kbEntriesCache[sourceLabel]) {
      renderKbEntries(panel, kbEntriesCache[sourceLabel]);
      return;
    }

    panel.innerHTML = '<div class="kb-pattern-loading">Loading…</div>';
    var res;
    try {
      res = await fetch('/kb/entries/' + encodeURIComponent(sourceLabel), { headers: authHeader() });
    } catch (err) {
      panel.innerHTML = '<div class="kb-pattern-empty">Could not reach server.</div>';
      return;
    }
    if (res.status === 401) { clearSession(); window.location.replace('/login'); return; }
    if (!res.ok) {
      panel.innerHTML = '<div class="kb-pattern-empty">Failed to load patterns.</div>';
      return;
    }
    var data = await res.json();
    var entries = (data && data.entries) || [];
    kbEntriesCache[sourceLabel] = entries;
    renderKbEntries(panel, entries);
  }

  function renderKbEntries(panel, entries) {
    if (!entries || entries.length === 0) {
      panel.innerHTML = '<div class="kb-pattern-empty">No patterns found.</div>';
      return;
    }
    var parts = [];
    for (var i = 0; i < entries.length; i++) {
      var e = entries[i];
      var meta = e.metadata || {};
      // Pattern entries (auto-extracted) carry situation/response/outcome
      // in metadata. Pre-feature uploads or any entry missing those fields
      // fall back to showing raw content text — keeps the panel useful
      // even on legacy data.
      if (meta.situation || meta.response || meta.outcome) {
        var typeRaw = String(meta.type || '');
        var typeLabel = typeRaw.replace(/_/g, ' ');
        var typeClass = typeRaw.replace(/[^a-z_]/g, '');
        var typeBadge = typeClass
          ? '<span class="kb-badge kb-ptype-' + typeClass + '">' + escapeHtml(typeLabel) + '</span>'
          : '';
        parts.push(
          '<div class="kb-pattern-card">'
            + (typeBadge ? '<div>' + typeBadge + '</div>' : '')
            + (meta.situation ? '<div class="kb-pattern-row"><b>Situation:</b> <span class="kb-pattern-text">' + escapeHtml(meta.situation) + '</span></div>' : '')
            + (meta.response  ? '<div class="kb-pattern-row"><b>Closer said:</b> <span class="kb-pattern-text">' + escapeHtml(meta.response) + '</span></div>' : '')
            + (meta.outcome   ? '<div class="kb-pattern-row"><b>Prospect reacted:</b> <span class="kb-pattern-text">' + escapeHtml(meta.outcome) + '</span></div>' : '')
          + '</div>'
        );
      } else {
        parts.push('<div class="kb-pattern-card"><div class="kb-pattern-empty-text">' + escapeHtml(e.content || '(empty)') + '</div></div>');
      }
    }
    panel.innerHTML = parts.join('');
  }

  function setView(view) {
    if (view === 'prospects' && !state.mergeLoading) loadMergeCandidates();
    state.view = view;
    render();
    syncHashFromState();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }


  function backToOverview() { state.view = 'overview'; render(); }


  // ──────────────────────────────────────────────────────────────────
  // Helpers
  // ──────────────────────────────────────────────────────────────────
  function formatDate(iso) {
    if (!iso) return '—';
    var d = new Date(iso);
    var month = d.toLocaleDateString('en-US', { month: 'short' });
    var day = d.getDate();
    var year = d.getFullYear();
    var today = new Date().getFullYear();
    return year === today ? month + ' ' + day : month + ' ' + day + ', ' + year;
  }

  // ──────────────────────────────────────────────────────────────────
  // Call Library (Scout v2.0 Phase 2 Step 3)
  //
  // The Calls nav item opens this top-level view. It shows a paginated
  // list of the caller's synced Fathom calls with each call's analysis
  // state surfaced as a status badge. Clicking a card currently shows a
  // "coming soon" notice via the existing fathomNotice flash; the full
  // call review page is the next step (Phase 2 Step 4) and will replace
  // the click handler with a real navigation.
  // ──────────────────────────────────────────────────────────────────

  // Date formatter for the library cards: always "Jun 23, 2026" form (with
  // year) per the brief, even when the date is in the current calendar
  // year. Differs from formatDate above which omits the year for current.
  function formatNaturalDate(iso) {
    if (!iso) return '—';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '—';
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  }

  // Duration formatter for the library cards: "57m" or "1h 23m" per the
  // brief, no seconds. Null/invalid → "—".
  function formatNaturalDuration(seconds) {
    if (seconds === null || seconds === undefined) return '—';
    if (typeof seconds !== 'number' || isNaN(seconds) || seconds < 0) return '—';
    var hours = Math.floor(seconds / 3600);
    var minutes = Math.floor((seconds % 3600) / 60);
    if (hours > 0) return hours + 'h ' + minutes + 'm';
    return minutes + 'm';
  }

  // "Manager context" — the same gate as the Team view (manager or owner).
  // These users get the Calls rep-selector + a date-range control (default 7d);
  // everyone else sees the Calls view exactly as before.
  function hasManagerContext() { return !!(state.me && (state.me.role === 'manager' || state.me.role === 'owner')); }
  function callLibRangeFor(days) {
    var to = new Date();
    var from = days >= 9999 ? new Date('2025-01-01T00:00:00Z') : new Date(Date.now() - days * 24 * 60 * 60 * 1000);
    return { from: from.toISOString(), to: to.toISOString(), days: days };
  }

  async function fetchCallLibrary(offset, limit) {
    var params = ['limit=' + (limit || 20), 'offset=' + (offset || 0)];
    var drilling = !!(state.callLibraryFilter || state.callLibrarySort);
    if (state.callLibraryFilter) params.push('filter=' + encodeURIComponent(state.callLibraryFilter));
    if (state.callLibrarySort)   params.push('sort=' + encodeURIComponent(state.callLibrarySort));
    // Manager-context: always window by the Calls date control (default 7d),
    //   covering their own calls and any rep they pivot to.
    // Everyone else: unchanged — a drill matches its donut's window; a plain
    //   nav entry (no filter) sends no range and shows all calls.
    var range = null;
    if (hasManagerContext()) { if (!state.callLibraryRange) state.callLibraryRange = callLibRangeFor(7); range = state.callLibraryRange; }
    else if (drilling && state.dateRange) { range = state.dateRange; }
    if (range) {
      params.push('from=' + encodeURIComponent(range.from));
      params.push('to=' + encodeURIComponent(range.to));
    }
    var base = isSelf() ? '/fathom/calls' : '/admin/fathom-calls/' + encodeURIComponent(state.viewingUserId);
    var res = await fetch(base + '?' + params.join('&'), { headers: authHeader() });
    if (res.status === 401) { clearSession(); window.location.replace('/login'); throw new Error('unauth'); }
    if (res.status === 403) throw new Error('Not authorized for that rep');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  }

  // Enter the Call Library from the nav — clears any drill filter (shows all).
  // Manager-context resets the date window to the 7-day default on entry.
  function goCallLibrary() {
    state.callLibraryFilter = null;
    state.callLibrarySort = null;
    state.callLibrary = null;
    state.callLibraryOffset = 0;
    state.callLibraryError = null;
    if (hasManagerContext()) state.callLibraryRange = callLibRangeFor(7);
    setView('call-library');
  }

  // Enter the Call Library from a coaching donut — applies a filter/sort so the
  // drill shows only the relevant calls (matching the donut's date window).
  function drillCalls(filter, sort) {
    state.callLibraryFilter = filter || null;
    state.callLibrarySort = sort || null;
    state.callLibrary = null;
    state.callLibraryOffset = 0;
    state.callLibraryError = null;
    // Manager-context: seed the Calls date control with the donut's window so the
    // header presets reflect (and can adjust) the drill range.
    if (hasManagerContext()) state.callLibraryRange = state.dateRange ? { from: state.dateRange.from, to: state.dateRange.to, days: state.dateRange.days } : callLibRangeFor(7);
    setView('call-library');
  }

  // Calls-view date preset (manager-context only). Re-fetches for the new window.
  function setCallLibraryRange(days) {
    state.callLibraryRange = callLibRangeFor(days);
    state.callLibrary = null;
    state.callLibraryOffset = 0;
    state.callLibraryError = null;
    renderCallLibrary(); // kicks loadCallLibrary(0)
  }

  // Calls-view rep selector (manager-context only). Reuses the ?user= pivot
  // machinery (viewingUserId + isSelf() → /admin/fathom-calls/<id>), but stays on
  // the Calls view instead of jumping to overview like setUser. Writes ?user= so
  // the pivot survives refresh; server enforces the managed_by permission.
  // Picker onchange: the two sentinel options toggle the owner-only "All users"
  // reveal; anything else is a real rep pivot.
  function onCallLibraryPick(value) {
    if (value === '__all__') { state.callLibraryShowAllUsers = true; renderCallLibrary(); return; }
    if (value === '__scoped__') {
      state.callLibraryShowAllUsers = false;
      var me = state.me.user_id;
      var stillScoped = state.viewingUserId === me || (state.users || []).some(function (u) { return u.user_id === state.viewingUserId && u.managed_by === me; });
      if (!stillScoped) { setCallLibraryUser(me); return; } // viewed user left the scoped list → snap to self
      renderCallLibrary();
      return;
    }
    setCallLibraryUser(value);
  }
  function setCallLibraryUser(userId) {
    if (!userId || userId === state.viewingUserId) return;
    var url = new URL(window.location.href);
    if (userId === state.me.user_id) url.searchParams.delete('user'); else url.searchParams.set('user', userId);
    window.history.replaceState({}, '', url.toString());
    state.viewingUserId = userId;
    state.callLibrary = null;
    state.callLibraryOffset = 0;
    state.callLibraryError = null;
    renderCallLibrary(); // kicks loadCallLibrary(0)
  }

  // Fire-and-forget load. When offset=0, replaces state.callLibrary; on
  // pagination (offset>0) it concatenates onto the existing list. Re-
  // renders the view automatically when done if still on call-library.
  async function loadCallLibrary(offset) {
    if (state.callLibraryLoading) return; // guard concurrent clicks
    state.callLibraryLoading = true;
    var requestedLimit = 20;
    var startedOffset = offset || 0;
    try {
      var data = await fetchCallLibrary(startedOffset, requestedLimit);
      var calls = (data && data.calls) || [];
      if (startedOffset === 0) {
        state.callLibrary = calls;
      } else {
        state.callLibrary = (state.callLibrary || []).concat(calls);
      }
      state.callLibraryHasMore = calls.length >= requestedLimit;
      state.callLibraryOffset = startedOffset + calls.length;
      state.callLibraryError = null;
    } catch (err) {
      if (err.message === 'unauth') return;
      state.callLibraryError = err.message || 'unknown';
    }
    state.callLibraryLoading = false;
    if (state.view === 'call-library') renderCallLibrary();
  }

  // ─── Objections view (objection intelligence) ──────────────────────────

    var base = isSelf() ? '/me/objections-intel' : '/admin/objections-intel/' + encodeURIComponent(state.viewingUserId);
    var res = await fetch(base + '?' + qp, { headers: authHeader() });

    if (!res.ok) throw new Error('HTTP ' + res.status);

  async function loadObjectionsIntel() {

  function objStatCard(label, big, small) {

  // Collapse/expand helpers for objection cards (operate on the clicked card).
  function toggleObjResponse(el) {
    var card = el.closest('.pattern-card'); if (!card) return;
    var box = card.querySelector('.obj-response'); if (!box) return;
    var showing = box.style.display === 'block';
    box.style.display = showing ? 'none' : 'block';

  function toggleObjQuote(el) {
    var card = el.closest('.pattern-card'); if (!card) return;

    q.classList.toggle('clamped');
    el.textContent = q.classList.contains('clamped') ? 'more' : 'less';
