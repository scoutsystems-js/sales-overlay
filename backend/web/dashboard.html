      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.12s;
      flex-shrink: 0;
      margin-right: 6px;
    }
    .kb-view-btn:hover { color: var(--text); border-color: rgba(255,255,255,0.2); }

    /* Expand panel — sibling of the kb-item, slightly indented and using
       a deeper bg so the hierarchy reads at a glance. */
    .kb-expand-panel {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 10px;
      margin: -2px 0 0 24px;
      padding: 14px 16px;
    }
    .kb-expand-panel.hidden { display: none; }
    .kb-pattern-loading,
    .kb-pattern-empty { font-size: 12px; color: var(--muted); padding: 8px 0; text-align: center; }
    .kb-pattern-card {
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 8px;
    }
    .kb-pattern-card:last-child { margin-bottom: 0; }
    .kb-pattern-row { font-size: 12px; line-height: 1.5; margin-top: 6px; }
    .kb-pattern-row b { color: var(--muted); display: inline-block; min-width: 130px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px; font-size: 10px; vertical-align: top; }
    .kb-pattern-text { color: var(--text); }
    .kb-pattern-empty-text { font-size: 13px; color: var(--text); white-space: pre-wrap; }
    /* Pattern type badges — distinct from the source-type/category/scope
       badges above so the eye reads them as a separate vocabulary. */
    .kb-badge.kb-ptype-pain_discovery   { color: #fca5a5; border-color: rgba(252,165,165,0.3); background: rgba(239,68,68,0.10); }
    .kb-badge.kb-ptype-objection_handle { color: #fcd34d; border-color: rgba(252,211,77,0.3); background: rgba(234,179,8,0.10); }
    .kb-badge.kb-ptype-closing_move     { color: #86efac; border-color: rgba(134,239,172,0.3); background: rgba(34,197,94,0.10); }
    .kb-badge.kb-ptype-rapport_build    { color: #93c5fd; border-color: rgba(147,197,253,0.3); background: rgba(59,130,246,0.10); }

    /* ── Modal ──────────────────────────────────────────────────────────── */
    .kb-modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .kb-modal.hidden { display: none; }
    .kb-modal-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.65);
      backdrop-filter: blur(2px);
    }
    .kb-modal-dialog {
      position: relative;
      width: 100%;
      max-width: 520px;
      max-height: calc(100vh - 48px);
      overflow-y: auto;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 28px;
    }
    .kb-modal-dialog h2 {
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 18px;
    }
    .kb-modal-close {
      position: absolute;
      top: 12px;
      right: 12px;
      background: transparent;
      color: var(--muted);
      border: none;
      width: 28px;
      height: 28px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      font-family: inherit;
    }
    .kb-modal-close:hover { color: var(--text); background: rgba(255,255,255,0.06); }

    .kb-form-row { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
    .kb-form-label { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.4px; }
    .kb-form-row input[type="text"],
    .kb-form-row select {
      width: 100%;
      background: var(--bg3);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      padding: 10px 12px;
      border-radius: 8px;
      outline: none;
      box-sizing: border-box;
    }
    .kb-form-row input:focus,
    .kb-form-row select:focus { border-color: var(--green); }
    .kb-form-row select { cursor: pointer; appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 16px) 50%, calc(100% - 11px) 50%; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; padding-right: 32px; }

    .kb-tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 18px;
      border-bottom: 1px solid var(--border);
    }
    .kb-tab {
      background: transparent;
      color: var(--muted);
      border: none;
      border-bottom: 2px solid transparent;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.12s;
      margin-bottom: -1px;
    }
    .kb-tab:hover { color: var(--text); }
    .kb-tab.active {
      color: var(--green);
      border-bottom-color: var(--green);
    }

    .kb-tab-panel { display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px; }
    .kb-tab-panel.hidden { display: none; }
    .kb-tab-panel input[type="text"],
    .kb-tab-panel input[type="url"],
    .kb-tab-panel input[type="file"],
    .kb-tab-panel textarea {
      width: 100%;
      background: var(--bg3);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      padding: 10px 12px;
      border-radius: 8px;
      outline: none;
      box-sizing: border-box;
    }
    .kb-tab-panel input:focus,
    .kb-tab-panel textarea:focus { border-color: var(--green); }
    .kb-tab-panel textarea { resize: vertical; min-height: 140px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .kb-tab-panel input[type="file"] { padding: 8px 12px; cursor: pointer; }

    .kb-status {
      font-size: 12px;
      min-height: 18px;
      margin-bottom: 12px;
      color: var(--muted);
    }
    .kb-status.error { color: #f87171; }
    .kb-status.progress { color: var(--green); }

    .kb-submit {
      width: 100%;
      background: var(--green);
      color: #000;
      font-weight: 700;
      font-size: 14px;
      padding: 12px 20px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s;
    }
    .kb-submit:hover:not(:disabled) { background: var(--green-dark); }
    .kb-submit:disabled { opacity: 0.6; cursor: wait; }

    @media (max-width: 900px) {
      .kb-section { padding: 16px 16px 10px; }
      .kb-modal { padding: 12px; }
      .kb-modal-dialog { padding: 20px; }
      .kb-item { flex-direction: column; align-items: flex-start; }
      .kb-delete-btn, .kb-promote-btn { align-self: flex-end; }
    }
    /* Platform-wide form-field visibility (2026-07-23 ruling): no field ever
       sits black-on-black. Lighter surface + visible border, accent on focus.
       Placed last so it wins specificity ties with older per-view rules. */
    .page input[type="text"], .page input[type="password"], .page input[type="date"], .page select, .page textarea {
      background: var(--bg-field);
      border: 1px solid var(--border-strong);
      color: var(--text);
      border-radius: var(--radius);
    }
    .page input[type="text"]:focus, .page input[type="password"]:focus, .page input[type="date"]:focus, .page select:focus, .page textarea:focus {
      border-color: var(--accent);
      outline: none;
    }
  </style>
  <script src="/js/scout-auth.js"></script>
</head>

<nav class="top-bar">
  <div class="top-bar-left">

<script>
  // ──────────────────────────────────────────────────────────────────
  // Session / auth — same pattern used across all Scout dashboards.
  // ──────────────────────────────────────────────────────────────────
  var STORAGE_KEY = 'scout_session_v1';
  function getSession() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null'); } catch (e) { return null; } }
  function setSessionStored(s) { localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); }
  // Diagnostics shim → the shared ring buffer/beacon in scout-auth.js.
  function pdiag(e, d, beacon) {
    try {
      if (window.ScoutAuth && ScoutAuth.diag) {
        if (beacon) ScoutAuth.diag.beacon(e, d || null);
        else ScoutAuth.diag.push({ e: e, detail: d || null });
      }
    } catch (x) {}
  }
  // This page's OWN clearSession is the choke point every one of the inline
  // `if (401) { clearSession(); redirect }` handlers passes through. Beacon it
  // with a short stack so the server log shows WHICH handler triggered the
  // logout (page-level path, distinct from scout-auth's own clearSession).
  function clearSession() {
    try {
      var st = ''; try { st = (new Error()).stack || ''; } catch (e) {}
      pdiag('page-clearSession', { stack: st.split('\n').slice(1, 5).join(' || ').slice(0, 400) }, true);
    } catch (e) {}
    localStorage.removeItem(STORAGE_KEY);
  }
  function isSessionValid(s) {
    if (!s || !s.access_token || !s.expires_at) return false;
    // expires_at is UNIX SECONDS (was misread as ms via new Date() → always
    // "expired", forcing a refresh on every load; the shared module in
    // /js/scout-auth.js now owns silent refresh + the 401 retry regardless).
    return (s.expires_at * 1000) > Date.now() + 30 * 1000;
  }
  async function refreshSessionIfNeeded() {
    var s = getSession();
    if (!s || !s.refresh_token) { pdiag('page-refresh-no-token', null, true); return false; }
    try {
      var res = await fetch('/auth/refresh', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ refresh_token: s.refresh_token }) });
      if (!res.ok) { pdiag('page-refresh-not-ok', { status: res.status }, true); return false; }
      var data = await res.json();
      if (!data || !data.session) { pdiag('page-refresh-no-session-body', null, true); return false; }
      setSessionStored({ access_token: data.session.access_token, refresh_token: data.session.refresh_token, expires_at: data.session.expires_at, email: data.session.user && data.session.user.email });
      pdiag('page-refresh-ok');
      return true;
    } catch (e) { pdiag('page-refresh-threw', { err: String(e && e.message || e) }, true); return false; }
  }
  function signOut() { clearSession(); window.location.replace('/login'); }
  function authHeader() {
    var s = getSession();
    return s && s.access_token ? { Authorization: 'Bearer ' + s.access_token } : {};
  }

  function escapeHtml(s) {
    if (s === null || s === undefined) return '';
    return String(s).replace(/[&<>"']/g, function(c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]); });
  }

  // ──────────────────────────────────────────────────────────────────
  // State
  // ──────────────────────────────────────────────────────────────────
  var state = {
    me:              null,    // { user_id, email, role }
    users:           [],      // populated for admin/owner
    viewingUserId:   null,    // whose data we're showing
    dateRange:      { from: null, to: null, days: 30 },
    view:           'overview', // 'overview' | 'call-library' | 'call-review' | 'objections-intel' | 'needs-work' | 'performance' | 'team*' | 'kb' | 'eod' | 'account'
    analytics2:      null,    // last /me/analytics2 (Fathom-era) response
    objectionsIntel: null,    // last /me/objections-intel response (Objections view)
    objectionsIntelLoading: false,
    objectionsSynthesis: null, // last /me/objections-synthesis ({available,categories} | {available:false})
    objectionsSynthesisLoading: false,
    perfSynthesis: null,       // last /me/performance-synthesis ({available,working,improve} | {available:false})
    perfSynthesisLoading: false,
    // A-1 collapsed overview: sections start collapsed; nothing heavy renders
    // until expanded (Coach summary + Performance summary + Recent calls).
    overviewExpanded: { coach: false, perf: false, recent: false },
    overviewRecent: null, overviewRecentLoading: false, // lazy 5 recent calls on expand
    needsWork: null, needsWorkLoading: false, // A-2.1 personal "What needs work"
    // ── Team (manager) view ──
    teamContext:    null,   // /team/context: {role, is_owner, has_reps, teams}
    teamSelected:   null,   // owner picker: team key ('all' | managerId) or null=default
    teamTrendBucket:'week',
    teamOverview:   null,   teamOverviewLoading: false,
    teamTrends:     null,   teamTrendsLoading: false,
    teamRecs:       null,   teamRecsLoading: false,
    teamHighlights: null,   teamHighlightsLoading: false,
    teamDigest:     null,   teamDigestLoading: false,   teamDigestDate: null,
    teamDetailMetric: null, // glance-box detail drill: null | 'cash' | 'close' | 'objection'
    teamRangeInit:  false,  // team view forces a 7-day default on first entry, then user presets stick
    teamNeedsWork:  null,   teamNeedsWorkLoading: false, // "What needs work" card + detail (B-2)
    eodData:        null,   eodLoading: false,   eodDate: null,   // EOD Report view
    account:        null,   accountLoading: false,   // Account view (#account)
    // Fathom integration (Scout v2.0 Phase 1)
    fathomStatus:    null,    // null until /fathom/status fetch completes; then { connected: bool, ... }
    zoomStatus:      null,    // null until /zoom/status fetch completes; then { connected: bool, ... }
    zoomNotice:      null,    // {kind,text} after a connect attempt
    zoomSyncing:     false,   // true while a /zoom/sync request is in flight; drives spinner state
    fathomNotice:    null,    // null | { kind: 'success'|'warn'|'error', text: string } — flash message above the section
    fathomSyncing:   false,   // true while a /fathom/sync request is in flight; drives spinner state
    fathomReanalyzing: false, // true while a /fathom/reanalyze request is in flight; drives the Reanalyze button spinner
    fathomUpdating: false, // true while a /fathom/update-analyses request is in flight; drives the Update-analyses button spinner
    fathomNeedsIdentity: false,   // true when sync returned needs_identity — show the Fathom-email prompt in the strip
    fathomIdentitySuggestion: '', // pre-fill value for the identity input (stored email, else top suggestion)
    fathomIdentitySuggestions: [],// [{email,name,count}] distinct recorded_by identities from Fathom, most frequent first
    fathomIdentitySaving: false,  // true while POST /fathom/identity is in flight
    // Call Library (Scout v2.0 Phase 2 Step 3)
    callLibrary:        null,  // null pre-load, then array of call rows from /fathom/calls
    callLibraryLoading: false, // gates "Load more" button while a fetch is in flight
    callLibraryHasMore: false, // true if the last page returned === limit (more might exist)
    callLibraryOffset:  0,     // total rows fetched so far; next "Load more" uses this as offset
    callLibraryFilter:  null,  // drill filter: 'analyzed' | 'objections' | null (nav = all)
    callLibrarySort:    null,  // drill sort: 'score' | null
    callLibraryError:   null,  // last fetch error message; cleared on successful re-fetch
    callLibraryRange:   null,  // manager Calls view date window {from,to,days}; default 7d (non-managers unaffected)
    callLibraryShowAllUsers: false, // owner-only: picker revealed the full user set (default = assigned reps + self)
    // Call Review (Scout v2.0 Phase 2 Step 4)
    selectedCallId:     null,  // public.fathom_calls(id) UUID of the call being reviewed
    callReview:         null,  // null pre-load, then the GET /fathom/calls/:id response
    callReviewLoading:  false, // gates retry click while a fetch is in flight
    callReviewError:    null,  // last fetch error message; cleared on successful re-fetch
    expandedGradeCards: {},    // map of section key ('intro'|'discovery'|...) → true when expanded
    savedMomentIds: {},        // Part 2b: highlight id → true when already in the caller's KB
    selectedSection: null,     // 4a: which section the drilldown is showing
    sectionData: null,
    sectionLoading: false,
    mergeCandidates: [],       // 3d-2: prospect merge proposals awaiting human review
    mergeLoading: false,
    followupCopied:     false, // transient "Copied!" feedback flag (set true, render, then false 2s later)
  };

  // ──────────────────────────────────────────────────────────────────
  // Init
  // ──────────────────────────────────────────────────────────────────
  async function init() {
    // ─── Fathom OAuth popup handoff (must run BEFORE any auth/render so the
    // popup closes quickly without flashing the dashboard inside it). ───
    // When the Fathom OAuth callback redirects the popup to
    // /dashboard?fathom=connected (or denied/error), this code path detects
    // we're in a popup, notifies the opener via postMessage, and closes.
    // Direct visits to /dashboard?fathom=* (no opener) fall through to the
    // normal init flow — the param is handled later in this function.
    var initialParams = new URLSearchParams(window.location.search);
    var fathomParam = initialParams.get('fathom');
    if (fathomParam && window.opener && window.opener !== window) {
      try {
        window.opener.postMessage(
          { type: 'scout-fathom-done', kind: fathomParam },
          window.location.origin
        );
      } catch (e) { /* same-origin only — silent fail is fine */ }
      window.close();
      return;
    }
    var zoomParamEarly = initialParams.get('zoom');
    if (zoomParamEarly && window.opener && window.opener !== window) {
      try {
        window.opener.postMessage({ type: 'scout-zoom-done', kind: zoomParamEarly }, window.location.origin);
      } catch (e) { /* silent */ }
      window.close();
      return;
    }

    // ─── postMessage listener (parent window only) — receives the popup's
    // success/denied/error signal, sets the notice, reloads Fathom status. ───
    window.addEventListener('message', function(e) {
      // Same-origin check — both popup and parent are on this domain.
      if (e.origin !== window.location.origin) return;
      if (!e.data) return;
      if (e.data.type === 'scout-fathom-done') return handleFathomDoneSignal(e.data.kind);
      if (e.data.type === 'scout-zoom-done') return handleZoomDoneSignal(e.data.kind);
    });

    // ─── Opener-FREE connect signals (the reliable path). Cross-origin OAuth
    // (Zoom) severs the popup's window.opener, so the postMessage handoff above
    // can be dead on arrival. The /connected popup page also signals us via
    // BroadcastChannel + a localStorage write — both same-origin, no opener needed.
    // (A status poll started in connectZoom/connectFathom is the final fallback.)
    try {
      var _oauthBC = new BroadcastChannel('scout-oauth');
      _oauthBC.onmessage = function (e) { if (e.data && e.data.provider) routeConnectSignal(e.data.provider, e.data.status); };
    } catch (e) { /* BroadcastChannel unsupported — storage + poll still cover it */ }
    window.addEventListener('storage', function (e) {
      if (e.key !== OAUTH_SIGNAL_KEY || !e.newValue) return; // removeItem fires with newValue=null → skip
      consumeStoredOauthSignal(e.newValue);
    });
    // Boot read-on-load: catch a connect signal the live event missed (this window
    // was reloading when /connected wrote it). consumeStoredOauthSignal clears it and
    // rejects any stale value, so this can never fire a spurious notice.
    try {
      var _bootSignal = localStorage.getItem(OAUTH_SIGNAL_KEY);
      if (_bootSignal) consumeStoredOauthSignal(_bootSignal);
    } catch (e) {}

    pdiag('page-init-start', { snapshot: (window.ScoutAuth && ScoutAuth.diag) ? ScoutAuth.diag.snapshot() : null });
    var s = getSession();
    if (!isSessionValid(s)) {
      if (s && s.refresh_token) {
        var ok = await refreshSessionIfNeeded();
        if (!ok) { pdiag('page-init-redirect', { reason: 'boot-refresh-failed' }, true); window.location.replace('/login'); return; }
      } else { pdiag('page-init-redirect', { reason: 'no-valid-session-no-refresh-token' }, true); window.location.replace('/login'); return; }
    }
    var cur = getSession();
    document.getElementById('signedInEmail').textContent = (cur && cur.email) || '';

    state.me = await fetchMe();
    if (!state.me) { pdiag('page-init-redirect', { reason: 'fetchMe-null' }, true); window.location.replace('/login'); return; }

    // Admin console is owner-only; the Team (manager) view is for managers + owners.
    if (state.me.role === 'owner') {
      document.getElementById('adminLink').style.display = '';
    }
    if (state.me.role === 'manager' || state.me.role === 'owner') {
      document.getElementById('navTeam').style.display = '';
      document.getElementById('navTeamSep').style.display = '';
      await loadUsers();
    }
    // Knowledge Base: manager, owner, OR an unmanaged plain user (they curate
    // their own personal KB). Managed users get no KB nav link.
    if (canAccessKb()) {
      document.getElementById('navKb').style.display = '';
      document.getElementById('navKbSep').style.display = '';
    }

    // Default to caller's own data; ?user=<id> pivots to another user. Managers
    // are honored too (not just admin/owner) so a pivoted Calls/coaching view
    // survives refresh — permission is enforced server-side on every /admin/*
    // fetch (managed_by === self, else 403), so restoring the param can't leak.
    var params = new URLSearchParams(window.location.search);
    var target = params.get('user');
    if (target && (state.me.role === 'manager' || state.me.role === 'admin' || state.me.role === 'owner')) {
      state.viewingUserId = target;
    } else {
      state.viewingUserId = state.me.user_id;
    }

    // Direct visit to /dashboard?fathom=* (no popup). Set the notice and
    // strip the param from the URL so a refresh doesn't re-fire it.
    if (fathomParam) {
      handleFathomDoneSignal(fathomParam);
      params.delete('fathom');
      var qs = params.toString();
      var cleanUrl = window.location.pathname + (qs ? '?' + qs : '');
      window.history.replaceState({}, '', cleanUrl);
    }
    var zoomParam = params.get('zoom');
    if (zoomParam) {
      handleZoomDoneSignal(zoomParam);
      params.delete('zoom');
      var zqs = params.toString();
      window.history.replaceState({}, '', window.location.pathname + (zqs ? '?' + zqs : ''));
    }

    // Restore the view from the URL hash BEFORE the first load so a refresh or
    // deep link lands on the right page; the 30-day range applies underneath.
    applyHashToState();
    // v1.4: managers/owners WITH reps default to the Team view — but only when
    // there is NO explicit hash (an explicit hash, e.g. #calls, always wins).
    // Uses has_reps from the /auth/me call the page already made (no new fetch).
    // Users without reps see today's behavior unchanged.
    if (!window.location.hash && state.me && state.me.has_reps) {
      state.view = 'team';
      syncHashFromState(true); // reflect #team in the URL (replace, no spurious history entry)
    }
    setDateRange(30, true /* preserveView — keep the hash-restored view */);
    if (state.view === 'call-review' && state.selectedCallId) loadCallReview(state.selectedCallId);
  }

  // Converts a popup-result kind into a notice + triggers a status refresh.
  // Called from both the postMessage handler (popup flow) and the URL-param
  // fallback (direct visit) so the two paths produce identical behavior.
  function handleFathomDoneSignal(kind) {
    if (kind === 'connected') {
      state.fathomNotice = { kind: 'success', text: 'Fathom connected successfully.' };
    } else if (kind === 'denied') {
      state.fathomNotice = { kind: 'warn', text: 'Fathom connection was declined. You can try again any time.' };
    } else {
      state.fathomNotice = { kind: 'error', text: 'Could not connect Fathom. Please try again.' };
    }
    // Fire-and-forget status refresh — render is non-blocking.
    refreshFathomStatusInBackground();
  }

  function handleZoomDoneSignal(kind) {
    if (kind === 'connected') {
      state.zoomNotice = { kind: 'success', text: 'Zoom connected successfully.' };
    } else if (kind === 'denied') {
      state.zoomNotice = { kind: 'warn', text: 'Zoom connection was declined. You can try again any time.' };
    } else if (kind === 'already_linked') {
      state.zoomNotice = { kind: 'error', text: 'This Zoom account is already connected to another Scout user. Disconnect it there first, or use a different Zoom account.' };
    } else {
      state.zoomNotice = { kind: 'error', text: 'Could not connect Zoom. Please try again.' };
    }
    refreshZoomStatusInBackground();
  }

  // Route an opener-free connect signal (BroadcastChannel / storage / poll) to the
  // right provider handler — same destinations as the legacy postMessage path.
  function routeConnectSignal(provider, status) {
    if (provider === 'zoom') return handleZoomDoneSignal(status);
    if (provider === 'fathom') return handleFathomDoneSignal(status);
  }
  // The localStorage connect signal is NON-PERSISTENT: consume it (clear the key)
  // the instant it's read, and reject anything older than the freshness window, so
  // a signal left behind by a previous session can never fire a spurious
  // "connected" notice on a later page load. Used by BOTH the live storage event
  // (fires while both windows are open) and the boot read-on-load below (catches a
  // signal the live event missed because this window was reloading).
  var OAUTH_SIGNAL_KEY = 'scout_oauth_signal';
  var OAUTH_SIGNAL_FRESH_MS = 5 * 60 * 1000; // 5 min — a real connect signals within seconds
  function consumeStoredOauthSignal(rawValue) {
    try { localStorage.removeItem(OAUTH_SIGNAL_KEY); } catch (e) {} // clear on read, always
    var d = null;
    try { d = JSON.parse(rawValue); } catch (e) { return; }
    if (!d || !d.provider) return;
    if (typeof d.ts !== 'number' || (Date.now() - d.ts) > OAUTH_SIGNAL_FRESH_MS) return; // stale — ignore
    routeConnectSignal(d.provider, d.status);
  }
  // Final fallback: after opening a connect popup, poll the provider's status for a
  // bounded window so the card updates itself even if every cross-window signal
  // fails (opener severed AND BroadcastChannel/storage blocked).
  var _connectPoll = null;
  function startConnectPoll(provider) {
    if (_connectPoll) clearInterval(_connectPoll);
    var deadline = Date.now() + 120000; // up to 2 minutes
    _connectPoll = setInterval(async function () {
      if (Date.now() > deadline) { clearInterval(_connectPoll); _connectPoll = null; return; }
      try {
        var st = provider === 'zoom' ? await fetchZoomStatus() : await fetchFathomStatus();
        if (st && st.connected) { clearInterval(_connectPoll); _connectPoll = null; routeConnectSignal(provider, 'connected'); }
      } catch (e) { /* transient — keep polling until the deadline */ }
    }, 2500);
  }

  async function fetchZoomStatus() {
    var res = await fetch('/zoom/status', { headers: authHeader() });
    if (res.status === 401) { clearSession(); window.location.replace('/login'); throw new Error('unauth'); }
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  }
  async function refreshZoomStatusInBackground() {
    try { state.zoomStatus = await fetchZoomStatus(); }
    catch (e) { if (e.message === 'unauth') return; state.zoomStatus = { connected: false }; }
    rerenderConnectionViews();
  }

  // Mirror of connectFathom — opens the Zoom OAuth popup; handleZoomDoneSignal
  // takes over when the popup lands on /dashboard?zoom=*.
  async function connectZoom() {
    try {
      var res = await fetch('/auth/zoom/connect', { headers: authHeader() });
      if (res.status === 401) { clearSession(); window.location.replace('/login'); return; }
      if (!res.ok) { state.zoomNotice = { kind: 'error', text: 'Could not start Zoom connection (HTTP ' + res.status + ').' }; if (state.view === 'overview') renderOverview(false); return; }
      var data = await res.json();
      if (!data || !data.url) { state.zoomNotice = { kind: 'error', text: 'Zoom did not return an authorization URL.' }; if (state.view === 'overview') renderOverview(false); return; }
      var w = 600, h = 720;
      var left = Math.max(0, Math.floor((window.screen.width - w) / 2));
      var top  = Math.max(0, Math.floor((window.screen.height - h) / 2));
      var popup = window.open(data.url, 'zoom_oauth', 'width=' + w + ',height=' + h + ',left=' + left + ',top=' + top + ',resizable=yes,scrollbars=yes');
      if (!popup) { state.zoomNotice = { kind: 'error', text: 'Popup blocked. Please allow popups for this site and try again.' }; if (state.view === 'overview') renderOverview(false); }
      else startConnectPoll('zoom'); // fallback: card updates even if the popup can't signal back
    } catch (err) {
      state.zoomNotice = { kind: 'error', text: 'Could not start Zoom connection.' };
      if (state.view === 'overview') renderOverview(false);
    }
  }

  async function fetchMe() {
    try {
      var res = await fetch('/auth/me', { headers: authHeader() });
      if (!res.ok) return null;
      return await res.json();
    } catch (e) { return null; }
  }

  async function loadUsers() {
    try {
      var res = await fetch('/admin/users', { headers: authHeader() });
      if (!res.ok) return;

  // ──────────────────────────────────────────────────────────────────
  // Data fetch
  // ──────────────────────────────────────────────────────────────────
  function isSelf() { return state.viewingUserId === state.me.user_id; }


  // Fathom-era Coaching Dashboard analytics (call_analyses). Self or admin pivot.
  async function fetchAnalytics2() {
    var url = isSelf()
      ? '/me/analytics2?from=' + encodeURIComponent(state.dateRange.from) + '&to=' + encodeURIComponent(state.dateRange.to)
      : '/admin/analytics2/' + encodeURIComponent(state.viewingUserId)
        + '?from=' + encodeURIComponent(state.dateRange.from) + '&to=' + encodeURIComponent(state.dateRange.to);
    var res = await fetch(url, { headers: authHeader() });
    if (res.status === 401) { clearSession(); window.location.replace('/login'); throw new Error('unauth'); }
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  }


  // /fathom/status is per-caller (no /admin equivalent for Phase 1). Only
  // called when state.viewingUserId === state.me.user_id — see
  // renderFathomSectionHtml below for the early-return on admin pivot.
  async function fetchFathomStatus() {
    var res = await fetch('/fathom/status', { headers: authHeader() });
    if (res.status === 401) { clearSession(); window.location.replace('/login'); throw new Error('unauth'); }
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  }

  // Failure-tolerant wrapper for post-action refreshes (after Connect or
  // Sync finishes). Never throws — sets a safe default and re-renders.
  // Disconnect a provider (confirm first). Deletes only the connection —
  // history (calls/analyses/highlights) is preserved server-side.
  async function disconnectProvider(provider) {
    var label = provider === 'zoom' ? 'Zoom' : 'Fathom';
    if (!window.confirm('Disconnect ' + label + '? Your already-synced calls, grades, and clips stay — but Scout will stop pulling in new ' + label + ' calls until you reconnect.')) return;
    var path = provider === 'zoom' ? '/zoom/disconnect' : '/fathom/disconnect';
    try {
      var res = await fetch(path, { method: 'DELETE', headers: authHeader() });
      if (res.status === 401) { clearSession(); window.location.replace('/login'); return; }
      if (!res.ok) {
        var e = null; try { e = await res.json(); } catch (x) {}
        window.alert((e && e.error) || ('Could not disconnect ' + label + '.'));
        return;
      }
      if (provider === 'zoom') { state.zoomStatus = { connected: false }; state.zoomNotice = null; }
      else { state.fathomStatus = { connected: false }; state.fathomNotice = null; }
      rerenderConnectionViews();
    } catch (err) {
      window.alert('Could not reach the server.');
    }
  }

  function anySourceConnected() {
    return !!((state.fathomStatus && state.fathomStatus.connected) ||
              (state.zoomStatus && state.zoomStatus.connected));
  }
  // Re-render whichever view shows connection state (overview strips OR the
  // account Connections section) after a status change.
  function rerenderConnectionViews() {
    if (state.view === 'overview') renderOverview(false);
    else if (state.view === 'account') renderAccountView();
  }

  async function refreshFathomStatusInBackground() {
    try {
      state.fathomStatus = await fetchFathomStatus();
    } catch (e) {
      // On error, fall back to a "disconnected" view so the UI doesn't
      // get stuck in a stale connected state.
      state.fathomStatus = { connected: false };
    }
    rerenderConnectionViews();
  }

  // Button handler: kicks off OAuth in a popup window. The popup later
  // posts a 'scout-fathom-done' message back to this window (see init()).
  async function connectFathom() {
    try {
      var res = await fetch('/auth/fathom/connect', { headers: authHeader() });
      if (res.status === 401) { clearSession(); window.location.replace('/login'); return; }
      if (!res.ok) {
        state.fathomNotice = { kind: 'error', text: 'Could not start Fathom connection (HTTP ' + res.status + ').' };
        if (state.view === 'overview') renderOverview(false);
        return;
      }
      var data = await res.json();
      if (!data || !data.url) {
        state.fathomNotice = { kind: 'error', text: 'Fathom did not return an authorization URL.' };
        if (state.view === 'overview') renderOverview(false);
        return;
      }
      var w = 600, h = 720;
      var left = Math.max(0, Math.floor((window.screen.width - w) / 2));
      var top  = Math.max(0, Math.floor((window.screen.height - h) / 2));
      var popup = window.open(
        data.url,
        'fathom_oauth',
        'width=' + w + ',height=' + h + ',left=' + left + ',top=' + top + ',resizable=yes,scrollbars=yes'
      );
      if (!popup) {
        state.fathomNotice = { kind: 'error', text: 'Popup blocked. Please allow popups for this site and try again.' };
        if (state.view === 'overview') renderOverview(false);
      } else {
        startConnectPoll('fathom'); // fallback: card updates even if the popup can't signal back
      }
      // Otherwise: popup is open. handleFathomDoneSignal (postMessage), the
      // BroadcastChannel/storage signal from /connected, or the poll takes over.
    } catch (err) {
      state.fathomNotice = { kind: 'error', text: 'Could not start Fathom connection: ' + (err && err.message || 'unknown') };
      if (state.view === 'overview') renderOverview(false);
    }
  }

  // Button handler: manually trigger a sync. Disables the button via the
  // state.fathomSyncing flag (drives the spinner) so concurrent clicks
  // can't fire two parallel requests.
  async function syncFathomNow() {
    if (state.fathomSyncing) return; // guard against double-click
    state.fathomSyncing = true;
    if (state.view === 'overview') renderOverview(false);

    var noticeText = null;
    var noticeKind = 'success';
    try {
      var res = await fetch('/fathom/sync', { headers: authHeader() });
      if (res.status === 401) { clearSession(); window.location.replace('/login'); return; }
      if (res.ok) {
        var data = await res.json();
        if (data && data.needs_identity) {
          // Sync can't run until we know the user's Fathom email (otherwise it
          // would pull the whole team). Show the inline prompt instead.
          state.fathomSyncing = false;
          await showFathomIdentityPrompt();
          return;
        }
        var n = (data && typeof data.synced === 'number') ? data.synced : 0;
        noticeText = 'Synced ' + n + ' new call' + (n === 1 ? '' : 's') + '.';
        if (data && data.truncated) {
          noticeText += ' (More calls available — run sync again to fetch the rest.)';
          noticeKind = 'warn';
        }
      } else if (res.status === 404) {
        noticeText = 'Not connected to Fathom.';
        noticeKind = 'error';
      } else {
        var errBody = null;
        try { errBody = await res.json(); } catch (e) { /* ignore */ }
        noticeText = 'Sync failed: ' + (errBody && errBody.error ? errBody.error : 'HTTP ' + res.status);
        noticeKind = 'error';
      }
    } catch (err) {
      noticeText = 'Sync error: ' + (err && err.message || 'unknown');
      noticeKind = 'error';
    }
    state.fathomNotice = { kind: noticeKind, text: noticeText };
    state.fathomSyncing = false;
    // Refresh status (last_sync_at + call_count) regardless of outcome,
    // then re-render — covers the success path AND any error path so the
    // strip reflects the connection's true current state.
    await refreshFathomStatusInBackground();
  }

  // Zoom "Sync & grade my recent calls" — mirrors syncFathomNow (POST /zoom/sync).
  // Honest about the free-plan / no-cloud-recording case: Zoom returns
  // no_recordings and we say so plainly rather than showing a scary error.
  async function syncZoomNow() {
    if (state.zoomSyncing) return; // guard against double-click
    state.zoomSyncing = true;
    if (state.view === 'overview') renderOverview(false);

    var noticeText = null;
    var noticeKind = 'success';
    try {
      var res = await fetch('/zoom/sync', { method: 'POST', headers: Object.assign({ 'Content-Type': 'application/json' }, authHeader()) });
      if (res.status === 401) { clearSession(); window.location.replace('/login'); return; }
      if (res.ok) {
        var data = await res.json();
        if (data && data.no_recordings) {
          noticeText = 'No Zoom cloud recordings found yet. Zoom only grades cloud recordings with transcription on — record a meeting to the cloud and sync again.';
          noticeKind = 'warn';
        } else {
          var n = (data && typeof data.synced === 'number') ? data.synced : 0;
          noticeText = 'Synced ' + n + ' new call' + (n === 1 ? '' : 's') + '.';
          if (data && data.truncated) { noticeText += ' (More calls available — run sync again to fetch the rest.)'; noticeKind = 'warn'; }
        }
      } else if (res.status === 404) {
        noticeText = 'Not connected to Zoom.';
        noticeKind = 'error';
      } else {
        var errBody = null;
        try { errBody = await res.json(); } catch (e) { /* ignore */ }
        noticeText = 'Sync failed: ' + (errBody && errBody.error ? errBody.error : 'HTTP ' + res.status);
        noticeKind = 'error';
      }
    } catch (err) {
      noticeText = 'Sync error: ' + (err && err.message || 'unknown');
      noticeKind = 'error';
    }
    state.zoomNotice = { kind: noticeKind, text: noticeText };
    state.zoomSyncing = false;
    await refreshZoomStatusInBackground();
  }

  // Button handler: re-trigger analysis on calls already synced but still
  // pending (POST /fathom/reanalyze — does NOT re-sync from Fathom). Used to
  // unstick calls that were reset from 'error' back to 'pending' after the
  // OAuth transcript fix. Mirrors syncFathomNow's flag-guarded, notice-driven
  // shape; the queued count comes back immediately, analysis runs server-side.
  async function reanalyzeFathomNow() {
    if (state.fathomReanalyzing) return; // guard against double-click
    state.fathomReanalyzing = true;
    if (state.view === 'overview') renderOverview(false);

    var noticeText = null;
    var noticeKind = 'success';
    try {
      var res = await fetch('/fathom/reanalyze', {
        method: 'POST',
        headers: Object.assign({ 'Content-Type': 'application/json' }, authHeader()),
        body: JSON.stringify({ limit: 10 }),   // process a bounded batch per click
      });
      if (res.status === 401) { clearSession(); window.location.replace('/login'); return; }
      if (res.ok) {
        var data = await res.json();
        var n = (data && typeof data.queued === 'number') ? data.queued : 0;
        noticeText = n === 0
          ? 'No pending calls to reanalyze.'
          : 'Queued ' + n + ' call' + (n === 1 ? '' : 's') + ' for reanalysis. Grades will populate as each finishes.';
      } else {
        var errBody = null;
        try { errBody = await res.json(); } catch (e) { /* ignore */ }
        noticeText = 'Reanalyze failed: ' + (errBody && errBody.error ? errBody.error : 'HTTP ' + res.status);
        noticeKind = 'error';
      }
    } catch (err) {
      noticeText = 'Reanalyze error: ' + (err && err.message || 'unknown');
      noticeKind = 'error';
    }
    state.fathomNotice = { kind: noticeKind, text: noticeText };
    state.fathomReanalyzing = false;
    // Refresh status so pending_count (and thus button visibility) reflects the
    // dispatch. Note the count won't drop to 0 instantly — the worker flips rows
    // to 'processed' asynchronously; a later status poll catches up.
    await refreshFathomStatusInBackground();
  }

  // Re-grade calls analyzed under an older prompt version (POST
  // /fathom/update-analyses — resets them to pending + fires the batch). Shown
  // only when there's nothing pending but outdated_count > 0. Mirrors
  // reanalyzeFathomNow's flag-guarded, notice-driven shape.
  // How-far-back re-grade (2026-07-27): pick a window (7d/30d/all), see the
  // exact count via a dry-run, and confirm before triggering — all-time on 250+
  // calls is 250+ Claude calls. Manual outcome tags are preserved (analyzeCall
  // freezes them).
  async function updateOutdatedAnalysesNow(scope) {
    if (state.fathomUpdating) return; // guard against double-click
    scope = scope || '30d';
    // 1) dry-run: how many calls will this touch?
    var count = 0;
    try {
      var pre = await fetch('/fathom/update-analyses', { method: 'POST', headers: Object.assign({ 'Content-Type': 'application/json' }, authHeader()), body: JSON.stringify({ scope: scope, dry_run: true }) });
      if (pre.status === 401) { clearSession(); window.location.replace('/login'); return; }
      if (!pre.ok) { var e = null; try { e = await pre.json(); } catch (x) {} state.fathomNotice = { kind: 'error', text: 'Could not check: ' + (e && e.error ? e.error : 'HTTP ' + pre.status) }; if (state.view === 'overview') renderOverview(false); return; }
      count = ((await pre.json()) || {}).count || 0;
    } catch (err) { state.fathomNotice = { kind: 'error', text: 'Could not check: ' + (err.message || 'unknown') }; if (state.view === 'overview') renderOverview(false); return; }
    var label = scope === 'all' ? 'all time' : (scope === '7d' ? 'the last 7 days' : 'the last 30 days');
    if (count === 0) { state.fathomNotice = { kind: 'success', text: 'No outdated analyses in ' + label + '.' }; if (state.view === 'overview') renderOverview(false); return; }
    if (!confirm('Re-analyze ' + count + ' call' + (count === 1 ? '' : 's') + ' from ' + label + '?\n\nThis runs ' + count + ' AI analysis' + (count === 1 ? '' : 'es') + ' and can take a while. Your manual outcome tags are preserved.')) return;
    // 2) run for real.
    state.fathomUpdating = true;
    if (state.view === 'overview') renderOverview(false);
    var noticeText = null;
    var noticeKind = 'success';
    try {
      var res = await fetch('/fathom/update-analyses', {
        method: 'POST',
        headers: Object.assign({ 'Content-Type': 'application/json' }, authHeader()),
        body: JSON.stringify({ scope: scope }),
      });
      if (res.status === 401) { clearSession(); window.location.replace('/login'); return; }
      if (res.ok) {
        var data = await res.json();
        var n = (data && typeof data.queued === 'number') ? data.queued : 0;
        var remaining = (data && typeof data.remaining === 'number') ? data.remaining : 0;
        noticeText = n === 0
          ? 'No outdated analyses to update.'
          : 'Updating ' + n + ' call' + (n === 1 ? '' : 's') + ' to the latest analysis.'
            + (remaining > 0 ? ' ' + remaining + ' more remain — click again when these finish.' : '')
            + ' Grades refresh as each completes.';
      } else {
        var errBody = null;
        try { errBody = await res.json(); } catch (e) { /* ignore */ }
        noticeText = 'Update failed: ' + (errBody && errBody.error ? errBody.error : 'HTTP ' + res.status);
        noticeKind = 'error';
      }
    } catch (err) {
      noticeText = 'Update error: ' + (err && err.message || 'unknown');
      noticeKind = 'error';
    }
    state.fathomNotice = { kind: noticeKind, text: noticeText };
    state.fathomUpdating = false;
    // Refresh status — outdated_count won't drop instantly (worker flips rows to
    // 'processed' on the new version asynchronously); a later poll catches up.
    await refreshFathomStatusInBackground();
  }

  // Fetch a suggested Fathom email (stored value, else Scout login email) and
  // flip the strip into identity-prompt mode. Called when sync returns
  // needs_identity. Never throws — falls back to an empty input.
  async function showFathomIdentityPrompt() {
    var current = '';
    var suggestions = [];
    try {
      var r = await fetch('/fathom/identity-options', { headers: authHeader() });
      if (r.status === 401) { clearSession(); window.location.replace('/login'); return; }
      if (r.ok) {
        var d = await r.json();
        current = (d && d.current) || '';
        suggestions = (d && Array.isArray(d.suggestions)) ? d.suggestions : [];
      }
    } catch (e) { /* ignore — prompt with an empty input */ }
    state.fathomIdentitySuggestions = suggestions;
    // Pre-fill: stored email, else the most-frequent recorder, else blank.
    state.fathomIdentitySuggestion = current || (suggestions[0] && suggestions[0].email) || '';
    state.fathomNeedsIdentity = true;
    if (state.view === 'overview') renderOverview(false);
  }

  // Chip click: drop the picked email into the identity input (no re-render, so
  // the field stays editable).
  function selectFathomIdentity(email) {
    var input = document.getElementById('fathom-identity-input');
    if (input) { input.value = email; input.focus(); }
  }

  // Save the entered Fathom email, then immediately kick off a (now-filtered)
  // sync. Reads the input value BEFORE re-rendering so the uncontrolled field
  // isn't cleared mid-save.
  async function saveFathomIdentity() {
    if (state.fathomIdentitySaving) return;
    var input = document.getElementById('fathom-identity-input');
    var email = input ? input.value.trim() : '';
    if (!email) return;
    state.fathomIdentitySaving = true;
    if (state.view === 'overview') renderOverview(false);
    try {
      var res = await fetch('/fathom/identity', {
        method: 'POST',
        headers: Object.assign({ 'Content-Type': 'application/json' }, authHeader()),
        body: JSON.stringify({ email: email }),
      });
      if (res.status === 401) { clearSession(); window.location.replace('/login'); return; }
      if (!res.ok) {
        var errBody = null;
        try { errBody = await res.json(); } catch (e) { /* ignore */ }
        state.fathomNotice = { kind: 'error', text: (errBody && errBody.error) || ('Could not save email (HTTP ' + res.status + ').') };
        state.fathomIdentitySaving = false;
        if (state.view === 'overview') renderOverview(false);
        return;
      }
    } catch (err) {
      state.fathomNotice = { kind: 'error', text: 'Could not save email: ' + (err && err.message || 'unknown') };
      state.fathomIdentitySaving = false;
      if (state.view === 'overview') renderOverview(false);
      return;
    }
    // Saved — clear the prompt and fire the filtered sync.
    state.fathomNeedsIdentity = false;
    state.fathomIdentitySaving = false;
    await syncFathomNow();
  }

  function dismissFathomNotice() {
    state.fathomNotice = null;
    if (state.view === 'overview') renderOverview(false);
    else if (state.view === 'call-library') renderCallLibrary();
    else if (state.view === 'call-review') renderCallReview();
  }

  // ─── Fathom rendering helpers ─────────────────────────────────────────
  // renderFathomNoticeHtml + renderFathomSectionHtml both return either ''
  // or a fragment. Called from renderOverview between the page header and
  // the donut row.

  function renderFathomNoticeHtml() {
    if (!state.fathomNotice) return '';
    var n = state.fathomNotice;
    var kind = (n.kind === 'success' || n.kind === 'warn' || n.kind === 'error') ? n.kind : 'success';
    return '<div class="fathom-notice ' + kind + '">'
      + '<div class="fathom-notice-text">' + escapeHtml(n.text || '') + '</div>'
      + '<button class="fathom-notice-dismiss" type="button" aria-label="Dismiss" onclick="dismissFathomNotice()">×</button>'
      + '</div>';
  }

  function renderFathomSectionHtml() {
    // Hide when an admin/owner is viewing another user — Fathom connection
    // is per-user and there is no admin endpoint for another user's status
    // in Phase 1. The notice still renders above the donuts via the call
    // in renderOverview so admin-triggered actions (none currently) would
    // still produce feedback.
    if (state.viewingUserId !== state.me.user_id) return '';

    // Pre-first-fetch: render nothing to avoid a layout jump while
    // /fathom/status is in flight (it runs in the same Promise.all as
    // the donut data, so it's only null on the very first render call).
    if (!state.fathomStatus) return '';

    var inner;
    if (state.fathomSyncing) {
      inner = renderFathomStripSyncing();
    } else if (!state.fathomStatus.connected) {
      // First-run-only: the connect card shows on the dashboard ONLY when no
      // source is connected yet. Once any source is connected, Fathom's connect
      // button lives solely in the #account Connections section.
      if (anySourceConnected()) return '';
      inner = renderFathomConnectCard();
    } else if (state.fathomNeedsIdentity) {
      inner = renderFathomIdentityPrompt();
    } else if (state.fathomStatus.last_sync_status === 'error') {
      inner = renderFathomStripError(state.fathomStatus);
    } else {
      inner = renderFathomStripConnected(state.fathomStatus);
    }
    return '<section class="section fade-in fathom-section">' + inner + '</section>';
  }

  // Zoom connect section — identical SHAPE to Fathom (same card/strip classes),
  // connect + connected states only. Paid-plan detection messaging is sub-stage 4.
  function renderZoomNoticeHtml() {
    if (!state.zoomNotice) return '';

    return '<div class="fathom-notice ' + kind + '">'
      + '<div class="fathom-notice-text">' + escapeHtml(n.text || '') + '</div>'
      + '<button class="fathom-notice-dismiss" type="button" aria-label="Dismiss" onclick="dismissZoomNotice()">×</button>'
      + '</div>';

  function dismissZoomNotice() { state.zoomNotice = null; if (state.view === 'overview') renderOverview(false); }
  function renderZoomSectionHtml() {
    if (state.viewingUserId !== state.me.user_id) return '';
    if (!state.zoomStatus) return '';
    var inner;
    if (!state.zoomStatus.connected) {

      inner = '<div class="fathom-connect-card">'
        + '<div class="fathom-connect-text">'
          + '<div class="fathom-connect-title">Connect Zoom</div>'

        + '</div>'

      inner = '<div class="fathom-strip">'

          + '<span class="fathom-strip-icon ok"></span>'

  // Inline "which email do you use for Fathom?" prompt — shown when sync returns
  // needs_identity. One input (pre-filled with the suggestion) + one Save button.
  function renderFathomIdentityPrompt() {
    var suggestion = state.fathomIdentitySuggestion || '';
    var suggestions = Array.isArray(state.fathomIdentitySuggestions) ? state.fathomIdentitySuggestions : [];
    var saving = state.fathomIdentitySaving;

    // Clickable chips of the actual recorder identities Fathom returned, so the
    // user picks theirs instead of guessing. Most frequent first (per backend).
    var chips = '';
    if (suggestions.length > 0) {
      chips = '<div style="display:flex;flex-wrap:wrap;gap:6px;width:100%;">'
        + '<span class="fathom-strip-meta" style="width:100%;margin-bottom:2px;">Pick the identity Fathom stamps on your recordings, or type it below:</span>'
        + suggestions.map(function(s) {
            var label = (s.name ? escapeHtml(s.name) + ' · ' : '') + escapeHtml(s.email)
              + (typeof s.count === 'number' ? ' (' + s.count + ')' : '');

  // Format an ISO timestamp into "5m ago" / "2h ago" / "3 days ago" / "Jun 14".
  // Phase 1 standalone formatter — keeps the Fathom block self-contained.
  function formatRelativeTime(iso) {
    if (!iso) return 'never';
    var then = new Date(iso).getTime();
    if (isNaN(then)) return 'never';
    var diff = Math.max(0, Date.now() - then);
    var s = Math.floor(diff / 1000);
    if (s < 60) return 'just now';
    var m = Math.floor(s / 60);
    if (m < 60) return m + 'm ago';
    var h = Math.floor(m / 60);
    if (h < 24) return h + 'h ago';
    var d = Math.floor(h / 24);
    if (d < 7) return d + (d === 1 ? ' day ago' : ' days ago');
    return new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  }


  // ──────────────────────────────────────────────────────────────────
  // Date range / user controls
  // ──────────────────────────────────────────────────────────────────
  function setDateRange(days, preserveView) {
    var to = new Date();
    var from = days >= 9999
      ? new Date('2025-01-01T00:00:00Z')
      : new Date(Date.now() - days * 24 * 60 * 60 * 1000);
    state.dateRange = { from: from.toISOString(), to: to.toISOString(), days: days };
    state.needsWork = null; // range-responsive (2026-07-27) — refetch for the new window
    // Range-responsive sub-views update IN PLACE — never bounce back to the
    // coaching overview when the range changes while inside them.
    if (state.view === 'needs-work') { renderNeedsWorkView(); return; }
    if (state.view === 'performance') { state.perfSynthesis = null; renderPerformanceView(); return; }
    // Date-preset clicks reset to Coaching; the initial boot restore keeps the
    // hash-restored view (preserveView) so a refresh on #calls stays on Calls.
    if (!preserveView) state.view = 'overview';
    reloadAll();
  }

  function setUser(userId) {
    if (!userId || userId === state.viewingUserId) return;
    var url = new URL(window.location.href);
    if (userId === state.me.user_id) url.searchParams.delete('user');
    else url.searchParams.set('user', userId);
    window.history.replaceState({}, '', url.toString());
    state.viewingUserId = userId;
    state.view = 'overview';
    state.needsWork = null; // fixed-window card, but it IS per-user → refetch on pivot
    reloadAll();
  }

  async function reloadAll() {
    // Range/user changed — drop the cached synthesis + recent calls so they
    // re-fetch for the new (user, range). Expanded state persists (UX), the DATA
    // resets. (Server cache handles repeat synthesis requests.)
    state.perfSynthesis = null;
    state.overviewRecent = null;
    // NOTE: state.needsWork is deliberately NOT reset here — it's a fixed 90-day
    // window, independent of the range picker. It resets only on a user pivot
    // (setUser), so changing the tile range never refetches it.
    renderOverview(true /* loading */);
    try {
      // Fathom status fetch is wrapped in a .catch so a stale token or
      // misconfigured FATHOM_* env vars don't break the whole dashboard
      // — the Fathom strip will simply render as "disconnected" in that
      // case. Critical analytics fetches stay in the throw-fast path.
      var fathomPromise = isSelf()
        ? fetchFathomStatus().catch(function() { return { connected: false }; })
        : Promise.resolve(null); // admin pivot: skip — section hidden anyway
      var zoomPromise = isSelf()
        ? fetchZoomStatus().catch(function() { return { connected: false }; })
        : Promise.resolve(null);

      // A-1 boot trim: the default coaching overview only needs /me/analytics2
      // (cheap, no LLM) + the connection strips. The old boot also fetched
      // /me/analytics, /me/sessions, and the LLM /me/coaching/patterns — all
      // three feed only the dormant Live-Sessions branch, so they're dropped
      // (kills a Claude call on every dashboard load). Performance Summary's LLM
      // call is now deferred to its accordion expand, not fired here.
      var results = await Promise.all([
        fathomPromise,
        fetchAnalytics2(),
        zoomPromise,
      ]);
      state.fathomStatus = results[0];
      state.analytics2   = results[1];
      state.zoomStatus   = results[2];
      render();
    } catch (err) {
      if (err.message === 'unauth') return;
      document.getElementById('content').innerHTML = '<div class="error">Could not load dashboard data: ' + escapeHtml(err.message || 'unknown') + '</div>';
    }
  }

    if (navTeam) navTeam.classList.toggle('nav-active', state.view === 'team' || state.view === 'team-expanded' || state.view === 'team-needs-work' || state.view === 'team-members');

  // ──────────────────────────────────────────────────────────────────
  // Chart drawing — Chart.js with custom dark theme + thin ring
  // ──────────────────────────────────────────────────────────────────
  var COLORS = {
    win: '#4ade80', loss: '#f87171', follow_up: '#fbbf24', unmarked: '#64748b', live: '#5b9eff',
    money: '#5b9eff', think: '#fbbf24', spouse: '#c084fc', time: '#fb923c',
    guarantee: '#22d3ee', 'tried-before': '#a78bfa', 'send-info': '#34d399',
    'more-research': '#f472b6', 'not-right-time': '#fb7185', 'proof-it-works': '#94a3b8',
    other: '#64748b',
  };

  function donutBase(canvasId, labels, values, colors) {
    var ctx = document.getElementById(canvasId);
    if (!ctx) return null;
    if (!window.Chart) return null;
    return new Chart(ctx.getContext('2d'), {
      type: 'doughnut',
      data: {
        labels: labels,
        datasets: [{
          data: values,
          backgroundColor: colors,
          borderWidth: 0,
          spacing: 2,
          hoverOffset: 8,
        }],
      },
      options: {
        cutout: '78%',
        responsive: true,
        maintainAspectRatio: true,
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: '#1a1a1a',
            titleColor: '#ededed',
            bodyColor: '#cccccc',
            borderColor: '#2a2a2a',
            borderWidth: 1,
            padding: 10,
            cornerRadius: 8,
            displayColors: true,
            titleFont: { size: 12, weight: 600 },
            bodyFont: { size: 12 },
          },
        },
        animation: { duration: 700, easing: 'easeOutCubic' },
      },
    });
  }


  function filterZero(labels, values, colors) {
    var L = [], V = [], C = [];
    for (var i = 0; i < values.length; i++) {
      if (values[i] > 0) { L.push(labels[i]); V.push(values[i]); C.push(colors[i]); }
    }
    if (V.length === 0) { L = ['Empty']; V = [1]; C = ['#1f1f1f']; }
    return { labels: L, values: V, colors: C };
  }

  // ──────────────────────────────────────────────────────────────────
  // Coaching overview (Fathom-era, call_analyses) — default view
  // ──────────────────────────────────────────────────────────────────

  function scoreColor(s) {
    if (s == null) return '#1f1f1f';
    return s >= 70 ? COLORS.win : (s >= 50 ? COLORS.follow_up : COLORS.loss);
  }

  // Avg Score donut sub-stat: surface win-quality vs the rest so a strong
  // closer's win average isn't buried in the blend. Falls back to graded count.
  function avgScoreSubstat(av) {
    if (av.win_mean !== null || av.other_mean !== null) {
      return 'Wins ' + (av.win_mean === null ? '—' : av.win_mean) + ' · Others ' + (av.other_mean === null ? '—' : av.other_mean);
    }
    return av.graded_calls + ' graded';
  }

  // A-1: compact clickable glance tile (text only — no Chart.js). Reuses the
  // donut drill targets so each tile behaves like the old donut, minus the rings.
  function glanceTileHtml(label, big, sub, onclick) {
    return '<div class="glance-tile" onclick="' + onclick + '" title="' + escapeHtml(label) + ' — click to drill in">'
      + '<div class="glance-big">' + big + '</div>'
      + '<div class="glance-label">' + escapeHtml(label) + '</div>'
      + (sub ? '<div class="glance-sub">' + escapeHtml(sub) + '</div>' : '')
      + '</div>';
  }

  // Tile metrics — MIRROR of backend lib/tile-metrics.js (pinned by
  // tile-metrics-mirror.test.js). Keep in sync.
  function objectionHandleRate(needsWork) {
    var d = needsWork && needsWork.detail;
    if (!d || !Array.isArray(d.buckets)) return null;
    var handled = 0, total = 0;
    for (var i = 0; i < d.buckets.length; i++) {
      var b = d.buckets[i] || {};
      handled += (typeof b.handled === 'number') ? b.handled : 0;
      total += (typeof b.total === 'number') ? b.total : 0;
    }
    if (total <= 0) return null;
    if (handled > total) handled = total;
    return { rate: Math.round((handled / total) * 100), handled: handled, total: total };
  }
  function scoreTrend(cur, prior) {
    if (typeof cur !== 'number' || typeof prior !== 'number') return { dir: null, delta_pct: null };
    if (prior <= 0) return { dir: null, delta_pct: null };
    var pct = Math.round(((cur - prior) / prior) * 100);
    var dir = pct > 0 ? 'up' : (pct < 0 ? 'down' : 'flat');
    return { dir: dir, delta_pct: pct };
  }
  // Renders the Avg-score tile trend (arrow + delta %) reusing trendArrow's styling.
  // Empty string when there's no prior baseline → the tile shows no arrow.
  function tileTrendHtml(st) {
    if (!st || !st.dir) return '';
    var sign = st.dir === 'up' ? 1 : (st.dir === 'down' ? -1 : 0);
    var pctText = (st.delta_pct > 0 ? '+' : '') + st.delta_pct + '%';
    return '<span class="glance-trend">' + trendArrow(sign) + '<span class="glance-trend-pct">' + pctText + '</span></span>';
  }
  // ── FD-4: light first-run "Get started" card ──────────────────────────────
  // A single dismissible card on the overview with a 3-step checklist (connect →
  // first analysis → optional KB). NOT a wizard. Auto-hides once a source is
  // connected AND the first analysis has run, or when dismissed. Dismissal is
  // per-user (localStorage keyed by user_id) so it doesn't bleed across accounts
  // on a shared browser.
  function gsKey(suffix) { return 'scout_gs_' + suffix + '_' + ((state.me && state.me.user_id) || 'anon'); }
  function gsDismissed(suffix) { try { return localStorage.getItem(gsKey(suffix)) === '1'; } catch (e) { return false; } }
  function gsDismiss(suffix) { try { localStorage.setItem(gsKey(suffix), '1'); } catch (e) {} }
  function dismissGetStarted() { gsDismiss('card'); if (state.view === 'overview') renderOverview(false); }
  function dismissGsKb() { gsDismiss('kb'); if (state.view === 'overview') renderOverview(false); }

  function getStartedCardHtml() {
    if (gsDismissed('card')) return '';
    var connected = anySourceConnected();
    var analyzed = !!(state.analytics2 && state.analytics2.calls && state.analytics2.calls.analyzed > 0);
    if (connected && analyzed) return ''; // essentials done — nothing left to onboard
    var canManageKb = kbCanManage();

    function stepHtml(done, title, body, action) {
      return '<div class="gs-step">'
        + '<div class="gs-check' + (done ? ' done' : '') + '">' + (done ? '✓' : '') + '</div>'
        + '<div class="gs-step-body"><div class="gs-step-title">' + title + '</div>'
        + (body ? '<div class="gs-step-sub">' + body + '</div>' : '')
        + (action || '') + '</div></div>';
    }

    var fathomConnected = !!(state.fathomStatus && state.fathomStatus.connected);
    var zoomConnected = !!(state.zoomStatus && state.zoomStatus.connected);

    // Step 1 — connect. Direct buttons (they open the OAuth popup and keep you on
    // this page). After you finish, this step checks itself with no reload.
    var s1;
    if (connected) {
      var sources = [fathomConnected ? 'Fathom' : null, zoomConnected ? 'Zoom' : null].filter(Boolean).join(' + ');
      s1 = stepHtml(true, 'Connect Zoom or Fathom', 'Connected: ' + sources + '. Scout grades the calls it syncs.', '');
    } else {
      s1 = stepHtml(false, 'Connect Zoom or Fathom', 'Scout grades the calls it records for you — pick where your calls live.',
        '<div class="gs-actions"><button class="btn-fathom-primary" type="button" onclick="connectZoom()">Connect Zoom</button>'
        + '<button class="btn-fathom-primary" type="button" onclick="connectFathom()">Connect Fathom</button></div>');
    }

    // Step 2 — get calls graded. Connecting does NOT auto-sync, so this step carries
    // the action itself. Both Fathom and Zoom now have a real one-click sync.
    var s2;
    if (analyzed) {
      s2 = stepHtml(true, 'Get your calls graded', 'Your recent calls are graded — your scores are up top.', '');
    } else if (fathomConnected) {
      s2 = state.fathomSyncing
        ? stepHtml(false, 'Get your calls graded', 'Syncing your calls now — this usually takes a few minutes. Your grades appear up top as each one finishes.', '')
        : stepHtml(false, 'Get your calls graded', 'Pull in your most recent calls and grade them — one click.',
            '<button class="btn-fathom-primary" type="button" style="margin-top:10px;" onclick="syncFathomNow()">Sync &amp; grade my recent calls</button>');
    } else if (zoomConnected) {

  // ── A-2.1: personal "What needs work" (card under the tiles + #needs-work page)

    if (state.needsWorkLoading) return;

  // Compact card under the glance tiles. Mirrors the team needs-work card.

  }
  function needsWorkCardHtml() {
    var d = state.needsWork;
    var win = (d && d.window_days) ? d.window_days : 90;
    var head = '<div class="section-header"><h2>What needs work</h2><div class="meta">your last ' + win + ' days</div></div>';
    if (!d) return head + '<div class="skeleton" style="height:70px;"></div>';
    if (d._error) return head + '<div class="error">Could not load: ' + escapeHtml(d._error) + '</div>';
    if (d.available === false) return head + '<div class="empty"><p>' + escapeHtml(d.reason || 'Not available right now.') + '</p></div>';
    if (d.state === 'insufficient') {

      var nwCta = !anySourceConnected() ? connectSourceCtaHtml() : '';
      return head + '<div class="team-recs-card" style="cursor:default;"><div class="team-recs-teaser">' + escapeHtml((d.card_text || '') + needsWorkThinHint(d)) + '</div>' + nwCta + '</div>';
    }
    var b = d.bucket || {};
    var chips = '<div class="nw-chips">'
      + '<span class="nw-chip"><b>' + b.handled + ' of ' + b.total + '</b> · ' + (b.rate_pct == null ? '—' : b.rate_pct + '%') + ' handled</span>'
      + '<span class="nw-chip">your baseline <b>' + (b.baseline_pct == null ? '—' : b.baseline_pct + '%') + '</b></span>'
      + (d.state === 'money' && d.extra ? '<span class="nw-chip nw-chip-cash"><b>+$' + fmtCashNum(moneyRound(d.extra.extra_cash)) + '</b> at stake</span>' : '')

    return head + '<div class="team-recs-card" onclick="openNeedsWork()" title="See your buckets and the calls behind them">'
      + '<div class="team-recs-teaser">' + escapeHtml(d.card_text || '') + '</div>' + chips + nwContextLineHtml(d)
      + '<div class="team-recs-expand">click to expand →</div></div>';

  // Small context line under a needs-work card (logistical + DQ, not coachable).
  function nwContextLineHtml(d) {
    var c = (d && d.detail && d.detail.context) || {};
    var dq = c.disqualifications || 0, log = c.logistical || 0;
    if (!dq && !log) return '';
    var parts = [];
    if (dq) parts.push(dq + ' disqualification' + (dq === 1 ? '' : 's'));
    if (log) parts.push(log + ' payment/logistical');

  // ─── Performance Summary (learning loop surface) ─────────────────────────
  async function fetchPerfSynthesis() {
    var qp = 'from=' + encodeURIComponent(state.dateRange.from) + '&to=' + encodeURIComponent(state.dateRange.to);
    var base = isSelf() ? '/me/performance-synthesis' : '/admin/performance-synthesis/' + encodeURIComponent(state.viewingUserId);
    var res = await fetch(base + '?' + qp, { headers: authHeader() });
    if (res.status === 401) { clearSession(); window.location.replace('/login'); throw new Error('unauth'); }
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  }
  async function loadPerfSynthesis() {
    if (state.perfSynthesisLoading) return;
    state.perfSynthesisLoading = true;
    try { state.perfSynthesis = await fetchPerfSynthesis(); }
    catch (err) { if (err.message === 'unauth') return; state.perfSynthesis = { available: false, reason: err.message || 'unknown' }; }
    state.perfSynthesisLoading = false;
    if (state.view === 'performance') renderPerformanceView();
    else if (state.view === 'overview') renderOverview(false);
  }
  function perfInsightHtml(it, kind) {
    var clip = it.clip_url ? ' <a class="obj-btn" href="' + escapeHtml(it.clip_url) + '" target="_blank" rel="noopener" style="padding:2px 8px;">▶ clip</a>' : '';
    var review = it.call_id ? ' <button class="obj-btn" type="button" onclick="openCallReview(\'' + escapeHtml(it.call_id) + '\')" style="padding:2px 8px;">call</button>' : '';
    var data = it.data ? '<span style="color:var(--muted);"> · ' + escapeHtml(it.data) + '</span>' : '';
    var quote = it.quote ? '<div class="obj-response" style="display:block;margin-top:6px;"><span style="color:var(--muted);">“</span>' + escapeHtml(it.quote) + '<span style="color:var(--muted);">”</span></div>' : '';
    var accent = kind === 'working' ? 'var(--good)' : 'var(--mid, #fbbf24)';
    return '<div class="pattern-card" style="border-left:2px solid ' + accent + ';">'
      + '<div class="pattern-detail">' + escapeHtml(it.claim || '') + data + '</div>'
      + quote
      + ((clip || review) ? '<div class="obj-footer" style="margin-top:8px;">' + clip + review + '</div>' : '')
      + '</div>';
  }
  function renderPerfSummary() {
    var s = state.perfSynthesis;
    if (s === null) return '<div class="load-state" style="padding:14px 4px;"><div class="spinner"></div> Generating performance summary…</div>';
    if (!s.available) return '<div class="empty"><h3>Performance summary unavailable</h3><p>Could not generate it right now' + (s.reason ? ' (' + escapeHtml(s.reason) + ')' : '') + '. Your scores above are unaffected.</p></div>';
    var work = (s.working || []), imp = (s.improve || []);
    if (!work.length && !imp.length) return '<div class="empty"><h3>Not enough data yet</h3><p>Analyze more calls (with win/loss outcomes) to surface a performance summary.</p></div>';
    var block = function(title, arr, kind) {
      return '<div style="margin-top:6px;"><div class="obj-group-header">' + title + '</div>'
        + (arr.length ? arr.map(function(it) { return perfInsightHtml(it, kind); }).join('') : '<div style="color:var(--muted);font-size:13px;">—</div>')
        + '</div>';
    };
    return block("WHAT'S WORKING", work, 'working') + block('WHAT TO IMPROVE', imp, 'improve');
  }

  function drawCallsDonut2(canvasId, a) {
    if (state.chartC1) state.chartC1.destroy();
    var f = filterZero(
      ['Analyzed', 'Processing', 'Error'],
      [a.calls.analyzed, a.calls.processing, a.calls.error],
      [COLORS.win, COLORS.live, COLORS.loss]
    );
    state.chartC1 = donutBase(canvasId, f.labels, f.values, f.colors);
  }

  function drawScoreDonut(canvasId, a) {
    if (state.chartC2) state.chartC2.destroy();
    var m = a.avg_score.mean;
    if (m === null) { state.chartC2 = donutBase(canvasId, ['No scores'], [1], ['#1f1f1f']); return; }
    state.chartC2 = donutBase(canvasId, ['Score', 'Remaining'], [m, Math.max(0, 100 - m)], [scoreColor(m), '#1f1f1f']);
  }

  function drawObjDonut2(canvasId, a) {
    if (state.chartC3) state.chartC3.destroy();
    var withObj = a.objections.calls_with_objection;
    var without = Math.max(0, a.calls.total_in_range - withObj);
    if (withObj + without === 0) { state.chartC3 = donutBase(canvasId, ['No calls'], [1], ['#1f1f1f']); return; }
    state.chartC3 = donutBase(canvasId, ['With objection', 'No objection'], [withObj, without], [COLORS.money, '#1f1f1f']);
  }

  function renderCoachSummary2(a) {
    if (!a.calls.analyzed) {
      return '<div class="empty"><h3>No analyzed calls yet</h3><p>Sync and analyze Fathom calls to see coaching aggregates in this date range.</p></div>';
    }
    var SECTIONS = [['intro', 'Intro'], ['discovery', 'Discovery'], ['pitch', 'Pitch'], ['objection', 'Objection'], ['close', 'Close']];
    var rows = SECTIONS.map(function(pair) {
      var key = pair[0];
      var sec = a.sections[key] || { avg: null, n: 0 };
      var tag = a.weakest_section === key ? ' <span class="badge badge-loss">weakest</span>'
              : (a.strongest_section === key ? ' <span class="badge badge-win">strongest</span>' : '');
      // Score only — no (n=X). n=0 → avg is null → render "—".
      var avgTxt = sec.avg === null ? '—' : String(sec.avg);
      var pct = sec.avg === null ? 0 : Math.max(0, Math.min(100, sec.avg));
      // Stage 4a: the bar is the entry point into the section drilldown.
      return '<div class="coach-section-row" onclick="goSection(\'' + key + '\')" title="See the moments behind this score" style="display:flex;align-items:center;gap:14px;padding:7px 0;border-bottom:1px solid var(--border);cursor:pointer;">'
        + '<div style="width:92px;font-size:13px;color:var(--muted);">' + escapeHtml(pair[1]) + '</div>'
        + '<div style="flex:1;height:8px;background:var(--border);border-radius:4px;overflow:hidden;"><div style="width:' + pct + '%;height:100%;background:' + scoreColor(sec.avg) + ';border-radius:4px;"></div></div>'
        + '<div style="width:130px;text-align:right;font-size:13px;">' + avgTxt + tag + '</div>'
        + '</div>';
    }).join('');
    // The per-call one_thing feed was replaced by the Performance Summary panel
    // (renderPerfSummary) — one_thing stays on individual call review pages.
    return '<div>' + rows + '</div>';
  }

  function goTeam() { state.teamDetailMetric = null; setView('team'); }
  function teamQP(extra) {

    if (state.teamSelected) qp += '&team=' + encodeURIComponent(state.teamSelected);

  async function fetchTeamJSON(path) {
    var res = await fetch(path, { headers: authHeader() });
    if (res.status === 401) { clearSession(); window.location.replace('/login'); throw new Error('unauth'); }
    if (res.status === 403) return { _forbidden: true };
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  }
  function resetTeamData() {
    state.teamOverview = null; state.teamTrends = null; state.teamRecs = null;
    state.teamHighlights = null; state.teamDigest = null; state.teamDigestDate = null;
    state.teamNeedsWork = null;

  }

    else if (state.view === 'team-members') renderTeamMembersView();

  function pickTeam(key) { state.teamSelected = (key === '__default') ? null : key; resetTeamData(); renderTeamSurface(); }
  function setTeamTrendBucket(b) { state.teamTrendBucket = b; state.teamTrends = null; loadTeam('trends'); }
  function setTeamRange(days) {
    var to = new Date();
    var from = days >= 9999 ? new Date('2025-01-01T00:00:00Z') : new Date(Date.now() - days * 24 * 60 * 60 * 1000);
    state.dateRange = { from: from.toISOString(), to: to.toISOString(), days: days };
    resetTeamData(); renderTeamSurface();

  // Generic lazy loader for each team panel.
  async function loadTeam(which) {
    var map = {
      context:  { flag: null,                    set: 'teamContext',    url: '/team/context' },
      overview: { flag: 'teamOverviewLoading',   set: 'teamOverview',   url: '/team/overview?' + teamQP() },
      trends:   { flag: 'teamTrendsLoading',     set: 'teamTrends',     url: '/team/trends?' + teamQP('bucket=' + state.teamTrendBucket) },
      recs:     { flag: 'teamRecsLoading',       set: 'teamRecs',       url: '/team/recommendations?' + teamQP() },
      needsWork:{ flag: 'teamNeedsWorkLoading',  set: 'teamNeedsWork',  url: '/team/needs-work?' + teamQP() },
      highlights:{flag: 'teamHighlightsLoading', set: 'teamHighlights', url: '/team/highlights?' + teamQP() },
      digest:   { flag: 'teamDigestLoading',     set: 'teamDigest',     url: '/team/digest?' + teamQP(state.teamDigestDate ? 'date=' + state.teamDigestDate : '') },
    };
    var c = map[which]; if (!c) return;
    if (c.flag && state[c.flag]) return;
    if (c.flag) state[c.flag] = true;
    try { state[c.set] = await fetchTeamJSON(c.url); }
    catch (err) { if (err.message === 'unauth') return; state[c.set] = { _error: err.message || 'unknown' }; }
    if (c.flag) state[c.flag] = false;
    if (state.view === 'team') renderTeamView();
    else if (state.view === 'team-expanded') renderTeamExpanded();
    else if (state.view === 'team-needs-work') renderTeamNeedsWorkView();
    else if (state.view === 'team-members') renderTeamMembersView();
  }

    if (state.teamRangeInit) return;

    state.dateRange = { from: from.toISOString(), to: to.toISOString(), days: 7 };

  function openTeamExpanded() { setView('team-expanded'); }
  function renderTeamExpanded() {

    if (state.teamOverview === null && !state.teamOverviewLoading) loadTeam('overview');

        + '<button class="date-preset" onclick="goTeam()">← back to team</button></div>' + teamRecsHtml() + '</div>'

  // Compact recommendations card on the main team view: a one/two-line teaser +
  // "click to expand" affordance → opens the dedicated expanded page.
  function teamRecsCompactHtml() {
    var r = state.teamRecs;
    if (!r) return '<div class="skeleton" style="height:60px;"></div>';
    var teaser, sub = 'click to expand →';
    if (r._error) { teaser = 'Could not load recommendations.'; }
    else if (!r.available) { teaser = r.reason || 'Recommendations not available yet.'; }
    else {
      var w = r.working || [], i = r.improve || [];
      if (!w.length && !i.length) { teaser = 'Not enough analyzed team calls yet.'; }
      else { teaser = (i[0] && i[0].claim) || (w[0] && w[0].claim) || 'Team recommendations ready.'; }
    }
    return '<div class="team-recs-card" onclick="openTeamExpanded()" title="Open full recommendations + Call Highlights of the Week">'
      + '<div class="team-recs-teaser">' + escapeHtml(teaser) + '</div>'
