    if (h._error) return '<div class="error">Could not load highlights: ' + escapeHtml(h._error) + '</div>';
    if (!h.available) return '<div class="empty"><h3>Highlights unavailable</h3><p>' + escapeHtml(h.reason || '') + '</p></div>';
    var lanes = h.lanes || {};
    var LANE = { objection_handling: 'Best objection handling', challenging: 'Best challenger moment', pain_excavation: 'Best pain excavation' };
    var keys = Object.keys(LANE).filter(function (k) { return lanes[k]; });
    if (!keys.length) return '<div class="empty"><p>No standout team moments this week yet.</p></div>';
    return '<div class="team-lane-row">' + keys.map(function (k) {
      var m = lanes[k];
      var clip = m.clip_url ? '<a class="review-why-clip" href="' + escapeHtml(m.clip_url) + '" target="_blank" rel="noopener">▶ clip</a>' : '';
      return '<div class="team-lane">'
        + '<div class="team-lane-title">' + LANE[k] + '</div>'
        + '<div class="team-lane-rep">' + escapeHtml(String(m.rep || '').split('@')[0]) + '</div>'
        + '<div class="review-why-quote">“' + escapeHtml(m.quote || '') + '”</div>'
        + (m.why ? '<div class="team-lane-why">' + escapeHtml(m.why) + '</div>' : '')
        + '<div class="team-insight-foot">' + clip + '</div>'
      + '</div>';
    }).join('') + '</div>';
  }

  function teamDigestHtml() {
    var d = state.teamDigest;
    if (!d) return '<div class="skeleton" style="height:80px;"></div>';
    if (d._error) return '<div class="error">Could not load digest: ' + escapeHtml(d._error) + '</div>';

    // History chips (last 7 stored digest days) — render whenever present so
    // the manager can page through recent days, including from a pending state.
    var chips = '';
    var recents = Array.isArray(d.recent_dates) ? d.recent_dates : [];
    if (recents.length > 1 || (recents.length === 1 && recents[0] !== d.date)) {
      chips = '<div class="digest-date-row">' + recents.map(function (dt) {
        return '<button type="button" class="digest-date-chip' + (dt === d.date ? ' active' : '')
          + '" onclick="selectDigestDate(\'' + dt + '\')">' + escapeHtml(dt) + '</button>';
      }).join('') + '</div>';
    }

    if (!d.available) {
      return chips + '<div class="empty"><h3>No digest for ' + escapeHtml(d.date || '') + '</h3><p>'
        + escapeHtml(d.reason || 'It generates after the morning sync.') + '</p></div>';
    }

    var s = d.stats || {};
    var stats = '<div class="team-stat-row">'
      + '<div class="team-stat"><div class="team-stat-val">' + (s.calls || 0) + '</div><div class="team-stat-label">Calls</div></div>'
      + '<div class="team-stat"><div class="team-stat-val">' + (s.closed || 0) + '</div><div class="team-stat-label">Closed</div></div>'
      + '<div class="team-stat"><div class="team-stat-val">' + (s.follow_up || 0) + '</div><div class="team-stat-label">Follow-ups</div></div>'
      + '<div class="team-stat"><div class="team-stat-val">' + (s.lost || 0) + '</div><div class="team-stat-label">Lost</div></div>'
      + '<div class="team-stat"><div class="team-stat-val">' + (s.reps_active || 0) + '</div><div class="team-stat-label">Reps active</div></div>'
      + '</div>';

    var notable = (d.notable || []).map(function (n) {
      var attribution = [n.rep ? escapeHtml(n.rep) : null, n.call_title ? '\u201C' + escapeHtml(n.call_title) + '\u201D' : null]
        .filter(Boolean).join(' \u00B7 ');
      var clip = n.clip ? ' <a class="review-why-clip" href="' + escapeHtml(n.clip) + '" target="_blank" rel="noopener">\u25B6 Play clip</a>' : '';
      return '<div class="digest-notable"><div>' + escapeHtml(n.text || '') + '</div>'
        + (attribution || clip ? '<div class="meta">' + attribution + clip + '</div>' : '') + '</div>';
    }).join('');

    return chips
      + '<div class="meta">' + escapeHtml(d.date || '') + (d.quiet ? ' \u00B7 quiet day' : '') + '</div>'
      + stats
      + '<div class="digest-summary">' + escapeHtml(d.summary || '') + '</div>'
      + notable
      + (d.focus ? '<div class="digest-focus"><div class="digest-focus-label">Today\'s focus</div>' + escapeHtml(d.focus) + '</div>' : '');
  }

  function selectDigestDate(dt) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(dt)) return;
    state.teamDigestDate = dt;
    state.teamDigest = null;
    renderTeamView();
  }

  // ─── URL hash routing ──────────────────────────────────────────────────────
  // Persist the active view in the URL hash so refresh / deep-link / back-forward
  // restore it. The ?user= admin pivot stays in the query string, untouched.
  //   overview         → (no hash)      call-library     → #calls
  //   objections-intel → #objections    call-review      → #call/<id>
  // (Dormant Live-Sessions drills carry no hash — they're unreachable today.)
  function viewToHashPath() {
    if (state.view === 'call-library')     return 'calls';
    if (state.view === 'objections-intel') return 'objections';
    if (state.view === 'kb')               return 'kb';
    if (state.view === 'eod')              return 'eod';
    if (state.view === 'account')          return 'account';
    if (state.view === 'team')             return 'team';
    if (state.view === 'call-review')      return state.selectedCallId ? 'call/' + encodeURIComponent(state.selectedCallId) : 'calls';
    return ''; // overview + dormant drills
  }
  // Point the URL at the current view. pushState/replaceState do NOT fire
  // hashchange, so this never re-enters the router below (no navigation loop).
  function syncHashFromState(replace) {
    var path = viewToHashPath();
    if ((window.location.hash || '').replace(/^#/, '') === path) return; // already correct
    var url = window.location.pathname + window.location.search + (path ? '#' + path : '');
    if (replace) window.history.replaceState(null, '', url);
    else window.history.pushState(null, '', url);
  }
  // URL hash → state.view (+ selectedCallId). No render, no history write.
  function applyHashToState() {
    var h = (window.location.hash || '').replace(/^#/, '');
    if (h === 'calls') { state.view = 'call-library'; }
    else if (h === 'eod') { state.view = 'eod'; }
    else if (h === 'account') { state.view = 'account'; }
    else if (h === 'objections') { state.view = 'objections-intel'; }
    else if (h === 'team') { state.view = 'team'; }
    else if (h === 'kb') { state.view = canAccessKb() ? 'kb' : 'overview'; }
    else if (h.indexOf('call/') === 0) {
      var id = h.slice(5);
      state.selectedCallId = id ? decodeURIComponent(id) : null;
      state.view = state.selectedCallId ? 'call-review' : 'call-library';
    } else { state.view = 'overview'; }
  }
  // Back/forward (and manual hash edits) fire hashchange but NOT our own
  // pushState calls, so restoring here can't loop. call-review is the only view
  // that doesn't self-load, so kick its fetch explicitly.
  function onRouteChange() {
    if (!state.me) return; // not booted yet — init() handles the initial hash
    applyHashToState();
    render();
    if (state.view === 'call-review' && state.selectedCallId) loadCallReview(state.selectedCallId);
    window.scrollTo({ top: 0, behavior: 'auto' });
  }
  window.addEventListener('hashchange', onRouteChange);

  // ═══ Account view (#account, Stage 5) ════════════════════════════════════
  // Profile (name edits — managed lock applies), Password (all users —
  // exempt from the lock by ruling), Offer (link to KB, never a second
  // editor), Billing (badge + provider-keyed action slot; dead-ends to a
  // contact-admin mailto until billing_provider is set by a future
  // integration stage).
  function goAccount() { setView('account'); }

  async function loadAccount() {
    if (state.accountLoading) return;
    state.accountLoading = true;
    try {
      var res = await fetch('/me/account', { headers: authHeader() });
      if (res.status === 401) { clearSession(); window.location.replace('/login'); return; }
      if (!res.ok) throw new Error('HTTP ' + res.status);
      state.account = await res.json();
    } catch (err) {
      state.account = { _error: err.message || 'unknown' };
    }
    state.accountLoading = false;
    if (state.view === 'account') renderAccountView();
  }

  async function saveAccountNames() {
    var note = document.getElementById('acctSaveNote');
    var body = {
      first_name: document.getElementById('acctFirst').value,
      last_name: document.getElementById('acctLast').value,
    };
    try {
      var res = await fetch('/me/account', {
        method: 'PATCH',
        headers: Object.assign({ 'Content-Type': 'application/json' }, authHeader()),
        body: JSON.stringify(body),
      });
      var data = null; try { data = await res.json(); } catch (e) {}
      if (!res.ok) { note.textContent = (data && data.error) || 'Save failed'; note.style.color = 'var(--bad)'; return; }
      note.textContent = '✓ Saved'; note.style.color = 'var(--good)';
      if (state.account) { state.account.first_name = body.first_name; state.account.last_name = body.last_name; }
      setTimeout(function () { if (note) note.textContent = ''; }, 3000);
    } catch (e) { note.textContent = 'Could not reach server'; note.style.color = 'var(--bad)'; }
  }

  async function changePassword() {
    var note = document.getElementById('pwChangeNote');
    var cur = document.getElementById('pwCurrent').value;
    var n1 = document.getElementById('pwNew').value;
    var n2 = document.getElementById('pwNew2').value;
    note.style.color = 'var(--bad)';
    if (!cur) { note.textContent = 'Enter your current password.'; return; }
    if (n1.length < 10) { note.textContent = 'New password must be at least 10 characters.'; return; }
    if (n1 !== n2) { note.textContent = "Those passwords don't match."; return; }
    try {
      var res = await fetch('/auth/change-password', {
        method: 'POST',
        headers: Object.assign({ 'Content-Type': 'application/json' }, authHeader()),
        body: JSON.stringify({ current_password: cur, new_password: n1 }),
      });
      var data = null; try { data = await res.json(); } catch (e) {}
      if (!res.ok) { note.textContent = (data && data.error) || 'Could not change the password.'; return; }
      note.textContent = '✓ Password changed'; note.style.color = 'var(--good)';
      document.getElementById('pwCurrent').value = '';
      document.getElementById('pwNew').value = '';
      document.getElementById('pwNew2').value = '';
      setTimeout(function () { if (note) note.textContent = ''; }, 4000);
    } catch (e) { note.textContent = 'Could not reach server'; }
  }

  function acctRow(label, inner) {
    return '<div class="eod-row"><div class="eod-label">' + label + '</div>' + inner + '</div>';
  }

  function renderAccountView() {
    var content = document.getElementById('content');
    if (state.account === null && !state.accountLoading) loadAccount();
    var a = state.account;
    if (!a) { content.innerHTML = '<div class="section fade-in"><div class="skeleton" style="height:160px;"></div></div>'; return; }
    if (a._error) { content.innerHTML = '<div class="section fade-in"><div class="error">Could not load account: ' + escapeHtml(a._error) + '</div></div>'; return; }

    var managedNotice = '<div class="acct-notice">Your account is managed by your admin — ask them to make changes.</div>';

    // Profile
    var profileBody;
    if (a.is_managed) {
      profileBody = acctRow('Name', '<div>' + escapeHtml([a.first_name, a.last_name].filter(Boolean).join(' ') || '—') + '</div>') + managedNotice;
    } else {
      profileBody = acctRow('First name', '<input type="text" class="eod-input" id="acctFirst" value="' + escapeHtml(a.first_name || '') + '">')
        + acctRow('Last name', '<input type="text" class="eod-input" id="acctLast" value="' + escapeHtml(a.last_name || '') + '">')
        + '<div class="eod-row"><div class="eod-label"></div><div><button class="btn-fathom-secondary" type="button" onclick="saveAccountNames()">Save</button><span class="acct-save-note" id="acctSaveNote"></span></div></div>';
    }
    profileBody += acctRow('Email', '<div>' + escapeHtml(a.email || '') + ' <span class="meta">· to change your email, contact your admin</span></div>');

    // Password — all users (exempt from the managed lock by ruling)
    var passwordBody =
        acctRow('Current', '<input type="password" class="eod-input" id="pwCurrent" autocomplete="current-password">')
      + acctRow('New', '<input type="password" class="eod-input" id="pwNew" autocomplete="new-password" placeholder="At least 10 characters">')
      + acctRow('Confirm', '<input type="password" class="eod-input" id="pwNew2" autocomplete="new-password">')
      + '<div class="eod-row"><div class="eod-label"></div><div><button class="btn-fathom-secondary" type="button" onclick="changePassword()">Change password</button><span class="acct-save-note" id="pwChangeNote"></span></div></div>';

    // Offer — link to the KB, never a second editor
    var offerBody = a.is_managed
      ? '<div class="acct-notice">Your offer materials and knowledge base are managed by your admin.</div>'
      : '<div class="acct-notice" style="display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap;">'
        + '<span>Your offer docs, scripts, and winning calls live in your Knowledge Base — they ground your call grading.</span>'
        + '<button class="btn-fathom-secondary" type="button" onclick="goKb()">Open Knowledge Base →</button></div>';

    // Billing — badge + provider-keyed action slot
    var b = a.billing || {};
    var badge = '<span class="badge badge-billing-' + escapeHtml(b.status || 'trial') + '">' + escapeHtml((b.status || 'trial').replace('_', ' ')) + '</span>';
    var planRow = b.plan ? acctRow('Plan', '<div>' + escapeHtml(b.plan) + '</div>') : '';
    // Future integration stage: when billing.provider is non-NULL, this slot
    // becomes the provider's customer-portal link. Until then it dead-ends to
    // the admin, by design.
    var billingAction = b.provider
      ? '<a class="btn-fathom-secondary" href="#" onclick="return false;">Manage billing</a>'
      : '<a class="btn-fathom-secondary" href="mailto:justin@scoutsystems.io?subject=Scout%20billing" style="text-decoration:none;">Billing is handled by your admin — contact us</a>';
    var billingBody = acctRow('Status', '<div>' + badge + '</div>') + planRow
      + '<div class="eod-row"><div class="eod-label"></div><div>' + billingAction + '</div></div>';

    content.innerHTML =
        '<div class="section fade-in"><div class="section-header"><h2>Profile</h2></div>' + profileBody + '</div>'
      + '<div class="section fade-in"><div class="section-header"><h2>Password</h2></div>' + passwordBody + '</div>'
      + '<div class="section fade-in"><div class="section-header"><h2>Offer</h2></div>' + offerBody + '</div>'
      + '<div class="section fade-in"><div class="section-header"><h2>Billing</h2></div>' + billingBody + '</div>';
  }

  // ═══ EOD Report view ═══════════════════════════════════════════════════
  // Per-user daily report: analysis-prefilled, inline-editable (edits persist
  // via PUT /eod/edit and always win over analysis), copy-for-Slack plain
  // text. "Today" is the ET calendar day (server-side default).
  function goEod() { setView('eod'); }

  async function loadEod() {
    if (state.eodLoading) return;
    state.eodLoading = true;
    try {
      var qs = state.eodDate ? '?date=' + encodeURIComponent(state.eodDate) : '';
      var res = await fetch('/eod' + qs, { headers: authHeader() });
      if (res.status === 401) { clearSession(); window.location.replace('/login'); return; }
      if (!res.ok) throw new Error('HTTP ' + res.status);
      state.eodData = await res.json();
      if (!state.eodDate) state.eodDate = state.eodData.date;
    } catch (err) {
      state.eodData = { _error: err.message || 'unknown' };
    }
    state.eodLoading = false;
    if (state.view === 'eod') renderEodView();
  }

  function eodShiftDay(deltaDays) {
    var d = state.eodDate || (state.eodData && state.eodData.date);
    if (!d) return;
    var parts = d.split('-').map(Number);
    var next = new Date(Date.UTC(parts[0], parts[1] - 1, parts[2]) + deltaDays * 86400000).toISOString().slice(0, 10);
    eodSetDate(next);
  }
  function eodSetDate(dateStr) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) return;
    state.eodDate = dateStr;
    state.eodData = null;
    renderEodView();
  }
  function eodToday() { state.eodDate = null; state.eodData = null; renderEodView(); }

  // Inline edit: save on change. Empty string is a deliberate clear-to-blank
  // (still an override); we never send null from the UI (no un-override
  // affordance yet — analysis values remain visible by clearing the row's edit
  // via support if ever needed).
  async function eodSaveField(callId, field, el) {
    var value = el.value;
    try {
      var res = await fetch('/eod/edit', {
        method: 'PUT',
        headers: Object.assign({ 'Content-Type': 'application/json' }, authHeader()),
        body: JSON.stringify({ call_id: callId, field: field, value: value }),
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      el.classList.add('edited');
      // update local state so a re-render (or Slack copy) uses the new value
      var call = ((state.eodData && state.eodData.calls) || []).find(function (c) { return c.call_id === callId; });
      if (call) { call.fields[field] = value; call.edited[field] = true; }
    } catch (err) {
      alert('Could not save edit: ' + (err.message || 'unknown'));
    }
  }

  function eodCashDisplay(v) {
    var n = parseFloat(v);
    if (isNaN(n)) return String(v == null ? '0' : v);
    return n % 1 === 0 ? String(n) : n.toFixed(2);
  }
  // (EOD Payment row removed by product ruling 2026-07-22 — the outcome
  // prefill now carries the composed "Closed - PIF" style label server-side.)
  function eodOutcomeLabel(oc) {
    if (oc === 'closed') return 'Closed';
    if (oc === 'follow_up') return 'Follow-up';
    if (oc === 'lost') return 'Lost';
    if (oc === 'no_show') return 'No-show';
    return oc || 'Unknown';
  }

  // Plain text for Slack — EXACT field order per spec: prospect name, outcome,
  // Fathom link, cash collected, brief summary. All calls, one paste.
  function eodSlackText() {
    var d = state.eodData;
    if (!d || !Array.isArray(d.calls)) return '';
    var lines = ['EOD Report — ' + d.date, ''];
    if (d.calls.length === 0) lines.push('No calls today.');
    d.calls.forEach(function (c, i) {
      var f = c.fields;
      lines.push(f.prospect_name || 'Unknown prospect');
      lines.push('Outcome: ' + eodOutcomeLabel(f.outcome));
      lines.push('Call: ' + (c.recording_url || '—'));
      lines.push('Cash collected: $' + eodCashDisplay(f.cash_collected));
      lines.push('Summary: ' + (f.summary || '—'));
      if (i < d.calls.length - 1) lines.push('');
    });
    return lines.join('\n');
  }

  async function eodCopyForSlack() {
    var text = eodSlackText();
    var note = document.getElementById('eodCopyNote');
    try {
      await navigator.clipboard.writeText(text);
      if (note) { note.textContent = 'Copied ✓'; setTimeout(function () { if (note) note.textContent = ''; }, 2500); }
    } catch (err) {
      // clipboard API can fail on some setups — fall back to a prompt
      window.prompt('Copy the report below:', text);
    }
  }

  function renderEodView() {
    var content = document.getElementById('content');
    if (state.eodData === null && !state.eodLoading) loadEod();
    var d = state.eodData;
    var dateVal = state.eodDate || (d && d.date) || '';

    var toolbar = '<div class="eod-toolbar">'
      + '<button class="btn-fathom-secondary" type="button" onclick="eodShiftDay(-1)">← Prev day</button>'
      + '<input type="date" value="' + escapeHtml(dateVal) + '" onchange="eodSetDate(this.value)">'
      + '<button class="btn-fathom-secondary" type="button" onclick="eodShiftDay(1)">Next day →</button>'
      + '<button class="btn-fathom-secondary" type="button" onclick="eodToday()">Today</button>'
      + '<button class="btn-fathom-secondary" type="button" onclick="eodCopyForSlack()">📋 Copy for Slack</button>'
      + '<span class="eod-copy-note" id="eodCopyNote"></span>'
      + '</div>';

    var body;
    if (!d) body = '<div class="skeleton" style="height:120px;"></div>';
    else if (d._error) body = '<div class="error">Could not load EOD report: ' + escapeHtml(d._error) + '</div>';
    else if (!d.calls || d.calls.length === 0) {
      body = '<div class="empty"><h3>No calls on ' + escapeHtml(d.date || '') + '</h3><p>Days without calls have nothing to report — pick another day above.</p></div>';
    } else {
      body = d.calls.map(function (c) {
        var f = c.fields, e = c.edited || {};
        function row(label, field, value, isArea) {
          var cls = (isArea ? 'eod-textarea' : 'eod-input') + (e[field] ? ' edited' : '');
          var dot = e[field] ? ' <span class="eod-edited-dot">● edited</span>' : '';
          var handler = ' onchange="eodSaveField(\'' + c.call_id + '\', \'' + field + '\', this)"';
          var inner = isArea
            ? '<textarea class="' + cls + '"' + handler + '>' + escapeHtml(value == null ? '' : String(value)) + '</textarea>'
            : '<input type="text" class="' + cls + '" value="' + escapeHtml(value == null ? '' : String(value)) + '"' + handler + '>';
          return '<div class="eod-row"><div class="eod-label">' + label + dot + '</div>' + inner + '</div>';
        }
        var link = c.recording_url
          ? '<a class="review-fathom-link" href="' + escapeHtml(c.recording_url) + '" target="_blank" rel="noopener">View in Fathom →</a>'
          : '<span class="meta">no recording link</span>';
        var pendingNote = (c.analysis_status && c.analysis_status !== 'done')
          ? '<span class="meta"> · analysis ' + escapeHtml(c.analysis_status) + ' — prefills may update</span>' : '';
        return '<div class="eod-call">'
          + '<div class="eod-row"><div class="eod-label">Call</div><div>' + link + pendingNote + '</div></div>'
          + row('Prospect', 'prospect_name', f.prospect_name)
          + row('Outcome', 'outcome', f.outcome)
          + row('Cash ($)', 'cash_collected', f.cash_collected)
          + row('Summary', 'summary', f.summary, true)
          + '</div>';
      }).join('');
    }

    content.innerHTML = '<div class="section fade-in">'
      + '<div class="section-header"><h2>EOD Report</h2>'
      + '<div class="meta">your calls for the day — edit inline, then copy for Slack</div></div>'
      + toolbar + body + '</div>';
  }

  // ═══ Knowledge Base view (relocated from admin.html — same ids, same JS) ═══
  // KB access: manager, owner, or an UNMANAGED plain user. Single source of
  // truth for the nav link + the #kb hash guard. (Server enforces it too.)
  function canAccessKb() {
    return !!(state.me && (state.me.role === 'manager' || state.me.role === 'owner'
      || (state.me.role === 'user' && !state.me.is_managed)));
  }
  function goKb() { setView('kb'); }
  var relativeTime = (typeof formatRelativeTime === 'function') ? formatRelativeTime : function (x) { return x; };
  function renderKbView() {
    var content = document.getElementById('content');
    content.innerHTML =
      '<div class="page-header fade-in"><div class="page-header-main"><h1>Knowledge Base</h1>'
        + '<div class="review-meta-row"><span>Offer docs &amp; scripts that ground coaching</span></div></div>'
        + '<div class="page-header-side"><button class="kb-add-btn" onclick="openKbModal()">+ Add resource</button></div></div>'
      + '<div class="section fade-in"><div id="kbContainer"><div class="load-spinner"><div class="spinner"></div></div></div></div>';
    loadKbList(); // lazy — only on view entry, never on page init
  }
  async function loadKbList() {
    var container = document.getElementById('kbContainer');
    if (!container) return;
    var res;
    try {
      res = await fetch('/kb/list', { headers: authHeader() });
    } catch (err) {
      container.innerHTML = '<div class="msg-error">Could not reach server.</div>';
      return;
    }
    if (res.status === 401) { clearSession(); window.location.replace('/login'); return; }
    if (!res.ok) {
      var err;
      try { err = await res.json(); } catch (e) { err = { error: 'HTTP ' + res.status }; }
      container.innerHTML = '<div class="msg-error">' + escapeHtml(err.error || 'Failed to load uploads') + '</div>';
      return;
    }
    var data = await res.json();
    renderKbList((data && data.uploads) || []);
  }

  function renderKbList(items) {
    var container = document.getElementById('kbContainer');
    if (!container) return;

    if (!items || items.length === 0) {
      container.innerHTML =
        '<div class="empty-card">'
          + '<h2>No knowledge base resources yet</h2>'
          + '<p>Upload sales scripts, product info, FAQs, or any reference material. Scout will pull from these during live calls.</p>'
          + '<button class="kb-add-btn" onclick="openKbModal()">+ Add your first resource</button>'
        + '</div>';
      return;
    }

    var parts = ['<div class="kb-list">'];
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      var typeBadge = it.source_type
        ? '<span class="kb-badge kb-type-' + escapeHtml(it.source_type) + '">' + escapeHtml(it.source_type) + '</span>'
        : '';
      // Category badge — only when category is set (pre-feature uploads
      // don't have it). Friendly labels rather than the raw enum value.
      var catLabels = {
        script: 'Script',
        offer_document: 'Offer info',
        objection_framework: 'Objection handling framework',
        winning_call: 'Winning call transcript',
        case_study: 'Case study / social proof',
        training_material: 'Training material',
      };
      var catBadge = (it.category && catLabels[it.category])
        ? '<span class="kb-badge kb-cat-' + escapeHtml(it.category) + '">' + escapeHtml(catLabels[it.category]) + '</span>'
        : '';
      // Scope badge stays on admin: admins see uploads with mixed scopes
      // (own personal/team plus their team members') so the badge tells
      // them which is which. Dashboard hides it because users only ever
      // see their own personal uploads.
      var scopeBadge = it.scope
        ? '<span class="kb-badge kb-scope-' + escapeHtml(it.scope) + '">' + escapeHtml(it.scope) + '</span>'
        : '';
      var chunkText = it.chunk_count + ' chunk' + (it.chunk_count === 1 ? '' : 's');
      var rel = relativeTime(it.created_at);
      // Only learned_pattern uploads get the expand affordance — other
      // categories are bulk text whose chunks aren't independently useful
      // to surface in a side panel.
      var viewBtn = '';
      var expandPanel = '';
      if (it.category === 'learned_pattern') {
        viewBtn = '<button class="kb-view-btn" data-label="' + escapeHtml(it.source_label) + '" data-slot="' + i + '" onclick="viewKbEntries(this.getAttribute(\'data-label\'), this.getAttribute(\'data-slot\'), this)">View patterns</button>';
        expandPanel = '<div class="kb-expand-panel hidden" id="kbExpand-' + i + '"></div>';
      }
      parts.push(
        '<div class="kb-item">'
          + '<div class="kb-item-main">'
            + '<div class="kb-item-title">' + typeBadge + catBadge + scopeBadge + escapeHtml(it.source_label || '(unlabeled)') + '</div>'
            + '<div class="kb-item-sub">' + chunkText + ' · added ' + rel + '</div>'
          + '</div>'
          + viewBtn
          + '<button class="kb-delete-btn" data-label="' + escapeHtml(it.source_label) + '" onclick="deleteKbItem(this.getAttribute(\'data-label\'))">Delete</button>'
        + '</div>'
        + expandPanel
      );
    }
    parts.push('</div>');
    container.innerHTML = parts.join('');
  }

  async function deleteKbItem(sourceLabel) {
    if (!sourceLabel) return;
    var ok = window.confirm('Delete "' + sourceLabel + '"?\n\nThis removes all chunks for this resource. Cannot be undone.');
    if (!ok) return;

    var res;
    try {
      res = await fetch('/kb/' + encodeURIComponent(sourceLabel), {
        method: 'DELETE',
        headers: authHeader(),
      });
    } catch (err) {
      window.alert('Could not reach server: ' + err.message);
      return;
    }
    if (res.status === 401) { clearSession(); window.location.replace('/login'); return; }
    if (!res.ok) {
      var err;
      try { err = await res.json(); } catch (e) { err = { error: 'HTTP ' + res.status }; }
      window.alert('Delete failed: ' + (err.error || 'unknown error'));
      return;
    }
    await loadKbList();
  }

  function openKbModal() {
    var modal = document.getElementById('kbModal');
    if (!modal) return;
    // Reset form state every time the modal opens — switching to URL tab,
    // clearing inputs, resetting category to default, hiding any leftover
    // error from a previous attempt.
    switchKbTab('url');
    var ids = ['kbLabel','kbUrlInput','kbPdfInput','kbPasteInput'];
    for (var i = 0; i < ids.length; i++) {
      var el = document.getElementById(ids[i]);
      if (el) el.value = '';
    }
    var cat = document.getElementById('kbCategory');
    if (cat) cat.value = 'offer_document';
    setKbStatus('', '');
    var submit = document.getElementById('kbSubmit');
    if (submit) { submit.disabled = false; submit.textContent = 'Add to Knowledge Base'; }
    modal.classList.remove('hidden');
  }

  function closeKbModal() {
    var modal = document.getElementById('kbModal');
    if (modal) modal.classList.add('hidden');
  }

  function switchKbTab(tab) {
    var tabs = document.querySelectorAll('#kbModal .kb-tab');
    for (var i = 0; i < tabs.length; i++) {
      var t = tabs[i];
      if (t.getAttribute('data-tab') === tab) t.classList.add('active');
      else t.classList.remove('active');
    }
    var panels = document.querySelectorAll('#kbModal .kb-tab-panel');
    for (var j = 0; j < panels.length; j++) {
      var p = panels[j];
      if (p.getAttribute('data-panel') === tab) p.classList.remove('hidden');
      else p.classList.add('hidden');
    }
    setKbStatus('', '');
  }

  function setKbStatus(message, kind) {
    var el = document.getElementById('kbStatus');
    if (!el) return;
    el.textContent = message || '';
    el.classList.remove('error', 'progress');
    if (kind === 'error') el.classList.add('error');
    else if (kind === 'progress') el.classList.add('progress');
  }

  function getActiveKbTab() {
    var active = document.querySelector('#kbModal .kb-tab.active');
    return active ? active.getAttribute('data-tab') : 'url';
  }

  async function submitKbUpload() {
    var tab = getActiveKbTab();
    var label = (document.getElementById('kbLabel').value || '').trim();
    var category = (document.getElementById('kbCategory').value || 'offer_document');

    // Label is required for every type now — it's what shows in the list
    // and what Claude references in [WINNING CALL: …] / [OFFER DOCUMENT: …]
    // context lines, so a meaningful name matters more than the source.
    if (!label) { setKbStatus('Give this resource a label.', 'error'); return; }

    var fd = new FormData();
    fd.append('type', tab);
    fd.append('label', label);
    fd.append('category', category);

    if (tab === 'url') {
      var url = (document.getElementById('kbUrlInput').value || '').trim();
      if (!url) { setKbStatus('Enter a URL.', 'error'); return; }
      fd.append('url', url);
    } else if (tab === 'pdf') {
      var fileEl = document.getElementById('kbPdfInput');
      if (!fileEl || !fileEl.files || !fileEl.files[0]) { setKbStatus('Select a PDF file.', 'error'); return; }
      fd.append('file', fileEl.files[0]);
    } else if (tab === 'paste') {
      var text = (document.getElementById('kbPasteInput').value || '').trim();
      if (!text) { setKbStatus('Paste some content.', 'error'); return; }
      fd.append('text', text);
    } else {
      setKbStatus('Pick a tab.', 'error');
      return;
    }

    var submit = document.getElementById('kbSubmit');
    if (submit) { submit.disabled = true; submit.textContent = 'Processing…'; }
    setKbStatus('Processing… this may take a moment for large documents.', 'progress');

    var res;
    try {
      res = await fetch('/kb/upload', {
        method: 'POST',
        headers: authHeader(),
        body: fd,
      });
    } catch (err) {
      setKbStatus('Could not reach server: ' + err.message, 'error');
      if (submit) { submit.disabled = false; submit.textContent = 'Add to Knowledge Base'; }
      return;
    }

    if (res.status === 401) { clearSession(); window.location.replace('/login'); return; }
    if (!res.ok) {
      var errData;
      try { errData = await res.json(); } catch (e) { errData = { error: 'HTTP ' + res.status }; }
      setKbStatus(errData.error || 'Upload failed', 'error');
      if (submit) { submit.disabled = false; submit.textContent = 'Add to Knowledge Base'; }
      return;
    }

    closeKbModal();
    await loadKbList();
  }

  // Per-source-label cache so reopening a panel after first load doesn't
  // refetch. Cleared implicitly on full page reload — short-lived enough
  // that staleness from a delete-then-reopen is impossible (delete already
  // forces loadKbList(), which doesn't touch this cache, but the panel
  // wouldn't re-render anyway because the kb-item is gone).
  var kbEntriesCache = {};

  async function viewKbEntries(sourceLabel, slot, btn) {
    var panel = document.getElementById('kbExpand-' + slot);
    if (!panel) return;

    // Toggle: if currently visible, just collapse. No fetch, button text reverts.
    if (!panel.classList.contains('hidden')) {
      panel.classList.add('hidden');
      btn.textContent = 'View patterns';
      return;
    }

    // Opening
    btn.textContent = 'Hide patterns';
    panel.classList.remove('hidden');

    if (kbEntriesCache[sourceLabel]) {
      renderKbEntries(panel, kbEntriesCache[sourceLabel]);
      return;
    }

    panel.innerHTML = '<div class="kb-pattern-loading">Loading…</div>';
    var res;
    try {
      res = await fetch('/kb/entries/' + encodeURIComponent(sourceLabel), { headers: authHeader() });
    } catch (err) {
      panel.innerHTML = '<div class="kb-pattern-empty">Could not reach server.</div>';
      return;
    }
    if (res.status === 401) { clearSession(); window.location.replace('/login'); return; }
    if (!res.ok) {
      panel.innerHTML = '<div class="kb-pattern-empty">Failed to load patterns.</div>';
      return;
    }
    var data = await res.json();
    var entries = (data && data.entries) || [];
    kbEntriesCache[sourceLabel] = entries;
    renderKbEntries(panel, entries);
  }

  function renderKbEntries(panel, entries) {
    if (!entries || entries.length === 0) {
      panel.innerHTML = '<div class="kb-pattern-empty">No patterns found.</div>';
      return;
    }
    var parts = [];
    for (var i = 0; i < entries.length; i++) {
      var e = entries[i];
      var meta = e.metadata || {};
      // Pattern entries (auto-extracted) carry situation/response/outcome
      // in metadata. Pre-feature uploads or any entry missing those fields
      // fall back to showing raw content text — keeps the panel useful
      // even on legacy data.
      if (meta.situation || meta.response || meta.outcome) {
        var typeRaw = String(meta.type || '');
        var typeLabel = typeRaw.replace(/_/g, ' ');
        var typeClass = typeRaw.replace(/[^a-z_]/g, '');
        var typeBadge = typeClass
          ? '<span class="kb-badge kb-ptype-' + typeClass + '">' + escapeHtml(typeLabel) + '</span>'
          : '';
        parts.push(
          '<div class="kb-pattern-card">'
            + (typeBadge ? '<div>' + typeBadge + '</div>' : '')
            + (meta.situation ? '<div class="kb-pattern-row"><b>Situation:</b> <span class="kb-pattern-text">' + escapeHtml(meta.situation) + '</span></div>' : '')
            + (meta.response  ? '<div class="kb-pattern-row"><b>Closer said:</b> <span class="kb-pattern-text">' + escapeHtml(meta.response) + '</span></div>' : '')
            + (meta.outcome   ? '<div class="kb-pattern-row"><b>Prospect reacted:</b> <span class="kb-pattern-text">' + escapeHtml(meta.outcome) + '</span></div>' : '')
          + '</div>'
        );
      } else {
        parts.push('<div class="kb-pattern-card"><div class="kb-pattern-empty-text">' + escapeHtml(e.content || '(empty)') + '</div></div>');
      }
    }
    panel.innerHTML = parts.join('');
  }

  // Drill 1: Calls — outcome breakdown + per-outcome bars + recent calls list filtered.

  // Drill 2.5: Per-type objection drill. The third-level view: every event
  // of one objection_id, with stats up top + the framework rebuttal pinned
  // for reference + a card per event showing coaching narrative + side-by-side.
  async function renderObjectionTypeDrill() {
    var content = document.getElementById('content');
    var objectionId = state.selectedObjectionId;
    if (!objectionId) { backToOverview(); return; }

    // Loading placeholder
    content.innerHTML = '<div class="drill-header fade-in">'
      + '<button class="back-btn" onclick="backToObjections()">← Back to Objections</button>'
      + '<div class="drill-title">Loading…</div></div>'
      + '<div class="load-state"><div class="spinner"></div></div>';

    var data;
    var cached = state.typeEventsCache[objectionId];
    if (cached) {
      data = cached;
    } else {
      try {
        data = await fetchObjectionsByType(objectionId);
        state.typeEventsCache[objectionId] = data;
      } catch (err) {
        content.innerHTML = '<div class="drill-header"><button class="back-btn" onclick="backToObjections()">← Back</button></div>'
          + '<div class="error">Could not load events: ' + escapeHtml(err.message || 'unknown') + '</div>';
        return;
      }
    }

    var label = data.label || objectionId;
    var t = data.totals;
    var color = COLORS[objectionId] || COLORS.other;
    var pctOver = t.overcome_pct === null ? '—' : t.overcome_pct + '%';
    var pctClass = t.overcome_pct === null ? '' : (t.overcome_pct >= 70 ? 'good' : t.overcome_pct >= 40 ? 'mid' : 'bad');

    // Framework rebuttal — pull from the first event (all share the same rebuttal text)
    var firstWithRebuttal = (data.events || []).find(function(e) { return e.framework_rebuttal; });
    var frameworkRebuttal = firstWithRebuttal ? firstWithRebuttal.framework_rebuttal : null;

    var stats = ''
      + '<div class="type-stat"><div class="stat-label">Total Events</div><div class="stat-value">' + t.total + '</div></div>'
      + '<div class="type-stat"><div class="stat-label">Overcame</div><div class="stat-value good">' + t.overcome + '</div></div>'
      + '<div class="type-stat"><div class="stat-label">Not Overcome</div><div class="stat-value bad">' + t.not_overcome + '</div></div>'
      + '<div class="type-stat"><div class="stat-label">Indeterminate</div><div class="stat-value">' + t.unknown + '</div><div class="stat-sub">transcript unclear</div></div>'
      + '<div class="type-stat"><div class="stat-label">Overcome Rate</div><div class="stat-value ' + pctClass + '">' + escapeHtml(pctOver) + '</div><div class="stat-sub">of definitive</div></div>';

    var frameworkBlock = frameworkRebuttal
      ? '<div class="framework-ref">'
        + '<div class="framework-ref-label">Scout\'s framework rebuttal — use this every time</div>'
        + '<div class="framework-ref-text">"' + escapeHtml(frameworkRebuttal) + '"</div>'
        + '</div>'
      : '';

    var eventsHtml;
    if ((data.events || []).length === 0) {
      eventsHtml = '<div class="empty"><h3>No events in this window</h3><p>No instances of this objection were detected in the selected date range.</p></div>';
    } else {
      eventsHtml = data.events.map(eventCardHtml).join('');
    }

    content.innerHTML = '<div class="drill-header fade-in">'
        + '<button class="back-btn" onclick="backToObjections()">← Back to Objections</button>'
        + '<div class="drill-title">' + escapeHtml(label) + ' <span class="count">' + t.total + '</span></div>'
      + '</div>'
      + '<div class="type-stats-row fade-in">' + stats + '</div>'
      + frameworkBlock
      + '<div class="section fade-in">'
        + '<div class="section-header"><h2>Every event</h2>'
        + '<div class="meta">' + t.total + (t.total === 1 ? ' instance' : ' instances') + ' in window</div></div>'
        + eventsHtml
      + '</div>';
  }

  async function fetchObjectionsByType(objectionId) {
    var url = isSelf()
      ? '/me/objections?objection_id=' + encodeURIComponent(objectionId)
        + '&from=' + encodeURIComponent(state.dateRange.from) + '&to=' + encodeURIComponent(state.dateRange.to)
      : '/admin/objections/' + encodeURIComponent(state.viewingUserId)
        + '?objection_id=' + encodeURIComponent(objectionId)
        + '&from=' + encodeURIComponent(state.dateRange.from) + '&to=' + encodeURIComponent(state.dateRange.to);
    var res = await fetch(url, { headers: authHeader() });
    if (res.status === 401) { clearSession(); window.location.replace('/login'); throw new Error('unauth'); }
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  }

  // Per-event card for the type drill — call context up top, coaching note,
  // side-by-side framework vs actual, classifier note at bottom.
  function eventCardHtml(e) {
    var prospect = e.prospect_name
      ? '<span class="name">' + escapeHtml(e.prospect_name) + '</span>'
      : '<span class="anon">unknown prospect</span>';
    var dateStr = e.session_started_at ? formatDate(e.session_started_at) : '—';
    var timeStr = e.detected_at ? new Date(e.detected_at).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) : '';
    var sessionOutcome = e.session_outcome
      ? outcomeBadge(e.session_outcome, !!e.session_ended_at)
      : (e.session_ended_at ? '<span class="badge badge-empty">Unmarked</span>' : '<span class="badge badge-live">Live</span>');

    var verdict;
    if (e.overcome === true)       verdict = '<span class="verdict verdict-overcome">Overcame</span>';
    else if (e.overcome === false) verdict = '<span class="verdict verdict-not">Not overcome</span>';
    else                            verdict = '<span class="verdict verdict-unknown">Indeterminate</span>';
    var conf = e.overcome_confidence ? '<span class="verdict-conf">' + escapeHtml(e.overcome_confidence) + ' confidence</span>' : '';

    var coaching = e.coaching_note
      ? '<div class="coaching-note">' + escapeHtml(e.coaching_note) + '</div>'
      : '<div class="coaching-note-empty">No coaching narrative generated for this event.</div>';

    var rebuttal = e.framework_rebuttal
      ? '<div class="compare-text">' + escapeHtml(e.framework_rebuttal) + '</div>'
      : '<div class="compare-text empty">No framework rebuttal recorded.</div>';
    var said = e.closer_response
      ? '<div class="compare-text">' + escapeHtml(e.closer_response) + '</div>'
      : '<div class="compare-text empty">No closer transcript captured in the 60s after this objection.</div>';

    return '<div class="event-card">'
      + '<div class="event-card-head">'

          + '<div class="event-card-title">Call with ' + prospect + '</div>'
          + '<div class="event-card-meta">' + escapeHtml(dateStr) + (timeStr ? ' · objection at ' + escapeHtml(timeStr) : '') + '</div>'

        + '<div class="event-card-right">' + verdict + conf + sessionOutcome + '</div>'
      + '</div>'
      + coaching
      + '<div class="compare-grid">'
        + '<div class="compare-pane framework"><div class="compare-label">Scout suggested</div>' + rebuttal + '</div>'
        + '<div class="compare-pane actual"><div class="compare-label">What you said</div>' + said + '</div>'

  // ──────────────────────────────────────────────────────────────────
  // Helpers
  // ──────────────────────────────────────────────────────────────────
  function formatDate(iso) {
    if (!iso) return '—';
    var d = new Date(iso);
    var month = d.toLocaleDateString('en-US', { month: 'short' });
    var day = d.getDate();
    var year = d.getFullYear();
    var today = new Date().getFullYear();
    return year === today ? month + ' ' + day : month + ' ' + day + ', ' + year;
  }

  function formatDuration(seconds) {
    if (!seconds && seconds !== 0) return '—';
    if (seconds < 60) return seconds + 's';
    var m = Math.floor(seconds / 60);
    var s = seconds % 60;
    return m + 'm' + (s > 0 ? ' ' + s + 's' : '');
  }

  // ──────────────────────────────────────────────────────────────────
  // Call Library (Scout v2.0 Phase 2 Step 3)
  //
  // The Calls nav item opens this top-level view. It shows a paginated
  // list of the caller's synced Fathom calls with each call's analysis
  // state surfaced as a status badge. Clicking a card currently shows a
  // "coming soon" notice via the existing fathomNotice flash; the full
  // call review page is the next step (Phase 2 Step 4) and will replace
  // the click handler with a real navigation.
  // ──────────────────────────────────────────────────────────────────

  // Date formatter for the library cards: always "Jun 23, 2026" form (with
  // year) per the brief, even when the date is in the current calendar
  // year. Differs from formatDate above which omits the year for current.
  function formatNaturalDate(iso) {
    if (!iso) return '—';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '—';
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  }

  // Duration formatter for the library cards: "57m" or "1h 23m" per the
  // brief, no seconds. Null/invalid → "—". Differs from formatDuration
  // above which keeps seconds for short calls.
  function formatNaturalDuration(seconds) {
    if (seconds === null || seconds === undefined) return '—';
    if (typeof seconds !== 'number' || isNaN(seconds) || seconds < 0) return '—';
    var hours = Math.floor(seconds / 3600);
    var minutes = Math.floor((seconds % 3600) / 60);
    if (hours > 0) return hours + 'h ' + minutes + 'm';
    return minutes + 'm';
  }

  // throw-on-failure pattern matching fetchAnalytics/fetchPatterns/fetchCalls.
  async function fetchCallLibrary(offset, limit) {
    var params = ['limit=' + (limit || 20), 'offset=' + (offset || 0)];
    var drilling = !!(state.callLibraryFilter || state.callLibrarySort);
    if (state.callLibraryFilter) params.push('filter=' + encodeURIComponent(state.callLibraryFilter));
    if (state.callLibrarySort)   params.push('sort=' + encodeURIComponent(state.callLibrarySort));
    // A drill matches its donut's date window; the nav entry (no filter) shows all.
    if (drilling && state.dateRange) {
      params.push('from=' + encodeURIComponent(state.dateRange.from));
      params.push('to=' + encodeURIComponent(state.dateRange.to));
    }
    var base = isSelf() ? '/fathom/calls' : '/admin/fathom-calls/' + encodeURIComponent(state.viewingUserId);
    var res = await fetch(base + '?' + params.join('&'), { headers: authHeader() });
    if (res.status === 401) { clearSession(); window.location.replace('/login'); throw new Error('unauth'); }
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  }

  // Enter the Call Library from the nav — clears any drill filter (shows all).
  function goCallLibrary() {
    state.callLibraryFilter = null;
    state.callLibrarySort = null;
    state.callLibrary = null;
    state.callLibraryOffset = 0;
    state.callLibraryError = null;
    setView('call-library');
  }

  // Enter the Call Library from a coaching donut — applies a filter/sort so the
  // drill shows only the relevant calls (matching the donut's date window).
  function drillCalls(filter, sort) {
    state.callLibraryFilter = filter || null;
    state.callLibrarySort = sort || null;
    state.callLibrary = null;
    state.callLibraryOffset = 0;
    state.callLibraryError = null;
    setView('call-library');
  }

  // Fire-and-forget load. When offset=0, replaces state.callLibrary; on
  // pagination (offset>0) it concatenates onto the existing list. Re-
  // renders the view automatically when done if still on call-library.
  async function loadCallLibrary(offset) {
    if (state.callLibraryLoading) return; // guard concurrent clicks
    state.callLibraryLoading = true;
    var requestedLimit = 20;
    var startedOffset = offset || 0;
    try {
      var data = await fetchCallLibrary(startedOffset, requestedLimit);
      var calls = (data && data.calls) || [];
      if (startedOffset === 0) {
        state.callLibrary = calls;
      } else {
        state.callLibrary = (state.callLibrary || []).concat(calls);
      }
      state.callLibraryHasMore = calls.length >= requestedLimit;
      state.callLibraryOffset = startedOffset + calls.length;
      state.callLibraryError = null;
    } catch (err) {
      if (err.message === 'unauth') return;
      state.callLibraryError = err.message || 'unknown';
    }
    state.callLibraryLoading = false;
    if (state.view === 'call-library') renderCallLibrary();
  }
