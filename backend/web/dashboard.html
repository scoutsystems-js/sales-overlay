<script>
  // ──────────────────────────────────────────────────────────────────
  // Session / auth — same pattern used across all Scout dashboards.
  // ──────────────────────────────────────────────────────────────────
  var STORAGE_KEY = 'scout_session_v1';
  function getSession() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null'); } catch (e) { return null; } }
  function setSessionStored(s) { localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); }
  // Diagnostics shim → the shared ring buffer/beacon in scout-auth.js.
  function pdiag(e, d, beacon) {
    try {
      if (window.ScoutAuth && ScoutAuth.diag) {
        if (beacon) ScoutAuth.diag.beacon(e, d || null);
        else ScoutAuth.diag.push({ e: e, detail: d || null });
      }
    } catch (x) {}
  }
  // This page's OWN clearSession is the choke point every one of the inline
  // `if (401) { clearSession(); redirect }` handlers passes through. Beacon it
  // with a short stack so the server log shows WHICH handler triggered the
  // logout (page-level path, distinct from scout-auth's own clearSession).
  function clearSession() {
    try {
      var st = ''; try { st = (new Error()).stack || ''; } catch (e) {}
      pdiag('page-clearSession', { stack: st.split('\n').slice(1, 5).join(' || ').slice(0, 400) }, true);
    } catch (e) {}
    localStorage.removeItem(STORAGE_KEY);
  }
  function isSessionValid(s) {
    if (!s || !s.access_token || !s.expires_at) return false;
    // expires_at is UNIX SECONDS (was misread as ms via new Date() → always
    // "expired", forcing a refresh on every load; the shared module in
    // /js/scout-auth.js now owns silent refresh + the 401 retry regardless).
    return (s.expires_at * 1000) > Date.now() + 30 * 1000;
  }
  async function refreshSessionIfNeeded() {
    var s = getSession();
    if (!s || !s.refresh_token) { pdiag('page-refresh-no-token', null, true); return false; }
    try {
      var res = await fetch('/auth/refresh', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ refresh_token: s.refresh_token }) });
      if (!res.ok) { pdiag('page-refresh-not-ok', { status: res.status }, true); return false; }
      var data = await res.json();
      if (!data || !data.session) { pdiag('page-refresh-no-session-body', null, true); return false; }
      setSessionStored({ access_token: data.session.access_token, refresh_token: data.session.refresh_token, expires_at: data.session.expires_at, email: data.session.user && data.session.user.email });
      pdiag('page-refresh-ok');
      return true;
    } catch (e) { pdiag('page-refresh-threw', { err: String(e && e.message || e) }, true); return false; }
  }
  function signOut() { clearSession(); window.location.replace('/login'); }
  function authHeader() {
    var s = getSession();
    return s && s.access_token ? { Authorization: 'Bearer ' + s.access_token } : {};
  }

  function escapeHtml(s) {
    if (s === null || s === undefined) return '';
    return String(s).replace(/[&<>"']/g, function(c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]); });
  }

  // ──────────────────────────────────────────────────────────────────
  // State
  // ──────────────────────────────────────────────────────────────────
  var state = {
    me:              null,    // { user_id, email, role }
    users:           [],      // populated for admin/owner
    viewingUserId:   null,    // whose data we're showing
    dateRange:      { from: null, to: null, days: 30 },
    view:           'overview', // 'overview' | 'calls' | 'objections' | 'closes' | 'objection-type'
    overviewMode:    'coaching', // 'coaching' (call_analyses, default) | 'sessions' (call_sessions, desktop-era)
    analytics2:      null,    // last /me/analytics2 (Fathom-era) response
    objectionsIntel: null,    // last /me/objections-intel response (Objections view)
    objectionsIntelLoading: false,
    objectionsSynthesis: null, // last /me/objections-synthesis ({available,categories} | {available:false})
    objectionsSynthesisLoading: false,
    perfSynthesis: null,       // last /me/performance-synthesis ({available,working,improve} | {available:false})
    perfSynthesisLoading: false,
    // ── Team (manager) view ──
    teamContext:    null,   // /team/context: {role, is_owner, has_reps, teams}
    teamSelected:   null,   // owner picker: team key ('all' | managerId) or null=default
    teamTrendBucket:'week',
    teamOverview:   null,   teamOverviewLoading: false,
    teamTrends:     null,   teamTrendsLoading: false,
    teamRecs:       null,   teamRecsLoading: false,
    teamHighlights: null,   teamHighlightsLoading: false,
    teamDigest:     null,   teamDigestLoading: false,   teamDigestDate: null,
    eodData:        null,   eodLoading: false,   eodDate: null,   // EOD Report view
    account:        null,   accountLoading: false,   // Account view (#account)
    analytics:       null,    // last /me/analytics response
    patterns:        null,    // last /me/coaching/patterns response
    calls:           [],      // list from /me/sessions
    objectionsCache: {},      // session_id -> objection rows
    typeEventsCache: {},      // objection_id -> response from /me/objections
    selectedObjectionId: null, // when view === 'objection-type'
    expandedCallId:  null,
    chart1:          null,
    chart2:          null,
    chart3:          null,
    chartDrill:      null,
    chartType:       null,
    // Fathom integration (Scout v2.0 Phase 1)
    fathomStatus:    null,    // null until /fathom/status fetch completes; then { connected: bool, ... }
    fathomNotice:    null,    // null | { kind: 'success'|'warn'|'error', text: string } — flash message above the section
    fathomSyncing:   false,   // true while a /fathom/sync request is in flight; drives spinner state
    fathomReanalyzing: false, // true while a /fathom/reanalyze request is in flight; drives the Reanalyze button spinner
    fathomUpdating: false, // true while a /fathom/update-analyses request is in flight; drives the Update-analyses button spinner
    fathomNeedsIdentity: false,   // true when sync returned needs_identity — show the Fathom-email prompt in the strip
    fathomIdentitySuggestion: '', // pre-fill value for the identity input (stored email, else top suggestion)
    fathomIdentitySuggestions: [],// [{email,name,count}] distinct recorded_by identities from Fathom, most frequent first
    fathomIdentitySaving: false,  // true while POST /fathom/identity is in flight
    // Call Library (Scout v2.0 Phase 2 Step 3)
    callLibrary:        null,  // null pre-load, then array of call rows from /fathom/calls
    callLibraryLoading: false, // gates "Load more" button while a fetch is in flight
    callLibraryHasMore: false, // true if the last page returned === limit (more might exist)
    callLibraryOffset:  0,     // total rows fetched so far; next "Load more" uses this as offset
    callLibraryFilter:  null,  // drill filter: 'analyzed' | 'objections' | null (nav = all)
    callLibrarySort:    null,  // drill sort: 'score' | null
    callLibraryError:   null,  // last fetch error message; cleared on successful re-fetch
    // Call Review (Scout v2.0 Phase 2 Step 4)
    selectedCallId:     null,  // public.fathom_calls(id) UUID of the call being reviewed
    callReview:         null,  // null pre-load, then the GET /fathom/calls/:id response
    callReviewLoading:  false, // gates retry click while a fetch is in flight
    callReviewError:    null,  // last fetch error message; cleared on successful re-fetch
    expandedGradeCards: {},    // map of section key ('intro'|'discovery'|...) → true when expanded
    followupCopied:     false, // transient "Copied!" feedback flag (set true, render, then false 2s later)
  };

  // ──────────────────────────────────────────────────────────────────
  // Init
  // ──────────────────────────────────────────────────────────────────
  async function init() {
    // ─── Fathom OAuth popup handoff (must run BEFORE any auth/render so the
    // popup closes quickly without flashing the dashboard inside it). ───
    // When the Fathom OAuth callback redirects the popup to
    // /dashboard?fathom=connected (or denied/error), this code path detects
    // we're in a popup, notifies the opener via postMessage, and closes.
    // Direct visits to /dashboard?fathom=* (no opener) fall through to the
    // normal init flow — the param is handled later in this function.
    var initialParams = new URLSearchParams(window.location.search);
    var fathomParam = initialParams.get('fathom');
    if (fathomParam && window.opener && window.opener !== window) {
      try {
        window.opener.postMessage(
          { type: 'scout-fathom-done', kind: fathomParam },
          window.location.origin
        );
      } catch (e) { /* same-origin only — silent fail is fine */ }
      window.close();
      return;
    }

    // ─── postMessage listener (parent window only) — receives the popup's
    // success/denied/error signal, sets the notice, reloads Fathom status. ───
    window.addEventListener('message', function(e) {
      // Same-origin check — both popup and parent are on this domain.
      if (e.origin !== window.location.origin) return;
      if (!e.data || e.data.type !== 'scout-fathom-done') return;
      handleFathomDoneSignal(e.data.kind);
    });

    pdiag('page-init-start', { snapshot: (window.ScoutAuth && ScoutAuth.diag) ? ScoutAuth.diag.snapshot() : null });
    var s = getSession();
    if (!isSessionValid(s)) {
      if (s && s.refresh_token) {
        var ok = await refreshSessionIfNeeded();
        if (!ok) { pdiag('page-init-redirect', { reason: 'boot-refresh-failed' }, true); window.location.replace('/login'); return; }
      } else { pdiag('page-init-redirect', { reason: 'no-valid-session-no-refresh-token' }, true); window.location.replace('/login'); return; }
    }
    var cur = getSession();
    document.getElementById('signedInEmail').textContent = (cur && cur.email) || '';

    state.me = await fetchMe();
    if (!state.me) { pdiag('page-init-redirect', { reason: 'fetchMe-null' }, true); window.location.replace('/login'); return; }

    // Admin console is owner-only; the Team (manager) view is for managers + owners.
    if (state.me.role === 'owner') {
      document.getElementById('adminLink').style.display = '';
    }
    if (state.me.role === 'manager' || state.me.role === 'owner') {
      document.getElementById('navTeam').style.display = '';
      document.getElementById('navTeamSep').style.display = '';
      await loadUsers();
    }
    // Knowledge Base: manager, owner, OR an unmanaged plain user (they curate
    // their own personal KB). Managed users get no KB nav link.
    if (canAccessKb()) {
      document.getElementById('navKb').style.display = '';
      document.getElementById('navKbSep').style.display = '';
    }

    // Default to caller's own data; ?user=<id> pivots to another user.
    var params = new URLSearchParams(window.location.search);
    var target = params.get('user');
    if (target && (state.me.role === 'admin' || state.me.role === 'owner')) {
      state.viewingUserId = target;
    } else {
      state.viewingUserId = state.me.user_id;
    }

    // Direct visit to /dashboard?fathom=* (no popup). Set the notice and
    // strip the param from the URL so a refresh doesn't re-fire it.
    if (fathomParam) {
      handleFathomDoneSignal(fathomParam);
      params.delete('fathom');
      var qs = params.toString();
      var cleanUrl = window.location.pathname + (qs ? '?' + qs : '');
      window.history.replaceState({}, '', cleanUrl);
    }

    // Restore the view from the URL hash BEFORE the first load so a refresh or
    // deep link lands on the right page; the 30-day range applies underneath.
    applyHashToState();
    // v1.4: managers/owners WITH reps default to the Team view — but only when
    // there is NO explicit hash (an explicit hash, e.g. #calls, always wins).
    // Uses has_reps from the /auth/me call the page already made (no new fetch).
    // Users without reps see today's behavior unchanged.
    if (!window.location.hash && state.me && state.me.has_reps) {
      state.view = 'team';
      syncHashFromState(true); // reflect #team in the URL (replace, no spurious history entry)
    }
    setDateRange(30, true /* preserveView — keep the hash-restored view */);
    if (state.view === 'call-review' && state.selectedCallId) loadCallReview(state.selectedCallId);
  }

  // Converts a popup-result kind into a notice + triggers a status refresh.
  // Called from both the postMessage handler (popup flow) and the URL-param
  // fallback (direct visit) so the two paths produce identical behavior.
  function handleFathomDoneSignal(kind) {
    if (kind === 'connected') {
      state.fathomNotice = { kind: 'success', text: 'Fathom connected successfully.' };
    } else if (kind === 'denied') {
      state.fathomNotice = { kind: 'warn', text: 'Fathom connection was declined. You can try again any time.' };
    } else {
      state.fathomNotice = { kind: 'error', text: 'Could not connect Fathom. Please try again.' };
    }
    // Fire-and-forget status refresh — render is non-blocking.
    refreshFathomStatusInBackground();
  }

  async function fetchMe() {
    try {
      var res = await fetch('/auth/me', { headers: authHeader() });
      if (!res.ok) return null;
      return await res.json();
    } catch (e) { return null; }
  }

  async function loadUsers() {
    try {
      var res = await fetch('/admin/users', { headers: authHeader() });
      if (!res.ok) return;
      var d = await res.json();
      state.users = (d && d.users) || [];
    } catch (e) { /* silent */ }
  }

  // ──────────────────────────────────────────────────────────────────
  // Data fetch
  // ──────────────────────────────────────────────────────────────────
  function isSelf() { return state.viewingUserId === state.me.user_id; }

  async function fetchAnalytics() {
    var url = isSelf()
      ? '/me/analytics?from=' + encodeURIComponent(state.dateRange.from) + '&to=' + encodeURIComponent(state.dateRange.to)
      : '/admin/analytics/' + encodeURIComponent(state.viewingUserId)
        + '?from=' + encodeURIComponent(state.dateRange.from) + '&to=' + encodeURIComponent(state.dateRange.to);
    var res = await fetch(url, { headers: authHeader() });
    if (res.status === 401) { clearSession(); window.location.replace('/login'); throw new Error('unauth'); }
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  }

  // Fathom-era Coaching Dashboard analytics (call_analyses). Self or admin pivot.
  async function fetchAnalytics2() {
    var url = isSelf()
      ? '/me/analytics2?from=' + encodeURIComponent(state.dateRange.from) + '&to=' + encodeURIComponent(state.dateRange.to)
      : '/admin/analytics2/' + encodeURIComponent(state.viewingUserId)
        + '?from=' + encodeURIComponent(state.dateRange.from) + '&to=' + encodeURIComponent(state.dateRange.to);
    var res = await fetch(url, { headers: authHeader() });
    if (res.status === 401) { clearSession(); window.location.replace('/login'); throw new Error('unauth'); }
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  }

  async function fetchPatterns() {
    var url = isSelf()
      ? '/me/coaching/patterns?from=' + encodeURIComponent(state.dateRange.from) + '&to=' + encodeURIComponent(state.dateRange.to)
      : '/admin/coaching/' + encodeURIComponent(state.viewingUserId) + '/patterns'
        + '?from=' + encodeURIComponent(state.dateRange.from) + '&to=' + encodeURIComponent(state.dateRange.to);
    var res = await fetch(url, { headers: authHeader() });
    if (res.status === 401) { clearSession(); window.location.replace('/login'); throw new Error('unauth'); }
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  }

  // /fathom/status is per-caller (no /admin equivalent for Phase 1). Only
  // called when state.viewingUserId === state.me.user_id — see
  // renderFathomSectionHtml below for the early-return on admin pivot.
  async function fetchFathomStatus() {
    var res = await fetch('/fathom/status', { headers: authHeader() });
    if (res.status === 401) { clearSession(); window.location.replace('/login'); throw new Error('unauth'); }
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  }

  // Failure-tolerant wrapper for post-action refreshes (after Connect or
  // Sync finishes). Never throws — sets a safe default and re-renders.
  async function refreshFathomStatusInBackground() {
    try {
      state.fathomStatus = await fetchFathomStatus();
    } catch (e) {
      // On error, fall back to a "disconnected" view so the UI doesn't
      // get stuck in a stale connected state.
      state.fathomStatus = { connected: false };
    }
    if (state.view === 'overview') renderOverview(false);
  }

  // Button handler: kicks off OAuth in a popup window. The popup later
  // posts a 'scout-fathom-done' message back to this window (see init()).
  async function connectFathom() {
    try {
      var res = await fetch('/auth/fathom/connect', { headers: authHeader() });
      if (res.status === 401) { clearSession(); window.location.replace('/login'); return; }
      if (!res.ok) {
        state.fathomNotice = { kind: 'error', text: 'Could not start Fathom connection (HTTP ' + res.status + ').' };
        if (state.view === 'overview') renderOverview(false);
        return;
      }
      var data = await res.json();
      if (!data || !data.url) {
        state.fathomNotice = { kind: 'error', text: 'Fathom did not return an authorization URL.' };
        if (state.view === 'overview') renderOverview(false);
        return;
      }
      var w = 600, h = 720;
      var left = Math.max(0, Math.floor((window.screen.width - w) / 2));
      var top  = Math.max(0, Math.floor((window.screen.height - h) / 2));
      var popup = window.open(
        data.url,
        'fathom_oauth',
        'width=' + w + ',height=' + h + ',left=' + left + ',top=' + top + ',resizable=yes,scrollbars=yes'
      );
      if (!popup) {
        state.fathomNotice = { kind: 'error', text: 'Popup blocked. Please allow popups for this site and try again.' };
        if (state.view === 'overview') renderOverview(false);
      }
      // Otherwise: popup is open, no further work here. handleFathomDoneSignal
      // takes over once the user authorizes (or denies).
    } catch (err) {
      state.fathomNotice = { kind: 'error', text: 'Could not start Fathom connection: ' + (err && err.message || 'unknown') };
      if (state.view === 'overview') renderOverview(false);
    }
  }

  // Button handler: manually trigger a sync. Disables the button via the
  // state.fathomSyncing flag (drives the spinner) so concurrent clicks
  // can't fire two parallel requests.
  async function syncFathomNow() {
    if (state.fathomSyncing) return; // guard against double-click
    state.fathomSyncing = true;
    if (state.view === 'overview') renderOverview(false);

    var noticeText = null;
    var noticeKind = 'success';
    try {
      var res = await fetch('/fathom/sync', { headers: authHeader() });
      if (res.status === 401) { clearSession(); window.location.replace('/login'); return; }
      if (res.ok) {
        var data = await res.json();
        if (data && data.needs_identity) {
          // Sync can't run until we know the user's Fathom email (otherwise it
          // would pull the whole team). Show the inline prompt instead.
          state.fathomSyncing = false;
          await showFathomIdentityPrompt();
          return;
        }
        var n = (data && typeof data.synced === 'number') ? data.synced : 0;
        noticeText = 'Synced ' + n + ' new call' + (n === 1 ? '' : 's') + '.';
        if (data && data.truncated) {
          noticeText += ' (More calls available — run sync again to fetch the rest.)';
          noticeKind = 'warn';
        }
      } else if (res.status === 404) {
        noticeText = 'Not connected to Fathom.';
        noticeKind = 'error';
      } else {
        var errBody = null;
        try { errBody = await res.json(); } catch (e) { /* ignore */ }
        noticeText = 'Sync failed: ' + (errBody && errBody.error ? errBody.error : 'HTTP ' + res.status);
        noticeKind = 'error';
      }
    } catch (err) {
      noticeText = 'Sync error: ' + (err && err.message || 'unknown');
      noticeKind = 'error';
    }
    state.fathomNotice = { kind: noticeKind, text: noticeText };
    state.fathomSyncing = false;
    // Refresh status (last_sync_at + call_count) regardless of outcome,
    // then re-render — covers the success path AND any error path so the
    // strip reflects the connection's true current state.
    await refreshFathomStatusInBackground();
  }

  // Button handler: re-trigger analysis on calls already synced but still
  // pending (POST /fathom/reanalyze — does NOT re-sync from Fathom). Used to
  // unstick calls that were reset from 'error' back to 'pending' after the
  // OAuth transcript fix. Mirrors syncFathomNow's flag-guarded, notice-driven
  // shape; the queued count comes back immediately, analysis runs server-side.
  async function reanalyzeFathomNow() {
    if (state.fathomReanalyzing) return; // guard against double-click
    state.fathomReanalyzing = true;
    if (state.view === 'overview') renderOverview(false);

    var noticeText = null;
    var noticeKind = 'success';
    try {
      var res = await fetch('/fathom/reanalyze', {
        method: 'POST',
        headers: Object.assign({ 'Content-Type': 'application/json' }, authHeader()),
        body: JSON.stringify({ limit: 10 }),   // process a bounded batch per click
      });
      if (res.status === 401) { clearSession(); window.location.replace('/login'); return; }
      if (res.ok) {
        var data = await res.json();
        var n = (data && typeof data.queued === 'number') ? data.queued : 0;
        noticeText = n === 0
          ? 'No pending calls to reanalyze.'
          : 'Queued ' + n + ' call' + (n === 1 ? '' : 's') + ' for reanalysis. Grades will populate as each finishes.';
      } else {
        var errBody = null;
        try { errBody = await res.json(); } catch (e) { /* ignore */ }
        noticeText = 'Reanalyze failed: ' + (errBody && errBody.error ? errBody.error : 'HTTP ' + res.status);
        noticeKind = 'error';
      }
    } catch (err) {
      noticeText = 'Reanalyze error: ' + (err && err.message || 'unknown');
      noticeKind = 'error';
    }
    state.fathomNotice = { kind: noticeKind, text: noticeText };
    state.fathomReanalyzing = false;
    // Refresh status so pending_count (and thus button visibility) reflects the
    // dispatch. Note the count won't drop to 0 instantly — the worker flips rows
    // to 'processed' asynchronously; a later status poll catches up.
    await refreshFathomStatusInBackground();
  }

  // Re-grade calls analyzed under an older prompt version (POST
  // /fathom/update-analyses — resets them to pending + fires the batch). Shown
  // only when there's nothing pending but outdated_count > 0. Mirrors
  // reanalyzeFathomNow's flag-guarded, notice-driven shape.
  async function updateOutdatedAnalysesNow() {
    if (state.fathomUpdating) return; // guard against double-click
    state.fathomUpdating = true;
    if (state.view === 'overview') renderOverview(false);

    var noticeText = null;
    var noticeKind = 'success';
    try {
      var res = await fetch('/fathom/update-analyses', {
        method: 'POST',
        headers: Object.assign({ 'Content-Type': 'application/json' }, authHeader()),
        // Scope ruling (2026-07-22): batches are the 20 MOST-RECENT calls, not
        // full sweeps — the server selects newest-first (pending ahead of
        // outdated) and older calls intentionally stay on their old prompt
        // versions. The button count still shows the full outdated number.
        body: JSON.stringify({ limit: 20 }),
      });
      if (res.status === 401) { clearSession(); window.location.replace('/login'); return; }
      if (res.ok) {
        var data = await res.json();
        var n = (data && typeof data.queued === 'number') ? data.queued : 0;
        var remaining = (data && typeof data.remaining === 'number') ? data.remaining : 0;
        noticeText = n === 0
          ? 'No outdated analyses to update.'
          : 'Updating ' + n + ' call' + (n === 1 ? '' : 's') + ' to the latest analysis.'
            + (remaining > 0 ? ' ' + remaining + ' more remain — click again when these finish.' : '')
            + ' Grades refresh as each completes.';
      } else {
        var errBody = null;
        try { errBody = await res.json(); } catch (e) { /* ignore */ }
        noticeText = 'Update failed: ' + (errBody && errBody.error ? errBody.error : 'HTTP ' + res.status);
        noticeKind = 'error';
      }
    } catch (err) {
      noticeText = 'Update error: ' + (err && err.message || 'unknown');
      noticeKind = 'error';
    }
    state.fathomNotice = { kind: noticeKind, text: noticeText };
    state.fathomUpdating = false;
    // Refresh status — outdated_count won't drop instantly (worker flips rows to
    // 'processed' on the new version asynchronously); a later poll catches up.
    await refreshFathomStatusInBackground();
  }

  // Fetch a suggested Fathom email (stored value, else Scout login email) and
  // flip the strip into identity-prompt mode. Called when sync returns
  // needs_identity. Never throws — falls back to an empty input.
  async function showFathomIdentityPrompt() {
    var current = '';
    var suggestions = [];
    try {
      var r = await fetch('/fathom/identity-options', { headers: authHeader() });
      if (r.status === 401) { clearSession(); window.location.replace('/login'); return; }
      if (r.ok) {
        var d = await r.json();
        current = (d && d.current) || '';
        suggestions = (d && Array.isArray(d.suggestions)) ? d.suggestions : [];
      }
    } catch (e) { /* ignore — prompt with an empty input */ }
    state.fathomIdentitySuggestions = suggestions;
    // Pre-fill: stored email, else the most-frequent recorder, else blank.
    state.fathomIdentitySuggestion = current || (suggestions[0] && suggestions[0].email) || '';
    state.fathomNeedsIdentity = true;
    if (state.view === 'overview') renderOverview(false);
  }

  // Chip click: drop the picked email into the identity input (no re-render, so

  // Save the entered Fathom email, then immediately kick off a (now-filtered)
  // sync. Reads the input value BEFORE re-rendering so the uncontrolled field
  // isn't cleared mid-save.
  async function saveFathomIdentity() {
    if (state.fathomIdentitySaving) return;
    var input = document.getElementById('fathom-identity-input');
    var email = input ? input.value.trim() : '';
    if (!email) return;
    state.fathomIdentitySaving = true;
    if (state.view === 'overview') renderOverview(false);
    try {
      var res = await fetch('/fathom/identity', {
        method: 'POST',
        headers: Object.assign({ 'Content-Type': 'application/json' }, authHeader()),
        body: JSON.stringify({ email: email }),
      });
      if (res.status === 401) { clearSession(); window.location.replace('/login'); return; }
      if (!res.ok) {
        var errBody = null;
        try { errBody = await res.json(); } catch (e) { /* ignore */ }
        state.fathomNotice = { kind: 'error', text: (errBody && errBody.error) || ('Could not save email (HTTP ' + res.status + ').') };
        state.fathomIdentitySaving = false;
        if (state.view === 'overview') renderOverview(false);
        return;
      }
    } catch (err) {
      state.fathomNotice = { kind: 'error', text: 'Could not save email: ' + (err && err.message || 'unknown') };
      state.fathomIdentitySaving = false;
      if (state.view === 'overview') renderOverview(false);
      return;
    }
    // Saved — clear the prompt and fire the filtered sync.
    state.fathomNeedsIdentity = false;
    state.fathomIdentitySaving = false;
    await syncFathomNow();
  }

  function dismissFathomNotice() {

  // ─── Fathom rendering helpers ─────────────────────────────────────────
  // renderFathomNoticeHtml + renderFathomSectionHtml both return either ''
  // or a fragment. Called from renderOverview between the page header and
  // the donut row.

  function renderFathomNoticeHtml() {
    if (!state.fathomNotice) return '';
    var n = state.fathomNotice;
    var kind = (n.kind === 'success' || n.kind === 'warn' || n.kind === 'error') ? n.kind : 'success';
    return '<div class="fathom-notice ' + kind + '">'
      + '<div class="fathom-notice-text">' + escapeHtml(n.text || '') + '</div>'
      + '<button class="fathom-notice-dismiss" type="button" aria-label="Dismiss" onclick="dismissFathomNotice()">×</button>'
      + '</div>';

  function renderFathomSectionHtml() {
    // Hide when an admin/owner is viewing another user — Fathom connection
    // is per-user and there is no admin endpoint for another user's status
    // in Phase 1. The notice still renders above the donuts via the call
    // in renderOverview so admin-triggered actions (none currently) would
    // still produce feedback.
    if (state.viewingUserId !== state.me.user_id) return '';

    // Pre-first-fetch: render nothing to avoid a layout jump while
    // /fathom/status is in flight (it runs in the same Promise.all as
    // the donut data, so it's only null on the very first render call).
    if (!state.fathomStatus) return '';

    var inner;
    if (state.fathomSyncing) {
      inner = renderFathomStripSyncing();
    } else if (!state.fathomStatus.connected) {
      inner = renderFathomConnectCard();
    } else if (state.fathomNeedsIdentity) {
      inner = renderFathomIdentityPrompt();
    } else if (state.fathomStatus.last_sync_status === 'error') {
      inner = renderFathomStripError(state.fathomStatus);
    } else {
      inner = renderFathomStripConnected(state.fathomStatus);
    }
    return '<section class="section fade-in fathom-section">' + inner + '</section>';
  }

  function renderFathomConnectCard() {

    var count = (typeof status.call_count === 'number') ? status.call_count : 0;

    var syncBtn = state.fathomSyncing
      ? '<button class="btn-fathom-secondary" type="button" disabled><span class="spinner-tiny"></span> Syncing…</button>'
      : '<button class="btn-fathom-secondary" type="button" onclick="syncFathomNow()">↻ Sync now</button>';
    // Reanalyze button + "N pending analysis" meta only appear when calls are
    // sitting at sync_status='pending' (newly synced or reset back to the worker).
    var reanalyzeBtn = '';
    if (pending > 0 && outdated === 0) {
      reanalyzeBtn = state.fathomReanalyzing
        ? '<button class="btn-fathom-secondary" type="button" disabled><span class="spinner-tiny"></span> Reanalyzing…</button>'
        : '<button class="btn-fathom-secondary" type="button" onclick="reanalyzeFathomNow()">' + (pending > 10 ? '⟳ Analyze next 10' : '⟳ Reanalyze ' + pending + ' pending') + '</button>';
    }
    // When calls were graded under an older prompt version, offer a re-grade.
    // /fathom/update-analyses also sweeps up already-pending calls (one batch
    // covers both), so when outdated > 0 this button REPLACES the reanalyze
    // button and its count is outdated + pending (disjoint sets).
    var updateBtn = '';
    if (outdated > 0) {
      updateBtn = state.fathomUpdating
        ? '<button class="btn-fathom-secondary" type="button" disabled><span class="spinner-tiny"></span> Updating…</button>'
        : '<button class="btn-fathom-secondary" type="button" onclick="updateOutdatedAnalysesNow()">⟳ Update analyses (' + (outdated + pending) + ')</button>';

      + '<div class="fathom-strip-left">'

        + '<span class="fathom-strip-sep">·</span>'
        + '<span class="fathom-strip-meta">' + count + ' call' + (count === 1 ? '' : 's') + ' synced</span>'
        + '<span class="fathom-strip-sep">·</span>'

    return '<div class="fathom-strip error">'
      + '<div class="fathom-strip-left">'

          + '<div><span class="fathom-strip-icon err"></span> <span class="fathom-strip-text">Fathom sync failed</span></div>'
          + '<div class="fathom-strip-error-text">' + escapeHtml(errText) + '</div>'

        + '<button class="btn-fathom-primary" type="button" onclick="connectFathom()">Reconnect</button>'

  // Format an ISO timestamp into "5m ago" / "2h ago" / "3 days ago" / "Jun 14".
  // Phase 1 standalone formatter — keeps the Fathom block self-contained.
  function formatRelativeTime(iso) {
    if (!iso) return 'never';
    var then = new Date(iso).getTime();
    if (isNaN(then)) return 'never';
    var diff = Math.max(0, Date.now() - then);
    var s = Math.floor(diff / 1000);
    if (s < 60) return 'just now';
    var m = Math.floor(s / 60);
    if (m < 60) return m + 'm ago';
    var h = Math.floor(m / 60);
    if (h < 24) return h + 'h ago';
    var d = Math.floor(h / 24);
    if (d < 7) return d + (d === 1 ? ' day ago' : ' days ago');
    return new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  }

  async function fetchCalls() {
    var url = isSelf()
      ? '/me/sessions?limit=100'
      : '/admin/sessions?limit=100&user_id=' + encodeURIComponent(state.viewingUserId);
    var res = await fetch(url, { headers: authHeader() });
    if (res.status === 401) { clearSession(); window.location.replace('/login'); throw new Error('unauth'); }
    if (!res.ok) throw new Error('HTTP ' + res.status);
    var d = await res.json();
    var all = (d && d.sessions) || [];
    // Client-side date filter.
    return all.filter(function(s) {
      return s.started_at >= state.dateRange.from && s.started_at <= state.dateRange.to;
    });
  }

  async function fetchObjections(sessionId) {
    if (state.objectionsCache[sessionId]) return state.objectionsCache[sessionId];
    var url = isSelf()
      ? '/me/sessions/' + encodeURIComponent(sessionId) + '/objections'
      : '/admin/sessions/' + encodeURIComponent(sessionId) + '/objections';
    var res = await fetch(url, { headers: authHeader() });
    if (!res.ok) return [];
    var d = await res.json();
    var rows = (d && d.objections) || [];
    state.objectionsCache[sessionId] = rows;
    return rows;
  }

  // ──────────────────────────────────────────────────────────────────
  // Date range / user controls
  // ──────────────────────────────────────────────────────────────────
  function setDateRange(days, preserveView) {
    var to = new Date();
    var from = days >= 9999
      ? new Date('2025-01-01T00:00:00Z')
      : new Date(Date.now() - days * 24 * 60 * 60 * 1000);
    state.dateRange = { from: from.toISOString(), to: to.toISOString(), days: days };
    // Date-preset clicks reset to Coaching; the initial boot restore keeps the
    // hash-restored view (preserveView) so a refresh on #calls stays on Calls.
    if (!preserveView) state.view = 'overview';
    state.expandedCallId = null;
    state.objectionsCache = {};
    reloadAll();
  }

  function setUser(userId) {
    if (!userId || userId === state.viewingUserId) return;
    var url = new URL(window.location.href);
    if (userId === state.me.user_id) url.searchParams.delete('user');
    else url.searchParams.set('user', userId);
    window.history.replaceState({}, '', url.toString());
    state.viewingUserId = userId;
    state.view = 'overview';
    state.expandedCallId = null;
    state.objectionsCache = {};
    reloadAll();
  }

  async function reloadAll() {
    // Range/user changed — drop the cached synthesis so it re-fetches for the
    // new (user, range); the panel re-generates (server cache handles repeats).
    state.perfSynthesis = null;
    renderOverview(true /* loading */);
    try {
      // Fathom status fetch is wrapped in a .catch so a stale token or
      // misconfigured FATHOM_* env vars don't break the whole dashboard
      // — the Fathom strip will simply render as "disconnected" in that
      // case. Critical analytics fetches stay in the throw-fast path.
      var fathomPromise = isSelf()
        ? fetchFathomStatus().catch(function() { return { connected: false }; })
        : Promise.resolve(null); // admin pivot: skip — section hidden anyway

      // Coach summary patterns come from an LLM call (/coaching/patterns) and are
      // the flakiest dependency — e.g. it 500s when the Anthropic credit balance
      // is exhausted. The default Coaching view doesn't use patterns at all, and
      // Live Sessions can degrade to an empty summary, so a patterns failure must
      // NOT take the whole dashboard down. Catch it (but let auth redirects through).
      var patternsPromise = fetchPatterns().catch(function(e) {
        if (e && e.message === 'unauth') throw e;
        console.warn('[dashboard] coaching patterns unavailable:', e && e.message);
        return { patterns: [], sample_size: null, unavailable: true };
      });

      var results = await Promise.all([
        fetchAnalytics(),
        patternsPromise,
        fetchCalls(),
        fathomPromise,
        fetchAnalytics2(),
      ]);
      state.analytics    = results[0];
      state.patterns     = results[1];
      state.calls        = results[2];
      state.fathomStatus = results[3];
      state.analytics2   = results[4];
      render();
    } catch (err) {
      if (err.message === 'unauth') return;
      document.getElementById('content').innerHTML = '<div class="error">Could not load dashboard data: ' + escapeHtml(err.message || 'unknown') + '</div>';
    }
  }

  // ──────────────────────────────────────────────────────────────────
  // Top-level render — switches on state.view
  // ──────────────────────────────────────────────────────────────────
  function render() {
    if (state.view === 'overview') renderOverview(false);
    else if (state.view === 'calls') renderCallsDrill();
    else if (state.view === 'objections') renderObjectionsDrill();
    else if (state.view === 'closes') renderClosesDrill();
    else if (state.view === 'objection-type') renderObjectionTypeDrill();
    else if (state.view === 'call-library') renderCallLibrary();
    else if (state.view === 'call-review') renderCallReview();
    else if (state.view === 'objections-intel') renderObjectionsIntel();
    else if (state.view === 'team') renderTeamView();
    else if (state.view === 'kb') renderKbView();
    else if (state.view === 'eod') renderEodView();
    else if (state.view === 'account') renderAccountView();
    updateNavActiveStates();
  }

  // Nav lives OUTSIDE #content, so it isn't re-rendered when render() swaps
  // the content. We update the active classes imperatively here. Coaching
  // Dashboard is "active" for any view in the overview umbrella (overview
  // itself + its donut drills); Calls is active for the call-library view.
  function updateNavActiveStates() {
    var OVERVIEW_VIEWS = { overview: 1, calls: 1, objections: 1, closes: 1, 'objection-type': 1 };
    var CALL_LIBRARY_VIEWS = { 'call-library': 1, 'call-review': 1 };
    var navOverview = document.getElementById('navOverview');
    var navCallLibrary = document.getElementById('navCallLibrary');
    var navEod = document.getElementById('navEod');
    if (navEod) navEod.classList.toggle('nav-active', state.view === 'eod');
    var emailLink = document.getElementById('signedInEmail');
    if (emailLink) emailLink.classList.toggle('nav-active', state.view === 'account');
    // Objections view is reachable only via the donut (no persistent nav tab);
    // keep the Coaching Dashboard nav highlighted while in it.
    if (navOverview) {
      navOverview.classList.toggle('nav-active', !!OVERVIEW_VIEWS[state.view] || state.view === 'objections-intel');
    }
    var navTeam = document.getElementById('navTeam');
    if (navTeam) navTeam.classList.toggle('nav-active', state.view === 'team');
    var navKb = document.getElementById('navKb');
    if (navKb) navKb.classList.toggle('nav-active', state.view === 'kb');
    if (navCallLibrary) {
      navCallLibrary.classList.toggle('nav-active', !!CALL_LIBRARY_VIEWS[state.view]);
    }
  }

  function renderHeaderHtml() {
    var heading;
    var sub;
    if (state.viewingUserId === state.me.user_id) {
      heading = 'Coaching Review';
      sub = 'Your call patterns, objection handling, and coaching feedback.';
    } else {
      var u = state.users.find(function(x) { return x.user_id === state.viewingUserId; });
      heading = (u ? u.email : state.viewingUserId);
      sub = 'Viewing as ' + state.me.role + '.';
    }

    var userPicker = '';
    if (state.me.role === 'admin' || state.me.role === 'owner') {
      var opts = state.users.slice().sort(function(a, b) { return (a.email || '').localeCompare(b.email || ''); }).map(function(u) {
        var sel = u.user_id === state.viewingUserId ? ' selected' : '';
        return '<option value="' + escapeHtml(u.user_id) + '"' + sel + '>' + escapeHtml(u.email || u.user_id) + '</option>';
      }).join('');
      userPicker = '<select class="user-select" onchange="setUser(this.value)">' + opts + '</select>';
    }

    var presets = '';
    [[7, '7d'], [30, '30d'], [90, '90d'], [9999, 'All']].forEach(function(p) {
      var active = state.dateRange.days === p[0] ? ' active' : '';
      presets += '<button class="date-preset' + active + '" onclick="setDateRange(' + p[0] + ')">' + p[1] + '</button>';
    });

    var scopePill = state.viewingUserId !== state.me.user_id ? '<span class="scope-pill">' + escapeHtml(state.me.role || '') + ' view</span>' : '';

    return '<div class="page-header fade-in">'
         + '<div><h1>' + escapeHtml(heading) + scopePill + '</h1>'
         + '<div class="subtitle">' + escapeHtml(sub) + '</div></div>'
         + '<div class="controls">' + userPicker
         + '<div class="date-presets">' + presets + '</div>'
         + '</div></div>';
  }

  // ──────────────────────────────────────────────────────────────────
  // Overview view — three donuts + coach summary + recent calls
  // ──────────────────────────────────────────────────────────────────
  function renderOverview(isLoading) {
    var content = document.getElementById('content');
    var mode = state.overviewMode || 'coaching';
    // Edge case: user is on Live Sessions and switches to a range with zero
    // sessions — fall back to Coaching so they aren't stranded on a hidden tab.
    // Only fires once analytics has loaded (state.analytics non-null).
    if (mode === 'sessions' && state.analytics && !hasLiveSessions()) {
      mode = 'coaching';
      state.overviewMode = 'coaching';
    }
    var notReady = mode === 'coaching' ? !state.analytics2 : !state.analytics;
    if (isLoading || notReady) {
      content.innerHTML = renderHeaderHtml()
        + renderModeToggleHtml()
        + renderFathomNoticeHtml()
        + renderFathomSectionHtml()
        + '<div class="donut-row">'
          + '<div class="skeleton-donut"></div><div class="skeleton-donut"></div><div class="skeleton-donut"></div>'
        + '</div>'
        + '<div class="section"><div class="skeleton" style="height:60px;"></div></div>';
      return;
    }

    // Default Coaching Dashboard = Fathom-era analytics (call_analyses).
    if (mode === 'coaching') { renderCoachingOverview(content); return; }

    // ── Live Sessions (desktop teleprompter era, call_sessions) ──────────────
    var t = state.analytics.totals;
    var obj = state.analytics.objections;

    // Donut 1: Calls — segments by outcome. Center is total calls.
    // Donut 2: Objections — segments by type. Center is total objections.
    // Donut 3: Close Rate — won vs lost/follow_up. Center is %.
    var closeDenom = t.wins + t.losses + t.follow_ups;
    var closeRate = closeDenom > 0 ? Math.round((t.wins / closeDenom) * 100) : null;

    content.innerHTML = renderHeaderHtml()
      + renderModeToggleHtml()
      + renderFathomNoticeHtml()
      + renderFathomSectionHtml()
      + '<div class="donut-row fade-in">'
        + donutCardHtml('chart-calls', 'Calls', t.total_calls, null, 'click to drill in', 'calls')
        + donutCardHtml('chart-objs', 'Objections', obj.totals.total, null, 'click to drill in', 'objections')
        + donutCardHtml('chart-closes', 'Close Rate', closeRate === null ? '—' : (closeRate + '%'), null, 'click to drill in', 'closes')
      + '</div>'
      + '<div class="section fade-in">'
        + '<div class="section-header"><h2>Coach summary</h2>'
        + '<div class="meta">' + ((state.patterns && state.patterns.sample_size != null) ? 'based on ' + state.patterns.sample_size + ' calls' : '') + '</div></div>'
        + renderPatternsHtml(state.patterns)
      + '</div>'
      + '<div class="section fade-in">'
        + '<div class="section-header"><h2>Recent calls</h2>'
        + '<div class="meta">' + state.calls.length + (state.calls.length === 1 ? ' call' : ' calls') + ' in window</div></div>'
        + renderCallsHtml(state.calls)
      + '</div>';

    // Draw the three donuts after the DOM is laid out.
    requestAnimationFrame(function() {
      drawCallsDonut('chart-calls', t);
      drawObjectionsDonut('chart-objs', obj);
      drawClosesDonut('chart-closes', t, closeRate);
    });

    // Re-bind expanded body for any previously-open call.
    if (state.expandedCallId) {
      var card = document.querySelector('[data-session-id="' + state.expandedCallId + '"]');
      if (card) {
        card.classList.add('expanded');
        renderCallBody(state.expandedCallId);
      }
    }
  }

  function donutCardHtml(canvasId, label, centerBig, centerSmall, hint, clickKey, onclickExpr) {
    var smallHtml = centerSmall ? '<div class="small">' + escapeHtml(centerSmall) + '</div>' : '';
    // Prefer an explicit onclick expression (coaching donuts pass drillCalls(...));
    // otherwise fall back to setView(clickKey). Empty = non-drillable, no onclick.
    var expr = onclickExpr || (clickKey ? "setView('" + clickKey + "')" : '');
    var clickAttr = expr ? ' onclick="' + expr + '"' : '';
    var hintText = expr ? hint : '';
    return '<div class="donut-card"' + clickAttr + '>'
         + '<div class="donut-label">' + escapeHtml(label) + '</div>'
         + '<div class="donut-canvas-wrap">'
           + '<canvas id="' + canvasId + '"></canvas>'
           + '<div class="donut-center"><div class="big">' + escapeHtml(String(centerBig)) + '</div>' + smallHtml + '</div>'
         + '</div>'
         + '<div class="donut-hint">' + escapeHtml(hintText) + '</div>'
         + '</div>';
  }

  // ──────────────────────────────────────────────────────────────────
  // Chart drawing — Chart.js with custom dark theme + thin ring
  // ──────────────────────────────────────────────────────────────────
  var COLORS = {
    win: '#4ade80', loss: '#f87171', follow_up: '#fbbf24', unmarked: '#64748b', live: '#5b9eff',
    money: '#5b9eff', think: '#fbbf24', spouse: '#c084fc', time: '#fb923c',
    guarantee: '#22d3ee', 'tried-before': '#a78bfa', 'send-info': '#34d399',
    'more-research': '#f472b6', 'not-right-time': '#fb7185', 'proof-it-works': '#94a3b8',
    other: '#64748b',
  };

  function donutBase(canvasId, labels, values, colors) {
    var ctx = document.getElementById(canvasId);
    if (!ctx) return null;
    if (!window.Chart) return null;
    return new Chart(ctx.getContext('2d'), {
      type: 'doughnut',
      data: {
        labels: labels,
        datasets: [{
          data: values,
          backgroundColor: colors,
          borderWidth: 0,
          spacing: 2,
          hoverOffset: 8,
        }],
      },
      options: {
        cutout: '78%',
        responsive: true,
        maintainAspectRatio: true,
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: '#1a1a1a',
            titleColor: '#ededed',
            bodyColor: '#cccccc',
            borderColor: '#2a2a2a',
            borderWidth: 1,
            padding: 10,
            cornerRadius: 8,
            displayColors: true,
            titleFont: { size: 12, weight: 600 },
            bodyFont: { size: 12 },
          },
        },
        animation: { duration: 700, easing: 'easeOutCubic' },
      },
    });
  }

  function drawCallsDonut(canvasId, t) {
    if (state.chart1) state.chart1.destroy();
    var labels = ['Won', 'Lost', 'Follow-up', 'Unmarked'];
    var values = [t.wins, t.losses, t.follow_ups, t.unmarked + t.live];
    var colors = [COLORS.win, COLORS.loss, COLORS.follow_up, COLORS.unmarked];
    // Filter zero-value entries to keep tooltips clean
    var filtered = filterZero(labels, values, colors);
    state.chart1 = donutBase(canvasId, filtered.labels, filtered.values, filtered.colors);
  }

  function drawObjectionsDonut(canvasId, obj) {
    if (state.chart2) state.chart2.destroy();
    var byType = obj.by_type || [];
    var labels = byType.map(function(b) { return b.label; });
    var values = byType.map(function(b) { return b.count; });
    var colors = byType.map(function(b) { return COLORS[b.objection_id] || COLORS.other; });
    if (labels.length === 0) {
      // Render a single gray ring when no data so the visual doesn't collapse.
      labels = ['No objections'];
      values = [1];
      colors = ['#1f1f1f'];
    }
    state.chart2 = donutBase(canvasId, labels, values, colors);
  }

  function drawClosesDonut(canvasId, t, closeRate) {
    if (state.chart3) state.chart3.destroy();
    var labels = ['Won', 'Not won'];
    var notWon = t.losses + t.follow_ups;
    var values = [t.wins, notWon];
    var colors = [COLORS.win, '#1f1f1f'];
    if (t.wins + notWon === 0) {
      labels = ['No completed closes'];
      values = [1];
      colors = ['#1f1f1f'];
    }
    state.chart3 = donutBase(canvasId, labels, values, colors);
  }

  function filterZero(labels, values, colors) {
    var L = [], V = [], C = [];
    for (var i = 0; i < values.length; i++) {
      if (values[i] > 0) { L.push(labels[i]); V.push(values[i]); C.push(colors[i]); }
    }
    if (V.length === 0) { L = ['Empty']; V = [1]; C = ['#1f1f1f']; }
    return { labels: L, values: V, colors: C };
  }

  // ──────────────────────────────────────────────────────────────────
  // Coaching overview (Fathom-era, call_analyses) — default view
  // ──────────────────────────────────────────────────────────────────
  // True when the current (or pivoted ?user=) target has >=1 call_sessions row
  // in the selected range. Source: computeAnalytics totals.total_calls, already
  // in state.analytics and already scoped to the pivoted user — no extra query.
  function hasLiveSessions() {
    return !!(state.analytics && state.analytics.totals && state.analytics.totals.total_calls > 0);
  }

  function renderModeToggleHtml() {
    // DORMANT (2026-07-20): the Live Sessions view is desktop-teleprompter-era and
    // fully retired from the dashboard until the teleprompter returns. The toggle
    // is hidden in ALL ranges regardless of data. The Live Sessions view logic
    // (renderOverview's 'sessions' branch, hasLiveSessions, setOverviewMode) is
    // kept intact but unreachable — nothing sets overviewMode='sessions' anymore.
    // To revive: delete this early return to restore the toggle below.
    return '';
    /* former toggle — reinstate to bring Live Sessions back:
    if (!hasLiveSessions()) return '';
    var mode = state.overviewMode || 'coaching';
    return '<div class="mode-toggle" style="display:flex;gap:6px;margin:-4px 0 18px;">'
      + '<button class="date-preset' + (mode === 'coaching' ? ' active' : '') + '" onclick="setOverviewMode(\'coaching\')">Coaching</button>'
      + '<button class="date-preset' + (mode === 'sessions' ? ' active' : '') + '" onclick="setOverviewMode(\'sessions\')">Live Sessions</button>'
      + '</div>';
    */
  }

  function setOverviewMode(mode) {
    if (mode !== 'coaching' && mode !== 'sessions') return;
    if (state.overviewMode === mode) return;
    state.overviewMode = mode;
    state.view = 'overview';
    renderOverview(false); // both analytics + analytics2 already loaded — instant swap
  }

  function scoreColor(s) {
    if (s == null) return '#1f1f1f';
    return s >= 70 ? COLORS.win : (s >= 50 ? COLORS.follow_up : COLORS.loss);
  }

  // Avg Score donut sub-stat: surface win-quality vs the rest so a strong
  // closer's win average isn't buried in the blend. Falls back to graded count.
  function avgScoreSubstat(av) {
    if (av.win_mean !== null || av.other_mean !== null) {
      return 'Wins ' + (av.win_mean === null ? '—' : av.win_mean) + ' · Others ' + (av.other_mean === null ? '—' : av.other_mean);
    }
    return av.graded_calls + ' graded';
  }

  function renderCoachingOverview(content) {
    var a = state.analytics2;
    // Donuts drill into a filtered Call Library (self via /fathom/calls, pivot
    // via /admin/fathom-calls/:user_id) — each donut filters to its own subset.
    content.innerHTML = renderHeaderHtml()
      + renderModeToggleHtml()
      + renderFathomNoticeHtml()
      + renderFathomSectionHtml()
      + '<div class="donut-row fade-in">'
        + donutCardHtml('chart-c-calls', 'Calls analyzed', a.calls.analyzed, a.calls.total_in_range + ' in range', 'click to drill in', '', "drillCalls('analyzed',null)")
        + donutCardHtml('chart-c-score', 'Avg Score', a.avg_score.mean === null ? '—' : a.avg_score.mean, avgScoreSubstat(a.avg_score), 'worst-first — click to drill in', '', "drillCalls('analyzed','score')")
        + donutCardHtml('chart-c-obj', 'Objections', a.objections.calls_with_objection, a.objections.total_highlights + ' total', 'click for objection intelligence', '', "goObjections()")
      + '</div>'
      + '<div class="section fade-in">'
        + '<div class="section-header"><h2>Coach summary</h2>'
        + '<div class="meta">' + (a.calls.analyzed ? 'based on ' + a.calls.analyzed + (a.calls.analyzed === 1 ? ' analyzed call' : ' analyzed calls') : '') + '</div></div>'
        + renderCoachSummary2(a)
      + '</div>'
      + '<div class="section fade-in">'
        + '<div class="section-header"><h2>Performance summary</h2><div class="meta">win vs loss, grounded in your calls</div></div>'
        + renderPerfSummary()
      + '</div>';

    if (a.calls.analyzed && state.perfSynthesis === null && !state.perfSynthesisLoading) loadPerfSynthesis();

    requestAnimationFrame(function() {
      drawCallsDonut2('chart-c-calls', a);
      drawScoreDonut('chart-c-score', a);
      drawObjDonut2('chart-c-obj', a);
    });
  }

  // ─── Performance Summary (learning loop surface) ─────────────────────────
  async function fetchPerfSynthesis() {
    var qp = 'from=' + encodeURIComponent(state.dateRange.from) + '&to=' + encodeURIComponent(state.dateRange.to);
    var base = isSelf() ? '/me/performance-synthesis' : '/admin/performance-synthesis/' + encodeURIComponent(state.viewingUserId);
    var res = await fetch(base + '?' + qp, { headers: authHeader() });
    if (res.status === 401) { clearSession(); window.location.replace('/login'); throw new Error('unauth'); }
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  }
  async function loadPerfSynthesis() {
    if (state.perfSynthesisLoading) return;
    state.perfSynthesisLoading = true;
    try { state.perfSynthesis = await fetchPerfSynthesis(); }
    catch (err) { if (err.message === 'unauth') return; state.perfSynthesis = { available: false, reason: err.message || 'unknown' }; }
    state.perfSynthesisLoading = false;
    if (state.view === 'overview' && state.overviewMode === 'coaching') renderOverview(false);
  }
  function perfInsightHtml(it, kind) {
    var clip = it.clip_url ? ' <a class="obj-btn" href="' + escapeHtml(it.clip_url) + '" target="_blank" rel="noopener" style="padding:2px 8px;">▶ clip</a>' : '';
    var review = it.call_id ? ' <button class="obj-btn" type="button" onclick="openCallReview(\'' + escapeHtml(it.call_id) + '\')" style="padding:2px 8px;">call</button>' : '';
    var data = it.data ? '<span style="color:var(--muted);"> · ' + escapeHtml(it.data) + '</span>' : '';
    var quote = it.quote ? '<div class="obj-response" style="display:block;margin-top:6px;"><span style="color:var(--muted);">“</span>' + escapeHtml(it.quote) + '<span style="color:var(--muted);">”</span></div>' : '';
    var accent = kind === 'working' ? 'var(--good)' : 'var(--mid, #fbbf24)';
    return '<div class="pattern-card" style="border-left:2px solid ' + accent + ';">'
      + '<div class="pattern-detail">' + escapeHtml(it.claim || '') + data + '</div>'
      + quote
      + ((clip || review) ? '<div class="obj-footer" style="margin-top:8px;">' + clip + review + '</div>' : '')
      + '</div>';
  }
  function renderPerfSummary() {
    var s = state.perfSynthesis;
    if (s === null) return '<div class="load-state" style="padding:14px 4px;"><div class="spinner"></div> Generating performance summary…</div>';
    if (!s.available) return '<div class="empty"><h3>Performance summary unavailable</h3><p>Could not generate it right now' + (s.reason ? ' (' + escapeHtml(s.reason) + ')' : '') + '. Your scores above are unaffected.</p></div>';
    var work = (s.working || []), imp = (s.improve || []);
    if (!work.length && !imp.length) return '<div class="empty"><h3>Not enough data yet</h3><p>Analyze more calls (with win/loss outcomes) to surface a performance summary.</p></div>';
    var block = function(title, arr, kind) {
      return '<div style="margin-top:6px;"><div class="obj-group-header">' + title + '</div>'
        + (arr.length ? arr.map(function(it) { return perfInsightHtml(it, kind); }).join('') : '<div style="color:var(--muted);font-size:13px;">—</div>')
        + '</div>';
    };
    return block("WHAT'S WORKING", work, 'working') + block('WHAT TO IMPROVE', imp, 'improve');
  }

  function drawCallsDonut2(canvasId, a) {
    if (state.chartC1) state.chartC1.destroy();
    var f = filterZero(
      ['Analyzed', 'Processing', 'Error'],
      [a.calls.analyzed, a.calls.processing, a.calls.error],
      [COLORS.win, COLORS.live, COLORS.loss]
    );
    state.chartC1 = donutBase(canvasId, f.labels, f.values, f.colors);
  }

  function drawScoreDonut(canvasId, a) {
    if (state.chartC2) state.chartC2.destroy();
    var m = a.avg_score.mean;
    if (m === null) { state.chartC2 = donutBase(canvasId, ['No scores'], [1], ['#1f1f1f']); return; }
    state.chartC2 = donutBase(canvasId, ['Score', 'Remaining'], [m, Math.max(0, 100 - m)], [scoreColor(m), '#1f1f1f']);
  }

  function drawObjDonut2(canvasId, a) {
    if (state.chartC3) state.chartC3.destroy();
    var withObj = a.objections.calls_with_objection;
    var without = Math.max(0, a.calls.total_in_range - withObj);
    if (withObj + without === 0) { state.chartC3 = donutBase(canvasId, ['No calls'], [1], ['#1f1f1f']); return; }
    state.chartC3 = donutBase(canvasId, ['With objection', 'No objection'], [withObj, without], [COLORS.money, '#1f1f1f']);
  }

  function renderCoachSummary2(a) {
    if (!a.calls.analyzed) {
      return '<div class="empty"><h3>No analyzed calls yet</h3><p>Sync and analyze Fathom calls to see coaching aggregates in this date range.</p></div>';
    }
    var SECTIONS = [['intro', 'Intro'], ['discovery', 'Discovery'], ['pitch', 'Pitch'], ['objection', 'Objection'], ['close', 'Close']];
    var rows = SECTIONS.map(function(pair) {
      var key = pair[0];
      var sec = a.sections[key] || { avg: null, n: 0 };
      var tag = a.weakest_section === key ? ' <span class="badge badge-loss">weakest</span>'
              : (a.strongest_section === key ? ' <span class="badge badge-win">strongest</span>' : '');
      // Score only — no (n=X). n=0 → avg is null → render "—".
      var avgTxt = sec.avg === null ? '—' : String(sec.avg);
      var pct = sec.avg === null ? 0 : Math.max(0, Math.min(100, sec.avg));
      return '<div style="display:flex;align-items:center;gap:14px;padding:7px 0;border-bottom:1px solid var(--border);">'
        + '<div style="width:92px;font-size:13px;color:var(--muted);">' + escapeHtml(pair[1]) + '</div>'
        + '<div style="flex:1;height:8px;background:var(--border);border-radius:4px;overflow:hidden;"><div style="width:' + pct + '%;height:100%;background:' + scoreColor(sec.avg) + ';border-radius:4px;"></div></div>'
        + '<div style="width:130px;text-align:right;font-size:13px;">' + avgTxt + tag + '</div>'
        + '</div>';
    }).join('');
    // The per-call one_thing feed was replaced by the Performance Summary panel
    // (renderPerfSummary) — one_thing stays on individual call review pages.
    return '<div>' + rows + '</div>';
  }

  // ──────────────────────────────────────────────────────────────────
  // Patterns rendering
  // ──────────────────────────────────────────────────────────────────
  function renderPatternsHtml(p) {
    if (!p) return '<div class="load-state"><div class="spinner"></div></div>';
    if (p.unavailable) {
      return '<div class="empty"><h3>Coach summary unavailable</h3><p>Could not generate coaching patterns right now (the AI service may be temporarily unavailable). Your calls and analytics are unaffected.</p></div>';
    }
    var patterns = (p.patterns || []);
    var banner = '';
    if (p.sample_size != null && p.sample_size < 20) {
      banner = '<div class="signal-banner"><div class="signal-banner-icon"></div>'
             + '<div><strong>Early signal.</strong> Only ' + p.sample_size + ' calls in this window — patterns will sharpen with more data.</div></div>';
    }
    if (patterns.length === 0) {
      return banner + '<div class="empty"><h3>No clear patterns yet</h3><p>Not enough data to surface coaching patterns in this date range.</p></div>';
    }
    var rows = patterns.map(function(it) {
      var conf = (it.confidence || 'low').toLowerCase();
      return '<div class="pattern-card">'
        + '<div class="pattern-headline">' + escapeHtml(it.headline || '') + '</div>'
        + '<div class="pattern-detail">' + escapeHtml(it.detail || '') + '</div>'
        + '<div class="pattern-meta"><span class="pattern-confidence ' + conf + '">' + escapeHtml(conf) + ' confidence</span></div>'
        + '</div>';
    }).join('');
    return banner + '<div class="patterns-list">' + rows + '</div>';
  }

  // ──────────────────────────────────────────────────────────────────
  // Calls list rendering (with inline drill on expand)
  // ──────────────────────────────────────────────────────────────────
  function renderCallsHtml(calls) {
    if (calls.length === 0) {
      return '<div class="empty"><h3>No calls in this window</h3><p>Pick a wider date range above, or wait for new calls to come in.</p></div>';
    }
    return '<div class="calls-list">' + calls.map(callCardHtml).join('') + '</div>';
  }

  function callCardHtml(s) {
    var titleProspect = s.prospect_name
      ? '<span class="name">' + escapeHtml(s.prospect_name) + '</span>'
      : '<span class="anon">unknown prospect</span>';
    var dur = formatDuration(s.duration_seconds);
    var meta = [formatDate(s.started_at), dur];
    if (s.outcome_source === 'inferred') meta.push('outcome inferred');

    return '<div class="call-card" data-session-id="' + escapeHtml(s.session_id) + '">'
      + '<div class="call-head" onclick="toggleCall(\'' + s.session_id + '\')">'
        + '<div class="call-head-left">'
          + '<div class="call-head-title">Call with ' + titleProspect + '</div>'
          + '<div class="call-head-meta">' + meta.map(escapeHtml).join(' · ') + '</div>'
        + '</div>'
        + '<div class="call-head-right">' + outcomeBadge(s.outcome, !!s.ended_at) + '<span class="expand-icon">▾</span></div>'
      + '</div>'
      + '<div class="call-body" id="body-' + escapeHtml(s.session_id) + '"></div>'
    + '</div>';
  }

  function outcomeBadge(outcome, ended) {
    if (outcome === 'win') return '<span class="badge badge-win">Won</span>';
    if (outcome === 'loss') return '<span class="badge badge-loss">Lost</span>';
    if (outcome === 'follow_up') return '<span class="badge badge-fu">Follow-up</span>';
    if (!ended) return '<span class="badge badge-live">Live</span>';
    return '<span class="badge badge-empty">Unmarked</span>';
  }

  async function toggleCall(sessionId) {
    var card = document.querySelector('[data-session-id="' + sessionId + '"]');
    if (!card) return;
    if (state.expandedCallId === sessionId) {
      card.classList.remove('expanded');
      state.expandedCallId = null;
      return;
    }
    if (state.expandedCallId) {
      var prev = document.querySelector('[data-session-id="' + state.expandedCallId + '"]');
      if (prev) prev.classList.remove('expanded');
    }
    state.expandedCallId = sessionId;
    card.classList.add('expanded');
    renderCallBody(sessionId);
  }

  async function renderCallBody(sessionId) {
    var body = document.getElementById('body-' + sessionId);
    if (!body) return;
    body.innerHTML = '<div class="load-state"><div class="spinner"></div></div>';

    var objections = await fetchObjections(sessionId);

    if (objections.length === 0) {
      body.innerHTML = '<div class="empty"><h3>No objections detected</h3><p>This call had no detected framework objections.</p></div>';
      return;
    }
    body.innerHTML = objections.map(objEventHtml).join('');
  }

  function objEventHtml(o) {
    var verdict;
    if (o.overcome === true)       verdict = '<span class="verdict verdict-overcome">Overcame</span>';
    else if (o.overcome === false) verdict = '<span class="verdict verdict-not">Not overcome</span>';
    else                            verdict = '<span class="verdict verdict-unknown">Indeterminate</span>';
    var conf = o.overcome_confidence ? '<span class="verdict-conf">' + escapeHtml(o.overcome_confidence) + ' confidence</span>' : '';
    var time = o.detected_at ? new Date(o.detected_at).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) : '';

    var coaching = o.coaching_note
      ? '<div class="coaching-note">' + escapeHtml(o.coaching_note) + '</div>'
      : '<div class="coaching-note-empty">No coaching narrative generated for this event.</div>';

    var rebuttal = o.framework_rebuttal
      ? '<div class="compare-text">' + escapeHtml(o.framework_rebuttal) + '</div>'
      : '<div class="compare-text empty">No framework rebuttal recorded.</div>';
    var said = o.closer_response
      ? '<div class="compare-text">' + escapeHtml(o.closer_response) + '</div>'
      : '<div class="compare-text empty">No closer transcript captured in the 60s after this objection.</div>';

    return '<div class="obj-event">'
      + '<div class="obj-event-head">'
        + '<div><span class="obj-event-title">' + escapeHtml(o.objection_label || '') + '</span>'
          + (time ? '<span class="obj-event-time">at ' + escapeHtml(time) + '</span>' : '') + '</div>'
        + '<div>' + verdict + conf + '</div>'
      + '</div>'
      + coaching
      + '<div class="compare-grid">'
        + '<div class="compare-pane framework"><div class="compare-label">Scout suggested</div>' + rebuttal + '</div>'
        + '<div class="compare-pane actual"><div class="compare-label">What you said</div>' + said + '</div>'
      + '</div>'
      + (o.notes ? '<div class="obj-notes-row">Classifier note: ' + escapeHtml(o.notes) + '</div>' : '')
    + '</div>';
  }

  // ──────────────────────────────────────────────────────────────────
  // Drill views
  // ──────────────────────────────────────────────────────────────────
  // ═══════════════════════════════════════════════════════════════════════════
  // Team (manager) view — v1.4 flagship. Reps' data is resolved + permission-
  // checked server-side; this only renders. Owner gets a team picker.
  // ═══════════════════════════════════════════════════════════════════════════
  function goTeam() { setView('team'); }
  function teamQP(extra) {
    var qp = 'from=' + encodeURIComponent(state.dateRange.from) + '&to=' + encodeURIComponent(state.dateRange.to);
    if (state.teamSelected) qp += '&team=' + encodeURIComponent(state.teamSelected);
    if (extra) qp += '&' + extra;
    return qp;
  }
  async function fetchTeamJSON(path) {
    var res = await fetch(path, { headers: authHeader() });
    if (res.status === 401) { clearSession(); window.location.replace('/login'); throw new Error('unauth'); }
    if (res.status === 403) return { _forbidden: true };
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  }
  function resetTeamData() {
    state.teamOverview = null; state.teamTrends = null; state.teamRecs = null;
    state.teamHighlights = null; state.teamDigest = null; state.teamDigestDate = null;
  }
  function pickTeam(key) { state.teamSelected = (key === '__default') ? null : key; resetTeamData(); renderTeamView(); }
  function setTeamTrendBucket(b) { state.teamTrendBucket = b; state.teamTrends = null; loadTeam('trends'); }
  function setTeamRange(days) {
    var to = new Date();
    var from = days >= 9999 ? new Date('2025-01-01T00:00:00Z') : new Date(Date.now() - days * 24 * 60 * 60 * 1000);
    state.dateRange = { from: from.toISOString(), to: to.toISOString(), days: days };
    resetTeamData(); renderTeamView();
  }
  // Generic lazy loader for each team panel.
  async function loadTeam(which) {
    var map = {
      context:  { flag: null,                    set: 'teamContext',    url: '/team/context' },
      overview: { flag: 'teamOverviewLoading',   set: 'teamOverview',   url: '/team/overview?' + teamQP() },
      trends:   { flag: 'teamTrendsLoading',     set: 'teamTrends',     url: '/team/trends?' + teamQP('bucket=' + state.teamTrendBucket) },
      recs:     { flag: 'teamRecsLoading',       set: 'teamRecs',       url: '/team/recommendations?' + teamQP() },
      highlights:{flag: 'teamHighlightsLoading', set: 'teamHighlights', url: '/team/highlights?' + teamQP() },
      digest:   { flag: 'teamDigestLoading',     set: 'teamDigest',     url: '/team/digest?' + teamQP(state.teamDigestDate ? 'date=' + state.teamDigestDate : '') },
    };
    var c = map[which]; if (!c) return;
    if (c.flag && state[c.flag]) return;
    if (c.flag) state[c.flag] = true;
    try { state[c.set] = await fetchTeamJSON(c.url); }
    catch (err) { if (err.message === 'unauth') return; state[c.set] = { _error: err.message || 'unknown' }; }
    if (c.flag) state[c.flag] = false;
    if (state.view === 'team') renderTeamView();
  }

  function renderTeamView() {
    var content = document.getElementById('content');
    if (state.teamContext === null) { loadTeam('context'); }
    // kick the panels (lazy, once each)
    if (state.teamOverview === null && !state.teamOverviewLoading) loadTeam('overview');
    if (state.teamTrends === null && !state.teamTrendsLoading) loadTeam('trends');
    if (state.teamRecs === null && !state.teamRecsLoading) loadTeam('recs');
    if (state.teamHighlights === null && !state.teamHighlightsLoading) loadTeam('highlights');
    if (state.teamDigest === null && !state.teamDigestLoading) loadTeam('digest');

    content.innerHTML =
      teamHeaderHtml()
      + '<div class="section fade-in">' + teamAggregateHtml() + '</div>'
      + '<div class="section fade-in">' + teamTrendsHtml() + '</div>'
      + '<div class="section fade-in"><div class="section-header"><h2>Team members</h2>'
        + '<div class="meta">click a rep to open their coaching dashboard</div></div>' + teamRepCardsHtml() + '</div>'
      + '<div class="section fade-in"><div class="section-header"><h2>Call Highlights of the Week</h2></div>' + teamHighlightsHtml() + '</div>'
      + '<div class="section fade-in"><div class="section-header"><h2>Team recommendations</h2>'
        + '<div class="meta">grounded in the team\'s calls</div></div>' + teamRecsHtml() + '</div>'
      + '<div class="section fade-in"><div class="section-header"><h2>Manager daily digest</h2></div>' + teamDigestHtml() + '</div>';
  }

  function teamHeaderHtml() {
    var label = (state.teamOverview && state.teamOverview.team && state.teamOverview.team.label) || 'Team';
    var picker = '';
    var ctx = state.teamContext;
    if (ctx && ctx.is_owner && Array.isArray(ctx.teams) && ctx.teams.length) {
      var opts = ctx.teams.map(function (t) {
        var sel = (state.teamSelected === t.key || (!state.teamSelected && t.is_self)) ? ' selected' : '';
        return '<option value="' + escapeHtml(t.key) + '"' + sel + '>' + escapeHtml(t.label) + ' (' + t.rep_count + ')</option>';
      }).join('');
      picker = '<select class="user-select" onchange="pickTeam(this.value)">' + opts + '</select>';
    }
    var presets = [7, 30, 90].map(function (d) {
      return '<button class="date-preset' + (state.dateRange.days === d ? ' active' : '') + '" onclick="setTeamRange(' + d + ')">' + d + 'd</button>';
    }).join('');
    return '<div class="page-header fade-in">'
      + '<div class="page-header-main"><h1>' + escapeHtml(label) + '</h1>'
        + '<div class="review-meta-row"><span>Manager view</span></div></div>'
      + '<div class="page-header-side" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">' + picker
        + '<div class="date-presets">' + presets + '</div></div>'
    + '</div>';
  }

  function trendArrow(t) {
    if (t > 0) return '<span class="trend up" title="up vs prior period">▲</span>';
    if (t < 0) return '<span class="trend down" title="down vs prior period">▼</span>';
    return '<span class="trend flat" title="flat vs prior period">—</span>';
  }
  function teamAggregateHtml() {
    var o = state.teamOverview;
    if (o && o._forbidden) return '<div class="error">Not authorized for this team.</div>';
    if (o && o._error) return '<div class="error">Could not load team overview: ' + escapeHtml(o._error) + '</div>';
    if (!o) return '<div class="skeleton" style="height:80px;"></div>';
    var t = o.totals;
    function stat(label, val, extra) {
      return '<div class="team-stat"><div class="team-stat-val">' + val + (extra || '') + '</div><div class="team-stat-label">' + label + '</div></div>';
    }
    return '<div class="team-stat-row">'
      + stat('Reps active', t.active_reps + '<span class="team-stat-sub">/' + t.reps + '</span>')
      + stat('Calls analyzed', t.calls_analyzed)
      + stat('Avg score', (t.avg_score == null ? '—' : t.avg_score), ' ' + trendArrow(t.avg_score != null && t.prior_avg_score != null ? (t.avg_score - t.prior_avg_score) : 0))
      + stat('Win-class avg', (t.win_mean == null ? '—' : t.win_mean) + (t.win_n ? '<span class="team-stat-sub"> · ' + t.win_n + ' won</span>' : ''))
      + stat('Objection handle', (t.obj_handle_rate == null ? '—' : t.obj_handle_rate + '%') + '<span class="team-stat-sub"> ' + t.objections_handled + '/' + t.objections_total + '</span>')
      + '</div>';
  }

  function teamTrendsHtml() {
    var toggle = ['week', 'month', 'quarter'].map(function (b) {
      return '<button class="date-preset' + (state.teamTrendBucket === b ? ' active' : '') + '" onclick="setTeamTrendBucket(\'' + b + '\')">' + b.charAt(0).toUpperCase() + b.slice(1) + 'ly</button>';
    }).join('');
    var head = '<div class="section-header"><h2>Trends</h2><div class="date-presets">' + toggle + '</div></div>';
    var tr = state.teamTrends;
    if (!tr) return head + '<div class="skeleton" style="height:120px;"></div>';
    if (tr._error) return head + '<div class="error">Could not load trends: ' + escapeHtml(tr._error) + '</div>';
    var b = tr.buckets || [];
    if (!b.length) return head + '<div class="empty"><p>No analyzed calls in this range yet.</p></div>';
    var max = Math.max.apply(null, b.map(function (x) { return x.avg_score || 0; }).concat([1]));
    var bars = b.map(function (x) {
      var h = Math.round(((x.avg_score || 0) / max) * 100);
      return '<div class="trend-col" title="' + escapeHtml(x.label) + ': avg ' + (x.avg_score == null ? 'n/a' : x.avg_score) + ', ' + x.calls + ' calls' + (x.win_rate == null ? '' : ', ' + x.win_rate + '% win') + '">'
        + '<div class="trend-bar-val">' + (x.avg_score == null ? '' : x.avg_score) + '</div>'
        + '<div class="trend-bar" style="height:' + Math.max(4, h) + '%"></div>'
        + '<div class="trend-bar-label">' + escapeHtml(x.label) + '</div></div>';
    }).join('');
    return head + '<div class="trend-chart">' + bars + '</div>';
  }

  function teamRepCardsHtml() {
    var o = state.teamOverview;
    if (!o || o._forbidden || o._error) return '';
    var reps = o.per_rep || [];
    if (!reps.length) return '<div class="empty"><h3>No reps in this team yet</h3><p>Assign reps to this manager in the admin console.</p></div>';
    return '<div class="team-rep-grid">' + reps.map(function (r) {
      var name = r.display_name || (r.email ? r.email.split('@')[0] : (r.user_id || '').slice(0, 8));
      return '<div class="team-rep-card" onclick="setUser(\'' + escapeHtml(r.user_id) + '\')" title="Open ' + escapeHtml(r.email || '') + '\'s dashboard">'
        + '<div class="team-rep-name">' + escapeHtml(name) + '</div>'
        + '<div class="team-rep-metrics">'
          + '<div class="team-rep-metric"><span class="v">' + r.calls_analyzed + '</span><span class="k">calls</span></div>'
          + '<div class="team-rep-metric"><span class="v">' + (r.avg_score == null ? '—' : r.avg_score) + ' ' + trendArrow(r.trend) + '</span><span class="k">avg score</span></div>'
          + '<div class="team-rep-metric"><span class="v">' + (r.win_mean == null ? '—' : r.win_mean) + '</span><span class="k">win avg</span></div>'
          + '<div class="team-rep-metric"><span class="v">' + (r.obj_handle_rate == null ? '—' : r.obj_handle_rate + '%') + '</span><span class="k">obj handled</span></div>'
        + '</div></div>';
    }).join('') + '</div>';
  }

  function teamInsightHtml(it, kind) {
    var clipBtn = it.clip_url ? '<a class="review-why-clip" href="' + escapeHtml(it.clip_url) + '" target="_blank" rel="noopener">▶ clip</a>' : '';
    var repTag = it.rep ? '<span class="team-rep-tag">' + escapeHtml(String(it.rep).split('@')[0]) + '</span>' : '';
    return '<div class="team-insight ' + kind + '">'
      + '<div class="team-insight-claim">' + escapeHtml(it.claim || '') + '</div>'
      + (it.data ? '<div class="team-insight-data">' + escapeHtml(it.data) + '</div>' : '')
      + (it.quote ? '<div class="review-why-quote">“' + escapeHtml(it.quote) + '”</div>' : '')
      + '<div class="team-insight-foot">' + repTag + clipBtn + '</div>'
    + '</div>';
  }
  function teamRecsHtml() {
    var r = state.teamRecs;
    if (!r) return '<div class="skeleton" style="height:80px;"></div>';
    if (r._error) return '<div class="error">Could not load recommendations: ' + escapeHtml(r._error) + '</div>';
    if (!r.available) return '<div class="empty"><h3>Recommendations unavailable</h3><p>' + escapeHtml(r.reason || 'Could not generate right now.') + '</p></div>';
    var w = r.working || [], i = r.improve || [];
    if (!w.length && !i.length) return '<div class="empty"><p>Not enough analyzed team calls yet.</p></div>';
    return '<div class="obj-group-header" style="color:var(--good)">What\'s working</div>'
      + (w.length ? w.map(function (x) { return teamInsightHtml(x, 'working'); }).join('') : '<div class="empty"><p>—</p></div>')
      + '<div class="obj-group-header" style="color:var(--mid);margin-top:18px;">What to improve</div>'
      + (i.length ? i.map(function (x) { return teamInsightHtml(x, 'improve'); }).join('') : '<div class="empty"><p>—</p></div>');
  }

  function teamHighlightsHtml() {
    var h = state.teamHighlights;
    if (!h) return '<div class="skeleton" style="height:80px;"></div>';
