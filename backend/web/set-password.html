<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set Your Password — Scout Systems</title>
  <link rel="icon" type="image/svg+xml" href="/scout-glyph.svg">
  <link rel="stylesheet" href="/css/style.css"/>
  <style>
    /* Mirrors login.html's layout on the shared brand stylesheet — this is a
       new hire's first screen; it must feel like the same product. */
    body { min-height: 100vh; display: flex; flex-direction: column; }
    .login-nav {
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 40px; border-bottom: 1px solid var(--border);
    }
    .login-nav .nav-logo {
      display: flex; align-items: center; gap: 10px;
      font-size: var(--fs-body); font-weight: var(--fw-emphasis); color: var(--text);
    }
    .login-main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
    .card { width: 100%; max-width: 400px; }
    .card-header { text-align: center; margin-bottom: 28px; }
    .card-header h1 { font-size: var(--fs-company); font-weight: var(--fw-emphasis); margin-bottom: 6px; color: var(--text); }
    .card-header p { font-size: var(--fs-body); color: var(--muted); }
    .field { margin-bottom: 14px; }
    .field label {
      display: block; font-size: var(--fs-eyebrow); font-weight: var(--fw-emphasis); text-transform: uppercase;
      letter-spacing: 0.5px; color: var(--muted); margin-bottom: 6px;
    }
    .field input {
      width: 100%; background: var(--bg2); border: 1px solid var(--border);
      border-radius: var(--radius-sm); color: var(--text); font-size: var(--fs-body); padding: 11px 13px;
      outline: none; transition: border-color 0.15s; font-family: inherit;
    }
    .field input:focus { border-color: var(--green); }
    .field .hint { font-size: var(--fs-eyebrow); color: var(--muted); margin-top: 5px; }

    /* ⚠ THE WORDMARK, MATCHING login.html (ruling 2026-08-29). Same asset, same
       treatment: the lockup breaks out of the 400px card because the artwork is
       1038px wide and reads as a stamp at card width. `min(96vw, 1038px)` caps
       at the asset's NATIVE width — above it the browser upscales.
       ⚠ NO text-shadow / filter GLOW. The glow is IN the artwork; a CSS one
       would double it. (Same note as login.html — do not "fix" it here.) */
    .brand-lockup {
      text-align: center; margin: 0 0 26px;
      width: min(96vw, 1038px);
      margin-left: 50%; transform: translateX(-50%);
    }
    .brand-lockup .brand-img { display: block; width: 100%; height: auto; filter: var(--wordmark-glow); }   /* the shared glow filter, one line to drop (H695) */

    /* ⚠ THE REVEAL CONTROL. A real <button type="button">, not a styled span:
       it must be focusable, reachable by keyboard and announced as a control.
       type="button" is load-bearing — a bare <button> defaults to submit. */
    .pw-wrap { position: relative; }
    .pw-wrap input { padding-right: 62px; }
    .pw-toggle {
      position: absolute; top: 50%; right: 8px; transform: translateY(-50%);
      background: none; border: 0; padding: 4px 6px; cursor: pointer;
      font-family: inherit; font-size: var(--fs-eyebrow); font-weight: var(--fw-emphasis);
      text-transform: uppercase; letter-spacing: 0.5px;
      color: var(--muted); border-radius: var(--radius-sm);
    }
    .pw-toggle:hover { color: var(--text); }
    .pw-toggle:focus-visible { outline: 2px solid var(--green); outline-offset: 1px; }
    /* ⚠ THIS BUTTON DELIBERATELY DIVERGES FROM login.html (ruling 2026-08-18).
       Login's .submit-btn was inverted to black fill / green text / green
       outline; this page KEEPS the original green fill. Justin asked about the
       login button, and changing an unmentioned page by inference is how scope
       creeps — so the divergence is a DECISION, not an oversight. The two pages
       sit next to each other in the invite flow, so if they should match, that
       is a ruling to make rather than a bug to fix. */
    .submit-btn {
      width: 100%; padding: 12px; border-radius: var(--radius-sm); font-size: var(--fs-body); font-weight: var(--fw-emphasis);
      cursor: pointer; border: none; font-family: inherit; background: var(--green);
      color: #000; margin-top: 4px; transition: background 0.15s, opacity 0.15s;
    }
    .submit-btn:hover:not(:disabled) { background: var(--green-dark); }
    .submit-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .error-msg {
      background: rgba(239,68,68,0.08); border: 1px solid rgba(239,68,68,0.2);
      border-radius: var(--radius-sm); color: #f87171; font-size: var(--fs-label); padding: 10px 12px;
      margin-top: 12px; display: none; line-height: 1.5;
    }
    .link-problem { display: none; text-align: center; }
    .link-problem .icon {
      width: 56px; height: 56px; background: var(--bg2); border: 1px solid var(--border);
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: var(--fs-company); margin: 0 auto 20px; color: var(--muted);
    }
    .link-problem h2 { font-size: var(--fs-number); font-weight: var(--fw-emphasis); margin-bottom: 8px; color: var(--text); }
    .link-problem p { font-size: var(--fs-body); color: var(--muted); line-height: 1.6; }
  </style>
</head>
<body>

<nav class="login-nav">
  <a href="/" class="nav-logo">
    <svg width="22" height="24" viewBox="0 0 20 22" xmlns="http://www.w3.org/2000/svg">
      <path d="M1.5 12 A8.5 8.5 0 0 1 18.5 12" stroke="#09e046" stroke-width="1.6" stroke-linecap="round" fill="none"/>
      <path d="M4.5 12 A5.5 5.5 0 0 1 15.5 12" stroke="#09e046" stroke-width="1.6" stroke-linecap="round" fill="none"/>
      <path d="M7.5 12 A2.5 2.5 0 0 1 12.5 12" stroke="#09e046" stroke-width="1.6" stroke-linecap="round" fill="none"/>
      <circle cx="10" cy="12" r="1.6" fill="#09e046"/>
      <circle cx="10" cy="16" r="1.2" fill="#09e046"/>
      <circle cx="10" cy="19.5" r="0.8" fill="#09e046"/>
    </svg>
    <span>Scout</span>
  </a>
</nav>

<main class="login-main">
  <div class="card">

    <!-- ⚠ OUTSIDE both states on purpose: someone arriving on a dead link
         still sees whose product this is. -->
    <div class="brand-lockup">
      <img class="brand-img" src="/scout-wordmark.svg"
           alt="Scout Systems" width="1090" height="170" fetchpriority="high">
    </div>

    <div id="setForm" style="display:none">
      <div class="card-header">
        <h1 id="setTitle">Set your password</h1>
        <p id="setSub">Welcome to Scout — pick a password to get started.</p>
      </div>
      <div class="field">
        <label for="pw1">New password</label>
        <div class="pw-wrap">
          <input type="password" id="pw1" autocomplete="new-password" placeholder="At least 10 characters">
          <button type="button" class="pw-toggle" id="tog1" onclick="togglePw('pw1','tog1')" aria-controls="pw1" aria-pressed="false">Show</button>
        </div>
        <div class="hint">Minimum 10 characters.</div>
      </div>
      <div class="field">
        <label for="pw2">Confirm password</label>
        <div class="pw-wrap">
          <input type="password" id="pw2" autocomplete="new-password" placeholder="Type it again">
          <button type="button" class="pw-toggle" id="tog2" onclick="togglePw('pw2','tog2')" aria-controls="pw2" aria-pressed="false">Show</button>
        </div>
      </div>
      <button class="submit-btn" id="submitBtn" onclick="submitPassword()">Set password &amp; log in</button>
      <div class="error-msg" id="formError"></div>
    </div>

    <div class="link-problem" id="linkProblem">
      <div class="icon">🔗</div>
      <h2 id="linkProblemTitle">This link isn't valid anymore</h2>
      <p id="linkProblemBody">It may have expired or already been used.<br>
         Ask your admin to send you a fresh one — it only takes a second.</p>
    </div>

  </div>
</main>

<script>
  var STORAGE_KEY = 'scout_session_v1';
  var tokens = null;

  // Flow context (invite vs reset). Carried by the recovery link's redirect_to
  // (?flow=reset) — same page, one source of truth, no second reset page.
  // Captured from the query BEFORE init scrubs the URL to pathname-only.
  var IS_RESET = (function () {
    try { return new URLSearchParams(window.location.search).get('flow') === 'reset'; } catch (e) { return false; }
  })();
  var BUTTON_LABEL = IS_RESET ? 'Update password & log in' : 'Set password & log in';

  // The Supabase verify redirect delivers everything in the URL fragment:
  // success → #access_token=…&refresh_token=…&expires_at=…&type=recovery
  // used/expired → #error=access_denied&error_code=otp_expired&…
  function parseFragment() {
    var out = {};
    (window.location.hash || '').replace(/^#/, '').split('&').forEach(function (kv) {
      var i = kv.indexOf('=');
      if (i > 0) out[kv.slice(0, i)] = decodeURIComponent(kv.slice(i + 1));
    });
    return out;
  }

  function init() {
    // Parameterize copy by flow (invite vs reset). A reset user is not a new hire
    // with an admin to ask — point them back to the login page instead.
    if (IS_RESET) {
      document.getElementById('setTitle').textContent = 'Reset your password';
      document.getElementById('setSub').textContent = 'Choose a new password for your Scout account.';
      document.getElementById('linkProblemTitle').textContent = "This reset link isn't valid anymore";
      document.getElementById('linkProblemBody').innerHTML =
        'It may have expired or already been used.<br>Head back to the <a href="/login">login page</a> and request a new one.';
    }
    document.getElementById('submitBtn').textContent = BUTTON_LABEL;
    var f = parseFragment();
    // Scrub the fragment from the address bar immediately — the token must not
    // linger in history/screenshots. We keep it in memory only.
    try { history.replaceState(null, '', window.location.pathname); } catch (e) {}
    if (f.access_token && f.refresh_token) {
      tokens = { access_token: f.access_token, refresh_token: f.refresh_token, expires_at: parseInt(f.expires_at, 10) || null };
      document.getElementById('setForm').style.display = '';
      document.getElementById('pw1').focus();
    } else {
      // No usable session — expired, already used, or visited directly.
      document.getElementById('linkProblem').style.display = 'block';
    }
  }

  /* ⚠ CUSTOMER LANGUAGE: the button says what pressing it DOES ("Show" /
     "Hide"), never what the field's state is. A control labelled with its own
     state reads as a claim about the field and gets pressed the wrong way.
     ⚠ Focus is returned to the input so a keyboard user is not stranded on the
     button mid-password, and aria-pressed carries the state for a screen
     reader that cannot see the label change. */
  function togglePw(inputId, btnId) {
    var el = document.getElementById(inputId);
    var btn = document.getElementById(btnId);
    if (!el || !btn) return;
    var reveal = el.type === 'password';
    el.type = reveal ? 'text' : 'password';
    btn.textContent = reveal ? 'Hide' : 'Show';
    btn.setAttribute('aria-pressed', reveal ? 'true' : 'false');
    el.focus();
  }

  function showError(msg) {
    var el = document.getElementById('formError');
    el.textContent = msg;
    el.style.display = 'block';
  }

  async function submitPassword() {
    var pw1 = document.getElementById('pw1').value;
    var pw2 = document.getElementById('pw2').value;
    document.getElementById('formError').style.display = 'none';
    if (pw1.length < 10) { showError('Password must be at least 10 characters.'); return; }
    if (pw1 !== pw2) { showError("Those passwords don't match."); return; }

    var btn = document.getElementById('submitBtn');
    btn.disabled = true; btn.textContent = 'Setting password…';
    var res;
    try {
      res = await fetch('/auth/set-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + tokens.access_token },
        body: JSON.stringify({ password: pw1 }),
      });
    } catch (e) {
      btn.disabled = false; btn.textContent = BUTTON_LABEL;
      showError('Scout could not reach the server, so the password was not saved. Nothing was changed — check your connection and try again, and if it keeps happening tell your admin.');
      return;
    }
    if (res.status === 401) {
      // Token died between page load and submit — same friendly message.
      document.getElementById('setForm').style.display = 'none';
      document.getElementById('linkProblem').style.display = 'block';
      return;
    }
    if (!res.ok) {
      var body = null; try { body = await res.json(); } catch (e) {}
      btn.disabled = false; btn.textContent = BUTTON_LABEL;
      showError((body && body.error) || 'Could not set the password. Please try again.');
      return;
    }
    // Password set — the fragment session is a real session (same fields the
    // login page stores). Persist it and land on the dashboard, where connecting
    // a recording source (Zoom or Fathom) is the first action.
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      token: tokens.access_token,
      access_token: tokens.access_token,
      refresh_token: tokens.refresh_token,
      expires_at: tokens.expires_at,
    }));
    btn.textContent = 'Taking you to Scout…';
    window.location.replace('/dashboard');
  }

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && document.getElementById('setForm').style.display !== 'none') submitPassword();
  });
  init();
</script>
</body>
</html>
