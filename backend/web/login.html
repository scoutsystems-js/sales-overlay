<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Scout Systems</title>
  <!-- ⚠ MONTSERRAT IS A FEEL TEST ON THIS PAGE ONLY (Justin, 2026-08-18) — the
       site-wide sweep is a separate item. TWO WEIGHTS ONLY: 300 Light for the
       page, 500 Medium for the wordmark. display=swap so a slow font can never
       block the sign-in form from rendering. -->
  <!-- ⚠⚠ THE MONTSERRAT CDN LINK AND BOTH PRECONNECTS WERE DELETED HERE
       (2026-08-20). THEY HAD NEVER WORKED. index.js sets
       `style-src 'self' 'unsafe-inline'` and `font-src 'self' data:`, so
       fonts.googleapis.com was blocked from serving the stylesheet AND
       fonts.gstatic.com was blocked from serving the file — two independent
       blocks. This page has been rendering the SYSTEM FALLBACK, not Montserrat,
       for its entire life, and the only cost of the markup was three dead
       requests on every login.
       ⚠ Proven, not inferred: registered face count 0 for Montserrat while
       'Archivo Expanded' (self-hosted, same page) loaded fine, with a
       real-vs-bogus width control shown to move first.
       Saira is self-hosted below for exactly this reason. -->
  <style>
    /* ⚠ SELF-HOSTED, NOT LINKED (Justin, 2026-08-18). This is the wordmark on the
       first page anyone sees, so a render-blocking third-party request is the
       wrong trade. 5,664 bytes — Google's latin subset, against 112KB for the
       full TTF. font-display:swap so a slow font can never block the form. */
    /* ⚠⚠⚠ THIS FILE CANNOT DRAW THE WORDMARK, AND HAS NEVER DRAWN IT. Its cmap
       covers exactly TWO printable characters: SPACE and "A". "SCOUT SYSTEMS"
       contains no "A", so EVERY VISIBLE LETTER of the lockup below falls back to
       the system face — and has done since this file shipped on 2026-08-18.
       The same file, and the same defect, is in dashboard.html's welcome overlay.

       ⚠ MEASURED THREE INDEPENDENT WAYS on 2026-08-20, because one instrument
       reporting this would not have been believable:
         canvas advance per glyph   every capital = the monospace advance exactly
         DOM scrollWidth            rendered wordmark k = 9.79, not Archivo's 12.226
         cmap parsed from the file  printable coverage is the two-character string " A"
       and then confirmed by LOOKING at the deployed page: the wordmark is a
       normal-width grotesque, not an expanded face.

       ⚠⚠ WHY NOTHING CAUGHT IT — every check that existed was a check on the
       REQUEST or on the BYTES, never on the GLYPHS:
         document.fonts        -> status 'loaded'        (the FILE arrived)
         getComputedStyle      -> 'Archivo Expanded'     (the REQUEST was made)
         the network           -> 200, font/woff2        (the BYTES are there)
       All three are true of a font with no letters in it. Guarded now by
       test/font-coverage.test.js + lib/woff2-coverage.js.

       ⚠ DO NOT "FIX" THIS BY EDITING CSS. The declaration is correct; the FILE is
       wrong. The three options (repair the file / the filed Saira-wide item /
       accept the fallback and delete this) are a ruling, reported 2026-08-20 and
       not yet made. Whichever is chosen, --wm-vw and the lockup k must be
       re-derived for whichever face ACTUALLY renders — the current 7.8vw was
       derived for Archivo's k = 12.226 and is only safe today by accident, since
       the face that really draws is ~25% narrower. */
    @font-face {
      font-family: 'Archivo Expanded';
      font-style: normal;
      font-weight: 700;
      font-display: swap;
      src: url('/fonts/archivo-expanded-700.woff2') format('woff2');
    }
  </style>
  <link rel="stylesheet" href="/css/style.css"/>
  <style>
    /* Login-specific layout on top of the shared brand stylesheet. */
    /* ── THE PAGE FACE IS SAIRA — the Montserrat feel test is OVER and the CDN
       link it needed is deleted (see the note above the <head> styles).
       ⚠ THIS COMMENT USED TO SAY "MONTSERRAT, LOGIN PAGE ONLY — a feel test",
       which stopped being true when Saira shipped site-wide on 2026-08-20 and
       was corrected on 2026-08-20. The fallback stack is kept so a blocked or
       slow font degrades to the system face rather than to a serif. */
    body, .login-nav, .login-main, .login-footer, input, button, label, h1, p, a {
      font-family: 'Saira', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    /* ⚠ Self-hosted, same file the dashboard uses — one download, cached across
       both pages. See the deletion note above for why a CDN link cannot work. */
    @font-face {
      font-family: 'Saira';
      font-style: normal;
      font-weight: 100 900;
      font-stretch: 50% 125%;
      font-display: swap;
      src: url('/fonts/saira-variable-latin.woff2') format('woff2-variations');
    }
    body {
      /* ⚠⚠ LOGIN STAYS AT 300 — IT IS NOT IN SCOPE FOR THE 400 -> 450 RULING.
         That ruling targets body copy set at 400; this page deliberately runs
         LIGHT (300) as its own treatment, enforced by the catch-all block near
         the bottom of this file. A 450 declared here would be dead anyway —
         `body { font-weight: 300 }` appears later and CSS is last-wins — so it
         was removed rather than left looking effective.
         ⚠ THE OLD RATIONALE FOR THAT BLOCK IS NOW STALE, THOUGH THE DESIGN IS
         NOT: it forces 300/500 because only two Montserrat weights were thought
         to be loaded, and a weight outside them would have been SYNTHESISED.
         Saira ships the full 100–900 range, so the synthesis risk is gone and
         the 300 is now a free choice rather than a constraint. Changing it is a
         design decision nobody has made. */
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .login-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 40px;
      border-bottom: 1px solid var(--border);
    }
    .login-nav .nav-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
    }
    .login-nav .back {
      font-size: 13px;
      color: var(--muted);
    }
    .login-nav .back:hover { color: var(--text); }

    .login-main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .card { width: 100%; max-width: 400px; }

    /* ── THE BRAND LOCKUP above the sign-in form (Josh, 2026-08-18) ────────
       ⚠⚠ THE MARK IS THE INLINE SVG, NOT src/assets/icon.png — AND THIS IS A
       RULING, NOT AN OVERSIGHT. The instruction was to use the real logo asset;
       decoding it is what argued against it, and Justin APPROVED the
       substitution on 2026-08-18 with the reason that settles it:

           AN ASSET WITH THE WORDMARK BAKED IN CANNOT SIT ABOVE THE WORDMARK.

       ⚠ DO NOT "FIX" THIS BACK TO icon.png. Decoded, that file is an APP ICON,
       not a logo:
         1024x1024, PNG colour type 2 → NO ALPHA CHANNEL, so it carries a solid
                                        near-black plate and renders as a square
         the word "SCOUT" baked in    → prints the word TWICE above SCOUT SYSTEMS
         a generator watermark        → shipped to every visitor
         720KB for a ~76px render     → on a page that loads no other images
       Only the first of those is fixable by resizing; the other three are
       properties of the artwork.

       IF the raster is ever genuinely wanted here, it needs a NEW export: alpha
       channel, no baked-in wordmark, no watermark, downscaled. That is an asset
       task, not a code change — swapping this <svg> for an <img> would
       reintroduce all four problems at once.

       The vector is the same mark — concentric arcs over descending dots — in
       the brand green, with no plate, no duplicate word, no watermark and no
       request. It scales crisply at any size.

       ⚠⚠ AMENDED 2026-08-18, SAME DAY: the mark is no longer a small lockup
       above the wordmark. Justin ruled it becomes a LARGE BACKGROUND SHAPE
       behind the form (body::before below), and the wordmark roughly doubled.
       THE RULING ABOVE IS UNCHANGED IN SUBSTANCE — it is about WHICH ARTWORK
       may represent the mark, and the answer is still "the vector, never
       icon.png". This amendment only changes WHERE that vector is drawn.
       Both notes are kept together deliberately: a superseded placement and a
       standing artwork ruling in two separate places would read as two rulings
       that disagree.

       ⚠ THE TOKEN HERE IS --green, NOT --accent. The auth pages are styled by
       /css/style.css, which has no --accent at all; the dashboard's token set
       is a different document. Written as var(--accent) this would silently
       fall back to inherited colour and render the wordmark in plain white —
       correct-looking CSS, wrong page. */
    /* ⚠ THE LOCKUP IS WIDER THAN THE CARD, DELIBERATELY. The card is
       max-width:400px and "SCOUT SYSTEMS" at 68px needs ~520px, so inside the
       card it WRAPPED to two lines — which was not asked for, and the taller
       two-line block is what drove the wordmark down into the background mark.
       Caught by looking at the deployed page; every measurement I had taken
       said the type was fine, because none of them asked whether it fit. */
    /* ⚠⚠ THE LOCKUP BREAKS OUT OF THE CARD ON PURPOSE. Justin: the wordmark must
       be AT LEAST 50% WIDER than the login box — 400px box, so 600px+ of
       wordmark. It cannot live inside a max-width:400px card and be wider than
       it, so it is pulled to the viewport's own width and re-centred. */

    /* ══ THE LOCKUP — the mark replaces the O in SCOUT (Justin, 2026-08-18) ══
       ⚠⚠ THESE ARCS ARE DELIBERATELY **NOT** THE BACKGROUND MARK'S. The
       background mark keeps 180-degree semicircles; this lockup REDRAWS them to
       a 285-degree sweep (a 75-degree gap at the bottom) so the ring reads as an
       O rather than as a wifi arc. That is a deliberate design divergence, ruled
       2026-08-18 — the "byte-identical" rule existed to stop the BACKGROUND mark
       drifting by accident, never to forbid an approved new lockup.

       ⚠ THE RING'S BOTTOM IS THE BASELINE, which is what makes the whole thing
       work: at a 285-degree sweep the ring spans 15.244 units and IS the cap
       height, so the dots keep their mocked positions (1 and 2 inside the ring,
       3 on the opening) and still descend only 7.4px at a 104px font — against
       a 21.8px descender. No tightening needed, and ZERO line-height cost.

       ⚠⚠ THE AVAILABLE WIDTH IS THE LOCKUP'S OWN CAP, NOT 92vw — and getting
       that wrong is what made Archivo run off the screen. The box was
       min(92vw, 900px), so on any desktop the binding number is 900px, not the
       viewport. 104px x k = 1016px (Montserrat) and 1272px (Archivo): BOTH
       overflowed a 900px box, and "one size larger" was impossible inside it.
       The box is now min(96vw, 1300px) and the coefficients are derived against
       96vw. ⚠ A no-wrap check that reads getBoundingClientRect() on the BLOCK
       measures the BOX and returns the clamped width — it cannot see overflow.
       Check scrollWidth vs clientWidth.

       ⚠ PER-FACE METRICS, MEASURED FROM THE FONT FILES (not the browser, which
       has twice reported a synthesised face's numbers):
                              cap      O advance   k@0.08em   max vw
         Montserrat 700       0.700em  0.844em     9.769      9.42
         Archivo Expanded 700 0.686em  1.016em    12.226      7.52
       Archivo is 25.2% WIDER, so it needs a much smaller coefficient. The glyph
       is sized from --cap-em and --o-adv-em so it re-fits per face rather than
       being scaled by eye. */
    /* ⚠⚠ THE GLYPH IS SIZED FROM THE RING'S **INK**, NOT FROM ITS BOX, AND NOT
       FROM THE viewBox. It read short and low for THREE compounding reasons —
       see test/lockup-glyph.test.js, which recomputes every number below:
         1  --cap-em was 0.686 (font file). The face RENDERS 0.7197.
         2  the viewBox is cropped to the full ink, dots included, so sizing the
            BOX to the cap height left the RING at 91.3% of it.
         3  the baseline was pinned to the arc's path end (18.744) rather than
            to where it PAINTS (18.744 + half a stroke).

       ⚠ NOTHING HERE IS A PICKED NUMBER. A value in viewBox units is a
       FUNCTION OF THE BOX — this stroke has been wrong four times for exactly
       that reason — so the derivation lives in the calc chain. Change
       --mark-stroke-px or --cap-em and the box, the drop and the dots follow.

       THE RING (outer arc): centre (10,12) r 8.5 swept 285deg, so the PATH runs
       y 3.5 -> 18.744. Round-capped it PAINTS half a stroke past each end:
         ink top    = 3.5    - s/2      <- the CAP LINE
         ink bottom = 18.744 + s/2      <- the BASELINE
       The stroke is on both sides of the ask (it thickens the ring it is
       measured against), so 6px is a solve, not a division:
         (15.244 + s) * pxPerUnit = cap   AND   s * pxPerUnit = 6
         s = 6 x 15.244 / (104 x 0.7197 - 6) = 1.3285 units = 6.00px at 104px */
    .brand-o {
      display: inline-block;
      width: calc(1em * var(--o-adv-em));
      height: calc(1em * var(--o-box-em));
      vertical-align: baseline;
      /* the dots hang below the baseline; the box drops by exactly that much */
      margin-bottom: calc(-1em * var(--o-drop-em));
      overflow: visible;
    }
    .brand-o svg { width: 100%; height: 100%; overflow: visible; display: block; }
    /* ⚠ the attributes on the elements carry the same derived values as an
       inert fallback; CSS wins wherever it is supported. They must agree. */
    .brand-o svg path { stroke-width: calc(var(--mark-stroke) * 1px); }
    .brand-o svg circle:nth-of-type(1) { r: calc(var(--mark-stroke) * var(--dot-1) * 1px); }
    .brand-o svg circle:nth-of-type(2) { r: calc(var(--mark-stroke) * var(--dot-2) * 1px); }
    .brand-o svg circle:nth-of-type(3) { r: calc(var(--mark-stroke) * var(--dot-3) * 1px); }

    /* ── the typeface trial (temporary scaffolding, ?font=archivo) ──────────
       ⚠ Body text stays Montserrat Light either way — Archivo is a display face
       and only the wordmark changes. The loser comes out once Justin picks. */
    /* ⚠ ARCHIVO EXPANDED 700 IS THE WORDMARK (Justin picked it, 2026-08-18).
       The ?font= trial is REMOVED — Montserrat is out of the wordmark and stays
       only as the body face, which is why the link above now carries 300;500
       and no 700. The glyph metrics are Archivo's own, measured from its file:
       cap 0.686em, O advance 1.016em, k@0.08em 12.226 (25.2% wider than
       Montserrat), so the coefficient is 7.8vw against the 96vw lockup box. */
    /* ⚠⚠ --cap-em IS MEASURED FROM WHAT THE FACE RENDERS, NOT READ FROM THE
       FONT FILE. It carried 0.686 (the file's metric) while all SEVEN flat-
       topped caps — T U E H I M Y — render at 0.7197em, so the glyph box
       started 4.7% short of the letters beside it.
       ⚠ DO NOT RE-MEASURE THIS WITH "S". The round caps deliberately OVERSHOOT
       the cap line for optical correction — S 0.7407, C 0.7334, O 0.7417,
       G 0.7383, ~2.9% over — and measuring one is how a wrong cap height gets
       derived. Use a flat-topped cap. */
    :root { --wm-family: 'Archivo Expanded'; --wm-vw: 7.8vw;
            --wm-cap-n: 104; --wm-cap: 104px;
            --cap-em: 0.7197; --o-adv-em: 1.016;

            /* the ask: 6px rings at the full title size */
            --mark-stroke-px: 6;
            /* the outer arc's PATH span, y 3.5 (circle top) -> 18.744 (285deg ends) */
            --ring-path-span: 15.244;
            /* dot radii as a ratio of the stroke, from the approved mark
               (r 1.6/1.2/0.8 on a 2.2 stroke) — they thin WITH the rings */
            --dot-1: 0.7272727; --dot-2: 0.5454545; --dot-3: 0.3636364;

            --mark-stroke: calc(var(--mark-stroke-px) * var(--ring-path-span)
                                / (var(--wm-cap-n) * var(--cap-em) - var(--mark-stroke-px)));
            /* the ring's PAINTED span — this is the piece that must equal the cap */
            --ring-ink-span: calc(var(--ring-path-span) + var(--mark-stroke));
            /* the whole viewBox is taller: it also holds the descending dots */
            --vb-height: calc(16 + var(--mark-stroke) * (var(--dot-3) + 0.5));
            --vb-drop:   calc(0.756 + var(--mark-stroke) * (var(--dot-3) - 0.5));
            --o-box-em:  calc(var(--cap-em) * var(--vb-height) / var(--ring-ink-span));
            --o-drop-em: calc(var(--cap-em) * var(--vb-drop)   / var(--ring-ink-span)); }

    /* ⚠⚠ THE GREYS STAY ON THIS PAGE — A DELIBERATE EXCEPTION TO THE NO-GREY
       SWEEP, CLOSED NOT DEFERRED (Justin, 2026-08-18: "it looks perfect").

       The dashboard's no-grey rule repointed --muted to --text there; this page
       keeps its genuine grey (#8a9aaa) on 11 elements — the field labels, the
       card subtitle, "Back to site", "Forgot password?", "Sign out" and the
       footer links. That is what keeps the form quiet beneath the wordmark.

       ⚠ THE CONSEQUENCE, RECORDED SO A FUTURE "MAKE IT BRIGHTER" HAS AN ANSWER
       RATHER THAN A FRESH INVESTIGATION: the grey sets this surface's contrast
       ceiling at 0.215, so the background mark is capped at 0.20 and IS ALREADY
       THERE. It cannot be brightened while the greys stay — the lever is the
       grey, not the mark. Raising one means reopening the other, and that trade
       was put to Justin and declined.

       The DASHBOARD's 0.40 is unaffected: different surface, different tokens,
       its own measured ceiling of 0.535. A criterion is not a constant. */

    /* ⚠⚠ THE LOCKUP IS LOGIN-ONLY, AND THE NAV MARK STAYS — A DECISION, NOT
       AN INCONSISTENCY (Justin, 2026-08-18). The planned "mark replaces the O
       in SCOUT" lockup keeps the WHOLE mark, arcs AND dots. The trailing dot is
       7.3% of the mark's height, so it needs a mark >=27px tall merely to reach
       2px — which as an O on the cap height means a font-size of ~39px minimum.
       The nav renders at 15px. THE LOCKUP THEREFORE CANNOT GO IN THE NAV, and
       the plain mark + "Scout" stays there permanently.

       ⚠ DO NOT "UNIFY" THE TWO LATER. Two treatments coexisting is the accepted
       consequence of keeping the dots; an editor who notices the inconsistency
       and harmonises them will either shrink the lockup below its resolution
       floor or enlarge the nav. Both were considered and declined. */

    .brand-lockup {
      text-align: center; margin: 0 0 30px;
      width: min(96vw, 1300px);
      margin-left: 50%; transform: translateX(-50%);
    }

    /**
     * ⚠⚠ THE NO-WRAP IS STRUCTURAL, NOT A CHOSEN NUMBER — AND THE PREVIOUS
     * VERSION WAS THE OPPOSITE, WHICH IS WHY IT WRAPPED AGAIN ON JUSTIN'S
     * NARROWER WINDOW. `clamp(30px, 7.2vw, 68px)` fits at the ONE width it was
     * verified at; any fixed px value wraps at some viewport.
     *
     * "It fits" is a RELATIONSHIP, not a property:
     *
     *     textWidth = k x fontSize        (k measured, not guessed)
     *     fontSize_max = availableWidth / k
     *
     * ⚠⚠ RE-MEASURED FOR MONTSERRAT — k IS FACE-SPECIFIC AND THE OLD NUMBER
     * WOULD HAVE WRAPPED. The previous 10.3vw came from k = 8.924, measured on
     * the SYSTEM face. Montserrat Medium at the same 0.08em tracking measures
     * k = 9.495 — 6.4% WIDER — so 10.3vw x 9.495 = 97.8vw of text in a 92vw
     * lockup. Carrying the number across would have reproduced this page's wrap
     * for the third time.
     *
     * The safe k is the MAX across every face that might actually render:
     * Montserrat 500 = 9.495, system fallback 500 = 8.924. If the webfont is
     * blocked or slow the fallback draws, and the formula has to hold for
     * whichever one does — so the WIDER face sets the coefficient.
     *
     *     92 / 9.495 = 9.69vw  ->  shipped 9.6vw
     *
     * The px cap (92) only engages above a ~958px viewport, where 92vw = 881px
     * against 92 x 9.495 = 874px of text — so the cap still cannot be the thing
     * that causes a wrap.
     *
     * ⚠ k DEPENDS ON WEIGHT AND TRACKING. Changing either without re-deriving
     * 10.3vw reintroduces the bug. Measured range: k is 7.88 (300 / 0.02em) to
     * 9.76 (800 / 0.12em), so a heavier or wider setting NEEDS A SMALLER vw
     * coefficient. Test asserts the pairing.
     */
    .brand-lockup .brand-name {
      font-size: min(var(--wm-vw), var(--wm-cap));
      font-family: var(--wm-family), 'Montserrat', -apple-system, sans-serif;
      /* Justin: BIGGER, NOT BOLD. 800 -> 500, and the extra tracking is what
         keeps a lighter weight from reading thin at this size. */
      font-weight: 700; letter-spacing: 0.08em;
      white-space: nowrap;
      color: var(--green); line-height: 1.02;
      text-shadow: 0 0 30px rgba(var(--green-rgb), 0.3);
    }

    /* ── THE MARK AS A BACKGROUND (Justin, 2026-08-18) ────────────────────
       ⚠ THIS SUPERSEDES THE SMALL MARK ABOVE THE WORDMARK. The lockup is now
       the WORDMARK ALONE; the logo is a large shape behind the form, using the
       same treatment as the dashboard's page motifs.

       Same rules as those motifs, deliberately rather than by coincidence:
         • the brand green
         • opacity inside the established 0.16-0.30 band (0.20)
         • pointer-events: none, so it can never intercept a click on the form
         • an ink check before shipping, because this is text over a large shape
           — the exact collision case that sweep exists for

       ⚠ THE GREEN IS HARD-CODED AS %2309e046 AND CANNOT BE A TOKEN. A data URI
       is an opaque string to CSS: var() does not resolve inside it, and the `#`
       must be percent-encoded. That is the URL-ENCODED SPELLING already
       recorded here — a sweep over `#09e046` will not match it. A test pins
       this value to --green so the two cannot drift silently. */
    /* ⚠⚠ THE DISCS CARRY THEIR OWN ALPHA, AND THE REASON IS A RULE, NOT A
       TASTE CALL (2026-08-20). Justin: the mark's filled dots read as UI
       CONTROLS — one sits between the password field and "Forgot password?",
       another under the Log In button, and a user reasonably takes them for a
       status dot or a radio.
       ⚠ THE CAUSE WAS THAT THE LAYER OPACITY WAS DERIVED AGAINST THE WRONG
       PART OF THE ARTWORK. Every contrast solve here was for text sitting on a
       1-3px STROKE. The dots are solid `fill`. Measured at 845px tall: the
       stroke renders 1.58px (correctly inside the product's 1-3px line work)
       while disc 1 is 39.5px across — 25x the stroke width, and fully filled.
       Same alpha, 25x the ink, a completely different perceptual object.
       ⚠ SO IT IS NOT A CONTRAST PROBLEM AND MUST NOT BE SOLVED WITH THE LAYER
       OPACITY. Contrast already clears AA at 4.58:1; dropping the layer would
       dim the strokes (which are correct) to fix the discs (which are not).
       fill-opacity 0.3 takes the discs to an effective alpha of 0.063 — a green
       delta of +13/255, at the visibility threshold — so they read as texture
       while the rings keep their weight.
       ⚠⚠ WHY NOT MOVE THE MARK INSTEAD: that was considered and REJECTED. "No
       disc lands on an interactive element" is a RELATIONSHIP between two
       things that both move — the form shifts with viewport height and grows
       when an error message appears — so it can only ever be verified at the
       one viewport you checked. It is the same unreachable zero-overlap
       criterion that already failed the ink sweep below 1600px. Disc-specific
       alpha is viewport-independent and needs no re-verification when the form
       changes.
       ⚠ THE FOREGROUND LOCKUP MARK KEEPS SOLID DOTS — it IS the brand mark and
       is meant to read as an object. Only this background layer is dimmed. */
    body::before {
      content: '';
      position: fixed;
      left: 0; right: 0;
      z-index: 0;
      pointer-events: none;
      /**
       * ⚠⚠ THE OPACITY IS DERIVED FROM THE CONTRAST FLOOR, NOT CHOSEN.
       *
       * At 3x and centred the mark sits behind the form and ZERO OVERLAP IS
       * IMPOSSIBLE — that is accepted, not a defect. The criterion is the one
       * that holds at every width: the worst-exposed text still clears AA.
       *
       * RE-DERIVED for the smaller box, across BOTH AXES (width 1024-2560 AND
       * height 720-1600). Six viewports, and the answer is unchanged:
       *
       *     0.21   set by --muted text (#8a9aaa), margin 4.58:1
       *
       * ⚠ IT HAS NOW COME BACK 0.21 THREE TIMES — across a font change, an
       * offset, and a 3x size change — and that is EXPLAINABLE rather than a
       * stale measurement: the binding case is a COLOUR relationship, muted
       * text against a solid mark stroke. Geometry and typography move WHICH
       * elements overlap and by how much; they cannot move a contrast ratio
       * between two fixed colours. What did change is the VOLUME: overlap fell
       * from hundreds of ink pixels per element to 12-140, because the mark is
       * a fraction of its former size.
       *
       * ⚠⚠ THE LIVE VALUE IS 0.21. This comment block said "ships at 0.20" and a
       * LATER block in the same rule said "0.26, still inside the 0.16-0.30

         primary-action treatment. It is defined independently here and in
         set-password.html, and the site-wide primary button is `.btn-primary`
         in css/style.css (landing page + the orphaned download page), which is
         untouched. So this is login-page-only by construction — but
         set-password.html now carries the OLD look from its own copy, and those
         two pages sit next to each other in the invite flow. That divergence is
         Justin's to rule on rather than something to fix by side effect. */
      background: #000;
      color: var(--green);
      border: 1px solid var(--green);

    /* ══ WEIGHT DISCIPLINE — LAST IN THE STYLESHEET ON PURPOSE ══
       THE PAGE IS 450, MATCHING THE REST OF THE SITE (Justin, 2026-08-20).

       ⚠⚠ THE VALUE WAS EDITED IN PLACE, 300 -> 450 — NOT OVERRIDDEN BY A LATER
       BLOCK. An override would have left two rules in this file disagreeing
       about the same declaration, and last-wins would decide which one a reader
       is actually looking at. This file has already produced two stale
       contradictions (an opacity claimed as 0.20 AND 0.26 while rendering 0.21,
       and a verbatim duplicated ink-check block); a third was not worth the
       convenience. There is now exactly one weight declaration per selector.

       ⚠ WHY 300 WAS HERE, AND WHY THAT REASON IS GONE. The block's ORIGINAL
       purpose was faux-bold avoidance: only Montserrat 300 and 500 were thought
       to be loaded, so any other weight would be SYNTHESISED by the browser.
       Saira ships a real 100-900 variable axis, so the constraint evaporated and
       the 300 became a free choice nobody had made. Measured before the change:
       300 -> 450 is +30.6% INK MASS with the ADVANCE ESSENTIALLY UNCHANGED
       (+0.4px across "Welcome back"), i.e. it reads as weight, not as width —
       which is why nothing on this page can reflow as a result of it and the
       wordmark's no-wrap derivation is untouched.

       ⚠⚠ THE TWO-LAYER SHAPE IS LOAD-BEARING — DO NOT COLLAPSE IT TO ONE RULE.
       (a) alone loses the card title and every field label; (b) alone loses
       everything nobody thought to enumerate. Both are needed, and the reason is
       specificity, measured rather than guessed:
         .card-header h1 / .field label   are (0,1,1)
         the catch-all below              is (0,1,0)  <- loses to them
       ⚠ AND THIS BLOCK MUST STAY LAST IN THE FILE. The first attempt sat near
       the top; the page's own rules (.card-header h1 600, .field label 600,
       .submit-btn 700, .nav-logo 600) have EQUAL specificity, so source order
       decided it and the overrides did nothing at all. The computed weights came
       back 600/700 — measured, not assumed.

       ⚠ EXHAUSTIVE, NOT ENUMERATED. A hand-listed selector list left three
       elements behind — a nav SPAN, an H2 and .launch-btn, all in states that
       only render after sign-in. Enumerating targets is the INVENTORY failure
       already on file; a universal selector inside the page's own containers
       cannot miss one. */
    body { font-weight: 450; }
    /* (a) the CATCH-ALL — reaches anything nobody thought to list */
    .login-nav, .login-nav *, .login-main, .login-main *,
    .login-footer, .login-footer * { font-weight: 450; }
    /* (b) the EQUAL-SPECIFICITY overrides. ⚠ BOTH ARE NEEDED, and the reason is
       specificity, measured not guessed: `.card-header h1` and `.field label`
       are (0,1,1) and BEAT the (0,1,0) catch-all above, so the universal alone
       left the card title and every field label back on 600. The catch-all
       covers the unenumerated; these cover the ones the page names explicitly. */
    .card-header h1, .card-header p, .field label, .field input,
    .login-nav .nav-logo, .login-nav .back, .submit-btn, .launch-btn,
    #forgotRow a, .login-footer a,
    .login-main h1, .login-main h2, .login-main h3 { font-weight: 450; }
    /* ⚠ THE WORDMARK IS DELIBERATELY NOT RE-DECLARED HERE, and that is not an
       omission. It keeps its 700 from its own rule further up by SPECIFICITY,
       not by source order: `.brand-lockup .brand-name` is (0,2,0) and the
       catch-all above is (0,1,0), so the catch-all cannot reach it whatever the
       order. Restating 700 here would add a SECOND font-weight declaration for
       one selector — the exact shape that hides a last-wins override, and the
       reason a duplicate `background-repeat` was removed from this file on the
       same day. Verified in the browser after the change: the wordmark computes
       700 with no rule here at all.
       ⚠ AND IT MUST NEVER JOIN THE 450 LIST. Its 700 pairs with a MEASURED k
       that keeps it on one line; changing the weight changes k and reintroduces
       the wrap this page has already had three times. */
  </style>
  <script src="/js/scout-auth.js"></script>
  <script>
    /**
     * ⚠ THE MARK'S BOX, MEASURED FROM THE TITLE — see body::before for why this
     * is derived rather than a chosen vmin value.
     *
     *   top    = wordmark bottom + GAP
     *   height = viewport bottom - top - GAP
     *
     * Runs on load and on resize, so the relationship holds at every size
     * instead of only at the one it was checked at. Decoration only: if it
     * throws or never runs, the CSS fallbacks (34vh / 58vh) render a sane mark
     * and the sign-in form is untouched.
     */
    (function () {
      var GAP = 18;              // breathing room at both ends
      var MIN_H = 140;           // below this the mark is not worth drawing
      function placeMark() {
        try {
          /**
           * ⚠ ANCHORED TO THE NAV, NOT THE WORDMARK (Justin, 2026-08-18: raise
           * it to the top of the page). Still derived from a real measured
           * position rather than a chosen offset — the nav's own bottom edge —
           * so the relationship holds at every size exactly as before.
           *
           * ⚠⚠ WHAT "TOP" COSTS: the mark now sits BEHIND THE WORDMARK instead
           * of under it, so the wordmark becomes an exposed element for the
           * first time. It is green-on-green, but LARGE and high-contrast
           * (7.58:1 over a solid stroke at 0.20), so it is not the binding
           * case — the --muted labels still are, at 4.70:1. Opacity therefore
           * stays 0.20. See the findings: whether the mark still crosses any
           * muted text at this position is the one thing not re-measured, and
           * 0.20 is the SAFE direction to be wrong in, since it was derived
           * against the stricter case.
           */
          /**
           * ⚠⚠ THE MARK'S TOP TOUCHES THE TOP OF THE PAGE; ITS BOTTOM DOES NOT
           * MOVE (Justin, 2026-08-18). The viewBox is cropped to the ink, so
           * box top 0 means the FIRST RING'S CROWN touches y=0 — the ink, not
           * an empty margin.
           *
           * ⚠ NO TEXT MOVES. This is not a re-layout: the wordmark, "Welcome
           * back", the subtitle and the form all stay exactly where they were,
           * and the wordmark now sits OVER the artwork rather than above it.
           * Nothing here reads or adjusts a text position — if a future edit
           * needs to nudge a text element to accommodate the mark, that is out
           * of scope by ruling, not an oversight.
           *
           * Bottom is still viewportBottom - GAP, so only the top edge moved and
           * the box simply got taller.
           */
          var top = 0;
          var h = Math.round(window.innerHeight - GAP);
          var root = document.documentElement;
          if (h < MIN_H) { root.style.setProperty('--mark-h', '0px'); return; }
          root.style.setProperty('--mark-top', top + 'px');
          root.style.setProperty('--mark-h', h + 'px');
        } catch (e) { /* decoration only — never a gate */ }
      }
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', placeMark);
      } else { placeMark(); }
      window.addEventListener('resize', placeMark);
      // The webfont swap changes the title's height, so re-place once it lands.
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(placeMark).catch(function () {});
    })();
  </script>
</head>

<script>
  // ── Persistent login state ───────────────────────────────────────────────
  // We store the full session (access + refresh + expiry + email) in
  // localStorage so users stay logged in across browser restarts, not just
  // within a single tab session. On page load we check if a valid session
  // exists and auto-show the "signed in" view if so, refreshing the token
  // if it's within 5 minutes of expiring.

  var STORAGE_KEY = 'scout_session_v1';
  var currentTab = 'login';

  // ── Post-login return path (open-redirect guarded) ────────────────────────
  // /connect sends signed-out users here as /login?return=%2Fdashboard%23connect
  // so that AFTER login they continue to the Zoom Connections surface, not the
  // generic dashboard. safeReturnPath is the CANONICAL copy from
  // backend/lib/safe-return-path.js (kept in sync; static pages can't require()).
  function safeReturnPath(raw, fallback) {
    if (typeof raw !== 'string') return fallback;
    if (raw.length < 2) return fallback;                  // '' or bare '/' — nothing useful to return to
    if (raw.charAt(0) !== '/') return fallback;           // must be an absolute same-origin path
    if (raw.charAt(1) === '/' || raw.charAt(1) === '\\') return fallback; // '//host' or '/\host' -> off-site
    for (var i = 0; i < raw.length; i++) { if (raw.charCodeAt(i) <= 0x20) return fallback; } // control/whitespace
    return raw;
  }
  var RETURN_PATH = safeReturnPath(
    (function () { try { return new URLSearchParams(window.location.search).get('return'); } catch (e) { return null; } })(),
    null
  );

  function getSession() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch (e) { return null; }
  }
  function setSession(s) { localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); }
  function clearSession() { localStorage.removeItem(STORAGE_KEY); }

  // Returns true if access token expires more than 60s from now.
  function isSessionValid(s) {
    if (!s || !s.access_token || !s.expires_at) return false;
    var nowSec = Math.floor(Date.now() / 1000);
    return s.expires_at > nowSec + 60;
  }

  // Returns true if we should preemptively refresh (within 5 min of expiry).
  function shouldRefresh(s) {
    if (!s || !s.expires_at) return false;
    var nowSec = Math.floor(Date.now() / 1000);
    return s.expires_at - nowSec < 300;
  }

  async function refreshSessionIfNeeded() {
    var s = getSession();
    if (!s || !s.refresh_token) return null;
    if (!shouldRefresh(s)) return s;
    try {
      var res = await fetch('/auth/refresh', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ refresh_token: s.refresh_token }),
      });
      if (!res.ok) { clearSession(); return null; }
      var data = await res.json();
      if (!data.session) { clearSession(); return null; }
      var fresh = {
        access_token: data.session.access_token,
        refresh_token: data.session.refresh_token,
        expires_at: data.session.expires_at,
        email: (data.user && data.user.email) || (s && s.email),
      };
      setSession(fresh);
      return fresh;
    } catch (err) {
      // If refresh fails (network or token revoked), force re-login.
      clearSession();
      return null;
    }
  }

  // On page load: if we have a valid session, show the success view.
  // If close to expiring, refresh in the background.
  async function checkExistingSession() {
    var s = getSession();
    if (isSessionValid(s)) {
      if (shouldRefresh(s)) refreshSessionIfNeeded();
      var redirected = await redirectByRole();
      if (!redirected) showSignedInView(s);
      return;
    }
    // Stale but has refresh token — try to refresh silently.
    if (s && s.refresh_token) {
      var refreshed = await refreshSessionIfNeeded();
      if (refreshed) {
        var redirected = await redirectByRole();
        if (!redirected) showSignedInView(refreshed);
        return;
      }
    }
    // No session or refresh failed — show login form.
    if (window.location.hash === '#signup') switchTab('signup');
  }

  function showSignedInView(s) {
    document.getElementById('authForm').style.display = 'none';
    document.getElementById('successView').style.display = 'block';
    document.getElementById('cardTitle').textContent = 'Signed in';
    document.getElementById('cardSub').textContent = '';
    document.getElementById('signedInEmail').textContent = s.email || '';
  }

  // ── UI helpers ───────────────────────────────────────────────────────────
  function switchTab(tab) {
    currentTab = tab;
    document.getElementById('loginTab').className = 'tab' + (tab === 'login' ? ' active' : '');
    document.getElementById('signupTab').className = 'tab' + (tab === 'signup' ? ' active' : '');
    document.getElementById('submitBtn').textContent = tab === 'login' ? 'Log In' : 'Create Account';
    document.getElementById('cardTitle').textContent = tab === 'login' ? 'Welcome back' : 'Create your account';
    document.getElementById('cardSub').textContent = tab === 'login' ? 'Sign in to your Scout dashboard' : 'Free during early access';
    // Forgot-password is a login-only affordance.
    var fr = document.getElementById('forgotRow');
    if (fr) fr.style.display = tab === 'login' ? 'block' : 'none';
    hideError();
  }

  // ── Forgot password (self-service reset) ──────────────────────────────────
  function showForgot() {
    document.getElementById('authForm').style.display = 'none';
    document.getElementById('forgotView').style.display = 'block';
    document.getElementById('cardTitle').textContent = 'Reset your password';
    document.getElementById('cardSub').textContent = "Enter your email and we'll send a reset link.";
    var e = (document.getElementById('email').value || '').trim();
    if (e) document.getElementById('forgotEmail').value = e;
    document.getElementById('forgotError').style.display = 'none';
    document.getElementById('forgotSent').style.display = 'none';
    document.getElementById('forgotEmail').focus();
  }
  function hideForgot() {
    document.getElementById('forgotView').style.display = 'none';
    document.getElementById('authForm').style.display = 'block';
    switchTab('login'); // restores the "Welcome back" title/subtitle
  }
  async function submitForgot() {
    var email = (document.getElementById('forgotEmail').value || '').trim();
    var err = document.getElementById('forgotError');
    err.style.display = 'none';
    if (!email || email.indexOf('@') === -1) { err.textContent = 'Enter a valid email address.'; err.style.display = 'block'; return; }
    var btn = document.getElementById('forgotBtn');
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';
    try {
      var res = await fetch('/auth/forgot-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email }),
      });
      var body = null; try { body = await res.json(); } catch (e) {}
      if (res.status === 429) {
        err.textContent = (body && body.error) || 'Too many requests. Please wait a bit and try again.';
        err.style.display = 'block'; btn.disabled = false; btn.textContent = 'Send reset link'; return;
      }
      if (res.status === 400) {
        err.textContent = (body && body.error) || 'Enter a valid email address.';
        err.style.display = 'block'; btn.disabled = false; btn.textContent = 'Send reset link'; return;
      }
      // Success — reveal the neutral, enumeration-safe confirmation.
      document.getElementById('forgotEmail').disabled = true;
      btn.style.display = 'none';
      var sent = document.getElementById('forgotSent');
      sent.textContent = (body && body.message) || "If an account exists for that email, we've emailed a password reset link. Check your inbox (and spam).";
      sent.style.display = 'block';
    } catch (e2) {
      err.textContent = 'Could not reach the server — please try again.';
      err.style.display = 'block'; btn.disabled = false; btn.textContent = 'Send reset link';
    }
  }

  function showError(msg) {
    var el = document.getElementById('errorMsg');
    el.textContent = msg;
    el.style.display = 'block';
  }

  function hideError() {
    document.getElementById('errorMsg').style.display = 'none';
  }

  // ── Post-login redirect by role ──────────────────────────────────────────
  // Calls /auth/me and navigates to /dashboard (or a validated ?return= path).
  // Returns true if it navigated away; false on any failure so the caller can
  // fall back to the signed-in card (which offers a "Continue to dashboard"
  // button for transient /auth/me errors).
  async function redirectByRole() {
    try {
      var s = getSession();
      var token = s && s.access_token;
      if (!token) return false;
      var res = await fetch('/auth/me', {
        headers: { 'Authorization': 'Bearer ' + token },
      });
      if (!res.ok) {
        console.warn('[login] /auth/me returned', res.status, '- falling back to signed-in card');
        return false;
      }
      // v1.3.1: every role lands on the Coaching Dashboard. Admin/owner reach
      // /admin via the Admin nav link shown on /dashboard — never the default
      // destination. /auth/me is still called above to validate the token
      // (non-ok → signed-in-card fallback).
      // v1.4: managers + owners WITH assigned reps land on the Team view instead.
      // Owner-without-reps and plain users keep the Coaching Dashboard landing.
      var me = null; try { me = await res.json(); } catch (e) {}
      // A validated ?return= path (e.g. from /connect) wins over the role default
      // so the user continues to where they were headed (the Zoom Connections surface).
      var dest = RETURN_PATH || ((me && me.has_reps) ? '/dashboard#team' : '/dashboard');
      window.location.replace(dest);
      return true;
    } catch (err) {
      console.warn('[login] /auth/me network error, falling back:', err.message);
      return false;
    }
  }

  // ── Login / signup submit ────────────────────────────────────────────────
  async function handleSubmit() {
    var email = document.getElementById('email').value.trim();
    var password = document.getElementById('password').value;
    hideError();

    if (!email || !password) {
      showError('Please enter your email and password.');
      return;
    }

    var btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>';

    try {
      var endpoint = currentTab === 'login' ? '/auth/login' : '/auth/signup';
      var res = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email, password: password }),
      });
      var data = await res.json();

      if (!res.ok || data.error) {
        showError(data.error || (currentTab === 'login' ? 'Login failed.' : 'Signup failed.'));
        btn.disabled = false;
        btn.textContent = currentTab === 'login' ? 'Log In' : 'Create Account';
        return;
      }

      // Persist the full session so the user stays logged in.
      setSession({
        access_token: data.access_token || data.token,
        refresh_token: data.refresh_token,
        expires_at: data.expires_at,
        email: (data.user && data.user.email) || email,
      });

      /**
       * ⚠ THE ONLY PLACE A FRESH SIGN-IN IS DISTINGUISHABLE FROM A RESUMED ONE.
       *
       * redirectByRole() is called from THREE places — here after a password
       * POST, and twice inside checkExistingSession() when an existing session
       * is valid or refreshable. All three produce an identical
       * `location.replace('/dashboard')`, so the dashboard receives no signal
       * telling them apart: same URL, same localStorage key, same session shape.
       *
       * The distinction exists ONLY at this call site, so the marker is set
       * here — NOT inside redirectByRole(), which both paths share.
       *
       * sessionStorage rather than a query param: it is per-tab, dies with the
       * tab, cannot be shared or bookmarked into someone else's browser, and
       * keeps the URL clean. The dashboard reads it once and clears it, so a
       * refresh does not replay the sequence.
       */
      try { sessionStorage.setItem('scout_welcome_v1', '1'); } catch (e) { /* private mode — no ceremony, no harm */ }

      // Redirect to the role-appropriate surface. On failure fall back to
      // the signed-in card so the "Open Scout App" deep link stays reachable.
      var redirected = await redirectByRole();
      if (!redirected) showSignedInView(getSession());

    } catch (err) {
      showError('Could not reach server. Check your connection.');
      btn.disabled = false;
      btn.textContent = currentTab === 'login' ? 'Log In' : 'Create Account';
    }
  }

  function signOut() {
    clearSession();
    document.getElementById('successView').style.display = 'none';
    document.getElementById('authForm').style.display = 'block';
    document.getElementById('cardTitle').textContent = 'Welcome back';
    document.getElementById('cardSub').textContent = 'Sign in to your Scout dashboard';
    document.getElementById('email').value = '';
    document.getElementById('password').value = '';
    switchTab('login');
  }

  // Enter key submits when form is visible
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && document.getElementById('authForm').style.display !== 'none') {
      handleSubmit();
    }
  });

  // Kick off session check on page load
  checkExistingSession();

  // Reviewer/user arriving from /connect while signed out: name the next step so
  // the login page reads as "log in first, then connect Zoom" (Zoom's requirement).
  if (RETURN_PATH === '/dashboard#connect') {
    var connSub = document.getElementById('cardSub');
    if (connSub) connSub.textContent = 'Sign in to connect your Zoom account';
  }
</script>
</body>
</html>
