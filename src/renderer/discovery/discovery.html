<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Discovery Tracker</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { background: transparent; width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    .panel {
      width: 100%;
      background: rgba(0,0,0,0.82);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom-left-radius: 10px;
      border-bottom-right-radius: 10px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      border-left: 1px solid rgba(255,255,255,0.06);
      padding: 8px 12px 10px;
    }
    .panel-title {
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 2px;
      color: rgba(255,255,255,0.25);
      text-transform: uppercase;
      margin-bottom: 7px;
      padding-bottom: 5px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .item {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 3px 0;
      transition: opacity 0.3s ease;
    }
    .check {
      width: 14px;
      height: 14px;
      border-radius: 3px;
      border: 1.5px solid rgba(255,255,255,0.15);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      background: transparent;
    }
    .check.done {
      background: #22c55e;
      border-color: #22c55e;
    }
    .check.done::after {
      content: '';
      width: 8px;
      height: 5px;
      border-left: 2px solid #000;
      border-bottom: 2px solid #000;
      transform: rotate(-45deg) translateY(-1px);
      display: block;
    }
    .label {
      font-size: 11px;
      color: rgba(255,255,255,0.35);
      transition: color 0.3s ease;
      white-space: nowrap;
    }
    .item.done .label {
      color: rgba(255,255,255,0.75);
    }
    .details {
      margin: 3px 0 6px 21px;
      padding-left: 8px;
      border-left: 1.5px solid rgba(34,197,94,0.35);
      display: none;
    }
    .details.show {
      display: block;
    }
    .detail-row {
      font-size: 10px;
      line-height: 1.35;
      color: rgba(255,255,255,0.82);
      padding: 1px 0;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <div class="panel" id="panel">
    <div class="panel-title">Discovery</div>
    <div class="item" id="item-finances">
      <div class="check" id="check-finances"></div>
      <span class="label">Finances / Budget</span>
    </div>
    <div class="details" id="details-finances"></div>
    <div class="item" id="item-willingness">
      <div class="check" id="check-willingness"></div>
      <span class="label">Willing to Do the Work</span>
    </div>
    <div class="item" id="item-pain">
      <div class="check" id="check-pain"></div>
      <span class="label">Pain Identified</span>
    </div>
    <div class="item" id="item-goals">
      <div class="check" id="check-goals"></div>
      <span class="label">Goals / Vision</span>
    </div>
    <div class="item" id="item-timeline">
      <div class="check" id="check-timeline"></div>
      <span class="label">Timeline / Urgency</span>
    </div>
    <div class="item" id="item-decisionMaker">
      <div class="check" id="check-decisionMaker"></div>
      <span class="label">Decision Maker Confirmed</span>
    </div>
    <div class="item" id="item-whyNow">
      <div class="check" id="check-whyNow"></div>
      <span class="label">Why Now</span>
    </div>
  </div>
  <script>
    var panel = document.getElementById('panel');
    var ITEMS = ['finances','willingness','pain','goals','timeline','decisionMaker','whyNow'];

    function syncHeight() {
      window.electronAPI.resizeDiscovery(panel.offsetHeight);
    }
    window.addEventListener('load', syncHeight);

    function applyDiscovery(data) {
      for (var i = 0; i < ITEMS.length; i++) {
        var key = ITEMS[i];
        var itemEl = document.getElementById('item-' + key);
        var checkEl = document.getElementById('check-' + key);
        if (!itemEl || !checkEl) continue;
        if (data[key]) {
          itemEl.classList.add('done');
          checkEl.classList.add('done');
        }
      }
      // Render extracted financial details under the Finances row
      renderFinanceDetails(data.financeDetails);
      syncHeight();
    }

    function renderFinanceDetails(details) {
      var box = document.getElementById('details-finances');
      if (!box) return;
      if (!Array.isArray(details) || details.length === 0) {
        box.classList.remove('show');
        box.innerHTML = '';
        return;
      }
      var html = '';
      for (var i = 0; i < details.length; i++) {
        var text = String(details[i]).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        html += '<div class="detail-row">' + text + '</div>';
      }
      box.innerHTML = html;
      box.classList.add('show');
    }

    window.electronAPI.onDiscoveryUpdate(function(data) {
      applyDiscovery(data);
    });

    window.electronAPI.onDiscoveryReset(function() {
      for (var i = 0; i < ITEMS.length; i++) {
        var key = ITEMS[i];
        document.getElementById('item-' + key).classList.remove('done');
        document.getElementById('check-' + key).classList.remove('done');
      }
      renderFinanceDetails([]);
      syncHeight();
    });
  </script>
</body>
</html>
