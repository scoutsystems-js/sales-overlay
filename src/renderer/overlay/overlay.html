<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Overlay</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { background: transparent; width: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, sans-serif; pointer-events: none; }

    .bar {
      width: 100%;
      background: rgba(0, 0, 0, 0.82);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 0 0 10px 10px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    /* ── Top control row (always visible) ── */
    .top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 12px;
      pointer-events: auto;
      -webkit-app-region: no-drag;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: grab;
      -webkit-app-region: drag;
      padding: 2px 4px;
    }
    .brand img {
      width: 20px;
      height: 20px;
      border-radius: 4px;
      display: block;
      pointer-events: none;
    }
    .brand-name {
      font-size: 12px;
      font-weight: 600;
      color: #bbb;
      letter-spacing: 0.3px;
      -webkit-app-region: no-drag;
    }

    .top-controls {
      display: flex;
      align-items: center;
      gap: 5px;
      -webkit-app-region: no-drag;
    }

    /* Appearance only — runtime visibility is managed via inline styles */
    .btn-start, .btn-stop, .btn-quit {
      border: none;
      border-radius: 5px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      pointer-events: auto;
      transition: opacity 0.15s;
      -webkit-app-region: no-drag;
    }
    .btn-start { background: #22c55e; color: #000; padding: 5px 13px; }
    .btn-start:hover { opacity: 0.85; }
    .btn-stop  { background: #ef4444; color: #fff; padding: 5px 13px; }
    .btn-stop:hover  { opacity: 0.85; }
    .btn-quit  { background: rgba(255,255,255,0.08); color: #777; padding: 5px 9px; font-size: 13px; }
    .btn-quit:hover  { background: rgba(255,255,255,0.18); color: #fff; }

    /* ── Prompt area (shown only during active session) ── */
    .prompt-area {
      padding: 0 16px 8px;
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 2px 0 4px;
      border-top: 1px solid rgba(255,255,255,0.05);
    }
    .listening-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #22c55e;
      flex-shrink: 0;
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .status-label {
      font-size: 10px;
      color: #444;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* ── Prompt rows ── */
    .prompt-row {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 6px 0;
      transition: opacity 0.4s ease;
    }
    .prompt-row.delivered { opacity: 0.6; }
    .prompt-row + .prompt-row { border-top: 1px solid rgba(255,255,255,0.05); }

    .stage-badge {
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 3px 8px;
      border-radius: 4px;
      white-space: nowrap;
      margin-top: 2px;
      flex-shrink: 0;
      background: #3b82f6;
      color: #fff;
    }
    .stage-badge.objection  { background: #ef4444; }
    .stage-badge.close      { background: #22c55e; color: #000; }
    .stage-badge.transition { background: #f59e0b; color: #000; }

    .content { flex: 1; min-width: 0; }
    .headline  { font-size: 11px; font-weight: 600; color: #999; margin-bottom: 2px; letter-spacing: 0.3px; }
    .suggestion { font-size: 14px; color: #fff; line-height: 1.45; white-space: pre-wrap; word-wrap: break-word; }
    .prompt-row.delivered .suggestion { color: #aaa; }
    .follow-up { font-size: 11px; color: #555; margin-top: 3px; line-height: 1.3; display: none; }
    .follow-up.visible { display: block; }

    /* ── Call detection banner ── */
    .call-banner {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 14px;
      background: rgba(34, 197, 94, 0.12);
      border-top: 1px solid rgba(34, 197, 94, 0.2);
      pointer-events: auto;
      -webkit-app-region: no-drag;
    }
    .call-banner-text {
      font-size: 12px;
      color: #86efac;
      flex: 1;
    }
    .call-banner-btn {
      background: #22c55e;
      color: #000;
      border: none;
      border-radius: 5px;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 12px;
      cursor: pointer;
    }
    .call-banner-btn:hover { opacity: 0.85; }
    .call-banner-dismiss {
      background: transparent;
      border: none;
      color: #555;
      font-size: 13px;
      cursor: pointer;
      padding: 2px 4px;
      line-height: 1;
    }
    .call-banner-dismiss:hover { color: #fff; }

    /* ── Post-call summary panel ── */
    .summary-panel {
      background: rgba(255, 255, 255, 0.02);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      pointer-events: auto;
      -webkit-app-region: no-drag;
    }
    .summary-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    .summary-title {
      font-size: 11px;
      font-weight: 700;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }
    .summary-dismiss {
      background: rgba(255, 255, 255, 0.06);
      border: none;
      border-radius: 5px;
      color: #aaa;
      font-size: 11px;
      font-weight: 500;
      padding: 4px 10px;
      cursor: pointer;
      font-family: inherit;
    }
    .summary-dismiss:hover { background: rgba(255, 255, 255, 0.12); color: #fff; }
    .summary-content {
      max-height: 280px;
      overflow-y: auto;
      padding: 10px 14px 12px;
      font-size: 12px;
      line-height: 1.5;
      color: #ddd;
    }
    .summary-section { margin-bottom: 10px; }
    .summary-section:last-child { margin-bottom: 0; }
    .summary-section-label {
      font-size: 10px;
      font-weight: 700;
      color: #777;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 3px;
    }
    .summary-section-text {
      font-size: 13px;
      color: #e8e8e8;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
  </style>
</head>
<body>
  <div class="bar" id="bar">

    <div class="top-row">
      <div class="brand">
        <img src="../../assets/icon.png" alt="Scout">
        <span class="brand-name">Scout</span>
      </div>
      <div class="top-controls">
        <button class="btn-start" id="btnStart" style="display:flex">Start</button>
        <button class="btn-stop"  id="btnStop"  style="display:none">Stop</button>
        <button class="btn-quit"  id="btnQuit">✕</button>
      </div>
    </div>

    <!-- Feature 4: call boundary detection banner -->
    <div class="call-banner" id="callBanner" style="display:none">
      <span class="call-banner-text">📞 Call detected — start Scout?</span>
      <button class="call-banner-btn" id="callBannerBtn">Start</button>
      <button class="call-banner-dismiss" id="callBannerDismiss">✕</button>
    </div>

    <!-- Feature 5: post-call summary panel -->
    <div class="summary-panel" id="summaryPanel" style="display:none">
      <div class="summary-header">
        <span class="summary-title">Call Summary</span>
        <button class="summary-dismiss" id="summaryDismiss">Got it</button>
      </div>
      <div class="summary-content" id="summaryContent"></div>
    </div>

    <div class="prompt-area" id="promptArea" style="display:none">
      <div class="status-row">
        <div class="listening-dot"></div>
        <span class="status-label">Listening</span>
      </div>
      <div id="promptStack"></div>
    </div>

  </div>

  <script>
    var bar         = document.getElementById('bar');
    var promptArea  = document.getElementById('promptArea');
    var promptStack = document.getElementById('promptStack');
    var btnStart    = document.getElementById('btnStart');
    var btnStop     = document.getElementById('btnStop');
    var btnQuit     = document.getElementById('btnQuit');
    var MAX_VISIBLE_PROMPTS = 2; // v1.0.8: reduced from 3 to 2 per product direction
    var isSessionActive = false;
    var callBanner        = document.getElementById('callBanner');
    var callBannerBtn     = document.getElementById('callBannerBtn');
    var callBannerDismiss = document.getElementById('callBannerDismiss');
    var summaryPanel      = document.getElementById('summaryPanel');
    var summaryContent    = document.getElementById('summaryContent');
    var summaryDismiss    = document.getElementById('summaryDismiss');

    // ── Button handlers ──
    btnStart.addEventListener('click', function() { window.electronAPI.startSession('generic'); });
    btnStop.addEventListener('click',  function() { window.electronAPI.stopSession(); });
    btnQuit.addEventListener('click',  function() { window.electronAPI.quitApp(); });

    callBannerBtn.addEventListener('click', function() {
      callBanner.style.display = 'none';
      window.electronAPI.startSession('generic');
    });

    callBannerDismiss.addEventListener('click', function() {
      callBanner.style.display = 'none';
    });

    summaryDismiss.addEventListener('click', function() {
      summaryPanel.style.display = 'none';
    });

    // ── Auto-resize window to match bar content height ──
    var resizeObserver = new ResizeObserver(function() {
      window.electronAPI.resizeOverlay(bar.offsetHeight);
    });
    resizeObserver.observe(bar);

    // ── Session state — single function owns all UI transitions ──
    function setSessionState(active) {
      isSessionActive = active;
      btnStart.style.display    = active ? 'none'  : 'flex';
      btnStop.style.display     = active ? 'flex'  : 'none';
      promptArea.style.display  = active ? 'block' : 'none';
      callBanner.style.display  = 'none';
      summaryPanel.style.display = 'none';
      if (!active) promptStack.innerHTML = '';
    }

    // ── Prompt helpers ──
    function getStageClass(stage) {
      if (stage === 'objection_handling') return 'objection';
      if (stage === 'close')             return 'close';
      if (stage === 'transition')        return 'transition';
      return '';
    }

    function getStageLabel(stage) {
      var labels = {
        introduction:       'INTRO',
        set:                'THE SET',
        discovery:          'DISCOVERY',
        transition:         'TRANSITION',
        pitch:              'PITCH',
        close:              'CLOSE',
        objection_handling: 'OBJECTION',
      };
      return labels[stage] || (stage || '').toUpperCase();
    }

    function addPrompt(data) {
      var existing = promptStack.querySelectorAll('.prompt-row');
      for (var i = 0; i < existing.length; i++) {
        existing[i].classList.add('delivered');
      }

      var row      = document.createElement('div');
      row.className = 'prompt-row';

      var badge      = document.createElement('span');
      badge.className = 'stage-badge';
      var stageClass  = getStageClass(data.stage);
      if (stageClass) badge.classList.add(stageClass);
      badge.textContent = getStageLabel(data.stage);

      var content    = document.createElement('div');
      content.className = 'content';

      var headline   = document.createElement('div');
      headline.className = 'headline';
      headline.textContent = data.headline || '';

      var suggestion = document.createElement('div');
      suggestion.className = 'suggestion';
      suggestion.textContent = data.suggestion || '';

      content.appendChild(headline);
      content.appendChild(suggestion);

      if (data.followUp) {
        var followUp = document.createElement('div');
        followUp.className = 'follow-up visible';
        followUp.textContent = data.followUp;
        content.appendChild(followUp);
      }

      row.appendChild(badge);
      row.appendChild(content);
      promptStack.appendChild(row);

      var allRows = promptStack.querySelectorAll('.prompt-row');
      while (allRows.length > MAX_VISIBLE_PROMPTS) {
        promptStack.removeChild(allRows[0]);
        allRows = promptStack.querySelectorAll('.prompt-row');
      }

      // v1.0.7-alpha: t7 — DOM appended. Echo cycle id + delta via logToMain
      // so the timestamp lands in main's stdout and session_logs. No env-var
      // gate here because one log per prompt is negligible; removal in
      // Phase B is grep-and-delete this block.
      if (data && data._cycleId && data._t0 && window.electronAPI && window.electronAPI.logToMain) {
        window.electronAPI.logToMain('[TIMING] cycle=' + data._cycleId + ' stage=t7_dom_appended abs_ms=' + (Date.now() - data._t0));
      }
    }

    // ── IPC event handlers ──
    window.electronAPI.onStatusUpdate(function(data) {
      setSessionState(data.active);
      if (data.active) {
        addPrompt({
          stage:     'introduction',
          headline:  'INTRODUCTION — Open the call',
          suggestion: '"Hey [Name], can you hear me okay? Great to meet you. I\'m [Your Name]. Where are you calling in from today?"',
          followUp:  'Get their name, city, profession, and family in 90 seconds. Each answer becomes a close frame.',
        });
      }
    });

    window.electronAPI.onNewSuggestion(function(data) { addPrompt(data); });

    window.electronAPI.onClearSuggestion(function() { promptStack.innerHTML = ''; });

    window.electronAPI.onCallDetected(function() {
      if (!isSessionActive) {
        callBanner.style.display = 'flex';
      }
    });

    // Feature 5: parse the 5-section labeled summary into a structured DOM
    // and show the panel. Sections arrive as plain text with labels on
    // their own lines (e.g., "STAGE REACHED: Discovery\n\nDISCOVERY...").
    // Parser scans line-by-line, splits at each "LABEL:" line, accumulates
    // body text until the next label. Tolerant of missing/extra sections —
    // unknown labels render the same way; sections without a body show an
    // empty body. Worst case: malformed input renders as one big section.
    var SUMMARY_SECTION_LABELS = [
      'STAGE REACHED',
      'DISCOVERY COMPLETE',
      'WHAT WENT WELL',
      'AREAS TO IMPROVE',
      'NEXT STEP',
    ];
    function parseSummaryToHtml(text) {
      var raw = String(text || '').trim();
      if (!raw) return '<div class="summary-section"><div class="summary-section-text">No summary available.</div></div>';
      var lines = raw.split(/\r?\n/);
      var sections = [];
      var current = null;
      var labelRe = /^([A-Z][A-Z ]+):\s*(.*)$/;
      for (var i = 0; i < lines.length; i++) {
        var line = lines[i];
        var m = line.match(labelRe);
        if (m && SUMMARY_SECTION_LABELS.indexOf(m[1].trim()) !== -1) {
          if (current) sections.push(current);
          current = { label: m[1].trim(), body: m[2] ? m[2].trim() : '' };
        } else if (current) {
          if (line.trim() || current.body) {
            current.body = current.body ? (current.body + '\n' + line) : line;
          }
        } else if (line.trim()) {
          // Body text before any recognized label — wrap it in a labelless
          // section so nothing is silently dropped.
          current = { label: '', body: line };
        }
      }
      if (current) sections.push(current);
      if (sections.length === 0) {
        return '<div class="summary-section"><div class="summary-section-text"></div></div>';
      }
      var parts = [];
      for (var s = 0; s < sections.length; s++) {
        var sec = sections[s];
        var labelHtml = sec.label
          ? '<div class="summary-section-label">' + escapeHtml(sec.label) + '</div>'
          : '';
        parts.push(
          '<div class="summary-section">'
            + labelHtml
            + '<div class="summary-section-text">' + escapeHtml((sec.body || '').trim()) + '</div>'
          + '</div>'
        );
      }
      return parts.join('');
    }
    function escapeHtml(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    window.electronAPI.onPostCallSummary(function(data) {
      var summary = data && data.summary ? data.summary : '';
      summaryContent.innerHTML = parseSummaryToHtml(summary);
      summaryPanel.style.display = 'block';
    });
  </script>
</body>
</html>
