<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Overlay</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { background: transparent; width: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, sans-serif; pointer-events: none; }

    .bar {
      width: 100%;
      background: rgba(0, 0, 0, 0.82);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 0 0 10px 10px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    /* ── Top control row (always visible) ── */
    .top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 12px;
      pointer-events: auto;
      -webkit-app-region: no-drag;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: grab;
      -webkit-app-region: drag;
      padding: 2px 4px;
    }
    .brand img {
      width: 20px;
      height: 20px;
      border-radius: 4px;
      display: block;
      pointer-events: none;
    }
    .brand-name {
      font-size: 12px;
      font-weight: 600;
      color: #bbb;
      letter-spacing: 0.3px;
      -webkit-app-region: no-drag;
    }

    .top-controls {
      display: flex;
      align-items: center;
      gap: 5px;
      -webkit-app-region: no-drag;
    }

    /* Appearance only — runtime visibility is managed via inline styles */
    .btn-start, .btn-stop, .btn-quit {
      border: none;
      border-radius: 5px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      pointer-events: auto;
      transition: opacity 0.15s;
      -webkit-app-region: no-drag;
    }
    .btn-start { background: #22c55e; color: #000; padding: 5px 13px; }
    .btn-start:hover { opacity: 0.85; }
    .btn-stop  { background: #ef4444; color: #fff; padding: 5px 13px; }
    .btn-stop:hover  { opacity: 0.85; }
    .btn-quit  { background: rgba(255,255,255,0.08); color: #777; padding: 5px 9px; font-size: 13px; }
    .btn-quit:hover  { background: rgba(255,255,255,0.18); color: #fff; }

    /* ── Prompt area (shown only during active session) ── */
    .prompt-area {
      padding: 0 16px 8px;
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 2px 0 4px;
      border-top: 1px solid rgba(255,255,255,0.05);
    }
    .listening-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #22c55e;
      flex-shrink: 0;
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .status-label {
      font-size: 10px;
      color: #444;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* ── Prompt rows ── */
    .prompt-row {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 6px 0;
      transition: opacity 0.4s ease;
    }
    .prompt-row.delivered { opacity: 0.6; }
    .prompt-row + .prompt-row { border-top: 1px solid rgba(255,255,255,0.05); }

    .stage-badge {
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 3px 8px;
      border-radius: 4px;
      white-space: nowrap;
      margin-top: 2px;
      flex-shrink: 0;
      background: #3b82f6;
      color: #fff;
    }
    .stage-badge.objection  { background: #ef4444; }
    .stage-badge.close      { background: #22c55e; color: #000; }
    .stage-badge.transition { background: #f59e0b; color: #000; }

    .content { flex: 1; min-width: 0; }
    .headline  { font-size: 11px; font-weight: 600; color: #999; margin-bottom: 2px; letter-spacing: 0.3px; }
    .suggestion { font-size: 14px; color: #fff; line-height: 1.45; white-space: pre-wrap; word-wrap: break-word; }
    .prompt-row.delivered .suggestion { color: #aaa; }
    .follow-up { font-size: 11px; color: #555; margin-top: 3px; line-height: 1.3; display: none; }
    .follow-up.visible { display: block; }
  </style>
</head>
<body>
  <div class="bar" id="bar">

    <div class="top-row">
      <div class="brand">
        <img src="../../../build/icon.png" alt="Scout">
        <span class="brand-name">Scout</span>
      </div>
      <div class="top-controls">
        <button class="btn-start" id="btnStart" style="display:flex">Start</button>
        <button class="btn-stop"  id="btnStop"  style="display:none">Stop</button>
        <button class="btn-quit"  id="btnQuit">✕</button>
      </div>
    </div>

    <div class="prompt-area" id="promptArea" style="display:none">
      <div class="status-row">
        <div class="listening-dot"></div>
        <span class="status-label">Listening</span>
      </div>
      <div id="promptStack"></div>
    </div>

  </div>

  <script>
    var bar         = document.getElementById('bar');
    var promptArea  = document.getElementById('promptArea');
    var promptStack = document.getElementById('promptStack');
    var btnStart    = document.getElementById('btnStart');
    var btnStop     = document.getElementById('btnStop');
    var btnQuit     = document.getElementById('btnQuit');
    var MAX_VISIBLE_PROMPTS = 3;

    // ── Button handlers ──
    btnStart.addEventListener('click', function() { window.electronAPI.startSession('generic'); });
    btnStop.addEventListener('click',  function() { window.electronAPI.stopSession(); });
    btnQuit.addEventListener('click',  function() { window.electronAPI.quitApp(); });

    // ── Auto-resize window to match bar content height ──
    var resizeObserver = new ResizeObserver(function() {
      window.electronAPI.resizeOverlay(bar.offsetHeight);
    });
    resizeObserver.observe(bar);

    // ── Session state — single function owns all UI transitions ──
    function setSessionState(active) {
      btnStart.style.display    = active ? 'none'  : 'flex';
      btnStop.style.display     = active ? 'flex'  : 'none';
      promptArea.style.display  = active ? 'block' : 'none';
      if (!active) promptStack.innerHTML = '';
    }

    // ── Prompt helpers ──
    function getStageClass(stage) {
      if (stage === 'objection_handling') return 'objection';
      if (stage === 'close')             return 'close';
      if (stage === 'transition')        return 'transition';
      return '';
    }

    function getStageLabel(stage) {
      var labels = {
        introduction:       'INTRO',
        set:                'THE SET',
        discovery:          'DISCOVERY',
        transition:         'TRANSITION',
        pitch:              'PITCH',
        close:              'CLOSE',
        objection_handling: 'OBJECTION',
      };
      return labels[stage] || (stage || '').toUpperCase();
    }

    function addPrompt(data) {
      var existing = promptStack.querySelectorAll('.prompt-row');
      for (var i = 0; i < existing.length; i++) {
        existing[i].classList.add('delivered');
      }

      var row      = document.createElement('div');
      row.className = 'prompt-row';

      var badge      = document.createElement('span');
      badge.className = 'stage-badge';
      var stageClass  = getStageClass(data.stage);
      if (stageClass) badge.classList.add(stageClass);
      badge.textContent = getStageLabel(data.stage);

      var content    = document.createElement('div');
      content.className = 'content';

      var headline   = document.createElement('div');
      headline.className = 'headline';
      headline.textContent = data.headline || '';

      var suggestion = document.createElement('div');
      suggestion.className = 'suggestion';
      suggestion.textContent = data.suggestion || '';

      content.appendChild(headline);
      content.appendChild(suggestion);

      if (data.followUp) {
        var followUp = document.createElement('div');
        followUp.className = 'follow-up visible';
        followUp.textContent = data.followUp;
        content.appendChild(followUp);
      }

      row.appendChild(badge);
      row.appendChild(content);
      promptStack.appendChild(row);

      var allRows = promptStack.querySelectorAll('.prompt-row');
      while (allRows.length > MAX_VISIBLE_PROMPTS) {
        promptStack.removeChild(allRows[0]);
        allRows = promptStack.querySelectorAll('.prompt-row');
      }
    }

    // ── IPC event handlers ──
    window.electronAPI.onStatusUpdate(function(data) {
      setSessionState(data.active);
      if (data.active) {
        addPrompt({
          stage:     'introduction',
          headline:  'INTRODUCTION — Open the call',
          suggestion: '"Hey [Name], can you hear me okay? Great to meet you. I\'m [Your Name]. Where are you calling in from today?"',
          followUp:  'Get their name, city, profession, and family in 90 seconds. Each answer becomes a close frame.',
        });
      }
    });

    window.electronAPI.onNewSuggestion(function(data) { addPrompt(data); });

    window.electronAPI.onClearSuggestion(function() { promptStack.innerHTML = ''; });
  </script>
</body>
</html>
